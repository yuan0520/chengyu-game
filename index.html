種好處，意思有點接近。不過我說的是「做一半的事，功效加倍」，是另一個成語。"}],"hint":"「事」是花的力氣，「功」是得到的成果。","after":"公孫丑終於懂了：時機對了，再加上好方法，就能用少少的力氣做出大大的成果。","lesson":{"title":"成語小學堂．事半功倍","text":"它的反義詞是「事倍功半」：花了加倍力氣，成果卻只有一半。讀書時先弄懂重點再寫題目，常常能讓學習更有效率喔！","next":"公孫丑又問：伯夷、伊尹這些古代聖人，和孔子一樣偉大嗎？"}},{"id":"e52_05","yr":"《孟子．公孫丑上》","place":"孟子的學堂","scene":"house","music":"palace","cast":[["孟子",0.4,-0.8],["公孫丑",-1.2,0.6],["萬章",2.0,0.8]],"beats":[{"who":"公孫丑","t":"伯夷、伊尹和孔子，都一樣偉大嗎？"},{"who":"孟子","t":"不一樣！自從有人類以來，沒有人比得上孔子！","fx":[["focus","孟子"]]},{"t":"孟子說起孔子的學生有若講過的一段話。"},{"who":"孟子","t":"有若說：麒麟和走獸、鳳凰和飛鳥都是同類，可是牠們特別出色。"},{"who":"孟子","t":"泰山和小土堆都是山，大河大海和路邊小水坑都是水，也都是同類。"},{"who":"孟子","t":"聖人和百姓也是同類，孔子卻超出同類、高出同群！","fx":[["cheer","公孫丑"]]}],"q":"有若說孔子「超出同類、高出同群」，是人群中最傑出的人。後來形容才能品德特別優秀，用哪個成語？","wrong":[{"w":"平淡無奇","by":"公孫丑","line":"平淡無奇是普普通通，沒什麼特別。孔子可是最傑出的耶！"},{"w":"畫龍點睛","by":"萬章","line":"畫龍點睛是在關鍵的地方加一筆，讓作品更生動，跟稱讚人優秀不一樣喔！"},{"w":"鶴立雞群","by":"孟子","line":"鶴立雞群是像鶴站在雞群裡一樣突出，意思很接近！不過有若用的是另一句話。"}],"hint":"「萃」是聚在一起的一群，「拔」是高出。","after":"孟子說：「我最大的心願，就是向孔子學習。」","lesson":{"title":"成語小學堂．出類拔萃","text":"原句是「出於其類，拔乎其萃」。「丘垤」是小土堆，「行潦」是路上的小水坑。現在這個成語用來稱讚特別優秀的人或作品，例如：她的畫出類拔萃。","next":"孟子除了尊敬孔子，也說過人生中最難的選擇。他用魚和熊掌來比喻……"}},{"id":"e52_06","yr":"《孟子．告子上》","place":"孟子的學堂","scene":"house","music":"final","cast":[["孟子",0.4,-0.8],["學生",-1.2,0.6],["學生",2.0,0.8]],"beats":[{"t":"孟子在學堂裡，問了學生們一個問題。"},{"who":"孟子","t":"魚，是我想要的；熊掌，也是我想要的。","fx":[["focus","孟子"]]},{"who":"學生","t":"兩樣都好想要喔！","fx":[["cheer","學生"]]},{"who":"孟子","t":"如果只能選一樣，我會放下魚，選比較珍貴的熊掌。"},{"who":"孟子","t":"生命，是我想要的；正義，也是我想要的。如果只能選一樣……","fx":[["focus","孟子"]]},{"who":"孟子","t":"我會放下生命，選擇正義！因為有些東西，比生命更重要。","fx":[["focus",null]]}],"q":"孟子說：生命和正義只能選一樣時，寧可放下生命，也要選擇正義。這是哪個成語？","wrong":[{"w":"貪生怕死","by":"學生","line":"貪生怕死是只想活命、什麼都怕，剛好相反！"},{"w":"見利忘義","by":"學生#2","line":"見利忘義是看到好處就忘了道義。孟子說的是為了道義，什麼都可以放下！"},{"w":"殺身成仁","by":"孟子","line":"殺身成仁是孔子說的，為了仁德犧牲生命，意思很接近！不過我說的是放下生命、選擇正義，是另一個成語。"}],"hint":"「捨」是放下，「取」是選擇。","after":"孟子還說：這種比生命更看重正義的心，人人都有，只是賢人沒有把它弄丟而已。","lesson":{"title":"成語小學堂．捨生取義","text":"熊掌是古人眼中很珍貴的菜，不過現在熊是保育動物，不能吃喔！這個成語形容把正義看得比生命更重要，常用來稱讚歷史上的英雄，像南宋的文天祥。","next":"孟子堅持正義，也很會指出別人的錯。有一天，一個叫白圭的人跑來炫耀……"}},{"id":"e52_07","yr":"《孟子．告子下》","place":"大河邊","scene":"river","music":"map","cast":[["白圭",6.8,0.4],["孟子",-0.8,0.6],["鄰國農夫",7.2,-1.0,0,null,1]],"beats":[{"t":"白圭是戰國時有名的理財高手，也很會治水。他得意地來找孟子。","mv":[["白圭",1.4,0.2]]},{"who":"白圭","t":"我治水的本事，比大禹還厲害！","fx":[["cheer","白圭"]]},{"who":"孟子","t":"大禹治水，是順著水的路，把水引到四海，把大海當作排水的大溝。","fx":[["focus","孟子"]]},{"t":"白圭卻是築起堤防，把自己國家的大水，趕到隔壁的國家去。","fx":[["focus",null]]},{"who":"鄰國農夫","t":"不好了！大水淹過來了！","mv":[["鄰國農夫",3.0,-0.8]],"fx":[["upset","鄰國農夫"]]},{"who":"孟子","t":"水倒著流就成了洪水，是仁慈的人最討厭的。你錯了！","fx":[["sad","白圭"]]}],"q":"白圭把鄰國當作排洪水的大溝，把自己的災禍推給別人。這種做法可以用哪個成語？","wrong":[{"w":"敦親睦鄰","by":"鄰國農夫","line":"敦親睦鄰是和鄰居好好相處。把水趕到我們這裡，哪裡友好了？"},{"w":"飲水思源","by":"白圭","line":"飲水思源是喝水時想到水從哪裡來，要懂得感恩。我……我只想著把水送走。"},{"w":"嫁禍於人","by":"孟子","line":"嫁禍於人是把禍害推給別人，意思很接近！不過我說的是把鄰國當作水溝，是另一個成語。"}],"hint":"「壑」念ㄏㄨㄛˋ，是深溝、山谷。","after":"白圭被說得啞口無言，再也不敢吹牛了。","lesson":{"title":"成語小學堂．以鄰為壑","text":"「洚水」就是洪水。現在這個成語用來比喻只顧自己、把麻煩推給別人，例如把垃圾丟到別人家門口。真正會解決問題的人，不會讓別人替自己受害。","next":"最後一站，孟子要用山中小路來比喻，提醒一位學到一半就停下來的學生……"}},{"id":"e52_08","yr":"《孟子．盡心下》","place":"山中小路","scene":"south","music":"map","cast":[["孟子",0.6,-0.4],["高子",-0.8,0.6],["樵夫",7.0,-0.8]],"beats":[{"t":"高子跟著孟子學習，學到一半就停下來，跑去學別的東西了。"},{"who":"孟子","t":"高子，我說個比喻給你聽。","fx":[["focus","孟子"]]},{"t":"山裡的小路，只要常常有人走，走著走著，就成了一條路。","mv":[["樵夫",-7.5,-0.8]],"fx":[["focus",null]]},{"who":"孟子","t":"可是只要一段時間沒人走，茅草就長出來，把路堵住了。"},{"who":"孟子","t":"現在，茅草也把你的心堵住了！","fx":[["upset","高子"]]},{"who":"高子","t":"啊！原來是這樣！","fx":[["cheer","高子"]]}],"q":"高子聽了比喻，一下子想通了，好像堵住心的茅草忽然被打開。形容一下子明白了道理，用哪個成語？","wrong":[{"w":"草木皆兵","by":"高子","line":"草木皆兵是害怕得把草木都看成敵人。我不是害怕，是心被茅草堵住啦！"},{"w":"一竅不通","by":"樵夫","line":"一竅不通是什麼都不懂，剛好相反！他已經想通了。"},{"w":"恍然大悟","by":"孟子","line":"恍然大悟是忽然明白，意思很接近！不過我比喻的是被茅草堵住的路，是另一個成語。"}],"hint":"「塞」是堵住，「頓」是忽然。","after":"高子明白了：學習就像走山路，要天天走，路才不會被堵住。","lesson":{"title":"成語小學堂．茅塞頓開","text":"原文「茅塞子之心矣」是說高子的心被堵住，本來是批評他。後人加上「頓開」，意思變成忽然開竅、想通了。學習要持續，路才會越走越寬。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十五島．孟子的大道理","eps":[52]},{"key":"i53","name":"禮記的做人道理","short":"禮記的世界","era":"《禮記》","color":"#5E8C5A","map":{"ground":"#a9c47c","river":"#4f9fd8"},"intro":{"lines":["《禮記》是儒家的重要經典，記錄古代的禮儀，也講了很多做人、做事、學習的道理。","書裡的文章，大多是孔子的學生和後來的儒者寫的，到了漢朝，由戴聖整理成四十九篇。","其中的〈大學〉和〈中庸〉兩篇，後來和《論語》、《孟子》合稱「四書」。","這座島上，有餓肚子也不肯低頭的人、關起門讀書的書生，還有每天在洗臉盆上提醒自己的君王……"],"people":[["孔子","儒家的老祖師，〈中庸〉記著他說的話"],["曾子","孔子的學生，很重視修養自己"],["子游","孔子的學生，用禮樂治理武城"],["商湯","商朝的開國君王，在洗臉盆上刻字"]]},"stops":[{"id":"e53_01","yr":"《禮記．檀弓下》","place":"齊國的路邊","scene":"road","music":"night","cast":[["黔敖",1.4,-0.4],["餓漢",-7,0.6],["饑民",2.8,0.8],["饑民",3.6,-0.8]],"beats":[{"t":"齊國發生了大饑荒，田裡收不到糧食，好多人餓著肚子。","fx":[["sadAll","饑民"]]},{"t":"有錢人黔敖在路邊煮了食物，等著送給經過的餓肚子的人吃。","fx":[["focus","黔敖"]]},{"who":"黔敖","t":"來來來，這裡有吃的！","fx":[["say","黔敖"]]},{"t":"一個餓漢用袖子遮著臉，拖著破鞋子，搖搖晃晃地走過來。","mv":[["餓漢",-0.4,0.4]]},{"t":"黔敖左手端著飯，右手拿著湯，對他大聲吆喝。","fx":[["focus",null]]},{"who":"黔敖","t":"喂！來吃吧！","fx":[["say","黔敖"]]},{"t":"餓漢抬起頭，瞪大眼睛看著黔敖。","fx":[["upset","餓漢"],["focus","餓漢"]]}],"q":"餓漢說：「我就是不肯吃這種被人吆喝著給的食物，才餓成這個樣子！」這種帶著輕視、不尊重人的施捨，叫做什麼？","wrong":[{"w":"雪中送炭","by":"黔敖","line":"雪中送炭是在別人最需要時幫忙。我本來是想幫忙啦……可是我吆喝的口氣太沒禮貌了！"},{"w":"飢不擇食","by":"餓漢","line":"飢不擇食是餓到什麼都肯吃。我可是寧願餓著，也不吃沒禮貌的施捨！"},{"w":"頤指氣使","by":"饑民","line":"頤指氣使是用下巴、臉色指使別人，也很沒禮貌，有點接近！不過這裡說的是那份「吆喝著給的食物」，有專門的成語。"}],"hint":"「嗟」是吆喝的聲音，最後一個字是「食物」的食。","after":"黔敖趕緊追上去向他道歉，可是餓漢還是不肯吃。","lesson":{"title":"成語小學堂．嗟來之食","text":"現在常說「不食嗟來之食」，稱讚人有骨氣，不接受沒禮貌的施捨。孔子的學生曾子聽了這件事卻說：對方吆喝時可以拒絕，但對方道歉了，就可以吃了。有骨氣，也要懂得變通喔！","next":"有骨氣很重要，會說話也很重要。來看看晉國的大夫，怎麼祝賀別人的新房子……"}},{"id":"e53_02","yr":"《禮記．檀弓下》","place":"晉國趙武的新家","scene":"palace","music":"palace","cast":[["趙武",0.6,-0.6],["張老",-7,1.0],["大夫",7,0.8],["大夫",7.6,-0.4]],"beats":[{"t":"晉國的趙武蓋好了一座新房子，晉國的大夫們都帶著禮物來祝賀。","mv":[["大夫",2.2,0.6],["大夫#2",3.2,-0.4]]},{"who":"趙武","t":"歡迎歡迎！各位請進！","fx":[["cheer","趙武"]]},{"t":"大夫張老也來了。他抬頭看著又高又大、色彩鮮亮的房子。","mv":[["張老",-0.9,0.6]],"fx":[["focus","張老"]]},{"who":"張老","t":"多麼高大啊！多麼鮮亮啊！","fx":[["say","張老"]]},{"who":"張老","t":"願您在這裡祭祀唱歌，在這裡辦喪事，也在這裡和族人團聚，一直平平安安地住下去。"},{"t":"趙武聽懂了話裡的提醒，恭敬地向北拜了兩拜。","fx":[["focus","趙武"]]},{"who":"趙武","t":"我也希望能在這裡平安到老，將來安心地去見祖先。","fx":[["say","趙武"]]}],"q":"張老稱讚趙武的房子「又高大、又鮮亮」，後來變成一個成語，形容建築或布置高大華麗。是哪一個？","wrong":[{"w":"家徒四壁","by":"大夫","line":"家徒四壁是家裡窮得只剩四面牆。趙大人的新房子可氣派得很！"},{"w":"斷垣殘壁","by":"趙武","line":"斷垣殘壁是倒塌破爛的牆。我才剛蓋好新房子耶，別嚇我！"},{"w":"富麗堂皇","by":"張老","line":"富麗堂皇也是形容建築華麗，意思很接近！不過我說的是「輪」和「奐」，典故是另一個成語。"}],"hint":"「輪」是高大，「奐」是鮮明眾多。注意是車輪的輪喔！","after":"大家都說：張老很會說話，趙武也很會聽話。","lesson":{"title":"成語小學堂．美輪美奐","text":"現在常用這個成語稱讚新蓋的建築，或布置得很漂亮的地方。要記得是「車輪」的「輪」，不要寫成「倫」！張老祝福時提到「在這裡辦喪事」，其實是暗暗提醒趙武：房子再漂亮，也要平安、不要太奢華。","next":"《禮記》不只講禮貌，也講怎麼學習。〈學記〉這一篇，說的就是學習成功和失敗的原因……"}},{"id":"e53_03","yr":"《禮記．學記》","place":"書生的書房","scene":"study","music":"night","cast":[["書生",-1.4,-1.5],["朋友",7,0.6],["朋友",7.6,-0.6]],"beats":[{"t":"這句話出自《禮記．學記》。〈學記〉說：學習有成功的方法，也有失敗的原因。我們來看一個書生的例子。"},{"t":"有位書生每天關起門來自己讀書，從來不和朋友討論。","fx":[["focus","書生"]]},{"who":"書生","t":"我自己讀就夠了，不必問別人！","fx":[["say","書生"]]},{"t":"有一天，朋友們來找他。","mv":[["朋友",0.8,0.2],["朋友#2",2.0,-0.6]],"fx":[["focus",null]]},{"who":"朋友","t":"我們剛討論出這句話的新解釋，一起來聊聊吧！","fx":[["cheer","朋友"]]},{"who":"書生","t":"什麼？這句話還有別的解釋？我從來沒聽過……","fx":[["upset","書生"]]},{"t":"朋友們聊著新學到的道理，書生一句話也插不上。","fx":[["sad","書生"]]}],"q":"〈學記〉說：「一個人獨自學習，沒有朋友一起討論，就會學識淺薄、見聞很少。」這種情形是哪個成語？","wrong":[{"w":"博學多聞","by":"朋友","line":"博學多聞是學問廣、聽過的事情多，剛好相反喔！"},{"w":"聞雞起舞","by":"朋友#2","line":"聞雞起舞是聽到雞叫就起床練功，很勤勞。可是他的問題是不跟朋友討論呀！"},{"w":"井底之蛙","by":"書生","line":"井底之蛙也是比喻見識少，意思很接近！不過〈學記〉說的是「獨學而無友」，有專門的成語。"}],"hint":"「孤」是孤單，「陋」是淺薄，「寡」是少。","after":"書生打開房門，開始和朋友們一起讀書、討論，懂得越來越多了。","lesson":{"title":"成語小學堂．孤陋寡聞","text":"原文是「獨學而無友，則孤陋而寡聞」。現在常用這個成語說見識太少，也常用來表示謙虛，例如「是我孤陋寡聞了」。〈學記〉是很早談教育的文章，講了很多學習和教書的方法。","next":"〈學記〉還說：不只學生要學，老師在教的時候，自己也會進步喔……"}},{"id":"e53_04","yr":"《禮記．學記》","place":"古代的學堂","scene":"office","music":"map","cast":[["老師",0.4,-0.8],["學生",-1.2,0.6],["學生",1.9,0.8]],"beats":[{"t":"這句話出自《禮記．學記》：「再好吃的菜，不吃就不知道多美味；再好的道理，不學就不知道它有多好。」"},{"t":"學生們跟著老師學了新的道理。","fx":[["focus","學生"]]},{"who":"學生","t":"原來是這樣！可是我發現，自己還有好多不懂的地方……","fx":[["say","學生"]]},{"who":"學生#2","t":"老師，為什麼會這樣呢？","mv":[["學生#2",1.3,0.2]]},{"who":"老師","t":"嗯……這一點，老師也說不太清楚。","fx":[["upset","老師"],["focus","老師"]]},{"t":"老師回家查書，想了一整晚。第二天一早，他開心地走進學堂。","fx":[["focus",null]]},{"who":"老師","t":"我查清楚了！謝謝你的問題，讓老師也學到新東西。我們一起來討論吧！","fx":[["cheer","老師"]]}],"q":"〈學記〉說：學了才知道自己不足，教了才知道自己哪裡卡住。老師和學生都因此更努力。教和學互相幫助、一起進步，是哪個成語？","wrong":[{"w":"誤人子弟","by":"學生","line":"誤人子弟是老師沒教好，耽誤了學生。我們老師可是認真查資料呢！"},{"w":"好為人師","by":"學生#2","line":"好為人師是喜歡當別人的老師、愛教訓人，跟互相進步不一樣喔！"},{"w":"不恥下問","by":"老師","line":"不恥下問是不怕向地位比自己低的人請教，有點接近！但這裡說的是教和學「互相」幫助，師生一起進步。"}],"hint":"「相」是互相，「長」是增長、進步。","after":"從此，學生勇敢發問，老師認真回答，大家都越來越厲害。","lesson":{"title":"成語小學堂．教學相長","text":"原文是「學然後知不足，教然後知困」，所以說「教學相長」。你教同學功課的時候，是不是也會發現自己哪裡不熟？這就是教學相長！","next":"學習能讓人進步，音樂和禮儀還能改變一整個地方。孔子的學生子游，就在一座小城這麼做……"}},{"id":"e53_05","yr":"《禮記．樂記》","place":"魯國的武城","scene":"palace","music":"palace","cast":[["孔子",-7,0.6],["學生",-7.6,1.6],["子游",1.2,-0.2],["百姓",2.8,-1.4],["百姓",3.6,0.4]],"beats":[{"t":"這個故事記在《論語．陽貨》。孔子的學生子游，在魯國的小城武城當官。","fx":[["focus","子游"]]},{"t":"有一天，孔子帶著學生來到武城。","mv":[["孔子",-0.8,0.6],["學生",-1.4,1.5]],"fx":[["focus",null]]},{"t":"一進城，到處都聽得到彈琴、唱歌的聲音。","fx":[["cheerAll","百姓"]]},{"t":"孔子微微一笑，開玩笑地說：","fx":[["focus","孔子"]]},{"who":"孔子","t":"殺雞，何必用到宰牛的大刀呢？","fx":[["say","孔子"]]},{"who":"子游","t":"老師教過我們：君子學了禮樂，就懂得愛人；百姓學了禮樂，就容易和睦相處。小地方也要用禮樂來教化！","fx":[["say","子游"]]},{"who":"孔子","t":"各位，子游說得對！我剛才是開玩笑的。","fx":[["cheer","子游"]]}],"q":"《禮記．樂記》說，好的音樂能讓人心和順，改變社會的風氣、轉換舊的習俗，讓天下安寧。子游在武城做的事，就是哪個成語？","wrong":[{"w":"對牛彈琴","by":"學生","line":"對牛彈琴是對聽不懂的人講道理，白費力氣。武城的百姓可是聽得懂、還會唱呢！"},{"w":"入境隨俗","by":"子游","line":"入境隨俗是到了一個地方，就跟著當地的習俗。我可是要改變舊習俗啊！"},{"w":"潛移默化","by":"孔子","line":"潛移默化是在不知不覺中受到影響，意思很接近！但〈樂記〉說的是改變整個社會的風氣和習俗，有專門的成語。"}],"hint":"「移」和「易」都是改變的意思。","after":"孔子很高興，他的學生真的把禮樂用在照顧百姓上。","lesson":{"title":"成語小學堂．移風易俗","text":"故事出自《論語》，成語出自《禮記．樂記》。〈樂記〉是專門談音樂的文章，古人認為好音樂能讓社會和諧。現在這個成語用來說改變社會風氣，例如大家養成排隊、垃圾分類的好習慣。","next":"改變風氣不是一天就做得到，要一直堅持下去。孔子在〈中庸〉裡，就說到了走路走一半的人……"}},{"id":"e53_06","yr":"《禮記．中庸》","place":"孔子講學的路上","scene":"road","music":"map","cast":[["孔子",1.2,-0.6],["學生",0.2,1.0],["學生",2.6,0.9],["旅人",-7,-1.4]],"beats":[{"t":"這段話出自《禮記．中庸》，記的是孔子對學生說的話。","fx":[["focus","孔子"]]},{"who":"孔子","t":"有些人專門做奇奇怪怪的事，想讓後人記住他。那種事，我不做。","fx":[["say","孔子"]]},{"who":"孔子","t":"君子照著正道往前走，就像走在一條通往目標的路上。"},{"t":"路上有個旅人，正朝著遠方的目的地出發。","mv":[["旅人",-1.0,-1.6]],"fx":[["focus","旅人"]]},{"t":"可是才走到一半，他就一屁股坐在路邊。","fx":[["sad","旅人"]]},{"who":"旅人","t":"好累喔，不走了……"},{"who":"孔子","t":"要我像這樣在半路停下來，我可做不到！","fx":[["say","孔子"],["focus",null]]}],"q":"孔子說，有人照著正道走，卻走到一半就停下來放棄了。比喻做事沒完成就放棄，是哪個成語？","wrong":[{"w":"一路順風","by":"旅人","line":"一路順風是祝人旅途平安。我是走一半就不走了啊……"},{"w":"勇往直前","by":"學生","line":"勇往直前是勇敢地一直往前走，跟這個旅人剛好相反！"},{"w":"虎頭蛇尾","by":"孔子","line":"虎頭蛇尾是開始很有氣勢、後來越來越鬆懈，很接近！但這裡說的是走到一半就「停下來不做了」。"}],"hint":"「途」是道路，「廢」是停止、放棄。","after":"學生們點點頭：走正道，就要一直走到底。","lesson":{"title":"成語小學堂．半途而廢","text":"原文寫作「半塗而廢」，古時候「塗」和「途」相通，都是道路的意思。現在常用來提醒人做事要有始有終，例如學才藝不要學到一半就放棄。","next":"要把事情做完，還得專心。〈大學〉裡就說到，心不在這裡，會發生什麼好笑的事……"}},{"id":"e53_07","yr":"《禮記．大學》","place":"小書生的書房","scene":"study","music":"map","cast":[["小書生",-1.4,-1.5],["母親",7,0.4]],"beats":[{"t":"這句話出自《禮記．大學》。小書生坐在書桌前，眼睛看著書，心裡卻想著去放風箏。","fx":[["focus","小書生"]]},{"t":"母親走進書房叫他。","mv":[["母親",1.0,0.0]],"fx":[["focus",null]]},{"who":"母親","t":"小書生！小書生！該吃飯囉！","fx":[["say","母親"]]},{"t":"小書生一動也不動，好像什麼都沒聽見。母親在他面前揮揮手，他也好像沒看見。"},{"t":"母親把一盤菜放在桌上，他隨手夾起來就吃。","fx":[["focus","小書生"]]},{"who":"母親","t":"那是辣椒耶！","fx":[["upset","母親"]]},{"who":"小書生","t":"嗯……什麼？","fx":[["say","小書生"]]}],"q":"〈大學〉說：「心思不在這裡，就會看了像沒看見，聽了像沒聽見，吃東西也不知道味道。」形容不專心，是哪個成語？","wrong":[{"w":"專心致志","by":"母親","line":"專心致志是一心一意、非常專心。你剛好相反啦！"},{"w":"心花怒放","by":"小書生","line":"心花怒放是高興得不得了。我只是想風箏想到發呆……"},{"w":"魂不守舍","by":"母親","line":"魂不守舍是心神不定、精神恍惚，意思很接近！不過〈大學〉原文用的是另一個說法。"}],"hint":"「焉」在這裡是「在這裡」的意思。","after":"小書生回過神來，把風箏的事先放一邊，專心把書讀完。","lesson":{"title":"成語小學堂．心不在焉","text":"〈大學〉說，修養自己要先讓心端正、專注。現在常用這個成語形容上課、做事時不專心。讀書時先把會讓你分心的東西收起來，就不容易這樣喔！","next":"心專注了，還要每天進步。商朝的開國君王湯，就在每天用的洗臉盆上刻了幾個字……"}},{"id":"e53_08","yr":"《禮記．大學》","place":"商朝的王宮","scene":"palace","music":"palace","cast":[["商湯",0.6,-0.4],["侍從",-7,0.8],["大臣",2.4,0.8]],"beats":[{"t":"這段話出自《禮記．大學》。商朝的開國君王湯，每天早上都用一個大盆子洗臉。","fx":[["focus","商湯"]]},{"t":"侍從端著洗臉盆走過來。","mv":[["侍從",-0.6,0.2]]},{"who":"商湯","t":"洗乾淨了，真舒服！","fx":[["cheer","商湯"]]},{"t":"商湯在洗臉盆上刻了三句話，每天洗臉都看得到。","fx":[["focus","商湯"]]},{"who":"商湯","t":"苟日新，日日新，又日新！","fx":[["say","商湯"]]},{"who":"大臣","t":"大王，這是什麼意思呢？"},{"who":"商湯","t":"臉要天天洗，品德也要天天反省。今天要比昨天好，明天又要比今天更好！","fx":[["say","商湯"]]}],"q":"後人把湯的「苟日新，日日新，又日新」化用成一個成語，形容每天、每月都有新的變化，進步得很快。是哪一個？","wrong":[{"w":"一成不變","by":"大臣","line":"一成不變是一直都一樣，完全不改變，跟大王說的剛好相反！"},{"w":"墨守成規","by":"侍從","line":"墨守成規是死守著老規矩，不肯改變。大王可是天天求新呢！"},{"w":"突飛猛進","by":"商湯","line":"突飛猛進是進步得又快又猛，意思很接近！不過說「每天每月都有新變化」的，是另一個成語。"}],"hint":"「異」是不一樣、有變化。想想看：一天叫什麼？一個月叫什麼？","after":"大臣們都很佩服，也學著天天提醒自己要進步。","lesson":{"title":"成語小學堂．日新月異","text":"刻在器物上提醒自己的話叫做「銘」，這三句就是有名的「湯之盤銘」。現在常用這個成語形容發展很快，例如手機、電腦的功能日新月異。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第十六島．禮記的做人道理","eps":[53]},{"key":"i54","name":"尚書易經的智慧","short":"尚書易經","era":"《尚書》《易經》","color":"#3E7FA8","map":{"ground":"#a7c27c","river":"#4f9fd8"},"intro":{"lines":["《尚書》也叫《書經》，是中國很古老的歷史文獻，記錄堯、舜、禹和商朝、周朝的君王與大臣說過的話。","《尚書》裡有一部分叫《古文尚書》，很多學者認為是後人整理的。","《易經》也是非常古老的書，用六十四個「卦」說明天地萬物的變化，也教人怎麼做人處事。","這座島上，有治水的大禹、收到大狗的周武王，還有在山上盯著獵物的老虎……"],"people":[["禹","治好洪水的英雄，後來建立夏朝"],["傅說","商王武丁從夢裡找到的賢相"],["召公","周朝大臣，寫〈旅獒〉勸周武王"],["淳于髡","戰國時齊國人，很會說話"]]},"stops":[{"id":"e54_01","yr":"《書經．益稷》","place":"舜帝的朝廷","scene":"office","music":"palace","cast":[["舜帝",0.4,-1.0],["禹",-1.2,0.5],["皋陶",2.0,0.5]],"beats":[{"t":"這段話出自《書經．益稷》。舜帝和大臣們在朝廷上討論國家大事。","fx":[["focus","舜帝"]]},{"who":"舜帝","t":"禹，你也說說你的好意見吧！","fx":[["say","舜帝"]]},{"t":"禹恭敬地拜了拜。","fx":[["focus","禹"]]},{"who":"禹","t":"大王，我哪有什麼好說的？我每天只想著努力做事。","fx":[["say","禹"]]},{"who":"皋陶","t":"喔？說來聽聽！"},{"who":"禹","t":"當年洪水滔天，淹到山丘上。我坐車、乘船，翻山越嶺砍樹開路，疏通河道，把水引進大海。"},{"who":"禹","t":"後來百姓終於能種田、有飯吃，各地也安定下來了。","fx":[["cheer","皋陶"]]}],"q":"禹說他每天只想著勤奮做事，治水時更是一刻也不偷懶。形容勤勤懇懇、不知疲倦，是哪個成語？","wrong":[{"w":"好吃懶做","by":"皋陶","line":"好吃懶做是貪吃又懶惰。禹可是勤勞得不得了！"},{"w":"遊手好閒","by":"舜帝","line":"遊手好閒是整天閒晃不做事。禹忙著治水，哪有空閒晃？"},{"w":"廢寢忘食","by":"皋陶","line":"廢寢忘食是專心到忘了吃飯睡覺，意思很接近！不過禹說的「孜孜」，是另一個成語。"}],"hint":"原文是禹說的「予思日孜孜」，「孜孜」是勤勉的樣子；「倦」是疲倦。","after":"皋陶稱讚禹：「說得好！你的話值得大家學習。」","lesson":{"title":"成語小學堂．孜孜不倦","text":"相傳禹治水十幾年，「三過家門而不入」，後來建立了夏朝。現在常用這個成語形容讀書、工作非常認真，例如「他孜孜不倦地做研究」。","next":"勤勞很重要，事先準備也很重要。商朝的君王武丁，竟然從夢裡找到了一位賢人……"}},{"id":"e54_02","yr":"《書經．說命中》","place":"商朝的王宮","scene":"palace","music":"palace","cast":[["武丁",0.6,-0.6],["傅說",-7,0.6],["大臣",2.6,0.8]],"beats":[{"t":"這段話出自《書經．說命》。商朝的君王武丁，有一天夢見了一位聖人。","fx":[["focus","武丁"]]},{"who":"武丁","t":"快照著我夢裡的樣子畫像，去把這個人找來！","fx":[["say","武丁"]]},{"t":"大家拿著畫像四處找，在一個叫傅巖的地方，找到一個正在築牆的人。","mv":[["傅說",-0.6,0.4]],"fx":[["focus",null]]},{"who":"大臣","t":"大王，就是他！長得和畫像一模一樣！他叫傅說。","fx":[["cheer","大臣"]]},{"t":"武丁請傅說當宰相。傅說常常提醒武丁怎麼治理國家。","fx":[["focus","傅說"]]},{"who":"傅說","t":"大王，做每件事，都要事先準備好。","fx":[["say","傅說"]]}],"q":"傅說接著說：「事先準備好了，就不怕災禍發生。」這句話變成了哪個成語？","wrong":[{"w":"杞人憂天","by":"大臣","line":"杞人憂天是擔心根本不會發生的事，白操心。做好準備可不是瞎操心喔！"},{"w":"臨渴掘井","by":"傅說","line":"臨渴掘井是口渴了才挖井，來不及啦！跟事先準備剛好相反。"},{"w":"未雨綢繆","by":"武丁","line":"未雨綢繆是下雨前先把門窗修好，意思非常接近！不過傅說的原話是另一個成語。"}],"hint":"「備」是準備，「患」是災禍。","after":"武丁聽從傅說的勸告，把國家治理得很好，商朝又興盛起來。","lesson":{"title":"成語小學堂．有備無患","text":"原文是「惟事事乃其有備，有備無患」。〈說命〉屬於《古文尚書》，很多學者認為是後人整理的。現在常用這個成語，例如出門前帶雨傘、考試前先複習。","next":"準備好了，還要小心別被喜歡的東西迷住。周朝的周武王，收到了一份特別的禮物……"}},{"id":"e54_03","yr":"《書經．旅獒》","place":"周武王的王宮","scene":"palace","music":"palace","cast":[["周武王",0.6,-0.6],["召公",-1.4,0.6],["旅國使者",7,0.8]],"beats":[{"t":"這段話出自《書經．旅獒》。周武王打敗商朝以後，四方的國家都派人來送禮。","fx":[["focus","周武王"]]},{"t":"西方的旅國派使者牽來一隻又高又大的猛犬，叫做「獒」。","mv":[["旅國使者",2.4,0.6]]},{"who":"旅國使者","t":"大王，這是我們國家最好的獒犬！","fx":[["say","旅國使者"]]},{"who":"周武王","t":"哇，好威風的大狗！","fx":[["cheer","周武王"]]},{"t":"大臣召公在一旁看著，心裡很擔心：大王會不會從此迷上玩樂？","fx":[["upset","召公"],["focus","召公"]]},{"t":"召公寫了一篇文章勸武王，就是〈旅獒〉。","fx":[["focus",null]]},{"who":"召公","t":"大王，玩弄人，會喪失德行……","fx":[["say","召公"]]}],"q":"召公接著說：「沉迷玩賞喜愛的東西，就會喪失遠大的志向。」這句話變成了哪個成語？","wrong":[{"w":"愛屋及烏","by":"周武王","line":"愛屋及烏是愛一個人，連他屋頂上的烏鴉也喜歡。召公說的是迷上東西會丟掉志向！"},{"w":"雄心壯志","by":"旅國使者","line":"雄心壯志是遠大的志向。召公就是怕大王把它弄丟啊！"},{"w":"樂不思蜀","by":"召公","line":"樂不思蜀是玩得太快樂，忘了回家、忘了本分，有點接近！不過我說的是「玩東西」喪失志向，有專門的成語。"}],"hint":"「玩」是沉迷玩賞，「喪」是失去，「志」是志向。","after":"周武王點點頭：「你說得對，我會記住的！」","lesson":{"title":"成語小學堂．玩物喪志","text":"「獒」念ㄠˊ，是一種高大的猛犬。〈旅獒〉屬於《古文尚書》，很多學者認為是後人整理的。現在常用這個成語提醒人：喜歡玩沒關係，但不能玩到忘了該做的事。","next":"召公在〈旅獒〉裡，還打了一個跟堆土山有關的比方……"}},{"id":"e54_04","yr":"《書經．旅獒》","place":"堆土山的工地","scene":"road","music":"map","cast":[["召公",1.8,-0.4],["周武王",3.0,0.8],["工人",-7,0.4],["工人",-7.6,-0.8]],"beats":[{"t":"召公又勸周武王：做事要從早到晚都勤勉，連小地方也不能馬虎。","fx":[["focus","召公"]]},{"who":"召公","t":"大王，我打個比方，就像堆一座土山……","fx":[["say","召公"]]},{"t":"要堆一座九仞高的山（「仞」是古代的長度單位），工人得一筐一筐地挑土。","mv":[["工人",-0.4,0.4],["工人#2",-1.0,-0.8]],"fx":[["focus",null]]},{"t":"挑了好多天，山越堆越高，只差最後一筐土就完成了！","fx":[["cheerAll","工人"]]},{"who":"工人","t":"差不多了，不挑了！休息吧！","fx":[["say","工人"]]},{"who":"周武王","t":"什麼？只差一筐，山就堆不成了？太可惜了！","fx":[["upset","周武王"]]}],"q":"堆山只差最後一筐土就停下來，結果山沒堆成。比喻事情只差一點就成功，卻失敗了，是哪個成語？","wrong":[{"w":"大功告成","by":"工人","line":"大功告成是事情完全做好了。我們最後一筐沒挑，山根本沒堆好啊……"},{"w":"一勞永逸","by":"工人#2","line":"一勞永逸是辛苦一次就永遠輕鬆。我們是差一點點就放棄了！"},{"w":"前功盡棄","by":"召公","line":"前功盡棄是以前的努力全部白費，很接近！不過我說的是只差「最後一筐土」，有專門的成語。"}],"hint":"「簣」念ㄎㄨㄟˋ，是裝土的竹筐；「虧」是欠缺。","after":"周武王明白了：做事要堅持到最後，不能只差一點就放棄。","lesson":{"title":"成語小學堂．功虧一簣","text":"原文是「為山九仞，功虧一簣」。現在常用這個成語形容差一點就成功，非常可惜，例如比賽最後一球沒投進。「簣」是竹字頭，不要寫錯喔！","next":"想要堅持到底，可以學學天的精神。《易經》的第一卦，就說到天的運行……"}},{"id":"e54_05","yr":"《易經．乾卦》","place":"爺爺家的院子","scene":"house","music":"map","cast":[["書童",-0.4,-0.2],["爺爺",1.8,0.4]],"beats":[{"t":"這句話出自《易經》的乾卦。乾卦代表「天」，它說「天行健」：天的運行剛健有力，從來不停止。"},{"who":"爺爺","t":"你看，太陽天天升起又落下，白天黑夜輪流，春夏秋冬一直轉，從來沒休息過。","fx":[["say","爺爺"]]},{"t":"書童正在練毛筆字，可是同一個字寫壞了好幾次。","fx":[["focus","書童"],["sad","書童"]]},{"who":"書童","t":"又寫歪了……我不想寫了！"},{"who":"爺爺","t":"君子要學習天的精神：靠自己努力向上，永遠不停下來。","fx":[["focus","爺爺"]]},{"who":"書童","t":"好！寫壞了，就再練一次！","fx":[["cheer","書童"],["focus",null]]},{"t":"書童一天一天練下去，字越寫越漂亮了。"}],"q":"《易經》說：「天行健，君子以○○○○。」意思是君子要學習天，自己努力向上、永遠不停止。這四個字是哪個成語？","wrong":[{"w":"自暴自棄","by":"書童","line":"自暴自棄是自己放棄自己。我才不要呢！"},{"w":"自以為是","by":"爺爺","line":"自以為是是覺得自己都對，聽不進別人的話，跟努力不停止沒有關係。"},{"w":"發憤圖強","by":"爺爺","line":"發憤圖強是下定決心努力求進步，很接近！不過《易經》說的是像天一樣「永遠不停止」。"}],"hint":"「息」是停止的意思；第一個字是「自己」的自。","after":"書童把寫好的字拿給爺爺看，爺爺開心地笑了。","lesson":{"title":"成語小學堂．自強不息","text":"這句話常被拿來當校訓，例如清華大學的校訓「自強不息，厚德載物」，兩句都出自《易經》。現在常用來鼓勵人努力向上、不斷進步。","next":"《易經》的卦辭裡，還藏著好幾個成語。有一卦說到，家裡忽然來了三位客人……"}},{"id":"e54_06","yr":"《易經．需卦》","place":"山邊的小屋","scene":"cottage","music":"map","cast":[["主人",0.8,-0.4],["客人",7,0.6],["客人",7.6,-0.6],["客人",8.2,1.4]],"beats":[{"t":"這句話出自《易經》的需卦。「需」是等待的意思，這一卦的最後一句說：有人回到住的地方……","fx":[["focus","主人"]]},{"who":"主人","t":"今天好累，終於可以休息了。","fx":[["say","主人"]]},{"t":"忽然，門口來了三位客人。主人根本沒有邀請他們！","mv":[["客人",2.2,0.6],["客人#2",2.9,-0.6],["客人#3",3.4,1.2]],"fx":[["upset","主人"],["focus",null]]},{"who":"主人","t":"咦？你們是……"},{"t":"主人沒有生氣，反而恭恭敬敬地請他們進門。"},{"who":"主人","t":"請進，請喝茶！","fx":[["say","主人"],["cheerAll","客人"]]},{"t":"卦辭說「敬之終吉」：恭敬地對待他們，最後會是吉祥的。"}],"q":"這三位客人沒有被邀請，就自己上門來了。這種客人叫做什麼？","wrong":[{"w":"門可羅雀","by":"主人","line":"門可羅雀是門口冷清得可以張網捕麻雀。可是我家突然來了三位客人耶！"},{"w":"賓至如歸","by":"客人","line":"賓至如歸是客人覺得像回到家一樣舒服，是在稱讚主人招待得好，不是說客人沒被邀請。"},{"w":"不請自來","by":"客人#2","line":"不請自來也是沒被邀請就自己來，意思很像！不過《易經》卦辭用的是另一個說法。"}],"hint":"古時候「速」是「邀請」的意思，不是快速喔！","after":"三位客人喝了茶，開開心心地向主人道謝。","lesson":{"title":"成語小學堂．不速之客","text":"現在常用這個成語說沒被邀請、突然來的客人，有時也帶點開玩笑的味道。記得這裡的「速」是邀請，不是「跑得很快的客人」喔！","next":"有的客人很有禮貌，有的「客人」可是來搶東西的。《易經》的頤卦，就說到一隻老虎……"}},{"id":"e54_07","yr":"《易經．頤卦》","place":"深山裡","scene":"mountain","music":"night","cast":[["獵人",1.6,-0.2],["小樵夫",-0.4,0.6]],"beats":[{"t":"這句話出自《易經》的頤卦。「頤」有養育、找食物的意思，卦辭裡提到了老虎找食物的樣子。"},{"t":"小樵夫跟著獵人上山。獵人忽然停下腳步，指著前面的大石頭。","fx":[["focus","獵人"]]},{"who":"獵人","t":"噓！你看石頭上那隻老虎……","fx":[["say","獵人"]]},{"t":"老虎趴在高高的石頭上，往下盯著草地，眼睛一眨也不眨。草地上，有一隻小兔子正在吃草。","fx":[["focus",null]]},{"who":"小樵夫","t":"牠一心只想撲下去，好貪心的樣子！","fx":[["upset","小樵夫"]]},{"t":"小兔子抬頭一看，嚇得一溜煙鑽回洞裡。老虎只好失望地走了。","fx":[["cheer","小樵夫"]]}],"q":"老虎凶狠地往下盯著獵物，一心想撲上去。後來用來比喻貪婪地盯著、想要奪取，是哪個成語？","wrong":[{"w":"狐假虎威","by":"小樵夫","line":"狐假虎威是狐狸借老虎的威風去嚇人。這裡沒有狐狸呀！"},{"w":"如虎添翼","by":"獵人","line":"如虎添翼是老虎長了翅膀，變得更厲害。那隻老虎可沒有翅膀！"},{"w":"垂涎三尺","by":"獵人","line":"垂涎三尺是口水流了三尺長，形容非常想要，很接近！不過卦辭說的是老虎「盯著看」的樣子。"}],"hint":"「眈眈」是往下注視的樣子，看看是哪一種動物在看。","after":"獵人說：「被這樣盯上，可要特別小心！」","lesson":{"title":"成語小學堂．虎視眈眈","text":"「眈」念ㄉㄢ，是目字旁，因為和眼睛有關，不要寫成耳字旁的「耽」。現在常用這個成語形容敵人或壞人貪心地盯著，等機會下手。","next":"老虎喜歡獨來獨往，可是很多東西喜歡聚在一起。戰國時代齊國的淳于髡，就用這個道理推薦人才……"}},{"id":"e54_08","yr":"《易經．繫辭上》","place":"齊宣王的王宮","scene":"palace","music":"palace","cast":[["齊宣王",0.6,-0.8],["淳于髡",-7,0.4],["賢士",-7.6,1.4],["賢士",7,1.0],["賢士",7.6,-0.2]],"beats":[{"t":"《易經．繫辭》說「方以類聚，物以群分」。戰國時代有個故事，正好說明這個道理，記在《戰國策》裡。"},{"t":"齊宣王請淳于髡推薦人才。沒想到，淳于髡一天就帶來了七位賢士！","mv":[["淳于髡",-0.8,0.4],["賢士",-1.2,1.5],["賢士#2",2.0,1.0],["賢士#3",2.8,-0.2]]},{"who":"齊宣王","t":"一千里找到一位賢人，就算很多了；你一天就帶來七位，會不會太多了？","fx":[["upset","齊宣王"],["focus","齊宣王"]]},{"who":"淳于髡","t":"大王，同一類的鳥住在一起，同一類的野獸也走在一起。","fx":[["say","淳于髡"],["focus","淳于髡"]]},{"who":"淳于髡","t":"到山的北邊找草藥，一車一車都採得到。賢人也會和賢人聚在一起，我就是賢人的同類呀！","fx":[["cheerAll","賢士"]]}],"q":"淳于髡的意思是：「同一類的東西，常常會聚在一起。」這個道理是哪個成語？","wrong":[{"w":"鶴立雞群","by":"賢士","line":"鶴立雞群是一個人特別突出，跟旁邊的都不一樣。我們可是聚在一起的同類！"},{"w":"一盤散沙","by":"齊宣王","line":"一盤散沙是大家散散的、不團結，跟聚在一起剛好相反。"},{"w":"志同道合","by":"淳于髡","line":"志同道合是志向相同、想法一致，有點接近！不過說「同類的東西聚在一起」，是另一個成語。"}],"hint":"「類」是同一類，「聚」是聚在一起。","after":"齊宣王聽了，覺得很有道理。","lesson":{"title":"成語小學堂．物以類聚","text":"成語出自《易經》，故事出自《戰國策．齊策三》。這個成語本來只是說同類聚在一起，現在常用來說壞人互相勾結，常和「人以群分」連在一起說。交朋友要選好朋友喔！","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第十七島．尚書易經的智慧","eps":[54]},{"key":"i55","name":"荀子老子管子","short":"諸子百家","era":"《管子》《老子》《荀子》","color":"#A0613A","map":{"ground":"#b0c27a","river":"#4f9fd8"},"intro":{"lines":["春秋戰國時代，出現了許多思想家，各自提出治國和做人的道理，叫做「諸子百家」。","《管子》借用齊國宰相管仲的名字，是後人整理管仲和齊國學者思想的書。","《老子》又叫《道德經》，相傳是老子寫的，只有五千多字，講的是「道」。","《荀子》是戰國思想家荀子寫的。他最重視學習，書的第一篇就是〈勸學〉。"],"people":[["管仲","齊桓公的宰相，幫齊國成為霸主"],["老子","道家的創始人，相傳寫了《道德經》"],["荀子","戰國思想家，認為學習不可以停止"],["馬援","東漢將軍，從小被哥哥看好"]]},"stops":[{"id":"e55_01","yr":"《管子．小匡》","place":"齊國的王宮","scene":"palace","music":"palace","cast":[["齊桓公",0.6,-0.8],["管仲",-1.2,0.5],["農夫",7,0.6],["農家小兒",7.6,1.4]],"beats":[{"t":"這段話出自《管子．小匡》。齊桓公問宰相管仲，怎樣才能讓百姓安居樂業。","fx":[["focus","齊桓公"]]},{"who":"齊桓公","t":"百姓住在哪裡、做什麼工作才好呢？","fx":[["say","齊桓公"]]},{"who":"管仲","t":"讀書的士、種田的農、做工的工、做生意的商，要分區居住，不要混在一起。","fx":[["say","管仲"],["focus","管仲"]]},{"who":"管仲","t":"像種田的人就住在田野旁邊，孩子從小跟著爸爸學種田。","mv":[["農夫",2.0,0.4],["農家小兒",2.8,1.2]],"fx":[["focus",null]]},{"who":"農家小兒","t":"我也要像爸爸一樣，把田種得好好的！","fx":[["cheer","農家小兒"]]},{"who":"管仲","t":"孩子從小學習，心裡很安定，看到別的新奇東西，也不會想改變。這樣學起來又快又好。"}],"q":"管仲說，從小安心學習的人，不會「看見別的東西就改變心意」。後來形容意志不堅定、喜好不專一，是哪個成語？","wrong":[{"w":"一心一意","by":"農夫","line":"一心一意是心思很專一，跟題目說的剛好相反喔！"},{"w":"安居樂業","by":"齊桓公","line":"安居樂業是生活安定、快樂工作，是我想要的好結果，不是說人想東想西。"},{"w":"三心二意","by":"管仲","line":"三心二意也是心意不專一，很接近！不過說「看到新的就想換」，是另一個成語。"}],"hint":"「異」是不一樣的東西，「遷」是改變。","after":"齊桓公照著管仲的辦法，讓百姓安心工作，齊國越來越強大。","lesson":{"title":"成語小學堂．見異思遷","text":"原文是「不見異物而遷焉」，意思是不會看到新奇的東西就改變心意。現在常用這個成語提醒人做事要專一，例如學才藝不要今天學鋼琴、明天又想換畫畫。","next":"一個人要專一，一群人要團結。《管子》裡還有一句話，說的是一群烏鴉……"}},{"id":"e55_02","yr":"《管子》佚文","place":"村子外的樹林","scene":"south","music":"map","cast":[["農夫",1.6,-0.4],["牧童",-0.4,0.6]],"beats":[{"t":"這句話出自《管子》。牧童和農夫在樹林邊休息，看見一群烏鴉臨時湊在一起，嘎嘎嘎吵個不停。","fx":[["focus","牧童"]]},{"t":"地上有一塊肉，烏鴉們搶成一團，誰也不讓誰！","fx":[["focus",null]]},{"who":"牧童","t":"哈哈，牠們在吵「是我的！」「我先看到的！」","fx":[["cheer","牧童"]]},{"who":"農夫","t":"看我的！","fx":[["say","農夫"]]},{"t":"農夫拍了一下手。烏鴉們嚇得各自亂飛，一下子就散光了。","fx":[["upset","牧童"]]},{"t":"這時，天上一群大雁排著整整齊齊的隊伍飛過去。","fx":[["focus","農夫"]]},{"who":"農夫","t":"你看，大雁有秩序，烏鴉卻亂成一團。"}],"q":"《管子》說：像烏鴉一樣臨時湊在一起的人群，一開始雖然人多勢眾，後來一定會散掉。這種沒有組織的一群人，叫做什麼？","wrong":[{"w":"同心協力","by":"農夫","line":"同心協力是大家一條心、一起努力，像那群大雁，剛好相反！"},{"w":"井然有序","by":"牧童","line":"井然有序是整齊又有條理。那群烏鴉亂成一團耶！"},{"w":"一盤散沙","by":"農夫","line":"一盤散沙是比喻大家不團結，很接近！不過說「像烏鴉一樣臨時湊在一起的人群」，有專門的成語。"}],"hint":"「烏」就是烏鴉，「眾」是一群人。","after":"牧童說：「原來吵吵鬧鬧、沒有規矩，一嚇就散了！」","lesson":{"title":"成語小學堂．烏合之眾","text":"這句話今天的《管子》裡找不到了，是靠唐朝的書《意林》引用，才留了下來。現在常用這個成語形容沒有組織、沒有紀律的一群人。","next":"接下來到老子的書裡看看。老子說：越大的器物，越要花很長的時間才做得成……"}},{"id":"e55_03","yr":"《老子》第四十一章","place":"馬家的院子","scene":"house","music":"map","cast":[["馬援",-0.4,0.4],["馬況",1.8,-0.4]],"beats":[{"t":"這句話出自《老子》第四十一章。老子說：越大的器物，越要花很長的時間才能做成。"},{"t":"東漢的馬援年輕時跟老師讀《詩經》，卻不喜歡一字一句地鑽研。","fx":[["focus","馬援"],["sad","馬援"]]},{"who":"馬援","t":"哥哥，讀書不適合我，我想到邊疆去放牧。","fx":[["say","馬援"]]},{"t":"哥哥馬況沒有罵他，反而笑著鼓勵他。","fx":[["focus","馬況"]]},{"who":"馬況","t":"你是有大才能的人，會比較晚才成功。好工匠不會把還沒雕好的木頭拿給人看。你就照自己喜歡的路去走吧！","fx":[["say","馬況"]]},{"who":"馬援","t":"謝謝哥哥！","fx":[["cheer","馬援"],["focus",null]]}],"q":"老子說大的器物要很久才能做成；馬況也說弟弟「是大才，會比較晚成功」。比喻傑出的人才往往比較晚成功，是哪個成語？","wrong":[{"w":"少年得志","by":"馬援","line":"少年得志是年紀輕輕就成功。我可是後來才有成就的喔！"},{"w":"小題大作","by":"馬況","line":"小題大作是把小事當成大事。我是說弟弟才能很大，要慢慢才成功。"},{"w":"厚積薄發","by":"馬況","line":"厚積薄發是長期累積、慢慢發揮，有點接近！不過老子說的是「大的器物晚完成」，有專門的成語。"}],"hint":"「器」是器物，也比喻人才；「晚」是比較晚。","after":"後來馬援在邊疆放牧有成，又投靠漢光武帝劉秀，成為東漢有名的「伏波將軍」。","lesson":{"title":"成語小學堂．大器晚成","text":"馬援的故事記在《後漢書．馬援傳》，「老當益壯」也是他說的話。現在常用這個成語鼓勵人：成功慢一點沒關係，只要一直努力。","next":"《老子》裡還有一句提醒：不要隨便答應別人……"}},{"id":"e55_04","yr":"《老子》第六十三章","place":"學校的走廊","scene":"south","music":"map","cast":[["小明",-0.4,0.2],["小華",7,0.6],["小美",7.6,-0.6]],"beats":[{"t":"這句話出自《老子》第六十三章。我們用一個小故事，來看看它的道理。"},{"t":"小明很熱心，不管別人拜託什麼，他都一口答應。","mv":[["小華",1.6,0.6],["小美",2.4,-0.6]],"fx":[["focus","小明"]]},{"who":"小華","t":"小明，明天幫我帶故事書好嗎？"},{"who":"小美","t":"放學也幫我打掃好不好？"},{"who":"小明","t":"好好好！通通包在我身上！","fx":[["cheer","小明"]]},{"t":"第二天，小明一件事也沒做到。","fx":[["sad","小明"],["focus",null]]},{"who":"小華","t":"你又忘記了！上次也這樣，以後還能相信你嗎？","fx":[["upset","小華"]]}],"q":"老子說：「輕易答應別人的人，一定很少守信用。」小明就是這樣。這是哪個成語？","wrong":[{"w":"一諾千金","by":"小華","line":"一諾千金是說話算話，答應的事比千兩黃金還珍貴，跟小明剛好相反！"},{"w":"守株待兔","by":"小美","line":"守株待兔是不努力、等著好運自己送上門。小明的問題是答應太多又做不到！"},{"w":"言而無信","by":"小美","line":"言而無信是說話不算話，意思很接近！不過老子說的是「隨便答應」又做不到，有專門的成語。"}],"hint":"「諾」是答應，「寡」是少。","after":"小明想了想說：「以後我要先想清楚，做得到再答應。」","lesson":{"title":"成語小學堂．輕諾寡信","text":"原文是「夫輕諾必寡信，多易必多難」：隨便答應的人很少守信，把事情看得太容易，一定會遇到很多困難。答應別人之前要想清楚，答應了就要做到。","next":"接下來到荀子的書裡。荀子最重視學習，他的〈勸學〉一開頭就說……"}},{"id":"e55_05","yr":"《荀子．勸學》","place":"荀子的學堂","scene":"study","music":"map","cast":[["荀子",0.4,-1.0],["學生",1.8,0.6],["李謐",-7,0.4,0,null,1],["孔璠",7,-0.6,0,null,1]],"beats":[{"who":"荀子","t":"學習是不可以停止的！","fx":[["say","荀子"],["focus","荀子"]]},{"who":"荀子","t":"青色的染料是從藍草裡提煉出來的，顏色卻比藍草還要深；冰是水凝結成的，卻比水更冷。"},{"who":"學生","t":"原來後來的，可以比原來的更厲害！","fx":[["cheer","學生"]]},{"t":"幾百年後的北魏，有個叫李謐的年輕人，跟著老師孔璠用功讀書。","mv":[["荀子",7.6,-1.0],["學生",8.0,0.6],["李謐",-0.6,0.4],["孔璠",1.4,-0.4]],"fx":[["focus",null]]},{"t":"幾年後，李謐的學問超過了老師。孔璠遇到不懂的地方，反過來向他請教。","fx":[["focus","孔璠"]]},{"who":"孔璠","t":"這個問題，請你教教我吧！","fx":[["say","孔璠"]]},{"who":"李謐","t":"老師，不敢當！","fx":[["say","李謐"]]}],"q":"青色從藍草提煉，卻比藍草更青；李謐的學問也超過了老師。比喻學生勝過老師、後輩勝過前輩，是哪個成語？","wrong":[{"w":"江郎才盡","by":"孔璠","line":"江郎才盡是才華用光了。這裡是學生越來越厲害呀！"},{"w":"班門弄斧","by":"李謐","line":"班門弄斧是在專家面前賣弄本事。可是是老師主動來問我的，我沒有賣弄喔！"},{"w":"後生可畏","by":"孔璠","line":"後生可畏是年輕人很值得敬畏，有點接近！不過說「學生勝過老師」，要用荀子青色和藍草的比喻。"}],"hint":"「青」是青色的染料，「藍」是可以提煉染料的藍草。","after":"當時的人編了一句話稱讚他們：「青成藍，藍謝青，師何常，在明經。」意思是：誰懂得道理，誰就可以當老師。","lesson":{"title":"成語小學堂．青出於藍","text":"常說「青出於藍，更勝於藍」，稱讚學生比老師更優秀。李謐的故事記在《北史》。好老師最開心的事，就是看到學生超越自己！","next":"〈勸學〉還說，要學得好，就要有恆心，像雕刻一樣不停下來……"}},{"id":"e55_06","yr":"《荀子．勸學》","place":"雕刻工坊","scene":"house","music":"map","cast":[["荀子",2.0,-0.6],["阿木",-0.6,0.4],["阿石",0.8,0.9]],"beats":[{"t":"這句話出自《荀子．勸學》。荀子說：一點一點堆土，就能堆成高山；一步一步走，才能走到千里遠。","fx":[["focus","荀子"]]},{"t":"工坊裡，兩個學徒在練習雕刻。阿木拿到一塊爛木頭，阿石拿到一塊硬石頭。","fx":[["focus",null]]},{"who":"阿木","t":"好累，不刻了！","fx":[["sad","阿木"]]},{"who":"荀子","t":"刻兩下就放棄，連爛木頭也刻不斷。","fx":[["say","荀子"]]},{"t":"阿石卻一刀一刀，每天都刻個不停。","fx":[["focus","阿石"]]},{"who":"阿石","t":"再刻一下！再刻一下！","fx":[["say","阿石"]]},{"t":"過了好多天，堅硬的石頭上，竟然刻出了漂亮的字！","fx":[["cheer","阿石"],["burst","阿石","#e8b84f"]]}],"q":"荀子說：「一直刻下去不停止，連金屬和石頭都能刻出花紋。」比喻有恆心、有毅力，堅持到底，是哪個成語？","wrong":[{"w":"半途而廢","by":"阿石","line":"半途而廢是做到一半就放棄，那是阿木啦！"},{"w":"粗心大意","by":"阿木","line":"粗心大意是不小心、不仔細。阿石可是又細心又有耐心！"},{"w":"持之以恆","by":"荀子","line":"持之以恆也是長久堅持下去，意思很接近！不過說「一直雕刻不停」的，是〈勸學〉裡的另一個成語。"}],"hint":"「鍥」念ㄑㄧㄝˋ，是雕刻；「舍」是停止。","after":"阿木看了好佩服，撿起刻刀說：「我也要再試一次！」","lesson":{"title":"成語小學堂．鍥而不舍","text":"原文是「鍥而舍之，朽木不折；鍥而不舍，金石可鏤」。「舍」同「捨」，所以也寫作「鍥而不捨」。現在常用來稱讚人很有毅力。","next":"荀子在同一段話裡，還用兩匹馬打了一個比方……"}},{"id":"e55_07","yr":"《荀子．勸學》","place":"通往遠方的大路","scene":"road","music":"map","cast":[["荀子",2.6,1.0],["學生",3.6,0.2],["老馬",-0.6,-0.6,0,0],["老馬",0.4,0.6,0,0]],"beats":[{"t":"荀子又打了一個比方。","fx":[["focus","荀子"]]},{"who":"荀子","t":"快馬和慢馬，誰能走得遠呢？","fx":[["say","荀子"]]},{"t":"一匹千里馬跑得飛快，可是跳得再遠，跳一下也跳不過十步。","mv":[["老馬",1.4,-1.2]],"fx":[["focus","老馬"]]},{"t":"千里馬跑了一陣子，就停在路邊休息不走了。"},{"t":"另一匹跑得慢的劣馬，拉著車一天一天走，從不停下來，一連走了十天。","mv":[["老馬#2",-1.4,-2.0]],"fx":[["focus","老馬#2"]]},{"who":"荀子","t":"牠走到了很遠的地方，靠的就是「不停止」！","fx":[["focus",null],["cheer","學生"]]}],"q":"跑得慢的劣馬拉車走十天，也能走得很遠。比喻資質平庸的人只要努力不懈，也能趕上別人，是哪個成語？","wrong":[{"w":"老馬識途","by":"學生","line":"老馬識途是老馬認得路。這裡比的是誰走得遠，不是誰認得路！"},{"w":"一馬當先","by":"學生","line":"一馬當先是衝在最前面。那匹劣馬可是慢慢走的！"},{"w":"笨鳥先飛","by":"荀子","line":"笨鳥先飛是能力差的人提早開始努力，有點接近！不過我說的是劣馬靠「天天不停地走」趕上快馬。"}],"hint":"「駑」是跑得慢的劣馬；「駕」是馬拉車走一天的路程。","after":"荀子在〈修身〉篇也說：千里馬一天跑一千里，劣馬走十天，一樣追得上。","lesson":{"title":"成語小學堂．駑馬十駕","text":"「駕」是馬拉車走一天的路程，「十駕」就是走十天。這個成語鼓勵我們：天分不夠沒關係，只要每天努力、不停下來，一樣能趕上別人。","next":"荀子不只談學習，也談怎麼讓國家富足。他在〈富國〉裡，打了一個跟水有關的比方……"}},{"id":"e55_08","yr":"《荀子．富國》","place":"農家的院子","scene":"house","music":"map","cast":[["荀子",1.8,-0.6],["爸爸",-0.6,0.2],["小妹",0.8,0.9]],"beats":[{"t":"這段話出自《荀子．富國》。荀子說：田野和百姓的工作，是財富的源頭。","fx":[["focus","荀子"]]},{"t":"荀子指著院子裡的大水缸，打了一個比方。","fx":[["prop","urn",0.2,-1.4]]},{"who":"荀子","t":"錢財就像缸裡的水。要多開發水源，讓水一直流進來。","fx":[["say","荀子"]]},{"t":"這時，小妹忘了把出水口塞好，水嘩啦啦地流走了。","fx":[["focus","小妹"]]},{"who":"爸爸","t":"哎呀！快塞緊一點！","fx":[["upset","爸爸"]]},{"who":"荀子","t":"對，也要節省，不讓水白白流走。這樣缸裡的水，才會越來越多。","fx":[["focus",null]]}],"q":"荀子說，國家要「開發財源」，又要「節省支出」，財力才會越來越充足。這是哪個成語？","wrong":[{"w":"揮金如土","by":"爸爸","line":"揮金如土是花錢像撒泥土一樣，太浪費了！剛好相反。"},{"w":"坐吃山空","by":"小妹","line":"坐吃山空是只花錢不賺錢，就算有一座金山也會吃光，剛好相反！"},{"w":"勤儉持家","by":"荀子","line":"勤儉持家是勤勞又節省地照顧家，很接近！不過我用的是水源和水流的比喻，有專門的成語。"}],"hint":"「源」是水源，「流」是水流。","after":"小妹說：「那我多幫忙做家事、少買零食，也是在幫家裡富足！」","lesson":{"title":"成語小學堂．開源節流","text":"原文是「節其流，開其源」。現在常用這個成語說公司、國家或家庭怎麼理財：多賺錢、少浪費。存零用錢也可以試試看喔！","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第十八島．荀子老子管子","eps":[55]},{"key":"i56","name":"兵法謀略島","short":"兵法島","era":"《孫子兵法》與先秦兵論","color":"#B5533C","map":{"ground":"#c9b27a","river":"#4f8fc8"},"intro":{"lines":["歡迎來到兵法謀略島！這座島上的成語，都和打仗的智慧有關。","最有名的兵書是《孫子兵法》，作者孫武是春秋末年的軍事家，把兵法寫成十三篇，獻給吳王闔閭。","《管子》和《荀子》也談到用兵的道理：先準備好武器，用仁義贏得人心。","島上還有田單、王翦、李愬三位將軍，用真實的戰役示範兵法怎麼用。","這些道理到今天還能用在比賽、考試和團體合作上喔！"],"people":[["孫武","春秋末年軍事家，寫下《孫子兵法》"],["荀子","戰國末年的大學者，主張用仁義帶兵"],["田單","戰國時齊國將領，擺出火牛陣"],["王翦","秦國老將，耐心等待時機打敗楚國"]]},"stops":[{"id":"e56_01","yr":"《管子．參患》","place":"齊國的練兵場","scene":"walls","music":"map","cast":[["管仲",-6.5,0.8],["將軍",1.6,0.4],["齊兵",0.4,-0.8],["齊兵",2.6,-1.2],["敵兵",4.6,-3.6]],"beats":[{"t":"這句話出自《管子》。這本書收集了齊國名相管仲和後人談治國、打仗的道理。"},{"t":"管仲來到練兵場，檢查士兵的武器。","mv":[["管仲",-1.2,0.4]]},{"who":"管仲","t":"打仗以前，要先看看武器好不好、士兵練得怎麼樣。","fx":[["say","管仲"]]},{"t":"一個齊兵只拿著短短的刀子，遠處的敵兵卻拿著弓箭。","fx":[["focus","齊兵"]]},{"who":"齊兵","t":"刀子這麼短，碰都碰不到敵人啊！","fx":[["upset","齊兵"]]},{"who":"管仲","t":"拿短刀對付遠處射來的箭，跟坐在那裡等死，有什麼不同呢？","fx":[["focus",null]]},{"who":"將軍","t":"我明白了！先把武器準備好、把本領練好，才能應戰！","fx":[["cheerAll","齊兵"]]}],"q":"現代情境：明天就要段考了，小明卻說「反正來不及了」，躺在沙發上什麼也不做。像這樣遇到困難不想辦法、只是消極等待失敗，可以用哪個成語？","wrong":[{"w":"胸有成竹","by":"將軍","line":"胸有成竹是心裡早就有把握。小明根本是放棄了，哪來的把握？"},{"w":"全力以赴","by":"齊兵","line":"全力以赴是用盡全力去做。躺在沙發上，剛好相反啦！"},{"w":"束手無策","by":"管仲","line":"束手無策是想不出辦法，有點像。但小明是「不去想辦法」，乾坐著等失敗，有一個更貼切的成語。"}],"hint":"原文說：拿短兵對付遠矢，就像「坐而待死」。「斃」是死亡、失敗。","after":"小明想起管仲的話，趕快拿出課本：與其乾著急，不如現在就複習！","lesson":{"title":"成語小學堂．坐以待斃","text":"原文是「短兵待遠矢，與坐而待死者同實」，意思是武器不如人，就跟坐著等死一樣。《管子》提醒：打仗要先看武器、士兵、將領和國君。現在常用來勸人遇到危難要積極想辦法。","next":"說到打仗的道理，最有名的一本書，是春秋末年孫武寫的《孫子兵法》……"}},{"id":"e56_02","yr":"《孫子．九地》","place":"吳國的大河邊","scene":"river","music":"palace","cast":[["孫武",-6.5,1.0],["吳王",2.6,1.2],["吳國人",-1.6,-1.0,0,1,1],["越國人",1.2,-1.0,0,1,1]],"beats":[{"t":"春秋末年，孫武把自己寫的兵法十三篇，獻給吳王闔閭。","mv":[["孫武",-0.6,0.8]]},{"who":"吳王","t":"寫得真好！可是，要怎麼讓士兵像一個人一樣團結呢？","fx":[["say","吳王"]]},{"who":"孫武","t":"大王，我打個比方。吳國人和越國人是仇人，可是……","fx":[["focus","孫武"]]},{"t":"（比方）一個吳國人和一個越國人，坐上同一條船過河，誰也不理誰。","mv":[["吳國人",-0.9,-1.2],["越國人",0.5,-1.2]],"fx":[["upset","吳國人"],["upset","越國人"]]},{"t":"船到河中央，忽然颳起大風，船搖得好厲害！","fx":[["focus",null],["sad","吳國人"],["sad","越國人"]]},{"who":"越國人","t":"抓緊我！一起划！","fx":[["say","越國人"]]},{"t":"兩人顧不得吵架，像左手幫右手一樣，互相救助。","fx":[["cheer","吳國人"],["cheer","越國人"]]}],"q":"孫武說：遇到大風時，連仇人也會像左右手一樣互相幫忙；帶兵就要讓大家同心協力、一起度過難關。這個比方變成哪個成語？","wrong":[{"w":"同床異夢","by":"越國人","line":"同床異夢是在一起卻各想各的。大風一來，我們可是一起划船！"},{"w":"水火不容","by":"吳國人","line":"水火不容是彼此完全合不來。我們平常是這樣沒錯，可是大風一颳，就得互相幫忙了！"},{"w":"齊心協力","by":"孫武","line":"齊心協力也是大家一起努力，意思很接近！但我的比方特別講「坐同一條船渡河」，有專門的成語。"}],"hint":"「舟」是船，「濟」是渡河。","after":"吳王很佩服，後來任用孫武當將軍。","lesson":{"title":"成語小學堂．同舟共濟","text":"原文是「當其同舟而濟，遇風，其相救也如左右手」。孫武還說，好軍隊要像常山的「率然」蛇：打牠的頭，尾巴就來救；打尾巴，頭就來救。現在常用來形容大家團結合作、共度難關。","next":"孫武在〈謀攻〉篇裡，還說了一句打勝仗的大祕訣……"}},{"id":"e56_03","yr":"《孫子．謀攻》","place":"吳國軍帳","scene":"tent","music":"map","table":true,"cast":[["孫武",0.2,-0.6],["急躁將軍",-6.5,0.6],["細心將軍",6.5,0.6]],"beats":[{"t":"《孫子兵法》的〈謀攻〉篇，講的是怎麼樣才能打勝仗。"},{"t":"（示意）軍帳裡，孫武要考考兩位將軍。","mv":[["急躁將軍",-1.4,0.6],["細心將軍",1.8,0.6]]},{"who":"孫武","t":"就要出兵了，你們準備好了嗎？","fx":[["say","孫武"]]},{"who":"急躁將軍","t":"我的士兵很強，馬上出發！敵人有多少？不知道！","fx":[["cheer","急躁將軍"]]},{"who":"孫武","t":"只了解自己、不了解敵人，打起仗來就會時贏時輸。","fx":[["sad","急躁將軍"]]},{"who":"細心將軍","t":"我先派人打探：敵人有多少兵、糧食夠不夠，再對照我們自己的力量。","fx":[["focus","細心將軍"]]},{"who":"孫武","t":"說得好！兩邊都弄清楚，打一百次仗也不會有危險。","fx":[["focus",null],["cheer","細心將軍"]]}],"q":"孫武說：「了解敵人，也了解自己，打一百次仗也不會危險。」現在比賽前先研究對手，也清楚自己的長處和短處，可以用哪個成語？","wrong":[{"w":"掉以輕心","by":"細心將軍","line":"掉以輕心是太大意、不當一回事，這正是急躁將軍的毛病！"},{"w":"一無所知","by":"急躁將軍","line":"一無所知是什麼都不知道……嗯，好像在說我。可是孫武稱讚的不是這個啦！"},{"w":"自知之明","by":"孫武","line":"自知之明是了解自己，只對了一半！我說的是自己和敵人都要了解。"}],"hint":"「彼」是對方，「己」是自己。","after":"急躁將軍抓抓頭說：「我也趕快派人去打探敵情！」","lesson":{"title":"成語小學堂．知己知彼","text":"原文是「知彼知己者，百戰不殆；不知彼而知己，一勝一負；不知彼，不知己，每戰必殆」。「殆」是危險。不只打仗，比賽、考試、做決定之前，都要先了解自己和對方。","next":"了解敵我之後，要怎麼打才會贏呢？孫武說「以正合，以奇勝」。戰國時，有一位將軍真的這樣做了……"}},{"id":"e56_04","yr":"《孫子．勢篇》、《史記．田單列傳》","place":"即墨城外","scene":"walls","music":"battle","cast":[["田單",-6.5,0.4],["燕將",3.2,1.0],["燕兵",2.0,0.0],["燕兵",3.6,-0.6],["燕兵",4.6,0.4],["火牛",-1.6,-1.6,0,1,1],["火牛",-0.4,-1.9,0,1,1],["齊兵",-4.6,-2.0,1.3],["齊兵",-3.2,-2.2,1.3]],"beats":[{"t":"這句話出自《孫子兵法》，故事記在《史記》。戰國時，燕國大軍攻打齊國，齊國只剩下兩座城。"},{"who":"燕將","t":"即墨城被我們團團圍住，看你們還能撐多久！","fx":[["cheerAll","燕兵"]]},{"t":"守即墨的田單找來一千多頭牛，披上畫著花紋的彩布，牛角綁上尖刀。","mv":[["田單",-2.4,0.2],["火牛",-1.6,-1.2],["火牛#2",-0.6,-1.6]]},{"who":"田單","t":"今晚就靠你們了！","fx":[["focus","田單"]]},{"t":"半夜，士兵點燃綁在牛尾巴上的蘆葦。牛被燒得發狂，直直衝向燕軍！","fx":[["focus",null],["fire",-1.0,-1.0]],"mv":[["火牛",2.2,0.0],["火牛#2",3.6,-0.4]]},{"t":"燕軍從夢中驚醒，看見一群怪獸衝過來，嚇得四處逃跑！","fx":[["upset","燕將"],["flagsDown"]],"mv":[["燕兵",7.6,0.2],["燕兵#2",8.0,-1.0],["燕兵#3",7.4,1.2],["燕將",6.0,1.2]]},{"t":"城牆上的齊兵看見了，高興得大聲歡呼！","fx":[["cheerAll","齊兵"]]}],"q":"田單不跟燕軍正面硬拚，而是用誰也想不到的火牛陣打敗敵人。這種用奇特的計謀、出人意料的奇兵取得勝利的方法，叫做什麼？","wrong":[{"w":"墨守成規","by":"田單","line":"墨守成規是死守老方法。我的火牛陣，可是前所未見的新招！"},{"w":"以卵擊石","by":"燕將","line":"以卵擊石是拿蛋去碰石頭、自不量力。田單才不笨，他是用巧計贏我們的……唉！"},{"w":"反敗為勝","by":"齊兵","line":"反敗為勝是從輸變成贏，我們確實做到了！不過題目問的是「用奇計」取勝，重點在一個「奇」字。"}],"hint":"孫子說「以正合，以奇勝」：用「奇」兵來「制」服敵人。","after":"齊軍趁勝追擊，一口氣收復了七十多座城。","winSad":"燕將","lesson":{"title":"成語小學堂．出奇制勝","text":"《孫子．勢篇》說：「凡戰者，以正合，以奇勝。」意思是正面迎戰，再用出人意料的奇兵取勝。司馬遷寫完田單的故事，也用這句話稱讚他。現在也比喻用新奇的方法取得成功。","next":"不過，有時候最好的辦法不是出兵，而是先停下來。荀子就這麼說……"}},{"id":"e56_05","yr":"《荀子．王制》","place":"國君的宮殿","scene":"palace","music":"palace","cast":[["國君",1.2,0.4],["荀子",-6.5,0.8],["大臣",2.8,1.2],["甲國兵",-3.0,-3.6],["乙國兵",3.4,-3.6]],"beats":[{"t":"這句話出自《荀子》。荀子是戰國末年的大學者，常常和國君談怎麼治理國家。"},{"t":"（示意）天下大亂，遠方的國家打來打去。","mv":[["甲國兵",-0.8,-3.4],["乙國兵",0.8,-3.4]],"fx":[["upset","甲國兵"],["upset","乙國兵"]]},{"who":"國君","t":"別的國家都在打仗，我們也趕快出兵吧！","fx":[["upset","國君"]]},{"who":"荀子","t":"先別急！讓那些凶暴的國家自己去拚個你死我活。","mv":[["荀子",-1.0,0.6]],"fx":[["focus","荀子"]]},{"who":"荀子","t":"我們的軍隊先停住，好好整頓政治、照顧百姓、選用人才。"},{"who":"大臣","t":"這樣慢慢變強，等時機成熟，就沒人比得上我們了！","fx":[["focus",null],["cheer","大臣"]]}],"q":"荀子說，天下大亂時，要先讓軍隊停住不出兵，看清局勢、等待時機。後來指暫時不採取行動、等待時機，是哪個成語？","wrong":[{"w":"興師動眾","by":"國君","line":"興師動眾是派出大批人馬。荀子剛好叫我先別出兵！"},{"w":"勢如破竹","by":"大臣","line":"勢如破竹是一路打勝仗、擋都擋不住。可是我們根本還沒出兵呀！"},{"w":"靜觀其變","by":"荀子","line":"靜觀其變是冷靜觀察情勢變化，意思很接近！不過我特別講「讓軍隊停住」，有一個和兵有關的成語。"}],"hint":"原文作「案兵無動」，「案」就是「按」，止住的意思。","after":"國君聽了荀子的話，讓軍隊安靜待命，一心把國家顧好。","lesson":{"title":"成語小學堂．按兵不動","text":"原文是「偃然案兵無動，以觀夫暴國之相卒也」。荀子認為，先把政治、百姓、人才照顧好，軍隊和名聲自然會成為天下第一。現在指暫時不行動、等待時機，有時也指拖著不做事。","next":"荀子的學生陳囂，有一天問了老師一個關於軍隊的問題……"}},{"id":"e56_06","yr":"《荀子．議兵》","place":"荀子的學堂","scene":"office","music":"palace","cast":[["荀子",0.6,-0.4],["陳囂",-6.5,0.8],["仁義軍",7.0,-2.4],["仁義軍",7.8,-1.6],["百姓",-3.6,-2.6],["百姓",3.6,-2.8]],"beats":[{"t":"這句話出自《荀子》。有一天，荀子的學生陳囂來請教老師。","mv":[["陳囂",-1.2,0.6]]},{"who":"陳囂","t":"老師常說要講仁義、愛護別人，那為什麼還要有軍隊呢？軍隊不就是去搶東西的嗎？","fx":[["say","陳囂"]]},{"who":"荀子","t":"不是你想的那樣。軍隊是用來禁止暴行、除去禍害的，不是用來爭奪的。","fx":[["focus","荀子"]]},{"t":"（示意）荀子說，仁義的軍隊走到哪裡，就像及時雨落下來。","fx":[["focus",null]],"mv":[["仁義軍",2.0,-2.2],["仁義軍#2",2.8,-1.4]]},{"who":"百姓","t":"歡迎！歡迎！","fx":[["cheerAll","百姓"]]},{"who":"荀子","t":"近處的人喜歡他們的善良，遠方的人仰慕他們的品德，不必真的打仗，大家就來歸順了。"}],"q":"荀子說，仁義的軍隊不用真的交戰，兵器的刀刃上連一滴血都沒沾到，遠近的人就來歸順。比喻不經過激烈戰鬥就輕易獲勝，是哪個成語？","wrong":[{"w":"兩敗俱傷","by":"陳囂","line":"兩敗俱傷是兩邊都受傷。老師說的軍隊根本不用打呀！"},{"w":"窮兵黷武","by":"荀子","line":"窮兵黷武是一直發動戰爭、濫用武力。這是我最反對的！"},{"w":"輕而易舉","by":"百姓","line":"輕而易舉是事情很容易做到，有點像。但荀子講的是「兵器沒沾血就獲勝」，有專門的成語。"}],"hint":"「兵」是兵器，「刃」是刀口。","after":"陳囂恍然大悟：原來真正強大的軍隊，是讓人心服口服。","lesson":{"title":"成語小學堂．兵不血刃","text":"原文是「兵不血刃，遠邇來服」，「遠邇」就是遠近。荀子認為，用仁義贏得人心，比打仗更厲害。現在常用來形容輕鬆獲勝，例如對手棄權，我們不費力就晉級了。","next":"回到《孫子兵法》。孫武說，要讓自己先休息夠，再迎戰疲累的敵人。秦國老將王翦就這樣打敗了楚國……"}},{"id":"e56_07","yr":"《孫子．軍爭》、《史記．白起王翦列傳》","place":"秦軍大營","scene":"walls","music":"map","cast":[["王翦",-1.0,0.4],["秦兵",-2.2,-1.0],["秦兵",0.2,-1.4],["秦兵",1.2,-0.4],["楚將",7.0,1.0],["楚兵",7.6,0.0],["楚兵",8.0,1.6]],"beats":[{"t":"這句話出自《孫子兵法》，故事記在《史記》。戰國末年，秦國老將王翦帶著六十萬大軍攻打楚國。"},{"t":"可是王翦到了前線，只叫士兵把營壘守好，就是不出戰。"},{"who":"王翦","t":"大家好好休息，吃飽飯、洗個澡！","fx":[["say","王翦"]]},{"t":"秦兵每天比賽丟石頭、比跳遠，玩得很開心，力氣越養越足。","fx":[["cheerAll","秦兵"]]},{"who":"楚將","t":"秦軍出來打啊！怎麼一直躲著？","mv":[["楚將",3.0,1.0],["楚兵",3.6,0.0],["楚兵#2",4.2,1.4]],"fx":[["upset","楚將"]]},{"t":"楚軍一再挑戰，秦軍都不理。楚軍又累又煩，只好往東撤退。","fx":[["sadAll","楚兵"]],"mv":[["楚將",6.4,1.0],["楚兵",7.0,0.0],["楚兵#2",7.4,1.4]]},{"who":"王翦","t":"時機到了！","fx":[["focus","王翦"]]}],"q":"王翦讓自己的士兵休息、養足精神，等楚軍又累又煩、準備撤退時才出擊。這種策略是哪個成語？","wrong":[{"w":"疲於奔命","by":"楚將","line":"疲於奔命是累得到處奔波……這是在說我們楚軍啦！"},{"w":"好逸惡勞","by":"秦兵","line":"好逸惡勞是愛享樂、討厭工作。我們休息是為了打勝仗，不是偷懶！"},{"w":"養精蓄銳","by":"王翦","line":"養精蓄銳是休息、儲存力量，很接近！但我的計策還要「等敵人累了」再打，用安逸對付疲勞。"}],"hint":"「逸」是安逸、休息，「勞」是疲勞。","after":"秦軍一路追擊，大敗楚軍。","winSad":"楚將","lesson":{"title":"成語小學堂．以逸待勞","text":"《孫子．軍爭》說：「以近待遠，以佚待勞，以飽待飢。」「佚」同「逸」。用休息夠、吃得飽的軍隊，對付遠道而來、又累又餓的敵人。比賽時先保留體力、最後再衝刺，也是這個道理。","next":"《孫子兵法》還說：要在敵人想不到的時候進攻。唐朝的李愬，就挑了一個大雪夜……"}},{"id":"e56_08","yr":"《孫子．計篇》、《資治通鑑》","place":"蔡州城","scene":"walls","music":"night","cast":[["吳元濟",1.4,-2.7,1.3],["李愬",-6.8,0.6],["唐兵",-7.4,-0.4],["唐兵",-7.8,1.2],["唐兵",-8.2,0.2]],"beats":[{"t":"這句話出自《孫子兵法》，故事記在《資治通鑑》。唐朝時，吳元濟占據蔡州，不聽朝廷的命令。"},{"who":"吳元濟","t":"這麼大的風雪，誰會來打仗？我的城最安全了！","fx":[["focus","吳元濟"]]},{"t":"大將李愬卻趁著風雪交加的夜晚，帶兵悄悄出發。","fx":[["focus",null]],"mv":[["李愬",-1.2,0.4],["唐兵",-0.2,-0.6],["唐兵#2",0.8,0.6],["唐兵#3",1.6,-0.2]]},{"who":"李愬","t":"大家安靜，跟我來！","fx":[["say","李愬"]]},{"t":"城邊有個養鵝養鴨的池塘。李愬叫人驚動鵝鴨，嘎嘎的叫聲蓋住了行軍的聲音。"},{"t":"天亮時，唐軍已經進了城。","mv":[["李愬",0.4,-1.6],["唐兵",1.2,-2.0],["唐兵#2",2.4,-1.4],["唐兵#3",-0.6,-2.0]]},{"who":"吳元濟","t":"怎麼可能？他們什麼時候來的？","fx":[["upset","吳元濟"]]}],"q":"李愬故意挑大雪夜、趁敵人沒有防備時進攻，讓吳元濟完全沒想到。像這樣在對方意想不到的時候行動，是哪個成語？","wrong":[{"w":"光明正大","by":"吳元濟","line":"光明正大是坦白、不隱瞞。他們半夜偷偷摸摸地來，哪裡光明正大！"},{"w":"打草驚蛇","by":"唐兵","line":"打草驚蛇是不小心讓對方提早發現、有了防備。我們連腳步聲都用鵝鴨蓋住了！"},{"w":"措手不及","by":"李愬","line":"措手不及是事情突然發生、來不及應付，那是吳元濟的狀況！說我這邊的行動，要用另一個成語。"}],"hint":"「不意」是沒想到。原文是「攻其無備」，後面還接了四個字。","after":"吳元濟只好投降，蔡州又回到朝廷手中。","winSad":"吳元濟","lesson":{"title":"成語小學堂．出其不意","text":"《孫子．計篇》說「兵者，詭道也」，又說「攻其無備，出其不意」。李愬雪夜入蔡州，是唐憲宗時有名的奇襲。現在也能用在好事上，例如出其不意地替媽媽準備生日驚喜。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第十九島．兵法謀略島","eps":[56]},{"key":"i57","name":"詩經歌謠島","short":"詩經島","era":"《詩經》","color":"#4E9A7A","map":{"ground":"#a8c98a","river":"#5aa6d6"},"intro":{"lines":["歡迎來到詩經歌謠島！《詩經》是中國最早的詩歌總集，一共收了三百零五首詩。","這些詩大約是從西周到春秋時代流傳下來的歌，很多本來是可以唱的。","《詩經》分成「風、雅、頌」：風是各地的民歌，雅是宮廷的歌，頌是祭祀的歌。","孔子常用《詩經》教學生，他說：「不學詩，無以言。」","很多我們今天常用的成語，就藏在這些古老的歌裡！"],"people":[["孔子","常用《詩經》教學生的老師"],["周公","相傳寫了〈鴟鴞〉這首詩"],["衛武公","衛國國君，相傳寫了〈抑〉"]]},"stops":[{"id":"e57_01","yr":"《詩經．周南．關雎》","place":"河邊的沙洲","scene":"river","music":"palace","cast":[["君子",-6.5,0.8],["淑女",1.6,-1.2]],"beats":[{"t":"《詩經》的第一首詩叫〈關雎〉。河中的沙洲上，雎鳩鳥關關地叫著。"},{"t":"河邊有一位美好的姑娘，左邊撈、右邊撈，採著水裡的荇菜。","mv":[["淑女",0.4,-1.4]],"fx":[["focus","淑女"]]},{"who":"君子","t":"那位姑娘真美好……真想認識她。","mv":[["君子",-1.4,0.4]],"fx":[["focus","君子"]]},{"t":"可是怎麼追求都追不到。君子不管醒著、睡著，都想著她。","fx":[["focus",null],["sad","君子"]],"mv":[["淑女",7.4,-1.6]]},{"t":"到了晚上，他躺在床上，一下翻到左邊，一下翻到右邊。"},{"who":"君子","t":"唉，怎麼都睡不著呢……","fx":[["sad","君子"]]}],"q":"現代情境：明天就要去畢業旅行了，小華興奮得躺在床上翻來覆去，一直睡不著。可以用〈關雎〉裡的哪個成語來形容？","wrong":[{"w":"高枕無憂","by":"君子","line":"高枕無憂是墊高枕頭、安心睡大覺。我和小華都是睡不著啊！"},{"w":"手忙腳亂","by":"淑女","line":"手忙腳亂是做事慌張。我採荇菜可沒有手忙腳亂，他是晚上睡不著啦！"},{"w":"坐立不安","by":"君子","line":"坐立不安是心裡著急，坐也不是、站也不是，意思很接近！但這裡是躺在床上翻來翻去睡不著。"}],"hint":"「輾」和「轉」都是翻身，「側」是側著身體。","after":"原詩後來說，君子彈琴、敲鐘，想讓姑娘開心。","lesson":{"title":"成語小學堂．輾轉反側","text":"原詩是「悠哉悠哉，輾轉反側」，意思是思念綿綿不斷，翻來覆去睡不著。〈關雎〉是《詩經》第一篇，孔子稱讚它「樂而不淫，哀而不傷」，快樂和憂愁都恰到好處。現在常形容擔心、思念或興奮得睡不著。","next":"〈采葛〉這首詩裡，也有一個想念得不得了的人……"}},{"id":"e57_02","yr":"《詩經．王風．采葛》","place":"長滿葛藤的山坡","scene":"south","music":"palace","cast":[["採葛女",-6.5,0.6],["遠行人",7.0,0.8,0,1,1]],"beats":[{"t":"這首詩叫〈采葛〉。山坡上長滿了葛藤，葛藤的纖維可以織成布。"},{"who":"採葛女","t":"他出遠門好幾天了，什麼時候才回來呢？","mv":[["採葛女",-0.8,0.2]],"fx":[["sad","採葛女"]]},{"t":"她一邊採葛一邊想：才一天沒見面，就好像過了三個月！","fx":[["focus","採葛女"]]},{"t":"後來她去採香蒿，又覺得：一天沒見，好像過了三個秋天！","mv":[["採葛女",1.0,-0.6]]},{"t":"再去採艾草時，她覺得一天好像三年那麼長。","mv":[["採葛女",-0.4,-1.0]]},{"who":"採葛女","t":"時間怎麼過得這麼慢呀……","fx":[["focus",null],["sad","採葛女"]]}],"q":"現代情境：好朋友阿杰轉學才一個星期，小明卻覺得好像過了好幾年，每天都好想他。可以用哪個成語？","wrong":[{"w":"光陰似箭","by":"採葛女","line":"光陰似箭是時間過得飛快。我是覺得時間好慢、好想他呀！"},{"w":"喜新厭舊","by":"遠行人","line":"喜新厭舊是有了新的就討厭舊的。一直想念老朋友，剛好相反！"},{"w":"度日如年","by":"採葛女","line":"度日如年是日子很難熬，有點像！但它多用在痛苦、難過的時候；專門形容「想念一個人」的，是〈采葛〉裡那句。"}],"hint":"原詩：「一日不見，如三秋兮。」","after":"過了幾天，出遠門的人終於回來了，她開心地跑去迎接。","winMv":[["遠行人",1.0,0.2]],"lesson":{"title":"成語小學堂．一日三秋","text":"「三秋」有人說是三個季節，也有人說是三年。不管哪一種，都是說一天不見好像過了好久好久。現在常用來形容非常想念親人或朋友。","next":"接下來這首〈淇奧〉，稱讚一位認真修養自己的君子……"}},{"id":"e57_03","yr":"《詩經．衛風．淇奧》、《論語．學而》","place":"孔子的學堂","scene":"office","music":"palace","cast":[["工匠",2.6,-0.6],["孔子",0.2,-0.6],["子貢",-6.5,0.8]],"beats":[{"t":"〈淇奧〉這首詩稱讚一位君子，說他修養自己，就像工匠一遍又一遍加工骨頭、象牙、玉和石頭。"},{"who":"工匠","t":"骨頭要切，象牙要磋，玉要琢，石頭要磨，越磨越亮！","fx":[["focus","工匠"]]},{"t":"這個比喻，也出現在孔子的學堂裡。有一天，學生子貢來問老師。","fx":[["focus",null]],"mv":[["子貢",-1.2,0.4],["工匠",7.4,-0.8]]},{"who":"子貢","t":"老師，一個人貧窮卻不巴結人，富有卻不驕傲，這樣好嗎？","fx":[["say","子貢"]]},{"who":"孔子","t":"不錯。但還比不上貧窮卻快樂、富有卻愛好禮節的人。","fx":[["say","孔子"]]},{"who":"子貢","t":"啊！《詩經》說「如切如磋，如琢如磨」，就是好了還要更好的意思吧？","fx":[["focus","子貢"]]},{"who":"孔子","t":"子貢啊，現在可以和你談《詩經》了！","fx":[["focus",null],["cheer","孔子"]]}],"q":"就像工匠把骨角玉石一遍又一遍加工，同學們互相研究、討論功課，一起進步，可以用哪個成語？","wrong":[{"w":"閉門造車","by":"子貢","line":"閉門造車是關起門自己做、不跟別人交流，剛好相反！"},{"w":"粗製濫造","by":"工匠","line":"粗製濫造是隨便做做、品質很差。我可是一遍又一遍細細加工！"},{"w":"精益求精","by":"孔子","line":"精益求精是好了還要更好，子貢剛才就想到這一層，意思很接近！但這個成語是從加工骨角玉石來的，還有「互相討論」的意思。"}],"hint":"骨頭叫「切」，象牙叫「磋」，玉叫「琢」，石頭叫「磨」。","after":"孔子說：「告訴你過去的事，你就能想到未來的事。」稱讚子貢能舉一反三。","lesson":{"title":"成語小學堂．切磋琢磨","text":"子貢和孔子的對話記在《論語．學而》。古人說「骨謂之切，象謂之磋，玉謂之琢，石謂之磨」，加工越細，成品越美。現在用來比喻朋友、同學互相研究討論，一起進步。","next":"〈鴟鴞〉這首詩，是一隻鳥媽媽說的話……"}},{"id":"e57_04","yr":"《詩經．豳風．鴟鴞》","place":"桑樹上的鳥巢","scene":"south","music":"map","cast":[["鳥媽媽",-0.6,-0.4],["貓頭鷹",7.0,-1.0],["小鳥",0.8,-1.4,0,1,1]],"beats":[{"t":"〈鴟鴞〉這首詩，是用一隻鳥媽媽的口吻寫的。「鴟鴞」就是貓頭鷹。"},{"who":"鳥媽媽","t":"貓頭鷹啊貓頭鷹！你已經抓走我的孩子，不要再毀了我的家！","mv":[["貓頭鷹",2.2,-0.6]],"fx":[["upset","鳥媽媽"]]},{"t":"貓頭鷹飛走了。鳥媽媽辛辛苦苦養育孩子，她抬頭看看天空：烏雲還沒來。","mv":[["貓頭鷹",7.6,-1.2],["小鳥",0.8,-1.2]]},{"who":"鳥媽媽","t":"趁天還沒下雨，快把家修好！","fx":[["focus","鳥媽媽"]]},{"t":"她啄來桑樹根的皮，把鳥巢的門窗一圈一圈綁得牢牢的。","fx":[["focus",null]],"mv":[["鳥媽媽",1.6,-0.8]]},{"t":"沒多久，大雨嘩啦啦地下起來，鳥巢卻一點也不怕。","mv":[["鳥媽媽",0.2,-1.0]],"fx":[["cheer","小鳥"]]}],"q":"鳥媽媽趁天晴先把巢綁牢，下雨就不怕了。現代情境：颱風要來了，家人先準備好水、食物和手電筒。這種事先做好準備，可以用哪個成語？","wrong":[{"w":"臨渴掘井","by":"小鳥","line":"臨渴掘井是口渴了才挖井，太慢了！媽媽是提早準備好的。"},{"w":"得過且過","by":"鳥媽媽","line":"得過且過是過一天算一天，不為以後打算。我可不是這樣！"},{"w":"防患未然","by":"貓頭鷹","line":"防患未然也是事先防止禍害，意思很接近！但這首詩講的是「趁還沒下雨、先把門窗綁牢」，有專門的成語。"}],"hint":"「綢繆」是用繩子纏繞、綁緊。","after":"雨停了，鳥巢還是好好的，小鳥平平安安。","lesson":{"title":"成語小學堂．未雨綢繆","text":"原詩說「迨天之未陰雨，徹彼桑土，綢繆牖戶」：趁天還沒陰雨，剝下桑根的皮，纏緊門窗。相傳這首詩是周公寫的，用鳥媽媽保護家，比喻守護國家的辛苦。","next":"《詩經》裡還有一句話，教人做事要非常小心……"}},{"id":"e57_05","yr":"《詩經．小雅．小旻》、《論語．泰伯》","place":"曾子的家","scene":"house","music":"night","cast":[["曾子",0.4,-0.6],["學生",-6.5,0.6],["學生",6.5,0.6]],"beats":[{"t":"《詩經．小雅》說：做事要非常小心，就像站在深深的水潭邊，又像走在薄薄的冰上。"},{"t":"孔子的學生曾子，一輩子都把這句詩記在心裡。有一天，曾子生了重病。","fx":[["sad","曾子"]]},{"who":"曾子","t":"學生們，過來看看我的腳，再看看我的手。","mv":[["學生",-1.2,0.4],["學生#2",1.8,0.4]]},{"who":"學生","t":"老師的手腳都好好的，從來沒有受過傷。","fx":[["say","學生"]]},{"who":"曾子","t":"我一輩子都像踩在薄冰上那樣小心，好好保護爸媽給我的身體。","fx":[["focus","曾子"]]},{"who":"學生#2","t":"原來老師這麼謹慎，是為了孝順爸媽！","fx":[["focus",null]]}],"q":"像走在薄冰上一樣，因為害怕出錯而非常小心謹慎。例如：弟弟端著一碗熱湯，＿＿地慢慢走，深怕灑出來。空格要填哪個成語？","wrong":[{"w":"大搖大擺","by":"學生","line":"大搖大擺是走路神氣、毫不在乎。端熱湯這樣走，一定會灑出來！"},{"w":"粗心大意","by":"學生#2","line":"粗心大意是不小心。老師一輩子都很小心呀！"},{"w":"小心翼翼","by":"曾子","line":"小心翼翼也是很小心，意思非常接近！但《詩經》那句還帶著「害怕、發抖」的感覺，是一個疊字成語。"}],"hint":"這是一個疊字成語：「戰」是發抖，「兢」是小心謹慎。","after":"學生們聽了，也學著像曾子一樣，謹慎地愛惜自己。","lesson":{"title":"成語小學堂．戰戰兢兢","text":"原詩是「戰戰兢兢，如臨深淵，如履薄冰」，「履」是踩。曾子的故事記在《論語．泰伯》，他認為愛惜身體是孝順父母的開始。現在用來形容非常小心謹慎、很怕出錯的樣子。","next":"《詩經》裡還有一句話，形容一個人每天都很勤勞……"}},{"id":"e57_06","yr":"《詩經．小雅．小宛》等","place":"鄉下的小院子","scene":"house","music":"map","cast":[["小明",-6.5,0.6],["母親",6.5,0.8]],"beats":[{"t":"《詩經》有好幾首詩都提到同一句話，用來勉勵人每天勤奮。（示意）我們來看看小明的一天。"},{"who":"小明","t":"天亮了，起床囉！","mv":[["小明",-1.0,0.2]],"fx":[["cheer","小明"]]},{"t":"一大早，小明就灑水、掃地，把院子打掃得乾乾淨淨。","mv":[["小明",1.4,-0.6]]},{"who":"小明","t":"掃乾淨，心情好！","mv":[["小明",-0.6,-0.8]]},{"t":"白天認真上學，晚上還讀書讀到很晚才去睡覺。","fx":[["focus","小明"]]},{"who":"母親","t":"孩子，你從早忙到晚，真勤勞！","mv":[["母親",1.4,0.6]],"fx":[["focus",null],["say","母親"]]}],"q":"《詩經．小宛》勉勵人：早早起床、很晚才睡，每天努力，不要辜負生養你的父母。形容早起晚睡、非常勤奮，是哪個成語？","wrong":[{"w":"遊手好閒","by":"母親","line":"遊手好閒是整天閒晃、不做正事。我家小明可不是這樣！"},{"w":"日上三竿","by":"小明","line":"日上三竿是太陽升得好高了，形容起得很晚。我天一亮就起床啦！"},{"w":"廢寢忘食","by":"母親","line":"廢寢忘食是專心到忘了睡覺吃飯，意思很接近！但詩裡說的是「早早起床、很晚才睡」，天天這樣勤勞。"}],"hint":"「夙」是早，「興」是起床，「寐」是睡覺。","after":"小明說：「爸爸媽媽辛苦養我，我也要好好努力！」","lesson":{"title":"成語小學堂．夙興夜寐","text":"這句話在《詩經》出現好幾次：〈小宛〉勉勵人不要辜負父母，〈抑〉講早起灑掃庭院，〈氓〉裡的妻子說自己每天早起晚睡做家事。現在用來形容非常勤勞。","next":"〈抑〉這首詩裡，還藏著一個和水果有關的成語……"}},{"id":"e57_07","yr":"《詩經．大雅．抑》","place":"衛國宮殿","scene":"palace","music":"palace","cast":[["衛武公",0.6,-0.2],["大臣",2.4,0.8],["鄰居",7.0,1.0,0,1,1],["小華",-6.5,0.8,0,1,1]],"beats":[{"t":"相傳〈抑〉這首詩，是衛國國君衛武公寫的。他九十多歲了，還是很虛心。"},{"who":"衛武公","t":"我年紀大了，如果做錯了什麼，請大家一定要提醒我！","fx":[["say","衛武公"]]},{"who":"大臣","t":"國君這麼謙虛，真是我們的好榜樣。","fx":[["cheer","大臣"]]},{"t":"衛武公寫詩勉勵自己謹慎守禮。詩裡有一句：「投我以桃，報之以李。」","fx":[["focus","衛武公"]]},{"who":"鄰居","t":"（示意）小華，請你吃桃子！","fx":[["focus",null]],"mv":[["鄰居",1.6,1.0],["小華",-0.8,0.8]]},{"who":"小華","t":"謝謝你！那我送你一籃李子！","fx":[["cheer","小華"]]}],"q":"別人送我桃子，我就回送李子。比喻朋友之間友好往來、互相贈送，是哪個成語？","wrong":[{"w":"忘恩負義","by":"大臣","line":"忘恩負義是忘了別人對你的好。小華馬上回禮，剛好相反！"},{"w":"李代桃僵","by":"鄰居","line":"李代桃僵是李樹代替桃樹受苦，比喻代人受過。雖然也有桃和李，意思完全不一樣喔！"},{"w":"禮尚往來","by":"衛武公","line":"禮尚往來也是互相回禮，意思很接近！但它出自《禮記》；我詩裡講的是送桃子、回李子。"}],"hint":"原詩：「投我以桃，報之以李。」「報」是回報。","after":"鄰居笑咪咪地收下李子，兩家人的感情更好了。","lesson":{"title":"成語小學堂．投桃報李","text":"相傳衛武公九十五歲還請大臣隨時勸告他，這件事記在《國語》。〈抑〉的意思是：你對人好，別人也會用好來回報你。現在常用來形容禮尚往來、互相贈送。","next":"最後，《詩經》的〈大序〉要告訴我們：詩歌是怎麼來的？"}},{"id":"e57_08","yr":"《詩經．大序》","place":"豐收的稻田","scene":"south","music":"final","cast":[["農夫",-0.8,0.2],["農家女",1.4,-0.4],["小童",0.2,-1.6]],"beats":[{"t":"《詩經》前面有一篇〈大序〉，告訴我們詩歌是怎麼來的。我們來看一個豐收的村子。"},{"who":"農夫","t":"今年的稻子豐收了！","fx":[["say","農夫"]]},{"t":"心裡感動，就用話說出來；說了還不夠，就忍不住讚嘆。"},{"who":"農家女","t":"哇——真是太好了！","fx":[["cheer","農家女"]]},{"who":"小童","t":"讚嘆還不夠，那就唱歌吧！豐收囉～啦啦啦～","fx":[["cheer","小童"]]},{"t":"唱歌還是不夠，大家不知不覺揮起手、跳起腳來！","fx":[["cheer","農夫"],["burst","農夫","#e8b84f"]]}],"q":"〈大序〉說，心裡高興到說也說不完、唱也唱不夠，就會不知不覺揮動雙手、跳動雙腳。形容高興到了極點，是哪個成語？","wrong":[{"w":"垂頭喪氣","by":"小童","line":"垂頭喪氣是失望得低下頭。今年大豐收，我們開心都來不及！"},{"w":"張牙舞爪","by":"農家女","line":"張牙舞爪是露出牙齒、揮動爪子，樣子很兇。我們是開心，不是兇啦！"},{"w":"歡天喜地","by":"農夫","line":"歡天喜地也是非常高興，意思很接近！但〈大序〉特別講到手和腳的動作。"}],"hint":"原文：「不知手之舞之、足之蹈之也。」","after":"村子裡的人一起唱歌跳舞，這些歌後來就變成了詩。","lesson":{"title":"成語小學堂．手舞足蹈","text":"〈大序〉說：「在心為志，發言為詩。」詩歌就是把心裡的感情說出來、唱出來。現在用「手舞足蹈」形容非常高興的樣子。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第二十島．詩經歌謠島","eps":[57]},{"key":"i90","line":"island","name":"知音與良言","short":"知音島","era":"《列子》《莊子》等古書","color":"#3E8E7E","map":{"ground":"#a6c98a","river":"#4f9fd8"},"intro":{"lines":["這座島收集了各種古書裡的寓言、詩句和名言，主題是「和人相處的學問」。","《列子》《莊子》是先秦的古書，用奇妙的寓言講道理；唐詩〈遊子吟〉寫出了媽媽的愛。","還有晉朝、東漢、三國文人留下的名言，提醒我們說話要小心、做人要有骨氣、凡事要先想到危險。","什麼是真正的知音？怎樣才算好好說話？一起來看看吧！"],"people":[["伯牙","古代琴師，鍾子期是他的知音"],["莊子","戰國時代的思想家，寫了《莊子》"],["孟郊","唐朝詩人，寫下〈遊子吟〉"],["傅玄","晉朝學者，寫〈口銘〉提醒自己"]]},"stops":[{"id":"e10_02","yr":"《列子．湯問》","place":"江邊的山崖","scene":"river","music":"palace","cast":[["伯牙",-0.8,0.0],["鍾子期",6.8,1.0]],"beats":[{"t":"古時候有一位琴師叫伯牙，琴彈得非常好。可是他常常覺得，沒有人真正聽得懂他的琴聲。","fx":[["focus","伯牙"]]},{"t":"一天，伯牙在江邊彈琴。一個叫鍾子期的人走了過來，停下腳步，靜靜地聽。","mv":[["鍾子期",1.8,0.6]],"fx":[["focus",null]]},{"t":"伯牙心裡想著高高的大山，手指撥動琴弦。"},{"who":"鍾子期","t":"好啊！琴聲巍峨高大，好像泰山一樣！","fx":[["cheer","鍾子期"]]},{"t":"伯牙嚇了一跳。他換個念頭，心裡想著奔流的江水，又彈了一曲。","fx":[["upset","伯牙"]]},{"who":"鍾子期","t":"好啊！浩浩蕩蕩，好像長江大河！","fx":[["say","鍾子期"]]},{"who":"伯牙","t":"我心裡想什麼，你全都聽出來了！你真是懂我的人！","fx":[["cheer","伯牙"],["burst","伯牙","#e8b84f"]]}],"q":"伯牙心裡想著大山和江水，鍾子期都從琴聲裡聽了出來。後來用哪個成語比喻知己、知音，也形容樂曲高妙？","wrong":[{"w":"對牛彈琴","by":"鍾子期","line":"對牛彈琴是對聽不懂的人講道理。我可是一聽就懂伯牙的心意！"},{"w":"山窮水盡","by":"伯牙","line":"山窮水盡是走投無路。我的琴聲裡有山有水，可不是走投無路啊！"},{"w":"志同道合","by":"伯牙","line":"志同道合是志向相同的朋友，意思有點接近！不過我們的友情，是從琴聲裡的山和水開始的。"}],"hint":"伯牙的琴聲裡，一次是大山，一次是江水。","after":"伯牙放下琴，感嘆地說：「你聽到的，就跟我心裡想的一模一樣！」","lesson":{"title":"成語小學堂．高山流水","text":"後來鍾子期過世，伯牙摔破了琴、剪斷琴弦，一輩子不再彈琴，因為再也沒有知音了（見《呂氏春秋》）。現在我們用「知音」稱呼最懂自己的朋友。","next":"真正的好朋友，不一定要說很多話。莊子的書裡，有四個人只是互相看一眼，就懂了彼此……"}},{"id":"e10_06","yr":"《莊子．大宗師》","place":"竹林裡","scene":"south","music":"palace","cast":[["子祀",-1.2,0.0],["子輿",0.4,-0.8],["子犁",6.8,0.8],["子來",7.6,1.4]],"beats":[{"t":"這個故事出自《莊子》：子祀、子輿、子犁、子來四個人，常常聚在一起聊人生的大道理。","fx":[["focus",null]]},{"t":"這天，子犁和子來也到了竹林裡。","mv":[["子犁",1.8,0.4],["子來",2.6,1.3]]},{"who":"子祀","t":"誰能明白，生和死就像頭和尾巴，本來就連在同一個身體上，誰就是我的朋友！","fx":[["say","子祀"],["focus","子祀"]]},{"who":"子輿","t":"這也正是我心裡想的！","fx":[["cheer","子輿"]]},{"t":"四個人你看我、我看你，一句話也不用多說，同時哈哈大笑起來。","fx":[["focus",null],["cheer","子犁"],["cheer","子來"],["cheer","子祀"]]},{"who":"子來","t":"原來我們想的都一樣！","fx":[["say","子來"]]}],"q":"四個人心意相合，心裡沒有一點不同意，成了非常要好的朋友。這種朋友可以叫做什麼？","wrong":[{"w":"狐群狗黨","by":"子來","line":"狐群狗黨是一群做壞事的壞朋友！我們聊的是人生大道理耶。"},{"w":"萍水相逢","by":"子犁","line":"萍水相逢是偶然遇見的陌生人。我們可是常常聚在一起的老朋友！"},{"w":"一見如故","by":"子祀","line":"一見如故是第一次見面就像老朋友，意思有點接近！不過這裡的重點是：心裡沒有一點違逆。"}],"hint":"「莫」是沒有，「逆」是違背、不同意。","after":"四個人從此成了好朋友，一起面對人生裡的各種事情。","lesson":{"title":"成語小學堂．莫逆之交","text":"「莫逆」就是心裡沒有一點不同意。《莊子》是戰國時代莊周寫的書，裡面有很多想像力豐富的寓言，用故事來講道理。","next":"莊子還講過一個兩條魚的故事，牠們遇到了大麻煩……"}},{"id":"e10_07","yr":"《莊子．大宗師》","place":"乾掉的泉水邊","scene":"road","music":"night","cast":[["莊子",-1.6,-1.4],["學生",-0.2,-1.9],["鯉魚",0.8,0.6],["鯽魚",2.2,1.0]],"beats":[{"t":"莊子對學生說了一個故事：有一口泉水乾掉了，兩條魚被困在乾乾的泥地上。","fx":[["focus",null],["sad","鯉魚"]]},{"who":"鯽魚","t":"好乾啊……我快不能呼吸了。","fx":[["sad","鯽魚"]]},{"t":"鯉魚靠過去，吐出一口濕濕的氣，吹到鯽魚身上。","mv":[["鯉魚",1.5,0.8]],"fx":[["focus","鯉魚"]]},{"who":"鯉魚","t":"我用口水幫你沾濕身體，我們一起撐下去！","fx":[["say","鯉魚"]]},{"t":"鯽魚也吐出泡沫，讓鯉魚保持濕潤。兩條魚就這樣互相幫忙。","fx":[["cheer","鯽魚"]]},{"who":"學生","t":"老師，牠們好感人啊！","fx":[["focus",null],["say","學生"]]}],"q":"兩條魚困在乾地上，用口沫互相沾濕對方，一起度過難關。後來比喻在困難中用微小的力量互相幫助，叫做什麼？","wrong":[{"w":"如魚得水","by":"鯉魚","line":"如魚得水是魚到了水裡，非常自在。我們現在可是一滴水都沒有！"},{"w":"渾水摸魚","by":"鯽魚","line":"渾水摸魚是趁亂撈好處。我們是在互相幫忙，不是佔便宜！"},{"w":"同舟共濟","by":"莊子","line":"同舟共濟是坐同一條船、同心渡河，意思很接近！不過這兩條魚靠的是一點點口沫。"}],"hint":"「濡」是沾濕，「沫」是口沫。","after":"莊子接著說：與其在乾地上互相吐口沫，還不如回到大江大湖裡，自由自在地游，彼此忘記。","lesson":{"title":"成語小學堂．相濡以沫","text":"莊子原本的意思，是自在的江湖比困境好得多。後來大家記住的，是兩條魚在困難中互相扶持的溫暖，常用來形容患難中的家人、朋友或鄰居。","next":"說到最溫暖的扶持，就想到媽媽的愛。唐朝詩人孟郊要出遠門了……"}},{"id":"e11_07","yr":"唐．孟郊〈遊子吟〉","place":"孟郊的家","scene":"house","music":"night","cast":[["孟母",-0.6,-0.4],["孟郊",6.8,1.2]],"beats":[{"t":"唐朝詩人孟郊要出遠門了。出發前一晚，媽媽坐在燈下，一針一線替他縫衣服。","fx":[["focus","孟母"]]},{"who":"孟母","t":"針腳要縫密一點，衣服才耐穿……他這一去，不知道多久才回來。","fx":[["sad","孟母"]]},{"t":"孟郊走進屋裡，看見媽媽還在縫。","mv":[["孟郊",1.2,0.6]],"fx":[["focus",null]]},{"who":"孟郊","t":"娘，這麼晚了，您快休息吧！","fx":[["say","孟郊"]]},{"who":"孟母","t":"快好了，穿上試試看。","fx":[["say","孟母"]]},{"t":"孟郊穿上新衣，心裡又暖又酸。他想：一根小草，怎麼報答得了整個春天的陽光呢？","fx":[["sad","孟郊"],["focus","孟郊"]]}],"q":"孟郊覺得自己像一根小草，永遠報答不了像春天陽光一樣的母愛。後來用哪個成語，比喻父母恩情深重、子女難以報答？","wrong":[{"w":"春風得意","by":"孟郊","line":"春風得意是考試或事業很順利、很得意。我現在是捨不得娘啊！"},{"w":"草木皆兵","by":"孟母","line":"草木皆兵是嚇得看到草木都以為是敵兵。我們家可沒有在打仗！"},{"w":"飲水思源","by":"孟郊","line":"飲水思源是喝水時想到水源、不忘本，意思有點接近！不過詩裡說的是小草和春天的陽光。"}],"hint":"詩裡問：小小的草心，報答得了三個月春天的陽光嗎？","after":"孟郊把這份心情寫成〈遊子吟〉：「慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉！」","lesson":{"title":"成語小學堂．寸草春暉","text":"「寸草」是小草，比喻子女的心意；「三春暉」是整個春天的陽光，比喻母愛。〈遊子吟〉是很多人最早背的感恩詩，母親節卡片上也常看到這個成語。","next":"家人之間要互相體貼，和別人相處，嘴巴也要管好。從前有個小徒弟，最愛到處說秘密……"}},{"id":"e23_05","yr":"唐．《法苑珠林》","place":"村子裡","scene":"house","music":"map","cast":[["師父",-1.0,-0.6],["小徒弟",1.2,0.6],["王大嬸",6.8,1.0],["李大叔",-6.8,1.2]],"beats":[{"t":"這是一個寓言：從前有個小徒弟，聽到什麼秘密，都忍不住到處說。","fx":[["focus","小徒弟"]]},{"who":"小徒弟","t":"王大嬸，偷偷跟你說喔，李大叔說你……","mv":[["王大嬸",2.6,0.8]],"fx":[["say","小徒弟"]]},{"t":"話傳來傳去，越傳越離譜。王大嬸和李大叔吵了起來！","mv":[["李大叔",0.4,1.6]],"fx":[["focus",null],["upset","王大嬸"],["upset","李大叔"]]},{"who":"王大嬸","t":"你怎麼在背後說我壞話！"},{"who":"李大叔","t":"我哪有這樣說！"},{"t":"師父拿出一個瓶子，把瓶蓋緊緊蓋上，倒過來搖一搖，一滴水也沒漏出來。","fx":[["focus","師父"]]},{"who":"師父","t":"嘴巴要像這個瓶子。不該說的話，一句也別漏出去。","fx":[["say","師父"]]}],"q":"師父要小徒弟說話謹慎、保守秘密，嘴巴要像封緊的瓶子一樣。這是哪個成語？","wrong":[{"w":"口若懸河","by":"小徒弟","line":"口若懸河是很會說話、說個不停……這正是我以前的毛病啦！"},{"w":"守株待兔","by":"王大嬸","line":"守株待兔是坐著等好運。師父是要你管好嘴巴！"},{"w":"三緘其口","by":"師父","line":"三緘其口是嘴巴封了好幾層、不隨便說話，意思很接近！不過我拿的道具是瓶子喔。"}],"hint":"看看師父手上的道具：蓋得緊緊的……","after":"小徒弟點點頭。從此別人告訴他的秘密，他一個字都不說出去。","lesson":{"title":"成語小學堂．守口如瓶","text":"這句話出自唐代的佛教書《法苑珠林》：「防意如城，守口如瓶。」意思是守住心念像守城，管住嘴巴像封瓶口。現在常用來稱讚很會保守秘密的人。","next":"晉朝有個叫傅玄的人，也特別寫了一篇文章，提醒自己管好嘴巴……"}},{"id":"e23_06","yr":"晉．傅玄〈口銘〉","place":"傅玄的書房","scene":"study","music":"night","cast":[["傅玄",-1.2,-1.6],["書童",6.8,1.0]],"beats":[{"t":"晉朝有一位學者叫傅玄。他常常提醒自己：說話一定要小心。","fx":[["focus","傅玄"]]},{"who":"書童","t":"老爺，這麼晚了，您還在寫什麼？","mv":[["書童",0.6,-0.4]],"fx":[["focus",null]]},{"who":"傅玄","t":"我要寫一篇〈口銘〉，提醒自己管好這張嘴。","fx":[["say","傅玄"]]},{"t":"「銘」是用來警惕自己的短文。傅玄寫道：小小的螞蟻洞，能讓河堤崩壞；細細的漏水洞，能讓山倒下來。"},{"who":"傅玄","t":"亂吃東西，病就從嘴巴進來；亂說話，災禍也會從嘴巴跑出去。","fx":[["say","傅玄"],["focus","傅玄"]]},{"who":"書童","t":"原來一句話，也能惹出大麻煩！","fx":[["upset","書童"]]}],"q":"小華在班上亂開同學的玩笑，結果吵了一大架，還被老師叫去談話。這正像傅玄提醒的哪句話？","wrong":[{"w":"金玉良言","by":"書童","line":"金玉良言是像金子玉石一樣寶貴的好話。亂開玩笑可不是好話！"},{"w":"病從口入","by":"傅玄","line":"病從口入是我那句話的前半句，說的是亂吃東西會生病。小華是說錯話，不是吃錯東西！"},{"w":"言多必失","by":"傅玄","line":"言多必失是話說多了一定會出錯，意思很接近！不過在我的〈口銘〉裡，和「病從口入」配成一對的是另一句。"}],"hint":"前半句是「病從口入」，後半句呢？","after":"傅玄還寫：嘴巴一開一關，就是平安和危險的關鍵。說話前，先想一想！","lesson":{"title":"成語小學堂．禍從口出","text":"「病從口入，禍從口出」出自傅玄的〈口銘〉，後來變成大家都會說的俗語。它提醒我們：吃東西要注意衛生，說話更要先想後說。","next":"除了說話，古代文人還有一個老毛病：總覺得自己寫得最好……"}},{"id":"e23_08","yr":"曹丕《典論．論文》","place":"魏國的宮廷","scene":"palace","music":"palace","cast":[["曹丕",-0.4,-0.8],["文人",6.8,0.8],["文人",7.6,1.6]],"beats":[{"t":"三國時代，曹操的兒子曹丕很喜歡文學，身邊聚集了許多會寫文章的文人。","fx":[["focus","曹丕"]]},{"t":"這天，兩位文人帶著自己的文章來了。","mv":[["文人",2.0,0.6],["文人#2",-1.0,1.2]],"fx":[["focus",null]]},{"who":"文人","t":"我這篇文章，天下第一！","fx":[["cheer","文人"]]},{"who":"文人#2","t":"他寫的？普通啦！我的才是最好的！","fx":[["upset","文人#2"]]},{"who":"曹丕","t":"文人互相看不起，從古代就是這樣。大家只看見自己的長處，看不見別人的好。","fx":[["say","曹丕"]]},{"who":"曹丕","t":"俗話說：自己家裡的破掃帚，也當成值千金的寶貝。","fx":[["focus","曹丕"]]}],"q":"曹丕引用俗話：家裡的破掃帚，自己也當千金寶貝。後來用哪個成語，比喻東西雖然不好，自己卻很珍惜？","wrong":[{"w":"掃地出門","by":"文人","line":"掃地出門是被趕出家門、什麼都沒得拿。曹丕可沒有要趕我們走！"},{"w":"一擲千金","by":"文人#2","line":"一擲千金是花大錢一點都不心疼。我們說的是破掃帚，不是撒錢！"},{"w":"愛不釋手","by":"曹丕","line":"愛不釋手是喜歡到捨不得放下，意思有點像！但這句強調的是：東西不怎麼樣，自己卻當寶貝。"}],"hint":"「敝」是破舊，掃地的舊東西，自己卻好珍惜。","after":"兩位文人不好意思地笑了：「其實你寫得也很好！」「你也是！」","lesson":{"title":"成語小學堂．敝帚自珍","text":"「家有敝帚，享之千金」最早記在東漢的《東觀漢記》，曹丕在〈論文〉裡用它批評文人只看見自己的好。現在常當作謙虛話，例如說自己的作品「雖然不好，但我很珍惜」。","next":"有些人珍惜的不是東西，而是自己的品格。東漢有個讀書人叫馮衍……"}},{"id":"e24_03","yr":"東漢．馮衍〈顯志賦〉","place":"馮衍的家鄉","scene":"cottage","music":"palace","cast":[["馮衍",-0.6,-0.4],["鄉人",6.8,1.0],["官員",3.4,-1.2]],"beats":[{"t":"東漢有個讀書人叫馮衍，很有才學，說話正直，卻一直不被重用，只好回到家鄉。","fx":[["focus","馮衍"]]},{"t":"鄉裡有些人為了升官發財，忙著帶禮物去巴結有權勢的大官。","mv":[["鄉人",2.4,0.2]],"fx":[["focus",null]]},{"who":"鄉人","t":"大人，這是一點小心意……","fx":[["say","鄉人"],["cheer","官員"]]},{"who":"鄉人","t":"馮先生，你也去送點禮吧，說不定就能當大官！","mv":[["鄉人",0.9,0.6]]},{"who":"馮衍","t":"不。我寧可過清苦的日子，也不放棄做人的原則。","fx":[["say","馮衍"],["focus","馮衍"]]},{"t":"馮衍寫下一篇〈顯志賦〉，說自己問心無愧、志向不改，並且敬仰古代賢人高尚的風範。"}],"q":"馮衍不肯為了富貴巴結權貴，敬佩古代賢人高尚的風範。後來用哪個成語，形容高尚的品格和堅定的節操？","wrong":[{"w":"見風轉舵","by":"馮衍","line":"見風轉舵是看情勢改變立場，那正是我最看不起的做法！"},{"w":"弱不禁風","by":"鄉人","line":"弱不禁風是身體虛弱到風一吹就倒。馮先生身體好得很，骨氣更硬！"},{"w":"剛正不阿","by":"馮衍","line":"剛正不阿是剛強正直、不討好別人，意思很接近！不過答案裡要有「高尚的風範」和「堅貞的節操」。"}],"hint":"「風」是風範，「節」是節操。","after":"馮衍一生沒有當上大官，但他的文章流傳下來，讓後人看見了他的骨氣。","lesson":{"title":"成語小學堂．高風亮節","text":"這個成語由兩部分組成：「高風」出自馮衍的〈顯志賦〉，「亮節」出自晉朝陸雲的文章。現在常用來稱讚一生清廉、正直的人。","next":"有品格的人，也常常有遠見，能早一步看見危險。有一位客人，就這樣提醒過朋友……"}},{"id":"e30_01","yr":"漢．劉向《說苑》","place":"朋友家的廚房","scene":"house","music":"map","cast":[["主人",-0.6,-0.4],["客人",6.8,1.0],["鄰居",-6.8,1.0],["鄰居",-7.6,0.4]],"beats":[{"t":"這是一個寓言：有位客人到朋友家作客，看見廚房的煙囪是直的，灶旁邊還堆滿了柴火。","mv":[["客人",1.6,0.6]]},{"who":"客人","t":"把煙囪改成彎的，柴火搬遠一點，不然會失火喔！","fx":[["say","客人"],["focus","客人"]]},{"t":"主人一句話也不回答，心想：哪有這麼嚴重？客人只好告辭了。","mv":[["客人",7.5,1.0]],"fx":[["focus",null]]},{"t":"沒過多久，主人家真的失火了！","fx":[["fire",1.8,-1.0],["upset","主人"]]},{"t":"鄰居們趕來幫忙，大家一起提水，總算把火撲滅。","mv":[["鄰居",0.8,-0.2],["鄰居#2",2.2,0.4]]},{"who":"主人","t":"多謝大家！我殺牛擺酒，請被火燒傷的人坐上位！","fx":[["say","主人"],["cheerAll","鄰居"]]},{"t":"可是，當初提醒他改煙囪、搬柴火的那位客人，卻沒有被請來。","fx":[["focus","主人"]]}],"q":"如果主人當初聽客人的話，把煙囪改彎、把柴火搬遠，就不會失火了。這種事先防範、避免災禍的做法，叫做什麼？","wrong":[{"w":"火上加油","by":"主人","line":"火上加油是讓事情更糟糕。我家的火已經夠大了啦！"},{"w":"隔岸觀火","by":"鄰居","line":"隔岸觀火是站在旁邊看熱鬧、不幫忙。我們可是拚命提水救火！"},{"w":"未雨綢繆","by":"主人","line":"未雨綢繆是下雨前先修好門窗，也是事先準備，意思很接近！不過客人提醒的是煙囪和柴火。"}],"hint":"「突」是煙囪，「薪」是柴火。","after":"有人說：要是主人早聽客人的話，不必花錢殺牛擺酒，也根本不會失火。","lesson":{"title":"成語小學堂．曲突徙薪","text":"這個故事記在漢代劉向的《說苑》。西漢時有人上書給漢宣帝，用這個故事替早就提醒霍家要小心的徐福說話。它告訴我們：事先防範，比事後補救更重要。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十一島．知音與良言","eps":[10,11,23,24,30]},{"key":"i91","line":"island","name":"奇人異事錄","short":"奇人島","era":"《列子》《漢書》等古書","color":"#B0603A","map":{"ground":"#b9c67e","river":"#4f9fd8"},"intro":{"lines":["這座島住著各種奇人：會看馬的伯樂、歌聲讓雲停下來的秦青、會做歌舞人偶的偃師……","很多故事出自《列子》。《列子》相傳是戰國時代列禦寇的書，裡面有好多神奇的寓言。","還有《漢書》《史記》、唐朝的傳奇故事，以及古代宮廷裡唱的歌。","準備好了嗎？一起去認識這些奇人奇事！"],"people":[["伯樂","最會看馬的人"],["秦青","歌聲嘹亮的歌唱老師"],["偃師","會做歌舞人偶的巧手工匠"],["周穆王","周朝天子，駕著駿馬往西方巡遊"]]},"stops":[{"id":"e30_02","yr":"明．楊慎的筆記（原句見《漢書》）","place":"城外的田野","scene":"road","music":"map","cast":[["伯樂",-0.8,-1.0],["伯樂的兒子",6.8,1.0],["蟾蜍",2.2,-0.8,0,1]],"beats":[{"t":"伯樂是最會看馬的人。他把看馬的方法，寫成一本《相馬經》。","fx":[["focus","伯樂"]]},{"who":"伯樂","t":"好馬的額頭高高隆起，眼睛又大又亮，蹄子又厚又圓。","fx":[["say","伯樂"]]},{"t":"伯樂的兒子把書背得滾瓜爛熟，就帶著書出門找千里馬。","mv":[["伯樂的兒子",0.8,0.6]],"fx":[["focus",null]]},{"who":"伯樂的兒子","t":"額頭高、眼睛大……咦，草叢裡那是什麼？","fx":[["focus","蟾蜍"]]},{"t":"他看到一隻大蟾蜍，額頭鼓鼓的，眼睛又大又亮。"},{"who":"伯樂的兒子","t":"跟書上寫的一模一樣！爹，我找到千里馬了！","mv":[["伯樂的兒子",-0.2,0.0]],"fx":[["focus",null],["cheer","伯樂的兒子"]]}],"q":"伯樂的兒子死板地照著書上寫的樣子去找馬，結果找到一隻蟾蜍。這種做事死板、不知變通的樣子，叫做什麼？","wrong":[{"w":"指鹿為馬","by":"伯樂","line":"指鹿為馬是故意顛倒是非。我兒子是真心以為蟾蜍是馬，只是太死板了！"},{"w":"老馬識途","by":"伯樂的兒子","line":"老馬識途是老馬認得路。我連馬都還沒找到啦！"},{"w":"紙上談兵","by":"伯樂","line":"紙上談兵是只會空談書上的理論，意思很接近！不過我兒子是真的拿著書上畫的樣子去找東西。"}],"hint":"「驥」是千里馬，「索」是尋找。","after":"伯樂又好氣又好笑：「這匹馬太會跳，不能騎啊！」","lesson":{"title":"成語小學堂．按圖索驥","text":"原句出自《漢書》：用老方法選人才，就像拿著伯樂的圖到市場找千里馬，一定找不到。伯樂兒子找到蟾蜍的笑話，記在明朝楊慎的筆記裡。現在它也有好的意思：照著線索去找，例如拿著地圖找到老店。","next":"學東西不能死板，也不能半途而廢。有個學唱歌的學生，就差點犯了錯……"}},{"id":"e36_01","yr":"《列子．湯問》","place":"城外的路口","scene":"road","music":"night","cast":[["秦青",-0.6,-0.8],["薛譚",1.6,0.2]],"beats":[{"t":"薛譚跟著有名的歌唱老師秦青學唱歌。還沒學完，他就以為自己全學會了。","fx":[["focus",null]]},{"who":"薛譚","t":"老師，您的本事我都學會了，我想回家了！","fx":[["cheer","薛譚"]]},{"t":"秦青沒有留他，還帶著酒，到城外的路口為他送行。","mv":[["秦青",-0.2,0.0],["薛譚",1.8,0.8]]},{"who":"秦青","t":"好吧。臨走前，我唱一首歌送你。","fx":[["say","秦青"]]},{"t":"秦青打著拍子，唱起悲傷的歌。歌聲震動了樹林，連天上飄動的雲，都停下來不走了。","fx":[["focus","秦青"],["burst","秦青","#9ad0f0"]]},{"who":"薛譚","t":"天啊……原來我還差得好遠！","fx":[["focus",null],["upset","薛譚"]]}],"q":"秦青的歌聲又響亮又美妙，連天上飄動的雲都被擋住、停了下來。這樣的歌聲可以用哪個成語形容？","wrong":[{"w":"五音不全","by":"薛譚","line":"五音不全是唱歌走音！老師唱得好到雲都停了耶！"},{"w":"雲淡風輕","by":"秦青","line":"雲淡風輕是天氣晴朗，或心情很平靜。我唱的可是讓雲停下來的悲歌！"},{"w":"繞梁三日","by":"秦青","line":"繞梁三日是歌聲在屋梁上繞了三天，也是稱讚歌聲，意思很接近！但這裡是在戶外，歌聲擋住的是天上的雲。"}],"hint":"「遏」是阻止、使停住。被擋住的是天上的……","after":"薛譚趕緊向老師道歉，請求回來繼續學，從此一輩子再也不敢說要回家。","lesson":{"title":"成語小學堂．響遏行雲","text":"這個故事告訴我們：學無止境，不要學一點就驕傲。現在用來形容歌聲響亮美妙，例如合唱團的歌聲讓全場驚嘆。","next":"《列子》裡還有很多奇怪的辯論。有人說：一根頭髮，可以吊起千鈞重的東西……"}},{"id":"e36_02","yr":"《列子．仲尼》","place":"魏國公子的家","scene":"palace","music":"palace","cast":[["公子牟",-0.6,-0.6],["樂正子輿",1.8,0.4]],"beats":[{"t":"魏國的公子牟，很佩服一位愛講奇怪道理的學者，叫公孫龍。","fx":[["focus","公子牟"]]},{"who":"公子牟","t":"公孫龍的學問，真是了不起！","fx":[["say","公子牟"]]},{"who":"樂正子輿","t":"哈哈！他盡說些怪話。他還騙魏王說：一根頭髮，能吊起千鈞重的東西！","fx":[["focus",null],["cheer","樂正子輿"]]},{"t":"「鈞」是古代的重量單位，一鈞是三十斤，千鈞就是三萬斤，重得不得了！"},{"who":"公子牟","t":"那是你不懂。只要頭髮每一處受的力都平均，就不會斷啊！","fx":[["say","公子牟"]]},{"who":"樂正子輿","t":"可是一根頭髮吊著那麼重的東西，看起來隨時會斷，多危險！","fx":[["upset","樂正子輿"]]}],"q":"一根頭髮吊著千鈞重的東西，隨時可能斷掉。後來人們用哪個成語，比喻情況非常危急？","wrong":[{"w":"輕如鴻毛","by":"公子牟","line":"輕如鴻毛是像羽毛一樣輕、不重要。千鈞可是重得不得了！"},{"w":"一諾千金","by":"樂正子輿","line":"一諾千金是說話算話。我們在說頭髮快斷了，跟承諾沒關係！"},{"w":"危在旦夕","by":"樂正子輿","line":"危在旦夕是危險就在早晚之間，意思很接近！不過答案裡有頭髮和千鈞的畫面。"}],"hint":"很重很重的東西，只靠一根細細的……","after":"兩人爭論了好久。「一根頭髮吊千鈞」這個說法，就這樣被記了下來。","lesson":{"title":"成語小學堂．千鈞一髮","text":"公孫龍是戰國時代有名的辯論家，還說過「白馬非馬」。後來唐朝的韓愈也用「一髮引千鈞」形容非常危險，現在常說「千鈞一髮之際」。","next":"有些人很天真，以為自己知道的就是全世界。宋國有個農夫……"}},{"id":"e36_03","yr":"《列子．楊朱》","place":"宋國的田邊","scene":"south","music":"map","cast":[["農夫",-0.6,-0.4],["農夫之妻",1.4,-1.0],["富翁",6.8,1.0]],"beats":[{"t":"宋國有個窮農夫，冬天只有一件破麻衣，冷得直發抖，好不容易才熬過冬天。","fx":[["sad","農夫"]]},{"t":"春天來了，他在田邊曬太陽，背上暖烘烘的，舒服極了。他從來不知道，世上有溫暖的大房子和皮大衣。","fx":[["cheer","農夫"]]},{"who":"農夫","t":"老婆，曬太陽這麼舒服，別人一定都不知道！我要把這個方法獻給國君，一定有重賞！","fx":[["say","農夫"],["focus","農夫"]]},{"who":"農夫之妻","t":"真的嗎？國君會喜歡嗎？","fx":[["upset","農夫之妻"]]},{"t":"隔壁的富翁聽到了，走過來說了一個故事。","mv":[["富翁",2.4,0.6]],"fx":[["focus",null]]},{"who":"富翁","t":"從前有人覺得野豆子、苦菜最好吃，推薦給大財主。財主吃了，嘴巴刺痛、肚子難受，大家都笑他。","fx":[["say","富翁"]]}],"q":"農夫把大家早就知道的曬太陽，當成寶貝要獻給國君。後來用哪個成語，比喻貢獻的東西很平凡，也常當作謙虛話？","wrong":[{"w":"畫蛇添足","by":"農夫之妻","line":"畫蛇添足是多此一舉，把事情弄糟。我老公是想送東西給國君啦！"},{"w":"雪中送炭","by":"富翁","line":"雪中送炭是在別人困難時幫忙。國君有大房子、皮大衣，根本不缺太陽！"},{"w":"班門弄斧","by":"農夫","line":"班門弄斧是在專家面前賣弄本事，也有點不自量力，意思接近！不過我是要「獻上」自以為的好東西。"}],"hint":"「野人」是鄉下人，「曝」是曬太陽。","after":"富翁說：「你就跟那個人一樣啊。」農夫聽了，覺得好慚愧。","winSad":"農夫","lesson":{"title":"成語小學堂．野人獻曝","text":"這個故事提醒我們：自己覺得好的，別人不一定需要。現在常把它當作謙虛話，例如：「這是我的一點小想法，野人獻曝，請大家指教。」","next":"周穆王出巡時，遇到一位手很巧的工匠，他帶來一個會唱歌跳舞的「人」……"}},{"id":"e36_07","yr":"《列子．湯問》","place":"周穆王出巡的路上","scene":"palace","music":"palace","cast":[["周穆王",-0.4,-1.2],["偃師",6.8,1.0],["歌舞人偶",7.6,0.4],["侍女",2.8,-1.6],["侍女",3.6,-1.0]],"beats":[{"t":"這是《列子》裡的傳說：周穆王到西方巡視，回程時，有人推薦一位工匠，叫偃師。","fx":[["focus","周穆王"]]},{"t":"偃師帶著一個「人」，來拜見穆王。","mv":[["偃師",0.8,0.6],["歌舞人偶",1.8,0.9]],"fx":[["focus",null]]},{"who":"周穆王","t":"和你一起來的是誰？","fx":[["say","周穆王"]]},{"who":"偃師","t":"這是我做的，會唱歌跳舞的人偶！","fx":[["say","偃師"]]},{"t":"偃師動動人偶的下巴，它就唱出合拍的歌；抬抬它的手，它就跳起好看的舞。想要什麼動作，它都做得出來。","fx":[["focus","歌舞人偶"],["cheer","歌舞人偶"]]},{"who":"周穆王","t":"走路、低頭、抬頭……簡直跟真人一模一樣！","fx":[["focus",null],["upset","周穆王"]]}],"q":"偃師的人偶又唱又跳，動作一會兒這樣、一會兒那樣，變化多到數不完。這可以用哪個成語形容？","wrong":[{"w":"一成不變","by":"周穆王","line":"一成不變是一直都不改變。這人偶的動作，花樣可多了！"},{"w":"千山萬水","by":"偃師","line":"千山萬水是路途又遠又難走。我是帶人偶來表演，不是來比賽走路的！"},{"w":"變化多端","by":"偃師","line":"變化多端也是變化很多，意思很接近！不過《列子》書上寫的，是另一個有數字的成語。"}],"hint":"成語裡有兩個數字：一個是「一百」的十倍，一個是「一千」的十倍。","after":"表演快結束時，人偶竟對穆王的侍女眨眼睛！穆王大怒，偃師嚇得趕緊把它拆開，原來全是皮革、木頭、膠和漆做的。","lesson":{"title":"成語小學堂．千變萬化","text":"穆王看完，驚嘆說：「人的巧手，竟然能和大自然一樣厲害！」偃師的人偶，就像古代的機器人。現在「千變萬化」用來形容變化無窮，例如天上的雲一下像小狗、一下像龍。","next":"說話也和做人偶一樣不容易。漢朝的東方朔，寫過一位三年不說話的先生……"}},{"id":"e43_07","yr":"《漢書．東方朔傳》","place":"吳國的王宮","scene":"palace","music":"palace","cast":[["吳王",-0.4,-1.0],["非有先生",1.6,0.4]],"beats":[{"t":"漢朝的東方朔寫了一篇文章，虛構了一位「非有先生」。「非有」就是「並沒有這個人」的意思。","fx":[["focus",null]]},{"t":"非有先生在吳國當官，整整三年，一句話也不說。","fx":[["focus","非有先生"]]},{"who":"吳王","t":"先生，你來了三年，為什麼都不說話？","fx":[["upset","吳王"]]},{"t":"非有先生只是低著頭，恭恭敬敬地答應。","fx":[["sad","非有先生"]]},{"who":"吳王","t":"你儘管說吧，寡人會專心聽！","fx":[["say","吳王"]]},{"who":"非有先生","t":"唉！可以嗎？可以嗎？向君王說話，哪有那麼簡單啊！","fx":[["focus","非有先生"],["say","非有先生"]]}],"q":"非有先生說：真心話常常不好聽，向君王說真話其實非常困難。後來用哪個成語，表示嘴上說說容易、真正做起來很難？","wrong":[{"w":"輕而易舉","by":"吳王","line":"輕而易舉是很輕鬆就做到。先生可是說，說真話很困難啊！"},{"w":"口若懸河","by":"非有先生","line":"口若懸河是說話滔滔不絕。我可是三年都沒開口！"},{"w":"知易行難","by":"非有先生","line":"知易行難是知道很容易、做到很難，意思很接近！不過我嘆氣說的，是「說話」這件事。"}],"hint":"先生嘆氣：說話，哪有那麼……","after":"非有先生說：有些話不好聽、不順耳，卻對國家有好處。只有賢明的君王，才聽得進去。","lesson":{"title":"成語小學堂．談何容易","text":"這篇文章叫〈非有先生論〉，東方朔借這個虛構的人物，說出向君王進言的難處。原本是「向君王說話哪有那麼容易」，現在常用來表示「說起來簡單，做起來難」。","next":"說話難，守規矩也不簡單。古代過新年，文武百官要整整齊齊地朝見皇帝……"}},{"id":"e48_06","yr":"《隋書．音樂志》","place":"宮廷大殿前","scene":"palace","music":"final","cast":[["皇帝",-0.2,-1.6],["大臣",-6.8,0.6],["大臣",-7.4,1.4],["大臣",6.8,0.6],["樂師",3.2,-1.0]],"beats":[{"t":"古代過新年，宮廷有一場盛大的朝會：文武百官要排好隊伍，一起向皇帝祝賀。","fx":[["focus","皇帝"]]},{"t":"大臣們整整齊齊地走進宮廷，每一步都走得端端正正。","mv":[["大臣",-1.4,0.2],["大臣#2",-0.4,1.0],["大臣#3",1.6,0.6]],"fx":[["focus",null]]},{"t":"樂師奏起宮廷樂歌，歌詞唱著：「齊之以禮，相趨帝庭。應規蹈矩，玉色金聲。」","fx":[["focus","樂師"]]},{"who":"樂師","t":"「規」是畫圓的工具，「矩」是畫方的工具。大家的一舉一動，都合乎規矩！","fx":[["say","樂師"]]},{"who":"皇帝","t":"好！人人守禮，國家就和樂安定。","fx":[["focus",null],["cheer","皇帝"]]}],"q":"小美每天準時上學、排隊不插隊、從不違反校規，做什麼都照規定來。可以用哪個成語形容她？","wrong":[{"w":"胡作非為","by":"大臣","line":"胡作非為是任意做壞事，跟小美剛好相反！"},{"w":"無法無天","by":"樂師","line":"無法無天是完全不守法紀。我們唱的可是人人守規矩啊！"},{"w":"按部就班","by":"皇帝","line":"按部就班是照著順序一步一步做，意思有點接近！不過這裡強調的是遵守「規」和「矩」。"}],"hint":"畫圓的工具叫「規」，畫方的工具叫「矩」，照著它們走……","after":"百官在音樂聲中行禮，整場朝會莊嚴又和樂。","lesson":{"title":"成語小學堂．循規蹈矩","text":"這句歌詞記在《隋書．音樂志》，原本寫作「應規蹈矩」。現在說人「循規蹈矩」，多半是稱讚他守規矩；但有時也指太拘泥規定、不知變通。","next":"守規矩的人是好人；那幫壞人做壞事的，又叫什麼呢？唐朝的傳奇裡，有一隻會變成和尚的老虎……"}},{"id":"e48_07","yr":"唐．裴鉶《傳奇》","place":"衡山的山林","scene":"mountain","music":"night","cast":[["馬拯",-0.6,0.2],["老僧",2.2,-1.4],["馬沼",6.8,1.0],["獵人",-6.8,1.0],["倀鬼",1.4,-1.2,0,1,1]],"beats":[{"t":"這是唐朝的傳奇故事：愛遊山玩水的讀書人馬拯，到衡山拜訪一位老和尚。","fx":[["focus","老僧"]]},{"t":"另一位旅人馬沼也上山來了。他偷偷把馬拯拉到一旁。","mv":[["馬沼",1.0,0.8]],"fx":[["focus",null]]},{"who":"馬沼","t":"我在半路上，看見一隻老虎脫下虎皮，變成了那個老和尚！","fx":[["say","馬沼"],["upset","馬拯"]]},{"t":"兩人趁老和尚不注意，把他推進井裡。牠立刻變回老虎，被他們用大石頭壓住，再也出不來。","mv":[["老僧",8,-2.0]]},{"t":"下山時天黑了，他們遇到一個獵人。獵人在路上裝了機關弓箭，要抓另一隻老虎，三人一起躲到樹上。","mv":[["獵人",-1.2,-0.6]]},{"t":"半夜，來了幾十個奇怪的人影，竟然把獵人的機關拆掉了！","mv":[["倀鬼",0.8,-0.4]],"fx":[["upset","獵人"],["focus","倀鬼"]]},{"who":"獵人","t":"那些是倀鬼，是被老虎害死的人變的，現在反而走在老虎前面，替老虎開路！","fx":[["focus",null],["say","獵人"]]}],"q":"倀鬼被老虎害死，卻反過來幫老虎拆掉機關、開路。後來用哪個成語，比喻幫助壞人做壞事？","wrong":[{"w":"狐假虎威","by":"馬沼","line":"狐假虎威是狐狸借老虎的威風嚇人。倀鬼不是借威風，是在幫老虎做事！"},{"w":"虎頭蛇尾","by":"馬拯","line":"虎頭蛇尾是開頭很猛、結尾沒力，跟幫壞人做壞事沒關係！"},{"w":"助紂為虐","by":"獵人","line":"助紂為虐是幫助暴君紂王做壞事，意思幾乎一樣！不過這個故事裡幫忙的是倀鬼，被幫的是老虎。"}],"hint":"「倀」是被老虎害死、反而替老虎做事的鬼。","after":"馬拯勸獵人重新裝好機關。不久老虎果然來了，一碰到機關就被射中，再也不能害人。","winMv":[["倀鬼",8,-1.0]],"lesson":{"title":"成語小學堂．為虎作倀","text":"這是唐朝裴鉶《傳奇》裡的故事，屬於志怪傳說。「倀」念ㄔㄤ。現在常用來批評幫壞人做壞事的人，例如幫詐騙集團找人頭帳戶。","next":"最後，我們回到周穆王身邊。他有一位很會駕車的好幫手，叫造父……"}},{"id":"e58_01","yr":"《史記．秦本紀》","place":"往西方的大路","scene":"road","music":"map","cast":[["周穆王",-0.4,-0.2],["造父",1.0,0.4],["使者",7.2,1.0]],"beats":[{"t":"造父是最會駕車的人。他替周穆王找來四匹最好的駿馬：驥、溫驪、驊騮、騄耳。","fx":[["prop","cart",0.6,-1.4,0],["focus","造父"]]},{"who":"造父","t":"大王，這四匹都是一天能跑千里的好馬！","fx":[["say","造父"]]},{"t":"穆王坐上馬車，往西方巡遊。一路上風景好美，好玩的事一件接著一件。","fx":[["focus",null]]},{"who":"周穆王","t":"太好玩了！先不回去，再往西走！","fx":[["cheer","周穆王"]]},{"t":"穆王玩得太開心，完全忘了要回國。就在這時，一位使者騎馬飛奔而來。","mv":[["使者",2.4,0.8]]},{"who":"使者","t":"大王，不好了！徐偃王起兵作亂了！","fx":[["say","使者"],["upset","周穆王"]]}],"q":"周穆王在西方玩得太快樂，忘了回去。後來用哪個成語，形容玩得非常開心、捨不得離開？","wrong":[{"w":"歸心似箭","by":"周穆王","line":"歸心似箭是想回家想得不得了。朕剛剛可是一點都不想回去！"},{"w":"安居樂業","by":"造父","line":"安居樂業是百姓生活安定、快樂工作。大王是出門在外，玩到忘了回家！"},{"w":"樂不思蜀","by":"造父","line":"樂不思蜀也是快樂得不想回去，意思很接近！不過那是三國劉禪的故事，說的是不想念蜀國。"}],"hint":"「樂」是快樂，「返」是回去。","after":"造父駕著馬車長驅回國，一天跑了一千里，及時趕回去平定亂事。","lesson":{"title":"成語小學堂．樂而忘返","text":"穆王把趙城封給造父，造父的後代就以「趙」為姓。《史記》原文寫作「樂而忘歸」，現在多說「樂而忘返」。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十二島．奇人異事錄","eps":[30,36,43,48,58]}];
