來，又羞又慌，臉都不知道往哪裡擺。","fx":[["focus","周勃"],["upset","周勃"]]}],"q":"周勃連續兩題都答不出來，又慚愧又害怕，汗水把整個背都溼透了。這種樣子叫做什麼？","wrong":[{"w":"若無其事","by":"周勃","line":"若無其事是好像沒發生什麼事一樣。我都快急死了，怎麼可能若無其事！"},{"w":"談笑風生","by":"陳平","line":"談笑風生是有說有笑、很輕鬆。周丞相現在可笑不出來！"},{"w":"面紅耳赤","by":"漢文帝","line":"面紅耳赤是臉和耳朵都紅了，也能形容慚愧，意思有點接近！不過周勃是汗水溼透了背，有一個專門的成語。"}],"hint":"「浹」是溼透的意思。","after":"漢文帝改問陳平。陳平說：「審案子要問廷尉，錢和糧食要問治粟內史，這些都有專門負責的官員。」","lesson":{"title":"丞相做什麼","text":"陳平說，丞相的工作是輔佐皇帝、管好百官，讓每個人做好自己的事。周勃知道自己比不上陳平，不久就辭去了丞相的職位。","next":"漢文帝很想把國家治理好。有一位年輕的讀書人賈誼，正連夜寫文章給他……"}},{"id":"e24_04","yr":"約西元前 178 年","place":"長安．賈誼的書房","scene":"study","music":"night","cast":[["賈誼",-1,-1.6],["書童",6.6,0.6]],"beats":[{"t":"漢文帝時，天下太平了，可是很多人不種田，跑去做華麗的奢侈品來賣。"},{"t":"年輕的賈誼很擔心，晚上點著燈，寫文章給漢文帝。","fx":[["focus","賈誼"]]},{"who":"書童","t":"先生，都這麼晚了，還在寫什麼呀？","mv":[["書童",0.8,-0.6]]},{"who":"賈誼","t":"糧食是天下最重要的命脈。種田的人少，吃飯的人多，萬一遇到旱災，百姓就要挨餓了！","fx":[["upset","賈誼"]]},{"who":"書童","t":"那要怎麼辦呢？"},{"who":"賈誼","t":"要讓那些到處遊蕩、不做事的人，都回到田裡去……","mv":[["賈誼",-0.4,-0.6]]}],"q":"賈誼建議，讓天下每個人都回到田裡，靠自己的勞力種出糧食、養活自己。這種靠自己勞力生活的樣子，叫做什麼？","wrong":[{"w":"不勞而獲","by":"書童","line":"不勞而獲是不工作就得到好處。先生想要的剛好相反！"},{"w":"坐吃山空","by":"賈誼","line":"坐吃山空是只吃不做，再多的財產也會吃光。我就是怕國家變成這樣！"},{"w":"自力更生","by":"賈誼","line":"自力更生是靠自己的力量重新站起來，意思很接近！不過我說的是讓每個人「靠自己的力氣吃飯」，有一個專門的成語。"}],"hint":"靠自己的力氣，換來自己吃的東西。","after":"漢文帝讀了很感動，就親自下田耕種，帶頭鼓勵百姓種田。","lesson":{"title":"重視農業","text":"賈誼這篇文章叫〈論積貯疏〉，「積貯」就是儲存糧食。漢文帝重視農業，還好幾次減少田租，百姓的生活慢慢好起來。","next":"那時候，楚地流傳著一句話，說的是一個非常講信用的人……"}},{"id":"e09_01","yr":"漢文帝時","place":"季布家中","scene":"house","music":"palace","cast":[["季布",1,-0.4],["曹丘生",-6.6,0.8],["僕人",2.6,0.8]],"beats":[{"t":"季布原本是項羽的將領，後來在漢朝當官。他非常講信用，答應別人的事一定做到。"},{"t":"楚地的人都說：「得到一百斤黃金，不如得到季布的一句承諾。」","fx":[["focus","季布"]]},{"t":"有個叫曹丘生的人很會說話，喜歡結交有權勢的人。季布聽說了，很討厭他。"},{"t":"曹丘生寫信請求見面。季布板著臉等他上門，準備好好教訓他一頓。","fx":[["upset","季布"]]},{"t":"曹丘生一進門，就恭恭敬敬地行禮。","mv":[["曹丘生",-0.8,0.6]]},{"who":"曹丘生","t":"我們都是楚國人。您的好名聲，是誰幫您傳遍天下的呢？我到處稱讚您，您卻這麼討厭我，這是為什麼呢？","fx":[["say","曹丘生"]]}],"q":"楚地人說，季布答應的一句話，比一百斤黃金還珍貴。後來形容人說話算話、答應的事絕不改變，叫做什麼？","wrong":[{"w":"揮金如土","by":"僕人","line":"揮金如土是花錢像撒泥土一樣浪費。我們家主人看重的是承諾，不是亂花錢！"},{"w":"出爾反爾","by":"季布","line":"出爾反爾是說話不算話、反反覆覆。這是我最討厭的事！"},{"w":"一字千金","by":"曹丘生","line":"一字千金也有「千金」，可是它是說文章寫得好，每個字都很珍貴。說的是文章，不是信用喔！"}],"hint":"「諾」是答應別人的話。","after":"季布聽了很高興，請曹丘生住了好幾個月，當成貴賓招待，臨走還送他厚禮。曹丘生到處宣揚，季布的名聲傳得更遠了。","lesson":{"title":"從被懸賞到當大官","text":"季布當項羽的將領時，常常讓劉邦吃苦頭。項羽死後，劉邦出千兩黃金懸賞抓他。後來有人替他說情，劉邦才赦免他，讓他在漢朝當官。","next":"賈誼又寫了一篇長長的文章給漢文帝，裡面用了一句有趣的民間俗話……"}},{"id":"e18_08","yr":"約西元前 174 年","place":"長安．皇宮","scene":"office","music":"palace","cast":[["漢文帝",1.4,-0.6],["賈誼",-1,0.4],["宮女",2.6,0.8],["老鼠",6.6,-0.4,0,1]],"beats":[{"t":"賈誼又寫了一篇文章給漢文帝。這次他想說的是：皇帝應該怎麼對待大臣。"},{"t":"那時候，連當過丞相的周勃，都曾被抓進牢裡，受獄卒欺負。賈誼覺得這樣不妥當。","fx":[["sad","賈誼"]]},{"who":"賈誼","t":"陛下，民間有一句俗話……","fx":[["prop","urn",1.2,-1.2],["focus","賈誼"]]},{"t":"就像這樣：一隻老鼠溜到了大甕旁邊。","mv":[["老鼠",1.6,-0.6]],"fx":[["focus","老鼠"]]},{"who":"宮女","t":"有老鼠！我拿東西丟牠……啊，不行，會打破這個甕！","fx":[["upset","宮女"]]},{"who":"賈誼","t":"老鼠靠近器物，大家都不敢亂丟，怕打壞器物。何況是靠近皇帝的大臣呢？"}],"q":"想用東西丟老鼠，又怕打壞旁邊的器物。後來比喻想除掉壞人壞事，卻怕傷到旁邊的人事物而有所顧忌，叫做什麼？","wrong":[{"w":"抱頭鼠竄","by":"老鼠","line":"抱頭鼠竄是嚇得抱著頭像老鼠一樣逃跑。我……我還沒逃啦，大家都不敢丟我！"},{"w":"鼠目寸光","by":"宮女","line":"鼠目寸光是眼光短淺。我是怕打破甕，可不是眼光短喔！"},{"w":"瞻前顧後","by":"賈誼","line":"瞻前顧後是做事前想後、顧慮很多，意思有點接近！不過我用的是老鼠和器物的比喻，有一個專門的成語。"}],"hint":"「忌」是顧慮、害怕的意思。","after":"賈誼的意思是：大臣離皇帝很近，就算犯了錯，也要保留他的尊嚴，這樣才能顯出皇帝的尊貴。","lesson":{"title":"尊重大臣","text":"漢文帝接受了賈誼的意見，從此大臣犯了罪，不再被綁去受刑罰侮辱。賈誼三十三歲就過世了，但他的文章到今天都很有名。","next":"北方的匈奴常常侵犯邊境，搶奪百姓的糧食。漢文帝的另一位大臣鼂錯，也上書提出辦法……"}},{"id":"e43_03","yr":"約西元前 169 年","place":"北方邊境","scene":"walls","music":"battle","cast":[["鼂錯",-6.6,0.8],["戍卒",-1.4,-2.7,1.3],["戍卒",1,-2.7,1.3],["匈奴兵",7.2,-1],["匈奴兵",7.8,0.2]],"beats":[{"t":"漢文帝時，北方的匈奴常常騎馬南下，搶走邊境百姓的糧食和牲畜。","mv":[["匈奴兵",3.4,-1.2],["匈奴兵#2",4.2,0]],"fx":[["upset","戍卒"]]},{"t":"守邊的士兵大多從遠方輪流派來，一年就換一批，不熟悉當地的地形，也摸不清匈奴的本事。","mv":[["匈奴兵",7.6,-1],["匈奴兵#2",8,0.4]],"fx":[["sadAll","戍卒"]]},{"t":"大臣鼂錯上書給漢文帝，說出他的想法。","mv":[["鼂錯",-0.8,0.4]]},{"who":"鼂錯","t":"秦朝硬派百姓去守邊，很多人水土不服，死在邊疆。大家心裡怨恨，甚至想要背叛。","fx":[["say","鼂錯"]]},{"who":"戍卒","t":"唉，離家這麼遠，又沒有獎賞，誰想拚命呢？"},{"who":"鼂錯","t":"如果打勝仗、守住城就能升官，攻下城就能得到財物，士兵就會不怕危險……","fx":[["focus","鼂錯"]]}],"q":"鼂錯說：只要有功就有賞，士兵就願意「跳進滾燙的水、踩進火裡」，不怕任何危險。後來比喻奮不顧身、不怕艱難危險，叫做什麼？","wrong":[{"w":"貪生怕死","by":"鼂錯","line":"貪生怕死是怕死、不敢冒險。我想讓士兵變勇敢，剛好相反！"},{"w":"水深火熱","by":"戍卒","line":"水深火熱雖然也有水和火，卻是形容百姓生活非常痛苦，意思完全不同喔！"},{"w":"奮不顧身","by":"戍卒#2","line":"奮不顧身也是勇敢向前、不顧自己的安危，意思很接近！不過鼂錯說的是跳進熱水、踩進火裡，有一個專門的成語。"}],"hint":"「湯」是滾燙的熱水，「蹈」是踩。","after":"鼂錯又建議：招募百姓搬到邊境住，蓋房子、分田地，讓他們一邊種田、一邊守護自己的家園。","lesson":{"title":"移民守邊","text":"漢文帝採納了鼂錯的建議，招募百姓到邊境安家。大家守護的是自己的家人和田地，比遠方輪流派來的士兵更用心。小知識：原文是「赴湯火」，後來才變成四個字的成語。","next":"除了邊防，鼂錯也很關心辛苦種田的農夫。他又寫了一篇文章，說出農夫的苦……"}},{"id":"e22_08","yr":"約西元前 168 年","place":"農家","scene":"house","music":"night","cast":[["農夫",-0.8,0.2],["妻子",1,-0.4],["小孩",1.8,0.6],["官差",6.8,0.8]],"beats":[{"t":"漢朝的農夫一家五口，至少兩個人要服勞役。能耕種的田不過一百畝，收成不過一百石。"},{"t":"春天耕田，夏天除草，秋天收割，冬天收藏，一年到頭沒有一天能休息。還常遇到水災、旱災。","fx":[["sad","農夫"]]},{"who":"官差","t":"官府命令，三天之內要把稅繳清！","mv":[["官差",2.6,1.2]],"fx":[["focus","官差"]]},{"who":"農夫","t":"官爺，今天早上不是才說下個月繳嗎？","fx":[["upset","農夫"]]},{"who":"官差","t":"上面又改了！我也沒辦法！"},{"who":"妻子","t":"家裡沒錢，只好把糧食半價賣掉了……","fx":[["sad","妻子"],["sad","小孩"]]}],"q":"官府早上才下命令，到了晚上就改掉，讓農夫手忙腳亂。後來比喻主張或辦法經常改變，叫做什麼？","wrong":[{"w":"一成不變","by":"農夫","line":"一成不變是永遠都不改變。官府的命令要是這樣就好了！"},{"w":"言出必行","by":"妻子","line":"言出必行是說到做到。官府說了又改，剛好相反！"},{"w":"反覆無常","by":"官差","line":"反覆無常是變來變去、沒有定性，意思很接近！不過鼂錯說的是命令早上下、晚上改，有一個專門的成語。"}],"hint":"「朝」是早上，「夕」是晚上。","after":"鼂錯把農夫的辛苦寫成〈論貴粟疏〉：急著繳稅的人只好半價賣糧，沒有的人還得借高利貸，甚至賣掉田地房子。","lesson":{"title":"文景之治","text":"鼂錯建議讓百姓用糧食換爵位，提高糧食的價值，漢文帝採納了，後來還免除了全國的田租。漢文帝和兒子漢景帝在位時，百姓生活安定，史稱「文景之治」。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十七章．漢初新局","eps":[9,18,22,24,29,41,43,58]},{"key":"h16","line":"history","name":"文景之治","short":"文景之治","era":"西元前 167–137 年","color":"#4E9A6B","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["漢朝建立後，百姓經過多年戰亂，最需要休息。","漢文帝、漢景帝父子減輕賦稅和刑罰，自己也很節儉，國家慢慢富強起來。","這段太平的日子，歷史上叫做「文景之治」。漢文帝很願意聽人勸告，連一個小女孩寫的信，他都認真讀。","西元前 141 年，年輕的漢武帝即位，一個更強大的時代就要開始了！"],"people":[["漢文帝","西漢的好皇帝，節儉又仁慈"],["緹縈","上書救父的勇敢女孩"],["韓安國","梁國大臣，很有度量"],["司馬相如","漢朝最有名的文學家之一"]]},"stops":[{"id":"e22_07","yr":"西元前 167 年","place":"前往長安的路上","scene":"road","music":"night","cast":[["淳于意",-6.5,0.6],["押解官",-5.6,1.4],["緹縈",-7.6,1.2]],"beats":[{"t":"漢文帝時，齊國有一位管糧倉的官員叫淳于意，他也是有名的醫生。大家都說他做官清廉公正。"},{"t":"可是淳于意被人控告犯了罪，要押到京城長安，接受會傷害身體的重刑。","mv":[["押解官",0.6,0.2],["淳于意",-0.8,0.4]]},{"who":"淳于意","t":"唉，我生了五個女兒，卻沒有兒子。遇到急事，一個幫得上忙的都沒有！","fx":[["sad","淳于意"]]},{"t":"最小的女兒緹縈聽了，又難過又不服氣，決定跟著爸爸，一路走到長安。","mv":[["緹縈",-1.9,0.9]],"fx":[["focus","緹縈"]]},{"who":"緹縈","t":"爸爸，我陪您去！我要寫信給皇上！","fx":[["cheer","緹縈"]]},{"t":"到了長安，緹縈寫信給漢文帝：「人死了不能復活，受了刑、身體被砍傷的地方，也接不回去……」","fx":[["say","緹縈"]]}],"q":"緹縈在信裡接著說：「爸爸就算想改正錯誤、重新做人，受了刑也沒有機會了。我願意當官府的女僕，替爸爸贖罪。」她說的「改正錯誤、重新做人」，是哪個成語？","wrong":[{"w":"一錯再錯","by":"緹縈","line":"一錯再錯是錯了還一直錯下去。我是希望爸爸有機會改正啊！"},{"w":"改朝換代","by":"押解官","line":"改朝換代是換了一個朝代。小姑娘只是想救爸爸，可沒有要換皇帝！"},{"w":"痛改前非","by":"淳于意","line":"痛改前非也是徹底改掉以前的錯，意思很接近！不過女兒信裡說的是改正以後，還要讓自己「重新」開始，原文有專門的四個字。"}],"hint":"改掉過錯，讓自己變成一個「新」的人。","after":"漢文帝讀了信，被緹縈的孝心感動，不但放過了淳于意，還開始想：這些刑罰，是不是太殘忍了？","lesson":{"title":"緹縈救父","text":"緹縈救父是很有名的孝順故事。淳于意後來繼續行醫，人稱「倉公」，《史記》還記下了他看過的二十多個病例，是中國最早的「病歷」之一。","next":"緹縈的信，讓漢文帝下定決心，要從根本改變國家的法律……"}},{"id":"e30_08","yr":"西元前 167 年","place":"長安．皇宮","scene":"office","music":"palace","cast":[["漢文帝",0.4,-2.1],["丞相張蒼",6.6,1.0],["大臣",-6.6,1.2]],"beats":[{"t":"漢文帝讀完緹縈的信，心裡很難過。這個小女孩願意當女僕，只為了讓爸爸有重新開始的機會。","fx":[["focus","漢文帝"]]},{"who":"漢文帝","t":"現在的刑罰，會在臉上刺字、割掉鼻子、砍斷腳。人就算想改過，也來不及了！","fx":[["upset","漢文帝"]]},{"who":"漢文帝","t":"百姓會犯錯，是因為我教得不好。只靠嚴厲的刑罰，不是好辦法。","fx":[["sad","漢文帝"]]},{"t":"丞相張蒼和大臣們走上前，奉命重新修訂法律。","mv":[["丞相張蒼",1.6,0.2],["大臣",-1.0,0.4]]},{"who":"丞相張蒼","t":"陛下，臣等會把這些傷害身體的刑罰，改成別的處罰。","fx":[["say","丞相張蒼"]]},{"t":"漢文帝不是只放了淳于意一個人，而是從法律的根本下手，廢除了這些「肉刑」。","fx":[["cheer","大臣"]]}],"q":"漢文帝不只救一個人，而是從源頭、從根本，把不好的法律改掉。這種從根本上徹底整頓的做法，叫做什麼？","wrong":[{"w":"得過且過","by":"大臣","line":"得過且過是隨便混日子。陛下可是認真要改法律！"},{"w":"本末倒置","by":"丞相張蒼","line":"本末倒置是把重要和不重要的弄反了。陛下抓住的，正是最根本的地方！"},{"w":"釜底抽薪","by":"漢文帝","line":"釜底抽薪是把鍋底的柴抽掉，從根本解決問題，意思很接近！不過要找的是「端正樹根、清理水源」的那個成語。"}],"hint":"「本」是樹根，「源」是水的源頭。","after":"這個成語出自東漢班固寫的《漢書．刑法志》，原文是「清原正本」。班固認為，法律要從根本整頓，百姓才能得到保護。","lesson":{"title":"廢除肉刑","text":"漢文帝把臉上刺字改成剃髮做苦工，把割鼻子、砍腳等刑罰改成打板子。可是板子打得太多，反而有人受不了。後來漢景帝又減少次數，刑罰才真正變輕。","next":"文帝之後，兒子漢景帝即位。梁國有一位大臣叫韓安國，有一天犯了法，被關進牢裡……"}},{"id":"e29_02","yr":"約西元前 150 年","place":"梁國的牢房","scene":"night","music":"night","cast":[["韓安國",-1.6,0.2],["田甲",6.5,0.8],["使者",7.5,1.4]],"beats":[{"t":"漢景帝時，梁國有一位能幹的大臣叫韓安國。有一次他犯了法，被關進牢裡。","fx":[["sad","韓安國"]]},{"t":"管牢房的小官田甲，看他落難了，常常羞辱他。","mv":[["田甲",1.0,0.0]]},{"who":"田甲","t":"你也有今天啊，哈哈！","fx":[["cheer","田甲"]]},{"who":"韓安國","t":"熄了的灰，難道就不會再燒起來嗎？","fx":[["focus","韓安國"],["say","韓安國"]]},{"who":"田甲","t":"燒起來？我就撒一泡尿，把它澆熄！","fx":[["focus",null]]},{"t":"沒多久，梁國缺一位「內史」，就是管理梁國政務的大官。朝廷派使者來，直接到牢裡任命韓安國！","mv":[["使者",0.8,0.9]],"fx":[["upset","田甲"]]},{"who":"使者","t":"皇上任命韓安國為梁國內史！","mv":[["田甲",7.6,1.2]],"fx":[["cheer","韓安國"]]}],"q":"韓安國從犯人一下子又當上大官，就像熄滅的灰燼又燒了起來。後來比喻失勢的人重新得勢，或停息的事又活動起來，叫做什麼？","wrong":[{"w":"雪中送炭","by":"使者","line":"雪中送炭是在別人困難時幫忙。田甲在韓大人困難時，可是一直羞辱他呢！"},{"w":"火上加油","by":"使者","line":"火上加油是讓情況變得更糟。韓大人是熄掉的灰又重新燒起來，不一樣啦！"},{"w":"東山再起","by":"韓安國","line":"東山再起也是失勢以後重新得勢，意思很接近！不過我說的是熄掉的灰，有一個專門的成語。"}],"hint":"想想韓安國說的話：熄掉的灰，又再燒起來。","after":"田甲嚇得逃走。韓安國叫他回來，田甲只好光著上身來賠罪。韓安國笑著說：「灰燒起來了，你可以撒尿了吧！」最後還是好好對待他。","lesson":{"title":"韓安國的度量","text":"韓安國後來做到御史大夫，是朝廷裡很重要的大官。他不記恨羞辱過他的人，很有度量。今天這個成語多用在不好的事情上，例如壞習慣又冒出來了。","next":"梁國還住過一位很會寫文章的才子，名叫司馬相如。梁王過世後，他回到了家鄉成都……"}},{"id":"e29_05","yr":"漢景帝末年","place":"成都．司馬相如家","scene":"house","music":"map","cast":[["司馬相如",-0.6,-0.4],["卓文君",-7.6,1.0]],"beats":[{"t":"梁孝王過世後，才子司馬相如回到家鄉成都。他很窮，只好到臨邛去投靠好朋友——臨邛縣令。","fx":[["focus","司馬相如"]]},{"t":"臨邛的大富翁卓王孫請客，相如在宴會上彈琴，琴聲好聽極了。","fx":[["say","司馬相如"]]},{"t":"卓王孫的女兒卓文君剛失去丈夫，住在娘家。她偷偷聽了琴聲，非常欣賞相如。"},{"t":"那天夜裡，文君離開家，跟著相如一起趕回成都。","mv":[["卓文君",0.9,-0.2]],"fx":[["focus",null]]},{"t":"一進門，文君愣住了：家裡什麼都沒有，只有四面牆壁立在那裡！","fx":[["upset","卓文君"],["focus","卓文君"]]},{"who":"卓文君","t":"這……這就是你的家？","fx":[["upset","卓文君"]]},{"who":"司馬相如","t":"嘿嘿，我家就是這樣……","fx":[["sad","司馬相如"]]}],"q":"司馬相如的家空空的，只剩下四面牆壁。後來用哪個成語，形容家裡非常貧窮？","wrong":[{"w":"金玉滿堂","by":"卓文君","line":"金玉滿堂是家裡堆滿金銀財寶。我爸爸家才是這樣，相如家可是什麼都沒有！"},{"w":"四海為家","by":"司馬相如","line":"四海為家是到處漂泊，把天下當成家。我至少還有四面牆嘛！"},{"w":"一貧如洗","by":"卓文君","line":"一貧如洗也是窮得像被水洗過一樣，意思很接近！不過相如家只剩下「牆」，有一個專門的成語。"}],"hint":"「徒」是只有。家裡只有幾面牆？","after":"卓王孫知道女兒跟著相如走了，氣得說：「我一個錢也不分給她！」","lesson":{"title":"當鑪賣酒","text":"後來兩人回到臨邛，開了一家小酒店。文君站在櫃檯賣酒，相如在市場裡洗碗盤。卓王孫覺得很丟臉，只好分給他們一百個僕人和一百萬錢，兩人才過上好日子。","next":"有人變富，也有人一下子變得冷清。下邽有一位翟公，就嘗到了人情的冷暖……"}},{"id":"e18_02","yr":"約西元前 140 年","place":"下邽．翟公家門口","scene":"palace","music":"map","cast":[["翟公",0.4,-0.8],["賓客",-1.2,0.6],["賓客",1.6,0.8],["賓客",0.3,1.5]],"beats":[{"t":"漢朝有一位翟公，住在下邽。他當上廷尉，是掌管全國刑法的大官。","fx":[["focus","翟公"]]},{"t":"每天來拜訪的客人，把他家門口擠得滿滿的。","fx":[["cheerAll","賓客"],["focus",null]]},{"who":"賓客","t":"翟大人！我帶了禮物來看您！","fx":[["say","賓客"]]},{"t":"後來翟公被免了官。客人們一個一個都不見了。","mv":[["賓客",-7.5,0.6],["賓客#2",7.5,0.8],["賓客#3",7.8,1.6]],"fx":[["sad","翟公"]]},{"t":"門口冷冷清清，只有麻雀在地上跳來跳去，張一張網就能抓到牠們。","fx":[["focus","翟公"]]},{"t":"過了一陣子，翟公又當上廷尉。那些客人聽說了，又想上門來。","mv":[["賓客",-1.2,0.6],["賓客#2",1.6,0.8],["賓客#3",0.3,1.5]],"fx":[["focus",null]]},{"who":"賓客#2","t":"翟大人，好久不見啦！我們一直很想念您！","fx":[["upset","翟公"]]}],"q":"翟公丟官的時候，家門口冷清得可以張網抓麻雀。後來用哪個成語，形容門庭冷落、很少有人來？","wrong":[{"w":"門庭若市","by":"賓客","line":"門庭若市是門口熱鬧得像市場，那是翟大人當官的時候啦！"},{"w":"鴉雀無聲","by":"賓客#2","line":"鴉雀無聲是安靜得一點聲音都沒有。這裡說的是沒人上門，麻雀多到可以抓呢！"},{"w":"門庭冷落","by":"翟公","line":"門庭冷落也是說家門口冷清，意思很接近！不過書上寫的是可以張網捕麻雀，有一個更生動的成語。"}],"hint":"「羅」是捕鳥的網，在這裡當動詞，就是張網捕捉。","after":"翟公在大門上寫了大字：「一死一生，乃知交情；一貧一富，乃知交態；一貴一賤，交情乃見。」經過生死、貧富、貴賤的變化，才看得出誰是真朋友。","lesson":{"title":"司馬遷的感嘆","text":"這段故事寫在《史記．汲鄭列傳》的最後。司馬遷說：連汲黯、鄭當時這麼賢能的人，有權勢時客人多十倍，沒權勢就沒人理，何況一般人呢？真令人感嘆！","next":"也有人不看權勢，只愛真正的學問。河間獻王劉德，就是一位愛書成痴的王……"}},{"id":"e24_05","yr":"約西元前 140 年","place":"河間國王宮","scene":"study","music":"palace","cast":[["河間獻王",-1.0,-1.6],["書吏",1.4,-1.4],["老先生",6.5,0.8]],"beats":[{"t":"漢景帝的兒子劉德被封為河間王，後人叫他「河間獻王」。他最愛研究學問、收集古書。","fx":[["focus","河間獻王"]]},{"t":"秦始皇燒過書，又經過多年戰亂，很多古書都失傳了。","fx":[["focus",null]]},{"t":"這天，一位老先生帶著家傳的古書，從遠方趕來。","mv":[["老先生",0.6,0.2]]},{"who":"老先生","t":"大王，這是我家祖先留下來的舊書，請您過目。","fx":[["say","老先生"]]},{"who":"河間獻王","t":"把它工工整整抄一份，抄本送給老先生，原本留下來收藏。再送他金子和絲綢！","fx":[["cheer","老先生"]]},{"t":"消息傳開，各地的人不遠千里送書來。河間國的藏書，多得跟朝廷差不多。","fx":[["cheer","河間獻王"]]},{"who":"河間獻王","t":"研究古書，要看清楚真正的內容，有根據才能下結論。","fx":[["focus","河間獻王"]]}],"q":"《漢書》稱讚河間獻王「修學好古」，做學問一定根據事實，去找出真正的道理。這是哪個成語？","wrong":[{"w":"道聽塗說","by":"書吏","line":"道聽塗說是把路上聽來的話隨便傳出去。大王做學問，可是最講究證據的！"},{"w":"囫圇吞棗","by":"老先生","line":"囫圇吞棗是讀書不仔細，整個吞下去。大王讀書可細心了！"},{"w":"腳踏實地","by":"河間獻王","line":"腳踏實地是做事踏實、一步一步來，意思有點接近！不過我說的是根據事實找出真相，有更貼切的成語。"}],"hint":"這裡的「是」不是「是不是」，而是指真相、正確的道理。","after":"河間獻王收集的，大多是秦朝以前流傳下來的古書，像《周官》《尚書》《禮記》《孟子》《老子》等。","lesson":{"title":"保存古書","text":"河間獻王還為《毛詩》和《左氏春秋》設立博士，讓這些學問傳下去。我們今天讀到的《詩經》，就是《毛詩》這個版本流傳下來的。","next":"這時候，年輕的漢武帝即位了。有一天，他讀到一篇非常精彩的文章……"}},{"id":"e58_07","yr":"漢武帝初年","place":"長安．皇宮","scene":"palace","music":"palace","cast":[["漢武帝",1.4,0.4],["楊得意",2.8,1.4],["司馬相如",-6.8,1.0]],"beats":[{"t":"漢武帝即位後，有一天讀到一篇叫〈子虛賦〉的文章，越讀越喜歡。","fx":[["cheer","漢武帝"]]},{"who":"漢武帝","t":"寫得真好！可惜我不能和作者生在同一個時代！","fx":[["sad","漢武帝"]]},{"t":"管理皇家獵狗的楊得意，剛好是蜀郡人。","fx":[["focus","楊得意"]]},{"who":"楊得意","t":"陛下，寫這篇賦的是我的同鄉司馬相如，他還活著呢！","fx":[["say","楊得意"]]},{"t":"漢武帝又驚又喜，馬上召見司馬相如。","mv":[["司馬相如",-1.0,0.6]],"fx":[["upset","漢武帝"],["focus",null]]},{"who":"司馬相如","t":"〈子虛賦〉只寫諸侯的事，不值得看。請讓我為陛下寫一篇天子打獵的賦！","fx":[["say","司馬相如"]]},{"t":"新的賦裡有三個人物在對話：楚國的「子虛」、齊國的「烏有先生」，還有「無是公」。","fx":[["focus","司馬相如"]]}],"q":"相如說：「子虛」是虛假的話，「烏有先生」是哪裡有這件事，「無是公」是沒有這個人——三個都是編出來的！後來用其中兩個名字，比喻假的、不存在的事，叫做什麼？","wrong":[{"w":"千真萬確","by":"楊得意","line":"千真萬確是非常真實、一點也不假。這三個人可都是編的喔！"},{"w":"名揚四海","by":"漢武帝","line":"名揚四海是名氣傳遍天下。相如現在確實很有名，可是我們說的是假人物啊！"},{"w":"無中生有","by":"司馬相如","line":"無中生有是把沒有的事硬說成有，常指捏造事實，意思很接近！不過要找的是用我筆下兩個人物名字組成的成語。"}],"hint":"答案就藏在相如筆下的兩個人物名字裡。","after":"漢武帝讀了新的賦，非常高興，讓司馬相如在朝廷當了郎官。","lesson":{"title":"漢賦","text":"「賦」是漢朝最流行的文學，用華麗的文字描寫宮殿、打獵和山水。司馬相如是漢賦最有名的作家之一，後來還奉命出使西南，安撫當地的部族。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十八章．文景之治","eps":[18,22,24,29,30,58]},{"key":"h17","line":"history","name":"年輕的漢武帝","short":"武帝初年","era":"西元前 135–129 年","color":"#C0623A","map":{"ground":"#b8bf7a","river":"#4f9fd8"},"intro":{"lines":["漢武帝即位時才十幾歲，一開始，祖母竇太皇太后還管著朝政。","西元前 135 年竇太后過世，漢武帝開始自己作主，四處尋找人才，思考怎麼治理國家。","北方的匈奴常常侵擾邊境，要打還是要和？大臣們吵成一團。","朝廷裡，竇嬰和田蚡兩家外戚鬥得很兇；遙遠的西方，張騫正在尋找月氏國。"],"people":[["漢武帝","年輕有為的皇帝"],["韓安國","御史大夫，說話很有分寸"],["田蚡","漢武帝的舅舅，當上丞相"],["張騫","出使西域的探險家"]]},"stops":[{"id":"e41_07","yr":"西元前 135 年","place":"長安．朝廷","scene":"office","music":"palace","cast":[["漢武帝",0.4,-2.1],["王恢",-1.6,0.2],["韓安國",1.8,0.2],["大臣",-0.4,1.3],["大臣",1.0,1.5]],"beats":[{"t":"匈奴派使者來，請求和漢朝「和親」——兩國結成親戚、不打仗。漢武帝讓大臣們討論。","fx":[["focus","漢武帝"]]},{"who":"王恢","t":"和親沒用！匈奴每次和好沒幾年，就又違背約定。不如出兵打他們！","fx":[["upset","王恢"]]},{"who":"韓安國","t":"匈奴騎著馬，像鳥一樣來去很快，很難抓住。跑到千里之外打仗，對我們不利。","fx":[["focus","韓安國"]]},{"who":"韓安國","t":"強弓射出的箭，飛到最後，連魯國最薄的絲絹都穿不透；大風吹到最後，連羽毛都吹不動。","fx":[["say","韓安國"]]},{"who":"韓安國","t":"我們的兵馬走了千里，也會像那支箭一樣，沒有力氣了。"},{"t":"大臣們大多贊成韓安國。","fx":[["cheerAll","大臣"],["focus",null]]}],"q":"韓安國用「飛到最後就沒力的箭」，來比喻遠征的軍隊。後來用哪個成語，比喻強大的力量已經衰弱、快用完了？","wrong":[{"w":"百步穿楊","by":"王恢","line":"百步穿楊是射箭很準，一百步外射中楊柳葉。韓大人說的是箭飛到最後沒力氣！"},{"w":"一箭雙鵰","by":"大臣","line":"一箭雙鵰是一次得到兩種好處。韓大人可沒說要射鵰呀！"},{"w":"力不從心","by":"韓安國","line":"力不從心是心裡想做、力氣卻不夠，意思有點接近！不過我說的是強弓射出的箭到了最後，有一個專門的成語。"}],"hint":"「弩」是一種很有力的弓，「末」是最後。","after":"漢武帝聽從多數人的意見，答應和匈奴和親。","lesson":{"title":"和親與馬邑之謀","text":"「和親」是把皇族的女兒嫁給匈奴單于，還送上許多禮物，換取和平。兩年後，王恢又提出計畫，在馬邑埋伏大軍引誘單于。單于發現不對勁就退走了，漢朝和匈奴從此打了起來。","next":"漢武帝想做大事，常常讀大臣和百姓寫來的建議。有一位叫徐樂的人，上書說了一個很特別的比喻……"}},{"id":"e16_07","yr":"約西元前 134 年","place":"長安．皇宮","scene":"office","music":"palace","cast":[["漢武帝",0.4,-2.1],["徐樂",-6.5,0.6],["主父偃",6.6,0.8],["嚴安",7.4,1.5]],"beats":[{"t":"漢武帝時，百姓也可以寫信給皇帝提建議。這天，燕地的讀書人徐樂送來一封信。","mv":[["徐樂",-0.9,0.4]],"fx":[["focus","漢武帝"]]},{"who":"徐樂","t":"陛下，天下最可怕的禍患，是「土崩」，而不是「瓦解」。","fx":[["focus","徐樂"],["say","徐樂"]]},{"who":"徐樂","t":"什麼是土崩？就像秦朝末年，百姓太辛苦，陳勝只是一個平民，振臂一呼，天下人都跟著反。","fx":[["upset","徐樂"]]},{"who":"徐樂","t":"什麼是瓦解？就像吳、楚等國叛亂，兵雖然多，百姓卻過得安穩，沒人跟著反，很快就平定了。"},{"who":"徐樂","t":"所以只要讓百姓安居樂業，國家就不怕從底下整個垮掉。","fx":[["focus",null]]},{"t":"漢武帝讀了，非常欣賞。","fx":[["cheer","漢武帝"]]}],"q":"徐樂說：土牆從底下整個崩塌，比屋頂掉幾片瓦還可怕。後來人們把這兩個比喻合在一起，形容徹底崩潰、無法收拾，是哪個成語？","wrong":[{"w":"堅如磐石","by":"漢武帝","line":"堅如磐石是像大石頭一樣堅固，剛好相反喔！"},{"w":"添磚加瓦","by":"主父偃","line":"添磚加瓦是為建設出一份力，那是在蓋房子，不是房子垮掉！"},{"w":"分崩離析","by":"徐樂","line":"分崩離析也是四分五裂、垮掉，意思很接近！不過我說的是「土」和「瓦」，有一個專門的成語。"}],"hint":"想想徐樂用的兩樣東西：泥土和瓦片。","after":"那天，主父偃、徐樂、嚴安三人的信一起送到。漢武帝召見他們，說：「你們以前都在哪裡？怎麼這麼晚才見到你們！」","lesson":{"title":"七國之亂","text":"徐樂說的「瓦解」，指的是漢景帝時吳王劉濞帶頭的「七國之亂」。七個諸侯國一起造反，三個月就被平定了，因為百姓生活安定，沒有人跟著起來反抗朝廷。","next":"漢武帝也向全國的讀書人提問：怎樣才能治理好國家？其中一位大學者叫董仲舒……"}},{"id":"e59_01","yr":"西元前 134 年","place":"長安．朝廷","scene":"office","music":"palace","cast":[["漢武帝",0.4,-2.1],["董仲舒",-6.5,0.6],["讀書人",1.8,1.0],["讀書人",2.8,0.2]],"beats":[{"t":"漢武帝下令各地推薦有學問、品德好的讀書人，親自出題，問他們治理國家的方法。","fx":[["focus","漢武帝"]]},{"who":"漢武帝","t":"怎樣才能讓國家長久安定？大家說說看！","fx":[["say","漢武帝"]]},{"t":"精通《春秋》的大學者董仲舒走上前，寫下他的回答。","mv":[["董仲舒",-1.0,0.4]],"fx":[["focus","董仲舒"]]},{"who":"董仲舒","t":"漢朝接在秦朝後面，秦朝留下的壞風氣，就像腐爛的木頭、髒污的牆壁。","fx":[["say","董仲舒"]]},{"who":"董仲舒","t":"這就像琴瑟的弦已經鬆了、亂了，怎麼彈都走音，再厲害的樂師也調不好。","fx":[["sad","董仲舒"]]},{"who":"漢武帝","t":"那該怎麼辦呢？","fx":[["upset","漢武帝"],["focus",null]]}],"q":"董仲舒說：「琴弦壞得厲害，就一定要解下舊弦、重新裝上新弦，才能彈奏；治國也一樣，做法行不通，就要改革。」這個比喻變成哪個成語？","wrong":[{"w":"對牛彈琴","by":"讀書人","line":"對牛彈琴是對不懂的人講道理。董先生是在教陛下怎麼把琴調好！"},{"w":"一成不變","by":"讀書人#2","line":"一成不變是一直不改變，剛好和董先生說的相反！"},{"w":"除舊布新","by":"董仲舒","line":"除舊布新是去掉舊的、換上新的，意思很接近！不過我用的是琴弦的比喻，有一個專門的成語。"}],"hint":"「弦」是琴弦，「張」是把琴弦裝上、拉緊。","after":"董仲舒一共回答了三次，歷史上叫做「天人三策」。他建議漢武帝重視儒家的學問，設立學校培養人才。","lesson":{"title":"尊崇儒學","text":"漢武帝後來設立「太學」，讓學生跟著博士學習儒家經典，讀書人也有機會靠學問當官。從此，儒家思想在中國影響了兩千多年。","next":"朝廷上有人得意，也有人失意。竇太后過世後，竇家的魏其侯竇嬰失去了權勢……"}},{"id":"e23_02","yr":"約西元前 133 年","place":"長安．竇嬰家","scene":"house","music":"palace","cast":[["竇嬰",-0.6,-0.2],["賓客",1.4,0.6],["賓客",2.4,-0.4],["灌夫",6.6,0.8]],"beats":[{"t":"竇嬰是竇太后的姪子，被封為魏其侯，還當過丞相。竇太后過世後，他失去了權勢。","fx":[["focus","竇嬰"]]},{"t":"以前圍著他轉的客人，一個個離開，跑去巴結新的丞相田蚡。","mv":[["賓客",7.5,0.6],["賓客#2",7.8,-0.2]],"fx":[["sad","竇嬰"]]},{"t":"將軍灌夫個性剛直、愛喝酒，最看不起見風轉舵的人。他也失了勢，朋友越來越少。","mv":[["灌夫",1.2,0.4]],"fx":[["focus",null]]},{"who":"灌夫","t":"竇大人，那些人只會看權勢。我灌夫才不管那一套！","fx":[["say","灌夫"]]},{"who":"竇嬰","t":"說得好！灌將軍真是爽快的人！","fx":[["cheer","竇嬰"]]},{"t":"兩人互相幫忙、互相推崇，好得像父子一樣，常常聊到忘了時間。","fx":[["cheer","灌夫"]]}],"q":"竇嬰和灌夫越相處越開心，怎麼聊都聊不夠，只遺憾兩人認識得太晚了。這是哪個成語？","wrong":[{"w":"形同陌路","by":"竇嬰","line":"形同陌路是像陌生人一樣。我們可是好得像父子呢！"},{"w":"恨之入骨","by":"灌夫","line":"恨之入骨是恨到骨頭裡。這裡的「恨」是遺憾，不是討厭啦！"},{"w":"一見如故","by":"竇嬰","line":"一見如故是第一次見面就像老朋友，意思很接近！不過我們是越聊越投合，遺憾認識得太晚，有一個專門的成語。"}],"hint":"這裡的「恨」不是討厭，而是遺憾。","after":"有一次，灌夫說好要帶丞相田蚡來竇嬰家。竇嬰和夫人買肉買酒，整夜打掃準備，田蚡卻睡到中午都沒來！","lesson":{"title":"外戚之爭","text":"竇嬰是竇太后的親戚，田蚡是王太后的弟弟，兩人都是「外戚」，也就是皇帝母親或祖母那邊的親戚。田蚡當上丞相後很驕傲，和竇嬰、灌夫的關係越來越壞。","next":"不久，灌夫在一場宴會上大罵賓客，被田蚡抓了起來。竇嬰為了救他，和田蚡在皇帝面前吵了起來……"}},{"id":"e15_05","yr":"西元前 131 年","place":"長安．東宮","scene":"office","music":"palace","cast":[["漢武帝",0.4,-2.1],["竇嬰",-1.8,0.2],["田蚡",1.8,0.2],["韓安國",-0.2,1.4],["大臣",2.9,1.4]],"beats":[{"t":"灌夫在丞相田蚡的婚宴上大罵賓客，被田蚡抓了起來，還要治他重罪。","fx":[["upset","田蚡"]]},{"who":"竇嬰","t":"灌夫只是喝醉了，說話衝動，罪不至死啊！","fx":[["say","竇嬰"]]},{"who":"田蚡","t":"灌夫平常橫行霸道，家人還在家鄉欺負百姓，一定要嚴辦！","fx":[["upset","田蚡"]]},{"who":"漢武帝","t":"你們說，他們兩個誰說得對？","fx":[["focus","漢武帝"]]},{"who":"韓安國","t":"魏其侯說得對……丞相說得也對。還是請陛下自己決定吧。","fx":[["focus","韓安國"]]},{"t":"退朝後，田蚡叫韓安國上他的車，氣沖沖地罵了起來。","mv":[["田蚡",0.6,0.9]],"fx":[["focus",null]]},{"who":"田蚡","t":"我們一起對付一個沒權沒勢的老頭子，你怎麼像出洞的老鼠一樣，探頭探腦，一下看左一下看右？","fx":[["upset","田蚡"]]}],"q":"田蚡罵韓安國：像老鼠出洞時探頭探腦，拿不定主意要往哪一邊。後來比喻猶豫不決、態度搖擺，叫做什麼？","wrong":[{"w":"膽小如鼠","by":"竇嬰","line":"膽小如鼠是膽子像老鼠一樣小。丞相罵的是韓大人兩邊都說對、不肯表態！"},{"w":"獐頭鼠目","by":"大臣","line":"獐頭鼠目是形容長相難看、鬼鬼祟祟。丞相說的是態度，不是長相啦！"},{"w":"左右為難","by":"韓安國","line":"左右為難是兩邊都不好選，意思很接近！不過丞相罵我的是老鼠探頭的樣子，有一個專門的成語。"}],"hint":"老鼠的「頭」，一下伸向這一邊，一下伸向那一邊。","after":"韓安國冷靜地說：「您應該向皇上謝罪，說自己不夠格當丞相，竇嬰反而會覺得慚愧。」田蚡也覺得有道理。","lesson":{"title":"東朝廷辯","text":"這場辯論在王太后住的東宮舉行。王太后聽說大臣不站在弟弟田蚡那邊，氣得不吃飯。漢武帝只好下令查辦，最後灌夫和竇嬰都被判了死罪。","next":"灌夫到底在婚宴上說了什麼，惹出這麼大的禍？讓我們把時間倒回幾個月前……"}},{"id":"e42_07","yr":"西元前 131 年","place":"長安．丞相田蚡的婚宴","scene":"office","music":"palace","cast":[["田蚡",0.2,-1.0],["灌夫",-1.6,0.4],["竇嬰",-0.6,1.4],["臨汝侯",1.8,0.4],["程不識",2.8,0.0],["賓客",1.0,1.5],["賓客",-0.4,-0.6]],"beats":[{"t":"丞相田蚡娶燕王的女兒當夫人。王太后下令，列侯和皇族都要去道賀。","fx":[["cheer","田蚡"]]},{"t":"竇嬰硬拉著灌夫一起去。酒喝到一半，灌夫起身，一個一個向大家敬酒。","mv":[["灌夫",-0.4,-0.2]],"fx":[["focus","灌夫"]]},{"who":"田蚡","t":"我喝不了滿杯。","fx":[["say","田蚡"]]},{"t":"田蚡連座位都不離開，灌夫心裡很不高興。接著敬到臨汝侯，他正和將軍程不識說悄悄話，也不理灌夫。","mv":[["灌夫",1.0,0.8]],"fx":[["focus","臨汝侯"]]},{"who":"灌夫","t":"你平常說程不識，連一個銅錢都不值！今天長輩敬酒，你卻學小女孩咬耳朵！","fx":[["upset","灌夫"]]},{"t":"客人們嚇得紛紛起身離開。","mv":[["賓客",7.5,1.4],["賓客#2",7.5,-0.6]],"fx":[["upset","田蚡"],["focus",null]]},{"who":"田蚡","t":"灌夫在我的婚宴上鬧事！來人，把他抓起來！","fx":[["upset","田蚡"]]}],"q":"灌夫罵臨汝侯：「你平常把程不識說得連一個錢也不值。」後來用哪個成語，形容毫無價值？","wrong":[{"w":"價值連城","by":"程不識","line":"價值連城是值好幾座城，非常珍貴。我被說得剛好相反啊！"},{"w":"一諾千金","by":"竇嬰","line":"一諾千金是說話算話，承諾比千兩黃金還珍貴。灌夫罵的是不值錢！"},{"w":"微不足道","by":"臨汝侯","line":"微不足道是小得不值得一提，意思很接近！不過灌夫罵人時說的是「錢」，有一個專門的成語。"}],"hint":"到底值不值錢？連「一個錢」也……","after":"田蚡說：「這是我平常太放縱灌夫了！」他把灌夫關起來，還派人去抓灌夫的家人。","lesson":{"title":"灌夫罵座","text":"灌夫喝醉罵人這件事，歷史上叫做「灌夫罵座」。一時的氣話，最後害了灌夫，也連累了竇嬰。說話前先冷靜，真的很重要！","next":"漢武帝的朝廷裡，也有人完全不講人情。負責制定法律的趙禹，就是這樣一個人……"}},{"id":"e58_08","yr":"約西元前 130 年","place":"長安．趙禹家","scene":"study","music":"palace","cast":[["趙禹",-1.0,-1.6],["張湯",0.6,-1.2],["大官",6.5,0.8],["大官",7.2,1.6]],"beats":[{"t":"漢武帝時，趙禹和張湯一起制定國家的法律，條文訂得又多又嚴。","fx":[["focus","趙禹"]]},{"who":"張湯","t":"趙大哥，這一條你看這樣寫好不好？","fx":[["say","張湯"]]},{"t":"趙禹為人清廉，又很高傲。他當官以來，家裡從來不養食客。","fx":[["focus",null]]},{"t":"朝中的大官們常常來拜訪他，想和他交朋友。","mv":[["大官",1.4,0.6],["大官#2",2.4,1.2]]},{"who":"大官","t":"趙大人，有件事想請您幫個忙、通融一下……","fx":[["say","大官"]]},{"who":"趙禹","t":"不行。一切照法律來。","fx":[["focus","趙禹"]]},{"t":"趙禹從不回訪答謝，也一律拒絕親友的請託。大官們只好摸摸鼻子離開。","mv":[["大官",7.5,0.8],["大官#2",7.8,1.6]],"fx":[["sadAll","大官"],["focus",null]]}],"q":"《史記》說趙禹斷絕朋友、客人的請託，只照自己的意思做事。這句話後來變成哪個成語？今天多用來形容人固執、不聽勸。","wrong":[{"w":"從善如流","by":"張湯","line":"從善如流是很樂意聽好的意見。趙大哥可是誰的話都不聽！"},{"w":"隨波逐流","by":"大官","line":"隨波逐流是跟著別人走、沒有主見。趙大人剛好相反呀！"},{"w":"剛愎自用","by":"大官#2","line":"剛愎自用是固執又自以為是，意思很接近！不過《史記》寫趙禹「孤立行一意」，有一個專門的成語。"}],"hint":"原文是「孤立行一意」，把字的順序調一調。","after":"趙禹後來也當上廷尉。他晚年辦案反而比較寬和，被稱為公平的官。","lesson":{"title":"古今意思不同","text":"原本「孤立行一意」是說趙禹不講人情、公事公辦，帶有稱讚的意思。現在這個成語卻多指固執己見、不聽勸告，是批評的話。成語的意思，也會隨著時間改變喔！","next":"就在朝廷忙著訂法律的時候，十年前出使西域的張騫，正在遙遠的西方……"}},{"id":"e29_08","yr":"約西元前 129 年","place":"大月氏（媯水邊）","scene":"river","music":"map","cast":[["張騫",-6.6,0.6],["堂邑父",-7.4,1.4],["月氏王",1.6,-0.4],["月氏大臣",2.8,0.6]],"beats":[{"t":"漢武帝想聯合西方的月氏，一起夾攻匈奴，派張騫帶著一百多人出發。","fx":[["focus","月氏王"]]},{"t":"張騫在路上被匈奴抓住，扣留了十多年，還在那裡娶妻生子。可是他一直保存著漢朝的符節。","fx":[["focus",null]]},{"t":"後來他和隨從堂邑父逃了出來，經過大宛、康居，終於找到大月氏。","mv":[["張騫",-0.6,0.4],["堂邑父",-1.6,1.2]]},{"who":"張騫","t":"大王，漢朝皇帝願意和月氏一起出兵，打敗匈奴，為您的先王報仇！","fx":[["say","張騫"]]},{"who":"月氏王","t":"我們現在住的地方土地肥沃，很少有敵人來搶，日子過得很快樂。","fx":[["cheer","月氏王"]]},{"who":"月氏大臣","t":"漢朝離我們那麼遠，何必去找匈奴打仗呢？","fx":[["say","月氏大臣"]]},{"t":"張騫又到南邊的大夏國，前前後後待了一年多，怎麼說都談不出結果。","fx":[["sad","張騫"]]}],"q":"張騫始終沒辦法說服月氏，抓不到事情的重點。古人說衣服的「腰」和「領子」最重要，抓不到它們，就叫做什麼？","wrong":[{"w":"大功告成","by":"堂邑父","line":"大功告成是事情順利完成。我們這次可沒談成呀！"},{"w":"如願以償","by":"月氏王","line":"如願以償是願望實現了。張騫的願望可沒實現喔！"},{"w":"不著邊際","by":"張騫","line":"不著邊際是說話空泛、碰不到重點，意思有點接近！不過我是怎麼談都抓不到衣服的腰和領，有一個專門的成語。"}],"hint":"古代的「要」就是「腰」，衣服的腰和領子最重要。","after":"回程時，張騫又被匈奴抓住一年多，最後趁匈奴內亂才逃回長安。出發時一百多人，回來的只剩兩個人。","lesson":{"title":"鑿空西域","text":"張騫雖然沒有完成聯合月氏的任務，卻帶回了西域各國的地理、物產和風俗。漢朝從此認識了遙遠的西方，後來打通了東西往來的「絲路」。司馬遷說他是「鑿空」——第一個打通這條路的人。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十九章．年輕的漢武帝","eps":[15,16,23,29,41,42,58,59]},{"key":"h18","line":"history","name":"大漢盛世","short":"大漢盛世","era":"西元前 125–61 年","color":"#B8902E","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["漢武帝在位五十四年，派衛青、霍去病打敗匈奴，又開通西域，漢朝變得非常強大。","這時候出了許多人物：走遍天下、寫下《史記》的司馬遷，敢當面批評皇帝的汲黯，還有手段嚴厲的「酷吏」。","漢武帝晚年，把年幼的太子託付給霍光。霍光輔佐昭帝、宣帝，讓國家又安定了二十年。","漢宣帝時天下太平，歷史上稱為「中興」。一起去看看這段大漢盛世吧！"],"people":[["司馬遷","太史令，寫下《史記》"],["汲黯","敢當面批評皇帝的直臣"],["霍光","受漢武帝託孤的大將軍"],["漢宣帝","讓西漢中興的皇帝"]]},"stops":[{"id":"e42_01","yr":"約西元前 125 年","place":"薛地（孟嘗君的封地）","scene":"road","music":"map","cast":[["司馬遷",-6.6,0.6],["老人",1.8,-0.6],["年輕人",0.6,-1.5],["年輕人",2.8,0.6]],"beats":[{"t":"司馬遷二十歲時開始遊歷天下，到過江淮、會稽、齊魯，到處尋訪古代的遺跡和故事。","mv":[["司馬遷",-0.8,0.6]],"fx":[["focus","司馬遷"]]},{"t":"這天，他來到戰國時代孟嘗君的封地——「薛」。","fx":[["focus",null]]},{"t":"街上有很多兇猛好鬥的年輕人，看起來不太好惹。","fx":[["upset","年輕人"],["upset","年輕人#2"]]},{"who":"司馬遷","t":"奇怪，附近鄒、魯的人都溫和有禮，這裡怎麼這麼不一樣？","fx":[["focus","司馬遷"]]},{"who":"老人","t":"從前孟嘗君喜歡招攬天下的俠客，連品行不好的人也來了。搬來薛地住的，有六萬多家呢！","fx":[["say","老人"]]},{"who":"司馬遷","t":"原來如此！大家都說孟嘗君喜歡結交賓客，看來……","fx":[["cheer","司馬遷"]]}],"q":"司馬遷親眼看到薛地的風俗，證明大家說「孟嘗君很好客」一點也不假。名聲和實際相符，不是空有虛名，叫做什麼？","wrong":[{"w":"徒有虛名","by":"年輕人","line":"徒有虛名是只有名聲、沒有真本事，剛好相反！"},{"w":"默默無聞","by":"老人","line":"默默無聞是沒有人知道。孟嘗君的名氣可大了！"},{"w":"名副其實","by":"司馬遷","line":"名副其實也是名稱和實際相符，意思很接近！不過我要說的是大家「傳」說的名聲果然不假，有一個更貼切的成語。"}],"hint":"「虛」是空的、假的。大家「傳」說的名聲，一點也不……","after":"孟嘗君「雞鳴狗盜」的故事，就是司馬遷寫在《史記．孟嘗君列傳》裡的。","lesson":{"title":"司馬遷的大旅行","text":"司馬遷年輕時走遍大江南北，親自訪問老人、查看古蹟。後來他接下父親的職位當太史令，把這些見聞寫進《史記》，所以書裡的故事特別生動。","next":"朝廷裡有一位大臣，常常當面頂撞漢武帝，他叫汲黯……"}},{"id":"e42_08","yr":"約西元前 120 年","place":"長安．朝廷","scene":"office","music":"palace","cast":[["漢武帝",0.4,-2.1],["汲黯",-1.6,0.4],["公孫弘",6.5,0.6],["張湯",7.2,1.4]],"beats":[{"t":"汲黯個性耿直，常常當面批評漢武帝，連武帝都有點怕他。","fx":[["focus","汲黯"]]},{"t":"汲黯當上九卿大官的時候，公孫弘和張湯都還只是小官員。","fx":[["focus",null]]},{"t":"後來兩人越升越高：公孫弘當上丞相、封了侯，張湯也做到御史大夫。","mv":[["公孫弘",1.6,-0.6],["張湯",2.6,0.3]],"fx":[["cheer","公孫弘"]]},{"t":"汲黯的官位卻一直沒升，心裡很不服氣。","fx":[["sad","汲黯"]]},{"who":"汲黯","t":"陛下用大臣，就像堆柴火一樣……","fx":[["upset","汲黯"],["focus","汲黯"]]}],"q":"汲黯接著說：「後來的柴，反而堆在最上面！」意思是後來的人，官位反而比他高。這句話變成哪個成語？現在多用來稱讚後輩超越前人。","wrong":[{"w":"青黃不接","by":"張湯","line":"青黃不接是舊糧吃完、新糧還沒收成。汲大人講的是堆柴，不是種稻！"},{"w":"大器晚成","by":"公孫弘","line":"大器晚成是有大才能的人比較晚成功——說的是我啦，我六十歲才進朝廷！不過汲大人抱怨的是後來的人跑到他前面。"},{"w":"青出於藍","by":"漢武帝","line":"青出於藍也是學生超過老師、後輩超過前輩，意思很接近！不過汲黯說的是堆柴火，有一個專門的成語。"}],"hint":"堆柴的時候，後來放的柴，會在哪個位置？","after":"漢武帝當場沒說話。等汲黯退下，武帝說：「人真的不能不讀書，看汲黯說話越來越不像話了。」","lesson":{"title":"社稷之臣","text":"汲黯說話雖然不好聽，漢武帝還是很敬重他，說他接近能保護國家的「社稷之臣」。這句話原本是抱怨，今天卻多用來稱讚後來的人努力趕上、超越前人。","next":"漢武帝也重用一些手段非常嚴厲的官員，叫做「酷吏」。其中一位叫義縱……"}},{"id":"e41_08","yr":"約西元前 120 年","place":"南陽、定襄郡","scene":"office","music":"night","cast":[["義縱",-6.6,0.4],["寧成",1.6,0.6],["官吏",2.6,-0.4],["百姓",1.2,1.5],["百姓",2.9,1.2]],"beats":[{"t":"義縱是漢武帝時有名的「酷吏」。他到南陽當太守時，當地很有勢力的寧成，彎著腰恭敬地迎接他。","mv":[["義縱",-0.6,0.2]],"fx":[["focus","寧成"]]},{"who":"寧成","t":"太守大人，一路辛苦了！","fx":[["say","寧成"]]},{"who":"義縱","t":"哼！","fx":[["upset","義縱"],["focus","義縱"]]},{"t":"義縱一上任就徹查寧家，把他們家整個查辦到底。南陽的豪強嚇得四處逃走。","mv":[["寧成",7.6,0.6]],"fx":[["focus",null]]},{"t":"後來朝廷派他到北方的定襄當太守。定襄治安很亂，他用更嚴厲的手段處置犯人。","fx":[["upset","義縱"]]},{"t":"連偷偷到牢裡探望犯人的親友，也被一起抓起來。一天之內，就有四百多人被判了死罪。","fx":[["sadAll","百姓"]]}],"q":"從此定襄郡的人，天氣明明不冷，卻嚇得全身發抖，連狡猾的人都乖乖幫官府做事。這種害怕到發抖的樣子，叫做什麼？","wrong":[{"w":"天寒地凍","by":"官吏","line":"天寒地凍是天氣非常冷。可是現在天氣一點都不冷啊！"},{"w":"手舞足蹈","by":"百姓","line":"手舞足蹈是高興得跳起舞來。我們嚇都嚇壞了，哪跳得起來？"},{"w":"膽戰心驚","by":"百姓#2","line":"膽戰心驚也是非常害怕，意思很接近！不過書上說天氣不冷卻發抖，有一個專門的成語。"}],"hint":"「慄」是發抖。天氣真的「寒」嗎？","after":"《史記》原文寫作「不寒而栗」，這裡的「栗」就是發抖的意思。","lesson":{"title":"酷吏","text":"司馬遷把義縱、張湯、趙禹這些用嚴刑治理的官員，寫進《酷吏列傳》。他們讓人害怕，卻不能讓人真心向善。後來義縱自己也因為違抗朝廷的命令被處死。","next":"漢武帝很嚴厲，卻也有柔情的一面。他心愛的李夫人過世後，他怎麼也忘不了她……"}},{"id":"e43_08","yr":"漢武帝時","place":"長安．皇宮（夜晚）","scene":"night","music":"night","cast":[["漢武帝",-0.8,1.2],["少翁",6.6,0.6],["宮女",2.8,1.5],["李夫人",0.6,-3.6,0,1,1]],"beats":[{"t":"漢武帝最寵愛的李夫人，年紀輕輕就生病過世了。武帝非常想念她。","fx":[["sad","漢武帝"]]},{"who":"漢武帝","t":"好想再見她一面啊……","fx":[["focus","漢武帝"]]},{"t":"齊國來的方士少翁說，他有法術，能把李夫人的魂請回來。","mv":[["少翁",1.0,0.3]],"fx":[["focus","少翁"]]},{"who":"少翁","t":"請陛下坐在另一個帳子裡，遠遠地看，千萬不能走近！","fx":[["say","少翁"]]},{"t":"夜裡點起燈燭、掛上帳幕、擺好酒肉。遠遠的帳子裡，隱約出現一位很像李夫人的美女。","mv":[["李夫人",0.6,-3.2]],"fx":[["focus","李夫人"]]},{"t":"她慢慢地走著，一會兒坐下，一會兒又走動。武帝卻不能靠近看清楚。","mv":[["李夫人",-0.6,-3.4]],"fx":[["upset","漢武帝"]]},{"who":"漢武帝","t":"是她嗎？還是不是她？","fx":[["focus","漢武帝"]]}],"q":"漢武帝越看越傷心，作了一首詩：「是她嗎？不是嗎？我站著遠遠望她，為什麼她走得那麼慢，遲遲不過來呢？」後來形容人很晚才到，用哪個成語？","wrong":[{"w":"健步如飛","by":"宮女","line":"健步如飛是走路快得像在飛。這位夫人走得可慢了！"},{"w":"捷足先登","by":"少翁","line":"捷足先登是腳步快的人先到。她是慢慢地、很晚才來！"},{"w":"千呼萬喚","by":"漢武帝","line":"千呼萬喚是叫了好多次才出來，意思有點接近！不過我詩裡寫的是她慢慢走來的樣子，有一個專門的成語。"}],"hint":"詩的最後一句，形容她走路慢吞吞、很晚才來。","after":"武帝讓宮廷樂師把這首詩譜成歌來唱。小提醒：《史記》說少翁請來的是另一位「王夫人」；而且這種招魂，很可能只是方士的把戲。","lesson":{"title":"方士與求仙","text":"漢武帝很想長生不老，身邊聚集了許多自稱會法術的方士。少翁被封為「文成將軍」，可是法術一直不靈，後來被武帝發現作假，就被處死了。","next":"漢武帝晚年，朝廷做了一件和每個人都有關的大事：重新制定曆法……"}},{"id":"e43_06","yr":"西元前 104 年","place":"長安．朝廷","scene":"office","music":"palace","cast":[["漢武帝",0.4,-2.1],["司馬遷",-1.8,0.4],["鄧平",6.5,0.6],["淳于陵渠",7.2,1.4]],"beats":[{"t":"漢朝初年沿用秦朝的曆法。用了一百多年，日子和天上月亮的圓缺對不上了。","fx":[["focus","漢武帝"]]},{"who":"司馬遷","t":"陛下，曆法已經亂了，應該重新制定！","fx":[["say","司馬遷"]]},{"who":"漢武帝","t":"好！找天下懂天文曆法的人來，造出新的曆法！","fx":[["say","漢武帝"],["focus",null]]},{"t":"各地來了二十多位專家，造出好幾種曆法。最後選中了鄧平做的「八十一分律曆」。","mv":[["鄧平",1.6,0.4]],"fx":[["cheer","鄧平"]]},{"t":"宦官淳于陵渠負責檢驗，拿新曆法對照月亮的變化和天象。","mv":[["淳于陵渠",2.6,1.2]],"fx":[["focus","淳于陵渠"]]},{"who":"淳于陵渠","t":"這部曆法最精準！太陽和月亮像兩塊美玉合在一起，五顆行星像珍珠串成一串！","fx":[["cheer","淳于陵渠"]]}],"q":"「日月如合璧，五星如連珠」原本是形容天象。後來把珍珠和美玉連在一起，比喻美好的人或事物配在一起，叫做什麼？","wrong":[{"w":"魚目混珠","by":"鄧平","line":"魚目混珠是拿魚眼睛冒充珍珠，以假亂真。我的曆法可是貨真價實！"},{"w":"珠光寶氣","by":"司馬遷","line":"珠光寶氣是穿戴很多珠寶、打扮得很華麗。這裡說的是天上的日月星星啊！"},{"w":"天作之合","by":"漢武帝","line":"天作之合是天生的一對，意思有點接近！不過淳于陵渠說的是珍珠和美玉，有一個專門的成語。"}],"hint":"「璧」是中間有洞的圓形美玉，和牆壁的「壁」不一樣。","after":"漢武帝改用新曆法，還把年號改成「太初」，這部曆法就叫《太初曆》。鄧平也升為太史丞。","lesson":{"title":"太初曆","text":"《太初曆》把一年的開始定在正月，還把二十四節氣放進曆法裡。我們今天過農曆新年、看節氣，都和這部兩千多年前的曆法有關。","next":"漢武帝晚年，太子才八歲。他把國家託付給一位忠心的大臣——霍光……"}},{"id":"e30_04","yr":"西元前 87–66 年","place":"長安．皇宮","scene":"palace","music":"palace","cast":[["漢武帝",1.4,0.4],["霍光",-0.8,0.6],["漢宣帝",1.6,0.2,0,1,1],["霍光夫人",6.6,0.8]],"beats":[{"t":"漢武帝病重時，太子劉弗陵才八歲。武帝把國家託付給大將軍霍光。","fx":[["focus","漢武帝"]]},{"who":"漢武帝","t":"你要像周公輔佐周成王一樣，好好輔佐太子！","fx":[["say","漢武帝"]]},{"t":"霍光小心謹慎，忠心輔佐漢昭帝。昭帝過世後，他又迎立漢宣帝，國家安定了將近二十年。","mv":[["漢武帝",7.6,0.4],["漢宣帝",1.6,0.2]],"fx":[["focus",null]]},{"t":"可是霍光的妻子霍顯，一心想讓小女兒當皇后，竟偷偷害死了宣帝的許皇后。","mv":[["霍光夫人",0.6,-0.8]],"fx":[["upset","霍光"]]},{"who":"霍光夫人","t":"老爺，這件事千萬不能說出去，就讓我們的女兒當皇后吧！","fx":[["say","霍光夫人"]]},{"t":"霍光知道後非常震驚，卻沒有揭發妻子，還讓女兒當上了皇后。","fx":[["sad","霍光"],["focus","霍光"]]}],"q":"東漢的史學家班固稱讚霍光忠心，卻也批評他：不讀書、沒有學問，所以不明白做人做事的大道理。這是哪個成語？","wrong":[{"w":"博學多聞","by":"漢宣帝","line":"博學多聞是學問廣、見識多。班固說的剛好相反！"},{"w":"文武雙全","by":"霍光夫人","line":"文武雙全是文才武藝都很好。可惜我家老爺的問題，就是不愛讀書……"},{"w":"孤陋寡聞","by":"霍光","line":"孤陋寡聞是見識少、知道的不多，意思有點接近！不過班固說的是我不學習、所以沒有真本事，有一個專門的成語。"}],"hint":"沒有「學」習，所以也沒有本事（「術」）。","after":"霍光過世後，許皇后被害的事傳了出來。霍家人害怕被查辦，竟然想造反，結果全家都被定了罪。","lesson":{"title":"麒麟閣功臣","text":"雖然霍家下場悲慘，漢宣帝還是記得霍光的功勞。他把十一位功臣的畫像掛在麒麟閣，霍光排在第一位，而且只寫官位和姓，不寫名字，表示尊敬。","next":"漢宣帝很喜歡文章。他聽說蜀地有一位才子，名叫王襃……"}},{"id":"e59_02","yr":"約西元前 61 年","place":"長安．皇宮","scene":"palace","music":"palace","cast":[["漢宣帝",1.4,0.4],["王襃",-6.6,0.8],["王襄",-7.4,1.5]],"beats":[{"t":"漢宣帝時天下太平。宣帝喜歡文章，常常找有才華的人來寫詩作賦。","fx":[["focus","漢宣帝"]]},{"t":"益州刺史王襄推薦蜀地的才子王襃，宣帝立刻召他到長安。","mv":[["王襃",-1.0,0.6],["王襄",-1.8,1.4]],"fx":[["focus",null]]},{"who":"漢宣帝","t":"你就以「聖明的君主得到賢能的大臣」為題，寫一篇頌吧！","fx":[["say","漢宣帝"]]},{"who":"王襃","t":"老虎一吼，大風就跟著颳起；龍一飛上天，雲朵就聚集過來。","fx":[["say","王襃"],["focus","王襃"]]},{"who":"王襃","t":"世上有聖明的君主，才會有賢明的大臣。君臣同心，就像虎和風、龍和雲。"},{"who":"王襃","t":"賢臣們在朝廷上聚精會神，和君主互相配合……","fx":[["cheer","漢宣帝"]]}],"q":"王襃說：明君和賢臣互相配合、互相襯托，雙方的長處就更加明顯。這是哪個成語？","wrong":[{"w":"各行其是","by":"王襄","line":"各行其是是各做各的。王襃說的是君臣同心合作！"},{"w":"勢不兩立","by":"漢宣帝","line":"勢不兩立是雙方是敵人，不能同時存在。明君和賢臣怎麼會是敵人呢？"},{"w":"相輔相成","by":"王襃","line":"相輔相成是互相幫助、互相成全，意思很接近！不過我強調的是配合以後，彼此的優點更「明顯」，有一個專門的成語。"}],"hint":"「彰」是明顯。互相配合以後，長處「更加」明顯。","after":"原文寫作「相得益章」，「章」通「彰」。同一篇文章裡，還有「聚精會神」這個成語喔！","lesson":{"title":"孝宣中興","text":"漢宣帝從小在民間長大，知道百姓的辛苦。他認真挑選好官、整頓吏治，國家強盛，歷史上稱為「孝宣中興」。西元前 51 年，匈奴的呼韓邪單于也親自到長安朝見。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十章．大漢盛世","eps":[30,41,42,43,59]},{"key":"h19","line":"history","name":"西漢落幕","short":"西漢末年","era":"西元前 56–西元 23 年","color":"#A0603A","map":{"ground":"#b0c07a","river":"#4f9fd8"},"intro":{"lines":["漢宣帝時，西漢國力還很強盛，北方的匈奴單于也來長安朝見。","漢元帝、漢成帝以後，皇帝越來越軟弱，皇太后的娘家「外戚」王家掌握了大權。","這時讀書人越來越多，有窮苦卻努力讀書的學生，也有敢對皇帝說真話的大臣。","最後，王家的王莽奪了皇位，建立「新朝」，天下很快又大亂了。"],"people":[["漢宣帝","讓西漢再度興盛的皇帝"],["劉向","替皇家整理藏書的大學者"],["揚雄","西漢有名的文學家"],["王莽","外戚，奪走漢朝的皇位"]]},"stops":[{"id":"e43_01","yr":"西元前 56 年","place":"長安．朝廷","scene":"office","music":"palace","cast":[["楊惲",-1.2,0.6],["朋友",0.6,1.0],["戴長樂",6.8,1.2],["漢宣帝",7.2,-0.6]],"beats":[{"t":"漢宣帝時，大臣楊惲是司馬遷的外孫。他很有才華，可是個性很直，說話不留情面，得罪了不少人。"},{"t":"有一天，匈奴那邊投降過來的人說：匈奴的單于被殺了。楊惲聽了，就和朋友聊起來。","fx":[["say","楊惲"]]},{"who":"楊惲","t":"國君不好，大臣有好計策他也不用，才會落得連安身的地方都沒有！"},{"who":"楊惲","t":"古代亡國的秦朝也是這樣。依我看，古代和現在的國君，其實都差不多！","fx":[["focus","楊惲"]]},{"t":"戴長樂和楊惲本來就有過節。他聽到這些話，馬上跑去向皇帝告狀。","mv":[["戴長樂",2.2,0.4]],"fx":[["focus",null]]},{"who":"戴長樂","t":"陛下！楊惲拿亡國的事，來諷刺現在的朝廷！","mv":[["漢宣帝",3.4,-0.8]],"fx":[["upset","戴長樂"]]}],"q":"楊惲說，古代和現在的國君，就像同一座山丘上的同一種小動物，一樣不好，沒有什麼差別。這句話變成哪個成語？","wrong":[{"w":"天壤之別","by":"楊惲","line":"天壤之別是像天和地一樣差很多。我說的剛好相反，是一模一樣！"},{"w":"青出於藍","by":"朋友","line":"青出於藍是學生比老師還厲害。楊大人可不是在稱讚誰喔。"},{"w":"半斤八兩","by":"楊惲","line":"半斤八兩也是說兩邊差不多，意思很接近！不過我說的是山丘上的小動物，而且是專門罵壞人的。"}],"hint":"那種小動物長得像狐狸，念作「ㄏㄜˊ」。","after":"漢宣帝不忍心殺他們，下令把楊惲和戴長樂的官職都免了，貶為平民。","winSad":"楊惲","lesson":{"title":"說話惹禍的楊惲","text":"司馬遷的《史記》，就是楊惲把它公開，大家才讀得到的。可惜楊惲回家後還是愛發牢騷，兩年後又被人告發，被判了重罪。","next":"楊惲出事以後，和他要好的朋友都受到牽連，其中一位，就是管理京城的張敞……"}},{"id":"e30_05","yr":"西元前 54 年","place":"長安．京兆尹官府","scene":"office","music":"palace","cast":[["張敞",-0.6,0.4],["絮舜",1.2,0.9],["同事",6.8,1.6],["官兵",6.6,0.2],["官兵",7.4,0.8]],"beats":[{"t":"張敞擔任「京兆尹」，負責管理京城長安。他抓小偷很有一套，把長安管得很安定，一做就是九年。"},{"t":"楊惲被判重罪後，大臣上奏說：楊惲的好朋友都不該再當官。張敞也在名單上，只是皇帝還沒有決定。","fx":[["focus","張敞"]]},{"who":"張敞","t":"絮舜，這個案子交給你，去查清楚！","fx":[["say","張敞"],["focus",null]]},{"t":"絮舜聽說張敞快要被免官了，案子查也不查，自己跑回家去了。","mv":[["絮舜",4.2,1.6]]},{"who":"同事","t":"長官交代的案子，你怎麼不辦，跑回家了？","mv":[["同事",3.0,1.0]]},{"who":"絮舜","t":"我替他做的事已經夠多了。他只剩下五天官可以當，我何必還替他辦案？"},{"t":"這些話傳到張敞耳裡，張敞氣壞了。","fx":[["upset","張敞"]]}],"q":"絮舜覺得張敞只能再當幾天管京城的官，就不把他的命令放在眼裡。後來人們用哪個成語，比喻當官的時間很短，或沒有長遠打算？","wrong":[{"w":"一日千里","by":"同事","line":"一日千里是進步得非常快。絮舜是在偷懶，哪有進步！"},{"w":"日理萬機","by":"張敞","line":"日理萬機是每天要處理很多很多事。我是很忙沒錯，可是題目說的是「時間很短」。"},{"w":"曇花一現","by":"絮舜","line":"曇花一現是像曇花一樣開一下就謝了，也是很短暫，意思很接近！不過我說的是當官只剩幾天，有更專門的成語。"}],"hint":"「京兆」就是京兆尹，管理京城的官。絮舜說他只剩幾天？","after":"張敞立刻派人把絮舜抓起來治罪，還說：「只剩五天的京兆尹，照樣能辦你！」","winSad":"絮舜","winMv":[["官兵",2.2,0.6],["官兵#2",3.4,0.4]],"lesson":{"title":"張敞畫眉","text":"張敞因為處罰絮舜太重，被人告了一狀，真的被免了官。幾個月後京城的盜賊又多起來，皇帝只好再請他出來做官。張敞還常常替太太畫眉毛，留下「張敞畫眉」的佳話。","next":"西漢後期，讀書的人越來越多。東海郡有一個窮人家的孩子，晚上沒有蠟燭可以讀書……"}},{"id":"e07_01","yr":"西漢後期","place":"東海郡．匡衡家","scene":"house","music":"night","cast":[["匡衡",-0.6,0.2],["鄰居",6.8,1.4],["文不識",7.4,0.6]],"beats":[{"t":"匡衡從小就很愛讀書。可是他家裡很窮，晚上連一根蠟燭都點不起。"},{"who":"匡衡","t":"天黑了，書上的字都看不清楚……","fx":[["sad","匡衡"]]},{"t":"隔壁的鄰居家裡點著蠟燭，亮亮的，可是燭光被一道牆擋住，照不過來。","mv":[["鄰居",4.6,-0.8]]},{"t":"匡衡盯著那道牆，想啊想，突然想到一個好辦法！","mv":[["匡衡",1.0,-0.6]],"fx":[["cheer","匡衡"],["focus","匡衡"]]},{"t":"他在牆上小心地打了一個小洞，把書對著透進來的光，一個字一個字認真地讀。","fx":[["say","匡衡"]]}],"q":"匡衡在牆上打了一個小洞，借隔壁透過來的燭光讀書。後來人們用哪個成語，形容家裡貧苦，仍然想辦法努力讀書？","wrong":[{"w":"偷雞摸狗","by":"匡衡","line":"偷雞摸狗是做小偷小摸的壞事。我只是借一點點光，什麼東西都沒拿！"},{"w":"一曝十寒","by":"鄰居","line":"一曝十寒是曬一天、冷十天，做事沒有恆心。這孩子天天都在讀，可有恆心了！"},{"w":"囊螢映雪","by":"匡衡","line":"囊螢映雪是用螢火蟲和雪地的光讀書，意思很接近！不過那是晉朝人的故事，我借的是隔壁的燭光。"}],"hint":"「鑿」是挖洞，牆壁上挖洞，偷偷借什麼？","after":"匡衡還到一戶藏書很多的有錢人家做工，不要工錢，只求主人讓他把家裡的書讀遍。主人文不識很感動，把書借給他讀。","winMv":[["文不識",2.0,0.4]],"lesson":{"title":"匡衡說詩","text":"匡衡後來成為大學者，特別會講《詩經》。當時的人說：「匡衡講《詩》，能讓人聽得笑開懷。」漢元帝時，他當上了丞相。這個故事記在《西京雜記》裡，是後人收集的筆記故事。","next":"在京城長安，也有一個窮書生，生了重病，家裡連一條被子都沒有……"}},{"id":"e30_06","yr":"西漢後期","place":"長安．王章家","scene":"house","music":"night","cast":[["王章",-0.4,0.0],["王章的妻子",1.4,0.6]],"beats":[{"t":"泰山郡的王章到長安讀書，家裡非常窮，只有他和妻子兩個人住在一起。"},{"t":"有一年冬天，王章生了重病。家裡沒有被子，他只好蓋著給牛保暖用的草衣。","fx":[["sad","王章"]]},{"who":"王章","t":"我大概撐不下去了……我們就在這裡告別吧。"},{"t":"兩個人面對面，眼淚一直流下來。","fx":[["sad","王章的妻子"]]},{"t":"忽然，妻子擦乾眼淚，生氣地站了起來。","mv":[["王章的妻子",0.9,-0.4]],"fx":[["upset","王章的妻子"],["focus","王章的妻子"]]},{"who":"王章的妻子","t":"仲卿！京城裡那些當大官的，有誰比得上你？現在生個病就哭哭啼啼，多沒出息！"}],"q":"王章和妻子窮到只能蓋著給牛保暖的草衣，兩人面對面哭泣。後來人們用哪個成語，形容夫妻一起過著貧窮困苦的日子？","wrong":[{"w":"錦衣玉食","by":"王章的妻子","line":"錦衣玉食是穿漂亮衣服、吃好東西。我們要是這樣，就不用蓋牛的草衣了！"},{"w":"對牛彈琴","by":"王章","line":"對牛彈琴是對不懂的人講道理。我們家只有牛的衣服，可沒有琴可以彈……"},{"w":"患難與共","by":"王章的妻子","line":"患難與共是一起度過困難，意思很接近！不過蓋著牛的草衣、相對流淚的這一幕，有專門的成語。"}],"hint":"給牛保暖用的草衣叫做「牛衣」。","after":"王章被妻子罵醒，振作起來，後來一路做官，當上了管理京城的京兆尹。","lesson":{"title":"人要知足","text":"王章當上京兆尹後，想上書批評掌權的外戚王鳳。妻子勸他：「人要知足，你忘了當年在牛衣裡哭的日子嗎？」王章不聽，後來果然被王鳳陷害入獄而死。王鳳，就是王莽的伯父。","next":"這時的皇帝是漢成帝。有一天，成帝聽到民間好多稱讚漢文帝的傳說，想問問學問最好的劉向……"}},{"id":"e12_05","yr":"漢成帝時","place":"長安．皇宮","scene":"palace","music":"palace","cast":[["漢成帝",0.4,0.2],["劉向",-6.8,1.0],["大臣",2.4,1.4]],"beats":[{"t":"劉向是漢朝皇族，學問非常好。漢成帝請他整理皇家圖書館裡的書，也常找他來聊天。"},{"t":"這一天，劉向又被請進宮來。","mv":[["劉向",-1.0,0.6]]},{"who":"漢成帝","t":"後世的人都說，文帝把天下治理得快要太平，品德跟周成王一樣好。這些話是從哪裡來的？","fx":[["say","漢成帝"]]},{"who":"大臣","t":"民間還流傳好多文帝的神奇故事呢，聽起來都好厲害！","fx":[["cheer","大臣"]]},{"who":"劉向","t":"陛下，世上的人批評或稱讚別人，很少符合事實。","fx":[["focus","劉向"]]},{"who":"劉向","t":"親自去查證的人少，跟著別人說的人多，有時候甚至把沒有的事，說成真的有。"}],"q":"劉向說，關於文帝的十幾件傳說，都是一般人亂傳的，說得比真實的情況誇張多了。這種說話誇大、超過事實的情形，叫做什麼？","wrong":[{"w":"言簡意賅","by":"劉向","line":"言簡意賅是話很少，意思卻很完整。這些傳說可是越傳越長，越說越誇張。"},{"w":"實事求是","by":"漢成帝","line":"實事求是是照著事實去做、去說。這些傳說剛好相反！"},{"w":"誇大其詞","by":"劉向","line":"誇大其詞也是說話太誇張，意思很接近！不過書上原文寫的是「話超過了事實」。"}],"hint":"「過」是超過，「實」是事實。","after":"漢成帝聽了點點頭，明白很多傳說不能全信。","lesson":{"title":"劉向校書","text":"劉向花了很多年整理皇家藏書，替每一本書寫介紹，編成《別錄》，是中國很早的圖書目錄。我們今天讀的《戰國策》，也是他編好、取名的。這段對話記在東漢應劭寫的《風俗通義》裡。","next":"可是漢成帝到了晚年，卻開始相信神仙，花了好多錢求長生不老……"}},{"id":"e43_04","yr":"漢成帝末年","place":"長安．上林苑","scene":"palace","music":"palace","cast":[["漢成帝",0.6,0.0],["方士",6.6,1.0],["方士",7.4,0.2],["谷永",-6.8,1.2]],"beats":[{"t":"漢成帝到了晚年，一直沒有兒子，開始迷上鬼神。很多自稱會法術的方士跑來找他。","mv":[["方士",2.2,0.8],["方士#2",3.2,0.0]]},{"who":"方士","t":"陛下，吃了我煉的仙藥，就能長生不老！","fx":[["cheer","方士"]]},{"t":"成帝在上林苑和長安城邊到處祭祀神明，花了好多好多錢，卻一點好處也沒有。","fx":[["cheerAll","方士"]]},{"t":"大臣谷永看不下去了，進宮來勸成帝。","mv":[["谷永",-1.2,0.6]]},{"who":"谷永","t":"陛下，說世上有仙人、有吃了不會死的藥，都是壞人在騙人啊！","fx":[["upset","谷永"],["focus","谷永"]]},{"who":"谷永","t":"聽他們說話，好像神仙馬上就能遇到；真的去找，卻什麼也抓不住。"}],"q":"谷永說：求仙就像想綁住風、抓住影子，永遠也抓不到。後來人們用哪個成語，比喻說話或做事毫無根據、憑空猜測？","wrong":[{"w":"呼風喚雨","by":"方士","line":"呼風喚雨是能叫來風雨的大本領……我要是真的會就好了。"},{"w":"形影不離","by":"谷永","line":"形影不離是像身體和影子一樣分不開。我說的是影子根本抓不到！"},{"w":"無中生有","by":"谷永","line":"無中生有是把沒有的事說成有，意思很接近！不過我說的是想抓住風和影子。"}],"hint":"風和影子，你抓得到嗎？","after":"成帝覺得谷永說得很有道理，稱讚了他。","winSad":"方士","winMv":[["方士",7.2,1.0],["方士#2",7.8,0.2]],"lesson":{"title":"西漢走下坡","text":"漢成帝沒有兒子，只好把皇位傳給侄子，就是漢哀帝。這時皇太后娘家的王氏家族已經掌權很久，王莽也一步一步爬上了高位。","next":"漢哀帝時，北方的匈奴單于派人來說，想到長安朝見皇帝……"}},{"id":"e59_03","yr":"西元前 3 年","place":"長安．朝廷","scene":"office","music":"palace","cast":[["漢哀帝",0.0,-0.2],["匈奴使者",-6.8,1.0],["大臣",2.4,1.0],["揚雄",7.0,1.4]],"beats":[{"t":"漢哀帝時，匈奴的單于派使者來到長安，說想親自來朝見皇帝。","mv":[["匈奴使者",-1.2,0.8]]},{"who":"匈奴使者","t":"我們單于想來拜見大漢皇帝！","fx":[["say","匈奴使者"]]},{"who":"大臣","t":"接待單于要花很多錢。而且以前單于來過以後，沒多久就有皇帝過世，太不吉利了！","fx":[["upset","大臣"]]},{"t":"哀帝身體不好，聽了也有點擔心，就拒絕了。使者只好告辭離開。","mv":[["匈奴使者",-7.4,1.2]],"fx":[["sad","匈奴使者"]]},{"t":"學者揚雄知道了，急忙寫了一封信給哀帝。","mv":[["揚雄",1.8,1.4]],"fx":[["focus","揚雄"]]},{"who":"揚雄","t":"以前的皇帝花那麼多錢、派那麼多兵去打匈奴，難道是喜歡打仗嗎？不是的！"}],"q":"揚雄在信裡說：「不辛苦一次，就得不到長久的安樂；不花一點錢，就換不到永遠的平安。」這個道理後來變成哪個成語？","wrong":[{"w":"勞民傷財","by":"大臣","line":"勞民傷財是浪費人力和錢財，那正是我擔心的事！揚雄說的是先辛苦一次，換來長久平安。"},{"w":"好逸惡勞","by":"揚雄","line":"好逸惡勞是愛享受、怕辛苦。我勸的剛好相反，要先辛苦才有安樂！"},{"w":"苦盡甘來","by":"揚雄","line":"苦盡甘來是苦日子過完，好日子就來了，意思很接近！不過我強調的是「辛苦一次，就能長久安樂」。"}],"hint":"「勞」是辛苦，「逸」是安樂。辛苦幾次？安樂多久？","after":"哀帝看了揚雄的信，改變了心意，派人把匈奴使者追回來，答應單于來朝見。","winMv":[["匈奴使者",-1.2,0.8]],"lesson":{"title":"單于來朝","text":"西元前 1 年，單于來到長安朝見，漢朝和匈奴繼續保持和好。揚雄是西漢有名的文學家，寫了很多文采漂亮的「賦」，還模仿《論語》寫了一本《法言》。","next":"漢哀帝也很早就過世了。王莽掌握大權，最後乾脆自己當了皇帝……"}},{"id":"e43_05","yr":"西元 23 年","place":"長安．皇宮","scene":"palace","music":"battle","cast":[["王莽",0.6,-0.4],["孫伋",-6.8,1.0],["衛兵",6.6,0.4],["衛兵",7.2,1.4],["衛兵",-7.0,0.0],["史諶",7.4,2.0]],"beats":[{"t":"王莽奪走漢朝的皇位，建立了「新朝」。可是他的改革一團亂，百姓活不下去，各地紛紛起兵。"},{"t":"這一年，劉秀在昆陽大敗王莽的大軍。長安城裡，幾位大臣也偷偷計畫抓住王莽，投降漢軍。"},{"t":"參加計畫的孫伋卻越想越害怕，吃不下飯。最後，他跑去向王莽告密。","mv":[["孫伋",-1.0,0.4]],"fx":[["sad","孫伋"]]},{"who":"王莽","t":"什麼？竟然有人要抓朕！快把他們找來！","fx":[["upset","王莽"],["focus","王莽"]]},{"t":"消息一下子傳遍宮中，大家都嚇壞了。衛兵以為有人打進來，全都衝向侍衛住的地方。","mv":[["衛兵",2.4,0.2],["衛兵#2",3.2,1.2],["衛兵#3",-1.6,-1.2]],"fx":[["focus",null]]},{"who":"衛兵","t":"小心！誰都不准靠近！","fx":[["upset","衛兵"],["upset","衛兵#2"],["upset","衛兵#3"]]}],"q":"宮裡的衛兵全都拔出了刀劍、拉開了弩，好像隨時要打起來。這種非常緊張的情勢，叫做什麼？","wrong":[{"w":"風平浪靜","by":"史諶","line":"風平浪靜是沒有風也沒有浪，平安無事。現在宮裡可一點都不平靜！"},{"w":"心平氣和","by":"王莽","line":"心平氣和是心情平靜、不生氣。朕現在怎麼可能心平氣和！"},{"w":"一觸即發","by":"史諶","line":"一觸即發是一碰就會爆發，意思很接近！不過衛兵真的拔出劍、拉開弩了，有更貼切的成語。"}],"hint":"「弩」是用機關發射的弓。劍和弩，現在是什麼樣子？","after":"將軍史諶到各處巡視，告訴大家：「帶頭的人已經被處置了，沒事了！」衛兵們這才放下兵器。","winMv":[["史諶",1.6,1.4]],"lesson":{"title":"新朝滅亡","text":"這一年秋天，起兵的軍隊攻進長安，王莽在混亂中被殺，新朝只維持了十五年就滅亡了。這個成語後來也用來形容書法的筆畫很有力量。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十一章．西漢落幕","eps":[7,12,30,43,59]},{"key":"ch4","short":"大漢時代","era":"西元前 202–西元 220 年","color":"#C99A2E","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["劉邦建立漢朝以後，漢朝一共延續了四百多年，是中國歷史上很長的朝代。","前面兩百年定都長安，叫「西漢」。漢武帝時國力最強，打敗匈奴、打通絲路。","西漢末年，外戚王莽奪了皇位。漢朝皇族劉秀起兵，重新建立漢朝，定都洛陽，叫「東漢」。","東漢後期，宦官和外戚輪流掌權，朝政腐敗，最後天下大亂，進入三國時代。","我們現在說的「漢人」「漢字」，都和這個朝代有關。一起去看看大漢的人物吧！"],"people":[["漢武帝","西漢最有名的皇帝，開疆拓土"],["司馬遷","寫《史記》的史官"],["劉秀","漢光武帝，建立東漢"],["班超","投筆從戎，經營西域三十年"]]},"stops":[{"id":"e18_01","yr":"約西元前 122 年","place":"滇國","scene":"south","music":"palace","cast":[["漢使",-6.5,1.2],["滇王",1.4,0.6],["大臣",2.8,1.6],["大臣",0.2,-1.2]],"beats":[{"t":"漢武帝時，漢朝非常強大。張騫出使西域回來報告：在大夏國看到從蜀地運去的布和竹杖，西南方一定有路通往遙遠的身毒（印度）。"},{"t":"漢武帝派使者往西南方找這條路，來到了滇國。","mv":[["漢使",-1.1,0.6]]},{"who":"滇王","t":"歡迎歡迎！聽說你們是從漢朝來的？","fx":[["cheer","滇王"]]},{"t":"滇王很熱情，留下使者，還派人幫忙找路。可是使者被當地部族擋住，一年多都過不去。"},{"t":"有一天，滇王好奇地問了漢朝使者一個問題。","fx":[["focus","滇王"]]}],"q":"滇王問：「漢朝和我們，哪一個比較大？」西南方另一個小國的國王也這樣問。他們都不知道漢朝有多廣大。這種見識少又自以為了不起的樣子，叫做什麼？","wrong":[{"w":"妄自菲薄","by":"漢使","line":"妄自菲薄是太看不起自己。他們剛好相反，覺得自己很大呢！"},{"w":"地大物博","by":"滇王","line":"地大物博是土地大、物產多，那是在說漢朝啦。"},{"w":"坐井觀天","by":"漢使","line":"坐井觀天也是說見識少，意思很接近！不過這個故事是西南方小國的國王，有一個專門的成語。"}],"hint":"問同樣問題的，是西南方一個叫「夜郎」的小國國王。","after":"使者回去後，向漢武帝報告滇國是大國，值得拉攏，漢武帝從此注意西南方。","lesson":{"title":"漢武帝開疆拓土","text":"漢武帝在位五十多年，派衛青、霍去病打敗匈奴，派張騫出使西域，打通了「絲路」，也把勢力伸向西南。後來滇王歸順漢朝，漢朝賜給他一顆「滇王之印」，這顆金印在 1956 年被考古學家挖到了！","next":"漢武帝很嚴厲。有一位史官，只因為替打敗仗的將軍說了幾句話，就遭了大禍……"}},{"id":"e18_07","yr":"西元前 99 年","place":"長安．司馬遷家","scene":"study","music":"night","cast":[["司馬遷",-0.3,-1.4],["漢武帝",6.5,1]],"beats":[{"t":"司馬遷的父親是史官，臨終前交代兒子，一定要完成一部歷史書。司馬遷接下父親的職位，開始寫書。","fx":[["say","司馬遷"]]},{"t":"西元前 99 年，將軍李陵帶著五千步兵深入匈奴，被幾萬敵軍包圍，打到箭用光了，最後投降。"},{"t":"朝廷上大家都罵李陵，漢武帝問司馬遷的看法。","mv":[["漢武帝",1.6,0.6]]},{"who":"司馬遷","t":"李陵只帶五千人，打了好幾天，殺了很多敵人。他投降，也許是想找機會報答國家。"},{"who":"漢武帝","t":"你竟敢替投降的人說話！","fx":[["upset","漢武帝"]]},{"t":"漢武帝大怒，把司馬遷關進牢裡，判了很重的刑罰。","mv":[["漢武帝",6.5,1]],"fx":[["sad","司馬遷"]]},{"who":"司馬遷","t":"如果我現在就這樣死了，在別人眼裡……"}],"q":"司馬遷後來寫信給朋友：「如果我就這樣死了，就像九頭牛身上掉了一根毛，一點也不重要。」這句話變成哪個成語？","wrong":[{"w":"對牛彈琴","by":"司馬遷","line":"對牛彈琴是對不懂的人講道理。我說的是自己的死，就像牛身上的一根毛那麼輕。"},{"w":"一毛不拔","by":"司馬遷","line":"一毛不拔是形容很小氣。我說的是一根毛在九頭牛身上，微不足道。"},{"w":"滄海一粟","by":"司馬遷","line":"滄海一粟是大海裡的一粒米，意思很接近！不過我信裡寫的是九頭牛和一根毛。"}],"hint":"九頭牛身上，少了一根什麼？","after":"司馬遷又說：「人總有一死，有的死比泰山還重，有的比鴻毛還輕。」他決定忍住痛苦，活下去把書寫完。","lesson":{"title":"史記","text":"司馬遷花了十幾年寫完《史記》，從黃帝一直寫到漢武帝，一共一百三十篇。魯迅稱讚它是「史家之絕唱」。這本書裡的很多故事，就是我們在這個遊戲裡學到的成語！","next":"漢武帝過世時，太子才八歲。漢武帝把國家託付給大將軍霍光……"}},{"id":"e43_02","yr":"西元前 74 年","place":"長安．往高廟途中","scene":"palace","music":"palace","cast":[["漢宣帝",-1.6,1],["霍光",-0.2,1.1],["張安世",6.5,1.4],["大臣",2.8,1.8]],"beats":[{"t":"霍光輔佐年幼的漢昭帝十三年。昭帝很年輕就過世了，霍光先立了一位新皇帝，不到一個月又把他廢掉，改立漢宣帝。"},{"t":"漢宣帝即位後，要到高廟祭拜祖先。大將軍霍光陪他坐在同一輛車上。","fx":[["prop","cart",0.2,-0.9,0]]},{"who":"霍光","t":"陛下，請上車。","fx":[["say","霍光"]]},{"t":"宣帝想到霍光連皇帝都能廢掉，坐在他旁邊，全身都緊繃起來。","fx":[["upset","漢宣帝"],["focus","漢宣帝"]]}],"q":"漢宣帝坐在霍光旁邊，覺得好像有芒草的尖刺扎在背上，非常不安。這種感覺叫什麼？","wrong":[{"w":"如坐春風","by":"漢宣帝","line":"如坐春風是很舒服、很溫暖。朕現在可是渾身不自在！"},{"w":"安然無恙","by":"霍光","line":"安然無恙是平安沒事。陛下的身體沒事，是心裡很不安。"},{"w":"如坐針氈","by":"漢宣帝","line":"如坐針氈是像坐在插滿針的毯子上，意思很接近！不過史書寫的是背上的芒刺。"}],"hint":"芒草的尖刺，扎在身上哪裡？","after":"後來換成張安世陪坐，宣帝就輕鬆自在多了。","winMv":[["霍光",4,2.2],["張安世",-0.2,1.1]],"lesson":{"title":"昭宣中興","text":"霍光過世後，霍家的人想造反，整個家族都被處死。百姓說：霍家的大禍，從同坐一輛車那時就埋下了。漢昭帝、漢宣帝時國家安定，史稱「昭宣中興」。","next":"西漢後期，外戚王莽奪了皇位，天下大亂。漢朝皇族的後代劉秀，起兵恢復漢朝……"}},{"id":"e18_06","yr":"西元 24 年","place":"河北","scene":"road","music":"battle","cast":[["劉秀",0.2,0.4],["王霸",-1,0.9],["賓客",1.4,1.3,0,1],["賓客",2.4,0.3,0,0],["賓客",3.1,1.4,0,0]],"beats":[{"t":"王莽建立新朝，改革失敗，百姓活不下去，各地紛紛起兵。漢朝皇族劉秀也起兵反抗。"},{"t":"劉秀奉命到河北安撫各地，從家鄉潁川來的幾十個賓客跟著他。"},{"t":"沒想到河北有個叫王郎的人自稱皇帝，懸賞捉拿劉秀。劉秀一行人又冷又餓，到處躲藏。","fx":[["sadAll","賓客"]]},{"who":"賓客","t":"跟著他太苦了……我們還是回家吧。"},{"t":"跟隨的人一個一個悄悄離開了。","mv":[["賓客",8,2],["賓客#2",8.6,0.6],["賓客#3",9,1.6]]},{"who":"劉秀","t":"王霸，從潁川跟著我的人都走了，只剩下你……","fx":[["focus","王霸"]]},{"who":"王霸","t":"我會一直跟著您！"}],"q":"劉秀說：「大風吹來，才知道哪一棵草最強韌。」危難時才看得出誰最堅定。這句話變成哪個成語？","wrong":[{"w":"風吹草動","by":"王霸","line":"風吹草動是一點點小動靜。主公說的是在大風裡站得住的草，就像我一樣！"},{"w":"斬草除根","by":"劉秀","line":"斬草除根是把壞東西徹底除掉。我是在稱讚王霸，不是要除掉他！"},{"w":"歲寒松柏","by":"劉秀","line":"歲寒松柏是寒冬裡不凋的松柏，也比喻堅定，意思很接近！不過我說的是大風和草。"}],"hint":"「疾風」是強風，「勁」是強韌。","after":"後來劉秀打敗王郎，平定河北，王霸也成為東漢的開國功臣。","lesson":{"title":"光武中興","text":"西元 25 年，劉秀當上皇帝，就是漢光武帝，後來定都洛陽，歷史上叫「東漢」。他重新統一天下，減輕百姓的負擔，史稱「光武中興」。","next":"光武帝手下有一位老將軍馬援，打了大勝仗回到京城……"}},{"id":"e18_03","yr":"西元 44 年","place":"洛陽城外","scene":"walls","music":"battle","cast":[["馬援",6.5,1],["漢兵",7.5,1.8],["漢兵",7.8,0.2],["孟冀",-1.4,0.8],["賓客",-2.6,0.2,0,1]],"beats":[{"t":"東漢初年，馬援替光武帝四處征戰。他平定了南方交阯的叛亂，帶著軍隊凱旋回到京城。","mv":[["馬援",1,0.4],["漢兵",2.2,1.2],["漢兵#2",2.6,-0.2]]},{"t":"光武帝很高興，賞給他一輛車。親朋好友都來迎接祝賀。","fx":[["cheer","孟冀"],["cheer","賓客"]]},{"who":"孟冀","t":"恭喜將軍立了大功！"},{"who":"馬援","t":"現在匈奴、烏桓還在北方騷擾邊境，我想請求出兵去打他們。"},{"who":"馬援","t":"男子漢應當死在邊疆的戰場上……","fx":[["focus","馬援"]]}],"q":"馬援說：「男子漢就算戰死，也要用馬皮包著屍體運回來，怎麼能躺在床上，死在妻子兒女身邊？」這句話變成哪個成語？","wrong":[{"w":"馬到成功","by":"孟冀","line":"馬到成功是一出發就成功。將軍說的是不怕犧牲、保家衛國的決心。"},{"w":"心猿意馬","by":"馬援","line":"心猿意馬是心思不定。我的心意可是堅定得很！"},{"w":"視死如歸","by":"孟冀","line":"視死如歸是不怕死，意思很接近！不過將軍說的「用馬皮包著運回來」，有一個專門的成語。"}],"hint":"「革」是皮，「裹」是包起來。","after":"孟冀說：「真正的烈士，就應該是這樣！」","lesson":{"title":"老當益壯","text":"馬援年輕時就說：「大丈夫立志，窮困時要更堅定，年老時要更強壯。」這就是「老當益壯」的由來。他六十二歲還請求出征，最後病死在軍中，實現了自己說過的話。","next":"幾十年後，一個替官府抄書的年輕人，也想像張騫一樣到西域立功……"}},{"id":"e08_04","yr":"約西元 62 年","place":"洛陽．官府","scene":"office","music":"palace","cast":[["班超",-1,0.6],["官員",2,1.2,0,1],["官員",3,0.2,0,0]],"beats":[{"t":"班超的哥哥班固被找去寫史書，班超和母親跟著來到洛陽。家裡很窮，班超只好替官府抄寫文書，賺錢養家。"},{"t":"他每天低頭抄寫，抄了好久，又累又辛苦。","fx":[["sad","班超"]]},{"t":"有一天，班超停下工作，把筆一丟，嘆了一口氣。","fx":[["upset","班超"]]},{"who":"班超","t":"大丈夫就算沒有別的本事，也應該學傅介子、張騫，到遙遠的國家立功封侯，怎麼能一輩子埋頭在筆和硯臺之間！"},{"who":"官員","t":"哈哈哈，口氣好大啊！","fx":[["cheerAll","官員"]]},{"who":"班超","t":"你們這些人，怎麼會懂壯士的志向！"}],"q":"班超丟下抄寫用的筆，決心從軍報效國家。這叫做什麼？","wrong":[{"w":"筆下生花","by":"官員","line":"筆下生花是文章寫得很好。他是把筆丟掉，不寫了！"},{"w":"紙上談兵","by":"官員","line":"紙上談兵是只會空談。他後來真的到西域立了大功喔！"},{"w":"棄文就武","by":"班超","line":"棄文就武是放下文事、改走武路，意思很接近！不過「把筆丟下去從軍」，有一個專門的成語。"}],"hint":"「戎」是軍隊，「投」是丟下。","after":"西元 73 年，班超跟著大將軍竇固出征匈奴，從此開始了他的西域傳奇。","lesson":{"title":"班超經營西域","text":"班超在西域待了三十年。他曾經只帶三十六個人，說出「不入虎穴，焉得虎子」，夜襲匈奴使者。他讓五十多個國家歸順漢朝，被封為定遠侯，真的實現了「立功封侯」的志向。","next":"東漢後期，有一位很有名望的鄉紳叫陳寔。有一天半夜，他家來了一位不速之客……"}},{"id":"e18_04","yr":"東漢後期","place":"陳寔家","scene":"house","music":"night","cast":[["小偷",0.6,-1.2,2.53],["陳寔",6,1],["子孫",-6.5,1,0,1],["子孫",-7,2.2,0,0]],"beats":[{"t":"東漢後期，陳寔住在鄉下，為人公正，鄉親有紛爭都喜歡找他評理。"},{"t":"那一年鬧饑荒。有一天半夜，一個小偷溜進陳寔家，躲在屋樑上。","fx":[["focus","小偷"]]},{"t":"陳寔發現了，卻沒有大叫。他整理好衣服，把子孫都叫到面前。","mv":[["陳寔",-0.4,0.8],["子孫",-1.8,1.4],["子孫#2",-2.4,0.4]]},{"who":"陳寔","t":"人不可以不自我勉勵。做壞事的人，不一定本性就壞，是壞習慣慢慢養成的。"},{"who":"陳寔","t":"就像屋樑上的這一位……","fx":[["focus","小偷"],["upset","小偷"]]}],"q":"陳寔指著屋樑，客氣地稱小偷為「屋樑上的君子」，給他改過的機會。後來小偷的代稱，就是哪個成語？","wrong":[{"w":"正人君子","by":"子孫","line":"正人君子是品行端正的人。屋樑上那位……還不算啦！"},{"w":"高高在上","by":"小偷","line":"高高在上是地位高、架子大。我只是躲在樑上而已……"},{"w":"雞鳴狗盜","by":"陳寔","line":"雞鳴狗盜是學雞叫、裝狗偷東西的小本事，那是孟嘗君的故事。我說的是躲在屋樑上的那位。"}],"hint":"小偷躲在哪裡？","after":"小偷嚇得跳下來，跪地認錯。陳寔說：「看你的樣子不像壞人，應該是太窮了。」還送他兩匹絹。從此縣裡再也沒有小偷。","winMv":[["小偷",0.8,-0.2,0]],"lesson":{"title":"黨錮之禍","text":"東漢後期，皇帝常常年紀很小，宦官和外戚輪流掌權。正直的讀書人批評朝政，反而被抓、被禁止當官，叫做「黨錮之禍」，陳寔也曾受到牽連。朝廷越來越腐敗，最後爆發了黃巾之亂。","next":"黃巾之亂後，各地軍閥混戰。曹操在兗州站穩腳步，卻遇到一個大難題……"}},{"id":"e44_07","yr":"西元 194 年","place":"兗州．曹操軍營","scene":"tent","music":"battle","table":true,"cast":[["曹操",1.4,0.6],["荀彧",-6.5,1]],"beats":[{"t":"東漢末年，曹操以兗州作為根據地。可是他出兵攻打徐州時，呂布趁機偷襲，搶走了兗州大部分的地方。","fx":[["upset","曹操"]]},{"t":"這時候，徐州的陶謙死了。曹操想先去拿下徐州，再回頭打呂布。"},{"who":"曹操","t":"徐州現在沒有主人，正是好機會！"},{"t":"謀士荀彧趕緊來勸曹操。","mv":[["荀彧",-1.2,0.6]]},{"who":"荀彧","t":"從前高祖守住關中，光武帝據有河內，都是先鞏固根本。兗州就是將軍的根本啊！"},{"who":"荀彧","t":"而且將軍上次攻打徐州，殺了很多人，徐州人一定會拚命守城。他們會把城牆修得更堅固，把田野裡的糧食全部收光……"}],"q":"荀彧說：徐州人會「加固城牆、收光田野」，讓大軍攻不下也搶不到糧食，不用打就困死了。這種防守方法叫什麼？","wrong":[{"w":"引狼入室","by":"曹操","line":"引狼入室是把壞人引進家裡。荀彧說的是敵人會怎麼防守我們！"},{"w":"開門揖盜","by":"荀彧","line":"開門揖盜是打開門請強盜進來，剛好相反！"},{"w":"固若金湯","by":"荀彧","line":"固若金湯是形容城池非常堅固，意思有點接近！不過還要把田野的糧食收光，有一個更完整的成語。"}],"hint":"「壁」是城牆營壘，「清野」是把田野收乾淨。","after":"曹操聽了，先收割成熟的麥子，再和呂布作戰，打敗呂布，平定了兗州。","lesson":{"title":"從東漢到三國","text":"曹操後來把漢獻帝接到許縣，「挾天子以令諸侯」，勢力越來越大，最後統一北方。西元 220 年東漢結束，三國時代開始。接下來，到下一章「三國風雲」繼續冒險！","next":"漢朝人物這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","name":"漢朝人物","title":"第二十二章．漢朝人物","eps":[8,18,43,44]},{"key":"h20","line":"history","name":"光武打天下","short":"東漢初年","era":"西元 24–30 年","color":"#C0563E","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["王莽的新朝滅亡以後，天下四分五裂，到處都有人自稱皇帝。","漢朝皇族劉秀在河北站穩腳步，西元 25 年當上皇帝，就是漢光武帝，定都洛陽。","可是西邊有隗囂占據隴地，西南有公孫述在蜀地稱帝，東方和北方也還有人割據。","光武帝靠著一群忠心又能幹的將領，一步一步把天下重新統一。"],"people":[["劉秀","漢光武帝，建立東漢"],["隗囂","占據隴地，在漢朝和公孫述之間搖擺"],["公孫述","在蜀地自稱皇帝"],["馬援","先跟隗囂，後來投靠光武帝"]]},"stops":[{"id":"e18_05","yr":"西元 24 年","place":"河北．降軍營地","scene":"walls","music":"palace","cast":[["劉秀",-6.8,1.0],["將領",-7.4,0.2],["降兵",1.6,0.2],["降兵",2.6,1.0],["降兵",3.2,-0.4]],"beats":[{"t":"劉秀打敗王郎以後，被封為「蕭王」。接著他又大破一支叫「銅馬」的大軍，幾十萬人向他投降。","mv":[["劉秀",-1.0,0.6],["將領",-1.6,-0.4]]},{"t":"劉秀還封投降軍隊的首領當官。可是大家心裡都不太踏實。"},{"who":"將領","t":"主公，這些降兵靠得住嗎？萬一晚上造反怎麼辦？","fx":[["upset","將領"]]},{"who":"降兵","t":"蕭王會不會哪一天，把我們全都處罰了……","fx":[["sadAll","降兵"]]},{"who":"劉秀","t":"讓他們各自回營，整頓好兵馬等我。","fx":[["say","劉秀"],["focus","劉秀"]]},{"t":"劉秀只帶著幾個騎兵，輕輕鬆鬆走進降兵的營地，一個一個營巡視。","mv":[["劉秀",1.0,0.8]],"fx":[["focus",null]]}],"q":"降兵們感動地說：「蕭王把自己的一顆紅心，放進我們的肚子裡，我們怎麼能不替他拚命！」這句話變成哪個成語？","wrong":[{"w":"狼心狗肺","by":"降兵","line":"狼心狗肺是沒有良心、很狠毒。蕭王對我們這麼好，剛好相反！"},{"w":"口蜜腹劍","by":"將領","line":"口蜜腹劍是嘴巴很甜、心裡很壞。主公說到做到，完全不是這樣的人！"},{"w":"開誠布公","by":"劉秀","line":"開誠布公是坦白、公正地把話說出來，意思很接近！不過他們說的是把真心放進肚子裡。"}],"hint":"「腹」就是肚子。把真心推過去，放在哪裡？","after":"降兵們從此安心，真心跟隨劉秀。關西的人還給劉秀取了一個外號，叫「銅馬帝」。","winMv":[["降兵",1.8,1.4],["降兵#2",2.8,0.6]],"lesson":{"title":"光武帝即位","text":"西元 25 年，劉秀在河北的鄗城即位當皇帝，就是漢光武帝，後來定都洛陽。可是天下還沒統一：西邊的隗囂占據隴地，蜀地的公孫述也自己當了皇帝。","next":"隗囂派了一位叫馬援的人，到蜀地去看看公孫述是個什麼樣的人……"}},{"id":"e31_06","yr":"約西元 25 年","place":"成都．公孫述的宮殿","scene":"palace","music":"palace","cast":[["公孫述",0.8,-0.6],["馬援",-6.8,1.2],["蜀兵",6.6,0.2],["蜀兵",7.0,1.0],["蜀兵",7.6,1.8]],"beats":[{"t":"公孫述在蜀地自己當了皇帝。占據隴地的隗囂，派馬援到成都去看看他。"},{"t":"馬援和公孫述是同鄉，從前感情很好。","mv":[["馬援",-1.2,0.8]]},{"who":"馬援","t":"老朋友見面，一定會像從前一樣，握握手、開心聊天！","fx":[["cheer","馬援"]]},{"t":"沒想到，公孫述先排出一大排衛兵，才請馬援進去。","mv":[["蜀兵",1.4,-1.4],["蜀兵#2",2.4,-0.8],["蜀兵#3",3.2,-0.2]]},{"t":"公孫述坐著插滿彩旗的車子出場，前後有人開路，衣服帽子打扮得整整齊齊，排場非常盛大。","fx":[["prop","cart",2.6,-2.2,0],["focus","公孫述"]]},{"who":"公孫述","t":"馬援，留下來幫朕吧！朕封你當侯爵、做大將軍！","fx":[["say","公孫述"]]},{"who":"馬援","t":"天下誰輸誰贏還不知道，他不趕快去迎接人才，卻只顧著打扮外表，像個木偶一樣……","fx":[["focus","馬援"]]}],"q":"史書說公孫述只顧「修飾邊幅」，也就是很講究打扮。後來人們把這句話反過來，用哪個成語形容一個人不講究穿著打扮？","wrong":[{"w":"衣冠楚楚","by":"公孫述","line":"衣冠楚楚是穿得整整齊齊、很體面。朕就是這樣！可是題目問的是相反的意思。"},{"w":"錦上添花","by":"馬援","line":"錦上添花是好上加好。他的排場已經夠大了，還一直往上加，可是這不是答案。"},{"w":"蓬頭垢面","by":"馬援","line":"蓬頭垢面是頭髮亂、臉很髒，意思有點接近！不過它說的是又髒又亂，答案只是說不講究打扮。"}],"hint":"「邊幅」本來是布的邊緣，比喻衣著和儀容。","after":"馬援推辭了官位，回去對隗囂說：「公孫述只是一隻井底之蛙，還自以為了不起，不如專心跟東方的劉秀來往。」","lesson":{"title":"馬援投漢","text":"後來馬援奉命到洛陽見光武帝。光武帝只戴著頭巾、笑著迎接他，一點架子也沒有。馬援覺得光武帝才是真正的明主，後來就投靠了漢朝。","next":"光武帝手下有一群能幹的將領，不過，仗也不是每一場都打得順利……"}},{"id":"e31_01","yr":"東漢初年","place":"漢軍營地","scene":"walls","music":"battle","cast":[["吳漢",1.4,0.2],["漢兵",2.4,1.0],["漢兵",0.4,1.2],["使者",-6.8,1.0],["光武帝",-4.6,-1.8]],"beats":[{"t":"吳漢是光武帝手下的大將，個性忠厚、話不多，對光武帝非常忠心。"},{"t":"有時候仗打得不順利，軍營裡的將士都很慌張，一個個垂頭喪氣。","fx":[["sadAll","漢兵"]]},{"who":"光武帝","t":"去看看吳將軍現在在做什麼。","fx":[["say","光武帝"]]},{"t":"使者跑到吳漢的營裡，看到吳漢正在修理弓箭和兵器，檢查兵馬。","mv":[["使者",0.2,0.4]]},{"who":"吳漢","t":"大家打起精神！把武器整理好，準備再戰！","fx":[["cheer","吳漢"],["cheerAll","漢兵"],["focus","吳漢"]]},{"who":"使者","t":"報告陛下，吳將軍正在準備攻城的器具呢！","mv":[["使者",-3.4,-0.8]],"fx":[["focus",null]]}],"q":"光武帝讚嘆說：「吳將軍還真能讓人振作起來！」「還算能振奮人心」這句話，後來變成哪個成語，現在指大體上還能讓人滿意？","wrong":[{"w":"大失所望","by":"使者","line":"大失所望是非常失望。陛下聽了報告，可是很高興呢！"},{"w":"灰心喪志","by":"吳漢","line":"灰心喪志是失去信心和志氣。我才不灰心，馬上就要再戰！"},{"w":"心滿意足","by":"光武帝","line":"心滿意足是非常滿足，意思有點接近！不過朕說的是「還算」能振奮人心。"}],"hint":"「差」念ㄔㄚ，是「稍微、還算」的意思。","after":"光武帝說吳漢穩重可靠，就像一個國家那樣有分量，封他為廣平侯。","lesson":{"title":"大將吳漢","text":"吳漢每次出征，早上接到命令，傍晚就出發。他後來當上大司馬，是東漢的開國名將，也是「雲台二十八將」之一。","next":"北方的幽州，有兩位官員卻吵得不可開交……"}},{"id":"e44_05","yr":"西元 26 年","place":"幽州．薊城","scene":"office","music":"palace","cast":[["朱浮",-0.8,0.2],["讀書人",1.6,1.2],["彭寵",6.8,1.0]],"beats":[{"t":"光武帝派朱浮管理北方的幽州。朱浮請來很多讀書人當官，還從倉庫拿糧食，送給他們的家人。","fx":[["cheer","讀書人"]]},{"t":"漁陽太守彭寵，曾經幫光武帝打天下、立過大功。他聽說這件事，很不贊成。","mv":[["彭寵",2.8,0.2],["讀書人",4.0,1.6]]},{"who":"彭寵","t":"天下還沒平定，到處都在打仗，糧食要留給軍隊，不能這樣亂花！","fx":[["upset","彭寵"]]},{"who":"朱浮","t":"我是你的長官，你竟敢不聽命令！","fx":[["upset","朱浮"]]},{"t":"朱浮個性急又驕傲，寫了很嚴厲的文書批評彭寵；彭寵也很倔強，覺得自己功勞大。兩人越鬧越僵。"},{"who":"彭寵","t":"好！那就打一仗吧！","mv":[["彭寵",7.2,1.0]]},{"t":"彭寵真的起兵來攻打朱浮了。朱浮急忙寫了一封信給他。","fx":[["focus","朱浮"],["say","朱浮"]]}],"q":"朱浮在信裡說：「想想你的老母親和弟弟吧！做事不要讓親近的人痛心，卻讓仇人高興。」這句話變成哪個成語？","wrong":[{"w":"大快人心","by":"彭寵","line":"大快人心是壞人受到懲罰，大家都很痛快。朱浮說的是做錯事，讓仇人高興！"},{"w":"同仇敵愾","by":"朱浮","line":"同仇敵愾是大家一起對抗敵人。我們兩個卻自己打起來了……"},{"w":"兩敗俱傷","by":"朱浮","line":"兩敗俱傷是雙方都受傷，意思有點接近！不過我強調的是「親人痛心、仇人高興」。"}],"hint":"「親」是親人，「仇」是仇人。誰會痛心？誰會高興？","after":"可是彭寵不聽勸告，還是帶兵攻打朱浮，後來甚至自稱「燕王」。","lesson":{"title":"彭寵的下場","text":"彭寵叛變了好幾年，最後在西元 29 年被自己的僕人殺害，漁陽才又回到漢朝手中。朱浮當初太嚴厲、不懂得和人相處，也被很多人批評。","next":"西邊的隗囂，表面上歸順光武帝。光武帝親手寫了一封很客氣的信給他……"}},{"id":"e44_01","yr":"東漢初年","place":"洛陽．皇宮","scene":"palace","music":"palace","cast":[["光武帝",0.4,-0.2],["使者",-6.8,1.0],["大臣",2.6,1.2]],"beats":[{"t":"隗囂占據隴地，就是現在甘肅一帶，表面上歸順光武帝。這時，陳倉有個叫呂鮪的人勾結公孫述，帶著幾萬人在關中作亂。"},{"t":"隗囂派兵幫漢朝的大將馮異打跑了呂鮪，又派使者到洛陽報告。","mv":[["使者",-1.0,0.6]]},{"who":"使者","t":"報告陛下，我家隗將軍打敗了呂鮪！","fx":[["say","使者"]]},{"who":"光武帝","t":"太好了！朕要親手寫信感謝他。要不是隗將軍幫忙，咸陽早就被別人搶走了！","fx":[["cheer","光武帝"]]},{"who":"大臣","t":"陛下，蜀地的公孫述說不定還會打過來呢。","fx":[["upset","大臣"]]},{"who":"光武帝","t":"所以朕要在信上說：如果公孫述打到漢中、關中，希望借隗將軍的兵馬，和他對陣！","fx":[["focus","光武帝"]]}],"q":"光武帝希望隗囂帶兵，和公孫述的軍旗、戰鼓面對面對陣。這個畫面後來變成哪個成語，比喻雙方實力差不多？","wrong":[{"w":"偃旗息鼓","by":"光武帝","line":"偃旗息鼓是放倒旗子、停止打鼓，就是不打了。朕是希望隗將軍上陣呢！"},{"w":"一鼓作氣","by":"大臣","line":"一鼓作氣是趁士氣最旺的時候一口氣做完。這裡說的是兩軍面對面對陣。"},{"w":"勢均力敵","by":"光武帝","line":"勢均力敵也是雙方力量差不多，意思很接近！不過朕信裡寫的是軍旗和戰鼓。"}],"hint":"原文寫作「鼓旗相當」，把順序換一下。","after":"從此光武帝對隗囂更加禮遇。可是隗囂心裡另有打算，一直在漢朝和公孫述之間搖擺不定。","lesson":{"title":"搖擺的隗囂","text":"隗囂想自己當一方的霸主，不肯真心歸順。光武帝要他出兵打公孫述，他總是找藉口推辭，雙方漸漸翻臉。","next":"東方的齊地，有一位年輕將軍，正要完成他多年前就提出的大計畫……"}},{"id":"e08_08","yr":"西元 29 年","place":"臨淄","scene":"valley","music":"battle","cast":[["耿弇",-4.0,-1.0,0.25],["漢兵",-3.2,-1.8,0.25],["漢兵",-5.0,-0.4,0.25],["齊兵",4.0,-1.0,0.25],["齊兵",4.8,-1.8,0.25],["齊兵",3.6,-0.2,0.25],["光武帝",-7.2,1.2]],"beats":[{"t":"耿弇年輕時就跟著光武帝。早在南陽，他就提出一個大計畫：先平定北方，再往東攻下齊地的張步。"},{"t":"這個計畫實在太大了，很多人都覺得很難做到。"},{"t":"西元 29 年，耿弇帶兵攻打張步，一路打到齊地的臨淄，兩軍展開大戰。","fx":[["cheerAll","齊兵"]]},{"t":"激戰中，一支箭射中耿弇的大腿。他用佩刀把箭桿砍斷，忍著痛繼續指揮，身邊的人都沒發現。","fx":[["focus","耿弇"]]},{"who":"耿弇","t":"絕不後退！衝啊！","fx":[["cheer","耿弇"],["cheerAll","漢兵"],["sadAll","齊兵"]]},{"t":"張步大敗逃走，齊地終於平定。光武帝親自來到臨淄慰勞軍隊。","mv":[["光武帝",-1.0,0.8],["齊兵",7.6,-1.0],["齊兵#2",8.0,-1.8],["齊兵#3",7.4,-0.2]],"fx":[["focus",null]]},{"who":"光武帝","t":"將軍當年在南陽提出這個大計畫，朕還以為太難實現……","fx":[["say","光武帝"]]}],"q":"光武帝稱讚耿弇：只要有遠大的志向，堅持下去，事情終究會成功！這句話後來變成哪個成語？","wrong":[{"w":"半途而廢","by":"耿弇","line":"半途而廢是做到一半就放棄。我中了箭都沒停下來呢！"},{"w":"有勇無謀","by":"光武帝","line":"有勇無謀是只有勇氣、沒有計謀。耿將軍可是先想好大計畫，有勇又有謀！"},{"w":"鍥而不捨","by":"光武帝","line":"鍥而不捨是一直刻下去不放棄，意思很接近！不過朕稱讚的重點是「有志向的人終究會成功」。"}],"hint":"原句是「有志者事竟成」，「竟」是終於的意思。","after":"光武帝還說：「從前韓信打下歷下，開創了漢朝的基業；今天將軍攻下祝阿，也立下了大功。」","lesson":{"title":"耿弇平定齊地","text":"耿弇一生平定了四十六個郡，從來沒有打過敗仗，也是「雲台二十八將」之一。從此，東方大部分的地方都歸順了漢朝。","next":"西北的河西，還有一位手握重兵的將軍竇融，大家都在等他選邊站……"}},{"id":"e31_05","yr":"西元 29 年","place":"河西．竇融軍營","scene":"tent","music":"palace","table":true,"cast":[["竇融",-0.4,0.4],["劉鈞",1.6,0.8],["部將",-1.6,-0.6]],"beats":[{"t":"東漢初年，竇融守著西北的河西地區。那裡兵強馬壯、糧食充足，社會很安定。"},{"t":"隴地的隗囂和蜀地的公孫述，都想拉攏竇融。","fx":[["focus","竇融"]]},{"who":"竇融","t":"天下還沒統一，我們該幫哪一邊呢？","fx":[["say","竇融"]]},{"t":"竇融決定派部下劉鈞到洛陽，向光武帝表達心意。","mv":[["劉鈞",7.2,1.2]],"fx":[["focus",null]]},{"t":"光武帝見到劉鈞非常高興，請他吃飯，還讓他帶回一封蓋了皇帝印章的信。","mv":[["劉鈞",1.4,0.8]]},{"who":"劉鈞","t":"將軍，這是陛下給您的信！","fx":[["cheer","劉鈞"]]},{"who":"部將","t":"信上寫了什麼？快念給大家聽！","fx":[["upset","部將"]]}],"q":"光武帝在信上說：「現在公孫述和隗囂互相爭鬥，關鍵就在將軍身上。將軍的腳往左或往右踏一步，就決定哪一邊輕、哪一邊重。」後來用哪個成語，形容一個人地位很重要，一舉一動都能影響大局？","wrong":[{"w":"無足輕重","by":"部將","line":"無足輕重是一點也不重要。陛下的意思剛好相反！"},{"w":"足智多謀","by":"劉鈞","line":"足智多謀是很聰明、計謀很多。我家將軍是很聰明啦，不過信上說的是腳一動，就影響輕重。"},{"w":"一言九鼎","by":"竇融","line":"一言九鼎是說話很有分量，意思有點接近！不過陛下信上寫的是腳往左、往右。"}],"hint":"「舉足」就是抬起腳。腳一動，影響什麼？","after":"竇融決定歸順光武帝，後來還帶著河西的兵馬，和光武帝一起攻打隗囂。","lesson":{"title":"竇融歸漢","text":"天下統一後，竇融把河西交給朝廷，到洛陽做官，光武帝非常禮遇他。竇家後來成了東漢很有名的大家族。","next":"西元 30 年，大將馮異從關中回到洛陽，光武帝向大臣們介紹起這位老部下……"}},{"id":"e31_07","yr":"西元 30 年","place":"洛陽．朝廷","scene":"office","music":"palace","cast":[["光武帝",0.2,-0.6],["馮異",-6.8,1.0],["大臣",2.4,1.0],["大臣",3.2,0.0]],"beats":[{"t":"光武帝剛起兵時，在河北被王郎追趕，又冷又餓。馮異在無蔞亭替他煮了一碗熱豆粥，在滹沱河邊又送上麥飯。"},{"t":"後來馮異平定了關中。有人上書說：馮異在關中權力太大，百姓都叫他「咸陽王」。","fx":[["upset","大臣"]]},{"t":"馮異知道了很害怕，趕緊上書向光武帝表明忠心。"},{"t":"西元 30 年春天，馮異回到洛陽朝見光武帝。","mv":[["馮異",-1.0,0.6]],"fx":[["sad","馮異"]]},{"who":"光武帝","t":"各位，這位就是朕起兵時的主簿。","fx":[["say","光武帝"],["focus","光武帝"]]},{"who":"光武帝","t":"當年的路又難走又危險，都是他一路替朕開路，才平定了關中！"}],"q":"光武帝說，馮異替他「撥開荊條、砍除有刺的草木」，一路掃除障礙，平定關中。這句話後來變成哪個成語？","wrong":[{"w":"打草驚蛇","by":"馮異","line":"打草驚蛇是不小心驚動了對方。我砍掉草木是為了開路，不是去嚇蛇的！"},{"w":"過河拆橋","by":"光武帝","line":"過河拆橋是事情成功了就忘了幫忙的人。朕可不是這種人，功臣朕都記得！"},{"w":"篳路藍縷","by":"大臣","line":"篳路藍縷是駕著柴車、穿著破衣去開闢山林，也是說開創事業很辛苦，意思很接近！不過陛下說的是撥開荊條、砍除荊棘。"}],"hint":"「荊」和「棘」都是有刺的小樹。","after":"光武帝賞給馮異珍寶、衣服和錢，還下詔說：「當年無蔞亭的豆粥、滹沱河的麥飯，這份恩情朕一直還沒報答呢。」","winMv":[["馮異",-0.6,0.4]],"lesson":{"title":"大樹將軍","text":"馮異為人很謙虛。將軍們休息時常常坐在一起爭功勞，馮異卻總是一個人躲到大樹下，大家就叫他「大樹將軍」。","next":"這時東方已經平定，將軍們問光武帝：要不要趁勝攻打隗囂和公孫述？"}},{"id":"e31_08","yr":"西元 30 年","place":"洛陽．皇宮","scene":"palace","music":"palace","cast":[["光武帝",0.2,-0.4],["吳漢",-6.8,1.0],["將領",2.4,1.0],["將領",3.2,0.0]],"beats":[{"t":"西元 30 年春天，吳漢攻下了朐城，打敗了東方最後一股割據的勢力。","mv":[["吳漢",-1.2,0.6]]},{"who":"吳漢","t":"報告陛下，東方都平定了！","fx":[["cheer","吳漢"]]},{"t":"現在天下大部分都平定了，只剩下西邊隴地的隗囂，和蜀地的公孫述。"},{"who":"將領","t":"陛下，要不要趁勝馬上去打他們？","fx":[["cheerAll","將領"]]},{"t":"光武帝想了想。將士們已經打了好多年的仗，都累壞了。","fx":[["focus","光武帝"]]},{"who":"光武帝","t":"這兩個人嘛，就先……","fx":[["say","光武帝"]]}],"q":"光武帝說：「取此兩子置度外。」意思是把這兩個人暫時放在考慮的範圍之外，先不去理會。這句話後來變成哪個成語？","wrong":[{"w":"念念不忘","by":"將領","line":"念念不忘是一直記在心上。陛下是說先不管他們！"},{"w":"刻不容緩","by":"吳漢","line":"刻不容緩是一刻也不能拖延。陛下說的剛好相反，可以先等一等！"},{"w":"不聞不問","by":"光武帝","line":"不聞不問是不聽也不問、漠不關心，意思有點接近！不過朕原句說的是把他們放在「度外」。"}],"hint":"「度」是考慮、計算的範圍。","after":"光武帝讓將領們休息，擺酒宴獎賞大家。","winMv":[["將領",1.6,1.4],["將領#2",2.8,0.6]],"lesson":{"title":"休兵養民","text":"這一年，光武帝讓很多士兵回家種田，還把田租減到三十分之一，讓百姓喘口氣。不過到了夏天，光武帝要借道隴地攻打公孫述，隗囂不肯，雙方終於打了起來。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十三章．光武打天下","eps":[8,18,31,44]},{"key":"h21","line":"history","name":"東漢盛世","short":"東漢前期","era":"西元 32–77 年","color":"#3E8A7A","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["光武帝打敗隗囂和公孫述，在西元 36 年統一了天下。","他勤勞治國，讓打了很多年仗的百姓好好休息。","光武帝過世後，兒子漢明帝、孫子漢章帝接著治理，國家安定興盛，史稱「明章之治」。","這段時間出了很多講信用的好官、很有精神的老將軍，還有不讓娘家掌權的賢明太后。"],"people":[["光武帝","東漢的開國皇帝"],["馬援","伏波將軍，六十多歲還請命出征"],["第五倫","清廉的大臣，姓「第五」"],["馬太后","馬援的女兒，漢章帝的母親"]]},"stops":[{"id":"e19_06","yr":"西元 32 年","place":"隴地．西城","scene":"walls","music":"battle","cast":[["隗囂",0.6,-2.7,1.3],["岑彭",-6.8,1.0],["吳漢",-7.4,0.2],["漢兵",6.6,0.6],["漢兵",7.2,1.4],["使者",7.4,2.0]],"beats":[{"t":"西元 32 年，光武帝親自帶兵攻打隗囂，竇融也帶著河西的兵馬來幫忙。隗囂打不過，逃進西城死守。"},{"who":"隗囂","t":"守住城牆，絕不投降！","fx":[["upset","隗囂"]]},{"t":"大將岑彭和吳漢帶兵，把西城團團圍住。","mv":[["岑彭",-1.2,0.6],["吳漢",-0.4,-0.4],["漢兵",1.8,0.6],["漢兵#2",2.6,1.4]],"fx":[["cheerAll","漢兵"]]},{"t":"這時東方發生亂事，光武帝只好先趕回洛陽，留下一封信給岑彭。","mv":[["使者",0.8,1.2]]},{"who":"使者","t":"岑將軍，陛下的信！","fx":[["say","使者"]]},{"who":"岑彭","t":"陛下說：西城如果打下來，就可以帶兵往南，攻打蜀地的公孫述。","fx":[["focus","岑彭"]]},{"who":"吳漢","t":"咦，陛下在信的後面，好像還在笑自己呢……"}],"q":"光武帝在信上說：「人總是苦在不知足，已經平定了隴地，又望著蜀地。」後來用哪個成語，比喻貪心不知足？","wrong":[{"w":"知足常樂","by":"吳漢","line":"知足常樂是知道滿足就會快樂。陛下說的剛好相反，是不知足！"},{"w":"望梅止渴","by":"岑彭","line":"望梅止渴是想著梅子來解渴，那是三國時曹操的故事。陛下望的是蜀地！"},{"w":"貪得無厭","by":"岑彭","line":"貪得無厭也是貪心不知足，意思很接近！不過陛下信裡寫的是兩個地名。"}],"hint":"「隴」在今天的甘肅，「蜀」在今天的四川。","after":"光武帝在信的最後還說：「每次出兵，頭髮和鬍子就白了一些。」","lesson":{"title":"天下統一","text":"隗囂後來又病又餓，在西元 33 年過世。西元 36 年，吳漢攻下成都，公孫述受重傷而死，光武帝終於統一了天下。","next":"光武帝急著趕回東方，是因為潁川一帶冒出了很多山賊……"}},{"id":"e59_04","yr":"西元 33 年","place":"潁川．山區","scene":"mountain","music":"palace","cast":[["郭伋",-6.8,1.0],["趙宏",2.4,-1.0],["召吳",3.2,-0.2],["山賊",4.0,-1.4],["山賊",4.6,-0.4]],"beats":[{"t":"潁川一帶山賊很多。光武帝派郭伋去當太守，出發前叮嚀他：「山路很危險，你要小心！」","mv":[["郭伋",-1.0,0.6]]},{"t":"郭伋到了潁川，沒有派大軍上山打，而是派人去勸山賊投降。"},{"who":"郭伋","t":"放下刀槍，回家好好種田吧！我說話算話！","fx":[["say","郭伋"],["focus","郭伋"]]},{"t":"山賊首領趙宏、召吳帶著幾百人，空著手下山投降。郭伋讓他們全部回家種田。","mv":[["趙宏",0.6,0.4],["召吳",1.6,1.0]],"fx":[["focus",null]]},{"t":"郭伋沒有先問皇帝就自己作主，所以上書請罪。沒想到光武帝反而稱讚他的辦法很好。"},{"who":"趙宏","t":"郭大人講信用，我們跟著他準沒錯！","fx":[["cheer","趙宏"],["cheerAll","山賊"]]}],"q":"趙宏、召吳的同夥聽說了郭伋的威望和信用，從江南、幽州、冀州遠遠趕來，一批接一批投降，前後相連，連續不斷。這種景象叫做什麼？","wrong":[{"w":"一哄而散","by":"趙宏","line":"一哄而散是一下子全都跑光光。我們是一批接一批來，剛好相反！"},{"w":"寥寥無幾","by":"郭伋","line":"寥寥無幾是非常少，沒有幾個。來投降的人多到數不完呢！"},{"w":"川流不息","by":"郭伋","line":"川流不息也是像河水一樣連續不斷，意思很接近！不過史書原文寫的是「駱驛不絕」。"}],"hint":"史書原文寫成「駱驛不絕」，換成同音的哪兩個字？","after":"郭伋講信用、待人寬厚，潁川很快就安定下來了。","lesson":{"title":"竹馬迎郭伋","text":"郭伋後來到并州當官，幾百個小孩騎著竹馬在路上歡迎他。他和孩子們約好回來的日子，結果提早一天回來，竟然在城外住了一晚，等到約定那天才進城，因為不想對孩子們失信。","next":"天下統一了，光武帝身邊有一位老將軍馬援，雖然年紀大了，還是想上戰場……"}},{"id":"e08_07","yr":"西元 48 年","place":"洛陽．皇宮","scene":"palace","music":"palace","cast":[["光武帝",0.4,-0.4],["馬援",-6.8,1.0],["大臣",2.6,1.0]],"beats":[{"t":"馬援年輕時在北方邊地放牧，養了幾千頭牛羊，變得很有錢，卻把財產都分給了親戚朋友。"},{"t":"他常對朋友說：「大丈夫立志，越窮越要堅定……」後來他跟隨光武帝南征北戰，被封為「伏波將軍」。"},{"t":"西元 48 年，南方武陵的五溪一帶發生亂事，朝廷派去的軍隊打了敗仗。62 歲的馬援請求帶兵出征。","mv":[["馬援",-1.0,0.6]]},{"who":"馬援","t":"陛下，請讓老臣去吧！","fx":[["say","馬援"]]},{"who":"光武帝","t":"將軍年紀這麼大了，朕實在不放心啊。","fx":[["sad","光武帝"]]},{"t":"馬援馬上穿上鎧甲，跳上馬背，坐在馬鞍上左看右看，表示自己還很有力氣。","mv":[["馬援",-0.2,0.2]],"fx":[["cheer","馬援"],["focus","馬援"]]}],"q":"光武帝笑著說：「這位老先生真有精神啊！」馬援年輕時就說過：人越老，志氣越要豪壯。這句話後來變成哪個成語？","wrong":[{"w":"老態龍鍾","by":"馬援","line":"老態龍鍾是年紀大、行動不靈活。老夫可是一下子就跳上馬背了！"},{"w":"少不更事","by":"大臣","line":"少不更事是年紀小、經歷少，不懂事。馬將軍六十多歲了，經驗可多呢！"},{"w":"老驥伏櫪","by":"光武帝","line":"老驥伏櫪是老馬趴在馬槽邊，還想跑千里路，意思很接近！不過那是三國曹操的詩句，馬將軍說的是「越老越要強壯」。"}],"hint":"「當」是應當，「益」是更加。老了，應當更加怎麼樣？","after":"光武帝答應了，派馬援帶兵出征。","lesson":{"title":"馬革裹屍","text":"馬援曾說：男子漢應該在邊疆戰場上為國家奮戰，就算犧牲了，也要用馬皮包著身體送回家鄉。這次出征，他在軍中生病過世了。","next":"光武帝自己也和馬援一樣，年紀大了，還是停不下來……"}},{"id":"e24_07","yr":"光武帝晚年","place":"洛陽．皇宮","scene":"study","music":"night","cast":[["光武帝",-0.8,-1.4],["大臣",0.8,-0.6],["將領",1.6,0.2],["皇太子",6.8,1.0]],"beats":[{"t":"光武帝每天一大早就上朝處理國事，一直忙到太陽偏西才退朝。"},{"t":"到了晚上，他還常常找大臣、將領來討論經書的道理，一直討論到半夜才睡。","fx":[["say","大臣"]]},{"who":"光武帝","t":"這段道理說得真好！再說說看！","fx":[["cheer","光武帝"]]},{"t":"大臣們告退以後，皇太子劉莊走了進來。他看到父親這麼辛苦，很捨不得。","mv":[["大臣",7.2,0.6],["將領",7.6,1.4],["皇太子",0.6,-0.4]]},{"who":"皇太子","t":"父皇像大禹、商湯一樣英明，卻不懂得保養身體。請多愛惜精神，好好休息吧！","fx":[["focus","皇太子"]]}],"q":"光武帝笑著回答：「我自己喜歡做這些事，一點也不覺得累。」這句話後來變成哪個成語？","wrong":[{"w":"疲於奔命","by":"皇太子","line":"疲於奔命是忙到累得跑不動。父皇說的是一點也不累！"},{"w":"樂不思蜀","by":"大臣","line":"樂不思蜀是快樂到不想回家，那是三國時劉禪的故事。陛下快樂的是處理國事！"},{"w":"廢寢忘食","by":"皇太子","line":"廢寢忘食是忙到忘了睡覺吃飯，父皇確實常常很晚睡，意思有點接近！不過父皇強調的是「喜歡，所以不累」。"}],"hint":"「樂」念ㄌㄜˋ，喜歡做「這件事」，所以不覺得什麼？","after":"光武帝在位三十多年，西元 57 年過世，由太子劉莊即位，就是漢明帝。","lesson":{"title":"勤儉的光武帝","text":"光武帝雖然是開國皇帝，卻很節儉。天下統一後，他很少再提打仗的事，讓百姓好好休養，也重用讀書人，替後來的「明章之治」打下基礎。","next":"可是光武帝剛過世，他的一個兒子就偷偷寫了一封假信……"}},{"id":"e44_04","yr":"西元 57 年","place":"東海國","scene":"palace","music":"night","cast":[["劉彊",0.8,-0.4],["僕人",-6.8,1.0],["劉荊",-6.4,-1.6],["侍衛",2.8,1.2]],"beats":[{"t":"劉彊本來是光武帝的太子。後來他的母親郭皇后被廢，劉彊主動讓出太子的位子，被封為東海王。"},{"t":"西元 57 年，光武帝過世。劉彊的弟弟劉荊在喪禮上一點也不傷心，還偷偷寫了一封信。","mv":[["劉荊",-4.0,-1.4]],"fx":[["focus","劉荊"]]},{"who":"劉荊","t":"叫僕人假裝是哥哥的舅舅郭況派去的，哥哥一定會上當！","fx":[["say","劉荊"]]},{"who":"僕人","t":"東海王，這是您舅舅郭大人寫的信！","mv":[["劉荊",-7.2,-1.6],["僕人",-0.6,0.6]],"fx":[["focus",null]]},{"t":"劉彊打開信，信上說：您被冤枉趕下太子的位子，現在起兵爭天下，一定可以聚集百萬大軍……"},{"t":"信上還說：這樣去打天下，比用一座大山去壓一顆雞蛋還容易！","fx":[["upset","劉彊"],["focus","劉彊"]]}],"q":"假信上說，起兵打天下「比用大山壓碎一顆雞蛋還容易」。後來用哪個成語，比喻強大的力量壓倒弱小，一定會贏？","wrong":[{"w":"以卵擊石","by":"劉彊","line":"以卵擊石是拿雞蛋去撞石頭，是弱的去打強的，剛好相反！"},{"w":"雞飛蛋打","by":"僕人","line":"雞飛蛋打是雞飛走了、蛋也破了，兩頭落空。信上說的是一定會贏。"},{"w":"勢如破竹","by":"侍衛","line":"勢如破竹是像劈竹子一樣一路順利，意思有點接近！不過信上強調的是大山和雞蛋，強弱差太多。"}],"hint":"那座大山，是五嶽中最有名的一座，在山東。","after":"劉彊嚇壞了，立刻抓住送信的人，把信封好交給新皇帝漢明帝，表明自己絕對忠心。","winMv":[["侍衛",-0.2,0.4]],"lesson":{"title":"忠厚的劉彊","text":"漢明帝知道是弟弟劉荊在搞鬼，因為是親兄弟，就把這件事壓了下來。劉彊第二年就生病過世了。劉荊後來還是不安分，最後落得悲慘的下場。","next":"明帝、章帝的時候，朝廷裡有一位很清廉的大臣，他的姓很特別，叫做「第五」……"}},{"id":"e24_02","yr":"漢章帝時","place":"洛陽．第五倫家","scene":"house","music":"palace","cast":[["第五倫",-0.6,0.2],["第五倫的妻子",1.2,-0.8],["百姓",6.6,0.8],["百姓",7.2,1.6]],"beats":[{"t":"第五倫姓「第五」，是個很少見的姓。他當會稽太守時，已經是大官了，卻還是自己割草餵馬，妻子也自己下廚煮飯。"},{"who":"第五倫","t":"自己的事，自己做！","fx":[["say","第五倫"]]},{"t":"他領到的糧食只留一個月的份量，其他的都便宜賣給窮苦的百姓。","mv":[["百姓",1.8,0.8],["百姓#2",2.6,1.6]]},{"who":"百姓","t":"謝謝大人！","fx":[["cheerAll","百姓"]]},{"t":"後來漢章帝請第五倫當「司空」，成為朝廷裡最高的三位大臣之一。","fx":[["focus","第五倫"]]},{"t":"他看到皇親國戚生活奢侈，就上書提醒章帝：「自己的行為不端正，就算下了命令，別人也不會聽從。」","fx":[["say","第五倫"]]}],"q":"第五倫在上書裡說：「用自己的行動來教人，別人就會跟著做；只用嘴巴教人，別人就會跟你爭辯。」用自己的行為做大家的榜樣，叫做什麼？","wrong":[{"w":"好吃懶做","by":"第五倫的妻子","line":"好吃懶做是貪吃又懶惰。我們家大人可是自己割草餵馬呢！"},{"w":"紙上談兵","by":"第五倫","line":"紙上談兵是只會說空話、不會做事。我是先做到，再要求別人。"},{"w":"身體力行","by":"百姓","line":"身體力行是親自去實行，意思很接近！不過答案還多了一層意思：做出「榜樣」給別人看。"}],"hint":"「身」是自己，「則」是榜樣、規範。","after":"章帝很欣賞第五倫的話。第五倫一生清廉，大家都稱讚他公正無私。","lesson":{"title":"第五倫的真心話","text":"有人問第五倫有沒有私心。他說：「哥哥的兒子生病，我一晚去看十次，回來就睡得著；我自己的兒子生病，我沒去看，卻整晚睡不著。這樣怎麼能說沒有私心呢？」","next":"章帝想替母親的兄弟們封侯，沒想到第一個反對的，就是他的母親馬太后……"}},{"id":"e11_08","yr":"西元 77 年","place":"洛陽．長樂宮","scene":"palace","music":"palace","cast":[["馬太后",0.4,-0.4],["漢章帝",-6.8,1.0],["大臣",6.8,1.2]],"beats":[{"t":"馬太后是名將馬援的女兒，也是漢明帝的皇后。漢章帝從小由她撫養長大，母子感情很好。"},{"t":"這時連續發生旱災。有大臣說：天不下雨，是因為沒有替太后的兄弟們封侯。","mv":[["大臣",2.4,1.0]]},{"who":"大臣","t":"陛下，應該替舅舅們封侯，老天爺才會下雨！","fx":[["say","大臣"]]},{"who":"漢章帝","t":"母后，朕想封舅舅們當侯爺！","mv":[["漢章帝",-1.0,0.6]]},{"who":"馬太后","t":"現在鬧旱災，糧價漲了好幾倍，我日夜擔心，坐也不安、睡也不安。這時候怎麼能封爵位？","fx":[["upset","馬太后"]]},{"who":"馬太后","t":"等到豐收的年頭，再照你的意思吧。到那時候，我只想……","fx":[["focus","馬太后"]]}],"q":"馬太后說，到那時候她只要嘴裡含著甜甜的麥芽糖，陪孫子玩，不再過問國家大事。這句話後來變成哪個成語，形容老人家悠閒快樂的生活？","wrong":[{"w":"垂簾聽政","by":"大臣","line":"垂簾聽政是太后坐在簾子後面管國家大事。太后說的是不想管了！"},{"w":"爭權奪利","by":"漢章帝","line":"爭權奪利是搶權力、搶好處。母后最不喜歡這樣了！"},{"w":"天倫之樂","by":"馬太后","line":"天倫之樂是一家人團聚的快樂，意思很接近！不過我說的是含著糖、逗孫子玩的悠閒生活。"}],"hint":"「飴」念ㄧˊ，就是麥芽糖。","after":"漢章帝只好暫時打消了封侯的念頭。","lesson":{"title":"賢明的馬太后","text":"馬太后很節儉，穿粗糙的絲布衣裙，吃東西也不挑。她知道西漢末年外戚王家權力太大，最後讓王莽奪了皇位，所以一直管著自己的娘家。","next":"馬太后不只拒絕封侯。有一天，她經過娘家附近，看到門口熱鬧得不得了……"}},{"id":"e31_02","yr":"西元 77 年","place":"洛陽．濯龍門","scene":"palace","music":"palace","cast":[["馬太后",-1.0,0.4],["漢章帝",-0.2,-0.6],["賓客",6.6,-1.4],["賓客",7.2,-0.6],["賓客",7.8,0.2]],"beats":[{"who":"馬太后","t":"我們家的親戚，並沒有替國家立下什麼大功勞，怎麼可以封侯呢？","fx":[["say","馬太后"]]},{"who":"馬太后","t":"我是太后，穿的是粗布衣裙，吃東西不挑好吃的，身邊的人也不用香料打扮。"},{"t":"前些日子，馬太后經過濯龍門，看到去她娘家問候的人好多好多。","fx":[["prop","cart",1.6,-1.8,0],["prop","cart",3.4,-1.2,0]]},{"t":"一輛輛車子、一匹匹馬，從門前不停地經過。","mv":[["賓客",1.0,-1.0],["賓客#2",2.0,-0.4],["賓客#3",3.0,0.4]],"fx":[["focus",null]]},{"who":"漢章帝","t":"母后，舅舅家好熱鬧啊！","fx":[["cheer","漢章帝"]]},{"t":"馬太后皺起眉頭，一句話也沒說。","fx":[["focus","馬太后"],["upset","馬太后"]]}],"q":"馬太后說，她看到娘家門口的車子多得像流動的河水，馬匹多得像游動的龍。後來用哪個成語，形容車馬往來不斷、繁華熱鬧的景象？","wrong":[{"w":"人煙稀少","by":"漢章帝","line":"人煙稀少是住的人很少、很冷清。舅舅家門口可熱鬧了！"},{"w":"萬籟俱寂","by":"賓客","line":"萬籟俱寂是安靜得一點聲音也沒有。這麼多車和馬，吵都吵死了！"},{"w":"熙來攘往","by":"馬太后","line":"熙來攘往是人來人往很熱鬧，意思很接近！不過我說的是車子和馬匹。"}],"hint":"原句是「車如流水，馬如游龍」。","after":"馬太后沒有發脾氣，只是停掉娘家每年的費用，希望他們安靜收斂一點。","winMv":[["賓客",7.2,-1.0],["賓客#2",7.8,-0.4],["賓客#3",8.2,0.4]],"lesson":{"title":"明章之治","text":"在馬太后的堅持下，外戚沒有像西漢的王家那樣掌握大權。漢明帝、漢章帝兩代，國家安定興盛，史稱「明章之治」。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十四章．東漢盛世","eps":[8,11,19,24,31,44,59]},{"key":"h22","line":"history","name":"東漢賢人","short":"東漢中期","era":"約西元 80–142 年","color":"#B5804A","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["光武帝重建漢朝以後，明帝、章帝接著治理，東漢過了幾十年太平日子。","後來的皇帝大多很小就即位，太后的娘家人（外戚）和宮裡的宦官，輪流掌握大權。","朝廷雖然越來越亂，民間和官場卻出了不少孝子、賢妻、勇敢說真話的大臣和好官。","這一章，我們從一個孝順的小男孩開始，認識東漢中期的賢人！"],"people":[["黃香","江夏的孝子，人稱「天下無雙，江夏黃童」"],["班超","經營西域三十年的大將"],["班昭","班超的妹妹，東漢有名的女學者"],["張綱","不帶兵馬、只靠誠意招降的太守"]]},"stops":[{"id":"e11_04","yr":"東漢前期","place":"江夏黃家","scene":"house","music":"palace","cast":[["小黃香",6.6,1.2],["黃爸爸",1.6,-0.6],["鄰居",6.8,-0.4]],"beats":[{"t":"東漢時，江夏有個小男孩叫黃香。他九歲時媽媽就過世了，只剩下爸爸和他相依為命。"},{"t":"家裡很窮，請不起僕人，所有家事都是黃香自己動手做。","mv":[["小黃香",0.2,0.4]]},{"t":"夏天熱得像蒸籠，黃香拿起扇子，對著爸爸的枕頭和床蓆一直搧。","fx":[["focus","小黃香"]]},{"who":"黃爸爸","t":"哇，床好涼快！香兒，你自己也去歇歇吧。","fx":[["cheer","黃爸爸"]]},{"t":"到了冬天，被窩冷得像冰。黃香先鑽進去，用自己的身體把蓆子焐熱，才請爸爸睡。"},{"who":"鄰居","t":"這孩子這麼小就這麼孝順，真是了不起！","mv":[["鄰居",2.8,0.2]],"fx":[["cheer","鄰居"]]}],"q":"黃香夏天替爸爸搧涼枕頭和床蓆，冬天用身體把床蓆焐熱。後人用哪個成語形容這種孝順？","wrong":[{"w":"冬暖夏涼","by":"黃爸爸","line":"冬暖夏涼是在說房子住起來舒服。我家破破的，是香兒親手讓床變涼、變暖的！"},{"w":"好吃懶做","by":"鄰居","line":"好吃懶做是貪吃又懶惰。黃香家事全包，跟懶惰一點關係都沒有！"},{"w":"晨昏定省","by":"小黃香","line":"晨昏定省是早晚向爸媽請安，也是孝順，很接近！不過我是搧枕頭、焐床蓆，有一個專門的成語。"}],"hint":"夏天用「扇」子，冬天讓蓆子變「溫」暖。","after":"黃香的孝順傳遍了京城，大家都說：「天下無雙，江夏黃童。」","lesson":{"title":"香九齡，能溫席","text":"黃香長大後很用功，後來做到尚書令，是朝廷的重要大臣。《三字經》裡的「香九齡，能溫席」，說的就是他。","next":"同一個時候，有一對住在別人屋簷下的窮夫妻，也讓人非常佩服……"}},{"id":"e11_05","yr":"東漢章帝時","place":"吳地皋家","scene":"house","music":"palace","cast":[["梁鴻",6.6,1.2],["孟光",0.8,-0.8],["皋伯通",-6.6,-0.4]],"beats":[{"t":"梁鴻是很有學問的讀書人，卻不想做官。他娶了同鄉的孟光，孟光長得不漂亮，但力氣大、品德好。"},{"t":"新婚時孟光打扮得很華麗，梁鴻七天都不理她。孟光換上布衣、梳起簡單的髮髻，梁鴻才高興起來。"},{"t":"後來兩人搬到吳地，住在大戶人家皋伯通的屋簷下。梁鴻每天替人舂米賺錢。","mv":[["梁鴻",1.2,0.6]]},{"who":"孟光","t":"相公辛苦了，飯已經準備好了。","mv":[["孟光",0.1,0.4]]},{"t":"孟光端著放飯菜的小托盤，不敢抬頭直視丈夫，把托盤舉得和眉毛一樣高。","fx":[["focus","孟光"]]},{"who":"皋伯通","t":"咦？一個替人舂米的工人，妻子竟然這麼尊敬他！","mv":[["皋伯通",-1.6,-0.6]],"fx":[["upset","皋伯通"]]}],"q":"孟光每次送飯，都把托盤舉到眉毛那麼高，表示對丈夫的尊敬。後來形容夫妻互相尊重、感情和睦，用哪個成語？","wrong":[{"w":"同床異夢","by":"孟光","line":"同床異夢是住在一起，心裡卻各想各的。我們夫妻可是一條心！"},{"w":"河東獅吼","by":"梁鴻","line":"河東獅吼是說太太很兇，對丈夫大吼大叫。我家娘子溫柔得很！"},{"w":"相敬如賓","by":"皋伯通","line":"相敬如賓是夫妻像對待客人一樣互相尊重，意思很接近！不過孟光舉托盤的這個故事，有一個專門的成語。"}],"hint":"「案」是有腳的小托盤，舉到和「眉」一樣高。","after":"皋伯通覺得梁鴻一定不是普通人，就請他們住進家裡。梁鴻從此安心讀書，寫了十幾篇文章。","lesson":{"title":"梁鴻與孟光","text":"梁鴻曾寫〈五噫歌〉，感嘆宮殿蓋得豪華、百姓卻很辛苦，惹得漢章帝不高興，只好改名換姓躲到吳地。他和孟光過著簡樸的生活，成了後人心中夫妻相敬的榜樣。","next":"章帝過世後，十歲的漢和帝即位，太后的哥哥竇憲掌握了大權……"}},{"id":"e24_06","yr":"西元 92 年","place":"洛陽朝廷","scene":"office","music":"palace","cast":[["漢和帝",0.4,-0.6],["丁鴻",6.6,1.2],["竇憲",2.6,0.6],["大臣",-1.8,0.4]],"beats":[{"t":"漢和帝即位時才十歲，由竇太后管理朝政。太后的哥哥竇憲當上大將軍，權力大得不得了。"},{"who":"竇憲","t":"朝廷大事，全都由我說了算！","fx":[["cheer","竇憲"]]},{"t":"竇家的親戚到處當官，大臣們都很害怕。這一年，天上發生了日食，太陽被遮住了一大塊。","fx":[["sad","大臣"]]},{"t":"古人相信日食是上天在警告。司徒丁鴻趁機上書給和帝。","mv":[["丁鴻",1.4,0.8],["竇憲",5.2,1.4]]},{"who":"丁鴻","t":"能沖垮山崖的大水，是從細細的小水流開始的；高聳入雲的大樹，是從小芽長起來的。","fx":[["focus","丁鴻"]]},{"who":"丁鴻","t":"壞事還小的時候阻止很容易，等它變大就難救了。請陛下及早處理！"}],"q":"丁鴻勸和帝：在壞事剛冒出苗頭時就阻止，不要讓它慢慢擴大。這個道理變成哪個成語？","wrong":[{"w":"雪上加霜","by":"大臣","line":"雪上加霜是災難一個接一個。丁大人是想在災難變大之前擋住它！"},{"w":"亡羊補牢","by":"丁鴻","line":"亡羊補牢是羊跑掉了才去修羊圈。我是希望羊圈一有小破洞，就馬上補好！"},{"w":"未雨綢繆","by":"漢和帝","line":"未雨綢繆是下雨前先準備好，也是提早行動，很接近！不過丁鴻說的是壞事剛冒芽就堵住，有一個專門的成語。"}],"hint":"「杜」是堵住，「漸」是慢慢變大。","after":"和帝聽從勸告，派丁鴻帶兵守衛宮城，收回竇憲的大將軍印。竇憲失去權力，竇家的勢力也垮了。","lesson":{"title":"外戚與宦官","text":"和帝能扳倒竇憲，靠的是宦官鄭眾幫忙，從此宦官也開始受到重用。東漢後來一百多年，外戚和宦官輪流掌權，朝政越來越亂。","next":"這時候，遠在西域的老將班超，已經在外面守了快三十年……"}},{"id":"e59_05","yr":"約西元 100 年","place":"洛陽班家","scene":"study","music":"night","cast":[["班昭",-1.0,-1.8],["信使",6.6,1.0],["侍女",2.4,-1.2]],"beats":[{"t":"班超年輕時投筆從戎，到西域三十年，讓五十多個國家都和漢朝交好。"},{"t":"一天晚上，一位信使從西域趕來，帶來班超寫的信。","mv":[["信使",0.8,-0.6]]},{"who":"信使","t":"班將軍說：『我不敢奢望回到酒泉郡，只希望活著進玉門關。』"},{"t":"班超的妹妹班昭讀著信，眼淚掉了下來。哥哥快七十歲了，頭髮全白，要拄拐杖才能走路。","fx":[["sad","班昭"]]},{"who":"班昭","t":"我要替哥哥上書給皇上！","fx":[["focus","班昭"]]},{"t":"班昭在信裡寫：如果西域突然有變亂，哥哥的力氣已經跟不上他的心意了，這會害了國家多年的功勞。"}],"q":"班超心裡還想為國家盡力，身體卻已經老了、做不到。這種心裡想做、力量卻達不到的情形，叫做什麼？","wrong":[{"w":"得心應手","by":"侍女","line":"得心應手是想做什麼都做得很順。將軍現在連走路都要拐杖，剛好相反！"},{"w":"心花怒放","by":"信使","line":"心花怒放是開心得不得了。班將軍可是想家想得好苦啊！"},{"w":"年老體衰","by":"班昭","line":"年老體衰是年紀大、身體弱，有點接近！不過我想說的是哥哥心裡還想做，力氣卻跟不上。"}],"hint":"原文是「氣力不能從心」。","after":"漢和帝讀了班昭的信很感動，下令讓班超回來。西元 102 年，七十一歲的班超終於回到洛陽。","lesson":{"title":"班超與班昭","text":"班超回到洛陽一個月後就過世了。班昭很有學問，替過世的哥哥班固寫完了《漢書》，還常進宮教皇后和妃子讀書，大家尊稱她「曹大家」。","next":"和帝後來立了鄧皇后，鄧皇后的哥哥鄧騭在朝廷裡越來越有權勢……"}},{"id":"e59_06","yr":"約西元 104 年","place":"洛陽朝廷","scene":"palace","music":"palace","cast":[["張霸",-0.6,0.4],["鄧騭",6.6,1.0],["官員",2.4,-0.8],["官員",3.4,0.4]],"beats":[{"t":"張霸以前當會稽太守，說話算話、賞罰分明，盜賊都自動投降。孩子們唱：「盜賊盡，吏皆休！」"},{"t":"做了三年，他說：「月亮圓了就會缺，做人要知足。」就稱病辭官。後來又被請回朝廷當侍中。"},{"t":"當時皇后的哥哥鄧騭非常有權勢，聽說張霸名聲好，想和他交朋友。","mv":[["鄧騭",1.6,0.6]]},{"who":"鄧騭","t":"張大人，久仰大名！我們交個朋友吧！","fx":[["say","鄧騭"]]},{"t":"張霸卻一直往後退，遲遲不回答。","mv":[["張霸",-1.6,-0.4]],"fx":[["focus","張霸"]]},{"who":"官員","t":"那可是皇后的哥哥耶！別人巴結都來不及，他竟然不理！","fx":[["upset","官員"]]}],"q":"大家笑張霸看不清當時的情勢，不懂得去巴結有權有勢的人。這句取笑他的話，變成哪個成語？","wrong":[{"w":"趨炎附勢","by":"張霸","line":"趨炎附勢是去巴結有權勢的人，那正是我不想做的事！"},{"w":"呆若木雞","by":"鄧騭","line":"呆若木雞是嚇得發呆。他不是嚇呆了，是故意不想理我啊！"},{"w":"不合時宜","by":"官員#2","line":"不合時宜是不符合當時的潮流，有點接近！不過大家笑張霸「不懂得認清情勢」，有一個專門的成語。"}],"hint":"「時務」是當時的情勢。","after":"張霸寧可被笑，也不攀附權貴。他七十歲過世前交代家人：喪事一切從簡。","lesson":{"title":"成語的意思會變","text":"這個成語原本是別人取笑張霸，其實張霸很有骨氣。現在我們說人「不識時務」，多半是指他不懂得看清情勢、不知變通。不久後和帝過世，鄧太后掌理朝政，鄧騭當上了大將軍。","next":"又過了三十年，換成梁家當外戚。有一個十五歲的少年，寫信給大將軍梁商……"}},{"id":"e31_03","yr":"約西元 135 年","place":"大將軍府","scene":"office","music":"palace","cast":[["梁商",0.4,-0.6],["霍諝",6.6,1.2],["宋光",-6.6,-0.6],["侍衛",2.6,0.8]],"beats":[{"t":"漢順帝時，大將軍梁商很有權勢。有人向他誣告一個叫宋光的官員，說他偷偷改了皇帝的詔書。"},{"who":"宋光","t":"我是冤枉的！","mv":[["宋光",-1.6,-0.8]],"fx":[["sad","宋光"]]},{"t":"宋光被關進洛陽的大牢，受盡折磨。他的外甥霍諝才十五歲，決定寫信給梁商。","mv":[["宋光",-7.2,-0.8],["霍諝",1.4,0.8]]},{"who":"霍諝","t":"我舅舅出身好人家，當官一路順利，就快要升官了。他為什麼要冒死罪去改詔書呢？","fx":[["focus","霍諝"]]},{"who":"霍諝","t":"這就像餓了去吃有毒的附子、渴了去喝毒酒，還沒到肚子裡，喉嚨就先斷了，誰會這樣做？"},{"who":"梁商","t":"這孩子才十五歲，說得真有道理！","fx":[["upset","梁商"]]}],"q":"霍諝說：口渴了卻去喝毒酒，只顧解決眼前的困難，卻招來更大的災禍。這個比喻變成哪個成語？","wrong":[{"w":"望梅止渴","by":"侍衛","line":"望梅止渴是想著酸梅來忘記口渴，只是自我安慰。喝毒酒可是會出大事的！"},{"w":"如飢似渴","by":"梁商","line":"如飢似渴是想要得很迫切，像餓了、渴了一樣。霍諝說的是用錯方法、害了自己。"},{"w":"挖肉補瘡","by":"霍諝","line":"挖肉補瘡是挖好肉去補傷口，也是用有害的方法救急，很接近！不過我說的是口渴喝毒酒，有一個專門的成語。"}],"hint":"「鴆」是傳說中的毒鳥，用牠的羽毛泡的酒有劇毒。","after":"梁商很欣賞霍諝的才華和勇氣，替宋光向皇帝說明，宋光終於被放了出來。","lesson":{"title":"少年霍諝","text":"霍諝因為這封信出了名，長大後做到尚書僕射等大官。梁商算是比較謙和的外戚，可是他過世後，兒子梁冀接任大將軍，變得非常霸道。","next":"這時候，朝廷在西邊和羌人打了好多年仗，花掉了驚人的錢……"}},{"id":"e44_06","yr":"西元 107–145 年","place":"涼州","scene":"road","music":"night","cast":[["將軍",-0.4,-0.6],["漢兵",1.2,-1.2],["漢兵",2.2,-0.4],["農夫",6.6,1.2],["范曄",1.6,0.6,0,1,1]],"beats":[{"t":"東漢中期，西邊涼州一帶的羌人，因為不滿官吏欺壓，接連起兵反抗。"},{"who":"將軍","t":"西邊又打起來了！快出兵！","fx":[["upset","將軍"]]},{"t":"朝廷派將軍東奔西跑，四處征討。第一次羌亂就打了十多年，花掉二百四十多億錢。","mv":[["將軍",-2.0,-1.6],["漢兵",-1.0,-2.0],["漢兵#2",0.0,-1.4]]},{"who":"農夫","t":"糧食都拿去運給軍隊了，我們的日子好苦啊……","mv":[["農夫",2.6,0.8]],"fx":[["sad","農夫"]]},{"t":"鏡頭一轉，三百年後的南朝，史學家范曄正在寫《後漢書》，讀到這段歷史，嘆了一口氣。","mv":[["范曄",0.6,0.4]],"fx":[["focus","范曄"]]},{"who":"范曄","t":"花了那麼多錢，搖動了好幾個州，得到的卻比失去的少，功勞還不到辛勞的一半啊！"}],"q":"范曄評論：征討羌人得到的好處，抵不過付出的損失。這個評語後來變成哪個成語？","wrong":[{"w":"一舉兩得","by":"農夫","line":"一舉兩得是做一件事得到兩個好處。我們什麼好處都沒有，只有損失！"},{"w":"大獲全勝","by":"將軍","line":"大獲全勝是完全打贏。我們雖然打贏幾場，國家卻被拖垮了……"},{"w":"勞民傷財","by":"范曄","line":"勞民傷財是又累百姓、又花錢，很接近！不過我強調的是「得到的比失去的少」，有一個專門的成語。"}],"hint":"原文是「得不酬失」，「償」是抵補。","after":"後來羌人又起兵好幾次，前前後後打了六十多年，東漢的國力被大大削弱。","lesson":{"title":"羌亂","text":"羌亂讓涼州一帶殘破不堪，國庫也花光了。東漢後期的皇帝很難再管好地方，這也是東漢衰弱的原因之一。","next":"在南方的海邊，也有一群百姓吃盡苦頭，直到一位好官到來……"}},{"id":"e59_07","yr":"東漢順帝時","place":"合浦海邊","scene":"river","music":"map","cast":[["孟嘗",6.6,1.2],["採珠人",-0.4,-0.8],["採珠人",1.4,-1.2],["貪官",2.2,0.6]],"beats":[{"t":"合浦是海邊的郡，田地很少，百姓靠採珍珠去跟鄰郡換米吃。"},{"who":"貪官","t":"珍珠統統交給我！採越多越好！","fx":[["cheer","貪官"]]},{"t":"以前的官員很貪心，逼百姓拚命採珠，全收進自己口袋。傳說珍珠都搬到隔壁交阯郡的海裡去了。","fx":[["sadAll","採珠人"]]},{"who":"採珠人","t":"海裡一顆珍珠也沒有了，拿什麼換米呢？"},{"t":"新太守孟嘗來了。他趕走貪官，改掉壞規矩，讓百姓好好採珠、公平買賣。","mv":[["孟嘗",0.6,0.6],["貪官",7.4,1.2]],"fx":[["focus","孟嘗"]]},{"t":"不到一年，海邊傳來好消息：珍珠又出現了！","fx":[["cheerAll","採珠人"],["burst","孟嘗","#f2e6c8"]]}],"q":"傳說珍珠因為貪官而離開合浦，孟嘗來了以後，珍珠又回來了。後來比喻失去的東西又找回來，叫做什麼？","wrong":[{"w":"珠光寶氣","by":"貪官","line":"珠光寶氣是穿戴一大堆珠寶，閃閃發亮。我現在可什麼都拿不到了……"},{"w":"掌上明珠","by":"採珠人","line":"掌上明珠是爸媽非常疼愛的女兒。我們說的是海裡的珍珠回來了！"},{"w":"失而復得","by":"孟嘗","line":"失而復得是丟掉的東西又得回來，意思很接近！不過合浦珍珠的故事，有一個專門的成語。"}],"hint":"地名「合浦」就藏在成語裡。","after":"小知識：珍珠搬家又回來是傳說；真正的原因可能是貪官過度採珠，讓珠貝來不及長大。","lesson":{"title":"好官孟嘗","text":"孟嘗後來因病辭官，百姓拉著他的車子不讓他走，他只好半夜搭船偷偷離開。這個成語現在也用來比喻人離開後又回來。","next":"東漢後期，揚州、徐州一帶有個叫張嬰的人，聚集了幾萬人造反……"}},{"id":"e44_08","yr":"西元 142 年","place":"廣陵張嬰營寨","scene":"walls","music":"palace","cast":[["張嬰",1.2,-0.8],["張綱",6.6,1.2],["隨從",7.4,0.4],["寨兵",2.6,-1.4],["寨兵",0.0,-1.6],["寨兵",3.2,-0.2]],"beats":[{"t":"廣陵的張嬰聚集幾萬人造反，朝廷十幾年都平定不了。以前的太守來，都要求派很多兵馬。"},{"t":"新太守張綱得罪了大將軍梁冀，才被派到這裡。他卻只帶著十幾個人，直接走進張嬰的營寨。","mv":[["張綱",0.8,0.8],["隨從",2.0,1.4]]},{"who":"張嬰","t":"什麼？太守沒帶兵就來了？","fx":[["upset","張嬰"]]},{"who":"張綱","t":"以前的官太貪心，害你們受苦。我是來聽聽大家的委屈的。","fx":[["focus","張綱"]]},{"t":"張嬰看張綱這麼誠懇，終於走出來拜見他，忍不住哭了。","mv":[["張嬰",-0.4,0.2]],"fx":[["sad","張嬰"]]},{"who":"張嬰","t":"我們只是走投無路，才聚在一起活下去。每天都像在煮東西的鍋子裡游泳，只能多喘一口氣而已……"}],"q":"張嬰說他們就像在鍋子裡游泳的魚，隨時會被煮熟。這種處境非常危險的情形，叫做什麼？","wrong":[{"w":"如魚得水","by":"張嬰","line":"如魚得水是遇到好環境，像魚在水裡一樣自在。我們的處境可是剛好相反！"},{"w":"緣木求魚","by":"隨從","line":"緣木求魚是爬到樹上抓魚，方法完全用錯。張嬰說的是魚已經在鍋子裡了！"},{"w":"危如累卵","by":"張綱","line":"危如累卵是危險得像疊起來的蛋，意思很接近！不過張嬰說的是鍋裡游的魚，有一個專門的成語。"}],"hint":"「釜」念ㄈㄨˇ，是古代煮東西的鍋子。","after":"第二天，張嬰帶著一萬多人投降。張綱讓他們回家種田，廣陵從此平靜下來。","lesson":{"title":"埋輪問豺狼","text":"張綱以前奉命巡察各地，卻把車輪埋在洛陽城外，說：「豺狼當路，安問狐狸！」意思是大壞蛋梁冀就在朝廷，何必去抓小壞蛋。一年後張綱病逝，張嬰等五百多人穿著喪服送他回故鄉。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十五章．東漢賢人","eps":[11,24,31,44,59]},{"key":"h23","line":"history","name":"名士與黃巾","short":"東漢末年","era":"約西元 156–191 年","color":"#C2603F","map":{"ground":"#b8b878","river":"#4f9fd8"},"intro":{"lines":["東漢後期，漢桓帝、漢靈帝重用宦官，朝政越來越黑暗。","有學問、有品德的讀書人叫做「名士」，他們批評宦官，結果被抓、被禁止做官，叫做「黨錮之禍」。","西元 184 年，張角帶領頭綁黃巾的百姓起兵，叫做「黃巾之亂」。","後來董卓帶兵進入洛陽，各地英雄起兵討伐，天下開始大亂。","這一章，我們先認識一位從小就很聰明的孩子——孔融！"],"people":[["孔融","孔子的後代，從小聰明又懂禮貌"],["李膺","名聲很大的名士，讀書人都想拜見他"],["朱儁","平定黃巾之亂的東漢將軍"],["孫堅","江東猛將，孫策、孫權的爸爸"]]},"stops":[{"id":"e11_03","yr":"約西元 156 年","place":"魯國孔家","scene":"house","music":"map","cast":[["小孔融",-0.6,0.6],["哥哥",0.8,-0.4],["哥哥",1.8,0.4],["爸爸",6.6,1.0]],"beats":[{"t":"孔融是孔子的第二十世孫，家裡有兄弟七個，他排行第六。"},{"t":"孔融四歲那年，家裡端來一盤香甜的梨子，兄弟們一起分著吃。","fx":[["cheerAll","哥哥"]]},{"who":"哥哥","t":"哇，好大的梨，好香喔！"},{"t":"小孔融伸手一拿，拿的是盤子裡最小的那一顆。而且每次都是這樣！","fx":[["focus","小孔融"]]},{"who":"爸爸","t":"融兒，大梨子不拿，為什麼總是挑小的呢？","mv":[["爸爸",2.4,1.2]],"fx":[["upset","爸爸"]]},{"who":"小孔融","t":"我是小孩子，照道理應該拿小的呀！","fx":[["cheer","小孔融"]]}],"q":"四歲的孔融把大梨讓給哥哥，自己拿最小的。後來比喻兄弟友愛、懂得謙讓，用哪個成語？","wrong":[{"w":"爭先恐後","by":"哥哥","line":"爭先恐後是搶著往前、怕落在後面。弟弟可是把好的讓給我們耶！"},{"w":"狼吞虎嚥","by":"哥哥#2","line":"狼吞虎嚥是吃得又快又急。弟弟連拿梨子都慢慢的、小小的！"},{"w":"先人後己","by":"爸爸","line":"先人後己是先想到別人、再想到自己，意思很接近！不過融兒分梨的故事，有一個專門的成語。"}],"hint":"答案和故事主角的名字，還有他手上的水果有關。","after":"大人們都很驚訝，覺得這孩子將來一定不簡單。","lesson":{"title":"孔融的童年","text":"這個故事記在《後漢書》的注解所引用的《融家傳》裡。孔融長大後成為東漢末年有名的文學家，和其他六位文人並稱「建安七子」。","next":"那時候，宦官把持朝政，敢說話的讀書人越來越少。有一位叫杜密的名士，最看不起閉嘴不說的人……"}},{"id":"e31_04","yr":"東漢桓帝時","place":"潁川太守府","scene":"office","music":"palace","cast":[["王昱",0.6,-0.6],["杜密",6.6,1.2],["官員",2.6,0.6]],"beats":[{"t":"杜密是很有名的正直官員，辭官回到家鄉潁川後，常常去見太守王昱。","mv":[["杜密",1.4,0.8]]},{"who":"杜密","t":"大人，某某人很有才能，請您任用；某某人做了壞事，應該處罰。"},{"t":"王昱覺得杜密管太多了，故意提起同鄉的另一個人——劉勝。","fx":[["focus","王昱"]]},{"who":"王昱","t":"劉勝從蜀郡辭官回來，關起門過日子，什麼事都不管，大家都說他清高呢！"},{"t":"杜密聽出王昱是在激他，便回答——","fx":[["upset","杜密"]]},{"who":"杜密","t":"劉勝當過大官，知道好人卻不推薦，聽到壞事也不吭聲，只想保護自己，就像天冷時的蟬，一聲也不叫！"}],"q":"杜密批評劉勝像天冷時的蟬一樣不出聲。後來比喻因為害怕而不敢說話，用哪個成語？","wrong":[{"w":"暢所欲言","by":"官員","line":"暢所欲言是想說什麼就痛快地說。劉勝可是一句話都不說！"},{"w":"金蟬脫殼","by":"王昱","line":"金蟬脫殼是用計脫身，跟蟬不叫沒有關係啦！"},{"w":"明哲保身","by":"杜密","line":"明哲保身是怕惹禍上身，只保護自己，意思很接近！不過我說他像冷天的蟬，有一個專門的成語。"}],"hint":"「噤」是閉嘴不說話。","after":"王昱聽了很慚愧，從此更加敬重杜密。","lesson":{"title":"黨錮之禍","text":"杜密和李膺都是敢批評宦官的名士，大家合稱「李杜」。後來宦官誣告名士結黨，發動兩次「黨錮之禍」，許多名士被抓、被禁止
