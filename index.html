這個夢，是在小米飯蒸熟之前做的。"}],"hint":"盧生睡醒時，鍋裡蒸的「黃粱」小米還沒熟。","after":"盧生向呂翁拜了兩拜說：「榮華富貴、生老病死，我都經歷過了，謝謝您讓我明白。」","lesson":{"title":"成語小學堂．黃粱一夢","text":"「黃粱」是黃色的小米。這個故事提醒人不要一心貪圖虛幻的富貴。明朝的湯顯祖還把它改編成戲曲《邯鄲記》。這個成語也常說成「一枕黃粱」。","next":"盧生的夢在旅店裡。還有一個人，在槐樹下做了一場更奇怪的夢……"}},{"id":"e06_04","yr":"唐．李公佐《南柯太守傳》","place":"淳于棼家的大槐樹下","scene":"south","music":"night","cast":[["淳于棼",-0.6,0.6],["紫衣使者",6.8,0.2],["紫衣使者",7.4,1.2],["槐安國王",2.2,-1.4,0,1,1]],"beats":[{"t":"這是唐朝小說《南柯太守傳》的故事。淳于棼家的南邊，有一棵很大很老的槐樹。"},{"t":"有一天，淳于棼喝醉了，躺下休息，迷迷糊糊地睡著了……","fx":[["sad","淳于棼"]]},{"t":"夢裡，來了兩位穿紫色衣服的使者，對他行禮。","mv":[["紫衣使者",1.0,0.2],["紫衣使者#2",1.6,1.2]]},{"who":"紫衣使者","t":"槐安國王派我們來，請您到國裡作客！","fx":[["say","紫衣使者"]]},{"t":"淳于棼跟著使者走進大槐樹的樹洞，來到槐安國。國王把公主嫁給他，又派他去當南柯郡的太守。","mv":[["槐安國王",1.4,-0.8]],"fx":[["cheer","淳于棼"]]},{"t":"他在南柯郡當了二十年太守，風光極了。後來打了敗仗、公主過世，被國王送回家……","mv":[["槐安國王",7.5,-1.4],["紫衣使者",7.5,0.2],["紫衣使者#2",7.5,1.2]],"fx":[["sad","淳于棼"]]},{"t":"淳于棼一醒來，發現自己還躺在家裡。他跑到槐樹下一看，樹根下竟然有一個大螞蟻窩！","fx":[["upset","淳于棼"],["focus","淳于棼"]]}],"q":"原來夢裡的槐安國是一個螞蟻窩，南柯郡就是槐樹朝南樹枝下的小蟻窩。淳于棼的二十年富貴，只是一場夢。現在如果以為自己抽中大獎，結果只是空歡喜一場，可以用哪個成語形容？","wrong":[{"w":"如夢初醒","by":"淳于棼","line":"如夢初醒是好像剛從夢裡醒來，比喻忽然明白過來。題目說的是那一場空歡喜的夢本身喔！"},{"w":"腳踏實地","by":"紫衣使者","line":"腳踏實地是做事踏實、一步一步來。淳于棼的二十年富貴，可是一點都不實在，全是夢！"},{"w":"黃粱一夢","by":"淳于棼","line":"黃粱一夢的意思幾乎一樣！不過那是在旅店蒸小米飯時做的夢。我的夢，是在槐樹朝南的樹枝下。"}],"hint":"「南柯」是槐樹朝南的樹枝，蟻窩就在那裡。","after":"淳于棼覺得人生的富貴就像一場夢，從此不再貪戀名利。","lesson":{"title":"成語小學堂．南柯一夢","text":"「柯」是樹枝。這個成語和「黃粱一夢」很像，都是唐朝小說，都說富貴像夢一樣短暫。現在常用來形容一場空歡喜。","next":"夢醒了，富貴就不見了。可是有一位漁夫，醒著的時候真的走進了一個神奇的村莊……"}},{"id":"e06_05","yr":"晉．陶淵明〈桃花源記〉","place":"武陵的桃花林","scene":"river","music":"map","cast":[["漁夫",-6.8,1.0],["村民",6.8,-0.4],["村民",7.4,0.6],["老爺爺",7.0,1.4]],"beats":[{"t":"這是東晉詩人陶淵明寫的故事。武陵有個漁夫，沿著溪水划船，划著划著，忘了走了多遠。","mv":[["漁夫",-0.8,0.8]]},{"t":"忽然，兩岸出現一大片桃花林，花瓣隨風飄落，美極了！溪水的盡頭有座山，山洞口好像有光。","fx":[["focus","漁夫"]]},{"who":"漁夫","t":"好奇怪！進去看看吧！","fx":[["upset","漁夫"]]},{"t":"走過窄窄的山洞，眼前突然一片開闊：田地平坦、房子整齊，大家過得快樂又自在。","mv":[["村民",1.0,-0.4],["村民#2",1.8,0.6],["老爺爺",0.8,1.0]],"fx":[["cheerAll","村民"],["focus",null]]},{"who":"老爺爺","t":"我們的祖先為了躲避秦朝的戰亂來到這裡，就再也沒出去過。外面現在是什麼朝代呀？","fx":[["say","老爺爺"]]},{"t":"漁夫出去以後，一路做了記號，帶人回來找。可是記號都不見了，再也找不到那條路。","mv":[["村民",7.5,-0.4],["村民#2",7.5,0.6],["老爺爺",7.5,1.4]],"fx":[["sad","漁夫"]]}],"q":"那個村莊風景優美、與外面的世界隔絕，大家過得安樂自在。現在如果去山裡旅行，發現一個開滿花、安靜又美麗的小村莊，可以用哪個成語形容？","wrong":[{"w":"車水馬龍","by":"老爺爺","line":"車水馬龍是車子馬匹來來往往，很熱鬧。我們這裡安安靜靜，連外面換了朝代都不知道呢！"},{"w":"人山人海","by":"村民","line":"人山人海是人多得不得了。我們的村子安靜得很，跟外面完全隔絕。"},{"w":"人間仙境","by":"漁夫","line":"人間仙境也是說很美的地方，意思接近！不過這個故事裡有一片桃花林，有專門的成語。"}],"hint":"這個地方在「世」界之「外」，入口是一片「桃」花林和溪水的「源」頭。","after":"後來也有人想去找那個村莊，可是一直都沒找到。","lesson":{"title":"成語小學堂．世外桃源","text":"〈桃花源記〉是陶淵明想像出來的理想世界，那裡沒有戰爭、沒有煩惱。陶淵明又叫陶潛，也寫了「採菊東籬下，悠然見南山」等有名的詩。現在用這個成語形容美好又安靜的地方。","next":"桃花源裡的人不知道外面變了。可是有兩位神仙，卻親眼看著大海變了好幾次……"}},{"id":"e06_06","yr":"晉．葛洪《神仙傳》","place":"神仙的聚會","scene":"south","music":"palace","cast":[["王方平",0.6,-0.4],["仙女麻姑",6.8,0.6],["仙童",2.2,-1.4]],"beats":[{"t":"這是《神仙傳》裡的傳說。神仙王方平請仙女麻姑來相會。","mv":[["仙女麻姑",1.8,0.6]],"fx":[["cheer","仙童"]]},{"who":"王方平","t":"麻姑，好久不見了！","fx":[["say","王方平"]]},{"who":"仙女麻姑","t":"自從上次見面以來，我已經看過東海三次變成種桑樹的田地了！","fx":[["say","仙女麻姑"],["focus","仙女麻姑"]]},{"who":"仙女麻姑","t":"剛才我經過蓬萊仙島，發現海水又比以前淺了一半。難道又要變成陸地了嗎？","fx":[["upset","仙女麻姑"]]},{"who":"王方平","t":"是啊，東海將來又會揚起塵土了。","fx":[["focus",null]]}],"q":"大海變成桑田，桑田又變回大海，神仙已經看過好幾次。現在爺爺說：「我小時候家門前是一大片稻田，現在全變成高樓大廈了！」這種感嘆世事變化很大的話，可以用哪個成語？","wrong":[{"w":"一成不變","by":"王方平","line":"一成不變是一點都沒有改變。東海都變了三次了，怎麼會不變呢？"},{"w":"海闊天空","by":"仙童","line":"海闊天空是像大海天空一樣寬廣，形容心胸開闊。這裡是說世界變化很大啦！"},{"w":"物換星移","by":"仙女麻姑","line":"物換星移是景物改變、星星移動，比喻時間過去、世事改變，意思接近！不過我說的是大海和桑田，有專門的成語。"}],"hint":"大海（滄海）變成了種桑樹的田（桑田）。","after":"神仙活得很久很久，才看得到大海變陸地這麼大的變化。","lesson":{"title":"成語小學堂．滄海桑田","text":"「滄海」是大海，「桑田」是種桑樹的田地。這是神仙的傳說，不過地球的海陸真的會變化：科學家在高山上也找到過古代海洋生物的化石呢！","next":"神仙看著大海變桑田。還有一位神祕老人，專門用紅線替人牽姻緣……"}},{"id":"e06_07","yr":"唐．李復言《定婚店》","place":"宋城的旅店門口","scene":"night","music":"night","cast":[["韋固",-6.8,1.0],["老人",0.8,-0.6]],"beats":[{"t":"這是唐朝小說裡的傳說。年輕人韋固住在宋城南邊的旅店，天還沒亮，就出門去辦事。","mv":[["韋固",-1.0,0.6]]},{"t":"斜斜的月亮還很亮。他看見一位老人靠著布袋，坐在臺階上，對著月光翻看一本書。","fx":[["focus","老人"]]},{"who":"韋固","t":"老伯伯，您看的是什麼書？我怎麼一個字都看不懂？","fx":[["upset","韋固"],["focus",null]]},{"who":"老人","t":"這不是人間的書，是天下人的婚姻簿。","fx":[["say","老人"]]},{"who":"韋固","t":"那您袋子裡裝的是什麼呢？"},{"who":"老人","t":"是紅繩子。用來繫住夫妻的腳，一繫上，不管離多遠都逃不掉。你的妻子現在才三歲呢！","fx":[["focus","老人"]]}],"q":"十四年後，韋固娶的妻子，正是老人說的那個女孩。後來大家把這位管姻緣的神仙，還有替人介紹對象的媒人，叫做什麼？","wrong":[{"w":"老當益壯","by":"韋固","line":"老當益壯是年紀大了還更有精神。我問的是這位管婚姻的神仙叫什麼！"},{"w":"白頭偕老","by":"老人","line":"白頭偕老是夫妻一起活到老，是祝福的話。我可是那個負責牽紅線的人喔！"},{"w":"穿針引線","by":"老人","line":"穿針引線是比喻從中牽線、幫忙撮合，意思很接近！不過題目問的是一位「人物」：月光下拿著紅繩的老神仙。"}],"hint":"老人是在「月」光「下」看書的。","after":"韋固這才相信，姻緣真的是早就註定好的。","lesson":{"title":"成語小學堂．月下老人","text":"現在大家常簡稱「月老」，台灣很多廟裡都拜月老，「千里姻緣一線牽」的紅線就是從這個傳說來的。媽媽介紹表姊認識表姊夫，媽媽就是他們的月下老人。","next":"月老用紅線牽起姻緣。還有一位歌女，用歌聲牽動了一整條街的人……"}},{"id":"e06_08","yr":"《列子．湯問》","place":"齊國雍門的旅店","scene":"house","music":"palace","cast":[["歌女韓娥",-6.8,1.0],["旅店主人",2.2,-0.4],["村民",6.8,0.4],["村民",7.4,1.4]],"beats":[{"t":"這段故事出自《列子》。歌女韓娥要往東到齊國，半路上糧食吃完了。","mv":[["歌女韓娥",-0.8,0.6]],"fx":[["sad","歌女韓娥"]]},{"t":"她經過齊國的雍門，就唱歌換飯吃。她走了以後，大家覺得歌聲還在屋梁間繞來繞去，三天都沒停。","mv":[["村民",1.0,0.6],["村民#2",1.6,1.4]],"fx":[["say","歌女韓娥"]]},{"who":"村民","t":"咦？她是不是還沒走？我還聽得到歌聲！","fx":[["upset","村民"]]},{"t":"後來她到一家旅店，旅店主人卻欺負她、罵她。","fx":[["upset","旅店主人"],["focus","旅店主人"]]},{"t":"韓娥傷心地拉長聲音哭唱，附近的老老小小聽了都難過得掉眼淚，三天吃不下飯。","fx":[["sadAll","村民"],["focus",null]]},{"t":"大家趕快追回韓娥，請她再唱一首。這次是歡樂的長歌，人人開心得拍手跳舞。","fx":[["cheerAll","村民"],["cheer","歌女韓娥"]]}],"q":"韓娥的歌聲在屋梁間繚繞，三天都沒停，大家忘也忘不了。現在小美在畢業典禮上獨唱，歌聲優美，大家聽完都久久難忘，可以用哪個成語稱讚？","wrong":[{"w":"震耳欲聾","by":"旅店主人","line":"震耳欲聾是聲音大得快把耳朵震聾了。韓娥的歌是美，不是吵！"},{"w":"五音不全","by":"村民","line":"五音不全是唱歌走音。韓娥唱得這麼好，大家三天都忘不了呢！"},{"w":"不絕於耳","by":"歌女韓娥","line":"不絕於耳是聲音一直傳進耳朵、不停止，有點接近。不過它不一定是稱讚好聽，我的故事有專門稱讚歌聲美妙的成語。"}],"hint":"唱完以後「餘」下的聲「音」，還「繞」著屋「梁」。","after":"直到今天，雍門一帶的人還很會唱歌、哭唱，據說就是學韓娥留下來的。","lesson":{"title":"成語小學堂．餘音繞梁","text":"「梁」是屋頂上的大橫木。《列子》是一本記載很多寓言和傳說的古書。這個成語用來稱讚歌聲或音樂優美、讓人久久難忘，也可以說「繞梁三日」。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第六島．神奇的古代傳說","eps":[6]},{"key":"i25","line":"island","name":"莊子的奇妙寓言","short":"莊子寓言島","era":"《莊子》","color":"#4FA88E","map":{"ground":"#9fc98a","river":"#4f9fd8"},"intro":{"lines":["歡迎來到成語寓言島的「莊子島」！","莊子名叫莊周，是戰國時代的思想家，大約和孟子生活在同一個時代。","他寫的《莊子》最會用好玩的寓言講道理：會嘆氣的河神、會變成大鳥的大魚，還有夢見自己變成蝴蝶的人。","這座島上有八個故事，每一個都藏著一句成語。準備好出發了嗎？"],"people":[["莊子","名叫莊周，戰國時代的思想家"],["庖丁","技術神奇的廚師"],["河伯","黃河的河神"],["梓慶","雕刻鐘架的木匠"]]},"stops":[{"id":"e25_01","yr":"《莊子．天道》","place":"齊國王宮","scene":"palace","music":"palace","cast":[["齊桓公",1.6,-0.8],["輪扁",-1.4,1.0],["侍衛",3.0,0.2]],"beats":[{"t":"齊桓公坐在堂上讀書，木匠輪扁在堂下削木頭、做車輪。"},{"t":"輪扁放下槌子和鑿子，走上前去。","mv":[["輪扁",-0.2,0.2]]},{"who":"輪扁","t":"請問大王，您讀的是什麼書？聖人還活著嗎？要是不在了，您讀的不過是古人留下的渣渣罷了！","fx":[["say","輪扁"]]},{"who":"齊桓公","t":"大膽！一個做車輪的也敢亂說？說得出道理就算了，說不出來就要處罰你！","fx":[["upset","齊桓公"]]},{"who":"輪扁","t":"就拿我削車輪來說吧：削得太慢，輪子鬆鬆的不牢固；削得太快，又太緊裝不進去。"},{"who":"輪扁","t":"要不快不慢，手上做的剛好配合心裡想的。這種訣竅嘴巴說不出來，連我兒子都教不會，所以我七十歲了還在做車輪。","fx":[["focus","輪扁"]]}],"q":"輪扁削車輪時，手上做的和心裡想的完全配合，做起來非常順手。這種技藝熟練的感覺，可以用哪個成語形容？","wrong":[{"w":"手忙腳亂","by":"輪扁","line":"手忙腳亂是慌慌張張。我削了幾十年車輪，穩得很呢！"},{"w":"心不在焉","by":"齊桓公","line":"心不在焉是心思不在這裡。輪扁說的是手和心完全配合，剛好相反！"},{"w":"熟能生巧","by":"輪扁","line":"熟能生巧是練習多了就變巧，意思很接近！不過我說的是「手上做到、心裡呼應」，有一個專門形容手和心配合的成語。"}],"hint":"原文說：「得之於手而應於心。」","after":"輪扁最後說：古人真正的訣竅，已經跟著古人一起走了，所以書上留下來的，只是古人的糟粕。","lesson":{"title":"成語小學堂．得心應手","text":"「得心應手」現在用來形容技術熟練、做事順手，例如：姊姊練了三年琴，現在彈起來得心應手。莊子想告訴我們：真正的本事要靠自己動手練，光讀書是學不來的。","next":"說到手藝高超，莊子還講過一位廚師的故事，他的刀用了十九年，還像新的一樣……"}},{"id":"e25_02","yr":"《莊子．養生主》","place":"文惠君的廚房","scene":"house","music":"palace","cast":[["文惠君",2.2,-0.2],["庖丁",-0.6,-0.6],["小廚童",-4.6,0.4]],"beats":[{"t":"庖丁是一位廚師。有一天，他替文惠君分解一頭牛。"},{"t":"他手一推、肩一靠、腳一踩，刀子劃過去唰唰作響，聲音像音樂一樣好聽，動作像在跳舞。","fx":[["say","庖丁"],["cheer","小廚童"]]},{"who":"文惠君","t":"哇，太厲害了！你的技術怎麼能好到這種程度？","mv":[["文惠君",1.0,-0.2]],"fx":[["upset","文惠君"]]},{"who":"庖丁","t":"我剛開始學的時候，眼睛裡看到的都是一整頭大牛，不知道從哪裡下手。"},{"who":"庖丁","t":"三年以後，我再也看不到一整頭牛了，只看到骨頭和骨頭之間的縫隙。"},{"who":"庖丁","t":"一般廚師一個月就要換一把刀。我這把刀用了十九年，切過幾千頭牛，還像剛磨好一樣鋒利！","fx":[["focus","庖丁"]]},{"who":"庖丁","t":"因為骨節之間有縫，刀刃卻很薄。用薄薄的刀子進到寬寬的縫裡，刀子轉來轉去，空間大得很！"}],"q":"庖丁的刀在骨頭縫隙之間轉動，空間還綽綽有餘。後來形容做事熟練輕鬆、能力足夠，叫做什麼？","wrong":[{"w":"大刀闊斧","by":"庖丁","line":"大刀闊斧是做事果斷、氣魄大。我可不是亂砍，是順著縫隙輕輕地切！"},{"w":"刀光劍影","by":"文惠君","line":"刀光劍影是打打殺殺的場面。庖丁在廚房裡工作，可不是在打仗！"},{"w":"目無全牛","by":"庖丁","line":"目無全牛也出自我的故事！它說的是看不到一整頭牛、技術純熟。可是題目說的是刀子在縫隙裡轉動還有空間喔！"}],"hint":"「刃」是刀口，「餘」是多出來的空間。","after":"文惠君說：「好啊！聽了庖丁的話，我學到了保養生命的道理。」","lesson":{"title":"成語小學堂．遊刃有餘","text":"這個故事出自《莊子．養生主》，也留下了「庖丁解牛」「目無全牛」等成語。現在說一個人做事輕鬆、能力足夠，就可以說他「遊刃有餘」。","next":"庖丁越練越厲害，卻很謙虛。可是黃河的河神，卻覺得自己是天下第一……"}},{"id":"e25_03","yr":"《莊子．秋水》","place":"黃河與北海","scene":"river","music":"map","cast":[["河伯",-1.6,-0.2],["北海若",2.4,-1.4,0,1,1]],"beats":[{"t":"秋天到了，大雨一直下，一百條河流的水都灌進了黃河。"},{"t":"河面變得好寬好寬，站在這邊，連對岸的是牛還是馬都看不清楚。"},{"who":"河伯","t":"哈哈！天下最美、最大的東西，全都在我這裡啦！","fx":[["cheer","河伯"]]},{"t":"河伯得意洋洋，順著河水一路往東走，來到了北海。","mv":[["河伯",0.4,-0.4]]},{"who":"河伯","t":"哇……往東看去，海水一望無際，根本看不到盡頭！","fx":[["upset","河伯"]]},{"t":"北海的海神「北海若」出現了。河伯抬起頭望著海神，長長地嘆了一口氣。","mv":[["北海若",2.0,-1.2]],"fx":[["sad","河伯"]]},{"who":"河伯","t":"唉！要不是來到您的家門口，我就要被懂道理的人笑話一輩子了。","fx":[["focus","河伯"]]}],"q":"河伯來到北海，才發現自己差得遠。他抬起頭望著海神，深深地感嘆。這個樣子變成了哪個成語？","wrong":[{"w":"得意洋洋","by":"北海若","line":"得意洋洋是開心又驕傲，那是河伯還沒看到大海以前的樣子！"},{"w":"望梅止渴","by":"河伯","line":"望梅止渴是想著梅子來解渴。我是看到大海嚇呆了，不是口渴啦！"},{"w":"自嘆不如","by":"北海若","line":"自嘆不如是覺得自己比不上別人，意思很接近！不過這個故事的成語，有「抬頭仰望」的動作喔。"}],"hint":"「望洋」是抬頭仰望的樣子，「興」是發出。","after":"北海若告訴河伯：不能跟井裡的青蛙談大海，因為牠被住的地方限制住了。","lesson":{"title":"成語小學堂．望洋興嘆","text":"「望洋」原本是抬頭仰望的樣子，不是「望著海洋」喔！現在「望洋興嘆」多用來比喻力量不夠，只能無可奈何，例如：這台電腦太貴了，我只能望洋興嘆。","next":"北海已經夠大了，可是在北方的大海裡，還住著一條大到不可思議的魚……"}},{"id":"e25_04","yr":"《莊子．逍遙遊》","place":"北冥大海","scene":"river","music":"final","cast":[["莊子",-0.4,-0.6],["蟬",6.8,0.4],["斑鳩",7.4,1.4]],"beats":[{"t":"莊子最喜歡講天馬行空的故事。他說：在北方的大海「北冥」，有一條大魚，名字叫做「鯤」。","fx":[["focus","莊子"]]},{"who":"莊子","t":"鯤有多大呢？大得不知道有幾千里長！"},{"t":"有一天，鯤變成了一隻大鳥，名字叫做「鵬」。鵬的背，也不知道有幾千里寬。"},{"t":"大鵬鳥奮力一飛，張開的翅膀，就像天邊垂下來的大片雲朵。","fx":[["burst","莊子","#7fc4e8"]]},{"who":"莊子","t":"牠拍打海水，激起三千里的浪花，乘著旋風飛上九萬里高空，往南方的大海飛去！","fx":[["say","莊子"]]},{"t":"樹上的蟬和小斑鳩看了，忍不住笑了起來。","mv":[["蟬",2.0,-0.6],["斑鳩",3.0,0.4]],"fx":[["cheer","蟬"]]},{"who":"斑鳩","t":"我們從地上飛到榆樹上就夠了，有時飛不上去，還掉回地上呢。牠飛那麼高、那麼遠，做什麼呀？"}],"q":"大鵬鳥一飛就是九萬里高，要飛往遙遠的南海。後來祝福別人前途遠大，常說哪個成語？","wrong":[{"w":"一落千丈","by":"斑鳩","line":"一落千丈是突然掉得很低——我們才常常掉回地上呢！大鵬可是越飛越高。"},{"w":"井底之蛙","by":"蟬","line":"井底之蛙是見識很少的人……咦，好像在說我們？可是題目要的是祝福別人前途遠大！"},{"w":"一飛沖天","by":"莊子","line":"一飛沖天是平常不出聲，一做就有驚人的表現，意思有點像！不過要祝福別人前途遠大，要用大鵬鳥一飛萬里的成語。"}],"hint":"「鵬」是大鵬鳥，「程」是路程。","after":"莊子說：小鳥不懂大鵬，就像小聰明比不上大智慧。眼界不同，看到的世界也不一樣。","lesson":{"title":"成語小學堂．鵬程萬里","text":"鯤和鵬都是莊子想像出來的神奇動物，這段故事出自《莊子》的第一篇〈逍遙遊〉。現在「鵬程萬里」常寫在畢業紀念冊上，祝福別人前途遠大、未來不可限量。","next":"同樣在〈逍遙遊〉裡，還有一個讓位的故事：堯帝想把整個天下，讓給一位隱士……"}},{"id":"e25_05","yr":"《莊子．逍遙遊》","place":"許由隱居的山林","scene":"south","music":"palace","cast":[["堯帝",6.8,0.6],["許由",-0.6,-0.6]],"beats":[{"t":"堯是古代傳說中賢明的君王。他聽說隱士許由很有德行，就親自去找他。","mv":[["堯帝",1.6,-0.2]]},{"who":"堯帝","t":"太陽和月亮都出來了，還點著小火把，不是多餘嗎？您就是太陽，我只是小火把。請您來治理天下吧！","fx":[["say","堯帝"]]},{"who":"許由","t":"您已經把天下治理得很好了。我再來接替您，難道是為了出名嗎？"},{"who":"許由","t":"小鳥在大森林裡做窩，只要一根樹枝；小田鼠到河邊喝水，喝飽肚子就夠了。天下對我沒有用啊！"},{"who":"許由","t":"就像祭祀的時候，廚師就算不做菜，主持祭祀的人也不會跨過祭器，跑去廚房替他做菜。","fx":[["focus","許由"]]},{"t":"許由的意思是：治理天下是堯的工作，他不想去做不屬於自己的事。","fx":[["sad","堯帝"]]}],"q":"許由說，主持祭祀的人不會跨過祭器去替廚師做菜。後來比喻超出自己的職責、去做別人的事，叫做什麼？","wrong":[{"w":"名列前茅","by":"許由","line":"名列前茅是成績排在前面。我連天下都不要了，哪在乎排名？"},{"w":"兩袖清風","by":"堯帝","line":"兩袖清風是當官很清廉。許由說的是不去做別人的事，不是在說錢喔！"},{"w":"喧賓奪主","by":"許由","line":"喧賓奪主是客人的聲音蓋過主人，有點接近！不過我說的是跑去做別人的工作，就像主祭的人跑去當廚師。"}],"hint":"「俎」是祭祀時放祭品的桌子，「庖」是廚師。","after":"許由不肯接受天下，繼續在山林裡過著簡單的隱居生活。","lesson":{"title":"成語小學堂．越俎代庖","text":"「越俎代庖」現在用在：不是自己負責的事，卻跑去插手。例如：收作業是小老師的工作，其他同學不要越俎代庖。「俎」念ㄗㄨˇ，「庖」念ㄆㄠˊ。","next":"堯向隱士請教，黃帝更厲害：他竟然向一個放馬的孩子請教怎麼治理天下……"}},{"id":"e25_06","yr":"《莊子．徐无鬼》","place":"襄城的野外","scene":"road","music":"map","cast":[["黃帝",6.8,0.4],["大臣",7.4,1.4],["大臣",7.8,-0.4],["牧馬童",-1.0,-1.0]],"beats":[{"t":"傳說中，黃帝要去具茨山拜訪一位叫「大隗」的高人，身邊還跟著六位隨從。","mv":[["黃帝",1.8,0.2],["大臣",2.8,1.0],["大臣#2",3.4,-0.4]]},{"t":"走到襄城的野外，七個人全都迷了路，連個問路的人都沒有。","fx":[["upset","黃帝"],["sadAll","大臣"]]},{"who":"黃帝","t":"咦？那裡有一個放馬的孩子，我們去問問看！","mv":[["黃帝",0.6,-0.4]]},{"who":"牧馬童","t":"具茨山嗎？我知道！大隗住在哪裡，我也知道。","fx":[["cheer","牧馬童"]]},{"who":"黃帝","t":"這孩子真不簡單！那我再請問你：該怎麼治理天下呢？"},{"who":"牧馬童","t":"治理天下，跟放馬有什麼不一樣呢？"},{"who":"牧馬童","t":"只要把會傷害馬群的那匹壞馬趕走，就好了呀！","fx":[["focus","牧馬童"]]}],"q":"放馬的孩子說，只要把傷害馬群的壞馬趕走就好。後來比喻危害團體的人，叫做什麼？","wrong":[{"w":"千軍萬馬","by":"牧馬童","line":"千軍萬馬是聲勢浩大的軍隊。我只是放幾匹馬而已啦！"},{"w":"老馬識途","by":"大臣","line":"老馬識途是有經驗的能帶路。我們確實迷路了，可是孩子說的是要趕走壞馬！"},{"w":"眾矢之的","by":"黃帝","line":"眾矢之的是大家一起攻擊的對象，有點接近！不過孩子說的，是那匹會傷害整群馬的壞馬。"}],"hint":"想想那匹會傷害「一整群」馬的壞馬。","after":"黃帝向孩子拜了兩拜，稱他為「天師」，才恭恭敬敬地離開。","lesson":{"title":"成語小學堂．害群之馬","text":"「害群之馬」現在用來比喻危害團體的人，例如：上課一直搗蛋，會變成班上的害群之馬。這是罵人的話，使用時要小心喔！","next":"黃帝向小孩子學習，莊子自己呢？有一天，他做了一個好奇妙的夢……"}},{"id":"e25_07","yr":"《莊子．齊物論》","place":"樹下","scene":"south","music":"palace","cast":[["莊子",0.4,-0.6],["學生",6.8,0.8]],"beats":[{"t":"有一天，莊子在樹下睡著了，做了一個奇妙的夢。","fx":[["sad","莊子"]]},{"t":"在夢裡，他變成了一隻蝴蝶，翩翩飛舞，活潑又自在。","fx":[["cheer","莊子"]]},{"who":"莊子","t":"好快樂呀！飛來飛去，我完全忘了自己是莊周。"},{"t":"忽然，莊子醒了過來。他摸摸自己——咦，還是那個莊周。","fx":[["upset","莊子"]]},{"who":"莊子","t":"到底是莊周夢見自己變成蝴蝶，還是蝴蝶夢見自己變成莊周呢？","fx":[["focus","莊子"]]},{"who":"學生","t":"老師，您夢裡的蝴蝶飛得那麼活潑，聽起來就像真的一樣！","mv":[["學生",2.0,0.2]]}],"q":"莊子夢裡的蝴蝶飛舞得活潑生動，就像活的一樣。後來形容畫作、雕刻生動逼真，用哪個成語？","wrong":[{"w":"花枝招展","by":"學生","line":"花枝招展是打扮得很漂亮。老師夢見的是蝴蝶在飛，不是在打扮啦！"},{"w":"如夢初醒","by":"莊子","line":"如夢初醒是好像剛從夢裡醒來，比喻忽然明白。我是醒了沒錯，可是題目要形容的是生動逼真！"},{"w":"活靈活現","by":"學生","line":"活靈活現也是形容生動逼真，意思很接近！不過形容莊子夢中蝴蝶活潑飛舞的，是另一個成語。"}],"hint":"前兩個字是疊字，形容蝴蝶活潑的樣子；後兩個字是「好像活的一樣」。","after":"莊子說：莊周和蝴蝶一定有分別，這就叫做「物化」——萬物會不斷地變化。","lesson":{"title":"成語小學堂．栩栩如生","text":"這就是有名的「莊周夢蝶」。「栩」念ㄒㄩˇ，不要念成ㄩˇ喔！現在「栩栩如生」常用來稱讚畫、雕像或文章描寫得生動逼真。","next":"說到逼真，莊子島上最後一位工匠，做出來的東西連看的人都嚇一跳……"}},{"id":"e25_08","yr":"《莊子．達生》","place":"魯國","scene":"palace","music":"final","cast":[["魯侯",6.8,0.2],["梓慶",-0.8,0.2],["路人",2.6,1.2],["路人",3.4,-0.2]],"beats":[{"t":"魯國有一位木匠叫梓慶，他削木頭做了一個掛鐘用的架子，叫做「鐻」。","fx":[["focus","梓慶"]]},{"t":"鐘架做好了，看到的人都嚇了一跳，覺得它精巧得好像是鬼神做出來的！","fx":[["upset","路人"],["upset","路人#2"]]},{"who":"魯侯","t":"梓慶，你是用什麼法術做出來的？","mv":[["魯侯",1.4,-0.4]]},{"who":"梓慶","t":"我只是個工匠，哪有什麼法術！不過，倒是有一個方法。"},{"who":"梓慶","t":"動手之前，我先齋戒、讓心安靜。三天後不想獎賞，五天後不管別人誇我還是罵我，七天後連自己的身體都忘了。"},{"who":"梓慶","t":"然後我走進山林，找一棵天生形狀最合適的樹。心裡看見了鐘架的樣子，才開始動手；不然就不做。","fx":[["focus","梓慶"]]}],"q":"梓慶做的鐘架精巧得像鬼神做出來的。後來形容技藝精巧，或大自然的景物非常奇妙，叫做什麼？","wrong":[{"w":"神出鬼沒","by":"路人","line":"神出鬼沒是一下出現、一下消失，讓人捉摸不定。鐘架明明好好地擺在這裡呀！"},{"w":"裝神弄鬼","by":"梓慶","line":"裝神弄鬼是故弄玄虛騙人。我說過了，我沒有用法術！"},{"w":"巧奪天工","by":"魯侯","line":"巧奪天工是人做的東西比天然的還精巧，意思很接近！不過這個故事說的是「看的人驚訝得以為是鬼神做的」。"}],"hint":"原文說「見者驚猶鬼神」：看到的人驚訝得以為是鬼神做的。","after":"梓慶說：用我專心的天性，去配合樹木的天性，這大概就是鐘架看起來像神做的原因吧！","lesson":{"title":"成語小學堂．鬼斧神工","text":"「鬼斧神工」現在常用來形容建築、雕刻非常精巧，或是大自然的景色很奇妙，例如：太魯閣峽谷的景色真是鬼斧神工。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第七島．莊子的奇妙寓言","eps":[25]},{"key":"i26","line":"island","name":"古書裡的聰明寓言","short":"聰明寓言","era":"《呂氏春秋》《淮南子》","color":"#C98A3D","map":{"ground":"#c8c27a","river":"#4f9fd8"},"intro":{"lines":["歡迎來到寓言島的「古書島」！這裡的故事，來自兩本很有名的古書。","《呂氏春秋》是戰國末年，秦國宰相呂不韋找了許多門客一起編寫的書。","《淮南子》是西漢時，淮南王劉安和他的門客一起寫成的書。","這兩本書都喜歡用小故事、小比喻講大道理，快來看看吧！"],"people":[["呂不韋","秦國宰相，召集門客編寫《呂氏春秋》"],["劉安","西漢的淮南王，主編《淮南子》"],["商湯","商朝的開國君王，以仁慈出名"]]},"stops":[{"id":"e26_01","yr":"《呂氏春秋．孝行覽．義賞》","place":"晉國軍帳","scene":"tent","music":"palace","table":true,"cast":[["晉文公",1.4,-0.4],["咎犯",-0.8,0.4],["雍季",6.8,0.8]],"beats":[{"t":"晉文公要在城濮和楚國打仗。楚國兵多，晉國兵少，他很煩惱。","fx":[["upset","晉文公"]]},{"who":"晉文公","t":"咎犯，楚軍人多，我們人少，該怎麼辦才好？"},{"who":"咎犯","t":"打仗的時候，不嫌詭計多。大王就用計騙騙他們吧！","fx":[["say","咎犯"]]},{"t":"晉文公又把咎犯的話告訴大臣雍季，問他的看法。","mv":[["雍季",0.4,1.0]]},{"who":"雍季","t":"把池塘的水舀乾了抓魚，怎麼會抓不到呢？可是到了明年，池塘裡就沒有魚了。","fx":[["focus","雍季"]]},{"who":"雍季","t":"燒掉草叢來打獵，也一定抓得到野獸，可是明年就沒有野獸了。騙人的辦法現在也許有用，以後就不靈了。"}],"q":"雍季說：把池塘的水舀乾來抓魚，明年就沒有魚了。後來比喻只顧眼前利益、不為將來打算，叫做什麼？","wrong":[{"w":"如魚得水","by":"咎犯","line":"如魚得水是遇到很合適的環境。池塘的水都舀乾了，魚哪還有水？"},{"w":"緣木求魚","by":"雍季","line":"緣木求魚是爬到樹上找魚，方法根本錯了。我說的是魚全被抓光，以後沒得抓！"},{"w":"殺雞取卵","by":"晉文公","line":"殺雞取卵也是為了眼前的好處，犧牲以後的利益，意思很接近！不過雍季打的比方是池塘抓魚，不是殺雞。"}],"hint":"「竭」是用盡，「澤」是池塘，「漁」是捕魚。","after":"晉文公用了咎犯的計謀，打敗了楚軍；可是回國論功行賞時，卻把雍季排在咎犯前面。","lesson":{"title":"成語小學堂．竭澤而漁","text":"晉文公說：「雍季的話，是百代的利益；咎犯的話，只是一時的需要。」現在「竭澤而漁」用來提醒我們做事要為將來著想，例如保護海洋，不能連小魚都一起捕光。","next":"只顧眼前不好；可是因為一點小問題就什麼都不做，也不對喔……"}},{"id":"e26_02","yr":"《呂氏春秋．孟秋紀．蕩兵》","place":"阿福的家","scene":"house","music":"map","cast":[["阿福",0.0,-0.4],["阿福妻",2.4,0.4],["小兒",1.6,1.4]],"beats":[{"t":"這個故事是根據《呂氏春秋》裡的一句話改編的。有個人叫阿福，吃飯總是狼吞虎嚥。"},{"who":"阿福","t":"咳咳咳！噎……噎住了！","fx":[["upset","阿福"]]},{"t":"阿福的妻子趕快幫他拍背，他好不容易才把飯吞下去。","mv":[["阿福妻",0.9,-0.2]]},{"who":"阿福","t":"吃飯太危險了！從今天起，我不吃飯了！你們也全都不准吃！","fx":[["upset","阿福"],["focus","阿福"]]},{"who":"小兒","t":"可是……不吃飯，肚子會餓扁的呀！","fx":[["sad","小兒"]]},{"t":"幾天以後，阿福餓得頭昏眼花，連路都走不動了。","fx":[["sad","阿福"]]}],"q":"阿福因為吃飯噎住一次，就再也不肯吃飯。後來比喻因為一點小問題，就把該做的事停掉，叫做什麼？","wrong":[{"w":"狼吞虎嚥","by":"阿福妻","line":"狼吞虎嚥是吃得又急又快——那是他噎住的原因，不是他後來不吃飯的樣子！"},{"w":"廢寢忘食","by":"小兒","line":"廢寢忘食是認真到忘了睡覺和吃飯。爸爸是怕噎住才不吃，可不是太認真！"},{"w":"因小失大","by":"阿福妻","line":"因小失大是為了小利益丟掉大利益，也有個「因」字，很容易搞混！不過這個故事說的是：怕噎住就乾脆不吃飯。"}],"hint":"「噎」是食物卡在喉嚨，「廢」是停止不做。","after":"家人勸阿福：「吃慢一點、小口一點就好了，怎麼能不吃飯呢？」","lesson":{"title":"成語小學堂．因噎廢食","text":"《呂氏春秋》原文說：有人吃東西噎死了，就想禁止天下人吃飯，這是很荒謬的。作者用這個比方說明，不能因為有人打仗亡國，就廢除所有軍隊。現在「因噎廢食」提醒我們：遇到問題要想辦法解決，而不是乾脆放棄。","next":"接下來，我們到《淮南子》的園子裡看看，一片小小的葉子會告訴我們什麼……"}},{"id":"e26_03","yr":"《淮南子．說山》","place":"淮南王的花園","scene":"south","music":"map","cast":[["淮南王",6.6,0.0],["門客",7.2,1.0],["門客",7.8,-0.6]],"beats":[{"t":"西漢的淮南王劉安，喜歡和門客一起讀書、討論學問。這一天，他們在園子裡散步。","mv":[["淮南王",0.8,-0.4],["門客",2.0,0.6],["門客#2",2.6,-0.8]]},{"who":"門客","t":"天氣還這麼熱，夏天好像永遠不會結束呢！"},{"t":"忽然，一片樹葉從樹上輕輕飄落下來。","fx":[["focus","淮南王"]]},{"who":"門客#2","t":"只是一片葉子嘛，有什麼好看的？"},{"who":"淮南王","t":"別小看它！嘗一小塊肉，就知道整鍋的味道；看見一片葉子落下，就知道一年快要過完了。","fx":[["say","淮南王"]]},{"who":"淮南王","t":"看見瓶子裡的水結冰，也能知道天下都變冷了。這就是從近處的小事，推想遠處的大事。"}],"q":"淮南王看見一片葉子落下，就知道秋天快要來了。後來比喻從細微的跡象推知事情的變化，叫做什麼？","wrong":[{"w":"落葉歸根","by":"門客","line":"落葉歸根是說人離家再久，最後還是想回故鄉。大王說的是從葉子看出季節變化！"},{"w":"秋高氣爽","by":"門客#2","line":"秋高氣爽是形容秋天天氣晴朗涼爽。可是題目問的是從小跡象推知大變化喔！"},{"w":"見微知著","by":"淮南王","line":"見微知著也是從細微的地方看出大變化，意思很接近！不過這個故事裡看的是一片落葉，有一個專屬的成語。"}],"hint":"看到一片樹葉飄落，就猜到了哪個季節？","after":"門客們抬頭一看，樹上的葉子果然開始轉黃了。秋天，真的要來了。","lesson":{"title":"成語小學堂．一葉知秋","text":"這句話出自《淮南子．說山》，原文是「見一葉落，而知歲之將暮」；這一站的散步情節是依原文改編的。現在「一葉知秋」用來形容觀察敏銳，能從小地方看出大變化。","next":"從小地方看出道理很聰明，可是有個人，卻做了一件超級不聰明的事……"}},{"id":"e26_04","yr":"《淮南子．說林》","place":"阿明的家","scene":"house","music":"map","cast":[["阿明",0.2,-0.4],["朋友",6.8,0.8]],"beats":[{"t":"這個故事是根據《淮南子》裡的一個比喻改編的。阿明買了一雙漂亮的新鞋子。"},{"who":"阿明","t":"嘿咻——咦？太小了，腳穿不進去！","fx":[["upset","阿明"]]},{"who":"阿明","t":"這雙鞋這麼漂亮，我才捨不得換呢！嗯……我有一個好主意！"},{"t":"阿明竟然拿起刀子，想把自己的腳削小一點，好塞進鞋子裡。","fx":[["focus","阿明"]]},{"who":"朋友","t":"住手！腳怎麼可以削呢？","mv":[["朋友",1.6,0.2]],"fx":[["upset","朋友"]]},{"who":"朋友","t":"鞋子不合腳，就換一雙大一點的鞋子呀！"}],"q":"阿明為了穿下太小的鞋子，竟然想把腳削小。後來比喻勉強遷就、不懂得變通，叫做什麼？","wrong":[{"w":"腳踏實地","by":"朋友","line":"腳踏實地是做事實在、一步一步來。阿明這樣亂來，一點都不實在！"},{"w":"量體裁衣","by":"朋友","line":"量體裁衣是依照身材做衣服，是懂得配合實際情況，跟阿明剛好相反喔！"},{"w":"刻舟求劍","by":"阿明","line":"刻舟求劍也是不懂變通，意思很接近！不過刻舟求劍是不知道情況已經改變；我是為了配合鞋子，硬要改變自己的腳。"}],"hint":"「足」是腳，「履」是鞋子，「適」是配合。","after":"阿明回到店裡，換了一雙大一號的鞋子，穿起來剛剛好！","lesson":{"title":"成語小學堂．削足適履","text":"《淮南子．說林》用這個比喻說明：為了照顧一樣東西，反而傷害了真正重要的東西，就像把腳削小去配合鞋子。現在「削足適履」用來比喻不顧實際情況、勉強配合，例如：硬照搬別人的讀書方法，卻不管適不適合自己。","next":"傷害自己已經很糟了，可是有時候，災禍還會連累到無辜的旁人……"}},{"id":"e26_05","yr":"《呂氏春秋．孝行覽．必己》","place":"宋國的池塘邊","scene":"south","music":"map","cast":[["桓司馬",-0.4,-0.2],["宋王",6.8,0.2,0,1,1],["宋兵",7.2,1.2,0,0,1],["宋兵",7.8,-0.6,0,0,1]],"beats":[{"t":"宋國有一位大官叫桓司馬，他有一顆非常珍貴的寶珠。","fx":[["focus","桓司馬"]]},{"t":"後來桓司馬犯了罪，帶著寶珠逃出國去了。","mv":[["桓司馬",-7.6,0.6]]},{"who":"宋王","t":"寶珠呢？快派人去問他，寶珠到底在哪裡！","mv":[["宋王",1.6,-0.4],["宋兵",2.6,0.8],["宋兵#2",3.0,-0.6]],"fx":[["upset","宋王"]]},{"who":"宋兵","t":"報告大王，桓司馬說，他把寶珠丟進池塘裡了！"},{"who":"宋王","t":"那就把池塘的水全部舀乾，一定要找到寶珠！","fx":[["say","宋王"]]},{"t":"士兵們把池水舀得一滴不剩，翻遍了池底，卻什麼也沒找到。","fx":[["sadAll","宋兵"]]},{"t":"可是池水沒了，池塘裡的魚兒也活不成了。牠們明明什麼壞事都沒做呀！"}],"q":"宋王為了找寶珠舀乾池水，結果池裡的魚無辜遭殃。後來比喻無緣無故被牽連而受害，叫做什麼？","wrong":[{"w":"年年有餘","by":"宋兵","line":"年年有餘是過年的吉祥話。池塘的魚都遭殃了，一點都不吉祥！"},{"w":"珠光寶氣","by":"宋王","line":"珠光寶氣是戴了很多珠寶、很華麗的樣子。我連一顆寶珠都沒找到！"},{"w":"無妄之災","by":"宋兵","line":"無妄之災是意外飛來的災禍，意思很接近！不過這個成語的主角，就是池塘裡的魚喔。"}],"hint":"「殃」是災禍，「及」是連累到。","after":"宋王最後還是沒有找到寶珠，卻白白讓一整池的魚遭了殃。","lesson":{"title":"成語小學堂．殃及池魚","text":"《呂氏春秋》用這個故事說明：禍和福常常會互相牽連。後來還有人說「城門失火，殃及池魚」——城門著火，大家到池塘取水救火，池水用乾了，魚也跟著遭殃。","next":"魚兒很無辜，可是商朝有一位大臣，更是因為勸告君王而遭殃……"}},{"id":"e26_06","yr":"《呂氏春秋．貴直論．過理》","place":"商朝王宮","scene":"palace","music":"night","cast":[["紂王",1.4,-0.8],["比干",6.8,0.6],["孔子",6.8,1.2,0,1,1],["商兵",3.0,-1.2],["商兵",-0.6,-1.4]],"beats":[{"t":"商朝最後一個君王是紂王。他只顧著吃喝玩樂，對百姓非常殘暴。","fx":[["focus","紂王"]]},{"who":"紂王","t":"酒堆成山、肉擺滿園子，大家繼續玩！","fx":[["cheer","紂王"]]},{"t":"大臣比干是紂王的叔叔，他一次又一次地勸紂王改過。","mv":[["比干",0.0,0.4]]},{"who":"比干","t":"大王，請您愛護百姓，不要再這樣下去了！","fx":[["say","比干"]]},{"who":"紂王","t":"誰敢再囉唆！","fx":[["upset","紂王"]]},{"t":"紂王不但不聽勸，反而害死了忠心的比干。","mv":[["比干",-7.6,0.6]],"fx":[["sadAll","商兵"]]},{"t":"幾百年後，孔子聽說了這件事，忍不住搖頭嘆氣。","mv":[["孔子",0.4,0.8]]},{"who":"孔子","t":"紂王的心如果有一個竅是通的，比干就不會死了。","fx":[["sad","孔子"]]}],"q":"孔子說：紂王的心要是有一個竅是通的，就不會害死比干。後來形容一個人一點都不懂、不明事理，叫做什麼？","wrong":[{"w":"七竅生煙","by":"紂王","line":"七竅生煙是氣得耳朵鼻子都冒煙！比干勸我時我是很氣啦，但孔子說的不是這個！"},{"w":"心花怒放","by":"孔子","line":"心花怒放是開心得不得了。害死忠臣，哪有什麼好開心的？"},{"w":"目不識丁","by":"孔子","line":"目不識丁是一個字都不認得，也是什麼都不懂，有點接近！不過這裡說的是心裡的竅不通，不明白道理。"}],"hint":"古人認為心上有孔洞，叫做「竅」；竅通了，才會明白道理。","after":"後來周武王起兵討伐紂王，商朝就滅亡了。","lesson":{"title":"成語小學堂．一竅不通","text":"古人認為心臟上有孔洞，叫做「竅」，竅通了人才聰明、明白事理。現在「一竅不通」常用來說對某件事完全不懂，例如：我對下圍棋一竅不通。","next":"紂王殘暴不仁，商朝的開國君王卻剛好相反，仁慈到連鳥兒都照顧……"}},{"id":"e26_07","yr":"《呂氏春秋．孟冬紀．異用》","place":"郊外的樹林","scene":"south","music":"map","cast":[["商湯",6.8,0.2],["大臣",7.4,1.2],["捕鳥人",-0.6,-0.8]],"beats":[{"t":"商朝的開國君王叫做湯。有一天，他在郊外看到有人在四面都張開了捕鳥的網。","mv":[["商湯",1.8,-0.2],["大臣",2.8,0.8]]},{"who":"捕鳥人","t":"從天上掉下來的、從地下冒出來的、從四面八方飛來的，全都進到我的網子裡吧！","fx":[["say","捕鳥人"]]},{"who":"商湯","t":"唉！這樣會把鳥兒全部抓光啊！只有殘暴的夏桀，才會做這種事吧。","fx":[["upset","商湯"]]},{"t":"商湯叫人把網子拆掉三面，只留下一面。","fx":[["focus","商湯"]]},{"who":"商湯","t":"你可以改成這樣禱告：想往左飛的就往左，想往右飛的就往右，想高的高、想低的低，只抓不聽話的那幾隻吧。"},{"t":"這件事傳開了，漢水南邊的國家都說：「商湯的仁德，連鳥獸都照顧到了！」","fx":[["cheer","大臣"]]}],"q":"商湯把捕鳥的網拆掉三面，只留一面，讓鳥兒有路可逃。後來比喻用寬大仁慈的態度對待人，叫做什麼？","wrong":[{"w":"天羅地網","by":"捕鳥人","line":"天羅地網是四面八方都布滿了網，一隻都逃不掉——那是我原本的做法呀！"},{"w":"一網打盡","by":"商湯","line":"一網打盡是全部抓光，正是我不想看到的事！"},{"w":"寬宏大量","by":"大臣","line":"寬宏大量是心胸寬大、能原諒別人，意思很接近！不過這個故事的成語，跟「網子」有關喔。"}],"hint":"四面的網，只留下了其中的一面。","after":"結果有四十個國家，都主動來歸順商湯。","lesson":{"title":"成語小學堂．網開一面","text":"原文是「收其三面，置其一面」，其實是只留下一面網；後來大家說成「網開一面」，意思變成「放一條生路」。現在常用在：老師這次網開一面，讓遲交的同學補交作業。","next":"商湯用對了方法，贏得人心。不過有些人想解決問題，卻用錯了方法……"}},{"id":"e26_08","yr":"《呂氏春秋．季春紀．盡數》","place":"廚房","scene":"house","music":"map","cast":[["小學徒",1.2,-0.2],["老師傅",6.8,0.8]],"beats":[{"t":"這個故事是根據《呂氏春秋》裡的一個比喻改編的。灶上的一大鍋水，正咕嘟咕嘟地滾著。","fx":[["prop","urn",0,-1.4]]},{"who":"小學徒","t":"糟糕！水滾得快要溢出來了！","fx":[["upset","小學徒"]]},{"who":"小學徒","t":"我把滾水舀起來，再倒回去，揚一揚，它就不滾了吧？"},{"t":"小學徒舀了一瓢又一瓢，可是灶裡的火還在燒，水反而越滾越厲害。","fx":[["sad","小學徒"]]},{"t":"老師傅走過來，什麼話也沒說，直接把灶裡的柴火抽了出來。","mv":[["老師傅",-0.4,-0.6]]},{"who":"老師傅","t":"你看，水馬上就不滾了。要從根本解決，就要把火拿掉！","fx":[["focus","老師傅"]]}],"q":"小學徒把滾水舀起來再倒回去，想讓水不滾，結果越滾越厲害。後來比喻方法不對、不能根本解決問題，叫做什麼？","wrong":[{"w":"水落石出","by":"小學徒","line":"水落石出是真相大白。我只想讓水不要滾，跟真相沒關係啦！"},{"w":"熱火朝天","by":"小學徒","line":"熱火朝天是形容場面熱烈。廚房是很熱沒錯，可是題目問的是方法不對喔！"},{"w":"釜底抽薪","by":"老師傅","line":"釜底抽薪是把鍋底的柴抽掉，從根本解決——那是我的做法！小學徒舀水的方法，剛好相反。"}],"hint":"「湯」在古文裡是熱水，「沸」是水滾的意思。","after":"小學徒點點頭：「原來只顧著舀水沒有用，要把火拿掉才行！」","lesson":{"title":"成語小學堂．揚湯止沸","text":"《呂氏春秋》原文說：「以湯止沸，沸愈不止，去其火則止矣。」作者用這個比喻說明，治病要找到根本原因。「揚湯止沸」和「釜底抽薪」意思相反，可以一起記。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第八島．古書裡的聰明寓言","eps":[26]},{"key":"i27","line":"island","name":"韓非子講道理","short":"韓非子","era":"《韓非子》","color":"#6E7BC4","map":{"ground":"#a9b88a","river":"#4f9fd8"},"intro":{"lines":["歡迎來到寓言島的「韓非子島」！","韓非是戰國末年韓國的公子。他說話有點口吃，卻非常會寫文章。","他寫的《韓非子》主張國家要用清楚的法律來治理，書裡還有好多精彩的寓言，像「守株待兔」「自相矛盾」都出自這本書。","秦王嬴政讀了他的文章，佩服得不得了。這座島上，就有八個韓非子講道理的故事！"],"people":[["韓非","戰國末年的思想家，法家的代表人物"],["扁鵲","戰國時代的名醫"],["孔子","春秋時代的大教育家"]]},"stops":[{"id":"e27_01","yr":"《韓非子．喻老》","place":"蔡國王宮","scene":"palace","music":"palace","cast":[["蔡桓公",1.4,-0.8],["扁鵲",6.8,0.8],["侍臣",3.0,0.4]],"beats":[{"t":"名醫扁鵲來見蔡桓公，站著看了他一會兒。","mv":[["扁鵲",-0.2,0.2]]},{"who":"扁鵲","t":"大王，您的皮膚紋理裡有小病，不快點治，恐怕會越來越嚴重。","fx":[["say","扁鵲"]]},{"who":"蔡桓公","t":"我才沒有病！哼，醫生就愛替沒病的人治病，好顯示自己的本事。","fx":[["upset","蔡桓公"]]},{"t":"過了十天，扁鵲說病到了肌膚；又過十天，說病到了腸胃。蔡桓公都不理他。"},{"t":"再過十天，扁鵲遠遠看到蔡桓公，轉身就走。蔡桓公派人去問原因。","mv":[["扁鵲",4.6,1.2]]},{"who":"扁鵲","t":"病在皮膚、肌肉、腸胃，都還有辦法治。現在病已經進到骨髓，我也沒辦法了。","fx":[["sad","扁鵲"]]},{"t":"五天後，蔡桓公全身疼痛，派人去找扁鵲，扁鵲卻已經逃到秦國去了。","mv":[["扁鵲",7.8,1.0]],"fx":[["upset","蔡桓公"]]}],"q":"蔡桓公明明生病了，卻一直說自己沒病，不肯讓扁鵲治療。後來比喻怕人批評、隱瞞自己的缺點，叫做什麼？","wrong":[{"w":"妙手回春","by":"扁鵲","line":"妙手回春是稱讚醫生醫術高明，能把病治好。可惜大王不讓我治啊！"},{"w":"對症下藥","by":"侍臣","line":"對症下藥是針對問題想辦法。大王連承認生病都不肯，哪來的對症下藥？"},{"w":"諱莫如深","by":"扁鵲","line":"諱莫如深是把事情隱瞞得緊緊的，也有個「諱」字，很像！不過這個成語特別說的是：有病卻不肯看醫生。"}],"hint":"「諱」是隱瞞，「忌」是害怕、避開。","after":"沒過多久，蔡桓公就因為這場病去世了。","lesson":{"title":"成語小學堂．諱疾忌醫","text":"韓非用這個故事說明：小問題要趁早處理，等到變成大問題就來不及了。現在「諱疾忌醫」也用來比喻不肯面對錯誤，例如：考卷寫錯了就要訂正，不要諱疾忌醫。","next":"不肯聽別人指出問題不好；可是故意挑別人的毛病，也不對喔……"}},{"id":"e27_02","yr":"《韓非子．大體》","place":"熱鬧的馬市","scene":"road","music":"map","cast":[["賣馬人",1.2,-0.6],["買馬人",6.8,0.6],["路人",-7.0,0.4]],"beats":[{"t":"這個故事是根據《韓非子》裡的一句話改編的。市場上，有人在賣一匹又高又壯的好馬。"},{"who":"賣馬人","t":"千里好馬喔！又高又壯，便宜賣囉！","fx":[["say","賣馬人"]]},{"t":"有個買馬人走過來。他不看馬跑得快不快，卻把馬毛一根一根吹開，仔細找毛病。","mv":[["買馬人",2.4,0.2]]},{"who":"買馬人","t":"哈！這裡的皮膚上有一個小斑點！還有，尾巴的毛不夠亮！","fx":[["upset","買馬人"]]},{"who":"賣馬人","t":"這……這些小地方，又不會影響牠跑步呀！","fx":[["sad","賣馬人"]]},{"t":"這時，另一位客人看中了這匹好馬，二話不說就把牠買走了。","mv":[["路人",0.0,-0.2]],"fx":[["cheer","路人"]]},{"who":"買馬人","t":"哎呀，我的好馬！","fx":[["sad","買馬人"]]}],"q":"買馬人故意吹開馬毛，找出一點點小毛病。後來比喻故意挑剔別人的小缺點，叫做什麼？","wrong":[{"w":"一毛不拔","by":"賣馬人","line":"一毛不拔是非常小氣。他不是捨不得花錢，是故意挑毛病啦！"},{"w":"汗馬功勞","by":"路人","line":"汗馬功勞是在戰場上立下大功。這裡是馬市，不是戰場！"},{"w":"求全責備","by":"賣馬人","line":"求全責備是要求別人十全十美，意思很接近！不過這個成語特別講「吹開毛來找小毛病」的動作。"}],"hint":"「疵」是小毛病。想想買馬人對馬毛做了什麼動作？","after":"買馬人挑了半天，最後什麼也沒買到，只能看著好馬被別人牽走。","lesson":{"title":"成語小學堂．吹毛求疵","text":"《韓非子．大體》說，懂得大道理的君王「不吹毛而求小疵」，不會吹開毛髮去找小毛病。現在「吹毛求疵」用來形容故意挑剔，例如：他對同學的作業吹毛求疵，連一個標點都要嫌。","next":"挑毛病讓人討厭；可是真心為你好的勸告，聽起來也常常不太舒服……"}},{"id":"e27_03","yr":"《韓非子．外儲說左上》","place":"秦朝皇宮","scene":"palace","music":"palace","cast":[["劉邦",0.8,-0.6],["樊噲",6.8,0.4],["張良",7.4,1.4],["漢兵",3.0,-1.4],["漢兵",-1.2,-1.6]],"beats":[{"t":"這句話的道理，《韓非子》裡就說過了：好藥吃起來苦，真心的勸告聽起來刺耳。我們來看一個例子。"},{"t":"秦朝末年，劉邦帶兵攻進秦朝的都城咸陽，走進了皇宮。","fx":[["cheerAll","漢兵"]]},{"who":"劉邦","t":"哇！滿屋子都是珍寶，宮殿又這麼漂亮。我要住在這裡！","fx":[["cheer","劉邦"]]},{"who":"樊噲","t":"沛公，這些奢侈的東西，就是秦朝滅亡的原因啊！請您趕快出宮。","mv":[["樊噲",2.2,0.2]]},{"who":"劉邦","t":"不要！我才剛進來呢。","fx":[["upset","劉邦"]]},{"who":"張良","t":"秦朝殘暴，您才能來到這裡。如果一進來就貪圖享樂，就跟秦王一樣了。好藥苦口卻能治病，真心話不好聽，卻對做事有幫助。","mv":[["張良",2.6,1.2]],"fx":[["focus","張良"]]}],"q":"張良勸劉邦：真心的勸告雖然聽起來不舒服，卻對人有幫助。這個道理可以用哪個成語說明？","wrong":[{"w":"甜言蜜語","by":"樊噲","line":"甜言蜜語是好聽卻不真誠的話。我和張良說的話，可一點都不甜！"},{"w":"耳熟能詳","by":"劉邦","line":"耳熟能詳是聽得多了，熟到能說出來。我可是第一次被人這樣勸！"},{"w":"良藥苦口","by":"張良","line":"良藥苦口也是在說這個道理，意思非常接近！不過它講的是藥；說到「勸告的話不好聽」，要用另一個成語。"}],"hint":"「忠」是真心，「逆」是不順。","after":"劉邦聽了勸告，把寶物和倉庫封好，帶著軍隊退回霸上。這段故事記在《史記．留侯世家》。","lesson":{"title":"成語小學堂．忠言逆耳","text":"《韓非子》說「良藥苦於口」「忠言拂於耳」，《史記》裡張良也說「忠言逆耳利於行」，意思都一樣。下次爸媽或老師提醒你時，聽起來雖然刺耳，說不定正是對你最好的話喔！","next":"聽人說話要聽內容，看人也不能只看外表。連孔子都曾經看走眼呢……"}},{"id":"e27_04","yr":"《韓非子．顯學》","place":"孔子的學堂","scene":"office","music":"palace","cast":[["孔子",0.6,-0.8],["澹臺子羽",6.8,0.4],["宰予",-7.0,0.6]],"beats":[{"t":"孔子有很多學生。其中一位叫澹臺子羽，長得相貌堂堂，一看就像個君子。","mv":[["澹臺子羽",2.2,0.2]]},{"who":"孔子","t":"這個年輕人看起來真有君子的樣子，將來一定很了不起！","fx":[["cheer","孔子"]]},{"t":"可是相處久了，孔子發現，子羽的行為比不上他的外表。","fx":[["sad","孔子"]]},{"t":"另一個學生宰予，說起話來文雅又動聽，孔子也很欣賞他。","mv":[["宰予",-0.8,0.4]]},{"who":"宰予","t":"老師，關於這個問題，學生是這樣認為的……","fx":[["say","宰予"]]},{"t":"可是相處以後，孔子發現宰予的智慧，比不上他的口才。"},{"who":"孔子","t":"唉！我憑外表選人，看錯了子羽；憑口才選人，又看錯了宰予。","fx":[["focus","孔子"]]}],"q":"孔子看子羽外表像君子，就認定他很優秀，結果看錯了。後來比喻只根據外表來判斷一個人，叫做什麼？","wrong":[{"w":"察言觀色","by":"宰予","line":"察言觀色是觀察別人的臉色來揣摩心意。老師的問題，是只看外表就下判斷！"},{"w":"相貌堂堂","by":"澹臺子羽","line":"相貌堂堂是誇我長得端正好看啦！可是題目問的是只看外表來判斷人。"},{"w":"以偏概全","by":"孔子","line":"以偏概全是用一小部分去推論全部，有點接近！不過這個成語專門說「只看外表」來判斷人。"}],"hint":"「貌」是外表，「取」是選擇、評價。","after":"韓非說：連孔子這麼有智慧的人，都會看錯人，所以看人一定要看他實際做的事。","lesson":{"title":"成語小學堂．以貌取人","text":"有趣的是，《史記》的說法剛好相反：子羽長得醜，孔子原本看輕他，後來才發現他品行很好。不管哪一種說法，道理都一樣：不能只看外表判斷一個人。","next":"看人不能只看外表，讀信也不能自己亂猜意思。有一封信，就被讀成了完全不同的意思……"}},{"id":"e27_05","yr":"《韓非子．外儲說左上》","place":"郢都與燕國","scene":"study","music":"night","cast":[["郢人",-1.0,-1.6],["書童",1.2,-0.6],["燕相",6.8,0.4,0,1,1],["燕王",7.4,-0.6,0,1,1]],"beats":[{"t":"楚國的都城叫做郢。有一個郢人，晚上在家寫信給燕國的宰相，可是燭火不夠亮。","fx":[["focus","郢人"]]},{"who":"郢人","t":"太暗了，舉燭！","mv":[["書童",0.0,-1.2]],"fx":[["say","郢人"]]},{"t":"他嘴裡說著「舉燭」，手上一不小心，也把「舉燭」兩個字寫進信裡了。"},{"t":"信送到了燕國。燕國宰相讀到「舉燭」，左想右想，想出了一番大道理。","mv":[["郢人",-7.6,-0.4],["書童",-7.8,0.6],["燕相",0.6,-0.6]]},{"who":"燕相","t":"舉燭，就是崇尚光明；崇尚光明，就是要選出賢能的人來做事！","fx":[["cheer","燕相"]]},{"who":"燕王","t":"好主意！就這麼辦！","mv":[["燕王",2.2,-0.2]],"fx":[["cheer","燕王"]]},{"t":"燕王照著做，國家果然治理得很好。可是，那根本不是寫信人的意思啊！"}],"q":"燕國宰相把信上寫錯的「舉燭」，自己解釋成一番大道理，完全不是寫信人的原意。後來比喻穿鑿附會、曲解原意，叫做什麼？","wrong":[{"w":"見賢思齊","by":"燕王","line":"見賢思齊是看到賢人就想向他學習。我們是任用了賢人沒錯，可是題目問的是把意思解釋錯了！"},{"w":"一字千金","by":"燕相","line":"一字千金是文章寫得非常好。那兩個字明明是寫錯的呀！"},{"w":"斷章取義","by":"書童","line":"斷章取義是只截取一小段話，不管原本的意思，很接近！不過這個故事是整封信被人照自己的想法亂解釋，有一個專門的成語。"}],"hint":"前兩個字說信是誰寫的，後兩個字說是誰解釋的；「說」是解釋。","after":"韓非說：「國家雖然治理好了，可是那不是信的原意。現在的讀書人，很多都像這樣。」","lesson":{"title":"成語小學堂．郢書燕說","text":"郢是楚國的都城，燕是北方的燕國。「說」在這裡念ㄕㄨㄛ，是解釋的意思。韓非用這個故事，笑那些讀古書時照自己的想法亂解釋的人。","next":"一個人寫錯字，就讓別人誤會了意思。韓非也提醒國君：很多事，一個人是做不成的……"}},{"id":"e27_06","yr":"《韓非子．功名》","place":"韓國朝廷","scene":"office","music":"palace","cast":[["韓非",-1.0,0.4],["國君",1.2,-1.0],["大臣",2.8,0.4],["大臣",3.4,-0.8]],"beats":[{"t":"這句話的道理出自《韓非子．功名》。想像一下，韓非正在向國君說明治國的道理。"},{"who":"韓非","t":"國君最怕的，就是下面沒有人回應、配合。","fx":[["say","韓非"]]},{"who":"國君","t":"為什麼呢？我是國君，下命令就好了呀！","fx":[["upset","國君"]]},{"who":"韓非","t":"請您只用一隻手拍拍看。拍得再快，有聲音嗎？"},{"t":"國君舉起一隻手，用力揮了好幾下，什麼聲音也沒有。","fx":[["focus","國君"]]},{"t":"大臣們兩隻手一起拍，「啪啪啪」，好響亮！","fx":[["cheerAll","大臣"]]},{"who":"韓非","t":"國君就像鼓槌，大臣就像鼓，互相配合，才能敲出響亮的聲音！","fx":[["focus","韓非"]]}],"q":"韓非說：只用一隻手拍，拍得再快也沒有聲音。後來比喻一個人力量單薄、難以成事，叫做什麼？","wrong":[{"w":"拍案叫絕","by":"大臣","line":"拍案叫絕是拍桌子大聲叫好。國君一隻手拍不出聲音，可不是在叫好！"},{"w":"一鳴驚人","by":"國君","line":"一鳴驚人是平時不出聲，一做就有驚人表現。我一隻手拍了半天，一點聲音都沒有！"},{"w":"獨木難支","by":"韓非","line":"獨木難支是一根木頭撐不起大房子，也是說一個人力量不夠，意思很接近！不過我打的比方是拍手喔。"}],"hint":"「掌」是手掌，「鳴」是發出聲音。","after":"韓非又說：右手畫圓、左手畫方，兩樣都畫不好。做事要同心配合，才能成功。","lesson":{"title":"成語小學堂．孤掌難鳴","text":"原文是「一手獨拍，雖疾無聲」，這一站的對話情節是依原文改編的。現在「孤掌難鳴」用來說一個人力量不夠、需要別人幫忙，例如：分組報告要大家合作，一個人孤掌難鳴。","next":"國家內部要團結，小國更要懂得待人有禮。有一個小國，就因為沒禮貌而陷入大危機……"}},{"id":"e27_07","yr":"《韓非子．十過》","place":"曹國","scene":"palace","music":"palace","cast":[["曹君",1.6,-0.8],["重耳",-1.0,0.0],["釐負羈",3.0,0.6],["晉兵",7.2,1.2,0,0,1],["晉兵",7.8,-0.4,0,0,1]],"beats":[{"t":"晉國公子重耳在外流亡，經過小小的曹國。曹君對他非常沒禮貌。"},{"who":"曹君","t":"聽說重耳的肋骨長得很奇怪，我要偷看一下！","fx":[["cheer","曹君"]]},{"t":"曹國大夫釐負羈覺得不妥，偷偷送了一壺飯菜給重耳，表示敬意。","mv":[["釐負羈",0.2,0.4]]},{"who":"釐負羈","t":"公子，請用飯。","fx":[["say","釐負羈"]]},{"t":"後來重耳回到晉國當上國君，就是晉文公。三年後，他帶兵攻打曹國。","mv":[["晉兵",2.4,1.0],["晉兵#2",3.0,-0.4]],"fx":[["upset","曹君"]]},{"who":"重耳","t":"傳令下去：不准侵犯釐負羈的家！","fx":[["focus","重耳"]]},{"t":"曹國百姓聽說了，七百多戶人家都躲到釐負羈家附近，保住了平安。","fx":[["sad","曹君"]]}],"q":"韓非說：小小的曹國夾在晉國和楚國兩個大國中間，國君的處境就像疊起來的蛋，隨時會倒下打破。這種非常危險的情勢，叫做什麼？","wrong":[{"w":"安如泰山","by":"釐負羈","line":"安如泰山是穩得像泰山一樣，剛好相反！曹國現在可是搖搖欲墜。"},{"w":"以卵擊石","by":"曹君","line":"以卵擊石是拿蛋去砸石頭，比喻不自量力。題目說的是蛋疊在一起，隨時會倒！"},{"w":"岌岌可危","by":"重耳","line":"岌岌可危也是形容非常危險，意思很接近！不過韓非用的比方是疊起來的蛋喔。"}],"hint":"「累」是堆疊，「卵」是蛋。","after":"韓非說：曹國是小國，處境本來就很危險，國君卻又對人無禮，這就是它後來滅亡的原因。","lesson":{"title":"成語小學堂．危如累卵","text":"這個故事出自《韓非子．十過》，韓非列出國君常犯的十種過錯，「國小無禮」就是其中一種。「累」念ㄌㄟˇ。現在「危如累卵」用來形容情勢非常危險。","next":"看不清自己的處境很危險。楚國的國君，也差點犯了同樣的錯……"}},{"id":"e27_08","yr":"《韓非子．喻老》","place":"楚國王宮","scene":"palace","music":"palace","cast":[["楚莊王",1.4,-0.8],["大臣莊子",6.8,0.6],["楚兵",3.0,-1.4],["楚兵",-1.0,-1.6]],"beats":[{"t":"楚莊王想要攻打南方的越國。"},{"who":"楚莊王","t":"越國政治混亂、兵力又弱，正是攻打它的好機會！","fx":[["cheer","楚莊王"],["cheerAll","楚兵"]]},{"t":"楚國有一位大臣也叫莊子（不是寫《莊子》的莊周喔），他站出來勸楚莊王。","mv":[["大臣莊子",0.0,0.4]]},{"who":"大臣莊子","t":"我擔心人的智慧就像眼睛：能看見一百步以外的東西，卻看不見自己的睫毛。","fx":[["focus","大臣莊子"]]},{"who":"大臣莊子","t":"大王的軍隊被秦國、晉國打敗，丟了幾百里土地，這是兵力弱；大盜莊蹻在國內作亂，官吏管不了，這是政治亂。"},{"who":"大臣莊子","t":"楚國又弱又亂，一點也不比越國好，卻想去攻打越國呀。","fx":[["say","大臣莊子"]]},{"who":"楚莊王","t":"原來，我只看見別人的問題，卻沒看見自己的！","fx":[["sad","楚莊王"]]}],"q":"眼睛看得見百步以外，卻看不見自己的睫毛。後來比喻只看得見別人的缺點，卻看不清自己，叫做什麼？","wrong":[{"w":"目不轉睛","by":"楚兵","line":"目不轉睛是眼睛一動也不動地專心看。大王是看不清自己，不是太專心啦！"},{"w":"目中無人","by":"楚莊王","line":"目中無人是驕傲、看不起別人。題目說的是看不見自己的問題！"},{"w":"當局者迷","by":"大臣莊子","line":"當局者迷是身在其中的人反而看不清，意思很接近！不過我打的比方是眼睛和睫毛喔。"}],"hint":"「睫」是睫毛。眼睛看不看得見自己的睫毛呢？","after":"楚莊王聽了，就打消了攻打越國的念頭。","lesson":{"title":"成語小學堂．目不見睫","text":"韓非說：「知之難，不在見人，在自見。」真正難的不是看清別人，而是看清自己。現在「目不見睫」提醒我們：批評別人之前，先看看自己。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第九島．韓非子講道理","eps":[27]},{"key":"i37","name":"莊子的智慧","short":"莊子寓言","era":"《莊子》","color":"#5E8C6A","map":{"ground":"#a3c98a","river":"#5aa8d8"},"intro":{"lines":["歡迎來到莊子寓言島！這裡的故事，都出自一本叫《莊子》的書。","莊子名叫莊周，是戰國時代宋國人，也是道家很重要的思想家。","他最會用寓言講道理：會說話的魚、變成蝴蝶的夢、飛上九萬里高空的大鵬鳥……","書裡也常請孔子、顏回這些名人「客串演出」，這些對話多半是莊子編的寓言，不一定真的發生過。","跟著莊子的故事走一圈，你會發現好多我們天天在用的成語！"],"people":[["莊子","戰國時代的思想家，最會說寓言"],["惠施","莊子的好朋友，最愛跟他辯論"],["顏回","孔子最好的學生，在書中常常出場"]]},"stops":[{"id":"e37_01","yr":"《莊子．天下》","place":"惠施的家","scene":"house","music":"map","cast":[["惠施",1.2,0.4],["莊子",-6.5,1.0],["書童",2.8,1.4]],"beats":[{"t":"惠施是莊子的好朋友，學問非常多方面。古時候的書寫在竹簡上，又重又占地方。","fx":[["prop","cart",3.2,-1.6,0],["prop","cart",1.2,-2.6,0]]},{"who":"惠施","t":"你看，我的書整整裝滿了五大車！","fx":[["cheer","惠施"]]},{"t":"莊子來找惠施聊天。惠施最愛講道理，常說些讓人聽不懂的怪話。","mv":[["莊子",-1.0,0.6]]},{"who":"惠施","t":"今天出發去越國，昨天就到了！連在一起的環，也解得開！","fx":[["say","惠施"]]},{"who":"書童","t":"今天出發，昨天就到？我的頭好暈……","fx":[["upset","書童"]]},{"who":"莊子","t":"你的書雖然多，道理卻有點雜亂，說的話也不太中肯喔！","fx":[["focus","莊子"]]}],"q":"惠施的書多到要用五輛車來裝。後來稱讚一個人讀書很多、學問廣博，叫做什麼？","wrong":[{"w":"力大無窮","by":"書童","line":"力大無窮是力氣大得不得了。搬五車竹簡確實要力氣，可是這裡稱讚的是學問！"},{"w":"車水馬龍","by":"惠施","line":"車水馬龍是車子馬匹來來往往，形容很熱鬧。我的車上裝的是書，不是在塞車！"},{"w":"博學多聞","by":"莊子","line":"博學多聞也是學問廣、知道得多，意思很接近！不過這個故事有「五輛車」的書，有一個專門的成語。"}],"hint":"古時候的書是竹簡，要用車來載。數數看，惠施有幾車書？","after":"莊子提醒大家：書讀得多很棒，但也要把道理想清楚、想通透才行。","lesson":{"title":"成語小學堂．學富五車","text":"原文說惠施「其書五車」。古代的書是一片片竹簡用繩子串起來，五車竹簡的字，其實可能比不上現在幾本厚書，但在當時已經非常驚人。現在說「學富五車」，是稱讚人學問淵博。","next":"有一天，孔子去拜訪老子，想向他請教人生的大道理……"}},{"id":"e37_02","yr":"《莊子．知北遊》","place":"老子的住處","scene":"south","music":"palace","cast":[["老子",1.4,0.4],["孔子",-6.5,1.2],["白馬",-7.5,-1.6,0,1]],"beats":[{"t":"在《莊子》的這個故事裡，孔子去拜訪年紀很大、很有智慧的老子。","mv":[["孔子",-1.0,0.6]]},{"who":"孔子","t":"今天剛好有空，想向您請教最高深的道理。","fx":[["say","孔子"]]},{"who":"老子","t":"人活在天地之間，你知道有多久嗎？","fx":[["focus","老子"]]},{"t":"這時候，一匹白色的小馬從牆縫外面飛快跑過。","mv":[["白馬",7.5,-1.6]],"fx":[["focus","白馬"]]},{"who":"孔子","t":"咦？才一眨眼，牠就不見了！","fx":[["upset","孔子"]]},{"who":"老子","t":"人的一生，就像這樣，忽然一下就過去了。小孩長大、大人變老，都很快啊。","fx":[["focus",null]]}],"q":"老子說：人活在世上，就像白色小馬從牆縫前一閃而過。後來比喻時間過得非常快，叫做什麼？","wrong":[{"w":"老馬識途","by":"老子","line":"老馬識途是老馬認得路，比喻有經驗的人能帶路。剛剛那匹可是一閃就不見的小白馬！"},{"w":"一馬當先","by":"孔子","line":"一馬當先是騎馬跑在最前面，比喻帶頭領先。老子說的是時間跑得飛快！"},{"w":"光陰似箭","by":"老子","line":"光陰似箭也是說時間過得很快，意思很接近！不過我用的比喻是白色小馬跑過縫隙。"}],"hint":"「駒」是小馬，「隙」是縫隙。","after":"孔子聽了，心裡想：時間這麼快，更要好好珍惜每一天。","lesson":{"title":"成語小學堂．白駒過隙","text":"原文寫作「白駒之過郤」，「郤」和「隙」相通，就是縫隙。現在常用「白駒過隙」感嘆時光飛逝，例如：一轉眼就要畢業了。這段孔子和老子的對話，是《莊子》裡的寓言。","next":"說到孔子，他最好的學生顏回，可是什麼都跟著老師學……"}},{"id":"e37_03","yr":"《莊子．田子方》","place":"魯國的大路上","scene":"road","music":"map","cast":[["孔子",-0.6,0.2],["顏回",-6.5,1.0]],"beats":[{"t":"顏回是孔子最喜歡的學生，他非常佩服老師，什麼事都想跟著老師學。","mv":[["顏回",-1.8,0.8]]},{"t":"老師慢慢走，顏回也慢慢走。","mv":[["孔子",0.6,0.0],["顏回",-0.6,0.6]]},{"who":"顏回","t":"老師慢慢走，我也慢慢走；老師說話，我也跟著說話。","fx":[["say","顏回"]]},{"t":"老師快步走，顏回也趕緊快步跟上。","mv":[["孔子",2.4,-0.4],["顏回",1.2,0.2]]},{"t":"可是，老師一下子飛奔起來，跑得無影無蹤！","mv":[["孔子",7.5,-1.2]]},{"who":"顏回","t":"老師跑得好快，我只能在後面瞪大眼睛……","fx":[["upset","顏回"],["focus","顏回"]]}],"q":"顏回說：老師慢慢走我也慢慢走，老師快步走我也快步走。後來形容事事跟著別人、模仿別人，叫做什麼？","wrong":[{"w":"健步如飛","by":"顏回","line":"健步如飛是走路又快又穩，像在飛。我要是健步如飛，就不會被老師甩在後面了！"},{"w":"半途而廢","by":"顏回","line":"半途而廢是事情做到一半就放棄。我可沒放棄，一直努力跟著老師呢！"},{"w":"人云亦云","by":"顏回","line":"人云亦云是別人說什麼就跟著說什麼，意思很接近！不過我是連走路、快步都跟著老師，有一個專門的成語。"}],"hint":"「步」是慢慢走，「趨」是快步走。","after":"顏回發現：只學老師的樣子，是追不上老師的。","lesson":{"title":"成語小學堂．亦步亦趨","text":"「亦」是「也」的意思：老師走一步，我也走一步；老師快走，我也快走。現在說「亦步亦趨」，常常帶點提醒：只會模仿別人，沒有自己的想法。這段對話也是《莊子》借孔子和顏回說的寓言。","next":"有個叫東郭子的人，跑來問了莊子一個很難的問題……"}},{"id":"e37_04","yr":"《莊子．知北遊》","place":"莊子的家","scene":"house","music":"map","cast":[["莊子",1.2,0.4],["東郭子",-6.5,1.0]],"beats":[{"t":"東郭子聽說莊子很懂「道」，也就是天地萬物的大道理，特地跑來問他。","mv":[["東郭子",-1.0,0.6]]},{"who":"東郭子","t":"請問，你們說的「道」，到底在哪裡？"},{"who":"莊子","t":"道啊，到處都有！在螞蟻身上，也在小草裡。","fx":[["say","莊子"]]},{"who":"東郭子","t":"怎麼越說越低下？","fx":[["upset","東郭子"]]},{"who":"莊子","t":"還在瓦片裡，甚至在便便裡！"},{"who":"東郭子","t":"啊？便便？","fx":[["upset","東郭子"],["focus","東郭子"]]},{"who":"莊子","t":"就像市場的官員檢查豬肥不肥，要往豬的小腿上按。越往下面按，越看得清楚。","fx":[["focus","莊子"]]}],"q":"莊子說：檢查豬肥不肥，越往豬腿下面按，就越看得清楚。這句話變成成語，後來也常用來比喻情況越來越糟。是哪個成語？","wrong":[{"w":"蒸蒸日上","by":"東郭子","line":"蒸蒸日上是一天比一天好。莊子說的是越往「下」按，而且這成語後來指越來越糟，剛好相反！"},{"w":"無所不在","by":"莊子","line":"我確實說「道」無所不在！可是題目問的是「越往下按越看得清楚」那句話喔。"},{"w":"江河日下","by":"莊子","line":"江河日下是江水一天天往下流，比喻情況越來越壞，意思很接近！不過豬腿越按越清楚的故事，是另一個成語。"}],"hint":"「每下」是每往下一點，「況」是更加明顯。","after":"東郭子這才明白：連最不起眼的東西裡都有道理，越往下看，越看得清楚。","lesson":{"title":"成語小學堂．每下愈況","text":"「每下愈況」原本是越往下越明顯，後來大家多用它比喻情況越來越壞。現在更常說「每況愈下」，例如：他不肯練習，成績每況愈下。","next":"莊子很欣賞一位窮得叮噹響、卻天天唱歌的讀書人——孔子的學生曾子……"}},{"id":"e37_05","yr":"《莊子．讓王》","place":"衛國的茅屋","scene":"cottage","music":"night","cast":[["曾子",0.6,0.0],["鄰居",6.5,1.2]],"beats":[{"t":"曾子住在衛國，家裡非常窮。破棉袍連外層的布都沒有，臉色浮腫，手腳都磨出了厚繭。","fx":[["sad","曾子"]]},{"t":"他已經三天沒有生火煮飯，十年沒做過一件新衣服了。"},{"who":"曾子","t":"要見客人了，先把帽子戴正……哎呀，帽帶斷了！","fx":[["upset","曾子"]]},{"t":"他拉一拉衣襟想整理衣服，破洞一扯開，手肘就露了出來；穿上鞋子，鞋跟也裂開了。","fx":[["focus","曾子"]]},{"t":"鄰居路過，替他擔心。","mv":[["鄰居",1.8,0.8]]},{"who":"鄰居","t":"你窮成這樣，日子怎麼過啊？","fx":[["sad","鄰居"]]},{"t":"曾子卻拖著破鞋，放聲唱起〈商頌〉，歌聲響亮得像敲鐘敲石。","fx":[["cheer","曾子"],["burst","曾子","#e8b84f"]]}],"q":"曾子的衣服破到一拉衣襟，手肘就露出來。後來也比喻錢不夠用、應付不過來，叫做什麼？","wrong":[{"w":"衣錦還鄉","by":"鄰居","line":"衣錦還鄉是穿著華麗的衣服風光回家鄉。曾子的衣服破得連手肘都露出來了！"},{"w":"豐衣足食","by":"曾子","line":"豐衣足食是穿得暖、吃得飽。我三天沒煮飯了，離豐衣足食還很遠呢！"},{"w":"衣衫襤褸","by":"鄰居","line":"衣衫襤褸是衣服破破爛爛，意思很接近！不過它不能比喻應付不來，「拉衣襟、露手肘」有一個專門的成語。"}],"hint":"「襟」是衣服前面的部分，「肘」是手肘，「見」在這裡讀作ㄒㄧㄢˋ。","after":"原文說曾子「天子不得臣，諸侯不得友」：皇帝請不動他當官，諸侯也沒辦法跟他做朋友，因為他根本不在乎富貴。","lesson":{"title":"成語小學堂．捉襟見肘","text":"原文是「捉衿而肘見」，「見」同「現」，讀ㄒㄧㄢˋ。現在常用來比喻錢或人手不夠，顧了這邊、顧不了那邊，例如：零用錢只剩一點，真是捉襟見肘。","next":"莊子又說了一個捕魚和抓兔子的故事……"}},{"id":"e37_06","yr":"《莊子．外物》","place":"河邊","scene":"river","music":"map","cast":[["漁夫",0.8,0.2],["獵人",-6.5,1.0],["莊子",6.5,1.4]],"beats":[{"t":"河邊有個漁夫，把竹子編的捕魚籠「筌」放進水裡。","fx":[["focus","漁夫"]]},{"who":"漁夫","t":"魚兒，快游進來！……抓到了！籠子先丟一邊，不管它了！","fx":[["cheer","漁夫"]]},{"t":"另一邊，有個獵人用繩套「蹄」來抓兔子。","mv":[["獵人",-1.0,0.6]]},{"who":"獵人","t":"抓到兔子囉！繩套嘛，就扔在草堆裡吧。","fx":[["cheer","獵人"]]},{"t":"莊子看見了，走過來說。","mv":[["莊子",2.4,1.0]]},{"who":"莊子","t":"說話也是這樣：話是用來表達心意的，懂了意思，就不必死記那些話了。","fx":[["focus","莊子"],["say","莊子"]]}],"q":"漁夫捕到魚，就把捕魚的竹籠忘在一邊。現在常比喻成功以後，就忘了曾經幫助自己的人或東西，叫做什麼？","wrong":[{"w":"緣木求魚","by":"漁夫","line":"緣木求魚是爬到樹上抓魚，方法完全錯了。我在河裡抓魚，方法可對了！"},{"w":"如魚得水","by":"漁夫","line":"如魚得水是找到很適合自己的環境。這裡說的是抓到魚以後，把竹籠忘了！"},{"w":"過河拆橋","by":"獵人","line":"過河拆橋是過了河就把橋拆掉，意思很接近！不過它是故意破壞；故事裡是抓到魚就「忘了」竹籠。"}],"hint":"「筌」是竹子編的捕魚籠。抓到魚以後，籠子怎麼了？","after":"莊子接著說：「我要到哪裡找一個懂了意思、忘了言語的人，和他好好聊聊呢？」","lesson":{"title":"成語小學堂．得魚忘筌","text":"莊子的原意是：懂了道理，就不必執著於文字和言語，並不是壞事。可是現在大家多用「得魚忘筌」批評人成功後忘恩，就像抓到魚就丟掉竹籠。同一段話還留下了「得意忘言」這個詞。","next":"還記得被老師甩在後面的顏回嗎？孔子後來對他說了一段話……"}},{"id":"e37_07","yr":"《莊子．田子方》","place":"孔子的學堂","scene":"office","music":"palace","cast":[["孔子",1.2,0.4],["顏回",-1.0,0.6]],"beats":[{"who":"顏回","t":"老師，您一跑起來，我怎麼追也追不上，只能在後面瞪著眼看。","fx":[["sad","顏回"]]},{"who":"孔子","t":"回啊，我一輩子和你天天在一起，","fx":[["focus","孔子"]]},{"who":"孔子","t":"卻像兩個人的手臂擦過，一下子又錯開了，真是可惜啊！","fx":[["sad","孔子"]]},{"who":"孔子","t":"你追的，是我已經過去的樣子。那就像跑到空蕩蕩的市集去找馬。","fx":[["say","孔子"]]},{"who":"顏回","t":"馬呢？都不見了……","fx":[["upset","顏回"]]},{"who":"孔子","t":"別擔心。舊的我雖然過去了，真正可貴的東西，還留在我身上。","fx":[["focus",null]]}],"q":"孔子說：我們天天在一起，卻像手臂擦過又錯開。後來比喻當面錯過好機會，叫做什麼？","wrong":[{"w":"手舞足蹈","by":"顏回","line":"手舞足蹈是高興得手腳亂動。老師說的是手臂擦過、錯開了，一點也不高興！"},{"w":"交頭接耳","by":"孔子","line":"交頭接耳是湊在一起小聲說話。我說的不是頭和耳朵，是手臂！"},{"w":"擦肩而過","by":"孔子","line":"擦肩而過也是錯過，意思很接近！不過我說的是手臂交錯，這是另一個比較古老的成語。"}],"hint":"「交臂」是兩個人的手臂碰在一起。","after":"孔子的意思是：別只追著老師的外表跑，要學到真正不變的道理。","lesson":{"title":"成語小學堂．失之交臂","text":"原文是孔子說的「吾終身與汝交一臂而失之」。現在「失之交臂」用來形容好機會就在眼前，卻沒抓住，例如：只差一分，就和冠軍失之交臂。這段話和「亦步亦趨」出自同一個故事。","next":"最後一個故事：一對師生在討論，什麼才是真正的「美」……"}},{"id":"e37_08","yr":"《莊子．齊物論》","place":"湖邊","scene":"river","music":"palace","cast":[["王倪",1.2,0.4],["齧缺",-1.0,0.6],["麗姬",2.6,-1.6,0,1,1]],"beats":[{"t":"齧缺跑來問老師王倪許多問題，王倪卻總是回答：「我哪裡知道呢？」","fx":[["upset","齧缺"]]},{"who":"王倪","t":"我反問你：人睡在潮濕的地方會腰痛，泥鰍會嗎？人住在樹上會發抖，猴子會嗎？","fx":[["say","王倪"]]},{"who":"齧缺","t":"這樣說來，誰住的地方才是對的呢？"},{"t":"王倪又說：毛嬙、麗姬，是人人都說的大美女。","mv":[["麗姬",2.0,-0.6]],"fx":[["focus","麗姬"]]},{"who":"王倪","t":"可是魚看見她們，就深深潛進水底；鳥看見她們，就高高飛走；鹿看見了，拔腿就跑！"},{"who":"齧缺","t":"咦？牠們怎麼都跑了？那到底誰知道什麼才是真正的美？","fx":[["upset","齧缺"],["focus",null]]}],"q":"王倪說，魚看見美女就沉入水底、鳥看見就飛走。後人把這段話換個角度用，形容女子容貌非常美麗，叫做什麼？","wrong":[{"w":"魚目混珠","by":"齧缺","line":"魚目混珠是拿魚眼睛冒充珍珠，比喻以假亂真。這裡說的是魚看到美人的反應喔！"},{"w":"雞飛狗跳","by":"齧缺","line":"雞飛狗跳是亂成一團。故事裡跑掉的是魚、鳥和鹿，而且題目要的是稱讚美麗！"},{"w":"閉月羞花","by":"王倪","line":"閉月羞花也是形容女子很美，意思很接近！不過它說的是月亮和花，我說的是魚和鳥。"}],"hint":"想想看：魚往哪裡去？天上的雁又怎麼了？","after":"王倪的意思是：人、魚、鳥、鹿眼中的美都不一樣，誰也不能說自己的標準才是對的。","lesson":{"title":"成語小學堂．沉魚落雁","text":"莊子的原意是魚鳥看見人會害怕逃走；後人才說成魚和雁被美貌迷住，忘了游、忘了飛，還和西施、王昭君的傳說連在一起。原文其實是「鳥見之高飛」，「落雁」是後人改的說法。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第十島．莊子的智慧","eps":[37]},{"key":"i47","name":"寓言大道理","short":"寓言古書","era":"《韓非子》《呂氏春秋》《淮南子》","color":"#B0703A","map":{"ground":"#c2c482","river":"#4f9fd8"},"intro":{"lines":["歡迎來到寓言大道理島！這座島上的故事，來自三本古書。","《韓非子》是戰國末年的韓非寫的。他說話結巴，文章卻寫得極好，連秦始皇讀了都很佩服。","《呂氏春秋》是秦國宰相呂不韋，請一大群門客一起編的；《淮南子》則是西漢淮南王劉安和門客編的。","這些書愛用小故事、俗語和歷史事件來講治國和做人的道理。","準備好了嗎？一起去聽聽古人藏在故事裡的大道理！"],"people":[["韓非","戰國末年法家思想家，寫了《韓非子》"],["呂不韋","秦國宰相，帶門客編《呂氏春秋》"],["劉安","西漢淮南王，帶門客編《淮南子》"]]},"stops":[{"id":"e47_01","yr":"《韓非子．五蠹》","place":"韓國的宮廷","scene":"palace","music":"palace","cast":[["韓非",-1.0,0.6],["舞女",6.5,0.2],["商人",-6.5,1.6]],"beats":[{"t":"韓非是戰國末年韓國的公子。他看到韓國又小又弱，寫了很多文章討論怎麼讓國家強大。"},{"who":"韓非","t":"民間有一句俗話，說得很有道理。","fx":[["say","韓非"]]},{"t":"一位舞者甩著長長的袖子跳舞，袖子飄呀飄，看起來特別好看。","mv":[["舞女",1.6,0.0]],"fx":[["cheer","舞女"]]},{"t":"一位商人帶著滿滿的本錢做生意，買賣也特別容易成功。","mv":[["商人",-0.2,1.6]],"fx":[["cheer","商人"]]},{"who":"韓非","t":"國家也一樣：秦國強大，計謀改十次也很少失敗；燕國弱小，改一次也很難成功。","fx":[["focus","韓非"]]},{"who":"韓非","t":"所以要先把國內治理好，有了好條件，對外的計畫才好辦！"}],"q":"韓非引用俗話：袖子長的人跳舞好看，錢多的人好做生意。後來也形容一個人很有財勢、手腕靈活，善於應付各種場面，叫做什麼？","wrong":[{"w":"手忙腳亂","by":"舞女","line":"手忙腳亂是慌張得不知道怎麼辦。我的袖子長，跳起舞來可是從容又好看！"},{"w":"一毛不拔","by":"商人","line":"一毛不拔是小氣得一根毛都不肯拔。俗話說的是本錢多好做生意，不是小氣！"},{"w":"八面玲瓏","by":"韓非","line":"八面玲瓏是待人處事很圓滑，意思有點接近！不過俗話的重點是「條件好就容易成功」，說的是長袖子跳舞。"}],"hint":"俗話的前半句說的是：袖子長，就很會跳舞。","after":"韓非的意思是：國家強大、條件好，做事就容易成功；國家弱小，再多計謀也難成功。","lesson":{"title":"成語小學堂．長袖善舞","text":"原句是「長袖善舞，多錢善賈」，「賈」讀ㄍㄨˇ，是做生意。原本是說有好條件，事情就容易成功；現在多形容有財勢、手腕靈活、很會交際的人，有時帶點貶義。","next":"《韓非子》裡還提到「汗馬之勞」。後來，漢朝開國時有一場關於功勞的大爭論……"}},{"id":"e47_02","yr":"《韓非子．五蠹》、《史記》","place":"漢朝宮廷","scene":"palace","music":"palace","cast":[["漢高祖",1.4,0.4],["蕭何",2.8,1.4],["將軍",-6.5,0.6],["將軍",-7.2,1.6]],"beats":[{"t":"劉邦打敗項羽，建立漢朝，就是漢高祖。他要論功行賞，把第一大功給了丞相蕭何。","fx":[["focus","漢高祖"]]},{"who":"漢高祖","t":"蕭何的功勞最大，封地也最多！","fx":[["cheer","蕭何"]]},{"t":"將軍們很不服氣，紛紛走上前來。","mv":[["將軍",-1.0,0.4],["將軍#2",-0.6,1.4]],"fx":[["upset","將軍"]]},{"who":"將軍","t":"我們穿盔甲、拿兵器，多的打過一百多仗！蕭何從沒騎馬流汗上戰場，只是動動筆、說說話！","fx":[["upset","將軍#2"]]},{"who":"漢高祖","t":"你們打過獵嗎？追兔子的是獵狗，發現兔子在哪、指揮方向的是獵人。","fx":[["say","漢高祖"]]},{"who":"漢高祖","t":"你們像是追到獵物的獵狗，蕭何卻是指揮的獵人啊！","fx":[["focus",null]]}],"q":"將軍們說：自己騎著戰馬，跑得滿身是汗，才在戰場上立下功勞。後來泛指辛辛苦苦做出的貢獻，叫做什麼？","wrong":[{"w":"馬馬虎虎","by":"將軍","line":"馬馬虎虎是隨便、不認真。我們打仗可是拚了命，一點也不馬虎！"},{"w":"不勞而獲","by":"將軍#2","line":"不勞而獲是沒付出就得到好處。我們嫌蕭何不勞而獲，可是陛下說他其實付出很多！"},{"w":"豐功偉業","by":"蕭何","line":"豐功偉業是偉大的功績，意思有點接近！不過將軍們強調的是騎馬流汗、辛苦打仗。"}],"hint":"戰馬跑得滿身大汗，換來的是什麼？","after":"將軍們聽懂了比喻，再也不敢多說。蕭何管理後方、送糧送兵，確實是漢朝建立的大功臣。","lesson":{"title":"成語小學堂．汗馬功勞","text":"《韓非子．五蠹》說百姓要「汗馬之勞」上戰場打仗；《史記》記載將軍們說蕭何「未嘗有汗馬之勞」。原指戰功，現在泛指辛勤工作做出的貢獻，例如：她為球隊立下汗馬功勞。","next":"《韓非子》裡還有一句關於「藥」的名言，國王也得好好學一學……"}},{"id":"e47_03","yr":"《韓非子．外儲說左上》","place":"王宮寢殿","scene":"palace","music":"palace","cast":[["國王",1.4,0.4],["老大臣",-1.0,0.6],["御醫",-6.5,1.4]],"beats":[{"t":"這是依照《韓非子》裡的道理改編的小故事：從前有位國王生病了。","fx":[["sad","國王"]]},{"t":"御醫端來一碗黑黑的藥。","mv":[["御醫",0.2,1.2]]},{"who":"國王","t":"好苦！我不喝！","fx":[["upset","國王"]]},{"who":"老大臣","t":"大王，藥雖然苦，喝下去卻能把病治好呀！","fx":[["say","老大臣"]]},{"t":"國王捏著鼻子喝了藥，病果然好了。","mv":[["御醫",6.5,1.4]],"fx":[["cheer","國王"]]},{"t":"過了幾天，老大臣又來了。"},{"who":"老大臣","t":"大王最近太愛玩，都不處理國事了！","fx":[["upset","國王"],["focus","國王"]]}],"q":"國王想起那碗藥：好藥雖然苦，卻能治病；真心的勸告雖然不好聽，卻對自己有益。這個道理可以用哪個成語形容？","wrong":[{"w":"甜言蜜語","by":"國王","line":"甜言蜜語是好聽卻不一定真心的話。老大臣說的話一點也不甜，卻是真心為我好！"},{"w":"口是心非","by":"老大臣","line":"口是心非是嘴上說一套、心裡想一套。我說的話雖然難聽，可是句句真心！"},{"w":"忠言逆耳","by":"老大臣","line":"忠言逆耳是真心的話不好聽，意思很接近！不過國王想到的是那碗苦苦的藥，有一個專門的成語。"}],"hint":"好的藥，喝在嘴巴裡是什麼味道？","after":"國王明白了：忠言就像良藥，於是改掉了貪玩的壞習慣。","lesson":{"title":"成語小學堂．良藥苦口","text":"《韓非子》原文說：「良藥苦於口……忠言拂於耳。」聰明人知道苦藥能治病，所以願意喝；英明的君主知道忠言能成事，所以願意聽。這個國王的故事是依照原文道理改編的。","next":"接下來是《呂氏春秋》。海邊有個年輕漁夫，正為一張漁網傷腦筋……"}},{"id":"e47_04","yr":"《呂氏春秋．用民》","place":"海邊漁村","scene":"river","music":"map","cast":[["年輕漁夫",-0.6,0.4],["老漁夫",6.5,1.2]],"beats":[{"t":"這是依照《呂氏春秋》裡的比喻畫成的故事。年輕漁夫想把漁網撒開，一個一個網眼慢慢拉。","fx":[["focus","年輕漁夫"]]},{"who":"年輕漁夫","t":"怎麼拉都打結，網子亂成一團了！","fx":[["upset","年輕漁夫"]]},{"t":"老漁夫笑著走過來。","mv":[["老漁夫",1.2,0.6]]},{"who":"老漁夫","t":"別一個一個拉，抓住網上那條大繩子，往上一提就好！","fx":[["say","老漁夫"]]},{"t":"大繩一提起來，成千上萬的網眼全都張開了，還網到好多魚！","fx":[["cheer","年輕漁夫"],["burst","年輕漁夫","#5ab0e0"]]},{"who":"年輕漁夫","t":"真的耶！原來要抓住最重要的那條繩子！","fx":[["focus",null]]}],"q":"老漁夫說：只要提起漁網的大繩，所有網眼就都張開了。後來比喻做事抓住重點，其他細節就跟著解決，叫做什麼？","wrong":[{"w":"一網打盡","by":"年輕漁夫","line":"一網打盡是把東西全部抓光。我們說的是怎麼讓網子張開的方法！"},{"w":"漏網之魚","by":"老漁夫","line":"漏網之魚是從網子溜走的魚，比喻逃掉的人。我教的是提網的訣竅！"},{"w":"提綱挈領","by":"老漁夫","line":"提綱挈領是抓住重點、說出要領，意思很接近！不過這個成語特別說「大繩一提，網眼全開」，強調抓住重點，其他就跟著張開。"}],"hint":"「綱」是漁網上的大繩子，「目」是網眼。","after":"《呂氏春秋》說：管理百姓也要抓住「綱」，也就是人人都想要獎賞、討厭處罰，賞罰分明，大家就願意出力。","lesson":{"title":"成語小學堂．綱舉目張","text":"原文是「壹引其綱，萬目皆張」。現在常用「綱舉目張」形容做事抓住關鍵，條理就清楚了，例如：先列好大綱，寫作文就綱舉目張。","next":"《呂氏春秋》裡還記了一個齊王的真實故事：他捨不得一點金子……"}},{"id":"e47_05","yr":"《呂氏春秋．權勳》","place":"齊國的軍營","scene":"walls","music":"battle","cast":[["達子",-1.0,0.6],["齊王",1.6,-0.8],["使者",6.5,1.4],["燕兵",7.0,-0.6],["燕兵",7.6,0.6],["燕兵",6.8,1.8]],"beats":[{"t":"戰國時代，燕國大將樂毅帶著五個國家的軍隊攻打齊國。齊軍打了敗仗，剩下的士兵都很灰心。","fx":[["sad","達子"]]},{"t":"將軍達子收拾殘兵，想再打一仗，可是沒有東西可以獎賞士兵。他派使者去見齊王。","mv":[["使者",0.4,0.2]]},{"who":"使者","t":"大王，請拿些金子賞給士兵，鼓舞士氣吧！","fx":[["say","使者"]]},{"who":"齊王","t":"打敗仗的傢伙，還想要金子？一塊也不給！","fx":[["upset","齊王"]]},{"t":"士兵們沒了鬥志，和燕軍一打就大敗。達子戰死，齊王逃到莒城。","mv":[["燕兵",1.0,-0.4],["燕兵#2",2.0,0.6],["燕兵#3",0.6,1.6],["齊王",7.5,-1.6]],"fx":[["sad","達子"]]},{"t":"燕軍衝進齊國的首都，在寶庫裡搶走了好多好多金子。","fx":[["cheerAll","燕兵"],["focus",null]]}],"q":"齊王捨不得拿一點金子賞士兵，結果打了敗仗，寶庫裡大量的金子反而全被燕軍搶走。這叫做什麼？","wrong":[{"w":"一本萬利","by":"燕兵","line":"一本萬利是本錢小、賺很多。齊王可是什麼都沒賺到，還賠光了！"},{"w":"拾金不昧","by":"使者","line":"拾金不昧是撿到錢不占為己有。燕軍可是把金子全搶走了！"},{"w":"得不償失","by":"使者","line":"得不償失是得到的比不上失去的，意思很接近！不過故事強調齊王「貪」著一點點金子，結果失去更大的利益。"}],"hint":"因為貪圖小的，結果失去了什麼？","after":"《呂氏春秋》評論說：這就是貪圖小利，反而失去大利的人啊！","lesson":{"title":"成語小學堂．貪小失大","text":"這場戰爭發生在西元前 284 年，齊國差點亡國，後來靠田單用火牛陣才把燕軍打退。「貪小失大」提醒我們：別為了眼前的小便宜，丟掉更重要的東西。","next":"《呂氏春秋》還說了另一個道理：什麼才是國家的「根本」？"}},{"id":"e47_06","yr":"《呂氏春秋．上農》","place":"古代的農村","scene":"south","music":"map","cast":[["聖王",1.4,0.2],["農夫",-1.0,0.6],["農夫",0.4,1.4]],"beats":[{"t":"這是依照《呂氏春秋》的道理改編的故事。古代的聖王教百姓：先把田種好，最重要！","fx":[["say","聖王"]]},{"who":"聖王","t":"種田是國家的根本。大家安心種田，邊境就安定。"},{"t":"可是，有個農夫丟下鋤頭，跑去做取巧的小生意。","mv":[["農夫#2",3.4,1.6]]},{"who":"農夫#2","t":"種田好辛苦，做這個賺錢比較快！","fx":[["cheer","農夫#2"]]},{"t":"越來越多人這樣做，田地都荒廢了。敵人一來，大家只想帶著錢逃走。","fx":[["sadAll","農夫"]]},{"who":"農夫#2","t":"快搬家吧，這裡別守了！","mv":[["農夫#2",7.5,1.6]],"fx":[["focus","聖王"],["upset","聖王"]]}],"q":"小美為了準備考試，花一整晚裝飾筆記本、挑螢光筆顏色，課本卻一頁都沒讀。這就像丟下田地、去追逐小生意，叫做什麼？","wrong":[{"w":"安居樂業","by":"農夫","line":"安居樂業是安穩地生活、快樂地工作。丟下田地四處跑，哪裡安居樂業了？"},{"w":"開源節流","by":"聖王","line":"開源節流是增加收入、節省開支。小美把時間花在裝飾上，可沒有節省！"},{"w":"本末倒置","by":"聖王","line":"本末倒置是把重要和不重要的順序弄反，意思很接近！不過這個故事是乾脆「丟掉」根本，去「追」末節。"}],"hint":"「本」是樹根，「末」是樹梢；一個丟掉，一個去追。","after":"《呂氏春秋》說：百姓丟下根本、去做末節的事，就不聽命令，不能守城，也不能打仗，國家就危險了。","lesson":{"title":"成語小學堂．捨本逐末","text":"古人把農業看成「本」，工商看成「末」，這是古代的想法；今天各行各業都很重要。現在「捨本逐末」是指做事不抓重點，輕重顛倒，就像只顧裝飾筆記卻不讀書。","next":"接下來是《淮南子》。越王句踐打敗吳國後，有個大功臣卻悄悄坐船走了……"}},{"id":"e47_07","yr":"《淮南子．說林》、《史記》","place":"越國江邊","scene":"river","music":"night","cast":[["范蠡",-1.0,0.6],["文種",1.4,0.6],["越王",6.5,0.0]],"beats":[{"t":"范蠡和文種幫越王句踐忍辱多年，終於打敗了吳國。","mv":[["越王",2.8,-0.4]],"fx":[["cheer","越王"]]},{"who":"越王","t":"我們贏了！吳國滅亡了！"},{"t":"范蠡卻覺得：越王這個人，只能一起吃苦，不能一起享福。","mv":[["越王",6.5,0.0]],"fx":[["focus","范蠡"]]},{"who":"范蠡","t":"該走了。","mv":[["范蠡",-7.5,-1.4]],"fx":[["sad","范蠡"]]},{"t":"范蠡悄悄坐船離開，還寫了一封信給文種：「天上的鳥打光了，好弓就收起來……」"},{"who":"文種","t":"信的後半段寫著兔子和獵狗……這是什麼意思？","fx":[["upset","文種"],["focus","文種"]]}],"q":"范蠡信裡說：狡猾的兔子死了，追兔子的獵狗就要被煮來吃。後來比喻事情成功後，有功的人反而被拋棄或殺害，叫做什麼？","wrong":[{"w":"狡兔三窟","by":"范蠡","line":"狡兔三窟是聰明的兔子有三個洞可以躲。我信裡說的是兔子死了以後，獵狗的下場！"},{"w":"守株待兔","by":"文種","line":"守株待兔是坐在樹下等兔子撞上來。范蠡可沒叫我等，是叫我快逃！"},{"w":"鳥盡弓藏","by":"范蠡","line":"鳥盡弓藏意思幾乎一樣！它是我信的前半句，說的是鳥和弓；題目問的是兔子和獵狗那半句。"}],"hint":"兔子死了，獵狗怎麼了？","after":"文種捨不得離開，後來真的被越王逼死了。范蠡改名換姓做生意，成了有名的大富翁「陶朱公」。","lesson":{"title":"成語小學堂．兔死狗烹","text":"《淮南子》寫作「狡兔得而獵犬烹，高鳥盡而強弩藏」，范蠡的信記在《史記》裡。現在用「兔死狗烹」形容利用完別人就把他丟掉，是很無情的做法。","next":"最後一站，我們來認識一位忙得連坐席都坐不暖的人——墨子……"}},{"id":"e47_08","yr":"《淮南子．脩務》","place":"楚國王宮","scene":"palace","music":"palace","cast":[["墨子",-6.5,1.0],["公輸般",1.4,0.4],["楚王",2.8,-0.6]],"beats":[{"t":"墨子聽說，巧匠公輸般替楚國造了攻城用的雲梯，楚國要去攻打宋國。","fx":[["focus","公輸般"]]},{"t":"墨子馬上從魯國出發，走了十天十夜，腳都磨破了也不休息，趕到楚國。","mv":[["墨子",-1.0,0.6]],"fx":[["sad","墨子"]]},{"who":"墨子","t":"宋國沒有罪，為什麼要攻打它？我們來比一比吧！","fx":[["say","墨子"]]},{"t":"墨子解下衣帶圍成城牆，用小木片當守城的器械。公輸般換了九種方法攻城，九次都被墨子擋住。","fx":[["upset","公輸般"]]},{"who":"墨子","t":"而且我的三百個學生，已經帶著守城器械站在宋國城牆上了！","fx":[["cheer","墨子"]]},{"who":"楚王","t":"好吧，不打宋國了！","fx":[["sad","楚王"],["focus",null]]}],"q":"《淮南子》說：墨子為了天下人到處奔走，連坐的席子都還沒坐暖，又要出發了。形容非常忙碌、到處奔波，叫做什麼？","wrong":[{"w":"遊手好閒","by":"公輸般","line":"遊手好閒是整天閒晃不做事。墨子走了十天十夜，一點也不閒！"},{"w":"高枕無憂","by":"楚王","line":"高枕無憂是墊高枕頭安心睡覺。墨子連坐都沒坐熱，哪有空睡覺？"},{"w":"東奔西走","by":"墨子","line":"東奔西走是到處奔波，意思很接近！不過《淮南子》說的是坐席還沒坐暖，有一個專門的成語。"}],"hint":"「暇」是空閒。席子還來不及怎麼樣？","after":"宋國保住了。可是墨子回程經過宋國，碰上下雨想到城門下躲雨，守門的人卻不讓他進去。","lesson":{"title":"成語小學堂．席不暇暖","text":"《淮南子》原文是「孔子無黔突，墨子無煖席」：孔子家的煙囪沒被煙燻黑，墨子的坐席沒坐暖，形容聖人為百姓辛苦奔走。墨子止楚攻宋的故事記在《墨子．公輸》。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第十一島．寓言大道理","eps":[47]},{"key":"i49","name":"孔子與學生","short":"孔子學堂","era":"《論語》","color":"#A23B3B","map":{"ground":"#b4c77e","river":"#4f9fd8"},"intro":{"lines":["歡迎來到孔子學堂島！孔子是春秋時代魯國人，是中國最有名的老師。","孔子主張「有教無類」：不管有錢沒錢，只要想學，他都願意教。傳說他的學生有三千人。","孔子過世後，學生們把老師和同學說過的話整理成一本書，就是《論語》。","《論語》的句子短短的，卻藏著讀書和做人的大道理，留下了好多成語。","一起走進孔子的學堂，聽聽師生之間的對話吧！"],"people":[["孔子","春秋時代的大教育家，被尊為「至聖先師」"],["顏回","孔子最得意的學生，好學又安貧樂道"],["子貢","很會說話、做生意的學生，常向老師提問"]]},"stops":[{"id":"e49_01","yr":"《論語．述而》","place":"孔子的學堂","scene":"office","music":"palace","cast":[["孔子",0.4,-0.6],["學生",-1.0,0.8],["學生",1.6,1.0]],"beats":[{"t":"這句話出自《論語》。孔子教書有個規矩：學生沒有努力想到快想通、想說又說不出來的時候，他不會急著提點。","fx":[["focus","孔子"]]},{"who":"孔子","t":"你們看這張方桌，它有四個角。我先告訴你們一個角——這是第一個角。","fx":[["say","孔子"]]},{"who":"孔子","t":"另外三個角在哪裡呢？自己動腦想想看。"},{"t":"學生們看了看，馬上跑去找。","mv":[["學生",-1.6,-1.2],["學生#2",1.8,-1.2]]},{"who":"學生","t":"我知道了！第二個、第三個、第四個角都在這裡！","fx":[["cheer","學生"],["cheer","學生#2"]]},{"who":"孔子","t":"很好。如果我說了一個角，你卻想不出另外三個，我就不再重複教了。","fx":[["focus",null]]}],"q":"孔子說：告訴你一個角，你要能自己推想出另外三個角。後來比喻能從一件事推想到其他類似的事，叫做什麼？","wrong":[{"w":"一知半解","by":"學生","line":"一知半解是只懂一點點、懂得不透徹。我們可是自己找出了另外三個角！"},{"w":"三心二意","by":"學生#2","line":"三心二意是心意不專一。我們專心找角落，一點也不三心二意！"},{"w":"觸類旁通","by":"孔子","line":"觸類旁通是懂了一件事，就能通曉同類的事，意思很接近！不過我用的是「一個角推出三個角」的比喻。"}],"hint":"「隅」是角落。說了一個角，你要想出另外幾個角？","after":"孔子希望學生自己動腦，而不是只等老師把答案說出來。","lesson":{"title":"成語小學堂．舉一反三","text":"原文是「舉一隅不以三隅反，則不復也」，「隅」是角落。現在用「舉一反三」稱讚人會思考、能類推，例如：學會一題，就能解開同類型的題目。","next":"有一天，子貢問老師：衛國的大夫孔文子，為什麼能得到「文」這麼好的稱號？"}},{"id":"e49_02","yr":"《論語．公冶長》","place":"孔子的學堂","scene":"study","music":"palace","cast":[["孔子",-0.3,-1.4],["子貢",1.4,0.6],["孔文子",-6.5,1.0,0,1,1],["僕人",6.5,1.4,0,1,1]],"beats":[{"t":"這段對話出自《論語》。衛國大夫孔文子過世後，國君給他一個好稱號：「文」。","fx":[["focus","孔子"]]},{"who":"子貢","t":"老師，孔文子為什麼能被稱為「文」呢？","fx":[["say","子貢"]]},{"who":"孔子","t":"因為他頭腦聰明，又非常喜歡學習。"},{"t":"孔子說，孔文子遇到不懂的事，就算對方地位、學問都比不上他，他也會開口請教。","mv":[["孔文子",-0.8,1.0],["僕人",1.0,1.8]]},{"who":"孔文子","t":"這件事我不太懂，可以請你教教我嗎？","fx":[["say","孔文子"]]},{"who":"僕人","t":"大人，您要問我？","fx":[["upset","僕人"],["focus","僕人"]]}],"q":"孔文子地位很高，卻願意向地位、學問比自己低的人請教，一點也不覺得丟臉。這叫做什麼？","wrong":[{"w":"目中無人","by":"僕人","line":"目中無人是驕傲得看不起別人。大人肯問我問題，一點也不驕傲！"},{"w":"好為人師","by":"子貢","line":"好為人師是喜歡當別人的老師。孔文子剛好相反，是願意當學生，向別人請教！"},{"w":"虛懷若谷","by":"孔子","line":"虛懷若谷是心胸像山谷一樣謙虛寬廣，意思很接近！不過「向地位比自己低的人請教」有一個專門的成語。"}],"hint":"「恥」是覺得丟臉，「下問」是向下請教。","after":"孔子說：「敏而好學」，又肯向人請教，所以他配得上「文」這個稱號。","lesson":{"title":"成語小學堂．不恥下問","text":"「恥」在這裡當動詞，是「覺得羞恥」；「下問」是向地位或學問比自己低的人請教。注意：「不恥下問」只能用在自己去請教別人，不能說「請你不恥下問來問我」喔！","next":"魯國還有一位大夫季文子，他做事非常非常小心……"}},{"id":"e49_03","yr":"《論語．公冶長》","place":"魯國大夫的家","scene":"office","music":"palace","cast":[["季文子",0.4,-0.4],["隨從",-1.0,0.8],["孔子",6.5,1.0,0,1,1],["學生",7.2,1.8,0,1,1]],"beats":[{"t":"這句話出自《論語》。魯國大夫季文子做事很謹慎，每件事都要想好幾遍才去做。","fx":[["focus","季文子"]]},{"t":"有一次他要出使晉國，出發前先派人去學：萬一遇到喪事，該怎麼行禮。","fx":[["say","季文子"]]},{"who":"隨從","t":"大人，又沒有人過世，學這個做什麼？","fx":[["upset","隨從"]]},{"who":"季文子","t":"事先準備，以防萬一！到時候才臨時找，就來不及了。"},{"t":"很多年以後，孔子聽說季文子凡事要想三遍才做。","mv":[["季文子",-7.5,-1.0],["隨從",-7.5,0.6],["孔子",1.4,0.4],["學生",-0.8,1.0]]},{"who":"孔子","t":"其實，想兩遍就可以了。","fx":[["focus","孔子"]]}],"q":"季文子做每件事以前，都要反覆想好幾遍才行動。後來用來勸人做事要謹慎、想清楚再去做，叫做什麼？","wrong":[{"w":"不假思索","by":"隨從","line":"不假思索是不經過思考就脫口而出。我家大人剛好相反，每件事都想了又想！"},{"w":"胡思亂想","by":"學生","line":"胡思亂想是沒有根據地亂想。季文子想的是正經事，要把事情做好！"},{"w":"深思熟慮","by":"孔子","line":"深思熟慮是想得又深又周到，意思很接近！不過季文子的故事強調「想好幾遍才去做」，有一個專門的成語。"}],"hint":"想了「三」遍，然後才去做。","after":"孔子的意思可能是：想得周到很好，可是想太多，反而會猶豫不決。","lesson":{"title":"成語小學堂．三思而行","text":"原文是「季文子三思而後行」，孔子卻說「再，斯可矣」，意思是想兩次就夠了。不過後人用「三思而行」，是勸人做事前要謹慎考慮，例如：買東西前要三思而行。","next":"孔子到東方旅行時，在路邊碰到兩個正在吵架的小孩……"}},{"id":"e49_04","yr":"《論語．子罕》、《列子》","place":"東方的路邊","scene":"road","music":"map","cast":[["小童甲",0.4,0.2],["小童乙",1.8,0.8],["孔子",-6.5,1.0]],"beats":[{"t":"《列子》裡有個故事：孔子到東方遊歷，看見兩個小孩在爭論。","mv":[["孔子",-1.0,0.6]]},{"who":"小童甲","t":"太陽剛出來時，大得像車子的頂蓋；中午卻小得像盤子。近的看起來大，所以早上的太陽比較近！","fx":[["say","小童甲"]]},{"who":"小童乙","t":"才不是！早上涼涼的，中午熱得像把手伸進熱水。近的比較熱，所以中午的太陽比較近！","fx":[["upset","小童乙"]]},{"who":"小童甲","t":"老先生，您說誰才對？","fx":[["focus","孔子"]]},{"t":"孔子想了又想，也判斷不出來。","fx":[["sad","孔子"]]},{"who":"小童乙","t":"哈哈，誰說你知道得很多呢？","fx":[["cheer","小童甲"],["cheer","小童乙"]]}],"q":"小孩子這麼會觀察、會思考，連孔子都答不出來。孔子在《論語》裡說過：年輕人很有潛力，將來可能超過前輩，值得敬重。這叫做什麼？","wrong":[{"w":"老氣橫秋","by":"小童甲","line":"老氣橫秋是擺出老成的樣子，沒有朝氣。我們可是活力十足的小孩！"},{"w":"少不更事","by":"小童乙","line":"少不更事是年紀輕、不懂事。我們觀察太陽可仔細了，一點也不輸大人！"},{"w":"青出於藍","by":"孔子","line":"青出於藍是學生超過老師，意思很接近！不過我說的是所有年輕人都有潛力、值得敬重，是另一句話。"}],"hint":"「後生」是年輕人，「畏」在這裡是敬重。","after":"這兩個小孩辯論太陽的故事，記在《列子》裡，是後人寫的寓言；「後生可畏」則是孔子在《論語》裡說的話。","lesson":{"title":"成語小學堂．後生可畏","text":"孔子說：「後生可畏，焉知來者之不如今也？」怎麼知道年輕人將來不如現在的人呢？不過他也說，到了四、五十歲還沒有成就，就不值得敬畏了。現在常用來稱讚年輕人很厲害。","next":"孔子最得意的學生顏回，有一天忍不住讚歎起老師……"}},{"id":"e49_05","yr":"《論語．子罕》","place":"孔子的書房","scene":"study","music":"night","cast":[["孔子",-0.3,-1.4],["顏回",1.2,0.6]],"beats":[{"t":"這段話出自《論語》。有一天，顏回深深地歎了一口氣，說起他的老師。","fx":[["focus","顏回"]]},{"who":"顏回","t":"老師的學問，越抬頭看越覺得高，越用力鑽研越覺得深。剛看到在前面，忽然又像在後面。","fx":[["say","顏回"]]},{"who":"孔子","t":"別急，慢慢來，一步一步跟上來。","mv":[["孔子",0.2,-0.6]]},{"who":"顏回","t":"老師很有次序、很有方法地帶著我：用書本讓我知識豐富，用禮節讓我行為端正。","fx":[["cheer","顏回"]]},{"who":"顏回","t":"我想停下來都停不下來，已經用盡全力了！","fx":[["focus","孔子"]]}],"q":"顏回說：老師很有次序、一步一步用好方法引導我學習，讓我想停都停不下來。這種教法叫做什麼？","wrong":[{"w":"誤人子弟","by":"顏回","line":"誤人子弟是耽誤了學生。老師把我教得這麼好，怎麼會是誤人子弟？"},{"w":"揠苗助長","by":"孔子","line":"揠苗助長是把稻苗拔高，急著求快反而壞事。我是慢慢地、一步一步地教！"},{"w":"因材施教","by":"孔子","line":"因材施教是依照每個學生的個性和程度來教，也是我的教法！不過顏回讚美的是「有次序地引導」，有另一個成語。"}],"hint":"「循循」是有次序的樣子，「誘」是引導。","after":"顏回說，雖然老師的境界像高高站在那裡，自己想追上去，卻找不到路。","lesson":{"title":"成語小學堂．循循善誘","text":"原文是「夫子循循然善誘人」。現在常用「循循善誘」稱讚老師或父母很有耐心、有方法地引導孩子。同一段話還留下了另一個成語「欲罷不能」：想停也停不下來。","next":"顏回是這麼好學的學生，可是他的家境卻非常貧窮……"}},{"id":"e49_06","yr":"《論語．雍也》","place":"破舊的小巷","scene":"house","music":"palace","cast":[["顏回",0.4,-0.2],["鄰居",6.5,0.8],["鄰居",7.2,1.8],["孔子",-6.5,1.0]],"beats":[{"t":"這段話出自《論語》。顏回家很窮，住在破舊的小巷子裡。","fx":[["focus","顏回"]]},{"who":"顏回","t":"一竹籃飯、一瓢水，就夠了。","fx":[["say","顏回"]]},{"t":"鄰居們看了，都替他發愁。","mv":[["鄰居",2.0,0.6],["鄰居#2",2.8,1.6]],"fx":[["sadAll","鄰居"]]},{"who":"鄰居","t":"吃這麼少、住這麼破，日子怎麼受得了？"},{"who":"顏回","t":"我每天讀書、學道理，快樂得很呢！","fx":[["cheer","顏回"]]},{"t":"孔子知道了，特別稱讚他。","mv":[["孔子",-1.0,0.6]]},{"who":"孔子","t":"賢德啊，顏回！別人受不了這種苦，顏回卻不改變他的快樂。","fx":[["focus","孔子"]]}],"q":"顏回每天只有一竹籃飯、一瓢水，住在破舊的小巷，卻依然快樂。後來形容生活清苦簡單，叫做什麼？","wrong":[{"w":"山珍海味","by":"鄰居","line":"山珍海味是很名貴的食物。顏回只有一籃飯、一瓢水，差得遠了！"},{"w":"錦衣玉食","by":"鄰居#2","line":"錦衣玉食是穿華麗的衣服、吃精美的食物。顏回住的可是破舊的小巷子！"},{"w":"粗茶淡飯","by":"孔子","line":"粗茶淡飯也是形容飲食簡單，意思很接近！不過「一竹籃飯、一瓢水」，有一個專門的成語。"}],"hint":"「簞」是竹編的飯籃，「瓢」是舀水的葫蘆。","after":"孔子稱讚顏回，是因為他就算生活清苦，也一樣快樂地學習、追求道理。","lesson":{"title":"成語小學堂．簞食瓢飲","text":"「食」在這裡讀ㄙˋ，指飯。「簞食瓢飲」形容生活簡單清苦，常用來稱讚人安貧樂道。顏回不是喜歡窮，而是不讓貧窮奪走他學習的快樂。","next":"孔子還告訴學生們一個讀書的好方法……"}},{"id":"e49_07","yr":"《論語．為政》","place":"孔子的學堂","scene":"study","music":"night","cast":[["學生",-0.3,-1.4],["孔子",6.5,1.0]],"beats":[{"t":"這句話出自《論語》。孔子告訴學生：溫習學過的東西，還要能從中想出新的道理。","mv":[["孔子",1.4,0.6]]},{"t":"有個學生，把以前讀過的竹簡拿出來，再讀一次。","fx":[["focus","學生"]]},{"who":"學生","t":"這篇以前讀過了，不過再看一遍吧。","fx":[["say","學生"]]},{"t":"讀著讀著，他忽然想通了以前沒發現的意思！"},{"who":"學生","t":"原來這句話還有這一層道理！","fx":[["cheer","學生"],["burst","學生","#e8b84f"]]},{"who":"孔子","t":"能這樣學習的人，就有資格當老師了。","fx":[["focus","孔子"]]}],"q":"小華每天把前一天學過的數學題再做一遍，有一天還想出了更快的解法。這種學習方法叫做什麼？","wrong":[{"w":"喜新厭舊","by":"學生","line":"喜新厭舊是喜歡新的、討厭舊的。小華可是把舊的題目拿出來再做一遍呢！"},{"w":"故步自封","by":"孔子","line":"故步自封是守著老樣子，不肯進步。小華複習以後還想出新解法，正好相反！"},{"w":"熟能生巧","by":"孔子","line":"熟能生巧是練習多了就變得熟練，意思有點接近！不過小華是複習舊的、想出新的，有另一個成語。"}],"hint":"「溫」是溫習，「故」是舊的知識。","after":"孔子的意思是：讀書不是讀過就算了，常常複習，才會有新的收穫。","lesson":{"title":"成語小學堂．溫故知新","text":"原文是「溫故而知新，可以為師矣」。複習不只是背熟，還能幫我們發現新的想法。考前把錯過的題目再做一次，就是溫故知新的好方法！","next":"最後一站：孔子問子貢一個難回答的問題——你和顏回，誰比較強？"}},{"id":"e49_08","yr":"《論語．公冶長》","place":"孔子的學堂","scene":"office","music":"final","cast":[["孔子",0.4,-0.6],["子貢",1.6,0.8],["顏回",-6.5,-1.0,0,1]],"beats":[{"t":"這段對話出自《論語》。有一天，孔子問學生子貢一個問題。","fx":[["focus","孔子"]]},{"who":"孔子","t":"你和顏回，誰比較強？","fx":[["say","孔子"]]},{"t":"這時候，顏回正好從旁邊走過。","mv":[["顏回",-1.2,-1.4]]},{"who":"子貢","t":"我哪敢跟顏回比呢？","fx":[["upset","子貢"]]},{"who":"子貢","t":"顏回聽到一件事，就能明白十件事；我聽到一件事，只能明白兩件。","fx":[["focus","子貢"]]},{"who":"孔子","t":"是比不上他啊！我和你都比不上他。","fx":[["focus",null]]}],"q":"子貢說：顏回聽到一件事，就能明白十件事。後來形容人非常聰明、領悟力很強，叫做什麼？","wrong":[{"w":"充耳不聞","by":"子貢","line":"充耳不聞是塞住耳朵、假裝沒聽見。顏回不但聽得到，還一聽就懂一大堆！"},{"w":"十全十美","by":"孔子","line":"十全十美是完美沒有缺點。子貢說的是顏回聽一件事、懂十件事的聰明！"},{"w":"舉一反三","by":"子貢","line":"舉一反三是第一站學過的，意思很接近！不過我說的是「聽到一件、明白十件」，比一角推三角還厲害！"}],"hint":"聽到「一」件，就知道幾件？","after":"孔子坦白說連自己都比不上顏回。老師願意稱讚學生比自己強，真是了不起的好老師。","lesson":{"title":"成語小學堂．聞一知十","text":"原文是「回也聞一以知十，賜也聞一以知二」，「賜」是子貢的名字。子貢很誠實，也很懂得欣賞別人的長處。可惜顏回很年輕就過世了，孔子非常傷心。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第十二島．孔子與學生","eps":[49]},{"key":"i50","line":"island","name":"論語裡的智慧","short":"孔子學堂","era":"《論語》","color":"#C0894F","map":{"ground":"#c9c27f","river":"#5aa0d6"},"intro":{"lines":["歡迎來到論語島！這裡的故事，都出自一本叫《論語》的書。","孔子是春秋時代魯國人，是中國最有名的老師，被尊稱為「至聖先師」。","孔子過世後，學生和再傳學生把他和學生說過的話記下來，編成了《論語》。","書裡一句句短短的話，藏著做人做事的大道理，也留下了好多成語！"],"people":[["孔子","春秋時代魯國人，偉大的老師"],["子路","個性直爽、勇敢又有點魯莽的學生"],["子貢","口才好、很會做生意的學生"],["曾子","以孝順和天天反省自己出名的學生"]]},"stops":[{"id":"e50_01","yr":"《論語．衛靈公》","place":"孔子的學堂","scene":"house","music":"palace","cast":[["孔子",0.6,-0.6],["子貢",-6.5,1.0],["顏回",-6.8,0.2],["子路",6.8,1.0]],"beats":[{"t":"春秋時代，讀書多半是貴族的事。孔子卻開了學堂，想讓更多人來讀書。"},{"t":"只要帶一束肉乾來當拜師禮，孔子都願意收。很會做生意的子貢來了。","mv":[["子貢",-1.4,0.8]]},{"t":"家裡很窮、吃粗飯喝白水的顏回也來了。","mv":[["顏回",-0.4,1.5]]},{"t":"還有原本很粗魯、愛逞強的子路，也大搖大擺走進來。","mv":[["子路",1.9,1.0]],"fx":[["upset","子路"]]},{"who":"子路","t":"讀書有什麼用？我才不稀罕！"},{"who":"孔子","t":"來，坐下來，聽我慢慢說。","fx":[["focus","孔子"]]}],"q":"孔子的學生有富有窮，也有原本很粗魯的人，孔子都一樣用心教。孔子認為教育不分貧富貴賤，這是哪個成語？","wrong":[{"w":"對牛彈琴","by":"子路","line":"對牛彈琴是說了對方也聽不懂。我後來可是聽懂了，還成了老師的好學生！"},{"w":"門當戶對","by":"子貢","line":"門當戶對是說兩家身分差不多。老師收學生，才不管家裡有沒有錢呢！"},{"w":"因材施教","by":"孔子","line":"因材施教是看每個人的個性用不同方法教，我也常這樣做，意思很接近！不過這裡說的是：不管什麼出身，都可以來學。"}],"hint":"「類」是類別，指貧富、貴賤等不同的出身。","after":"子路後來成了孔子最忠心的學生之一，顏回則是孔子最常稱讚的好學生。","lesson":{"title":"成語小學堂．有教無類","text":"這句話在《論語》裡只有短短四個字。帶肉乾拜師的事，記在〈述而〉篇「自行束脩以上」。現在常用來形容學校或老師願意教每一個孩子。","next":"孔子不只教學生讀書，也教他們做人要有勇氣……"}},{"id":"e50_02","yr":"《論語．為政》","place":"魯國街邊的空地","scene":"road","music":"map","cast":[["孔子",3.4,-1.4],["子路",4.4,-0.7],["小弟弟",-0.6,0.2],["大孩子",6.8,0.8],["小勇",-6.8,1.0]],"beats":[{"t":"這一站的道理出自《論語》。孔子帶著子路在街上散步，對他說：","fx":[["focus","孔子"]]},{"who":"孔子","t":"看到應該做的事卻不去做，就是沒有勇氣啊！"},{"t":"這時，空地上有個小弟弟在玩球。一個大孩子跑過來，一把搶走了球！","mv":[["大孩子",0.7,0.0]],"fx":[["upset","小弟弟"]]},{"who":"小弟弟","t":"還給我！那是我的球！","fx":[["sad","小弟弟"]]},{"t":"路過的小勇有點害怕，腳都在發抖。可是他深吸一口氣，走了過去。","mv":[["小勇",-1.3,0.5]]},{"who":"小勇","t":"不可以欺負人！把球還給他！","fx":[["focus","小勇"]]}],"q":"小勇雖然害怕，看到不對的事還是勇敢站出來。這種「看到該做的事，就勇敢去做」的行為，可以用哪個成語？","wrong":[{"w":"見死不救","by":"小弟弟","line":"見死不救是看到別人有危險卻不幫忙，剛好相反！小勇可是衝過來幫我耶！"},{"w":"膽小如鼠","by":"大孩子","line":"膽小如鼠是膽子像老鼠一樣小……他剛剛明明很勇敢，害我只好把球還回去。"},{"w":"挺身而出","by":"孔子","line":"挺身而出是勇敢站出來，意思很接近！不過我說的是「看見該做的事就去做」，有一個專門從這句話來的成語。"}],"hint":"原文是「見○不為，無勇也」，「義」是應該做的事。","after":"大孩子不好意思地把球還回去，小弟弟開心地說：「謝謝你！」","lesson":{"title":"成語小學堂．見義勇為","text":"《論語》原文是「見義不為，無勇也」，看到該做的事不去做，就是沒勇氣。後人把它反過來說，成了這個成語，用來稱讚勇敢幫助別人的人。不過幫忙也要注意安全，必要時記得找大人！","next":"勇敢很好，但凡事都要剛剛好。有一天，子貢問了孔子一個問題……"}},{"id":"e50_03","yr":"《論語．先進》","place":"孔子的學堂","scene":"house","music":"palace","cast":[["孔子",0.6,-0.6],["子貢",-1.4,0.6],["子張",6.8,0.8],["子夏",7.2,-0.2]],"beats":[{"t":"孔子的學堂裡，有兩個學生常常被拿來比較：子張和子夏。","mv":[["子張",2.4,0.7],["子夏",3.4,-0.3]]},{"t":"子張做事很積極，常常衝過頭；子夏做事很小心，常常做得不夠。","fx":[["cheer","子張"]]},{"who":"子貢","t":"老師，子張和子夏，誰比較好呢？"},{"who":"孔子","t":"子張常常做過頭，子夏常常做不夠。","fx":[["focus","孔子"]]},{"who":"子貢","t":"那……做過頭的子張，比較好囉？","fx":[["say","子貢"]]},{"t":"孔子搖搖頭。就像澆花：水澆太多，花會爛根；澆太少，花會枯掉。"}],"q":"孔子的意思是：做過頭和做不夠一樣，都不恰當。他回答子貢的這句話，就是哪個成語？","wrong":[{"w":"多多益善","by":"子張","line":"多多益善是越多越好。老師剛剛才說我做過頭不好耶！"},{"w":"半途而廢","by":"子夏","line":"半途而廢是做到一半就放棄。我只是做得不夠，又不是放棄！"},{"w":"適可而止","by":"孔子","line":"適可而止是做到剛好就停下來，意思很接近。不過我說的是「過頭和不夠一樣不好」，是另一個成語。"}],"hint":"「猶」是如同。做過了頭，就如同做不到。","after":"子貢明白了：不是越多越好，剛剛好才是最好。","lesson":{"title":"成語小學堂．過猶不及","text":"原文裡的「師」是子張，「商」是子夏，這是他們的名字。孔子很重視「中庸」，凡事不偏向哪一邊、恰到好處。運動、吃東西、玩電動，都要記得這個道理。","next":"做事要剛剛好，也不能太急。子夏要去當地方官了，他來向孔子請教……"}},{"id":"e50_04","yr":"《論語．子路》","place":"往莒父的路上","scene":"road","music":"map","cast":[["孔子",1.2,-0.6],["子夏",-0.4,0.2],["賣蛋人",7.0,0.8]],"beats":[{"t":"子夏要到魯國的莒父去當地方長官。出發前，他向孔子請教怎麼治理。"},{"who":"子夏","t":"老師，我該怎麼做才好呢？"},{"who":"孔子","t":"不要只想求快，也不要貪圖小利益。","fx":[["focus","孔子"]]},{"t":"這時，一個挑著雞蛋的人急急忙忙跑過來，想趕快到市場去。","mv":[["賣蛋人",1.2,1.2]]},{"t":"他跑得太快，腳下一絆，摔了一大跤！","fx":[["upset","賣蛋人"]]},{"who":"賣蛋人","t":"哎呀！蛋全破了，這下還得回家重拿……","fx":[["sad","賣蛋人"]]}],"q":"一心想快，反而摔破了蛋、更晚到市場。孔子提醒子夏：太急著求快，反而達不到目的。這是哪個成語？","wrong":[{"w":"一日千里","by":"賣蛋人","line":"一日千里是進步得非常快。我這一摔，可是退回原點要重來！"},{"w":"馬到成功","by":"子夏","line":"馬到成功是一開始就成功。這位大哥一急，反而失敗了呀！"},{"w":"操之過急","by":"孔子","line":"操之過急是處理事情太急躁，意思很接近！不過我說的重點是「想快反而到不了」，是另一個成語。"}],"hint":"「達」是到達、達到。原文是「○○則不○」。","after":"子夏記住了老師的話：慢慢來，把事情做好，比急著求快更重要。","lesson":{"title":"成語小學堂．欲速不達","text":"孔子的原話是「欲速則不達，見小利則大事不成」。挑雞蛋的人是為了說明這句話編的小故事。寫作業也一樣，急著趕完常常錯一堆，又要重寫。","next":"除了不要急，孔子也提醒學生：聽到的話不要亂傳……"}},{"id":"e50_05","yr":"《論語．陽貨》","place":"宋國的村子","scene":"road","music":"map","cast":[["丁家主人",-0.8,0.2],["路人",6.8,0.6],["村民",7.2,-0.4],["使者",6.8,1.4,0,null,1]],"beats":[{"t":"這一站的道理出自《論語》，故事來自《呂氏春秋》。宋國有一戶姓丁的人家，家裡沒有井。"},{"t":"他們每天都要派一個人跑到遠處挑水。後來，丁家終於挖好一口井！","fx":[["cheer","丁家主人"]]},{"who":"丁家主人","t":"太好了！挖了一口井，就像多得到一個人！"},{"t":"路人聽到了，沒問清楚，就到處跟人說。","mv":[["路人",1.8,0.8],["村民",2.9,0.0]]},{"who":"路人","t":"你知道嗎？丁家挖井，挖出了一個人！"},{"who":"村民","t":"真的嗎？太奇怪了！我也去告訴別人！","fx":[["upset","村民"]]},{"t":"話越傳越遠，連宋國國君都聽說了，派使者來丁家問清楚。","mv":[["使者",0.6,0.4]]},{"who":"丁家主人","t":"不是啦！是省下一個人挑水的力氣，不是從井裡挖出人啦！","fx":[["upset","丁家主人"]]}],"q":"路上聽到的話，沒有查證就在路上傳出去，結果越傳越離譜。孔子說這樣是丟掉品德。這種行為叫做什麼？","wrong":[{"w":"一言九鼎","by":"使者","line":"一言九鼎是說話很有分量、說到做到。這些人亂傳的話，一點分量也沒有！"},{"w":"耳聽八方","by":"路人","line":"耳聽八方是很機靈、注意四周的動靜。我是聽到一點點就亂傳，可不是機靈喔……"},{"w":"以訛傳訛","by":"丁家主人","line":"以訛傳訛是把錯的話越傳越錯，意思很接近！不過孔子說的是「路上聽、路上說」，是另一個成語。"}],"hint":"「塗」同「途」，就是道路。","after":"使者問清楚後，大家才知道：丁家只是省下一個人力，井裡根本沒挖出人。","lesson":{"title":"成語小學堂．道聽塗說","text":"孔子說「道聽而塗說，德之棄也」，聽到就亂傳，等於把品德丟掉了。丁家挖井的故事出自《呂氏春秋》。現在網路消息很多，轉傳前記得先查證！","next":"不亂傳話之後，孔子還教學生：遇到該做的好事，要主動去做……"}},{"id":"e50_06","yr":"《論語．衛靈公》","place":"學堂門口","scene":"house","music":"map","cast":[["老師",0.6,-0.8],["小石",1.6,0.6],["小禾",-0.8,0.4],["學生",2.9,-0.2],["學生",-1.6,-0.7]],"beats":[{"t":"孔子說過：「遇到行仁的好事，就算是老師，也不必讓給他。」這句話出自《論語》。"},{"t":"有一天下課，小石跑太快，在學堂門口跌倒，扭傷了腳。","fx":[["sad","小石"]]},{"who":"小石","t":"好痛……我走不動了。"},{"who":"老師","t":"他的腳受傷了，誰願意扶他去看大夫？","fx":[["focus","老師"]]},{"t":"大家你看我、我看你，都在等別人先開口。","fx":[["sadAll","學生"]]},{"t":"小禾想：這是應該做的事，不必等別人！她馬上舉起手。","fx":[["cheer","小禾"]]},{"who":"小禾","t":"老師，我來！","mv":[["小禾",0.9,0.9]]}],"q":"小禾遇到應該做的好事，馬上主動承擔，不推給別人。這種態度可以用哪個成語？","wrong":[{"w":"推三阻四","by":"學生","line":"推三阻四是找各種藉口推掉。小禾一秒就舉手，哪有推？"},{"w":"袖手旁觀","by":"小石","line":"袖手旁觀是在旁邊看，不幫忙。小禾可是第一個來扶我的！"},{"w":"自告奮勇","by":"老師","line":"自告奮勇是主動要求去做，意思很接近！不過孔子說的是「遇到行仁的好事，不推讓」，有一個專門的成語。"}],"hint":"「仁」是行仁的好事，「讓」是推讓。","after":"小禾扶著小石慢慢走去看大夫，老師笑著點點頭。","lesson":{"title":"成語小學堂．當仁不讓","text":"原文是「當仁不讓於師」，連老師都不必讓。現在常用在該自己做的事，就主動扛起來，例如：班上要選代表，她當仁不讓地站出來。記得，是搶著做好事，不是搶好處喔！","next":"主動扛起責任很好，可是有些責任很重、要做很久。孔子的學生曾子就說過……"}},{"id":"e50_07","yr":"《論語．泰伯》","place":"曾子的書房","scene":"study","music":"night","cast":[["曾子",-1.2,-1.4],["學生",1.2,0.4],["學生",2.4,-0.4]],"beats":[{"t":"曾子是孔子的學生，以孝順和天天反省自己出名。這句話出自《論語》，是曾子說的。"},{"t":"一天晚上，學生們圍在曾子身邊請教。","fx":[["say","學生"]]},{"who":"學生","t":"老師，讀書人最需要的是什麼呢？"},{"who":"曾子","t":"讀書人一定要心胸寬大、意志堅強。","fx":[["focus","曾子"]]},{"who":"曾子","t":"把行仁當成自己的責任，這個擔子不是很重嗎？"},{"who":"曾子","t":"一輩子做到最後一口氣才停下來，這條路不是很遠嗎？","fx":[["focus",null]]}],"q":"曾子說：讀書人肩上的擔子很重，要走的路又很遠，所以要意志堅強。這句話變成哪個成語？","wrong":[{"w":"輕而易舉","by":"學生","line":"輕而易舉是很輕鬆就能做到。老師明明說擔子很重耶！"},{"w":"半途而廢","by":"學生#2","line":"半途而廢是走到一半就放棄。老師說要一路走到最後才停喔！"},{"w":"責無旁貸","by":"曾子","line":"責無旁貸是責任不能推給別人，意思有點接近。不過我說的是責任很重、路又很長，要長期努力。"}],"hint":"擔子叫做「任」，路途叫做「道」。","after":"學生們聽了，都挺起胸膛，決定要更加努力。","lesson":{"title":"成語小學堂．任重道遠","text":"原文是「士不可以不弘毅，任重而道遠」，「弘毅」是寬大又堅毅。現在常用來形容責任重大、要長期努力的事，例如保護地球。","next":"責任重大，做事也要名分正當。有一次，子路問孔子一個問題，還說老師太不切實際……"}},{"id":"e50_08","yr":"《論語．子路》","place":"衛國．孔子的住處","scene":"house","music":"palace","cast":[["孔子",0.6,-0.6],["子路",6.8,0.8]],"beats":[{"t":"孔子帶著學生來到衛國。聽說衛國國君想請孔子幫忙治理國家。"},{"t":"個性直爽的子路跑來問老師。","mv":[["子路",1.7,0.6]]},{"who":"子路","t":"如果衛君請您治國，您第一件事要做什麼？"},{"who":"孔子","t":"一定要先端正名分！","fx":[["focus","孔子"]]},{"who":"子路","t":"老師也太不切實際了吧！這有什麼好端正的？","fx":[["upset","子路"]]},{"who":"孔子","t":"由啊，你太魯莽了！名分不正，說話就不順；說話不順，事情就辦不成。","fx":[["say","孔子"]]}],"q":"孔子認為：名分正當，說話才有道理，事情才辦得成。這段道理後來變成哪個成語？","wrong":[{"w":"名落孫山","by":"子路","line":"名落孫山是考試沒考上。老師講的是名分，不是考試排名啦！"},{"w":"言而無信","by":"孔子","line":"言而無信是說話不算話。我說的是名分要正，說話才能順理成章。"},{"w":"理直氣壯","by":"子路","line":"理直氣壯是理由正當，說話就有氣勢，意思有點像！不過老師講的是「名分」正當，說話才順，是另一個成語。"}],"hint":"「名」是名分，「言」是說話。","after":"子路摸摸頭，終於明白老師的用意：做事要先有正當的身分和理由。","lesson":{"title":"成語小學堂．名正言順","text":"子路名叫仲由，所以孔子叫他「由」。當時衛國國君和他的父親在爭君位，名分很亂，所以孔子說要先正名。現在常說：當選班長後，管秩序就名正言順。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十三島．論語裡的智慧","eps":[50]},{"key":"i51","line":"island","name":"孟子講故事","short":"孟子遊列國","era":"《孟子》","color":"#5E8F6A","map":{"ground":"#a9c98c","river":"#55a3d6"},"intro":{"lines":["歡迎來到孟子島！這裡的故事，都出自一本叫《孟子》的書。","孟子是戰國時代鄒國人，比孔子晚了一百多年，被尊稱為「亞聖」。","他到魏國、齊國、宋國等地見國君，勸大家行「仁政」：讓百姓吃飽，不要亂打仗。","孟子最會打比喻、說故事。這一章，就來聽聽他講的精采故事吧！"],"people":[["孟子","戰國時代鄒國人，被尊稱為「亞聖」"],["梁惠王","魏國國君，也叫魏惠王"],["齊宣王","齊國國君，一心想稱霸天下"],["弈秋","全國最會下棋的人"]]},"stops":[{"id":"e51_01","yr":"《孟子．梁惠王上》","place":"魏國王宮","scene":"palace","music":"palace","cast":[["梁惠王",1.4,-0.4],["孟子",-6.5,1.0],["大臣",2.8,0.8]],"beats":[{"t":"孟子來到魏國。魏國的首都在大梁，所以魏王也叫梁惠王。","mv":[["孟子",-0.8,0.6]]},{"who":"梁惠王","t":"我願意好好聽先生的指教。"},{"who":"孟子","t":"大王的廚房有肥肉，馬房有肥馬，百姓卻餓著肚子，野外還有人餓死。","fx":[["focus","孟子"]]},{"who":"孟子","t":"這就像帶著野獸去吃人啊！","fx":[["upset","梁惠王"]]},{"who":"孟子","t":"孔子說過：第一個做人偶陪葬的人，大概會沒有後代吧！只因為那人偶做得太像人。"},{"who":"孟子","t":"連用像人的木偶陪葬都不忍心，怎麼能讓真正的百姓餓死呢？","fx":[["sad","梁惠王"]]}],"q":"孔子罵「第一個做人偶陪葬的人」，因為他開了一個壞頭。後來把首開惡例、帶頭做壞事的人，叫做什麼？","wrong":[{"w":"一馬當先","by":"大臣","line":"一馬當先是衝在最前面，通常是稱讚人勇敢。孔子罵的可是開壞頭的人！"},{"w":"大公無私","by":"梁惠王","line":"大公無私是公正不偏心……這跟做人偶陪葬一點關係也沒有。"},{"w":"罪魁禍首","by":"孟子","line":"罪魁禍首是闖禍的主要人物，意思很接近！不過這裡說的是「第一個開頭做壞事的人」，是從人偶來的那個成語。"}],"hint":"「俑」念ㄩㄥˇ，是古代陪葬用、做成人形的木偶或陶偶。","after":"梁惠王低下頭，好像明白了：國君要先讓百姓吃飽。","lesson":{"title":"成語小學堂．始作俑者","text":"孔子覺得用很像人的人偶陪葬太不仁慈，所以罵第一個這樣做的人。秦始皇陵的兵馬俑，就是有名的陶俑。現在這個成語是貶義，專門說帶頭做壞事的人。","next":"孟子後來到了齊國，又用一個奇怪的比喻考齊宣王……"}},{"id":"e51_02","yr":"《孟子．梁惠王上》","place":"齊國王宮","scene":"palace","music":"palace","cast":[["齊宣王",1.4,-0.4],["孟子",-1.0,0.6],["侍臣",2.8,0.9]],"beats":[{"t":"孟子來到齊國。齊宣王曾看到一頭要被殺來祭祀的牛在發抖，心裡不忍，叫人放了牠。"},{"who":"孟子","t":"大王連一頭牛都不忍心，百姓卻沒過上好日子。我說個比喻吧。","fx":[["focus","孟子"]]},{"who":"孟子","t":"假如有人說：「我能舉起三千斤，卻舉不起一根羽毛。」"},{"who":"孟子","t":"「我看得清秋天鳥獸新長細毛的尖端，卻看不見一整車木柴。」大王相信嗎？"},{"who":"齊宣王","t":"我才不信！怎麼可能？","fx":[["upset","齊宣王"]]},{"who":"孟子","t":"所以舉不起羽毛，是不肯用力；看不見木柴，是不肯去看啊！","fx":[["say","孟子"]]}],"q":"孟子說那個人眼力好到能看清「秋天鳥獸細毛的尖端」。後來形容能看清極細微的事物，用哪個成語？","wrong":[{"w":"目中無人","by":"齊宣王","line":"目中無人是驕傲、看不起人。孟子說的是眼力好，不是眼睛長在頭頂上！"},{"w":"視而不見","by":"侍臣","line":"視而不見是看了卻沒注意到，那是「看不見一車木柴」的樣子，剛好相反喔！"},{"w":"洞若觀火","by":"孟子","line":"洞若觀火是看事情像看火一樣清楚，意思很接近。不過我比喻的是秋天鳥獸的細毛，是另一個成語。"}],"hint":"「秋毫」是鳥獸秋天新長的細毛，「察」是看清楚。","after":"孟子說：大王沒辦法行仁政稱王，「是不肯做，不是做不到」。","lesson":{"title":"成語小學堂．明察秋毫","text":"「百鈞」是三千斤，「輿薪」是一整車木柴。孟子用這個比喻告訴齊宣王：不是做不到，是不肯做。現在這個成語常用來稱讚人觀察仔細，像法官、偵探找出很小的破綻。","next":"孟子還想知道：齊宣王心裡最想要的，到底是什麼？"}},{"id":"e51_03","yr":"《孟子．梁惠王上》","place":"齊國王宮","scene":"palace","music":"palace","cast":[["齊宣王",1.4,-0.4],["孟子",-1.0,0.6],["侍臣",2.8,0.9]],"beats":[{"who":"孟子","t":"大王最想要的是什麼，可以說給我聽嗎？","fx":[["focus","孟子"]]},{"t":"齊宣王只是笑，不肯說。","fx":[["cheer","齊宣王"]]},{"who":"孟子","t":"是好吃的不夠吃？好穿的不夠穿？還是美麗的東西不夠看？"},{"who":"齊宣王","t":"都不是，我不是為了這些。"},{"who":"孟子","t":"那我知道了！大王是想擴張土地，讓秦國、楚國都來朝拜，統治天下吧！","fx":[["upset","齊宣王"]]},{"who":"孟子","t":"可是用打仗結仇的方法，想得到這些，就像爬到樹上去找魚啊！","fx":[["say","孟子"]]}],"q":"孟子說：用打仗的方法想稱王天下，就像爬到樹上找魚，方法錯了，不可能成功。這是哪個成語？","wrong":[{"w":"如魚得水","by":"齊宣王","line":"如魚得水是遇到很適合自己的環境。魚在樹上，可是一點水都沒有！"},{"w":"畫蛇添足","by":"侍臣","line":"畫蛇添足是多做多餘的事。孟子說的是方法根本用錯了！"},{"w":"南轅北轍","by":"孟子","line":"南轅北轍是想往南卻往北走，也是方法和目的相反，意思很接近！不過我說的是爬樹找魚。"}],"hint":"「緣」是攀爬，樹叫做「木」。","after":"齊宣王問：有這麼嚴重嗎？孟子說：更嚴重！爬樹找魚只是找不到，打仗卻會帶來災禍。","lesson":{"title":"成語小學堂．緣木求魚","text":"孟子勸齊宣王：與其打仗，不如行仁政，讓天下的人都想來齊國做官、種田、做生意。現在這個成語用來說方法錯誤，不可能達到目的。","next":"可惜齊宣王常常聽一聽又忘了。有人說齊王不夠聰明，孟子卻說……"}},{"id":"e51_04","yr":"《孟子．告子上》","place":"齊國的田邊","scene":"south","music":"map","cast":[["孟子",0.6,-0.4],["學生",-0.8,0.6],["農夫",6.8,0.2]],"beats":[{"t":"孟子在齊國待了好一陣子，齊宣王卻一直沒有行仁政。"},{"who":"學生","t":"老師，大王怎麼老是學不好？是不是他不夠聰明？","fx":[["upset","學生"]]},{"t":"田邊，農夫正細心照顧剛發芽的菜苗，每天都讓它曬太陽。","mv":[["農夫",2.6,0.3]]},{"who":"孟子","t":"不要奇怪大王不聰明。就算是天下最容易長大的植物……","fx":[["focus","孟子"]]},{"who":"孟子","t":"曬它一天太陽，再凍它十天，也不可能長得好！"},{"who":"孟子","t":"我很少見到大王；我一離開，潑冷水的人就來了。他心裡剛冒出的好芽，又能怎樣呢？","fx":[["sad","孟子"]]}],"q":"孟子說：曬一天、凍十天，植物怎麼長得好？後來比喻做事沒有恆心、常常中斷，用哪個成語？","wrong":[{"w":"日新月異","by":"學生","line":"日新月異是每天都有新進步。大王可是一點進步都沒有啊！"},{"w":"滴水穿石","by":"農夫","line":"滴水穿石是一直堅持就能成功，剛好相反！曬一天、凍十天，什麼也種不出來。"},{"w":"半途而廢","by":"孟子","line":"半途而廢是做到一半就放棄，意思接近。不過這裡是一下做、一下停，時常中斷，是另一個成語。"}],"hint":"「暴」念ㄆㄨˋ，同「曝」，是曬太陽；「寒」是凍。","after":"學生明白了：大王身邊潑冷水的人太多，孟子一個人說再多也沒用。","lesson":{"title":"成語小學堂．一暴十寒","text":"「暴」念ㄆㄨˋ，不要唸成ㄅㄠˋ。學習、運動、練琴都一樣：一天練三小時、接下來十天都不練，效果遠不如每天練一點點。","next":"孟子接著說：下棋只是小技藝，不專心也學不好。他講了一個下棋高手的故事……"}},{"id":"e51_05","yr":"《孟子．告子上》","place":"弈秋的棋室","scene":"house","music":"map","cast":[["弈秋",0.4,-0.8],["學生甲",-1.2,0.4],["學生乙",1.8,0.6]],"beats":[{"t":"孟子說了一個故事：弈秋是全國最會下棋的人，有兩個學生同時跟他學棋。"},{"who":"弈秋","t":"好好看，這一步要這樣下……","fx":[["say","弈秋"]]},{"t":"學生甲眼睛盯著棋盤，一心一意只聽弈秋說話。","fx":[["focus","學生甲"]]},{"who":"學生甲","t":"原來要這樣下！我懂了！","fx":[["cheer","學生甲"]]},{"t":"學生乙雖然也在聽，心裡卻想著：天鵝快飛來了，要拿弓箭射牠！","fx":[["focus","學生乙"]]},{"who":"學生乙","t":"天鵝來了！射牠……咦？老師剛剛說什麼？","fx":[["upset","學生乙"]]},{"t":"兩人一起學，學生乙卻遠遠比不上。難道是他比較笨嗎？孟子說：不是的。","fx":[["focus",null]]}],"q":"學生甲一心一意，把精神都集中在學棋上，所以學得好。這種學習態度可以用哪個成語？","wrong":[{"w":"三心二意","by":"學生甲","line":"三心二意是想東想西、拿不定主意，那是學生乙啦！"},{"w":"異想天開","by":"學生乙","line":"異想天開是想法很奇特、不實際……我只是想射天鵝而已嘛！"},{"w":"全神貫注","by":"弈秋","line":"全神貫注是把精神全部集中，意思很接近！不過孟子在這個故事裡說的，是另一個成語。"}],"hint":"「致」是用盡，「志」是心意。","after":"學生乙輸了一盤又一盤，終於明白：不是自己笨，是心不在棋盤上。","lesson":{"title":"成語小學堂．專心致志","text":"孟子說，下棋只是小技藝，不專心都學不好，更何況是大學問？上課時想著下課要玩什麼，就像想射天鵝的學生乙喔。它的相反詞是「三心二意」。","next":"專心很重要，學習的環境也很重要。孟子又問了宋國大臣一個問題……"}},{"id":"e51_06","yr":"《孟子．滕文公下》","place":"宋國","scene":"office","music":"map","cast":[["孟子",-0.8,0.4],["戴不勝",1.4,-0.4],["齊國老師",6.8,0.6,0,null,1],["楚童",7.2,1.4,0,null,1],["楚國人",7.0,-0.6,0,null,1],["楚國人",7.4,0.2,0,null,1],["楚國人",7.6,1.0,0,null,1]],"beats":[{"t":"孟子在宋國時，宋國大臣戴不勝希望國君變成好國君。孟子問了他一個問題。"},{"who":"孟子","t":"楚國有個大夫，想讓兒子學齊國話，該請齊國人教，還是楚國人教？","fx":[["focus","孟子"]]},{"who":"戴不勝","t":"當然請齊國人教！"},{"t":"可是，只有一個齊國老師在教，旁邊卻有一大群楚國人吵吵鬧鬧……","mv":[["齊國老師",2.6,0.4],["楚童",1.8,1.4],["楚國人",3.6,-0.6],["楚國人#2",0.6,-1.2],["楚國人#3",3.8,1.2]],"fx":[["cheerAll","楚國人"]]},{"who":"楚童","t":"好吵！聽不清楚啦！老師說的是什麼？","fx":[["upset","楚童"]]},{"who":"孟子","t":"就算天天打他、逼他說齊國話，也學不會。如果帶他到齊國熱鬧的街上住幾年，自然就會說了。"}],"q":"一個人在教，一大群人在旁邊吵，孩子怎麼也學不好。這種「環境不好，學習沒效果」的情形，叫做什麼？","wrong":[{"w":"眾志成城","by":"楚國人","line":"眾志成城是大家團結起來力量大。我們是一起吵，不是一起幫忙啦！"},{"w":"一鳴驚人","by":"齊國老師","line":"一鳴驚人是平常沒表現，一出手就很驚人。我教得這麼辛苦，學生卻一點也沒學會……"},{"w":"孟母三遷","by":"孟子","line":"孟母三遷是我媽媽為了好環境搬了三次家，也在說環境很重要！不過這裡說的是一個人教、很多人吵。"}],"hint":"「傅」是教導，「咻」是喧鬧。","after":"孟子對戴不勝說：國君身邊只有薛居州一個好人，其他人都不好，國君又怎麼變好呢？","lesson":{"title":"成語小學堂．一傅眾咻","text":"「莊嶽」是齊國熱鬧的街名。孟子藉這個比喻勸戴不勝：國君身邊要多一些好人。現在教室太吵、老師再認真也教不好時，就可以用這個成語。","next":"孟子還說：行善也要做得夠多。只做一點點，就像……"}},{"id":"e51_07","yr":"《孟子．告子上》","place":"路邊","scene":"road","music":"map","cast":[["孟子",3.0,-1.2],["學生",4.0,-0.4],["路人",-6.8,0.6]],"beats":[{"t":"孟子對學生說：「仁勝過不仁，就像水能滅火一樣。」可是有些人行善，只做一點點。","fx":[["focus","孟子"]]},{"t":"孟子打了個比方：路上有一整車木柴燒了起來！","fx":[["prop","cart",0.4,-1.4,0],["fire",0.4,-1.4],["focus",null]]},{"who":"路人","t":"我來滅火！","mv":[["路人",-0.6,-0.2]]},{"t":"他只拿著一小杯水，往大火一潑。火一點也沒變小。","fx":[["upset","路人"]]},{"who":"路人","t":"你看！水根本打不過火嘛！","fx":[["sad","路人"]]},{"who":"孟子","t":"不是水沒用，是水太少啦！","fx":[["say","孟子"]]}],"q":"用一小杯水去救一整車燒著的木柴，力量太小，根本解決不了問題。這是哪個成語？","wrong":[{"w":"水落石出","by":"路人","line":"水落石出是真相大白。火都還沒滅，哪來的真相？"},{"w":"火上加油","by":"學生","line":"火上加油是讓事情更糟。他是想滅火，只是水太少了！"},{"w":"無濟於事","by":"孟子","line":"無濟於事是對事情沒有幫助，意思很接近！不過我的比喻是一杯水和一車木柴，是另一個成語。"}],"hint":"「薪」是木柴。","after":"孟子說：這種人做一點好事沒成功，就說行善沒用，反而是在幫不仁的人。","lesson":{"title":"成語小學堂．杯水車薪","text":"這是孟子打的比方，提醒人行善要夠多、夠久，不能做一點就放棄。現在常用來形容幫助太少，解決不了大問題。","next":"做一點就放棄已經很可惜，還有人連試都不試，就說「我不行」……"}},{"id":"e51_08","yr":"《孟子．離婁上》","place":"孟子的學堂","scene":"house","music":"palace","cast":[["孟子",0.4,-0.8],["學生",-1.2,0.6],["少年",2.0,0.6]],"beats":[{"t":"孟子在學堂裡教學生。有個少年垂頭喪氣地坐在角落。","fx":[["sad","少年"]]},{"who":"少年","t":"仁義太難了，反正我就是做不到……"},{"who":"孟子","t":"說話糟蹋禮義的人，沒辦法跟他好好談；覺得自己做不到仁義的人，沒辦法跟他一起做事。","fx":[["focus","孟子"]]},{"who":"孟子","t":"仁，是人最安穩的房子；義，是人最正確的道路。"},{"who":"孟子","t":"有安穩的房子不住，有正確的路不走，真是可悲啊！","fx":[["sad","孟子"]]},{"who":"學生","t":"老師是說，不能自己先放棄自己！","fx":[["cheer","學生"]]}],"q":"孟子說：自己糟蹋自己、自己放棄自己，有好房子不住、有正路不走，太可惜了。這種不求上進的態度叫做什麼？","wrong":[{"w":"自強不息","by":"學生","line":"自強不息是自己不斷努力向上，剛好相反喔！"},{"w":"自得其樂","by":"少年","line":"自得其樂是自己玩得很開心。我剛剛可是一點都不開心……"},{"w":"妄自菲薄","by":"孟子","line":"妄自菲薄是太看輕自己，意思很接近！不過我說的是自己糟蹋、放棄自己，是另一個成語。"}],"hint":"「暴」是糟蹋，「棄」是放棄；兩個動作都是對「自己」做的。","after":"少年抬起頭：原來只要不放棄，仁義的房子和道路一直都在。","lesson":{"title":"成語小學堂．自暴自棄","text":"孟子原本說的「自暴」是說話糟蹋禮義，「自棄」是不肯行仁義。現在意思變成自己放棄自己、不求上進。考不好沒關係，千萬別放棄自己！","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十四島．孟子講故事","eps":[51]},{"key":"i52","line":"island","name":"孟子的大道理","short":"孟子說道理","era":"《孟子》","color":"#4F79A8","map":{"ground":"#a6c487","river":"#4f97d4"},"intro":{"lines":["歡迎回到孟子島！這一章要聽孟子說更多大道理。","孟子相信人天生就有善良的心，主張國君要行「仁政」，把百姓放在第一位。","《孟子》共有七篇，記下孟子和國君、學生的對話。","南宋的朱熹把《孟子》和《論語》《大學》《中庸》合稱「四書」，是古代讀書人必讀的書。"],"people":[["孟子","戰國時代的思想家，被尊稱為「亞聖」"],["公孫丑","孟子的學生，齊國人"],["梁惠王","魏國國君，喜歡打仗"],["白圭","戰國時很會理財、治水的人"]]},"stops":[{"id":"e52_01","yr":"《孟子．梁惠王上》","place":"魏國王宮","scene":"palace","music":"palace","cast":[["梁惠王",1.4,-0.4],["孟子",-1.0,0.6],["逃兵",5.0,-1.6,0,null,1],["逃兵",6.0,-0.8,0,null,1]],"beats":[{"t":"梁惠王說：哪裡鬧饑荒，他就把百姓搬到別處，把糧食運過去，非常用心救災。"},{"who":"梁惠王","t":"鄰國國君都沒我用心，為什麼我的百姓沒有變多呢？","fx":[["upset","梁惠王"]]},{"who":"孟子","t":"大王喜歡打仗，就用打仗來比喻吧！戰鼓咚咚一響，刀槍碰在一起……","fx":[["focus","孟子"]]},{"t":"有些士兵丟掉盔甲、拖著兵器拚命逃。有人跑了一百步，有人跑了五十步。","mv":[["逃兵",-1.4,-1.6],["逃兵#2",1.0,-0.9]],"fx":[["focus",null]]},{"who":"逃兵#2","t":"哈哈！你跑了一百步，真是膽小鬼！","fx":[["cheer","逃兵#2"]]},{"who":"孟子","t":"跑五十步的人笑跑一百步的人，大王覺得可以嗎？"},{"who":"梁惠王","t":"不可以！他只是沒跑到一百步，一樣是逃跑呀！"}],"q":"孟子比喻裡的士兵打了敗仗，丟掉盔甲、拖著兵器，狼狽地逃走。這種樣子可以用哪個成語？","wrong":[{"w":"披荊斬棘","by":"逃兵","line":"披荊斬棘是排除困難向前衝。我們可是往後逃耶！"},{"w":"旗開得勝","by":"梁惠王","line":"旗開得勝是一開戰就打贏。這些士兵明明打輸了！"},{"w":"落荒而逃","by":"孟子","line":"落荒而逃是打了敗仗往荒野逃，意思很接近！不過我的比喻裡有丟盔甲、拖兵器，是另一個成語。"}],"hint":"「曳」念ㄧˋ，是拖著；「兵」在這裡是兵器，不是士兵。","after":"孟子說：大王和鄰國其實差不多，既然明白這個道理，就別期待百姓比鄰國多了。","lesson":{"title":"成語小學堂．棄甲曳兵","text":"這段話也是成語「五十步笑百步」的出處：自己有同樣的缺點，卻去笑別人。孟子接著勸梁惠王：不要在農忙時徵兵，讓百姓吃得飽、穿得暖，這才是王道的開始。","next":"孟子說國君要愛百姓。有一次，鄒國打了敗仗，國君卻怪百姓……"}},{"id":"e52_02","yr":"《孟子．梁惠王下》","place":"鄒國王宮","scene":"palace","music":"palace","cast":[["鄒穆公",1.4,-0.4],["孟子",-6.5,1.0],["官員",2.8,0.8],["百姓",6.8,-1.0,0,null,1],["百姓",7.2,-0.2,0,null,1]],"beats":[{"t":"鄒國和魯國打了一仗。孟子是鄒國人，國君鄒穆公來問他。","mv":[["孟子",-0.8,0.6]]},{"who":"鄒穆公","t":"我的官員戰死了三十三個，百姓卻沒有一個肯拚命救他們！","fx":[["upset","鄒穆公"]]},{"who":"鄒穆公","t":"要處罰嘛，人太多罰不完；不處罰嘛，又太可恨。怎麼辦才好？"},{"who":"孟子","t":"荒年時，老弱的百姓餓倒在山溝，年輕人逃到四方，有好幾千人啊！","mv":[["百姓",3.6,-1.6],["百姓#2",4.4,-0.8]],"fx":[["sadAll","百姓"]]},{"who":"孟子","t":"可是國君的糧倉滿滿的，官員卻沒人向您報告，也不救百姓。","fx":[["sad","官員"]]},{"who":"孟子","t":"曾子說過：「小心啊小心！你怎麼對待別人，別人就會怎麼回報你。」","fx":[["focus","孟子"]]}],"q":"曾子這句話說的是：你怎麼對待別人，別人就怎麼回報你。後來它變成一個成語，現在多用來形容說話做事反覆無常。是哪個成語？","wrong":[{"w":"以德報怨","by":"官員","line":"以德報怨是用恩惠回報仇恨……可是我們本來就沒對百姓好過啊。"},{"w":"言出必行","by":"鄒穆公","line":"言出必行是說到做到，剛好跟現在的意思相反！"},{"w":"自食其果","by":"孟子","line":"自食其果是自己做的事，結果落到自己身上，意思有點接近。不過曾子那句話裡有「爾」字，是另一個成語。"}],"hint":"「爾」是你。原句是「○乎爾者，○乎爾者也」。","after":"孟子說：國君只要行仁政，百姓就會親近長官，願意為他們拚命。","lesson":{"title":"成語小學堂．出爾反爾","text":"原句是「出乎爾者，反乎爾者也」，本來是說你怎麼對人，人就怎麼對你。現在意思變了，多用來說人前後不一、反覆無常，例如答應借書又反悔。古今意思不同，要特別注意！","next":"孟子的學生公孫丑是齊國人，他很好奇：老師如果在齊國掌權，會怎麼做呢？"}},{"id":"e52_03","yr":"《孟子．公孫丑上》","place":"孟子的學堂","scene":"house","music":"palace","cast":[["孟子",0.4,-0.8],["公孫丑",-1.2,0.6],["萬章",2.0,0.8]],"beats":[{"t":"孟子的學生公孫丑是齊國人，從小就聽說齊國有兩位大功臣：管仲和晏子。"},{"who":"公孫丑","t":"老師如果在齊國掌權，能做出管仲、晏子那樣的功業嗎？"},{"who":"孟子","t":"你真是齊國人，只知道管仲和晏子！管仲那一套，我可不想學。","fx":[["focus","孟子"]]},{"who":"公孫丑","t":"管仲讓國君稱霸，晏子讓國君揚名，這樣還不夠嗎？","fx":[["upset","公孫丑"]]},{"who":"孟子","t":"以齊國這麼好的條件，行仁政、讓天下歸心，就像把手掌翻過來一樣！","fx":[["say","孟子"]]},{"t":"公孫丑和萬章聽了，都張大了嘴巴。","fx":[["upset","萬章"]]}],"q":"孟子說：讓齊國行仁政、稱王天下，就像把手掌翻過來一樣。後來比喻事情非常容易做到，用哪個成語？","wrong":[{"w":"難如登天","by":"公孫丑","line":"難如登天是像爬上天一樣難，剛好相反！老師說的是很容易。"},{"w":"手忙腳亂","by":"孟子","line":"手忙腳亂是慌張得不知道怎麼辦。翻手掌這麼輕鬆，哪需要手忙腳亂？"},{"w":"輕而易舉","by":"萬章","line":"輕而易舉是很輕鬆就能做到，意思很接近！不過老師比喻的是翻手掌，是另一個成語。"}],"hint":"「反」是翻轉，「掌」是手掌。","after":"公孫丑覺得老師口氣好大，忍不住又問：連周文王都沒那麼快成功呢……","lesson":{"title":"成語小學堂．易如反掌","text":"原文是「以齊王，由反手也」，「由」通「猶」，是「好像」的意思，後人把它說成這個成語。孟子不想學管仲，是因為他覺得靠武力稱霸，比不上用仁德讓天下歸心。","next":"公孫丑還是不懂：為什麼現在行仁政會這麼容易？孟子說出了原因……"}},{"id":"e52_04","yr":"《孟子．公孫丑上》","place":"孟子的學堂","scene":"house","music":"palace","cast":[["孟子",0.4,-0.8],["公孫丑",-1.2,0.6],["百姓",6.8,0.4,0,null,1],["百姓",7.2,1.2,0,null,1]],"beats":[{"who":"公孫丑","t":"周文王那麼賢明，活到快一百歲，都還沒統一天下呢！","fx":[["upset","公孫丑"]]},{"who":"孟子","t":"時代不一樣了！現在齊國土地大、人口多，雞叫狗叫的聲音一路傳到邊境。","fx":[["focus","孟子"]]},{"who":"孟子","t":"而且百姓被暴政折磨很久了，就像又餓又渴的人。"},{"t":"又餓又渴的人，給他什麼都覺得好吃、好喝。","mv":[["百姓",2.2,0.2],["百姓#2",3.2,1.0]],"fx":[["focus",null]]},{"who":"百姓","t":"真好吃！","fx":[["cheer","百姓"]]},{"who":"百姓#2","t":"真好喝！","fx":[["cheer","百姓#2"]]},{"who":"孟子","t":"這時候行仁政，百姓會高興得像被倒吊的人鬆了綁一樣！"}],"q":"孟子說：時機好的時候行仁政，只要做古人一半的事，功效就能加倍。這種花一半力氣、得到加倍成果的情形，是哪個成語？","wrong":[{"w":"功虧一簣","by":"公孫丑","line":"功虧一簣是只差最後一點就失敗了。老師說的是成功得更多！"},{"w":"勞而無功","by":"百姓","line":"勞而無功是辛苦了卻沒有成果。孟子說的是省力又有效耶！"},{"w":"一舉兩得","by":"孟子","line":"一舉兩得是做一件事得到兩
