      if(k>=1){ movers.splice(movers.indexOf(mv),1); a.userData.walking=false; face(a,x*.3,8); done&&done(); } }); }
  function flagsDown(){ const fl=flags.slice(); const t0=performance.now(); movers.push(function mv(){ const k=Math.min(1,(performance.now()-t0)/900); fl.forEach(f=>{ f.scale.y=1-k; f.position.y-=0; }); if(k>=1) movers.splice(movers.indexOf(mv),1); }); }
  function act(n,type,dur){ const a=find(n); if(!a) return; a.userData.anim={type,t0:performance.now(),dur:dur||1200}; return a; }
  let focusTarget=null;
  function focus(n){ focusTarget = n ? find(n) : null; }
  function burst(at,colors){ const n=90, geo=new THREE.BufferGeometry(), pos=new Float32Array(n*3), vel=[], col=new Float32Array(n*3);
    const c=at||new THREE.Vector3(0,2.5,0), pal=(colors||['#e8b84f','#d9483a','#fff3c4','#4fae8a']).map(h=>new THREE.Color(h));
    for(let i=0;i<n;i++){ pos.set([c.x,c.y,c.z],i*3); const th=Math.random()*Math.PI*2, ph=Math.random()*Math.PI, sp=2+Math.random()*3; vel.push(new THREE.Vector3(Math.sin(ph)*Math.cos(th)*sp,Math.cos(ph)*sp+2,Math.sin(ph)*Math.sin(th)*sp)); const p=pal[i%pal.length]; col.set([p.r,p.g,p.b],i*3); }
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.16,vertexColors:true,transparent:true,depthWrite:false})); world.add(pts); parts.push({pts,vel,t0:performance.now()}); }

  /* ---------- loop ---------- */
  let last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000), t=now/1000; last=now;
    actors.forEach(a=>{ const u=a.userData; let y=u.baseY+Math.abs(Math.sin(t*2+u.phase))*.03+(u.walking?Math.abs(Math.sin(t*11+u.phase))*.16:0), rz=0;
      u.armL.rotation.x=Math.sin(t*1.6+u.phase)*.08; u.armR.rotation.x=-Math.sin(t*1.6+u.phase)*.08; u.head.rotation.z=Math.sin(t*.8+u.phase)*.05;
      if(u.anim){ const k=(now-u.anim.t0)/u.anim.dur;
        if(k>=1) u.anim=null;
        else if(u.anim.type==='talk'){ y+=Math.abs(Math.sin(k*Math.PI*8))*.08; u.armR.rotation.z=-1.2-Math.sin(k*Math.PI*6)*.4; u.head.rotation.x=Math.sin(k*Math.PI*8)*.08; }
        else if(u.anim.type==='jump'){ y+=Math.abs(Math.sin(k*Math.PI*3))*.7; u.armL.rotation.z=2.6; u.armR.rotation.z=-2.6; }
        else if(u.anim.type==='upset'){ rz=Math.sin(k*Math.PI*10)*.12*(1-k); u.armL.rotation.z=1.4; u.armR.rotation.z=-1.4; u.head.rotation.x=-.15; }
        else if(u.anim.type==='sad'){ u.head.rotation.x=.35; y-=.05; }
      } else { u.armL.rotation.z+= ( .35-u.armL.rotation.z)*.15; u.armR.rotation.z+=(-.35-u.armR.rotation.z)*.15; u.head.rotation.x*=.9; }
      a.position.y=y; a.rotation.z=rz; });
    flags.forEach((f,i)=>{ const p=f.geometry.attributes.position; for(let k=0;k<p.count;k++){ const x=p.getX(k); p.setZ(k,Math.sin(t*4+x*4+i)*.08*(x+.45)); } p.needsUpdate=true; });
    fires.forEach((f,i)=>{ f.children.slice(0,3).forEach((c,j)=>{ c.scale.y=1+Math.sin(t*12+j*2+i)*.18; c.scale.x=1+Math.sin(t*9+j)*.1; }); const l=f.children.find(c=>c.isLight); if(l) l.intensity=1+Math.sin(t*15+i)*.25; });
    movers.slice().forEach(m=>m(t));
    for(let i=parts.length-1;i>=0;i--){ const P=parts[i], age=(now-P.t0)/1000, pa=P.pts.geometry.attributes.position; for(let k=0;k<P.vel.length;k++){ P.vel[k].y-=6*dt; pa.setXYZ(k,pa.getX(k)+P.vel[k].x*dt,pa.getY(k)+P.vel[k].y*dt,pa.getZ(k)+P.vel[k].z*dt); } pa.needsUpdate=true; P.pts.material.opacity=Math.max(0,1-age/1.8); if(age>1.8){ world.remove(P.pts); P.pts.geometry.dispose(); P.pts.material.dispose(); parts.splice(i,1); } }
    if(orbit.on){ orbit.a=orbit.base+Math.sin(t*.12)*.22; const c=orbit.center.clone();
      if(focusTarget){ c.lerp(focusTarget.position.clone().add(new THREE.Vector3(0,1.2,0)),.3); }
      const f=pf(); camGoal.pos.set(c.x+Math.sin(orbit.a)*orbit.r*f, orbit.h*f+c.y*.3, c.z+Math.cos(orbit.a)*orbit.r*f); camGoal.look.copy(c); }
    camera.position.lerp(camGoal.pos, RM?1:Math.min(1,dt*1.8)); camLook.lerp(camGoal.look, RM?1:Math.min(1,dt*2.5)); camera.lookAt(camLook);
    renderer.render(scene,camera); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return { ok:true,
    map:(heroSpec,cur)=>buildMap(heroSpec,cur), walkTo,
    level:(L,heroSpec)=>buildLevel(L,heroSpec), study:buildStudy,
    say:n=>{ act(n,'talk',1600); focus(n); }, cheer:n=>act(n,'jump',1500), upset:n=>act(n,'upset',1100), sad:n=>act(n,'sad',2500),
    cheerAll:()=>actors.forEach((a,i)=>setTimeout(()=>{ a.userData.anim={type:'jump',t0:performance.now(),dur:1500}; },i*90)),
    burst:(n,col)=>{ const a=n?find(n):null; burst(a? a.position.clone().add(new THREE.Vector3(0,2.6,0)) : new THREE.Vector3(0,3,0), col?[col,'#ffffff','#e8b84f']:null); },
    arena:buildArena, race:buildRace, podium:buildPodium,
    move, flagsDown, fire:(x,z)=>fire(x,z,1.2), prop:(k,x,z,r)=>{ if(k==='cart'){ cart(x,z,r); horse(x+1.6*Math.cos(r||0),z-1.6*Math.sin(r||0),'#8a5a3a',r||0); }
      else if(k==='screen'){ const c=document.createElement('canvas'); c.width=320; c.height=200; const g=c.getContext('2d'); g.fillStyle='#f4ead3'; g.fillRect(0,0,320,200); g.strokeStyle='#8a6038'; g.lineWidth=10; g.strokeRect(5,5,310,190);
        [90,230].forEach((cx,i)=>{ for(let k=0;k<9;k++){ const a=Math.PI*(1.1+k*.1); g.fillStyle=k%2?'#2f8f7a':'#3fae6a'; g.beginPath(); g.ellipse(cx+Math.cos(a)*50,120+Math.sin(a)*50,14,26,a+Math.PI/2,0,7); g.fill(); g.fillStyle='#e8b84f'; g.beginPath(); g.arc(cx+Math.cos(a)*62,120+Math.sin(a)*62,5,0,7); g.fill(); }
          g.fillStyle='#2f5fa8'; g.beginPath(); g.ellipse(cx,135,16,30,0,0,7); g.fill(); g.beginPath(); g.arc(cx+(i?-6:6),95,11,0,7); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(cx+(i?-9:9),93,4.5,0,7); g.fill(); g.fillStyle='#111'; g.beginPath(); g.arc(cx+(i?-9:9),93,2.2,0,7); g.fill(); });
        const t=new THREE.CanvasTexture(c); const p=new THREE.Group(); add(mesh(new THREE.BoxGeometry(2.6,1.7,.08),[M('#6b4a2c'),M('#6b4a2c'),M('#6b4a2c'),M('#6b4a2c'),new THREE.MeshStandardMaterial({map:t,roughness:.9}),M('#6b4a2c')],0,1.2,0),p);
        [-1.2,1.2].forEach(a=>add(mesh(new THREE.BoxGeometry(.12,.4,.5),M('#5a3a22'),a,.2,0),p)); p.position.set(x,0,z); p.rotation.y=r||0; world.add(p); }
      else if(k==='urn'){ const u=new THREE.Group(); add(mesh(new THREE.CylinderGeometry(.5,.38,1.1,14),M('#7a4a2a'),0,.55,0),u); add(mesh(new THREE.TorusGeometry(.48,.06,6,16),M('#5a3420'),0,1.1,0),u).rotation.x=Math.PI/2; u.position.set(x,0,z); world.add(u); [0,1,2,3].forEach(i=>fire(x+Math.cos(i*1.57)*.85,z+Math.sin(i*1.57)*.85,.55)); } },
    actAll:(n,type)=>actors.filter(a=>a.userData.name===n).forEach((a,i)=>setTimeout(()=>{ a.userData.anim={type,t0:performance.now(),dur:type==='sad'?2500:1500}; },i*120)),
    focus };
})();
</script>
<script>
/* ================= game flow v3: story, race, PK ================= */
let activeQ=null, loopTimer=null;
function stopAll(){ hush(); if(activeQ){ activeQ.stop(); activeQ=null; } if(loopTimer){ clearInterval(loopTimer); loopTimer=null; } try{ aud.pause(); }catch(e){} SND.duck(false); SND.setIntensity(0); }
const heroOf=k=>HEROES[k]||HEROES.yuan;
function musicChip(){ return `<button class="chip ${SND.on?'on':''}" id="mus">♪ ${SND.on?'音樂開':'音樂關'}</button>`; }
function bindMusic(){ const b=document.getElementById('mus'); if(b) b.onclick=()=>{ SND.resume(); SND.toggle(); b.className='chip '+(SND.on?'on':''); b.textContent='♪ '+(SND.on?'音樂開':'音樂關'); }; }
document.addEventListener('pointerdown',()=>SND.resume(),true);
/* 旁白朗讀（瀏覽器內建語音） */
const TTS_OK=(()=>{ try{ return 'speechSynthesis' in window; }catch(e){ return false; } })();
function speak(t){ if(!S.tts||!TTS_OK) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='zh-TW'; u.rate=.95; const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }
function hush(){ try{ if(TTS_OK) speechSynthesis.cancel(); }catch(e){} }
function ttsChip(){ return TTS_OK?`<button class="chip ${S.tts?'on':''}" id="tts">${S.tts?'旁白朗讀開':'旁白朗讀關'}</button>`:''; }
function bindTts(){ const b=document.getElementById('tts'); if(b) b.onclick=()=>{ S.tts=!S.tts; save(); b.className='chip '+(S.tts?'on':''); b.textContent=S.tts?'旁白朗讀開':'旁白朗讀關'; if(!S.tts) hush(); }; }
function warp(text,then){ if(RM){ then(); return; } const w=document.createElement('div'); w.className='warp';
  w.innerHTML=`<span class="ring"></span><span class="ring"></span><span class="ring"></span><div class="bk">成</div><p class="wt">${esc(text)}</p>`;
  document.body.appendChild(w); SND.warp(); setTimeout(then,600); setTimeout(()=>w.remove(),2000); }
function typeInto(el,text,done,speed){ if(RM||!el){ if(el) el.textContent=text; done&&done(); return; }
  el.textContent=''; el.classList.add('caret'); let k=0; const t=setInterval(()=>{ if(!el.isConnected){ clearInterval(t); return; } el.textContent=text.slice(0,++k); if(k%3===0) SND.tick(); if(k>=text.length){ clearInterval(t); el.classList.remove('caret'); done&&done(); } },speed||34); }
function pop(t){ if(RM) return; const d=document.createElement('div'); d.className='pop'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1150); }
function giveItem(k,n){ n=n||1; S.items[k]=(S.items[k]||0)+n; save(); SND.item(); toast(`獲得道具：${ITEMS[k].name} ×${n}`); }
function giveCoins(n){ if(n<=0) return; S.coins+=n; save(); SND.coin(); }
function hudTimer(t,T){ const tm=document.getElementById('tm'); if(!tm) return; tm.firstElementChild.style.width=Math.max(0,t/T*100)+'%'; tm.classList.toggle('low',t<=Math.min(8,T*.3)); }
function bubble(who,text,cls,col){ return `<div class="say fx"><div class="av" ${col?`style="background:${col};color:#fff;border-color:transparent"`:''}>${esc(String(who)[0]||'？')}</div><div class="bubble ${cls||''}"><div class="who">${esc(who)}</div><p>${esc(text)}</p></div></div>`; }
function ruby(I){ return `<div class="ruby">${[...I.w].map((c,k)=>`<span>${c}<small>${I.zy[k]}</small></span>`).join('')}</div>`; }
function card(id,delay){ delay=delay||0; const I=IDIOMS[id];
  return `<div class="card" style="animation-delay:${delay}s"><div class="seal" style="animation-delay:${delay+.55}s">成語<br>卡</div>${ruby(I)}<span class="src">出處：${I.src}</span>
  <dl><dt>意思</dt><dd>${I.m}</dd><dt>用法</dt><dd>${I.u}<br>例：${I.ex}</dd><dt>小知識</dt><dd>${I.x}</dd></dl></div>`; }

/* ---------- questions: 480 idioms, five kinds, fresh distractors every time ---------- */
const bankOf=w=>BANK.find(b=>b.w===w);
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function pickOthers(exclude,n){ const out=[], ex=new Set(exclude); let g=0; while(out.length<n && g++<800){ const b=BANK[Math.floor(Math.random()*BANK.length)]; if(!ex.has(b.w)){ ex.add(b.w); out.push(b); } } return out; }
const PROMPTS={usage:['這句話缺了哪個成語？','把句子填完整，該放哪個成語？','哪個成語放進這句話最合適？'],
  m2w:['哪個成語的意思是：「{m}」？','成語書上寫著「{m}」，說的是哪個成語？','這是哪個成語的解釋？「{m}」'],
  w2m:['「{w}」是什麼意思？','哪一個是「{w}」的正確解釋？','考考你：「{w}」指的是什麼？']};
const TYPES=['usage','m2w','w2m','quick'];
function genQ(type,b,n){
  if(type==='usage'&&!b.x) type='m2w';
  if(type==='usage'){ const o=pickOthers([b.w],n-1); return {kind:'usage',w:b.w,b,prompt:pickOne(PROMPTS.usage),sentence:b.x,answer:b.w,hint:b.m,options:shuffle([{w:b.w},...o.map(x=>({w:x.w,why:`「${x.w}」的意思是：${x.m}`}))])}; }
  if(type==='m2w'){ const o=pickOthers([b.w],n-1); return {kind:'m2w',w:b.w,b,prompt:pickOne(PROMPTS.m2w).replace('{m}',b.m),answer:b.w,hint:b.x?('例句：'+b.x.replace(b.w,'○○○○')):'想想這個成語的故事',options:shuffle([{w:b.w},...o.map(x=>({w:x.w,why:`「${x.w}」的意思是：${x.m}`}))])}; }
  if(type==='w2m'){ const o=pickOthers([b.w],n-1); return {kind:'w2m',w:b.w,b,prompt:pickOne(PROMPTS.w2m).replace('{w}',b.w),answer:b.m,hint:b.x?('例句：'+b.x):'想想這個成語的故事',options:shuffle([{w:b.m},...o.map(x=>({w:x.m,why:`這是「${x.w}」的意思。`}))])}; }
  const mm=(b.q||'').match(/^(.*?)（A）(.*?)（B）(.*)$/), al=((b.a||'').match(/（([AB])）/)||[])[1];
  if(!mm||!al) return genQ('m2w',b,n);
  const A=mm[2].trim(), B=mm[3].trim(), ans=al==='A'?A:B, wr=al==='A'?B:A;
  return {kind:'quick',w:b.w,b,prompt:'快問：'+mm[1].trim(),answer:ans,hint:b.m,options:shuffle([{w:ans},{w:wr,why:`再想想「${b.w}」的意思：${b.m}`}])};
}
function sceneQ(i,n){ const L=LEVELS[i], I=IDIOMS[L.id], hand=shuffle(L.wrong).slice(0,n===3?1:2), by=(L.cast.find(c=>!specOf(c[0]).nolabel)||L.cast[0])[0];
  const rand=pickOthers([I.w,...L.wrong.map(w=>w.w)],n-1-hand.length);
  return {kind:'scene',w:I.w,id:L.id,L,prompt:L.q,answer:I.w,hint:L.hint,
    options:shuffle([{w:I.w},...hand.map(w=>({w:w.w,why:w.line,by:w.by})),...rand.map(x=>({w:x.w,why:`「${x.w}」是說${x.m.replace(/。$/,'')}，和現在的情況不一樣喔！`,by}))])}; }
function randomQ(scope,n){
  if(scope==='ch'||Math.random()<.15){ if(Math.random()<.4) return sceneQ(Math.floor(Math.random()*LEVELS.length),n); return genQ(pickOne(TYPES),bankOf(IDIOMS[pickOne(LEVELS).id].w),n); }
  return genQ(pickOne(TYPES),pickOne(BANK),n); }
function qStream(scope,n){ const seen=new Set(); return ()=>{ let q,g=0; do{ q=randomQ(scope,n); }while(seen.has(q.kind+q.w)&&g++<40); seen.add(q.kind+q.w); return q; }; }
function promptText(q){ return q.kind==='scene'?`【${q.L.place}】${q.prompt}`:q.prompt; }
const idOf=q=>q.id||null;
function answerLine(q){ const b=q.b||bankOf(q.w); return `「${q.w}」：${b?b.m:''}`; }
function scopePick(){ const sc=S.scope||'all'; return `<div><p class="label">題目範圍</p><div class="seg" id="scope"><button data-s="ch" class="${sc==='ch'?'sel':''}">本章成語</button><button data-s="all" class="${sc==='all'?'sel':''}">60 集全部 480 個成語</button></div></div>`; }
function bindScope(){ ui.querySelectorAll('#scope button').forEach(b=>b.onclick=()=>{ if(S.tab==='pk'&&typeof keepPkNames==='function') keepPkNames(); S.scope=b.dataset.s; save(); SND.tap(); home(); }); }
function bonusRound(L){ const I=IDIOMS[L.id], b=bankOf(I.w), D=DIFFS[S.diff], types=shuffle(TYPES.filter(t=>t!=='usage'||b.x)).slice(0,2); let k=0;
  const box=document.getElementById('bonusBox');
  const step=()=>{ if(k>=types.length){ box.innerHTML=`<p class="narr fx">加分題完成！</p>`; return; }
    const q=genQ(types[k],b,D.n); box.innerHTML=`${bubble('加分題 '+(k+1)+' / 2',q.prompt)}<div id="bq"></div>`;
    activeQ=QBox(document.getElementById('bq'),q,{time:0,hintAfter:Math.min(D.hint,2),items:null,allowed:[],
      onWrong:(st,o)=>{ document.querySelector('#bq .qf').innerHTML=bubble('成語書',o.why||'再想想','bad'); },
      onRight:st=>{ if(st.tries===1){ giveCoins(10); pop('+10 銅錢'); } k++; setTimeout(step,900); }});
    try{ box.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){} };
  step(); }

function itemsHTML(bag,allowed,ctx){ return `<div class="items">${allowed.map(k=>{ const it=ITEMS[k], c=bag[k]||0, ok=c>0 && !(k==='glass'&&!ctx.time&&!ctx.glass) && !(k==='seal'&&!ctx.seal);
  return `<button class="item" data-item="${k}" ${ok?'':'disabled'} title="${esc(it.note)}"><span class="ic" style="background:${it.c}">${it.ic}</span>${it.name}<b>×${c}</b></button>`; }).join('')}</div>`; }

/* the answer box shared by every mode: options, props, timer */
function QBox(el,q,cfg){
  const st={tries:0,wrongs:0,shield:false,double:false,timeLeft:cfg.time||0,hint:false,done:false,pausedUntil:0}; let iv=null;
  const removed=cfg.removed||new Set();
  el.innerHTML=`${q.sentence?`<p class="sent fx">${esc(q.sentence).replace(esc(q.answer),'<b>？？？？</b>')}</p>`:''}
    <div class="opts ${q.options.some(o=>o.w.length>6)?'long':(q.options.length<=3?'three':'')}">${q.options.map((o,k)=>`<button class="opt ${o.w.length>6?'long':''} ${removed.has(o.w)?'wrong':''}" ${removed.has(o.w)?'disabled':''} style="animation-delay:${k*.07}s" data-w="${esc(o.w)}">${esc(o.w)}</button>`).join('')}</div>
    <div class="qi"></div><div class="qf"></div><div class="qh"></div>`;
  const qf=el.querySelector('.qf'), qi=el.querySelector('.qi'), qh=el.querySelector('.qh');
  const renderItems=()=>{ if(st.done||!cfg.items){ qi.innerHTML=''; return; } qi.innerHTML=itemsHTML(cfg.items,cfg.allowed,{time:cfg.time,glass:!!cfg.onGlass,seal:!!cfg.onSeal}); qi.querySelectorAll('.item').forEach(b=>b.onclick=()=>useItem(b.dataset.item)); };
  const showHint=()=>{ if(st.hint) return; st.hint=true; qh.innerHTML=`<p class="hint fx">提示：${esc(q.hint)}</p>`; };
  if(cfg.hintAfter===0) showHint();
  const live=()=>[...el.querySelectorAll('.opt')].filter(b=>!b.disabled&&b.dataset.w!==q.answer);
  function useItem(k){
    if(st.done||!(cfg.items[k]>0)) return;
    if(k==='bag'){ const l=live(); if(!l.length) return; const b=l[Math.floor(Math.random()*l.length)]; b.disabled=true; b.classList.add('gone'); SND.item(); toast('錦囊妙計：刪掉一個錯的選項'); }
    else if(k==='slip'){ if(st.hint){ toast('提示已經出現囉'); return; } showHint(); SND.item(); }
    else if(k==='mirror'){ const l=live(); if(!l.length) return; const b=l[Math.floor(Math.random()*l.length)], o=q.options.find(x=>x.w===b.dataset.w); b.disabled=true; b.classList.add('gone'); SND.shield(); qf.innerHTML=bubble('銅鏡',o.why||'這個不是答案。'); }
    else if(k==='shield'){ if(st.shield){ toast('護心鏡已經戴上了'); return; } st.shield=true; SND.shield(); toast('護心鏡：這題選錯一次不算'); }
    else if(k==='glass'){ if(cfg.onGlass) cfg.onGlass(); else if(cfg.time) st.timeLeft+=10; else return; SND.item(); toast('沙漏：多 10 秒'); }
    else if(k==='flag'){ if(st.double){ toast('令旗已經舉起來了'); return; } st.double=true; SND.flag(); toast('令旗：這題加倍'); }
    else if(k==='tally'){ cfg.items[k]--; save(); SND.skip(); finish('skip'); return; }
    else if(k==='seal'){ if(!cfg.onSeal) return; cfg.onSeal(st); SND.freeze(); }
    cfg.items[k]--; save(); renderItems(); cfg.onItem&&cfg.onItem(k);
  }
  function markAnswer(){ const r=[...el.querySelectorAll('.opt')].find(x=>x.dataset.w===q.answer); if(r) r.classList.add('right'); }
  function finish(kind,b){ if(st.done) return; st.done=true; stopT(); el.querySelectorAll('.opt').forEach(x=>x.disabled=true); renderItems();
    if(kind==='right'){ b.classList.add('right'); cfg.onRight&&cfg.onRight(st); }
    else if(kind==='skip'){ markAnswer(); cfg.onSkip&&cfg.onSkip(st); }
    else if(kind==='quiet'){ }
    else { if(cfg.reveal!==false) markAnswer(); cfg.onFail&&cfg.onFail(st); } }
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(st.done) return; const o=q.options.find(x=>x.w===b.dataset.w);
    if(o.w===q.answer){ st.tries++; SND.right(); finish('right',b); return; }
    SND.wrong(); let counted=true; if(st.shield){ st.shield=false; counted=false; SND.shield(); toast('護心鏡擋下了這一次！'); } else { st.tries++; st.wrongs++; }
    b.classList.add('wrong','shake'); b.disabled=true; removed.add(o.w);
    if(cfg.onWrong && cfg.onWrong(st,o,counted)===false) return;
    if(st.wrongs>=cfg.hintAfter) showHint();
    if(!live().length && !st.done && cfg.autoEnd){ finish('fail'); } });
  function stopT(){ if(iv){ clearInterval(iv); iv=null; } if(cfg.time) SND.setIntensity(0); }
  if(cfg.time){ iv=setInterval(()=>{ if(performance.now()<st.pausedUntil) return; st.timeLeft-=.1; cfg.onTick&&cfg.onTick(st.timeLeft,cfg.time);
      if(st.timeLeft<=Math.min(8,cfg.time*.35)) SND.setIntensity(2);
      if(st.timeLeft>0&&st.timeLeft<=5&&Math.abs(st.timeLeft-Math.round(st.timeLeft))<.05) SND.tick();
      if(st.timeLeft<=0){ SND.timeUp(); const r=cfg.onTimeout?cfg.onTimeout(st):'end'; if(r==='end') finish('fail'); else if(r==='quiet') finish('quiet'); else { st.timeLeft=cfg.time; SND.setIntensity(0); } } },100); }
  renderItems();
  return {st,stop:stopT,end:k=>finish(k||'fail'),hint:showHint,refresh:renderItems,removed};
}

/* ---------- story beats: history first, then the idiom ---------- */
function runFx(list){ (list||[]).forEach(f=>{ const [k,a,b,c]=f;
  if(k==='focus') W3.focus(a); else if(k==='say') W3.say(a); else if(k==='cheer') W3.cheer(a); else if(k==='upset') W3.upset(a); else if(k==='sad') W3.sad(a);
  else if(k==='sadAll') W3.actAll(a,'sad'); else if(k==='cheerAll') W3.actAll(a,'jump'); else if(k==='burst') W3.burst(a,b); else if(k==='flagsDown'){ W3.flagsDown(); SND.shield&&SND.shield(); } else if(k==='fire') W3.fire(a,b); else if(k==='prop') W3.prop(a,b,c,f[4]); }); }
function playBeats(L,done){
  const B=L.beats||[{t:L.narr}]; let k=0;
  ui.innerHTML=`<div class="beat"><div class="row" style="justify-content:space-between"><span class="eyebrow">歷史故事</span><button class="link" id="bskip">跳過故事</button></div>
    <div class="prog">${B.map(()=>'<i></i>').join('')}</div><div id="bt"></div><button class="btn wide" id="go" style="visibility:hidden">下一步</button></div>`;
  const bt=document.getElementById('bt'), go=document.getElementById('go');
  function step(){
    if(k>=B.length){ hush(); done(); return; }
    const b=B[k]; ui.querySelectorAll('.prog i').forEach((x,j)=>x.classList.toggle('on',j<=k)); k++;
    (b.mv||[]).forEach(([n,x,z,y])=>W3.move(n,x,z,null,y)); runFx(b.fx);
    go.style.visibility='hidden'; speak(b.t);
    if(b.who){ const nm=b.who.replace(/#\d+$/,''); W3.say(b.who); const c=specOf(nm); bt.innerHTML=bubble(nm,'','',c&&c.robe); typeInto(bt.querySelector('.bubble p'),b.t,show); }
    else { if(!(b.fx||[]).some(f=>f[0]==='focus')) W3.focus(null); bt.innerHTML=`<p class="narr fx"></p>`; typeInto(bt.querySelector('p'),b.t,show); }
  }
  function show(){ go.textContent=k>=B.length?'遇到成語挑戰！':'下一步'; go.style.visibility='visible'; go.onclick=()=>{ SND.tap(); step(); }; }
  document.getElementById('bskip').onclick=()=>{ hush(); B.forEach(b=>(b.mv||[]).forEach(([n,x,z,y])=>W3.move(n,x,z,null,y))); done(); };
  setTimeout(step, RM?0:900);
}

  const step=()=>{
    if(k>=ids.length){ const F=(S.final[CH.key]=S.final[CH.key]||{}); F[S.diff]=Math.max(F[S.diff]||0,score); save(); SND.victory(); W3.cheer('hero'); W3.burst('hero'); setTimeout(()=>W3.burst(),500); giveCoins(score*5);
      ui.innerHTML=`<div class="fx" style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center"><span class="eyebrow">回到現代</span><h1 style="font-size:30px">成語書闔上了</h1>
        <p>${H.name}睜開眼睛，已經坐回自己的書桌前。手上的成語書，多了${ids.length}張閃閃發亮的卡片。</p><p>終點挑戰一次就答對：<b>${score} / ${ids.length}</b> 題，獲得銅錢 ${score*5}</p>
        <p class="small">${(()=>{ const LL=CHAPTERS.filter(c=>c.line===CH.line), j=LL.findIndex(c=>c.key===CH.key), n=LL[j+1]; return n?('下一章：'+n.title+(n.soon?'（製作中）':'，已經開放！')):'恭喜完成所有章節！'; })()}</p><div class="row" style="justify-content:center"><button class="btn ghost" id="bk">看我的成語書</button><button class="btn" id="hm">回地圖</button></div></div>`;
      if(score>=6) setTimeout(()=>giveItem('glass',2),1200);
      document.getElementById('hm').onclick=home; document.getElementById('bk').onclick=book; sheetTop(); return; }
    const q=genQ(pickOne(TYPES),bankOf(IDIOMS[ids[k]].w),D.n);
    ui.innerHTML=`${bubble(H.name+'．第 '+(k+1)+' / '+ids.length+' 題','成語書在現代也會出題！'+q.prompt,'',H.robe)}<div id="qb"></div>`;
    W3.say('hero');
    activeQ=QBox(document.getElementById('qb'),q,{time:0,hintAfter:Math.min(D.hint,2),items:S.items,allowed:['bag','slip','mirror','shield'],
      onWrong:(st,o)=>{ W3.upset('hero'); document.querySelector('#qb .qf').innerHTML=bubble('成語書',o.why,'bad'); },
      onRight:st=>{ W3.cheer('hero'); if(st.tries===1) score++; nextBtn(); }});
    function nextBtn(){ document.querySelector('#qb .qf').innerHTML=`<div class="row" style="justify-content:flex-end"><button class="btn" id="nx">${k===ids.length-1?'看結果':'下一題'}</button></div>`; document.getElementById('nx').onclick=()=>{ k++; step(); }; }
    sheetTop();
  };
  step(); sheetShow();
}

/* ---------- race ---------- */
function race(){ gcEvent('計時競賽');
  stopAll(); const D=DIFFS[S.diff], H=heroOf(S.hero);
  SND.setMode('race'); W3.race(H);
  let total=90, score=0, combo=0, maxCombo=0, right=0, answered=0, nextQ=qStream(S.scope||'all',D.n), pausedUntil=0, over=false;
  hud.innerHTML=`<div class="l"><span class="chip place">計時競賽</span><div class="timer" id="tm"><i style="width:100%"></i></div></div><div class="r"><span class="chip">${D.name}</span>${musicChip()}<button class="chip" id="back">結束</button></div>`;
  bindMusic(); document.getElementById('back').onclick=()=>end();
  ui.innerHTML=`<div class="row" style="justify-content:space-between"><span class="combo" id="combo"></span><span class="big" id="sc">0 分</span></div><div class="say"><div class="av me" style="background:${H.robe}">${H.name[1]}</div><div class="bubble"><div class="who" id="qn">第 1 題</div><p id="qp"></p></div></div><div id="qb"></div>`;
  sheetShow(); sheetTop();
  const paint=()=>{ document.getElementById('sc').textContent=score+' 分'; document.getElementById('combo').textContent=combo>=2?`連擊 ×${combo}`:''; };
  loopTimer=setInterval(()=>{ if(over||performance.now()<pausedUntil) return; total-=.1; hudTimer(total,90); if(total<=12) SND.setIntensity(2); else SND.setIntensity(combo>=3?1:0);
    if(total<=5&&total>0&&Math.abs(total-Math.round(total))<.05) SND.tick(); if(total<=0){ SND.timeUp(); end(); } },100);
  function next(){ if(over) return; const q=nextQ(); answered++;
    document.getElementById('qn').textContent=`第 ${answered} 題`; document.getElementById('qp').textContent=promptText(q);
    activeQ=QBox(document.getElementById('qb'),q,{time:0,hintAfter:D.hint,items:S.items,allowed:['bag','slip','mirror','shield','glass','flag','tally','seal'],
      onGlass:()=>{ total+=10; }, onSeal:()=>{ pausedUntil=performance.now()+5000; toast('定身符：時間暫停 5 秒'); },
      onWrong:(st,o,counted)=>{ if(counted){ total-=5; combo=0; paint(); W3.upset('hero'); pop('−5 秒'); } document.querySelector('#qb .qf').innerHTML=bubble(o.by||'成語書',o.why||'不是這個喔','bad'); },
      onRight:st=>{ combo++; maxCombo=Math.max(maxCombo,combo); right++; const pts=Math.round((100+Math.min(combo-1,5)*20)*(st.double?2:1)/st.tries); score+=pts; paint(); pop('+'+pts);
        W3.cheer('hero'); if(combo>=3){ SND.combo(combo); W3.burst('hero'); } setTimeout(next,650); },
      onSkip:()=>setTimeout(next,350)});
    sheetTop(); }
  function end(){ if(over) return; over=true; stopAll(); const b=(S.race[S.diff]=S.race[S.diff]||[]); const rec={score,right,hero:H.name}; b.push(rec); b.sort((x,y)=>y.score-x.score); S.race[S.diff]=b.slice(0,5); const top=S.race[S.diff][0]===rec;
    const coins=Math.floor(score/20); giveCoins(coins); save(); SND.setMode('podium'); top?SND.victory():SND.clear(); W3.cheer('hero'); W3.burst('hero');
    hud.innerHTML=`<div class="l"><span class="chip place">競賽結束</span></div><div class="r">${musicChip()}</div>`; bindMusic();
    ui.innerHTML=`<div class="fx" style="display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center"><span class="eyebrow">${top?'新紀錄！':'競賽結束'}</span><h1 style="font-size:40px">${score} 分</h1>
      <p>答對 ${right} 題．最高連擊 ${maxCombo}．獲得銅錢 ${coins}</p><div class="row" style="justify-content:center"><button class="btn ghost" id="hm">回主畫面</button><button class="btn" id="ag">再比一次</button></div></div>`;
    document.getElementById('hm').onclick=home; document.getElementById('ag').onclick=race; sheetTop(); }
  next();
}

/* ---------- PK ---------- */
function pkRounds(){ const P=S.pk; const ok=P.mode==='turn'?[2,3,5]:[6,8,12]; if(!ok.includes(P.rounds)) P.rounds=P.mode==='turn'?3:8; return P.rounds; }
function pkSetup(diffPick){ const P=S.pk; pkRounds();
  return `<div><p class="label">人數（同一台裝置輪流或一起玩）</p><div class="seg" id="pkn">${[2,3,4].map(n=>`<button data-n="${n}" class="${P.n===n?'sel':''}">${n} 人</button>`).join('')}</div></div>
   <div class="players">${P.players.slice(0,P.n).map((p,i)=>`<div class="pl" style="--c:${PCOL[i]}"><span class="dot" style="background:${heroOf(p.hero).robe}"></span><input id="pn${i}" maxlength="6" value="${esc(p.name)}" aria-label="玩家 ${i+1} 的名字"><button class="hb" data-i="${i}">${heroOf(p.hero).name} ▸</button></div>`).join('')}</div>
   <div><p class="label">比賽方式</p><div class="seg" id="pkm"><button data-m="turn" class="${P.mode==='turn'?'sel':''}">輪流答題</button><button data-m="buzz" class="${P.mode==='buzz'?'sel':''}">搶答對決</button></div>
   <p class="small" style="margin-top:6px">${P.mode==='turn'?'每人輪流回答自己的題目，答得越快分數越高。':'大家看同一題，按自己顏色的搶答鍵，搶到的人回答；答錯扣分，換別人搶。'}</p></div>
   <div><p class="label">題數</p><div class="seg" id="pkr">${(P.mode==='turn'?[2,3,5]:[6,8,12]).map(r=>`<button data-r="${r}" class="${P.rounds===r?'sel':''}">${P.mode==='turn'?'每人 '+r+' 題':r+' 題'}</button>`).join('')}</div></div>
   ${scopePick()}${diffPick}<p class="small">每位玩家開場都有一份比賽道具：錦囊、竹簡、令旗、定身符、護心鏡各 1 個，不會用掉自己道具袋裡的。</p>
   <button class="btn wide" id="startPk">開始 PK</button>`; }
function bindPkSetup(){ const P=S.pk;
  window.keepPkNames=()=>P.players.slice(0,P.n).forEach((p,i)=>{ const v=document.getElementById('pn'+i); if(v) p.name=(v.value.trim()||`玩家${'一二三四'[i]}`).slice(0,6); });
  const keepNames=()=>P.players.slice(0,P.n).forEach((p,i)=>{ const v=document.getElementById('pn'+i); if(v) p.name=(v.value.trim()||`玩家${'一二三四'[i]}`).slice(0,6); });
  ui.querySelectorAll('#pkn button').forEach(b=>b.onclick=()=>{ keepNames(); P.n=+b.dataset.n; save(); SND.tap(); home(); });
  ui.querySelectorAll('#pkm button').forEach(b=>b.onclick=()=>{ keepNames(); P.mode=b.dataset.m; P.rounds=0; pkRounds(); save(); SND.tap(); home(); });
  ui.querySelectorAll('#pkr button').forEach(b=>b.onclick=()=>{ keepNames(); P.rounds=+b.dataset.r; save(); SND.tap(); home(); });
  ui.querySelectorAll('.pl .hb').forEach(b=>b.onclick=()=>{ keepNames(); const ks=Object.keys(HEROES), p=P.players[+b.dataset.i]; p.hero=ks[(ks.indexOf(p.hero)+1)%ks.length]; save(); SND.tap(); home(); });
  ui.querySelectorAll('.pl input').forEach(inp=>inp.onchange=()=>{ keepNames(); save(); });
  document.getElementById('startPk').onclick=()=>{ keepNames(); save(); warp('擂台比武，開始！',pk); };
}
function scoreboard(pl,turn,out){ return `<div class="score">${pl.map(p=>`<div class="sc ${turn===p.i?'turn':''} ${out&&out.has(p.i)?'out':''}" style="--c:${PCOL[p.i]}">${esc(p.name)}<b>${p.score}</b></div>`).join('')}</div>`; }
function pk(){ gcEvent('多人PK');
  stopAll(); const P=S.pk, D=DIFFS[S.diff];
  const pl=P.players.slice(0,P.n).map((p,i)=>({name:p.name,hero:p.hero,i,score:0,right:0,kit:{bag:1,slip:1,flag:1,seal:1,shield:1}}));
  SND.setMode('arena'); W3.arena(pl);
  hud.innerHTML=`<div class="l"><span class="chip place">多人 PK．${P.mode==='turn'?'輪流答題':'搶答對決'}</span><div class="timer" id="tm"><i style="width:100%"></i></div></div><div class="r"><span class="chip">${D.name}</span>${musicChip()}<button class="chip" id="back">結束</button></div>`;
  bindMusic(); document.getElementById('back').onclick=()=>pkResults(pl);
  sheetShow();
  (P.mode==='turn'?pkTurn:pkBuzz)(pl,D,P.rounds);
}
function pkTurn(pl,D,R){
  const nextQ=qStream(S.scope||'all',D.n); let n=0, halve=false; const total=R*pl.length, T=D.time||20;
  function turn(){
    if(n>=total){ pkResults(pl); return; }
    const p=pl[n%pl.length], round=Math.floor(n/pl.length)+1, q=nextQ(), t=halve?Math.ceil(T/2):T; halve=false;
    W3.say('P'+p.i); SND.buzz(p.i);
    ui.innerHTML=`${scoreboard(pl,p.i)}<p class="small">第 ${round} / ${R} 輪．輪到 <b style="color:${PCOL[p.i]}">${esc(p.name)}</b>（${t} 秒）</p>
      ${bubble(p.name,promptText(q),'',PCOL[p.i])}<div id="qb"></div>`;
    activeQ=QBox(document.getElementById('qb'),q,{time:t,hintAfter:D.hint,items:p.kit,allowed:['bag','slip','flag','shield','seal'],onTick:hudTimer,
      onSeal:()=>{ halve=true; toast(`定身符：下一位的時間減半`); },
      onWrong:(st,o)=>{ W3.upset('P'+p.i); document.querySelector('#qb .qf').innerHTML=bubble(o.by||'成語書',o.why||'不是這個喔','bad'); },
      onTimeout:()=>'end',
      onRight:st=>{ const pts=Math.round((100+Math.max(0,st.timeLeft)*4)*(st.double?2:1)/st.tries); p.score+=pts; p.right++; W3.cheer('P'+p.i); W3.burst('P'+p.i,PCOL[p.i]); pop(`${p.name} +${pts}`); after(true); },
      onFail:()=>{ W3.sad('P'+p.i); SND.heart(); after(false); }});
    function after(ok){ n++; const nx=n<total?pl[n%pl.length]:null;
      document.querySelector('#qb .qf').innerHTML=`<p class="narr fx">${ok?'答對了！':'可惜！答案是'}${esc(answerLine(q))}</p>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="nx" ${nx?`style="background:${PCOL[nx.i]}"`:''}>${nx?`換 ${esc(nx.name)} 答題`:'看比賽結果'}</button></div>`;
      document.querySelector('.score').outerHTML=scoreboard(pl,-1); document.getElementById('nx').onclick=turn; }
    sheetTop();
  }
  turn();
}
function pkBuzz(pl,D,Q){
  const nextQ=qStream(S.scope||'all',D.n); let n=0;
  function question(){
    if(n>=Q){ pkResults(pl); return; }
    const q=nextQ(), out=new Set(), removed=new Set(); let lockUntil={}, buzzT=20, iv=null, lastSig='';
    ui.innerHTML=`${scoreboard(pl,-1,out)}<p class="small">第 ${n+1} / ${Q} 題．看完題目就搶答！</p>${bubble('擂台主持',promptText(q))}${q.sentence?`<p class="sent">${esc(q.sentence).replace(esc(q.answer),'<b>？？？？</b>')}</p>`:''}
      <div class="buzz" id="bz"></div><div class="seals" id="sl"></div><div id="qb"></div>`;
    W3.focus(null);
    function paintBuzz(){ const bz=document.getElementById('bz'); if(!bz) return; const now=performance.now();
      bz.innerHTML=pl.map(p=>{ const wait=Math.max(0,(lockUntil[p.i]||0)-now); return `<button data-i="${p.i}" style="--c:${PCOL[p.i]}" ${out.has(p.i)||wait>0?'disabled':''}>${esc(p.name)}${wait>0?`（${Math.ceil(wait/1000)}）`:''} 搶答</button>`; }).join('');
      bz.querySelectorAll('button').forEach(b=>b.onclick=()=>grab(+b.dataset.i));
      const sl=document.getElementById('sl'); sl.innerHTML=pl.filter(p=>p.kit.seal>0&&!out.has(p.i)).map(p=>`<button data-i="${p.i}" style="--c:${PCOL[p.i]}">${esc(p.name)} 用定身符</button>`).join('');
      sl.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=+b.dataset.i; pl[k].kit.seal--; SND.freeze(); pl.forEach(o=>{ if(o.i!==k) lockUntil[o.i]=performance.now()+2000; }); toast(`${pl[k].name} 用了定身符：其他人慢 2 秒`); paintBuzz(); }); }
    function startBuzzClock(){ clearInterval(iv); buzzT=20; iv=setInterval(()=>{ buzzT-=.1; hudTimer(buzzT,20); if(buzzT<=7) SND.setIntensity(2); const now=performance.now(); let sig=''; Object.keys(lockUntil).forEach(k=>{ if(lockUntil[k]<=now) delete lockUntil[k]; else sig+=k+':'+Math.ceil((lockUntil[k]-now)/1000)+','; }); if(sig!==lastSig){ lastSig=sig; paintBuzz(); } if(buzzT<=0){ clearInterval(iv); SND.timeUp(); reveal('沒有人搶答'); } },100); loopTimer=iv; }
    function grab(k){ clearInterval(iv); SND.setIntensity(0); const p=pl[k]; SND.buzz(k); W3.say('P'+k); W3.cheer('P'+k);
      document.getElementById('bz').innerHTML=`<p class="narr" style="grid-column:1/-1;color:${PCOL[k]}">${esc(p.name)} 搶到了！</p>`; document.getElementById('sl').innerHTML='';
      activeQ=QBox(document.getElementById('qb'),q,{time:D.time||15,hintAfter:D.hint,items:p.kit,allowed:['bag','slip','flag','shield'],onTick:hudTimer,removed,
        onWrong:(st,o,counted)=>{ if(!counted) return; p.score-=50; W3.upset('P'+k); pop(`${p.name} −50`); out.add(k); activeQ.end('quiet'); back(o); return false; },
        onTimeout:()=>{ p.score-=50; W3.upset('P'+k); out.add(k); back(null); return 'quiet'; },
        onRight:st=>{ const pts=100*(st.double?2:1); p.score+=pts; p.right++; W3.cheerAll(); W3.burst('P'+k,PCOL[k]); pop(`${p.name} +${pts}`); reveal(`${p.name} 答對了！`,true); }}); sheetTop(); }
    function back(o){ setTimeout(()=>{ if(out.size>=pl.length){ reveal('大家都答錯了'); return; }
        document.querySelector('.score').outerHTML=scoreboard(pl,-1,out); document.getElementById('qb').innerHTML=o?bubble(o.by||'成語書',o.why||'不是這個喔','bad'):bubble('擂台主持','時間到！換別人搶答。','bad'); paintBuzz(); startBuzzClock(); },700); }
    function reveal(msg,ok){ clearInterval(iv); SND.setIntensity(0); if(!ok) SND.heart(); n++;
      const bz=document.getElementById('bz'); if(bz) bz.innerHTML=''; const sl=document.getElementById('sl'); if(sl) sl.innerHTML='';
      document.querySelector('.score').outerHTML=scoreboard(pl,-1);
      document.getElementById('qb').innerHTML=`<p class="narr fx">${esc(msg)}答案是${esc(answerLine(q))}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="nx">${n<Q?'下一題':'看比賽結果'}</button></div>`;
      document.getElementById('nx').onclick=question; }
    paintBuzz(); startBuzzClock(); sheetTop();
  }
  question();
}
function pkResults(pl){
  stopAll(); const ranked=pl.slice().sort((a,b)=>b.score-a.score); const tie=ranked.length>1&&ranked[0].score===ranked[1].score;
  W3.podium(ranked); SND.setMode('podium'); SND.victory(); setTimeout(()=>W3.cheer('P'+ranked[0].i),400); giveCoins(20);
  hud.innerHTML=`<div class="l"><span class="chip place">比賽結果</span></div><div class="r">${musicChip()}</div>`; bindMusic();
  ui.innerHTML=`<div class="fx" style="display:flex;flex-direction:column;gap:12px"><span class="eyebrow">擂台比武結束</span><h1 style="font-size:30px">${tie?'平手！':`冠軍：${esc(ranked[0].name)}！`}</h1>
    <div class="rank">${ranked.map((p,r)=>`<div style="--c:${PCOL[p.i]}"><span>${['冠軍','亞軍','季軍','第四名'][r]}．${esc(p.name)}（${heroOf(p.hero).name}）　答對 ${p.right} 題</span><b class="big">${p.score}</b></div>`).join('')}</div>
    <p class="small">一起玩獲得銅錢 20，已放進道具袋旁的錢包。</p>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" id="hm">回主畫面</button><button class="btn" id="ag">再比一場</button></div></div>`;
  document.getElementById('hm').onclick=home; document.getElementById('ag').onclick=()=>warp('擂台比武，開始！',pk); sheetShow(); sheetTop();
}

    b.style.top=Math.max(r.top-14,150)+'px'; b.style.left='50%'; el.appendChild(b); sayBox=b;
    const hw=b.offsetWidth/2+8; b.style.left=Math.min(Math.max(r.left+r.width/2,hw),innerWidth-hw)+'px';
    try{ if(sayAu) sayAu.pause(); sayAu=new Audio(`img/cover/say/w${String(i).padStart(2,'0')}.mp3`); sayAu.play().catch(()=>{}); }catch(_){ }
    sayT=setTimeout(()=>{ b.classList.add('bye'); setTimeout(()=>{ b.remove(); if(sayBox===b) sayBox=null; },620); },3200); };
  const setM=(m,[k,nm])=>{ m.dataset.k=k; m.style.backgroundImage=`url(img/cover/m_${k}.jpg)`; const b=m.querySelector('b'); if(b) b.textContent=nm; };
  const mk=(withName)=>{ const m=document.createElement('div'); m.className='m'; if(withName) m.innerHTML='<b></b>';
    m.onclick=e=>{ e.stopPropagation(); SND.resume&&SND.resume(); SND.coin&&SND.coin(); const r=m.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2); sayIdiom(m,r); gcEvent('點小動物');
      m.classList.remove('wig'); void m.offsetWidth; m.classList.add('wig'); setTimeout(()=>m.classList.remove('wig'),650); }; return m; };
  const slots=pos.map((p,i)=>{ const m=mk(true); setM(m,nextM()); m.style.left=p[0]+'%'; m.style.top=p[1]+'%'; if(i>5) m.classList.add('xw'); m.style.translate='-50% -50%'; m.style.animationDelay=`${1.6+i*.15}s, ${2.2+i*.37}s`; st.appendChild(m); return m; });
  let si=0; const swap=setInterval(()=>{ if(!el.isConnected){ clearInterval(swap); return; } const vis=slots.filter(x=>x.offsetParent); if(!vis.length) return; const m=vis[si%vis.length]; si+=Math.random()<.5?1:2; m.classList.remove('mpop'); void m.offsetWidth; setM(m,nextM()); m.classList.add('mpop'); },1800);
  [[17,0],[23,-8],[20,-14],[26,-4]].forEach(([d,dl])=>{ const w=document.createElement('div'); w.className='walk'; w.style.animationDuration=d+'s'; w.style.animationDelay=dl+'s';
    const m=mk(false); m.style.animationDelay=(Math.random()*.7)+'s'; setM(m,nextM()); w.appendChild(m); w.addEventListener('animationiteration',()=>setM(m,nextM())); el.appendChild(w); });
  for(let i=0;i<10;i++){ const p=document.createElement('i'); p.className='pet'; p.style.left=(Math.random()*100)+'%'; p.style.animationDuration=(9+Math.random()*8)+'s'; p.style.animationDelay=(-Math.random()*15)+'s'; el.appendChild(p); }
  // visitor count from GoatCounter (shown only when the public counter is enabled)
  try{ if(location.hostname.indexOf('github.io')>=0) fetch('https://chengyu.goatcounter.com/counter/TOTAL.json').then(r=>r.ok?r.json():null).then(d=>{ if(!d||!d.count) return; const n=el.querySelector('#tvn'), b=el.querySelector('#tvc'); if(!n||!b) return; n.textContent=d.count; b.hidden=false; }).catch(()=>{}); }catch(_){ }
  // sparkles
  for(let i=0;i<7;i++){ const s=document.createElement('span'); s.className='spark'; s.textContent='✦'; s.style.left=(8+Math.random()*84)+'%'; s.style.top=(14+Math.random()*60)+'%'; s.style.animationDelay=(Math.random()*2)+'s'; el.appendChild(s); }
  // slideshow
  const imgs=[...el.querySelectorAll('#tbook img')], cap=el.querySelector('#tcap'); let k=0;
  const show=()=>{ imgs.forEach((im,i)=>im.classList.toggle('on',i===k)); cap.textContent=COVER_SLIDES[k][1]; };
  show(); const timer=setInterval(()=>{ k=(k+1)%imgs.length; show(); },4200);
  el.querySelector('h1').onclick=()=>{ SND.tap(); el.querySelectorAll('h1 span span').forEach((x,i)=>{ x.style.animation='none'; void x.offsetWidth; x.style.animation=`tWig .5s ${i*.05}s`; }); };
  el.querySelector('#tgo').onclick=()=>{ gcEvent('開始冒險'); SND.resume&&SND.resume(); SND.warp?SND.warp():SND.tap(); clearInterval(timer); clearInterval(swap); if(sayAu) sayAu.pause(); el.classList.add('out');
    setTimeout(()=>{ el.remove(); if(!S.seen[CH.key]&&CH.intro) chapterIntro(); else home(); },480); };
