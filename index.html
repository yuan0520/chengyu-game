宋文帝後悔地說：「如果檀道濟還在，怎麼會這樣！」","next":"這時北方的北魏出了一位想要改革的皇帝，他把首都搬到了洛陽……"}},{"id":"e48_01","yr":"約西元 495 年","place":"北魏．洛陽","scene":"palace","music":"palace","cast":[["孝文帝",0.2,-0.8],["元志",-6.8,1.2],["李彪",6.8,1.2],["侍衛",2.6,-1.2]],"beats":[{"t":"北魏孝文帝把首都搬到洛陽。皇族元志當上洛陽縣令，他不怕有權有勢的人。"},{"t":"有一天，元志在路上遇到御史中尉李彪。兩人的車馬都不肯讓路，乾脆一起去見皇帝。","mv":[["元志",-1.4,0.8],["李彪",1.8,0.8]]},{"who":"李彪","t":"我是御史中尉，連太子的車隊都要讓我。一個縣令，怎麼能跟我爭路？","fx":[["upset","李彪"]]},{"who":"元志","t":"京城的百姓都歸我管。我怎麼能跟一般官員一樣，給中尉讓路？","fx":[["upset","元志"]]},{"t":"兩個人說得都有道理，孝文帝想了一想，笑了起來。","fx":[["focus","孝文帝"]]},{"who":"孝文帝","t":"洛陽是我的京城，就像漢高祖的家鄉豐沛一樣，你們兩個都很重要……","fx":[["say","孝文帝"]]}],"q":"孝文帝說：「以後你們就各走各的路，各自揮鞭趕馬吧！」後來比喻因為目標不同，各走各的路，叫做什麼？","wrong":[{"w":"同舟共濟","by":"侍衛","line":"同舟共濟是坐同一條船、一起渡河。皇上是叫他們分開走呀！"},{"w":"狹路相逢","by":"李彪","line":"狹路相逢是在窄路上碰面躲不開，那是我們剛剛吵架的時候。皇上的辦法是分開走。"},{"w":"各奔東西","by":"元志","line":"各奔東西是大家分散到不同的地方，意思很接近！不過皇上說的是同一條路分成兩半，各自騎馬走。"}],"hint":"「鑣」念ㄅㄧㄠ，是馬嘴裡的鐵環；「揚鑣」就是騎馬出發。","after":"兩人走出宮殿，真的拿尺量道路，一人走一半。原文寫的是「分路揚鑣」。","lesson":{"title":"孝文帝改革","text":"孝文帝是鮮卑人，他把首都從平城遷到洛陽，要大家說漢語、穿漢服，還把皇族的姓「拓跋」改成「元」，所以這裡的人都姓元。","next":"孝文帝的改革剛開始，各地都要換上新制度。到齊州當官的元鑒，做得特別好……"}},{"id":"e48_05","yr":"北魏孝文帝時","place":"齊州．刺史府","scene":"office","music":"map","cast":[["元鑒",0.2,-0.6],["百姓",-1.6,1.0],["百姓",1.8,1.3],["使者",7.0,1.0]],"beats":[{"t":"孝文帝推動改革，全國的制度都要換新。元鑒被派到齊州當刺史。"},{"who":"元鑒","t":"皇上的新制度要好好推行，齊州原本好的風俗也要留下來。","fx":[["say","元鑒"]]},{"t":"他一方面照著新制度，一方面採用當地的好習慣，把齊州治理得井井有條。"},{"t":"元鑒把做法寫成報告送給皇帝。不久，京城的使者帶著詔書來了。","mv":[["使者",1.9,0.4]]},{"who":"使者","t":"皇上說：如果各州刺史都能這樣做，改變風俗有什麼難的！要全國都照著做！","fx":[["say","使者"],["cheer","元鑒"]]},{"t":"齊州的百姓聽了，都開心地議論起來。","fx":[["cheerAll","百姓"]]}],"q":"齊州百姓覺得，現在看到的、聽到的，都和以前完全不同，好新鮮！這種感覺叫做什麼？","wrong":[{"w":"一成不變","by":"百姓","line":"一成不變是一點也沒改變。我們齊州可是變了好多呢！"},{"w":"司空見慣","by":"使者","line":"司空見慣是看習慣了不覺得奇怪。百姓是覺得很新鮮，剛好相反。"},{"w":"煥然一新","by":"元鑒","line":"煥然一新是外表變得光亮嶄新，意思很接近！不過百姓說的是自己的眼睛和耳朵，感受都更新了。"}],"hint":"看東西用眼睛，聽聲音用什麼？","after":"史書寫「齊人愛詠，咸曰耳目更新」，就是齊州人都這樣稱讚。","lesson":{"title":"北魏的盛與衰","text":"孝文帝三十三歲就過世了。他的改革讓北方的胡人和漢人慢慢融合，可是北魏後來還是分裂成東魏和西魏。","next":"我們再回到南方。這時南朝已經換成梁朝，梁武帝正要派一位功臣回家鄉……"}},{"id":"e48_04","yr":"西元 505 年","place":"建康．新亭","scene":"river","music":"final","cast":[["梁武帝",0.6,-0.4],["柳慶遠",-6.8,1.0],["大臣",2.4,0.8],["大臣",1.8,-1.6]],"beats":[{"t":"梁武帝原本在雍州（今天的湖北襄陽一帶）當官，柳慶遠一路跟著他起兵，建立了梁朝。"},{"t":"柳慶遠立下很多功勞。這一年，梁武帝派他回雍州當刺史，那裡正是他家住的地方。","mv":[["柳慶遠",-1.2,0.6]]},{"t":"梁武帝親自到長江邊的新亭擺酒，為柳慶遠送行。","fx":[["focus","梁武帝"]]},{"who":"柳慶遠","t":"謝謝陛下！臣一定把雍州管好。","fx":[["say","柳慶遠"]]},{"who":"梁武帝","t":"有你回去守著西邊，朕就不用擔心了。","fx":[["cheer","梁武帝"]]}],"q":"梁武帝說：「你穿著華麗的錦衣回到家鄉，朕就沒有西顧之憂了。」比喻做了大官、成功以後風光回到故鄉，叫做什麼？","wrong":[{"w":"背井離鄉","by":"大臣","line":"背井離鄉是離開家鄉到外地去。柳大人是要回家鄉呀！"},{"w":"無家可歸","by":"柳慶遠","line":"無家可歸是沒有地方住。我有家可回，還是風風光光地回去呢！"},{"w":"落葉歸根","by":"梁武帝","line":"落葉歸根是年紀大了回到故鄉，意思很接近！不過柳慶遠是當了大官、穿著錦衣回去。"}],"hint":"「衣」在這裡念ㄧˋ，是「穿」的意思；穿的是什麼布料？","after":"柳慶遠穿著華麗的官服回到雍州，鄉親們都出來迎接他。","winMv":[["柳慶遠",-7.2,1.0]],"lesson":{"title":"梁武帝","text":"梁武帝在位四十八年，是南朝在位最久的皇帝，他非常信佛，蓋了很多寺廟。南北朝又過了八十多年，才由隋朝統一天下。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","title":"第三十五章．南北朝風雲","eps":[8,46,48]},{"key":"ch5","short":"魏晉隋唐","era":"西元 220–907 年","color":"#4E79B8","map":{"ground":"#9fc27a","river":"#4f9fd8"},"intro":{"lines":["三國最後由晉朝統一。可是好景不長，晉朝的皇族互相殘殺，北方的外族趁機南下。","晉朝退到長江以南，叫「東晉」；北方則分裂成許多小國。","後來南方換了宋、齊、梁、陳四個朝代，北方也分分合合，這段時期叫「南北朝」。","西元 589 年，隋朝統一南北。隋朝很快就滅亡了，接著是強盛的唐朝。","從三國結束到唐朝滅亡，將近七百年，我們一起穿越過去吧！"],"people":[["杜預","晉朝大將，滅吳統一天下"],["祖逖","聞雞起舞，北伐收復失地"],["謝安","東晉宰相，指揮淝水之戰"],["武則天","中國唯一的女皇帝"]]},"stops":[{"id":"e20_01","yr":"西元 280 年","place":"伐吳前線","scene":"river","music":"battle","cast":[["杜預",1.3,0.6],["將領",-1.1,0.6,0,1],["將領",-0.2,-1.2,0,0]],"beats":[{"t":"三國後期，魏國滅了蜀漢，司馬炎又取代魏國，建立晉朝。三國只剩下長江南邊的吳國。"},{"t":"西元 280 年，晉朝分好幾路大軍攻打吳國，接連打了好幾場勝仗。","fx":[["focus","杜預"]]},{"who":"將領","t":"吳國已經存在將近一百年，不可能一下子打完。現在快到夏天，大雨要來了，還會有瘟疫，不如等冬天再說。"},{"who":"杜預","t":"從前樂毅只靠一場大戰，就打下強大的齊國。現在我們士氣正旺……"},{"who":"杜預","t":"就像劈竹子，前面幾節劈開了，下面的就會順著刀口裂開，根本不用再費力！","fx":[["cheer","杜預"]]}],"q":"杜預說：「現在的形勢，就像劈竹子一樣。」晉軍一路勢不可擋。這變成哪個成語？","wrong":[{"w":"胸有成竹","by":"將領","line":"胸有成竹是畫竹子前心裡早有樣子。將軍說的是劈竹子！"},{"w":"竹籃打水","by":"杜預","line":"竹籃打水是白費力氣。我說的是一路勝利，毫不費力！"},{"w":"迎刃而解","by":"杜預","line":"「迎刃而解」也出自我這段話喔！不過要找的是形容形勢的那個：像劈竹子一樣。"}],"hint":"劈開竹子時，是一節一節順著裂開的。","after":"晉軍一路打到吳國的首都，經過的城池都不戰而降。之前反對的人，也寫信向杜預道歉。","lesson":{"title":"三國歸晉","text":"西元 280 年，吳國投降，晉朝統一天下，結束了將近一百年的分裂。天下太平了一段時間，文學也跟著興盛起來。","next":"有一位叫左思的人，花了整整十年寫一篇文章……"}},{"id":"e20_05","yr":"西晉初年","place":"洛陽．左思家","scene":"study","music":"palace","cast":[["左思",-0.3,-1.4],["張華",6.5,1],["貴族",-6.5,1,0,1],["貴族",-7,2.2,0,0]],"beats":[{"t":"左思長得不好看，說話也不流利，卻很有文采。他想寫一篇〈三都賦〉，描寫三國的三座首都。"},{"t":"他整整構思了十年。家裡的門口、院子、甚至廁所旁邊都放著紙筆，一想到好句子，就馬上記下來。","fx":[["say","左思"]]},{"t":"文章寫好了，一開始卻沒有人重視。","fx":[["sad","左思"]]},{"t":"後來，大文學家張華讀到了這篇文章。","mv":[["張華",1.6,0.6]]},{"who":"張華","t":"寫得太好了！跟漢朝的班固、張衡差不多。讀完還意猶未盡，越讀越有新意！","fx":[["cheer","張華"]]},{"t":"消息傳開，有錢人家都搶著抄寫〈三都賦〉。","mv":[["貴族",-1.6,0.8],["貴族#2",-2.4,1.8]],"fx":[["cheerAll","貴族"]]}],"q":"大家搶著買紙抄寫〈三都賦〉，洛陽的紙都變貴了。後來比喻作品非常受歡迎，叫做什麼？","wrong":[{"w":"一紙空文","by":"貴族","line":"一紙空文是寫了卻沒有用的文件。〈三都賦〉可是大家搶著抄呢！"},{"w":"紙醉金迷","by":"張華","line":"紙醉金迷是生活奢侈享樂。我們說的是好文章！"},{"w":"膾炙人口","by":"張華","line":"膾炙人口也是形容作品受歡迎，意思很接近！不過這個故事是洛陽的紙漲價了。"}],"hint":"故事發生在晉朝的首都，什麼東西漲價了？","after":"一篇文章就讓整座城的紙漲價，可見大家有多喜歡它。","lesson":{"title":"八王之亂","text":"可惜好景不長。晉朝的皇族為了爭權，互相攻打了十六年，叫做「八王之亂」。國家亂成一團，北方的外族趁機起兵。","next":"就在晉朝越來越亂的時候，有兩個年輕人立志要保衛國家……"}},{"id":"e08_01","yr":"西晉末年","place":"司州官舍","scene":"night","music":"night","cast":[["祖逖",-3.2,-4.4],["劉琨",-4.6,-4.2]],"beats":[{"t":"祖逖和劉琨都在司州當主簿。兩人感情非常好，常常一起談論國家大事，晚上還蓋同一條被子睡覺。"},{"t":"那時天下越來越亂，他們都想為國家做一番大事。"},{"t":"有一天半夜，遠處傳來雞叫聲。古人認為半夜雞叫不吉利，祖逖卻不這麼想。","fx":[["focus","祖逖"]]},{"who":"祖逖","t":"劉琨，快起來！這不是不好的聲音，是在叫我們起來呀！"},{"t":"兩人走到院子裡，拔出劍，練了起來。","mv":[["祖逖",-1.2,0.4],["劉琨",1,0.5]],"fx":[["cheer","祖逖"],["cheer","劉琨"]]},{"who":"劉琨","t":"好！從今天起，我們天天一起練！"}],"q":"祖逖和劉琨一聽到雞叫，就起床練劍，把握時間努力。這個故事變成哪個成語？","wrong":[{"w":"雞犬不寧","by":"劉琨","line":"雞犬不寧是吵得連雞狗都不安寧。我們是安安靜靜在練劍喔！"},{"w":"手舞足蹈","by":"祖逖","line":"手舞足蹈是高興得跳起來。我們的「舞」是舞劍！"},{"w":"枕戈待旦","by":"劉琨","line":"枕戈待旦是枕著兵器等天亮，是我後來寫信說的話，意思很接近！不過這個故事是聽到雞叫就起來練劍。"}],"hint":"他們聽到的，是什麼動物的叫聲？","after":"小知識：這裡的「舞」是舞劍，不是跳舞喔！","lesson":{"title":"中流擊楫","text":"後來北方被外族占領，晉朝退到江南，叫做「東晉」。祖逖請求北伐，渡長江時在江中間敲著船槳發誓：「不收復中原，絕不再渡江回來！」他後來收復了黃河以南的大片土地。","next":"幾十年後，前秦統一了北方，皇帝苻堅帶著大軍南下……"}},{"id":"e20_02","yr":"西元 383 年","place":"壽陽城頭","scene":"walls","music":"battle","cast":[["苻堅",-0.8,-2.7,1.3],["苻融",0.9,-2.7,1.3],["秦兵",-2.2,-2.7,1.3],["秦兵",2.3,-2.7,1.3],["晉兵",-8,1.5],["晉兵",-8.6,0.4],["晉兵",-9.2,1.8],["晉兵",-9.6,0.6]],"beats":[{"t":"東晉時，北方的前秦統一了北方。皇帝苻堅帶著號稱百萬的大軍南下，想一舉滅掉東晉。"},{"who":"苻堅","t":"我們人這麼多，大家把馬鞭丟進長江，就能讓江水斷流！","fx":[["cheer","苻堅"]]},{"t":"東晉宰相謝安，派謝石、謝玄帶著八萬人迎戰。","mv":[["晉兵",-2.6,1.2],["晉兵#2",-1.2,1.8],["晉兵#3",0.4,1.6],["晉兵#4",1.8,1.2]]},{"t":"苻堅和弟弟苻融登上壽陽城頭，看到晉軍隊伍整齊，士兵個個精神飽滿。","fx":[["focus","苻堅"]]},{"t":"他再往北看八公山，山上的草木隨風搖動，好像都是人。"},{"who":"苻堅","t":"這也是很強的敵人啊，怎麼能說他們人少呢！","fx":[["upset","苻堅"]]}],"q":"苻堅心裡害怕，把八公山上的草木都看成了晉兵。這種疑神疑鬼的樣子，叫做什麼？","wrong":[{"w":"兵強馬壯","by":"苻融","line":"兵強馬壯是軍隊強大。哥哥現在可是越看越害怕！"},{"w":"草菅人命","by":"苻融","line":"草菅人命是把人命看得像草一樣輕。哥哥是把草看成了人！"},{"w":"風聲鶴唳","by":"苻堅","line":"風聲鶴唳也出自這場戰役，是逃跑時聽到風聲鶴叫都以為追兵來了。我現在是把山上的草木看成士兵！"}],"hint":"八公山上的什麼，看起來像士兵？","after":"後來兩軍在淝水決戰，前秦大敗。逃跑的士兵聽到風聲和鶴叫，都以為晉兵追來了，這就是「風聲鶴唳」。","winSad":"苻堅","lesson":{"title":"淝水之戰","text":"淝水之戰，東晉以八萬人打敗號稱百萬的前秦大軍。捷報送到時，謝安正在下棋，看完信只淡淡地說：「小孩子們已經打敗敵人了。」前秦從此瓦解。之後南北對立兩百多年，叫做「南北朝」。","next":"北朝的北周有一位大臣，想替聰明的女兒挑一位好女婿……"}},{"id":"e34_05","yr":"約西元 580 年","place":"北周．竇家","scene":"palace","music":"palace","cast":[["竇毅",2.4,0.8],["竇家女兒",3.4,1.7],["公子",-1,0.4,0,1],["公子",-0.1,1.5,0,0],["李淵",-7,1.2]],"beats":[{"t":"北周的大臣竇毅有個小女兒，從小就很聰明，還曾經勸舅舅北周武帝要以百姓為重。"},{"who":"竇毅","t":"這孩子又聰明又漂亮，不能隨便把她嫁人，一定要替她找一位賢能的丈夫。"},{"t":"竇毅在門前的屏風上畫了兩隻孔雀。來求親的公子每人射兩箭，射中孔雀的眼睛，才答應婚事。","fx":[["prop","screen",0.6,-2.4,0]]},{"t":"前前後後來了幾十位公子，沒有一個射中。","fx":[["sadAll","公子"]]},{"t":"最後，一位叫李淵的年輕人來了。","mv":[["李淵",-0.8,-0.4]]},{"t":"李淵拉弓連射兩箭——兩箭各射中一隻孔雀的眼睛！","fx":[["burst","李淵"],["cheer","竇毅"],["cheer","竇家女兒"]]}],"q":"李淵射中屏風上孔雀的眼睛，被選為竇家的女婿。後來比喻被選中當女婿，叫做什麼？","wrong":[{"w":"東施效顰","by":"公子","line":"東施效顰是亂模仿別人反而更醜。跟射箭選女婿沒關係啦！"},{"w":"一箭雙鵰","by":"竇毅","line":"一箭雙鵰是一支箭射中兩隻鵰。他可是射了兩箭，射中的是畫上孔雀的眼睛！"},{"w":"百步穿楊","by":"公子","line":"百步穿楊是說射箭很準，是養由基的故事。這裡要找的是被選為女婿！"}],"hint":"屏風上畫的是什麼鳥？","after":"竇毅非常高興，把女兒嫁給了李淵。","lesson":{"title":"隋朝建立","text":"西元 581 年，北周大臣楊堅建立隋朝，就是隋文帝。李淵的阿姨正是隋文帝的皇后。後來李淵建立唐朝，成為唐高祖，竇氏也被追封為太穆皇后。","next":"隋文帝建立隋朝時，長江南邊還有一個陳朝……"}},{"id":"e48_02","yr":"西元 588 年","place":"長江北岸","scene":"river","music":"battle","cast":[["隋文帝",1.3,0.6],["高熲",-1.1,0.6],["大臣",2.6,1.6],["隋兵",-2.6,-0.4],["隋兵",-0.4,-1.4]],"beats":[{"t":"隋文帝統一了北方，只剩長江南邊的陳朝。陳後主整天喝酒作詩，不管百姓死活。"},{"who":"隋文帝","t":"高熲，江南的百姓過得太苦了。","fx":[["focus","隋文帝"]]},{"t":"隋文帝下令大量建造戰船。有人建議要保密，不要讓陳朝知道。","fx":[["cheerAll","隋兵"]]},{"who":"隋文帝","t":"我要光明正大地討伐他，有什麼好保密的！把造船的木屑丟進江裡，讓他們看見。陳朝如果能改過，我又何必出兵？"},{"t":"木屑順著江水漂到對岸，陳後主卻還是只顧玩樂。"}],"q":"隋文帝說：「我怎麼能因為隔著一條像衣帶那麼窄的江水，就不去救百姓呢？」後來形容兩地只隔一條水、非常接近，叫做什麼？","wrong":[{"w":"千山萬水","by":"高熲","line":"千山萬水是路途遙遠。陛下說的是長江窄得像一條衣帶！"},{"w":"背水一戰","by":"大臣","line":"背水一戰是背對河水拚命作戰，是韓信的故事。陛下說的是兩岸很近。"},{"w":"近在咫尺","by":"高熲","line":"近在咫尺也是說很近，意思很接近！不過陛下說的是像衣帶一樣窄的江水。"}],"hint":"陛下把長江比喻成衣服上的什麼？","after":"西元 589 年，隋軍渡過長江，攻進建康，陳朝滅亡。","lesson":{"title":"南北統一","text":"隋朝統一了分裂將近三百年的南北。隋文帝很節儉，國家富足；可是兒子隋煬帝好大喜功，開運河、三次攻打高句麗，百姓受不了，各地起兵。西元 618 年，李淵建立了唐朝。","next":"唐朝前期國力強盛。可是朝廷裡，也有表面和善、心裡陰險的人……"}},{"id":"e34_01","yr":"約西元 656 年","place":"唐朝朝廷","scene":"office","music":"palace","cast":[["李義府",-1,0.6],["官員",2,1.2,0,1],["官員",3,0.2,0,0]],"beats":[{"t":"唐高宗想立武昭儀當皇后，很多大臣反對，李義府卻暗中支持，因此很快升了大官。"},{"t":"李義府看起來溫和恭敬，跟人說話總是笑咪咪的。","fx":[["cheer","李義府"]]},{"who":"李義府","t":"哈哈，這位大人說得真好！"},{"t":"可是只要有人稍微不順他的意，他就想辦法陷害對方。","fx":[["upset","官員"]]},{"who":"官員","t":"我上次只是說錯一句話，就被他害得丟了官……","fx":[["sad","官員"]]}],"q":"李義府臉上總是帶著笑，心裡卻藏著害人的刀。當時的人說他「笑中有刀」。這變成哪個成語？","wrong":[{"w":"笑逐顏開","by":"官員","line":"笑逐顏開是高興得眉開眼笑。他的笑可是不懷好意！"},{"w":"談笑風生","by":"官員","line":"談笑風生是說話有趣又輕鬆。他表面笑嘻嘻，心裡卻想害人。"},{"w":"口蜜腹劍","by":"官員","line":"口蜜腹劍是嘴巴甜、肚子裡藏劍，意思很接近！不過那是後來李林甫的故事。他是笑容裡藏著刀。"}],"hint":"笑容裡面，藏著什麼危險的東西？","after":"大家又因為他外表溫柔、卻會傷人，叫他「李貓」。","lesson":{"title":"武則天","text":"李義府支持的武昭儀當上皇后，後來自己當了皇帝，就是武則天，國號「周」。她是中國歷史上唯一的女皇帝。她為了鞏固權力，任用了一批很殘酷的官員。","next":"其中最有名的兩個酷吏，叫周興和來俊臣……"}},{"id":"e34_03","yr":"西元 691 年","place":"洛陽．宴席","scene":"house","music":"night","cast":[["周興",-1,0.6],["來俊臣",1.4,0.6],["差役",6,1]],"beats":[{"t":"武則天時，周興和來俊臣都是專門審問犯人的官，手段非常殘酷，害了很多人。"},{"t":"有人告周興謀反，武則天祕密命令來俊臣去審問他。周興卻一點也不知道。"},{"who":"來俊臣","t":"老兄，很多犯人都不肯認罪，你有什麼好辦法嗎？"},{"who":"周興","t":"這很簡單！拿一個大甕，四周用炭火烤，把犯人放進去，什麼都會招了！","fx":[["cheer","周興"]]},{"t":"來俊臣馬上叫人搬來一個大甕，四周生起炭火。","mv":[["差役",1.2,-1.2]],"fx":[["prop","urn",-0.2,-1.6]]},{"who":"來俊臣","t":"有人告老兄謀反，請老兄進這個甕裡吧！","fx":[["upset","周興"],["focus","周興"]]}],"q":"來俊臣用周興自己想出來的整人方法，反過來對付他。這叫做什麼？","wrong":[{"w":"自告奮勇","by":"周興","line":"自告奮勇是主動要求去做事。我、我才不想進去！"},{"w":"賓至如歸","by":"來俊臣","line":"賓至如歸是客人覺得像回到家一樣舒服。這頓飯，他可是一點都不舒服！"},{"w":"甕中捉鱉","by":"差役","line":"甕中捉鱉是要抓的已經跑不掉，很好抓，意思有點接近！不過「用他自己的方法對付他」，有一個專門的成語。"}],"hint":"來俊臣請周興進去哪裡？","after":"周興嚇得連忙磕頭認罪，後來被流放。害人的方法，最後害到了自己。","winSad":"周興","lesson":{"title":"唐朝的盛與衰","text":"武則天之後，唐玄宗開創了「開元之治」，唐朝到了最強盛的時候，李白、杜甫等大詩人都生活在這個時代。後來發生安史之亂，唐朝由盛轉衰，最後在西元 907 年滅亡。","next":"魏晉到隋唐這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","name":"魏晉到隋唐","title":"第三十六章．魏晉到隋唐","eps":[8,20,34,48]},{"key":"h32","name":"大唐風華","short":"大唐盛世","era":"西元 675–906 年","color":"#C8642E","map":{"ground":"#b5c27a","river":"#4f9fd8"},"intro":{"lines":["隋朝在西元 589 年統一南北，可是沒過多久就滅亡了。西元 618 年，李淵建立唐朝，首都在長安。","唐太宗的「貞觀之治」、唐玄宗的「開元盛世」，讓唐朝成為當時世界上最強盛的國家之一。","唐朝也是詩的時代，王勃、李白、杜甫都寫下了流傳千年的好詩。","西元 755 年發生安史之亂，之後各地的節度使擁兵自重，朝廷越來越管不動。","西元 907 年，唐朝滅亡。一起去看看這將近三百年裡的人物吧！"],"people":[["王勃","初唐的少年天才，寫了〈滕王閣序〉"],["武則天","中國歷史上唯一的女皇帝"],["李白","「詩仙」，留下上千首詩"],["朱全忠","唐朝末年的軍閥，後來奪了唐朝的天下"]]},"stops":[{"id":"e34_07","yr":"約西元 675 年","place":"洪州．滕王閣","scene":"palace","music":"palace","cast":[["都督",1.4,-0.6],["王勃",-6.8,1.2],["賓客",-0.6,-1.4],["賓客",2.8,0.6],["侍從",3.0,-1.4]],"beats":[{"t":"重陽節，洪州都督在滕王閣大擺宴席。他早就叫女婿準備好一篇序文，想在客人面前炫耀。"},{"who":"都督","t":"今天這麼熱鬧，哪位願意替滕王閣寫一篇序？","fx":[["say","都督"]]},{"t":"紙筆傳了一圈，客人們都知道都督的心意，一個個推辭不寫。","fx":[["sad","賓客"],["sad","賓客#2"]]},{"t":"傳到一位路過的年輕人王勃，他竟然一點也不推辭，拿起筆就寫。","mv":[["王勃",-1.0,0.4]],"fx":[["focus","王勃"]]},{"t":"都督很不高興，起身去換衣服，叫侍從偷偷去看王勃寫了什麼。","mv":[["都督",6.8,-0.6]],"fx":[["upset","都督"]]},{"who":"侍從","t":"報告都督！他寫了：「落霞與孤鶩齊飛，秋水共長天一色。」","mv":[["侍從",5.2,-0.8]]},{"who":"都督","t":"這……這是天才啊！","mv":[["都督",1.4,-0.6]],"fx":[["upset","都督"],["focus","都督"]]}],"q":"王勃滿肚子學問，大家說他的文章早就寫在肚子裡。如果一個人剛好相反，肚子裡連一滴墨水都沒有、毫無學問，叫做什麼？","wrong":[{"w":"才高八斗","by":"王勃","line":"才高八斗是說很有才華，題目問的是完全相反的人喔！"},{"w":"出口成章","by":"賓客","line":"出口成章是一開口就是好文章，這也是在稱讚有學問的人呀。"},{"w":"不學無術","by":"都督","line":"不學無術是不讀書、沒本事，意思很接近！不過題目說的是肚子裡連一點墨水都沒有。"}],"hint":"寫字要用墨，肚子裡連一「點」都沒有。","after":"都督請王勃把文章寫完，宴會開開心心地結束。王勃寫文章前常先磨好墨、蒙頭睡一覺，醒來一口氣寫完，大家說他打「腹稿」。","lesson":{"title":"初唐四傑","text":"王勃和楊炯、盧照鄰、駱賓王合稱「初唐四傑」。他寫完〈滕王閣序〉後，渡海去看父親，不幸落水受驚過世，才二十幾歲。","next":"後來武則天當了皇帝。她的宰相裡，有一位說話總是不清不楚……"}},{"id":"e34_02","yr":"約西元 695 年","place":"洛陽．宰相府","scene":"office","music":"palace","cast":[["蘇味道",0.2,-0.6],["官員",-6.8,1.0],["官員",6.8,1.2],["朋友",2.8,1.6,0,1,1]],"beats":[{"t":"蘇味道年輕時和同鄉李嶠都很會寫文章，大家合稱「蘇李」。武則天時，蘇味道當上了宰相。"},{"t":"有一天，兩位官員為了一件事吵起來，跑來請宰相做決定。","mv":[["官員",-1.4,0.6],["官員#2",1.9,0.8]]},{"who":"官員","t":"宰相大人，您說該照我的辦法吧？","fx":[["say","官員"]]},{"who":"官員#2","t":"明明是我的辦法比較好！","fx":[["upset","官員#2"]]},{"who":"蘇味道","t":"嗯……這樣也可以，那樣也不錯……","fx":[["focus","蘇味道"]]},{"t":"兩位官員一頭霧水地走了。後來，蘇味道私下對朋友說出了真心話。","mv":[["官員",-7.0,0.6],["官員#2",7.2,0.8],["朋友",1.8,0.6]]},{"who":"蘇味道","t":"做事不要說得太清楚。萬一錯了，就要被處罰。摸著稜角，兩邊都說可以就好。","fx":[["say","蘇味道"]]}],"q":"蘇味道遇到事情，總是「這樣也可以，那樣也可以」，從來不說清楚自己的意見。這種態度叫做什麼？","wrong":[{"w":"斬釘截鐵","by":"朋友","line":"斬釘截鐵是說話果斷、毫不猶豫。蘇大人剛好相反啦！"},{"w":"一言九鼎","by":"官員","line":"一言九鼎是說話很有分量。宰相大人說了等於沒說呀！"},{"w":"含糊其辭","by":"蘇味道","line":"含糊其辭是話說得不清楚，意思很接近！不過我是故意兩邊都說「可」，有一個專門形容這種態度的詞。"}],"hint":"「稜」是東西的邊角；摸著兩邊，都說「可」。","after":"大家就給他取了外號，叫「蘇摸稜」。","lesson":{"title":"武則天與蘇家","text":"武則天是中國歷史上唯一的女皇帝，她改國號為「周」。有趣的是，宋朝大文豪蘇軾的家族，說自己是蘇味道的後代呢！","next":"唐玄宗時，四川的山裡有個讀書讀到想放棄的少年，他在溪邊遇到一位奇怪的老婆婆……"}},{"id":"e07_04","yr":"約西元 715 年（傳說）","place":"象耳山下的小溪","scene":"south","music":"map","cast":[["小李白",-6.8,1.0],["老婆婆",1.4,-0.4]],"beats":[{"t":"傳說李白小時候在象耳山裡讀書。書好難，他還沒讀完，就收拾東西想回家了。"},{"who":"小李白","t":"好難喔，不讀了不讀了！","mv":[["小李白",-1.2,0.6]],"fx":[["sad","小李白"]]},{"t":"走到山下的小溪邊，他看到一位老婆婆，正在石頭上用力磨一根粗粗的鐵棒。","fx":[["focus","老婆婆"]]},{"who":"小李白","t":"婆婆，您在做什麼呀？","mv":[["小李白",0.0,0.4]],"fx":[["say","小李白"]]},{"who":"老婆婆","t":"我要把這根鐵杵，磨成一根縫衣服的針。","fx":[["say","老婆婆"]]},{"t":"李白愣住了：這麼粗的鐵棒，要磨多久才會變成針呢？","fx":[["upset","小李白"]]}],"q":"老婆婆要把粗鐵棒磨成細針。李白很感動，回到山裡把書讀完。後來比喻只要有恆心、肯努力，難事也能成功，叫做什麼？","wrong":[{"w":"半途而廢","by":"老婆婆","line":"半途而廢是做到一半就放棄，那是你剛剛想做的事喔！"},{"w":"守株待兔","by":"小李白","line":"守株待兔是坐著等好運。婆婆可是一下一下努力在磨呢！"},{"w":"鍥而不捨","by":"老婆婆","line":"鍥而不捨是一直刻下去不停手，意思很接近！不過我磨的是鐵杵，要變成一根針。"}],"hint":"「杵」念ㄔㄨˇ，是搗東西用的粗棒子。","after":"這是宋朝書上記載的民間傳說，那條小溪後來就叫「磨針溪」。","lesson":{"title":"詩仙李白","text":"李白後來四處遊歷，寫了一千多首詩，像〈靜夜思〉，被稱為「詩仙」。這個故事是後人的傳說，不一定真的發生過，但它的道理大家都記得。","next":"差不多同一個時候，有一位當刺史的大臣，覺得很多麻煩都是自己找來的……"}},{"id":"e34_06","yr":"唐玄宗初年","place":"蒲州．刺史府","scene":"office","music":"palace","cast":[["陸象先",0.2,-0.6],["錄事",2.4,0.4],["差役",-6.8,1.0]],"beats":[{"t":"陸象先曾經當過宰相，後來到地方當刺史。有一天，一個差役做錯了事。","mv":[["差役",-1.2,0.8]],"fx":[["sad","差役"]]},{"who":"陸象先","t":"說給你聽，你就明白了。下次要小心，回去吧。","fx":[["say","陸象先"]]},{"t":"差役鬆了一口氣，趕快退下。","mv":[["差役",-7.2,1.0]]},{"who":"錄事","t":"大人，照規定，應該打他板子才對！","fx":[["upset","錄事"]]},{"who":"陸象先","t":"人心都差不多，他聽得懂道理。真要打，就先從你開始吧！","fx":[["focus","陸象先"]]},{"t":"錄事又羞又怕，趕緊退了下去。","mv":[["錄事",6.8,0.6]],"fx":[["sad","錄事"]]}],"q":"陸象先常說：「天下本來沒什麼事，只是平庸的人自己去擾亂，事情才變得麻煩。」後來比喻沒事自己找麻煩，叫做什麼？","wrong":[{"w":"未雨綢繆","by":"錄事","line":"未雨綢繆是下雨前先修好屋頂，事先做好準備，那是好事呀！"},{"w":"雪中送炭","by":"陸象先","line":"雪中送炭是在別人困難時幫忙。我說的是有人沒事找事。"},{"w":"杞人憂天","by":"陸象先","line":"杞人憂天是擔心天會塌下來，意思很接近！不過我說的是平庸的人把原本沒事的天下攪亂了。"}],"hint":"「庸人」是平庸的人，他們自己去「擾」亂。","after":"陸象先又說：「只要從根源讓事情安定下來，哪還怕不簡單呢？」","lesson":{"title":"好官陸象先","text":"陸象先前後當了好幾次刺史，做法都一樣寬厚，百姓和下屬都很懷念他。後來唐玄宗時國家很強盛，可是安史之亂以後，各地的節度使越來越不聽話。","next":"唐朝後期，朝廷派一位大官到幽州。他的手下說了一句瞧不起士兵的話，惹出了大禍……"}},{"id":"e34_04","yr":"西元 821 年","place":"幽州軍營","scene":"walls","music":"battle","cast":[["張弘靖",-6.8,0.6],["韋雍",-7.4,1.6],["幽州兵",1.4,0.2],["幽州兵",2.6,0.9],["幽州兵",0.6,-1.0]],"beats":[{"t":"幽州的將軍向來跟士兵一起吃苦，不坐轎子、不撐傘。這一年，朝廷派張弘靖來管理幽州。"},{"t":"張弘靖一直過著富貴日子，竟然坐著轎子穿過軍隊。士兵們都嚇了一跳。","mv":[["張弘靖",-1.2,0.0]],"fx":[["prop","cart",-1.6,-0.6,0],["upset","幽州兵"]]},{"t":"他的手下韋雍很愛喝酒，常常半夜喝醉回來，一路大聲罵人。","mv":[["韋雍",-0.4,1.0]]},{"who":"韋雍","t":"你們這些人，就像造反的胡人一樣！","fx":[["upset","韋雍"]]},{"who":"韋雍","t":"現在天下太平，你們拉得動兩石重的硬弓，還不如認得一個「丁」字！","fx":[["focus","韋雍"]]},{"t":"士兵們向來以勇敢自豪，聽了氣得握緊拳頭。","fx":[["upset","幽州兵#2"],["upset","幽州兵#3"]]}],"q":"「丁」只有兩筆，是最簡單的字。韋雍笑士兵連一個「丁」字都不認得。後來形容一個人不識字、沒學問，叫做什麼？","wrong":[{"w":"博學多聞","by":"幽州兵","line":"博學多聞是學問很多、見識很廣。韋雍才不會這樣誇我們呢！"},{"w":"學富五車","by":"張弘靖","line":"學富五車是讀的書可以裝滿五輛車，那是說很有學問的人。"},{"w":"一竅不通","by":"韋雍","line":"一竅不通是對某件事完全不懂，意思很接近！不過我說的是連眼睛看到「丁」字都不認得。"}],"hint":"眼睛看了，也「不識」那個最簡單的字。","after":"士兵們從此深深怨恨張弘靖和韋雍。沒多久，幽州就發生了兵變。","winSad":"韋雍","lesson":{"title":"幽州兵變","text":"這一年夏天，憤怒的士兵發動兵變，把張弘靖關了起來，韋雍等人也丟了性命。朝廷管不住，幽州又落到軍人手裡。這個故事告訴我們，看不起別人會惹來大禍。","next":"晚唐的長沙，有一位寫文章快得驚人的讀書人，要接受考試……"}},{"id":"e34_08","yr":"晚唐","place":"長沙．使院","scene":"office","music":"map","cast":[["王璘",-1.4,0.4],["崔大人",2.6,-0.6],["書吏",-0.4,-1.4],["書吏",0.8,-1.2],["書吏",2.0,0.6],["書吏",0.6,1.2]],"beats":[{"t":"長沙有個讀書人叫王璘，聽說一天能寫一萬字。長官崔大人想推薦他給朝廷，先在使院考考他。"},{"who":"崔大人","t":"聽說你寫得很快？今天就寫給我看！","fx":[["say","崔大人"]]},{"who":"王璘","t":"請給我十個書吏，每人一張桌子、一方硯台。","fx":[["say","王璘"]]},{"t":"王璘穿著薄衣服，摸著肚子走來走去，一句接一句念給書吏寫，十個人的筆都停不下來。","mv":[["王璘",1.6,0.0]],"fx":[["focus","王璘"]]},{"t":"忽然颳起狂風暴雨，好幾張寫好的文章被風捲走了！","fx":[["upset","書吏"],["upset","書吏#3"]]},{"who":"王璘","t":"不用去撿，拿紙來！","fx":[["upset","王璘"]]}],"q":"王璘拿起筆來一揮，一下子又寫好了十幾篇。形容寫字、作文又快又好，筆一揮動就完成，叫做什麼？","wrong":[{"w":"拖泥帶水","by":"書吏","line":"拖泥帶水是做事拖拖拉拉，不乾脆。王先生快到我們都跟不上！"},{"w":"絞盡腦汁","by":"崔大人","line":"絞盡腦汁是想破頭也想不出來。他根本不用想那麼久啊！"},{"w":"倚馬可待","by":"王璘","line":"倚馬可待也是說文章寫得快，意思很接近！不過那是靠在馬旁邊寫的故事；我這裡是筆一揮就寫完。"}],"hint":"「就」是完成的意思；筆動一下就怎樣了？","after":"崔大人看得目瞪口呆，就把王璘推薦給朝廷。","lesson":{"title":"唐朝的文章高手","text":"唐朝靠科舉選官，很看重文章寫得好不好，所以出了很多會寫文章、寫詩的人。王璘的故事記在《摭言》裡，後來收進宋朝的《太平廣記》。","next":"唐朝快要滅亡了。魏博的節度使羅紹威管不住手下的軍隊，想出了一個辦法……"}},{"id":"e48_08","yr":"西元 906 年","place":"魏州","scene":"walls","music":"night","winSad":"羅紹威","cast":[["羅紹威",0.2,0.4],["牙兵",1.6,-1.0],["牙兵",2.6,-0.4],["朱全忠",-6.8,1.0],["汴州兵",-7.4,-0.4],["汴州兵",-7.8,0.6]],"beats":[{"t":"魏博有一支「牙軍」，一百多年來越來越驕橫，主帥一不合他們的意，就被換掉。","fx":[["cheerAll","牙兵"]]},{"who":"牙兵","t":"不合我們的意，就換一個主帥！","fx":[["upset","牙兵"]]},{"t":"節度使羅紹威很討厭牙軍，可是管不動。他偷偷請強大的朱全忠派兵來幫忙。","mv":[["朱全忠",-1.4,0.4],["汴州兵",-1.8,-0.6],["汴州兵#2",-0.8,-1.2]]},{"t":"朱全忠的大軍一到，牙軍就被消滅了。","mv":[["牙兵",7.4,-1.0],["牙兵#2",7.8,-0.4]]},{"t":"可是朱全忠的軍隊一住就是半年，吃掉了將近七十萬頭牛羊豬，糧食錢財都用光了。","fx":[["sad","羅紹威"]]},{"t":"朱全忠走了，魏博的兵力也變得衰弱，再也擋不住他了。","mv":[["朱全忠",-7.2,1.0],["汴州兵",-7.6,-0.4],["汴州兵#2",-8.0,0.6]],"fx":[["focus","羅紹威"]]},{"who":"羅紹威","t":"集合六州四十三縣的鐵，也打造不出這麼大的一把「錯」啊！","fx":[["sad","羅紹威"]]}],"q":"「錯」本來是磨東西的銼刀，羅紹威用它比喻「錯誤」。後來比喻犯下無法挽回的大錯誤，叫做什麼？","wrong":[{"w":"大功告成","by":"朱全忠","line":"大功告成是事情順利完成。羅紹威可是後悔得不得了！"},{"w":"錦上添花","by":"牙兵","line":"錦上添花是好上加好。這件事是壞上加壞啦！"},{"w":"引狼入室","by":"羅紹威","line":"引狼入室是把壞人請進家裡，意思很接近！不過我說的是用六州的鐵，打造出一個大大的「錯」。"}],"hint":"打造鐵器，要先把鐵燒熔，倒進模子裡「鑄」。","after":"羅紹威雖然除掉了牙軍，魏博卻從此衰弱，只能聽朱全忠的話。","lesson":{"title":"唐朝滅亡","text":"隔年（西元 907 年），朱全忠逼唐朝皇帝讓位，自己建立後梁，唐朝就這樣滅亡了。中國進入了五代十國的分裂時代。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","title":"第三十七章．大唐風華","eps":[7,34,48]},{"key":"h33","name":"大宋文人","short":"宋朝","era":"西元 950–1100 年","color":"#3E8C8C","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["唐朝滅亡後，北方換了五個朝代，南方分成好幾個小國，叫做「五代十國」。","西元 960 年，將軍趙匡胤建立宋朝，首都在開封，慢慢統一了中原和南方。","宋朝很重視讀書人，靠科舉考試選官，出了好多學問家、文學家和好官。","這時候印刷術越來越發達，書變多了，讀書的人也越來越多。","一起去看看貪心的縣官、公正的包青天，還有寫史書、寫好文章的大人物吧！"],"people":[["包拯","開封府的長官，公正不收人情"],["程顥","北宋的大學問家，教學生打好基礎"],["司馬光","花十九年編寫《資治通鑑》"],["蘇軾","號東坡，詩、詞、文章、書法都厲害"]]},"stops":[{"id":"e21_03","yr":"五代．南唐時","place":"當塗縣衙","scene":"office","music":"map","cast":[["王魯",0.2,-0.6],["百姓",-6.8,0.8],["百姓",-7.4,1.8],["主簿",2.6,0.4]],"beats":[{"t":"五代的時候，南方的南唐有個縣官叫王魯。他最大的興趣，就是想辦法收錢、增加家產。"},{"who":"王魯","t":"錢越多越好，嘿嘿……","fx":[["cheer","王魯"]]},{"t":"有一天，一群百姓聯名寫了狀紙，來告縣裡的主簿收紅包、貪汙。","mv":[["百姓",-1.4,0.6],["百姓#2",-0.4,1.4]]},{"who":"百姓","t":"大人！主簿收了好多錢，請您處罰他！","fx":[["upset","百姓"]]},{"t":"主簿嚇得發抖。可是王魯看著狀紙，臉色比主簿還難看。","fx":[["sad","主簿"],["focus","王魯"]]},{"who":"王魯","t":"這上面寫的……不就跟我做的事一樣嗎？","fx":[["upset","王魯"]]}],"q":"王魯在狀紙上寫：「你們雖然只是在打草，我這條躲在草裡的蛇，已經被嚇到了。」現在比喻做事不小心，讓對方先察覺、有了防備，叫做什麼？","wrong":[{"w":"守株待兔","by":"百姓","line":"守株待兔是坐著等好運。我們可是主動來告狀的！"},{"w":"畫蛇添足","by":"主簿","line":"畫蛇添足是多做多餘的事，反而壞事。這裡的蛇可沒有長腳！"},{"w":"敲山震虎","by":"王魯","line":"敲山震虎是故意弄出聲音嚇對方，意思很接近！不過百姓告的是主簿，是不小心把我這條蛇嚇到了。"}],"hint":"百姓「打」的是草，被「驚」動的是什麼動物？","after":"王魯寫的這句判語傳了出去，變成大家的笑話。","lesson":{"title":"南唐與宋朝","text":"這個故事記在宋朝的《南唐近事》裡。原本是說懲罰甲，卻讓心虛的乙先嚇到；現在多用來比喻行動不小心，讓對方有了防備。南唐後來在西元 975 年被宋朝滅掉。","next":"宋朝統一以後，首都開封出了一位有名的清官，他上任第一件事，就是打開官府的正門……"}},{"id":"e22_03","yr":"西元 1056 年","place":"開封府","scene":"office","music":"palace","cast":[["包拯",0.2,-0.6],["衙役",-1.6,-0.4],["百姓",-7.0,1.0],["親戚",7.0,1.2]],"beats":[{"t":"從前百姓到官府告狀，不能直接走到長官面前，只能先交給小吏，常常被刁難、欺騙。"},{"who":"衙役","t":"不准進去！長官沒空！","fx":[["upset","衙役"]]},{"t":"包拯當上開封府的長官，第一件事就是下令打開正門。","fx":[["focus","包拯"]]},{"who":"包拯","t":"讓百姓直接到堂前來，把是非說清楚！","mv":[["百姓",-1.0,0.9]],"fx":[["say","包拯"],["cheer","百姓"]]},{"t":"有些親戚朋友想靠關係，請包拯幫忙說情。","mv":[["親戚",1.9,0.8]]},{"who":"包拯","t":"不管是誰，犯了法一樣照辦！","mv":[["親戚",7.2,1.2]],"fx":[["upset","包拯"],["sad","親戚"]]}],"q":"包拯辦案不講人情，送紅包、拉關係都沒有用，臉像鐵一樣嚴肅。這種公正嚴明、不偏私的樣子，叫做什麼？","wrong":[{"w":"徇私舞弊","by":"親戚","line":"徇私舞弊是為了私人關係做違法的事。包大人才不會這樣，害我白跑一趟！"},{"w":"見錢眼開","by":"衙役","line":"見錢眼開是看到錢就笑開了眼。我們大人看到紅包，臉反而更黑！"},{"w":"大公無私","by":"包拯","line":"大公無私是一心為公、沒有私心，意思很接近！不過大家說的是我的臉像鐵一樣，不講情面。"}],"hint":"什麼東西又冷又硬，一點都不會變軟？","after":"開封人都說：「關節不到，有閻羅包老。」意思是走後門沒用，包大人就像閻羅王一樣嚴。這個成語本身出自清朝小說《說呼全傳》。","lesson":{"title":"包青天","text":"包拯的故事記在《宋史．包拯傳》裡，他一生清廉，連親戚都不偏袒。戲曲裡包公的黑臉、龍頭鍘、日審陽夜審陰，都是後人的戲曲小說加上去的。","next":"同一個時代的洛陽，有一位溫和的老師，最擔心學生只想學最難的……"}},{"id":"e35_04","yr":"北宋神宗時","place":"洛陽．程家學堂","scene":"house","music":"palace","cast":[["程顥",0.2,-0.4],["學生",-1.6,0.9],["學生",1.6,1.0]],"beats":[{"t":"北宋的程顥是一位大學問家。他待人非常溫和，學生跟了他幾十年，從沒看過他生氣。"},{"who":"程顥","t":"先學會掃地、應對客人，再慢慢學大道理，一步一步來。","fx":[["say","程顥"]]},{"who":"學生","t":"掃地太簡單了啦！老師，我要直接學最高深的道理！","fx":[["upset","學生"]]},{"who":"學生#2","t":"對呀，做小事好無聊！","fx":[["cheer","學生#2"]]},{"t":"程顥搖搖頭。他發現很多學生都是這樣，最後什麼也沒學成。","fx":[["sad","程顥"],["focus","程顥"]]}],"q":"程顥擔心有些學生看不起身邊簡單的小事，一心只追求又高又遠的目標，最後什麼也學不成。這種毛病叫做什麼？","wrong":[{"w":"腳踏實地","by":"程顥","line":"腳踏實地是一步一腳印、踏實做事，那正是我希望你們做的！"},{"w":"循序漸進","by":"學生#2","line":"循序漸進是照順序一步一步來，那是老師的教法，不是我們的毛病啦。"},{"w":"眼高手低","by":"學生","line":"眼高手低是眼光很高、能力卻很差，意思很接近！不過老師說的是我們喜歡高的、追求遠的，看不起近的。"}],"hint":"「騖」念ㄨˋ，是追求的意思；喜歡「高」的，追求「遠」的。","after":"《宋史》說程顥「病學者厭卑近而騖高遠，卒無成焉」，就是擔心學生看不起近的小事，結果遠的也到不了。","lesson":{"title":"二程兄弟","text":"程顥和弟弟程頤合稱「二程」，他們的學問叫「理學」，後來影響中國好幾百年。成語「程門立雪」，說的就是學生在雪中等候程頤的故事。","next":"洛陽還住著另一位大人物，他關起門來，花了十九年寫一部超級大書……"}},{"id":"e24_01","yr":"情境故事","place":"城裡的書坊","scene":"study","music":"night","cast":[["老師傅",-0.3,-1.4],["小徒弟",6.8,1.0]],"beats":[{"t":"這一站是一個說明成語的情境故事。城裡的書坊來了一位抄書的老師傅，他接到一部好大的書要抄。","fx":[["say","老師傅"]]},{"who":"老師傅","t":"抄書，一個字也不能馬虎。一筆一畫，慢慢寫。","fx":[["focus","老師傅"]]},{"t":"日子一天天過去，抄好的書稿一疊一疊，堆得像小山一樣高。"},{"t":"小徒弟跑來幫忙整理，一頁一頁翻了好幾百頁。","mv":[["小徒弟",1.4,-0.6]]},{"who":"小徒弟","t":"咦？這麼多頁，竟然找不到一個寫歪、寫錯的字！","fx":[["upset","小徒弟"],["focus","小徒弟"]]}],"q":"老師傅抄了一大疊書稿，每個字都端端正正，連一根絲那麼小的地方都不隨便。形容做事認真細心、一點也不馬虎，叫做什麼？","wrong":[{"w":"粗心大意","by":"小徒弟","line":"粗心大意是做事不小心。師父的字一個都沒寫歪呢！"},{"w":"馬馬虎虎","by":"老師傅","line":"馬馬虎虎是隨隨便便、差不多就好。抄書可不能這樣！"},{"w":"精益求精","by":"小徒弟","line":"精益求精是已經很好了還要更好，意思很接近！不過這裡是說連最細小的地方都不隨便。"}],"hint":"「苟」是隨便的意思；連一「絲」都不隨便。","after":"「一絲不苟」的「苟」是隨便的意思。這個成語完整出現在清代小說《儒林外史》第四回。","lesson":{"title":"成語小學堂．一絲不苟","text":"「不苟」這個說法很早就出現在《周禮》，意思是不隨便。到了清代《儒林外史》，才有完整的「一絲不苟」四個字。這一站的老師傅是為了說明成語而編的故事。","next":"最後，我們跟著大文豪蘇軾，到南方的廣州，看他怎麼稱讚一位年輕人的文章……"}},{"id":"e35_06","yr":"西元 1100 年","place":"廣州","scene":"south","music":"final","cast":[["蘇軾",0.4,-0.4],["謝民師",-6.8,1.0]],"beats":[{"t":"蘇軾晚年被貶到很遠的海南島。這一年，他終於可以回到北方，路過廣州。"},{"t":"廣州有一位年輕官員謝民師，很崇拜蘇軾，好幾次跑來拜訪他。","mv":[["謝民師",-1.0,0.6]]},{"who":"謝民師","t":"蘇先生，這是學生寫的詩文，請您指教！","fx":[["say","謝民師"]]},{"who":"蘇軾","t":"好，我仔細看看。","fx":[["focus","蘇軾"]]},{"t":"蘇軾讀得很仔細，後來寫了一封長長的信回覆他。","fx":[["cheer","蘇軾"]]},{"who":"蘇軾","t":"你的文章就像天上的雲、地上的水，沒有固定的樣子。該走就走，該停就停，自然又好看！","fx":[["say","蘇軾"]]}],"q":"蘇軾說謝民師的文章，像飄動的雲、流動的水，自然流暢、不受拘束。後來形容文章或做事自然流暢，叫做什麼？","wrong":[{"w":"七零八落","by":"謝民師","line":"七零八落是零零散散、亂七八糟。老師是在誇我呢！"},{"w":"東拼西湊","by":"蘇軾","line":"東拼西湊是到處湊一點拼起來。他的文章可是自然寫出來的。"},{"w":"一氣呵成","by":"蘇軾","line":"一氣呵成是一口氣做完、中間不停，意思很接近！不過我說的是像雲和水一樣，自然流動、沒有固定的樣子。"}],"hint":"天上飄的是「雲」，地上流的是什麼？","after":"這封信就是有名的〈與謝民師推官書〉，原句是「大略如行雲流水，初無定質」。","lesson":{"title":"大文豪蘇東坡","text":"蘇軾號東坡，是「唐宋八大家」之一，詩、詞、文章、書法、畫都很厲害。他寫完這封信的隔年（西元 1101 年），在常州過世。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","title":"第三十八章．大宋文人","eps":[21,22,24,35]},{"key":"ch6","short":"宋元明","era":"西元 960–1644 年","color":"#8E3A2A","map":{"ground":"#a7c07c","river":"#4f9fd8"},"intro":{"lines":["唐朝滅亡後，經過五代十國的混亂，趙匡胤建立了宋朝。","宋朝文化非常發達，活字印刷在這時發明，指南針、火藥也用得越來越廣，還出了蘇軾等大文學家。","可是宋朝的武力比較弱，先後受到遼、金、蒙古的威脅，最後被蒙古建立的元朝滅掉。","元朝之後是明朝，再來是清朝。西元 1912 年中華民國成立，帝制結束。","這一章，我們從宋朝出發，一路走到明朝！"],"people":[["宋太祖","趙匡胤，建立宋朝"],["蘇軾","號東坡，宋朝大文學家"],["岳飛","南宋抗金名將"],["于謙","明朝的清官，保衛北京"]]},"stops":[{"id":"e35_01","yr":"西元 960 年","place":"陳橋驛","scene":"walls","music":"battle","cast":[["趙匡胤",0.2,-1.4,0,1,1],["將領",-1.6,0.6,0,1],["將領",1.8,0.8,0,0],["宋兵",-2.8,-0.2],["宋兵",-0.4,1.6],["宋兵",2.8,0]],"beats":[{"t":"唐朝滅亡後，中原接連換了五個朝代，叫做「五代」，天下又亂了五十多年。"},{"t":"後周的皇帝才七歲。大將趙匡胤帶兵出征，晚上駐紮在陳橋驛。"},{"t":"半夜，士兵們聚在驛站門口，商量一件大事。","fx":[["cheerAll","宋兵"]]},{"who":"將領","t":"皇上年紀太小，我們拚命打仗，誰知道我們的功勞？不如先立趙點檢當天子，再出征！"},{"t":"天一亮，趙匡胤走出房門。","mv":[["趙匡胤",0.2,-0.2]]},{"t":"大家拿出一件黃色的袍子，披在他身上，跪下來高呼萬歲！","fx":[["cheerAll","宋兵"],["cheerAll","將領"],["burst","趙匡胤","#e8b84f"]]}],"q":"士兵們把皇帝才能穿的黃袍披在趙匡胤身上，擁立他當皇帝。這叫做什麼？","wrong":[{"w":"衣錦還鄉","by":"將領","line":"衣錦還鄉是當了大官、穿著華服回家鄉。我們是要擁立新皇帝！"},{"w":"披星戴月","by":"將領","line":"披星戴月是早出晚歸、很辛苦。我們披在他身上的是黃袍！"},{"w":"眾望所歸","by":"趙匡胤","line":"眾望所歸是大家都支持，意思有點接近！不過「把黃袍披在身上」，有一個專門的成語。"}],"hint":"皇帝的袍子是什麼顏色？","after":"趙匡胤下令：「不准驚擾太后和皇上，不准搶奪百姓的財物！」軍隊整整齊齊地回到京城。","lesson":{"title":"宋朝建立","text":"趙匡胤建立宋朝，就是宋太祖。他怕將軍們也學他造反，就請大將們喝酒，勸他們交出兵權，這就是「杯酒釋兵權」。從此宋朝重用文官，文化非常發達。","next":"宋朝重文輕武，北方的遼國越來越強，常常南下侵擾……"}},{"id":"e35_05","yr":"西元 1004 年","place":"宋朝朝廷","scene":"palace","music":"palace","cast":[["寇準",-1.1,0.6],["宋真宗",1.4,0.6],["王欽若",6.5,1.4]],"beats":[{"t":"西元 1004 年，遼國大軍南下，一路打到澶州，離京城不遠了。"},{"t":"有大臣勸宋真宗往南方逃，宰相寇準卻堅決主張皇帝親自上前線。"},{"who":"寇準","t":"陛下親自出征，士兵一定會拚命作戰！","fx":[["say","寇準"]]},{"t":"宋真宗登上澶州城頭，士兵看到皇帝的旗子，歡聲雷動。遼軍不敢再進，雙方訂了和約，叫做「澶淵之盟」。","fx":[["cheer","宋真宗"]]},{"t":"真宗很感謝寇準。可是大臣王欽若嫉妒他，找機會在真宗面前說壞話。","mv":[["王欽若",2.8,1.4]]},{"who":"王欽若","t":"陛下知道賭博嗎？賭到快輸光的時候，把剩下的錢全部押上去，這叫做「孤注」。"},{"who":"王欽若","t":"寇準就是把陛下當成賭注，去跟遼國賭一把啊！","fx":[["upset","宋真宗"]]}],"q":"王欽若說寇準把皇帝當成最後的賭注，冒險一搏。後來比喻在危急時拿出全部力量冒險一次，叫做什麼？","wrong":[{"w":"萬無一失","by":"寇準","line":"萬無一失是絕對不會出錯。王欽若說的剛好相反，是在冒險！"},{"w":"一擲千金","by":"王欽若","line":"一擲千金是花錢非常大方。我說的是把最後的賭注全部押上！"},{"w":"破釜沉舟","by":"寇準","line":"破釜沉舟也是下定決心拚到底，意思很接近！不過王欽若用的是賭博的比喻。"}],"hint":"賭博時把剩下的錢一次全押上，叫做「孤注」。","after":"宋真宗聽了，從此漸漸疏遠寇準，後來寇準被罷去了宰相。","lesson":{"title":"澶淵之盟","text":"澶淵之盟後，宋朝每年送給遼國銀子和絹布，換來一百多年的和平。宋朝商業發達，城市熱鬧，還出現了世界上最早的紙幣「交子」。","next":"北宋出了許多大文學家，蘇軾就是其中一位。他有一位很會畫竹子的表哥……"}},{"id":"e35_07","yr":"北宋中期","place":"文與可的竹林","scene":"south","music":"palace","cast":[["文與可",1.2,0.4],["蘇軾",-6.5,1]],"beats":[{"t":"文與可是蘇軾的表哥，最會畫竹子。他常常待在竹林裡，仔細觀察竹子。","mv":[["文與可",3.6,-1.2]]},{"t":"晴天雨天、春夏秋冬，竹子的每一種樣子，他都看得清清楚楚。","mv":[["文與可",1.2,0.4]]},{"t":"有一天，蘇軾來找表哥。","mv":[["蘇軾",-1.2,0.6]]},{"who":"蘇軾","t":"表哥，你畫的竹子，怎麼這麼像真的？"},{"who":"文與可","t":"竹子剛長出來時只有一寸，可是節和葉子都已經有了。如果一節一節、一片一片拼起來畫，那就不像竹子了。"},{"who":"文與可","t":"所以畫竹子，一定要先……","fx":[["focus","文與可"]]}],"q":"文與可說：「畫竹子，一定要先在心裡有一棵完整的竹子，再一口氣畫出來。」後來比喻做事之前已經有完整的計畫，叫做什麼？","wrong":[{"w":"竹報平安","by":"蘇軾","line":"竹報平安是報平安的家書。表哥說的是畫竹子的方法！"},{"w":"勢如破竹","by":"蘇軾","line":"勢如破竹是像劈竹子一樣勢不可擋，那是晉朝杜預的故事。"},{"w":"心領神會","by":"文與可","line":"心領神會是心裡領悟了，意思有點接近！不過畫竹前心裡先有完整的竹子，有一個專門的成語。"}],"hint":"畫竹之前，竹子已經在哪裡了？","after":"蘇軾說：「這個道理我懂，卻畫不出來，因為練習還不夠。」","lesson":{"title":"唐宋八大家","text":"蘇軾號東坡，詩、詞、文章、書法、繪畫樣樣精通。他和父親蘇洵、弟弟蘇轍合稱「三蘇」，都名列「唐宋八大家」。他一生多次被貶官，卻總是樂觀面對。","next":"北宋也是學問興盛的時代。有兩位學生在大雪天，去拜見老師程頤……"}},{"id":"e07_05","yr":"西元 1093 年","place":"洛陽．程頤家","scene":"cottage","music":"palace","cast":[["程頤",1.4,-1.8],["楊時",-6.5,1],["游酢",-7.2,2]],"beats":[{"t":"楊時已經四十歲了，學問也很好，還是和朋友游酢一起，到洛陽拜程頤為老師。"},{"t":"這天下著大雪，他們來到程頤家。","mv":[["楊時",-0.2,0],["游酢",-1.3,0.6]]},{"t":"程頤正閉著眼睛，靜靜地坐著休息。","fx":[["focus","程頤"]]},{"who":"楊時","t":"老師在休息，我們別打擾他，在旁邊等吧。"},{"t":"兩人恭恭敬敬地站在一旁，一直沒有離開。門外的雪，一直下個不停……","fx":[["focus","楊時"]]},{"t":"過了好久，程頤醒過來——門外的雪，已經積了一尺深！","fx":[["upset","程頤"]]}],"q":"楊時和游酢在程頤家恭敬地等待，雪積了一尺深也不離開。後來比喻尊敬老師、誠心求學，叫做什麼？","wrong":[{"w":"雪中送炭","by":"游酢","line":"雪中送炭是在別人困難時幫忙。我們是在雪中等老師！"},{"w":"冰天雪地","by":"楊時","line":"冰天雪地是形容很冷。我們要找的是尊敬老師的成語！"},{"w":"尊師重道","by":"程頤","line":"尊師重道是尊敬老師、重視學問，意思很接近！不過「在程家門前站在雪中」，有一個專門的成語。"}],"hint":"他們在誰家等待？當時在下什麼？","after":"後來楊時把老師的學問帶到南方，成為有名的學者。","lesson":{"title":"宋代理學","text":"程顥、程頤兄弟是北宋有名的學者。他們的學問後來由南宋的朱熹發揚光大，叫做「理學」，影響中國好幾百年。楊時南歸時，程顥高興地說：「吾道南矣！」意思是我的學問要傳到南方了。","next":"北宋末年，北方的金國興起，滅了遼國，又大舉南下……"}},{"id":"e35_08","yr":"西元 1129 年","place":"南逃的江上","scene":"river","music":"night","cast":[["宋高宗",1.3,0.6],["大臣",-1.1,0.6,0,1],["大臣",2.7,1.6,0,0],["宋兵",-2.6,-0.4],["宋兵",-0.4,-1.4]],"beats":[{"t":"西元 1127 年，金兵攻破北宋首都開封，把兩位皇帝都抓走了，這就是「靖康之難」，北宋滅亡。"},{"t":"宋高宗在南方即位，歷史上叫「南宋」。可是金兵一路追來，他只好一直往南逃。","fx":[["sadAll","宋兵"]]},{"t":"從南京逃到揚州，又逃到建康、會稽，最後甚至逃到了海上。"},{"who":"宋高宗","t":"我派人送了那麼多禮物，甚至願意不稱皇帝，金人還是不肯講和……","fx":[["sad","宋高宗"]]},{"who":"大臣","t":"陛下，百姓過得好苦啊！"},{"t":"宋高宗終於下了一道詔書，要全國軍民同心協力，一起抵抗。","fx":[["focus","宋高宗"]]}],"q":"詔書上說：「與其綁住雙手等死，不如大家同心協力，奮勇向前。」綁住雙手等死，叫做什麼？","wrong":[{"w":"手忙腳亂","by":"大臣","line":"手忙腳亂是慌張得不知道怎麼辦。詔書說的是什麼都不做，只是等死。"},{"w":"拍手叫好","by":"宋兵","line":"拍手叫好是大聲稱讚。現在可不是叫好的時候！"},{"w":"坐以待斃","by":"宋高宗","line":"坐以待斃也是坐著等死，意思幾乎一樣！不過詔書上寫的是「綁住雙手」等死。"}],"hint":"雙手被綁住了，只能等什麼？","after":"後來宋軍在各地奮勇抵抗，金兵才漸漸退回北方。","lesson":{"title":"抗金名將","text":"南宋出現了許多抗金名將，像韓世忠和岳飛。韓世忠的夫人梁紅玉，還在戰場上親自擂鼓助戰。其中最有名的，就是岳飛和他的「岳家軍」。","next":"西元 1140 年，岳飛帶著岳家軍北伐……"}},{"id":"e35_02","yr":"西元 1140 年","place":"北伐前線","scene":"valley","music":"battle","cast":[["岳飛",-2.3,-0.6,0.25],["宋兵",-3.3,-1.6,0.25],["宋兵",-1.6,-1.8,0.25],["百姓",-6.5,1.6,0,1],["百姓",-7.2,2.6,0,0],["兀朮",3.4,-1.2,0.25],["金兵",2.3,-0.6,0.25],["金兵",3.6,-2.2,0.25]],"beats":[{"t":"西元 1140 年，金兵毀約南下。岳飛帶著岳家軍北伐，接連打了好幾場大勝仗。","fx":[["cheerAll","宋兵"]]},{"t":"百姓們爭著推車、牽牛，載著糧食來慰勞軍隊，還有人頭頂香盆，在路邊迎接。","mv":[["百姓",-2.4,1.4],["百姓#2",-3.4,2.2]]},{"who":"百姓","t":"岳家軍來了！我們有救了！","fx":[["cheerAll","百姓"]]},{"t":"金兵被打得節節敗退。金國統帥兀朮嘆氣說：「我們從北方起兵以來，從來沒有這麼慘過！」","mv":[["金兵",6,-3],["金兵#2",7,-4],["兀朮",6.6,-2.2]],"fx":[["sad","兀朮"]]},{"who":"岳飛","t":"弟兄們！","fx":[["focus","岳飛"]]}],"q":"岳飛高興地對部下說：「我們一路打到金國的黃龍府，再和大家痛快喝酒！」後來比喻直接攻進敵人的大本營，叫做什麼？","wrong":[{"w":"畫龍點睛","by":"宋兵","line":"畫龍點睛是在關鍵地方加一筆。將軍說的是黃龍府，是金國的大城！"},{"w":"龍飛鳳舞","by":"百姓","line":"龍飛鳳舞是形容書法筆勢活潑。我們在說打仗啦！"},{"w":"長驅直入","by":"岳飛","line":"長驅直入是一路順利地攻進去，意思很接近！不過我說的是直接打到黃龍府。"}],"hint":"金國的重要城市叫「黃龍府」。","after":"可惜不久之後，朝廷一天之內連發十二道金牌，命令岳飛撤兵。","lesson":{"title":"盡忠報國","text":"岳飛被召回後，宰相秦檜用「莫須有」的罪名害死了他，那年他才三十九歲。岳飛背上刺著「盡忠報國」四個字，後人常說成「精忠報國」，他成為中國歷史上最受敬重的英雄之一。","next":"岳飛死後，南宋和金國以淮河為界。到了宋寧宗時，朝廷裡又出了問題……"}},{"id":"e35_03","yr":"約西元 1195 年","place":"南宋朝廷","scene":"office","music":"palace","cast":[["蔡幼學",-6.5,1],["宋寧宗",0.2,-1.2],["官員",2,1.2,0,1],["官員",3,0.2,0,0],["官員",-1.6,1.4,0,0]],"beats":[{"t":"南宋寧宗時，朝廷裡有些小人掌權，專門排擠正直的大臣，還把他們的學問說成「偽學」，禁止傳播。"},{"t":"大臣想做事，怕被說成多事；身邊的人想說真話，又怕惹皇帝不高興被趕走。"},{"t":"上朝的時候，滿朝官員都低著頭，誰也不敢開口。","fx":[["sadAll","官員"]]},{"t":"大臣蔡幼學看不下去，上書給皇帝。","mv":[["蔡幼學",-0.6,0.6]]},{"who":"蔡幼學","t":"陛下想當好皇帝，要孝順長輩、任用賢人、對百姓寬厚，最根本的是多讀書、講求學問。"},{"who":"蔡幼學","t":"現在朝廷裡站滿了官員，卻……","fx":[["focus","蔡幼學"]]}],"q":"蔡幼學說：滿朝官員，卻連一個計策都不肯提出來。後來形容一點辦法也想不出來，叫做什麼？","wrong":[{"w":"足智多謀","by":"官員","line":"足智多謀是很有智慧、計謀很多。剛好相反喔！"},{"w":"一言九鼎","by":"宋寧宗","line":"一言九鼎是說話很有分量。現在是大家都不說話！"},{"w":"束手無策","by":"蔡幼學","line":"束手無策也是沒有辦法，意思很接近！不過「籌」是計策，有一個用「籌」的成語。"}],"hint":"「籌」是古人計算用的竹籤，引申為計策。","after":"蔡幼學勸皇帝多讀書、多找人才，才能培養出天下的人才。","lesson":{"title":"宋朝滅亡","text":"後來北方的蒙古興起，先滅了金國，又南下攻打南宋。西元 1279 年，南宋在崖山海戰失敗，宋朝滅亡，蒙古人建立了元朝。被俘的文天祥寫下：「人生自古誰無死，留取丹心照汗青。」","next":"元朝之後是明朝。明朝有一位非常清廉的大臣，叫做于謙……"}},{"id":"e22_02","yr":"明朝","place":"進京路上","scene":"road","music":"map","cast":[["于謙",-6.5,1],["地方官",2,1,0,1],["地方官",2.8,0,0,0]],"beats":[{"t":"元朝之後，朱元璋建立了明朝。明朝時，地方官員進京，常常帶著當地的土產，送給京城的大官。","fx":[["prop","cart",3.6,-1.4,0]]},{"who":"地方官","t":"這些手帕、香菇、線香，都是要送給京城大人的禮物！","fx":[["cheerAll","地方官"]]},{"t":"河南的官員于謙也要進京，他卻什麼禮物都沒帶。","mv":[["于謙",-1,0.6]]},{"who":"地方官","t":"于大人，您怎麼兩手空空？至少帶點土產吧！"},{"who":"于謙","t":"這些東西本來是給百姓用的，拿去送禮，反而害了百姓。","fx":[["focus","于謙"]]}],"q":"于謙寫詩說：「清風兩袖朝天去」——除了袖子裡的清風，什麼都不帶去見皇帝。後來比喻當官清廉，叫做什麼？","wrong":[{"w":"兩全其美","by":"地方官","line":"兩全其美是兩方面都顧到。于大人說的是什麼禮物都不帶！"},{"w":"滿載而歸","by":"地方官","line":"滿載而歸是收穫很多。于大人可是兩手空空！"},{"w":"一塵不染","by":"于謙","line":"一塵不染也可以形容清廉，意思很接近！不過我詩裡寫的是袖子裡的清風。"}],"hint":"于謙的兩個袖子裡，只有什麼？","after":"于謙說，這樣才「免得閭閻話短長」——免得老百姓說閒話。","lesson":{"title":"保衛北京的于謙","text":"後來發生「土木堡之變」，明朝皇帝被蒙古瓦剌抓走，于謙挺身而出保衛北京，救了明朝。相傳是他寫的〈石灰吟〉：「粉身碎骨渾不怕，要留清白在人間」，正是他一生的寫照。明朝之後是清朝，也是中國最後一個帝制王朝。","next":"宋朝以後這一章完成了！恭喜你走完從春秋到明朝的成語時空之旅。"}}],"line":"history","name":"宋朝以後","title":"第三十九章．宋朝以後","eps":[7,22,35]},{"key":"i01","name":"傻事與智慧","short":"寓言島","era":"《韓非子》《呂氏春秋》等古代寓言","color":"#3FA796","map":{"ground":"#9fcf7a","river":"#4fa8d8"},"intro":{"lines":["歡迎來到成語寓言島！這裡的故事不講年代，講的是道理。","古代的思想家很會說故事，《韓非子》《呂氏春秋》《戰國策》《列子》《淮南子》裡都藏著有趣的寓言。","故事裡的人常常做傻事：守著樹樁等兔子、在船上刻記號找劍……","笑完之後想一想：他們錯在哪裡？聰明人又會怎麼做？"],"people":[["韓非","戰國末年的思想家，寫了《韓非子》"],["呂不韋","秦國丞相，請門客編成《呂氏春秋》"],["塞翁","住在邊塞的老人，看得開好事和壞事"]]},"stops":[{"id":"e01_01","yr":"《韓非子．五蠹》","place":"宋國的田邊","scene":"south","music":"map","cast":[["農夫",0.4,0.2],["兔子",6.8,-0.8,0,1,1],["村民",-6.8,1.0]],"beats":[{"t":"這個寓言出自《韓非子》。宋國有個農夫，每天在田裡辛苦耕作。田中央有一截老樹樁。"},{"who":"農夫","t":"今天也要好好耕田！","fx":[["say","農夫"]]},{"t":"忽然，一隻兔子飛奔過來，咚！一頭撞上樹樁，倒在地上不動了。","mv":[["兔子",1.4,-0.6]],"fx":[["upset","農夫"]]},{"who":"農夫","t":"哇！兔子自己送上門來了！今晚有兔肉吃囉！","fx":[["cheer","農夫"]]},{"t":"農夫心想：種田好累，不如每天在這裡等兔子。他放下農具，天天守著樹樁。","fx":[["focus","農夫"]]},{"t":"一天、兩天、一個月……兔子再也沒來，田裡長滿了雜草。","mv":[["村民",-1.0,0.6]],"fx":[["sad","農夫"]]},{"who":"村民","t":"還在等兔子啊？哈哈哈！","fx":[["cheer","村民"]]}],"q":"農夫丟下農具，天天守著樹樁，想再撿到撞死的兔子。後來比喻不想努力、只想靠運氣得到好處，是哪個成語？","wrong":[{"w":"守口如瓶","by":"村民","line":"守口如瓶是嘴巴很緊、不洩漏秘密。他守的是樹樁，不是秘密啦！"},{"w":"狡兔三窟","by":"農夫","line":"狡兔三窟是聰明的兔子準備三個洞來躲。我連一隻兔子都等不到，哪來三個洞？"},{"w":"不勞而獲","by":"村民","line":"不勞而獲是不努力就想得到好處，意思很接近！不過它不是從這個故事來的，故事裡有樹樁和兔子喔。"}],"hint":"「株」是樹樁，「待」是等待。","after":"兔子再也沒有來，農夫的田荒了，他成了宋國人的笑柄。","lesson":{"title":"成語小學堂．守株待兔","text":"韓非子用這個故事批評：時代已經改變，還想用古代的老方法治理國家，就像守著樹樁等兔子。現在常用來形容不努力、只想等好運，或死守舊經驗不知變通。","next":"同樣是不懂變通，楚國有個坐船過江的人，也做了一件傻事……"},"winSad":"農夫"},{"id":"e01_02","yr":"《呂氏春秋．察今》","place":"楚國的江上","scene":"river","music":"map","cast":[["楚人",0.3,0.4],["船夫",1.9,-0.4],["乘客",-1.2,-0.6]],"beats":[{"t":"這個寓言出自《呂氏春秋》。有個楚國人坐船過江，腰上佩著一把寶劍。"},{"who":"楚人","t":"江上風景真好啊！","fx":[["cheer","楚人"]]},{"t":"船搖啊搖，噗通一聲，寶劍從船邊掉進江裡了！","fx":[["upset","楚人"]]},{"t":"他急忙拿出小刀，在船邊刻了一個記號。","fx":[["focus","楚人"]]},{"who":"楚人","t":"劍是從這裡掉下去的，刻好記號，等一下就找得到！","fx":[["say","楚人"]]},{"t":"船繼續往前划，到了對岸停下來。楚人從記號的地方跳下水，找來找去……","mv":[["楚人",2.4,1.2]],"fx":[["sad","楚人"]]},{"who":"船夫","t":"客人，船早就走遠了，劍可沒有跟著船走啊！","fx":[["say","船夫"]]}],"q":"船已經走了，劍還在原來的地方，楚人卻照著船上的記號找劍。比喻做事死板、不懂得隨情況改變，是哪個成語？","wrong":[{"w":"一帆風順","by":"船夫","line":"一帆風順是事情很順利。他的劍都掉進江裡了，一點也不順！"},{"w":"破釜沉舟","by":"乘客","line":"破釜沉舟是下定決心拚到底。我們只是過江，船可千萬不能弄沉啊！"},{"w":"守株待兔","by":"乘客","line":"守株待兔也是不知變通，但它還多了「想不勞而獲」的意思。這位客人不是想撿便宜，他是死守著船上的記號！"}],"hint":"他的動作是「刻」，記號刻在船（舟）上，想找回的是寶劍。","after":"船已經前進了，劍卻還沉在江底原來的地方，楚人當然找不到。","lesson":{"title":"成語小學堂．刻舟求劍","text":"《呂氏春秋》說：時代變了，法令卻不跟著改，用這種方法治理國家，就跟刻記號找劍一樣糊塗。現在常用來提醒人：情況變了，方法也要跟著調整。","next":"楚國人除了死板，也有自作聰明的。有一群門客，正要比賽畫蛇……"}},{"id":"e01_03","yr":"《戰國策．齊策二》","place":"楚國人家的院子","scene":"house","music":"palace","cast":[["主人",1.6,-0.6],["門客甲",-0.6,0.4],["門客乙",0.9,0.8],["門客丙",2.2,1.0]],"beats":[{"t":"這個寓言出自《戰國策》。楚國有戶人家祭祀完，把一壺酒賞給幫忙的門客。","mv":[["主人",7.5,-0.6]]},{"who":"門客甲","t":"酒只有一壺，幾個人喝不夠，一個人喝剛剛好。","fx":[["say","門客甲"]]},{"who":"門客乙","t":"那我們在地上比賽畫蛇，誰先畫好，酒就給誰！","fx":[["cheer","門客乙"]]},{"t":"大家趴在地上畫起來。門客甲畫得最快，一下子就畫好了，還把酒壺拿在手上。","fx":[["focus","門客甲"]]},{"who":"門客甲","t":"你們好慢喔！我還有時間，再幫蛇畫上幾隻腳！","fx":[["cheer","門客甲"]]},{"t":"腳還沒畫完，門客乙的蛇也畫好了，一把搶過酒壺。","mv":[["門客乙",0.2,0.3]],"fx":[["upset","門客甲"]]},{"who":"門客乙","t":"蛇本來就沒有腳，你怎麼能幫牠畫腳呢？這酒歸我啦！","fx":[["cheer","門客乙"]]}],"q":"門客甲明明先畫好蛇，卻多畫了腳，結果把酒輸掉了。比喻做了多餘的事，反而把事情弄糟，是哪個成語？","wrong":[{"w":"杯弓蛇影","by":"門客丙","line":"杯弓蛇影是把影子看成蛇、自己嚇自己。我們是在地上畫蛇，沒人被嚇到啦！"},{"w":"畫龍點睛","by":"門客乙","line":"畫龍點睛是加上最關鍵的一筆，讓作品更生動。他加的是多餘的腳，反而輸了！"},{"w":"多此一舉","by":"門客乙","line":"多此一舉是做了不必要的事，意思很接近！不過這個故事有個專門的成語，跟畫畫有關喔。"}],"hint":"蛇本來沒有「足」，他卻多「添」了上去。","after":"多畫了蛇腳的門客甲，到頭來一口酒也沒喝到。","lesson":{"title":"成語小學堂．畫蛇添足","text":"這個故事是陳軫說給楚國大將昭陽聽的。昭陽已經打了大勝仗，還想再攻打齊國，陳軫勸他：再打也升不了更高的官，萬一失敗，就像幫蛇畫腳一樣。昭陽聽了，就撤兵回去了。","next":"話說得太滿也會出糗。楚國的市場上，有個人正在大聲叫賣……"},"winSad":"門客甲"},{"id":"e01_04","yr":"《韓非子．難一》","place":"楚國的市場","scene":"road","music":"map","cast":[["商人",0.4,0.0],["老先生",6.8,1.0],["路人",-1.2,-0.8],["路人",2.0,-1.2]],"beats":[{"t":"這個寓言出自《韓非子》。楚國的市場上，有個人同時在賣盾和矛。"},{"who":"商人","t":"快來看！我的盾最堅固，再尖的東西都刺不穿！","fx":[["say","商人"]]},{"who":"商人","t":"再看我的矛！天下最鋒利，什麼東西都刺得穿！","fx":[["cheer","商人"]]},{"t":"圍觀的人越來越多。一位老先生走過來，摸摸鬍子。","mv":[["老先生",1.8,0.8]]},{"who":"老先生","t":"那請問：用你的矛，去刺你的盾，結果會怎麼樣呢？","fx":[["focus","老先生"]]},{"t":"商人張大嘴巴，半天說不出一句話。","fx":[["upset","商人"]]},{"who":"路人","t":"哈哈，答不出來了吧！","fx":[["cheerAll","路人"]]}],"q":"商人說盾什麼都擋得住，又說矛什麼都刺得穿，前後的說法互相衝突。這是哪個成語？","wrong":[{"w":"堅如磐石","by":"路人","line":"堅如磐石是像大石頭一樣堅固，只能拿來誇盾。問題是他把矛也一起誇過頭了！"},{"w":"銳不可當","by":"路人#2","line":"銳不可當是氣勢猛烈、擋都擋不住，只能拿來誇矛。可是他的盾又說擋得住，到底誰贏？"},{"w":"出爾反爾","by":"老先生","line":"出爾反爾是說話不算話、一下又反悔，有點像！但他不是反悔，而是同時說了兩句互相打架的話。"}],"hint":"自己說的話，自己跟自己衝突；關鍵就是那兩種兵器的名字。","after":"商人一句話也答不出來。因為「刺不穿的盾」和「什麼都刺得穿的矛」，根本不可能同時存在。","lesson":{"title":"成語小學堂．自相矛盾","text":"「矛」是用來刺的長兵器，「盾」是擋攻擊的護具。現在說話或做事前後互相衝突，就叫自相矛盾，例如：「他說最討厭吃甜食，卻一口氣吃了三塊蛋糕。」","next":"有人說話不經大腦，也有人以為自己聽不見，別人就聽不見……"},"winSad":"商人"},{"id":"e01_05","yr":"《呂氏春秋．自知》","place":"范氏的空宅","scene":"house","music":"night","cast":[["貪心人",6.8,0.8],["村民",-6.8,1.0]],"beats":[{"t":"這個寓言出自《呂氏春秋》。晉國的范氏家族垮了，一家人逃走，大宅裡留下一口大鐘。"},{"t":"有個人偷偷溜進宅子，看見了那口鐘。","mv":[["貪心人",0.9,0.2]]},{"who":"貪心人","t":"好漂亮的鐘！我要把它背回家！","fx":[["cheer","貪心人"]]},{"t":"可是鐘又大又重，怎麼背都背不動。他想：把鐘敲碎，再一塊一塊搬走吧！","fx":[["sad","貪心人"]]},{"t":"他舉起槌子用力一敲，「噹——」鐘聲大得嚇人！他怕別人聽見跑來搶，趕緊摀住自己的耳朵。","fx":[["upset","貪心人"],["focus","貪心人"]]},{"who":"貪心人","t":"嘿嘿，我聽不見，別人一定也聽不見！","fx":[["say","貪心人"]]},{"who":"村民","t":"那麼大聲，誰聽不見啊！","mv":[["村民",-1.0,0.6]],"fx":[["upset","村民"]]}],"q":"那人怕別人聽見鐘聲，竟然摀住自己的耳朵，以為這樣別人也聽不見。比喻自己騙自己，是哪個成語？","wrong":[{"w":"耳聰目明","by":"村民","line":"耳聰目明是耳朵靈、眼睛亮。他把耳朵摀起來，什麼都不想聽！"},{"w":"一鳴驚人","by":"村民","line":"一鳴驚人是一出手就有驚人的表現。鐘聲是很驚人啦，可是這個人只想偷偷摸摸！"},{"w":"充耳不聞","by":"村民","line":"充耳不聞是塞住耳朵、故意不聽別人的話，有點像！但他摀耳朵是以為自己聽不到，別人也聽不到，那是自己騙自己。"}],"hint":"他「掩」住的是自己的耳朵；後人說故事時，偷的東西變成了小小的鈴。","after":"其實鐘聲大家都聽見了，只有他自己以為沒人知道。","lesson":{"title":"成語小學堂．掩耳盜鈴","text":"原本故事裡偷的是「鐘」，後人傳著傳著變成了「鈴」。《呂氏春秋》用它比喻：當國君的如果討厭聽到自己的錯，就跟摀耳朵偷鐘的人一樣糊塗。","next":"有人自己騙自己，也有人整天替不可能發生的事擔心……"}},{"id":"e01_06","yr":"《列子．天瑞》","place":"杞國的村子","scene":"night","music":"night","cast":[["杞國人",0.4,0.2],["朋友",6.8,1.0]],"beats":[{"t":"這個寓言出自《列子》。杞國有個人，整天抬頭看天空，愁眉苦臉。","fx":[["sad","杞國人"]]},{"who":"杞國人","t":"天要是塌下來，我們要躲到哪裡去？","fx":[["upset","杞國人"]]},{"t":"他又怕地會裂開陷下去，擔心得睡不著覺，飯也吃不下。有個朋友聽說了，特地來開導他。","mv":[["朋友",1.9,0.6]]},{"who":"朋友","t":"天只是一團氣，我們每天在氣裡走來走去、呼吸，怎麼會塌呢？","fx":[["say","朋友"]]},{"who":"杞國人","t":"那太陽、月亮、星星，不會掉下來嗎？","fx":[["upset","杞國人"]]},{"who":"朋友","t":"它們也只是會發光的氣，就算掉下來，也傷不了人。地是一大塊土，你天天在上面走，也壞不了！","fx":[["focus","朋友"]]}],"q":"杞國人整天擔心天會塌下來，擔心得吃不下、睡不著。比喻沒有必要的擔心，是哪個成語？","wrong":[{"w":"天長地久","by":"朋友","line":"天長地久是像天地一樣長久。天地好好的呢，你根本不用擔心它們塌掉！"},{"w":"頂天立地","by":"朋友","line":"頂天立地是形容人光明正大、有骨氣。你又不用撐住天，別緊張啦！"},{"w":"庸人自擾","by":"朋友","line":"庸人自擾是本來沒事，自己找麻煩，意思很接近！不過這個故事的主角是杞國人，有一個專門的成語。"}],"hint":"主角是「杞」國人，他擔心的是頭上的「天」。","after":"聽完朋友的解釋，杞國人終於放下心來，開心得不得了；朋友也跟著開心起來。","lesson":{"title":"成語小學堂．杞人憂天","text":"《列子》相傳是戰國時列禦寇的書，裡面有很多有趣的寓言。現在常用這個成語勸人：不要為了不會發生的事煩惱。「杞」讀ㄑㄧˇ，是周朝的一個小國。","next":"擔心不會發生的事沒有用。那遇到真正的壞事，又該怎麼看待呢？邊塞有位老人……"},"winMv":[["朋友",1.2,0.4]]},{"id":"e01_07","yr":"《淮南子．人間》","place":"邊塞的村子","scene":"walls","music":"map","cast":[["老人",0.6,0.2],["兒子",1.9,1.0],["鄰居",-6.8,1.2],["駿馬",6.8,-1.4,0,1,1],["胡馬",7.6,-0.6,0,1,1]],"beats":[{"t":"這個寓言出自《淮南子》。靠近邊塞住著一位老人，有一天，他的馬無緣無故跑到胡人那邊去了。"},{"who":"鄰居","t":"唉呀，真可惜，馬丟了！","mv":[["鄰居",-1.0,0.6]],"fx":[["sad","鄰居"]]},{"who":"老人","t":"丟了馬，怎麼知道不是好事呢？","fx":[["say","老人"]]},{"t":"幾個月後，那匹馬竟然回來了，還帶回一匹胡人的駿馬！","mv":[["駿馬",1.4,-1.2],["胡馬",2.6,-1.0]],"fx":[["cheer","鄰居"]]},{"who":"老人","t":"多了一匹好馬，怎麼知道不是壞事呢？","fx":[["focus","老人"]]},{"t":"兒子很愛騎新來的駿馬，結果摔了下來，跌斷了腿。","fx":[["sad","兒子"]]},{"t":"一年後胡人打進來，年輕人都得上戰場，很多人沒能回家。兒子因為腿傷不用打仗，父子都平安。","fx":[["focus","兒子"]]}],"q":"老人丟了馬，後來卻得到駿馬；兒子摔斷腿，卻因此保住性命。比喻壞事也可能變成好事，是哪個成語？","wrong":[{"w":"馬到成功","by":"鄰居","line":"馬到成功是一開始就順利成功。老人家的事可是好壞一直在變！"},{"w":"千軍萬馬","by":"兒子","line":"千軍萬馬是形容軍隊很多、聲勢浩大。我們家只有兩匹馬啦！"},{"w":"否極泰來","by":"老人","line":"否極泰來是壞運到了盡頭、好運就來，意思很接近！不過我這個故事是從丟馬開始的，有個專門的成語。"}],"hint":"主角是住在邊「塞」的老人（翁），故事從丟了一匹馬開始。","after":"好事和壞事一直在互相轉變，老人始終平靜地看待。","lesson":{"title":"成語小學堂．塞翁失馬","text":"完整的說法是「塞翁失馬，焉知非福」。「塞」在這裡讀ㄙㄞˋ，是邊塞的意思。現在常用來安慰遇到挫折的人：眼前的損失，說不定會帶來意想不到的好處。","next":"遇到壞事不要灰心，更重要的是趕快補救。有個牧羊人，羊圈破了一個洞……"}},{"id":"e01_08","yr":"《戰國策．楚策四》","place":"牧羊人的羊圈","scene":"cottage","music":"map","cast":[["牧羊人",0.5,0.2],["鄰居",-6.8,1.1],["狼",6.8,-1.6,0,1,1]],"beats":[{"t":"這句話出自《戰國策》裡的一句俗語。我們用一個小故事看看它的意思：有個牧羊人，羊圈破了一個洞。"},{"t":"夜裡，狼從破洞鑽進來，叼走了一隻羊。","mv":[["狼",1.6,-1.2]],"fx":[["upset","牧羊人"]]},{"who":"鄰居","t":"羊圈破了，快把洞補起來吧！","mv":[["鄰居",-1.0,0.6],["狼",8.0,-1.6]]},{"who":"牧羊人","t":"羊都已經丟了，現在補也沒用啦！","fx":[["say","牧羊人"]]},{"t":"第二天早上，牧羊人一數，羊又少了一隻！","fx":[["sad","牧羊人"]]},{"who":"牧羊人","t":"原來不補洞，狼還會再來！我現在就去補！","fx":[["focus","牧羊人"]]},{"t":"他趕緊把羊圈補好，從此再也沒丟過羊。","fx":[["cheer","牧羊人"]]}],"q":"牧羊人丟了羊之後，趕緊把羊圈修好，從此不再丟羊。比喻出了問題趕快補救，還來得及，是哪個成語？","wrong":[{"w":"羊入虎口","by":"鄰居","line":"羊入虎口是落進危險的地方，凶多吉少。我們現在要做的是補洞救羊！"},{"w":"順手牽羊","by":"牧羊人","line":"順手牽羊是趁機偷拿別人的東西。叼走羊的是狼，我可沒偷別人的羊！"},{"w":"未雨綢繆","by":"鄰居","line":"未雨綢繆是下雨前先把屋子修好，是「事前」預防。牧羊人是丟了羊「之後」才補救，剛好不一樣！"}],"hint":"「亡」是丟失，「牢」是關牲畜的圈欄。","after":"羊圈補好了，狼再也鑽不進來。牧羊人的故事是後人依照這句俗語編出來的。","lesson":{"title":"成語小學堂．亡羊補牢","text":"戰國時，楚襄王不聽大臣莊辛的勸告，後來秦國攻進楚國都城。莊辛對他說：「看到兔子再叫獵狗，還不算晚；丟了羊再修羊圈，也還不算遲。」楚襄王很後悔，重新重用莊辛。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第一島．傻事與智慧","eps":[1]},{"key":"i02","name":"糊塗人的大道理","short":"糊塗村","era":"《孟子》《韓非子》《莊子》等古代寓言","color":"#D9894A","map":{"ground":"#c9c27a","river":"#4f9fd8"},"intro":{"lines":["這一區住著好多糊塗人：有人把秧苗拔高、有人駕車往反方向跑……","這些故事大多來自《孟子》《韓非子》《戰國策》《莊子》。","古人說故事不只是為了好笑，而是要勸國君、教學生懂道理。","一邊看糊塗人出糗，一邊想想：換成你，會怎麼做？"],"people":[["孟子","戰國時代的儒家大師，被尊為「亞聖」"],["莊子","戰國時代的思想家，最會用寓言說道理"],["南郭先生","不會吹竽，卻混進樂隊的人"]]},"stops":[{"id":"e02_01","yr":"《孟子．公孫丑上》","place":"宋國的田裡","scene":"south","music":"map","cast":[["農夫",0.4,0.0],["兒子",3.2,1.4]],"beats":[{"t":"這個寓言出自《孟子》。宋國有個農夫，每天都到田裡看他種的秧苗。"},{"who":"農夫","t":"怎麼長得這麼慢？我等不及了！","fx":[["upset","農夫"]]},{"t":"他想到一個「好辦法」：把每一棵苗都往上拔高一點點。","mv":[["農夫",1.2,-0.8]],"fx":[["focus","農夫"]]},{"who":"農夫","t":"長高一點！再高一點！","fx":[["say","農夫"]]},{"t":"忙了一整天，他累得半死，回到家還得意洋洋。","mv":[["農夫",2.2,1.0]]},{"who":"農夫","t":"今天累壞了！我幫苗長高了！","fx":[["cheer","農夫"]]},{"t":"兒子一聽，急忙跑到田裡去看，苗全都枯死了！","mv":[["兒子",0.2,-0.8]],"fx":[["sad","兒子"]]}],"q":"農夫嫌苗長得慢，就把苗一棵棵拔高，結果苗都枯死了。比喻急著求成，反而把事情弄壞，是哪個成語？","wrong":[{"w":"拔刀相助","by":"兒子","line":"拔刀相助是看到別人有難，挺身幫忙。爸爸拔的是苗，不是刀，而且是越幫越忙！"},{"w":"雨後春筍","by":"農夫","line":"雨後春筍是新事物一下子冒出好多。我倒希望苗像春筍一樣，自己長快一點！"},{"w":"急功近利","by":"兒子","line":"急功近利是急著求成功、只看眼前的好處，有點像！不過爸爸是硬把苗拔高，故事裡有個專門的成語。"}],"hint":"「揠」是拔起來；農夫原本是想「幫助」苗長高。","after":"苗被拔鬆了，根抓不住土，當然就枯死了。","lesson":{"title":"成語小學堂．揠苗助長","text":"孟子用這個故事說明：培養品德要一點一滴慢慢來，不能放著不管，也不能硬要拔高。現在也寫成「拔苗助長」，常用來提醒大家：學習要按部就班。","next":"急著求成會壞事，方向錯了更糟糕。有個人駕著馬車，說要去南方的楚國……"},"winSad":"農夫"},{"id":"e02_02","yr":"《戰國策．魏策四》","place":"太行山下的大路","scene":"road","music":"map","cast":[["趕路人",0.6,0.2],["車夫",2.0,0.8],["季梁",-6.8,1.0]],"beats":[{"t":"這個寓言出自《戰國策》。魏國大臣季梁在大路上，看見一輛馬車正往北走。","mv":[["季梁",-1.0,0.6]],"fx":[["prop","cart",1.8,-1.0,0]]},{"who":"趕路人","t":"我要去楚國！快趕路！","fx":[["cheer","趕路人"]]},{"who":"季梁","t":"楚國在南邊，你怎麼往北走呢？","fx":[["upset","季梁"]]},{"who":"趕路人","t":"沒關係，我的馬跑得很快！","fx":[["say","趕路人"]]},{"who":"季梁","t":"馬再快，這也不是去楚國的路啊！","fx":[["focus","季梁"]]},{"who":"趕路人","t":"我帶的路費很多，我的車夫技術也很好！","fx":[["cheer","車夫"]]},{"t":"季梁搖搖頭：馬越好、錢越多、車夫越厲害，就離楚國越遠了。","fx":[["sad","季梁"]]}],"q":"那人要去南方的楚國，卻駕車往北走，條件越好，離目標越遠。比喻行動和目的相反，是哪個成語？","wrong":[{"w":"東奔西跑","by":"車夫","line":"東奔西跑是到處忙碌奔走。我們可是一路往北，方向非常堅定！"},{"w":"一路順風","by":"季梁","line":"一路順風是祝人旅途平安。可是方向錯了，再順也到不了楚國啊！"},{"w":"背道而馳","by":"季梁","line":"背道而馳是朝相反方向走，意思非常接近！不過這個故事裡有車子的轅和車輪痕跡，有個專門的成語。"}],"hint":"心裡想往「南」，車子卻往「北」。想想車子的「轅」和車輪壓出的「轍」。","after":"季梁回到宮裡，把這件事說給魏王聽。","lesson":{"title":"成語小學堂．南轅北轍","text":"當時魏王想攻打趙國的都城邯鄲，靠武力稱霸天下。季梁勸他：仗打得越多，離「讓天下人信服」的目標就越遠，就像要去楚國卻往北走一樣。","next":"做事要方向對，也要有真本事。齊國的樂隊裡，就混進了一位不會吹竽的人……"}},{"id":"e02_03","yr":"《韓非子．內儲說上》","place":"齊國王宮","scene":"palace","music":"palace","cast":[["齊宣王",1.2,-0.4],["齊湣王",1.2,-0.4,0,1,1],["南郭先生",-6.8,1.0],["樂師",-1.6,-1.0],["樂師",2.6,0.4],["樂師",0.0,-1.6]],"beats":[{"t":"這個寓言出自《韓非子》。齊宣王很愛聽人吹竽，每次都要三百人一起合奏。","fx":[["cheerAll","樂師"]]},{"t":"有位南郭先生根本不會吹竽，也跑來請求加入樂隊。","mv":[["南郭先生",-0.4,0.6]]},{"who":"南郭先生","t":"大王，我很會吹竽！請讓我加入吧！","fx":[["say","南郭先生"]]},{"t":"齊宣王很高興，給他和其他樂師一樣多的糧食。南郭先生每天跟著大家，鼓著腮幫子裝樣子。","fx":[["focus","南郭先生"]]},{"t":"後來齊宣王去世，他的兒子齊湣王即位。","mv":[["齊宣王",8.0,-1.0],["齊湣王",1.2,-0.4]]},{"who":"齊湣王","t":"我喜歡一個一個聽。從明天起，每人輪流吹給我聽！","fx":[["say","齊湣王"]]},{"t":"南郭先生嚇壞了，當天晚上就偷偷逃走了。","mv":[["南郭先生",-8.0,1.4]],"fx":[["upset","南郭先生"]]}],"q":"南郭先生不會吹竽，卻混在三百人的樂隊裡湊人數。比喻沒有真本事的人混在行家裡，是哪個成語？","wrong":[{"w":"對牛彈琴","by":"樂師","line":"對牛彈琴是跟不懂的人講道理。大王很懂音樂，問題是南郭先生根本不會吹！"},{"w":"餘音繞樑","by":"樂師#2","line":"餘音繞樑是音樂好聽到讓人一直回味。南郭先生一個音也沒吹出來呢！"},{"w":"魚目混珠","by":"齊湣王","line":"魚目混珠是拿魚眼睛冒充珍珠，也是以假亂真，很接近！不過故事裡混進樂隊的是人，還跟樂器有關喔。"}],"hint":"「竽」是一種像笙的吹奏樂器，「數」是人數。","after":"一個一個吹，誰會誰不會就清清楚楚了。沒有真本事，遲早會被拆穿。","lesson":{"title":"成語小學堂．濫竽充數","text":"竽是古代像笙的吹奏樂器。現在這個成語常用來批評拿差的東西冒充好的，也可以謙虛地說自己能力不夠，例如「我只是來濫竽充數的」。","next":"有人分不清真本事，也有人分不清什麼東西才珍貴……"}},{"id":"e02_04","yr":"《韓非子．外儲說左上》","place":"鄭國的市集","scene":"south","music":"map","cast":[["楚國商人",0.9,0.0],["鄭國人",-6.8,1.0]],"beats":[{"t":"這個寓言出自《韓非子》。楚國有個人到鄭國賣珍珠，為了賣得好，特地做了一個漂亮的盒子。"},{"t":"盒子用名貴的木蘭木做成，用香料薰得香香的，還鑲上珠玉和翠鳥的羽毛。","fx":[["focus","楚國商人"]]},{"who":"楚國商人","t":"盒子這麼漂亮，珍珠一定更好賣！","fx":[["cheer","楚國商人"]]},{"t":"一個鄭國人走過來，眼睛一亮。","mv":[["鄭國人",-0.5,0.5]]},{"who":"鄭國人","t":"哇！這盒子太美了！我買了！","fx":[["cheer","鄭國人"]]},{"t":"他付了錢，打開盒子，把珍珠拿了出來……","fx":[["focus","鄭國人"]]},{"who":"鄭國人","t":"盒子我帶走，裡面的珠子還給你！","fx":[["upset","楚國商人"]]}],"q":"鄭國人只看上漂亮的盒子，卻把真正值錢的珍珠還回去。比喻只看外表、取捨不當，是哪個成語？","wrong":[{"w":"掌上明珠","by":"楚國商人","line":"掌上明珠是比喻被父母疼愛的孩子。我說的是真的珍珠，而且被退回來了！"},{"w":"珠聯璧合","by":"鄭國人","line":"珠聯璧合是美好的人或東西湊在一起。可是我把盒子和珍珠拆開了耶！"},{"w":"本末倒置","by":"楚國商人","line":"本末倒置是把重要的和不重要的弄反了，意思很接近！不過故事裡有木盒和珍珠，有個專門的成語。"}],"hint":"「櫝」是木盒子，「還」是歸還。","after":"楚國商人看著退回來的珍珠，真是哭笑不得。","lesson":{"title":"成語小學堂．買櫝還珠","text":"韓非子說：這個楚國人很會賣盒子，卻不會賣珍珠。他用這個故事提醒人：說話寫文章如果只講究漂亮的文字，別人反而會忘了真正有用的內容。「櫝」讀ㄉㄨˊ。","next":"鄭國人搞錯了重點；河邊的兩隻動物，則是為了爭一口氣，誰也不讓誰……"}},{"id":"e02_05","yr":"《戰國策．燕策二》","place":"易水河邊","scene":"river","music":"map","cast":[["河蚌",0.2,-0.6],["鷸鳥",6.8,-0.8],["漁夫",-6.8,1.0]],"beats":[{"t":"這個寓言出自《戰國策》。易水河邊，一隻河蚌張開殼，正在曬太陽。"},{"t":"一隻鷸鳥飛過來，用長長的嘴去啄河蚌的肉。","mv":[["鷸鳥",1.0,-0.4]]},{"t":"河蚌立刻把殼合上，緊緊夾住鷸鳥的嘴！","fx":[["upset","鷸鳥"]]},{"who":"鷸鳥","t":"今天不下雨，明天不下雨，你就會乾死！","fx":[["say","鷸鳥"]]},{"who":"河蚌","t":"今天不放你，明天不放你，你就會餓死！","fx":[["upset","河蚌"]]},{"t":"兩個誰也不肯放，一位漁夫剛好走過來。","mv":[["漁夫",-0.6,0.4]]},{"who":"漁夫","t":"哈！一次抓到兩個，真是白撿的大便宜！","fx":[["cheer","漁夫"]]}],"q":"鷸鳥和河蚌互相夾住不放，結果被漁夫一起抓走。比喻雙方爭個不停，讓第三者得到好處，是哪個成語？","wrong":[{"w":"同舟共濟","by":"漁夫","line":"同舟共濟是大家同心協力度過難關。牠們可是死命互夾，一點也不合作！"},{"w":"如魚得水","by":"河蚌","line":"如魚得水是遇到很適合自己的環境。我現在被曬在岸上，難過死了！"},{"w":"兩敗俱傷","by":"漁夫","line":"兩敗俱傷是雙方都受到損失，有點像！不過這個故事裡還有我這個旁觀者撿到便宜，有個專門的成語。"}],"hint":"吵架的是一隻長嘴的水鳥（鷸）和一個有硬殼的貝類（蚌）。","after":"鷸鳥和河蚌，都被漁夫裝進籃子帶走了。","lesson":{"title":"成語小學堂．鷸蚌相爭","text":"這是蘇代替燕國去勸趙惠文王的故事：趙國想攻打燕國，蘇代說兩國打得精疲力盡，強大的秦國就會像漁夫一樣撿便宜。趙王聽了，就不出兵了。這個成語常和「漁翁得利」連在一起用。","next":"爭來爭去的動物有點傻，被說法騙到的動物也不少。有一群猴子……"},"winSad":"鷸鳥"},{"id":"e02_06","yr":"《莊子．齊物論》","place":"狙公的院子","scene":"cottage","music":"map","cast":[["狙公",0.5,0.0],["小猴",-1.4,-0.8],["小猴",-0.4,-1.4],["小猴",1.6,-1.2],["小猴",2.4,0.4]],"beats":[{"t":"這個寓言出自《莊子》。有個很會養猴子的老人，大家叫他「狙公」，他每天拿橡實餵猴子。"},{"t":"後來家裡的糧食不夠了，狙公想讓猴子少吃一點。","fx":[["sad","狙公"]]},{"who":"狙公","t":"從今天起，早上給你們三顆，晚上給四顆，好不好？","fx":[["say","狙公"]]},{"t":"猴子們一聽，全都氣得跳來跳去，吱吱亂叫！","fx":[["upset","小猴"],["upset","小猴#2"],["upset","小猴#3"],["upset","小猴#4"]]},{"who":"狙公","t":"好好好，那改成早上四顆、晚上三顆，總可以了吧？","fx":[["focus","狙公"]]},{"t":"猴子們一聽，高興得拍手歡呼。","fx":[["cheerAll","小猴"]]},{"t":"可是想一想：一天加起來，還是七顆呀！","fx":[["focus",null]]}],"q":"狙公只是把「早三晚四」改成「早四晚三」，猴子就從生氣變高興。原指用手段騙人，後來也比喻主意變來變去，是哪個成語？","wrong":[{"w":"猴年馬月","by":"小猴","line":"猴年馬月是不知道要等到什麼時候。我們現在就要吃，才不要等！"},{"w":"殺雞儆猴","by":"小猴#2","line":"殺雞儆猴是懲罰一個人來警告其他人。狙公爺爺沒有罰我們，只是改了顆數而已！"},{"w":"三心二意","by":"狙公","line":"三心二意是心思不專一、拿不定主意，有點接近後來的意思！不過故事裡有早上和晚上的顆數，有個專門的成語。"}],"hint":"「朝」是早上，「暮」是晚上，兩個數字就是橡實的顆數。","after":"總數一點也沒變，猴子們的心情卻完全不一樣了。","lesson":{"title":"成語小學堂．朝三暮四","text":"莊子用這個故事說：名稱和實際都沒變，猴子卻一下生氣一下高興，只是被說法影響了。現在這個成語多用來形容人主意變來變去、反覆無常，例如「做事要專心，不能朝三暮四」。","next":"猴子被說法弄糊塗，也有人因為一味模仿別人，把自己弄糊塗了……"}},{"id":"e02_07","yr":"《莊子．秋水》","place":"趙國都城邯鄲","scene":"palace","music":"map","cast":[["少年",-6.8,1.0],["邯鄲人",6.8,-0.6],["邯鄲人",7.6,0.4]],"beats":[{"t":"這個寓言出自《莊子》。燕國壽陵有個少年，聽說趙國都城的人走路的樣子最好看。"},{"who":"少年","t":"我也要學會那樣走路！","mv":[["少年",-1.2,0.6]],"fx":[["cheer","少年"]]},{"t":"他千里迢迢來到趙國都城，看見路上的人走起路來又輕快又優雅。","mv":[["邯鄲人",0.6,-0.8],["邯鄲人#2",1.8,0.2]]},{"t":"他跟在人家後面，一步一步模仿。","mv":[["少年",-0.2,0.0],["邯鄲人",2.4,-1.2],["邯鄲人#2",3.4,-0.2]]},{"who":"少年","t":"左腳……右腳……咦，手要怎麼擺？","fx":[["upset","少年"]]},{"t":"學了好久，新的走法沒學會，連自己原來怎麼走路都忘了！","fx":[["sad","少年"]]},{"t":"最後，他只好一路爬著回燕國去。","mv":[["少年",-8.0,1.2]]}],"q":"燕國少年到趙國都城學走路，沒學會別人的，反而忘了自己原本的走法。比喻一味模仿別人，反而失去自己的本領，是哪個成語？","wrong":[{"w":"健步如飛","by":"邯鄲人","line":"健步如飛是走路又快又有力。他最後可是爬回家的耶！"},{"w":"步步高升","by":"邯鄲人#2","line":"步步高升是職位越升越高。他是越學越糟，最後連路都不會走了！"},{"w":"生搬硬套","by":"邯鄲人","line":"生搬硬套是不管情況，硬照別人的方法做，有點接近！不過故事裡學的是走路，地點在趙國的都城，有個專門的成語。"}],"hint":"想想故事發生的城市叫什麼名字，還有他想學的是什麼。","after":"少年不但沒學到新本事，連原本會的也丟了。","lesson":{"title":"成語小學堂．邯鄲學步","text":"這是戰國時魏牟對公孫龍說的話，笑他想學莊子的大道理卻學不會，反而連自己原本的學問也丟了。「鄲」讀ㄉㄢ。現在常用來提醒我們：向別人學習要先想清楚，不能只會照抄。","next":"《莊子．秋水》裡還有另一個有名的比喻，主角是一隻住在井裡的青蛙……"}},{"id":"e02_08","yr":"《莊子．秋水》","place":"一口淺井邊","scene":"south","music":"map","cast":[["青蛙",0.2,-0.6],["海龜",6.8,0.8]],"beats":[{"t":"這個比喻出自《莊子》。有一隻青蛙住在一口淺淺的井裡，覺得這裡是天下最棒的地方。"},{"who":"青蛙","t":"我可以在井邊跳，在井水裡游，天空就像井口這麼大！","fx":[["cheer","青蛙"]]},{"t":"有一天，一隻從東海來的大海龜經過井邊。","mv":[["海龜",1.6,0.2]]},{"who":"青蛙","t":"海龜大哥，快下來我家玩吧！","fx":[["say","青蛙"]]},{"t":"海龜想下去看看，可是左腳還沒伸進去，右腳就卡住了。","fx":[["upset","海龜"]]},{"who":"海龜","t":"大海一望無際，用千里也量不完它有多大，用千丈也量不完它有多深。","fx":[["focus","海龜"]]},{"t":"青蛙聽了，嚇得目瞪口呆，第一次知道外面的世界這麼大。","fx":[["upset","青蛙"]]}],"q":"青蛙一直住在井裡，以為天空只有井口那麼大。比喻見識狹小、眼光短淺的人，是哪個成語？","wrong":[{"w":"海闊天空","by":"海龜","line":"海闊天空是像大海、天空一樣寬廣自在，那是我住的地方，不是青蛙的井！"},{"w":"井井有條","by":"青蛙","line":"井井有條是做事整齊有條理。我的井是很整齊啦，可是這個成語跟住在井裡沒關係！"},{"w":"坐井觀天","by":"海龜","line":"坐井觀天是坐在井裡看天，也是說眼光狹小，意思幾乎一樣！不過題目問的是「哪一種人」，答案就是這隻青蛙。"}],"hint":"住在井的最下面的，是什麼動物呢？","after":"海龜轉身回大海去了，青蛙還呆呆地望著小小的井口。","lesson":{"title":"成語小學堂．井底之蛙","text":"《莊子．秋水》裡，北海神說：「井裡的青蛙，沒辦法跟牠談大海，因為牠被住的地方限制了。」青蛙和海龜的故事也記在同一篇裡。現在常用來提醒我們多讀書、多看看外面的世界。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第二島．糊塗人的大道理","eps":[2]},{"key":"i03","name":"看清真相","short":"真相島","era":"《列子》《莊子》等古代寓言","color":"#4A7BD9","map":{"ground":"#a8c47a","river":"#4f8fd8"},"intro":{"lines":["這座島上的故事，都和「看清楚」有關。","有人把影子當成蛇，有人只摸到大象的一部分，有人聽了三次謠言就信以為真。","這些故事來自《莊子》《列子》《戰國策》、東漢的《風俗通義》，還有佛經。","跟著故事想一想：眼睛看到的、耳朵聽到的，一定是真的嗎？"],"people":[["列子","戰國時代的人，相傳寫了《列子》"],["愚公","快九十歲，還想搬走大山的老人"],["龐葱","魏國大臣，用老虎提醒魏王"]]},"stops":[{"id":"e03_01","yr":"《風俗通義》","place":"縣令應郴的官府","scene":"office","music":"palace","cast":[["應郴",1.2,-0.4],["杜宣",-0.6,0.4]],"beats":[{"t":"這個故事出自東漢應劭的《風俗通義》。應劭的祖父應郴當縣令時，請部下杜宣來喝酒。"},{"t":"大廳北邊的牆上，掛著一把漆成紅色的弩弓。"},{"who":"應郴","t":"來，乾一杯！","fx":[["say","應郴"]]},{"t":"杜宣一低頭，看見杯子裡好像有一條紅色的小蛇在扭動！","fx":[["upset","杜宣"],["focus","杜宣"]]},{"t":"可是長官請的酒不敢不喝，他硬著頭皮喝下去。回家後，胸口和肚子痛得吃不下飯。","mv":[["杜宣",-7.5,1.2]]},{"t":"應郴聽說杜宣病了，請他回到原來的位子，再倒一杯酒。","mv":[["杜宣",-0.6,0.4]]},{"who":"應郴","t":"你看，杯子裡的「蛇」，只是牆上弩弓的影子而已！","fx":[["focus","應郴"]]}],"q":"杜宣把酒杯裡弓的倒影當成蛇，嚇得生了病。比喻疑神疑鬼、自己嚇自己，是哪個成語？","wrong":[{"w":"打草驚蛇","by":"應郴","line":"打草驚蛇是做事不小心，讓對方有了防備。杯子裡根本沒有蛇，哪來的驚動？"},{"w":"虎頭蛇尾","by":"杜宣","line":"虎頭蛇尾是開始很用心，後來草草結束。我這場病，是被一條假蛇嚇出來的！"},{"w":"草木皆兵","by":"應郴","line":"草木皆兵是把草和樹都看成敵兵，也是疑神疑鬼，很接近！不過那是打仗時的驚慌，這個故事裡有酒杯、弓和蛇的影子。"}],"hint":"杯子裡映出的是牆上的「弓」，看起來像什麼動物？","after":"杜宣這才明白，心裡的疙瘩解開了，病也馬上好了。","lesson":{"title":"成語小學堂．杯弓蛇影","text":"原文說杜宣心結一解開，就高高興興，病也好了。後來《晉書》也記了樂廣請客人喝酒、杯中出現蛇影的類似故事。現在常用來形容疑神疑鬼、自己嚇自己。","next":"杜宣被假的蛇嚇壞了；有一位葉公，卻是被真的龍嚇跑了……"}},{"id":"e03_02","yr":"《莊子》逸文","place":"葉公的家","scene":"house","music":"palace","cast":[["葉公",0.4,0.2],["真龍",6.8,-1.5,0,1,1]],"beats":[{"t":"這個故事相傳出自《莊子》。葉公說他最喜歡龍，家裡的牆上、柱子上、門窗上，到處都畫滿、刻滿了龍。"},{"who":"葉公","t":"我最愛龍了！龍真是天下最帥的動物！","fx":[["cheer","葉公"]]},{"t":"天上的真龍聽說了，非常感動，決定下凡拜訪他。"},{"t":"真龍從窗戶探進頭來，長長的尾巴一直拖到大廳裡。","mv":[["真龍",1.8,-1.4]],"fx":[["focus","真龍"]]},{"who":"真龍","t":"葉公，你這麼喜歡我，我特地來看你啦！","fx":[["say","真龍"]]},{"t":"葉公一看，嚇得臉色發白，魂都飛了。","fx":[["upset","葉公"]]},{"who":"葉公","t":"救、救命啊！","mv":[["葉公",-8.0,1.4]]}],"q":"葉公說自己最喜歡龍，真龍來了卻嚇得逃走。比喻表面上說喜歡，其實並不是真的喜歡，是哪個成語？","wrong":[{"w":"龍飛鳳舞","by":"真龍","line":"龍飛鳳舞是形容書法的筆勢活潑。我是真的飛來了，葉公卻跑走了！"},{"w":"望子成龍","by":"真龍","line":"望子成龍是希望孩子將來有出息。他家只有畫的龍，沒有孩子變成龍啦！"},{"w":"口是心非","by":"真龍","line":"口是心非是嘴上說的和心裡想的不一樣，意思很接近！不過這個故事有一條把主人嚇跑的龍，有個專門的成語。"}],"hint":"「葉」在這裡讀ㄕㄜˋ；「好」讀ㄏㄠˋ，是喜愛的意思。","after":"原來，葉公喜歡的只是像龍的圖畫和雕刻，並不是真的龍。","lesson":{"title":"成語小學堂．葉公好龍","text":"這個故事最有名的版本記在西漢劉向的《新序》裡：孔子的學生子張用它諷刺魯哀公，說他嘴上喜歡人才，人才真的來了卻不重用。「葉」讀ㄕㄜˋ，是地名。","next":"葉公只喜歡假的龍；北山的愚公，卻是真的要把山搬走……"},"winSad":"真龍"},{"id":"e03_03","yr":"《列子．湯問》","place":"太行山和王屋山前","scene":"mountain","music":"map","cast":[["愚公",0.4,0.2],["家人",1.6,-0.6],["家人",2.4,0.6],["鄰家小童",6.8,-0.4],["智叟",-6.8,1.0]],"beats":[{"t":"這個故事出自《列子》。北山有位愚公，快九十歲了，家門前有太行、王屋兩座大山擋住去路。"},{"who":"愚公","t":"出門都要繞好遠的路，我們一起把山挖平吧！","fx":[["say","愚公"]]},{"t":"他帶著兒孫敲石頭、挖泥土，用竹筐把土石運到渤海邊。鄰居家才七八歲的小孩，也蹦蹦跳跳來幫忙。","mv":[["鄰家小童",3.0,-0.4]],"fx":[["cheerAll","家人"]]},{"t":"河曲有個老人叫智叟，他笑著走過來。","mv":[["智叟",-1.0,0.6]]},{"who":"智叟","t":"你這麼老了，連山上的一根草都拔不完，怎麼搬得動大山？","fx":[["say","智叟"]]},{"who":"愚公","t":"我死了，還有兒子；兒子又生孫子，子子孫孫沒有盡頭，山卻不會長高，怎麼會挖不平？","fx":[["focus","愚公"]]},{"t":"智叟聽了，一句話也答不出來。","fx":[["sad","智叟"]]}],"q":"愚公不怕山高路遠，決心一代接一代把大山挖平。比喻做事有恆心、不怕困難，是哪個成語？","wrong":[{"w":"開門見山","by":"智叟","line":"開門見山是說話直接講重點。愚公家是開門就看到山沒錯，可是他是要把山搬走！"},{"w":"山窮水盡","by":"鄰家小童","line":"山窮水盡是走投無路。愚公爺爺一點也不絕望，還越挖越起勁！"},{"w":"鍥而不捨","by":"愚公","line":"鍥而不捨是不停地刻、不放棄，也在說有恆心，很接近！不過我們這個故事是搬山，有個專門的成語。"}],"hint":"主角是「愚公」，他想對門前的大山做什麼呢？","after":"天帝被愚公的決心感動，派大力神夸娥氏的兩個兒子，把兩座山背走了。這是古代的神話傳說。","lesson":{"title":"成語小學堂．愚公移山","text":"從此，冀州南邊到漢水南岸，再也沒有高山擋路。故事裡的「愚公」其實不笨，「智叟」反而看不清楚。現在常用這個成語鼓勵人：只要有恆心，再大的困難也能克服。","next":"愚公知道自己要什麼；有個叫東施的姑娘，卻只會跟著別人學……"},"winSad":"智叟"},{"id":"e03_04","yr":"《莊子．天運》","place":"西施住的村子","scene":"south","music":"map","cast":[["西施",6.8,0.2],["東施",-6.8,1.0],["村民",-1.4,-1.0],["村民",2.6,0.8]],"beats":[{"t":"這個故事出自《莊子》。美女西施有心口痛的毛病，常常按著胸口、皺著眉頭走過村子。","mv":[["西施",0.8,-0.2]],"fx":[["sad","西施"]]},{"who":"村民","t":"西施連皺眉頭都好美啊！","fx":[["cheer","村民"]]},{"t":"村裡有個長得不好看的姑娘，後人叫她東施。她看見了，心想：原來這樣就會變美！","mv":[["東施",-1.0,0.6]]},{"who":"東施","t":"皺眉頭、按胸口，我也會！","fx":[["focus","東施"]]},{"t":"她學西施皺起眉頭、捧著胸口，在村子裡走來走去。","mv":[["東施",0.4,-0.4],["西施",8.0,0.2]]},{"who":"東施","t":"大家看，我美不美？","fx":[["cheer","東施"]]},{"t":"村裡的有錢人看見了，趕緊關上大門；窮人看見了，帶著妻兒逃得遠遠的。","mv":[["村民",-8.0,-1.0],["村民#2",8.0,0.8]]}],"q":"東施不懂西施美在哪裡，只會照著皺眉，結果更難看。比喻不懂別人好在哪裡就盲目模仿，反而更糟，是哪個成語？","wrong":[{"w":"閉月羞花","by":"村民","line":"閉月羞花是形容女子非常美麗。這是在誇西施，不是在說東施學她！"},{"w":"愁眉苦臉","by":"村民#2","line":"愁眉苦臉是又擔心又苦惱的樣子。東施皺眉是為了學美，不是真的在發愁！"},{"w":"邯鄲學步","by":"西施","line":"邯鄲學步也是學別人，重點是學不會，還把自己原本的本事丟了。東施是不懂我為什麼皺眉，硬學反而更難看！"}],"hint":"「效」是模仿，「顰」是皺眉頭，再想想主角的名字。","after":"東施只看到西施皺眉，卻不知道西施是因為本來就美，皺眉才好看。","lesson":{"title":"成語小學堂．東施效顰","text":"莊子原文只說是村裡的「醜人」，「東施」這個名字是後人取的。莊子用這個故事說：只知道模仿外表，不懂背後的道理，結果只會更糟。「顰」讀ㄆㄧㄣˊ。","next":"東施只看到了一部分；有一群看不見的人，也只摸到了大象的一部分……"}},{"id":"e03_05","yr":"《大般涅槃經》","place":"國王的宮殿","scene":"palace","music":"palace","cast":[["國王",2.2,-1.4],["大臣",3.2,-0.4],["大象",7.0,-1.6,0,1,1],["盲人",-1.6,-0.6],["盲人",-0.6,0.6],["盲人",1.0,0.8],["盲人",1.8,-0.2]],"beats":[{"t":"這個故事出自佛經《大般涅槃經》。有位國王叫大臣牽來一頭大象，再請幾位看不見的人來摸一摸。","mv":[["大象",0.0,-1.2]]},{"who":"國王","t":"你們摸過了，說說看，大象長什麼樣子？","fx":[["say","國王"]]},{"who":"盲人","t":"我摸到象牙，大象像一根大蘿蔔！","fx":[["say","盲人"]]},{"who":"盲人#2","t":"不對！我摸到耳朵，大象像一個簸箕！","fx":[["upset","盲人#2"]]},{"who":"盲人#3","t":"我摸到腳，大象明明像一根粗柱子！","fx":[["upset","盲人#3"]]},{"who":"盲人#4","t":"胡說！我摸到尾巴，大象就像一條繩子！","fx":[["upset","盲人#4"]]},{"t":"大家都說自己才對，吵個不停。","fx":[["focus","國王"]]}],"q":"每個人只摸到大象的一部分，就以為知道大象全部的樣子。比喻只看到一部分就以為了解全部，是哪個成語？","wrong":[{"w":"包羅萬象","by":"國王","line":"包羅萬象是內容豐富、什麼都有。可是他們每個人只摸到一小部分！"},{"w":"一手遮天","by":"大臣","line":"一手遮天是仗著權勢欺上瞞下。他們只是用手摸大象，沒有要騙人！"},{"w":"以偏概全","by":"國王","line":"以偏概全是用一部分去推論全部，意思非常接近！不過這個故事有大象和摸牠的人，有個專門的成語。"}],"hint":"看不見的人用手去「摸」，摸的是一頭大……","after":"其實每個人都只說對了一小部分，把所有部分合起來，才是一頭完整的大象。","lesson":{"title":"成語小學堂．盲人摸象","text":"這是佛經裡的比喻，用來說明人很容易只看到一部分，就以為自己懂了全部。原文裡還有人說大象像石頭、像床、像甕。現在常用來提醒我們：看事情要全面，別急著下結論。","next":"只摸到一部分會誤會；聽到的話多了，也可能被騙。魏國大臣龐葱，就問了國王一個問題……"}},{"id":"e03_06","yr":"《戰國策．魏策二》","place":"魏國王宮","scene":"palace","music":"palace","cast":[["魏王",1.2,-0.4],["龐葱",-6.8,1.0],["市民",6.8,0.8,0,1,1],["市民",7.2,-1.4,0,1,1],["市民",-7.2,-1.2,0,1,1]],"beats":[{"t":"這個故事出自《戰國策》。魏國大臣龐葱要陪太子到趙國當人質，臨走前，他去見魏王。","mv":[["龐葱",-0.8,0.6]]},{"who":"龐葱","t":"如果有一個人說市場裡有老虎，大王相信嗎？","mv":[["市民",2.8,0.8]],"fx":[["say","龐葱"]]},{"who":"魏王","t":"不信。市場裡怎麼可能有老虎？","fx":[["say","魏王"]]},{"who":"龐葱","t":"如果有兩個人都這麼說呢？","mv":[["市民#2",3.0,-1.2]]},{"who":"魏王","t":"嗯……那我就有點懷疑了。","fx":[["focus","魏王"]]},{"who":"龐葱","t":"如果三個人都這麼說呢？","mv":[["市民#3",-1.8,-1.2]]},{"who":"魏王","t":"那我就相信了。","fx":[["upset","魏王"]]}],"q":"市場明明沒有老虎，但說的人一多，魏王就信了。比喻謠言說的人多了，假的也會被當真，是哪個成語？","wrong":[{"w":"如虎添翼","by":"龐葱","line":"如虎添翼是強的人得到幫助，變得更強。市場裡根本沒有老虎，哪來的翅膀？"},{"w":"狐假虎威","by":"魏王","line":"狐假虎威是仗著別人的勢力欺負人。這裡沒有狐狸，只有越傳越真的謠言！"},{"w":"眾口鑠金","by":"龐葱","line":"眾口鑠金是大家說的話能把金子熔化，也在說謠言可怕，很接近！不過我說的是市場和老虎，有個專門的成語。"}],"hint":"說的人有「三」個，說的是市場裡有一隻……","after":"龐葱說：「市場沒有老虎是很清楚的，可是三個人一說，就好像真有老虎。我走了以後，說我壞話的人一定不只三個，請大王明察。」","lesson":{"title":"成語小學堂．三人成虎","text":"魏王答應龐葱：「我自己會判斷。」可是龐葱一走，說他壞話的人果然很多。等到太子回國，龐葱再也見不到魏王了。這個故事提醒我們：聽到傳言要先查證，不要人云亦云。","next":"謠言多了讓人迷糊，路太多也會讓人迷路。楊子的鄰居，丟了一隻羊……"}},{"id":"e03_08","yr":"《列子．說符》","place":"楊子家門前的岔路口","scene":"road","music":"map","cast":[["楊子",1.2,-0.2],["鄰居",-6.8,1.0],["幫手",-7.2,-0.4],["幫手",-7.6,0.4],["書童",2.4,0.6]],"beats":[{"t":"這個故事出自《列子》。楊子的鄰居丟了一隻羊，帶著一群人去追，還來借楊子家的書童幫忙。","mv":[["鄰居",-0.8,0.6],["幫手",-1.6,-0.6],["幫手#2",-0.2,-1.0]]},{"who":"楊子","t":"唉呀！丟了一隻羊，為什麼要這麼多人去追？","fx":[["upset","楊子"]]},{"who":"鄰居","t":"因為岔路太多了！","mv":[["鄰居",8.0,1.0],["幫手",8.0,-0.6],["幫手#2",8.4,0.2],["書童",8.6,0.8]]},{"t":"過了好久，大家累得垂頭喪氣地回來了。","mv":[["鄰居",-0.2,0.6],["幫手",2.4,-1.0],["幫手#2",3.0,0.2],["書童",2.4,1.2]],"fx":[["sadAll","幫手"]]},{"who":"楊子","t":"羊找到了嗎？","fx":[["say","楊子"]]},{"who":"鄰居","t":"沒找到。岔路裡面又有岔路，不知道羊往哪裡跑，只好回來了。","fx":[["sad","鄰居"]]},{"t":"楊子聽了，臉色一變，好久不說話，一整天都沒有笑容。","fx":[["sad","楊子"],["focus","楊子"]]}],"q":"岔路裡又有岔路，大家不知道羊往哪裡跑，最後找不回來。比喻事情太複雜、方向太多，容易迷失，是哪個成語？","wrong":[{"w":"亡羊補牢","by":"鄰居","line":"亡羊補牢是丟了羊趕快修羊圈，趕快補救。我現在連羊在哪裡都不知道啦！"},{"w":"四通八達","by":"書童","line":"四通八達是道路通往各個方向，很方便。可是對找羊的人來說，路太多反而麻煩！"},{"w":"誤入歧途","by":"楊子","line":"誤入歧途是不小心走上錯誤的路，有點接近！不過這個故事說的是岔路太多、羊找不到，有個專門的成語。"}],"hint":"「歧」是岔路，「亡」是丟失。","after":"楊子的學生很奇怪：羊又不值錢，也不是老師的，老師為什麼這麼難過？","lesson":{"title":"成語小學堂．歧路亡羊","text":"後來學生心都子明白了：大路因為岔路太多而丟了羊，讀書的人如果方向太多、抓不住根本，也會迷失。現在常用這個成語提醒人：做事、學習要抓住重點，才不會迷路。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"island","title":"第三島．看清真相","eps":[3]},{"key":"i04","line":"island","name":"動物教我的道理","short":"動物森林","era":"古代寓言","color":"#5E9E4F","map":{"ground":"#9cc46e","river":"#4f9fd8"},"intro":{"lines":["歡迎來到成語寓言島的「動物森林」！","古時候的人很會講故事，常常借老虎、狐狸、驢子、螳螂這些動物，說出做人做事的道理。","這些故事有的寫在《戰國策》《莊子》，有的是唐朝文學家柳宗元寫的寓言。","動物不會說話，可是牠們的故事，一說就說了兩千多年。一起去聽聽牠們想教我們什麼吧！"],"people":[["狐狸","眼珠一轉，就想出騙老虎的妙招"],["更羸","古代神射手，不用箭也能射下大雁"],["莊子","戰國時代的思想家，很會講寓言"],["柳宗元","唐朝文學家，寫了〈黔之驢〉"]]},"stops":[{"id":"e04_01","yr":"《戰國策》《尹文子》","place":"深山森林","scene":"south","music":"map","cast":[["老虎",1.6,0.2,0,1],["狐狸",6.8,1.0,0,1],["野鹿",-1.6,-1.6,0,1],["山羊",-0.4,-2.0,0,1],["野兔",0.9,-2.2,0,1]],"beats":[{"t":"森林裡，老虎肚子餓了，到處找動物來吃。牠一撲，抓住了一隻狐狸。","mv":[["狐狸",2.6,0.8]],"fx":[["upset","老虎"]]},{"who":"老虎","t":"哈哈！今天的午餐就是你！"},{"t":"狐狸嚇了一跳，可是眼珠一轉，馬上抬起頭，裝出很神氣的樣子。","fx":[["focus","狐狸"]]},{"who":"狐狸","t":"你不敢吃我！天帝派我當百獸的首領，吃了我，就是違抗天帝的命令！","fx":[["say","狐狸"]]},{"who":"狐狸","t":"不相信？我走前面，你跟在後面，看看大家見了我敢不敢逃！"},{"t":"老虎跟在狐狸後面走。森林裡的動物一看到，全都嚇得拔腿就跑。","mv":[["狐狸",0.2,0.4],["老虎",1.6,0.6],["野鹿",-7.5,-1.6],["山羊",-7.5,-2.4],["野兔",7.5,-2.4]],"fx":[["focus",null]]},{"who":"老虎","t":"原來大家都這麼怕狐狸……","fx":[["sad","老虎"]]}],"q":"其實動物們怕的是老虎，不是狐狸。狐狸借老虎的威風嚇唬大家。現在如果有人仗著哥哥是班長，就在班上欺負同學，可以用哪個成語形容？","wrong":[{"w":"守株待兔","by":"狐狸","line":"守株待兔是坐著等好運掉下來。我可是靠嘴巴騙老虎，一點也沒閒著！"},{"w":"如虎添翼","by":"老虎","line":"如虎添翼是老虎長了翅膀，變得更強。我可沒變強，是被狐狸借去當靠山了！"},{"w":"狗仗人勢","by":"狐狸","line":"狗仗人勢也是靠別人的勢力欺負人，意思很接近！不過這個故事的主角是我和老虎，有專門的成語。"}],"hint":"狐狸「借」了老虎的威風。古文裡「借」可以寫成「假」。","after":"老虎一直沒發現，動物們怕的其實是牠自己，狐狸就這樣逃過一劫。","lesson":{"title":"成語小學堂．狐假虎威","text":"「假」是借用的意思，不是真假的假。這個故事也記在《戰國策》，是楚國大臣江乙說給楚宣王聽的，用來提醒國君：大家怕的是國君的軍隊，不是靠國君撐腰的大臣。現在用來批評仗勢欺人。","next":"狐狸靠嘴巴騙過老虎。可是在南方的黔地，有一隻老虎卻被一頭從沒見過的大怪物嚇到了……"}},{"id":"e04_02","yr":"唐．柳宗元〈黔之驢〉","place":"黔地的山腳下","scene":"mountain","music":"map","cast":[["好事的人",-6.8,1.0],["大驢",-6.8,0.2,0,1],["老虎",2.4,-1.8,0,1]],"beats":[{"t":"黔地（今天的貴州一帶）本來沒有驢。有個愛管閒事的人，用船載了一頭驢來。","mv":[["好事的人",-1.2,0.8],["大驢",-0.4,0.0]]},{"who":"好事的人","t":"唉，載來了才發現沒什麼用，就放在山下吧！","mv":[["好事的人",-7.5,1.0]]},{"t":"老虎看見這個龐然大物，以為是神，躲在樹林裡偷偷看。","fx":[["focus","老虎"]]},{"t":"有一天，驢子大叫一聲，老虎嚇得拔腿就跑，以為牠要吃自己。","mv":[["老虎",5.5,-2.2]],"fx":[["say","大驢"],["upset","老虎"]]},{"t":"過了幾天，老虎慢慢靠近，碰碰牠、撞撞牠。驢子氣得用後腳踢了一下。","mv":[["老虎",1.2,-0.2]],"fx":[["upset","大驢"],["focus",null]]},{"who":"老虎","t":"哈哈！你的本事，就只有這樣而已嗎？","fx":[["cheer","老虎"]]}],"q":"老虎看穿驢子除了叫和踢，就沒有別的本領了，撲了上去，驢子再也逃不掉。後來大家把「一點本事都用完了，再也沒辦法」叫做什麼？","wrong":[{"w":"龍馬精神","by":"老虎","line":"龍馬精神是形容精神很好、很有活力。這頭驢只有叫跟踢兩招，早就沒招了！"},{"w":"老驥伏櫪","by":"大驢","line":"老驥伏櫪是說老了還有遠大的志向。我可是本事全用完了啊……"},{"w":"江郎才盡","by":"老虎","line":"江郎才盡是說文人的才華用光了，意思接近！不過這個故事的主角是貴州來的驢，有自己的成語。"}],"hint":"「黔」是地名，「技」是本事，「窮」是用完了。","after":"驢子看起來高大，叫聲也很嚇人，可是真正的本事只有一點點，被看穿就沒辦法了。","lesson":{"title":"成語小學堂．黔驢技窮","text":"「黔」讀ㄑㄧㄢˊ。這篇寓言是唐朝柳宗元寫的〈三戒〉之一，提醒人：只靠外表唬人，沒有真本事，總有一天會被看穿。現在常用來諷刺辦法都用光了。","next":"老虎被驢子的叫聲嚇了一跳。有一隻大雁，竟然被「弓弦的聲音」嚇得從天上掉下來……"}},{"id":"e04_03","yr":"《戰國策．楚策》","place":"魏國的高臺下","scene":"palace","music":"palace","cast":[["魏王",1.4,0.4],["更羸",-0.6,0.8],["侍衛",2.8,1.4],["大雁",7.5,-1.5,3.2,1,1]],"beats":[{"t":"神射手更羸陪著魏王，在高臺下抬頭看天上的飛鳥。"},{"who":"更羸","t":"大王，我只要拉一下弓，不用放箭，就能讓鳥掉下來。","fx":[["say","更羸"]]},{"who":"魏王","t":"射箭的本事，能厲害到這種地步嗎？","fx":[["upset","魏王"]]},{"t":"過了一會兒，一隻大雁從東方慢慢飛來，叫聲聽起來很悲傷。","mv":[["大雁",0.6,-0.8,3.0]],"fx":[["focus","大雁"]]},{"t":"更羸拉滿了弓，沒有放箭。「砰」的一聲弓弦響，大雁竟然從天上掉了下來！","mv":[["大雁",0.8,-0.2,0]],"fx":[["say","更羸"],["focus",null]]},{"who":"魏王","t":"真的掉下來了！你是怎麼知道的？","fx":[["cheer","魏王"]]},{"who":"更羸","t":"牠飛得慢，是因為舊傷還在痛；叫聲悲傷，是因為離開雁群很久了。","fx":[["focus","更羸"]]}],"q":"更羸說：「牠舊傷沒好，心裡還很害怕，一聽到弓弦聲就拚命往高處飛，結果傷口裂開掉了下來。」後來形容「受過驚嚇，一點動靜就很害怕」的人，叫做什麼？","wrong":[{"w":"一箭雙鵰","by":"魏王","line":"一箭雙鵰是一支箭射中兩隻鳥。更羸可是連一支箭都沒射出去呢！"},{"w":"鴻鵠之志","by":"更羸","line":"鴻鵠之志是遠大的志向。這隻大雁心裡只有害怕，哪有什麼大志向。"},{"w":"杯弓蛇影","by":"更羸","line":"杯弓蛇影是把影子看成蛇，自己嚇自己，意思接近！不過這隻大雁是真的受過箭傷，聽到弓聲才嚇壞的。"}],"hint":"被弓「驚」嚇到的，是哪一種動物？","after":"魏王這才明白，大雁不是被射下來的，是被自己的害怕嚇下來的。","lesson":{"title":"成語小學堂．驚弓之鳥","text":"「更羸」讀ㄍㄥ　ㄌㄟˊ。這個故事記在《戰國策》，原本是用來比喻：吃過大敗仗的將軍，心裡的恐懼還沒消失，不適合再帶兵。現在常說「他被狗追過，聽到狗叫就像驚弓之鳥」。","next":"大雁聽得懂弓弦的聲音。可是有一頭牛，不管多好聽的琴聲，牠都聽不進去……"}},{"id":"e04_05","yr":"漢．牟融〈理惑論〉","place":"鄉下的草地","scene":"south","music":"map","cast":[["公明儀",-0.8,0.6],["老牛",1.6,-0.4,0,1],["牧童",6.8,1.2]],"beats":[{"t":"古時候有一位音樂家叫公明儀，琴彈得非常好。有一天，他看見一頭牛在草地上吃草。"},{"who":"公明儀","t":"這麼好的天氣，就彈一首高雅的〈清角〉給你聽吧！","fx":[["say","公明儀"]]},{"t":"琴聲非常優美，可是老牛還是低著頭，嚼嚼嚼，好像什麼都沒聽見。","fx":[["focus","老牛"]]},{"who":"牧童","t":"先生，您彈得真好聽，可是牠連頭都不抬耶！","mv":[["牧童",2.8,1.2]]},{"t":"公明儀想了想，改彈出蚊子嗡嗡飛、小牛哞哞叫的聲音。","fx":[["say","公明儀"],["focus",null]]},{"t":"老牛馬上搖搖尾巴、豎起耳朵，踩著小步走過來仔細聽。","mv":[["老牛",0.6,0.2]],"fx":[["cheer","老牛"]]},{"who":"公明儀","t":"原來不是牛聽不到，是牠聽不懂高雅的曲子啊！"}],"q":"小華很興奮地向三歲的弟弟解釋分數的加法，講了半小時，弟弟只想玩積木。這種情形可以用哪個成語形容？","wrong":[{"w":"畫蛇添足","by":"牧童","line":"畫蛇添足是做多餘的事反而壞事。這裡是說話的對象根本聽不懂啦！"},{"w":"餘音繞梁","by":"公明儀","line":"餘音繞梁是稱讚音樂好聽，聽完還忘不了。可惜我的牛完全沒感覺……"},{"w":"雞同鴨講","by":"牧童","line":"雞同鴨講是兩個人說話互相聽不懂，意思接近！不過故事裡是先生一個人彈給牛聽，牛聽不懂。"}],"hint":"公明儀「對」著誰「彈」琴？","after":"公明儀明白了：說話、表演都要看對象，用對方聽得懂的方式。","lesson":{"title":"成語小學堂．對牛彈琴","text":"這個成語有兩種用法：一是笑對方聽不懂，白費力氣；二是提醒說話的人，自己沒有看對象。所以下次別人聽不懂時，也可以想想：是不是我該換個說法呢？","next":"老牛只顧著吃草。森林裡還有一群動物，也只顧著眼前的東西，卻沒發現背後的危險……"}},{"id":"e04_06","yr":"《莊子．山木》","place":"雕陵的栗樹林","scene":"south","music":"map","cast":[["莊子",-6.8,1.0],["蟬",0.4,-1.4,1.6,1],["螳螂",1.0,-1.0,0.9,1],["怪鵲",6.8,-2.0,2.2,1],["守林人",7.2,1.2]],"beats":[{"t":"這段故事出自《莊子》。莊子到雕陵的栗樹林裡散步，看到一隻翅膀好大的怪鵲飛過來。","mv":[["莊子",-1.0,0.8],["怪鵲",2.6,-1.6,1.8]]},{"who":"莊子","t":"好奇怪的鳥！我拿彈弓等著，看牠要做什麼。","fx":[["say","莊子"]]},{"t":"原來，樹蔭下有一隻蟬，正舒舒服服地乘涼，什麼都沒注意。","fx":[["focus","蟬"]]},{"t":"蟬的旁邊，一隻螳螂躲在葉子後面，舉起前腳，準備抓蟬。","fx":[["focus","螳螂"]]},{"t":"螳螂只想著抓蟬，卻不知道那隻怪鵲正盯著牠，想把牠吃掉！","fx":[["focus","怪鵲"]]},{"who":"莊子","t":"唉呀！大家都只顧著眼前的好處，忘了自己的危險！","fx":[["upset","莊子"],["focus",null]]},{"t":"莊子丟下彈弓趕緊走開。看守栗樹林的人卻以為他是小偷，追著罵他。","mv":[["莊子",-7.5,1.0],["守林人",-2.0,1.2]],"fx":[["upset","守林人"]]}],"q":"小明趁媽媽不在，偷偷打開冰箱吃冰淇淋，吃得好開心，卻沒發現媽媽早就站在他背後。這種「只顧眼前利益，沒注意背後危險」的情形，可以用哪個成語形容？","wrong":[{"w":"一舉兩得","by":"守林人","line":"一舉兩得是做一件事得到兩種好處。小明吃冰淇淋，接下來可是要被罵了！"},{"w":"百步穿楊","by":"莊子","line":"百步穿楊是說射箭很準。我拿著彈弓，後來可是一下也沒射喔。"},{"w":"利令智昏","by":"莊子","line":"利令智昏是貪心讓人變糊塗，意思接近！不過故事裡那隻小蟲，一心抓蟬卻沒發現背後有鳥，有專門的成語。"}],"hint":"故事裡，誰正在抓誰？","after":"莊子回家後悶悶不樂。他想到：自己只顧著看鳥，也忘了自己闖進別人的栗樹林。","lesson":{"title":"成語小學堂．螳螂捕蟬","text":"後來漢朝的《說苑》把這個故事改成「螳螂捕蟬，黃雀在後」，這句話更常被人引用。它提醒我們：做事不能只看眼前的好處，也要注意背後的危險。","next":"螳螂捕蟬時很專心。可是還有一隻螳螂，竟然舉起前腳，想擋住一輛大車……"}},{"id":"e04_07","yr":"《莊子．人間世》","place":"齊國的大路上","scene":"road","music":"map","cast":[["齊莊公",-6.8,0.2],["車夫",-6.8,1.2],["螳螂",1.6,0.6,0,1],["侍衛",-7.5,-0.8]],"beats":[{"t":"春秋時代，齊莊公坐著馬車出去打獵，車輪轟隆隆地向前跑。","mv":[["齊莊公",-1.0,0.0],["車夫",-0.2,1.0],["侍衛",-1.8,-1.0]],"fx":[["prop","cart",-0.6,0.4,0]]},{"t":"忽然，路中間有一隻小蟲，舉起兩隻前腳，好像要和車輪打架。","fx":[["focus","螳螂"],["upset","螳螂"]]},{"who":"齊莊公","t":"咦？那是什麼蟲？竟然敢擋我的車！","fx":[["upset","齊莊公"],["focus",null]]},{"who":"車夫","t":"那是螳螂。牠只知道前進，不知道後退，也不管自己有多少力氣，就去擋敵人。","fx":[["say","車夫"]]},{"t":"小小的前腳，怎麼擋得住大大的車輪呢？","fx":[["focus","螳螂"]]},{"who":"齊莊公","t":"如果牠是人，一定是天下最勇敢的勇士！我們繞路走吧。","fx":[["focus",null]]}],"q":"螳螂想用前腳擋住大車，一點也不知道自己根本擋不住。現在如果有人「不估量自己的力量，去做辦不到的事」，可以用哪個成語形容？","wrong":[{"w":"勢如破竹","by":"車夫","line":"勢如破竹是打仗一路順利、擋都擋不住。螳螂是擋不住車，剛好相反！"},{"w":"以逸待勞","by":"侍衛","line":"以逸待勞是先休息好，等敵人累了再打。螳螂可是衝出來硬擋呀！"},{"w":"以卵擊石","by":"車夫","line":"以卵擊石是拿蛋去砸石頭，也是自不量力，意思很接近！不過這個故事是螳螂擋車，有專門的成語。"}],"hint":"螳螂的「臂」，想「擋」住什麼？古文裡「擋」可以寫成「當」。","after":"齊莊公叫車子繞路走，沒有壓到螳螂。天下的勇士聽說這件事，都想來投靠他。","lesson":{"title":"成語小學堂．螳臂當車","text":"「當」讀ㄉㄤ，是阻擋的意思。《莊子》裡，賢人蘧伯玉用螳螂擋車來提醒人「別高估自己」；齊莊公繞路的故事則記在《韓詩外傳》。現在這個成語用來形容自不量力。","next":"齊莊公因為佩服螳螂而讓路。周武王打敗商朝以後，也要想想該怎麼對待商朝的人……"}},{"id":"e04_08","yr":"《尚書大傳》","place":"周武王的王宮","scene":"palace","music":"palace","cast":[["周武王",0.6,-0.6],["姜太公",-6.8,1.0],["周公",6.8,1.0],["侍衛",2.6,-1.4]],"beats":[{"t":"周武王打敗了商紂王，可是他心裡很不安，覺得天下還沒有真正安定。","fx":[["sad","周武王"]]},{"who":"周武王","t":"進了商朝的都城，該怎麼對待那裡的人民呢？","mv":[["姜太公",-1.0,0.6]]},{"who":"姜太公","t":"我聽說：愛一個人，連他屋頂上的烏鴉也一起愛；討厭一個人，連他家的僕人也一起討厭。","fx":[["say","姜太公"]]},{"who":"周武王","t":"這樣不好，萬一錯怪了好人怎麼辦？","fx":[["upset","周武王"]]},{"who":"周公","t":"讓百姓安心住在自己的家，好好種自己的田，只親近有仁德的人。","mv":[["周公",1.8,0.8]],"fx":[["say","周公"]]},{"t":"周武王聽了，心裡豁然開朗，好像天下已經安定了。","fx":[["cheer","周武王"]]}],"q":"姜太公說的前半句是：因為愛一個人，連他屋頂上的烏鴉也一起愛。現在奶奶很疼小美，連小美的好朋友來家裡，也被奶奶照顧得無微不至。這可以用哪個成語形容？","wrong":[{"w":"烏合之眾","by":"姜太公","line":"烏合之眾是像烏鴉一樣臨時聚在一起、亂糟糟的一群人。和愛不愛一點關係也沒有！"},{"w":"愛不釋手","by":"周公","line":"愛不釋手是喜歡一樣東西，拿著捨不得放下。奶奶是因為愛小美，連她的朋友也一起疼。"},{"w":"推己及人","by":"周武王","line":"推己及人是用自己的心去體諒別人，有點接近！不過重點是因為愛一個人，連和他有關的也一起愛。"}],"hint":"愛那個人的「屋子」，連屋上的「烏」鴉也一起愛。","after":"周武王採用周公的建議，讓商朝的百姓安居樂業，天下就安定下來了。","lesson":{"title":"成語小學堂．愛屋及烏","text":"「烏」是烏鴉，古人覺得烏鴉不吉利，愛到連烏鴉都喜歡，可見有多愛。這個成語出自姜太公的話，不過周武王最後選的是周公「讓百姓安心過日子」的辦法。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第四島．動物教我的道理","eps":[4]},{"key":"i05","line":"island","name":"飛禽走獸說故事","short":"鳥獸王國","era":"古書裡的故事","color":"#C2793A","map":{"ground":"#b9c77c","river":"#4f9fd8"},"intro":{"lines":["歡迎來到成語寓言島的「鳥獸王國」！","這一站的成語裡，藏著龍、鹿、鵰、鶴、兔、雞、貂……好多飛禽走獸。","不過故事的主角其實都是人：有畫家、神射手、聰明的門客，也有壞心的丞相。","這些故事寫在《戰國策》《莊子》《晉書》《北史》等古書裡。看看古人怎麼借動物說人的事吧！"],"people":[["張僧繇","南朝梁的大畫家，畫的龍像活的一樣"],["趙高","秦朝的壞丞相，敢在皇帝面前說謊"],["馮諼","孟嘗君的門客，替主人準備退路"],["紀渻子","替國王訓練鬥雞的高手"]]},"stops":[{"id":"e05_01","yr":"《拾遺記》《歷代名畫記》","place":"金陵的安樂寺","scene":"palace","music":"palace","cast":[["張僧繇",-0.6,0.4],["和尚",1.8,0.2],["遊客",6.8,1.0],["遊客",7.4,1.6]],"beats":[{"t":"南北朝時，梁朝有一位大畫家叫張僧繇。他在金陵安樂寺的牆上，畫了四條白龍。","fx":[["focus","張僧繇"]]},{"t":"龍畫得活靈活現，可是每一條龍都沒有畫眼睛。","mv":[["遊客",1.2,1.2],["遊客#2",2.6,1.4]],"fx":[["focus",null]]},{"who":"遊客","t":"畫得這麼好，為什麼不畫眼睛呢？","fx":[["upset","遊客"]]},{"who":"張僧繇","t":"畫上眼睛，龍就會飛走喔！","fx":[["say","張僧繇"]]},{"who":"遊客#2","t":"龍會飛走？我才不信！快畫給我們看！","fx":[["upset","遊客#2"]]},{"t":"張僧繇只好提起筆，替其中兩條龍點上眼睛。忽然間雷電大作，牆壁都震破了！","fx":[["burst","張僧繇","#e8e0ff"],["upset","和尚"]]},{"t":"點了眼睛的兩條龍騰雲飛上天，沒點眼睛的，還好好留在牆上。","fx":[["upset","遊客"],["upset","遊客#2"]]}],"q":"張僧繇只加了小小的兩點，整條龍就活了過來。現在寫作文時，在結尾加上一句最關鍵的話，讓整篇文章更生動，可以說這句話有什麼效果？","wrong":[{"w":"畫蛇添足","by":"和尚","line":"畫蛇添足是加上多餘的東西，反而壞事。張先生加的那兩筆，可是最重要的！"},{"w":"狗尾續貂","by":"遊客","line":"狗尾續貂是好東西後面接了差的。張先生的龍是越畫越好，剛好相反！"},{"w":"錦上添花","by":"張僧繇","line":"錦上添花是好上加好，有點接近。不過我點的是最關鍵的地方，少了它整條龍就活不起來。"}],"hint":"畫好了龍，最後「點」上了什麼？","after":"大家看得目瞪口呆，從此再也沒有人敢小看張僧繇的畫了。","lesson":{"title":"成語小學堂．畫龍點睛","text":"張僧繇點睛的故事記在唐朝的《歷代名畫記》，是傳說。更早的《拾遺記》也寫過：秦始皇時有位畫工畫的龍鳳不能點眼睛，一點就會飛走。現在用來稱讚關鍵的一筆。","next":"張僧繇讓畫裡的動物活了過來。秦朝卻有一位丞相，硬是把一頭鹿說成另一種動物……"}},{"id":"e05_02","yr":"漢．陸賈《新語》","place":"秦朝的朝廷","scene":"palace","music":"palace","cast":[["秦二世",0.4,-0.8],["趙高",-6.8,0.6],["鹿",-7.4,1.2,0,1],["大臣",2.4,0.4],["大臣",3.0,1.4],["大臣",1.6,1.6]],"beats":[{"t":"秦始皇死後，兒子秦二世當皇帝。丞相趙高大權在握，想看看大臣們聽不聽他的話。"},{"t":"有一天，趙高讓一頭鹿拉著車，跟在皇帝旁邊。","mv":[["趙高",-1.0,0.4],["鹿",-0.2,1.0]]},{"who":"秦二世","t":"丞相，你怎麼用鹿來拉車呢？","fx":[["upset","秦二世"]]},{"who":"趙高","t":"陛下，這是馬呀！不相信的話，可以問問大臣們。","fx":[["say","趙高"],["focus","趙高"]]},{"t":"大臣們都很怕趙高。有一半的人說「是馬」，另一半的人說「是鹿」。","fx":[["sadAll","大臣"],["focus",null]]},{"who":"秦二世","t":"難道……真的是我看錯了？","fx":[["sad","秦二世"]]}],"q":"趙高明明知道那是鹿，卻故意說成馬，連皇帝都不敢相信自己的眼睛。現在如果有人明明是自己先動手，卻硬說是別人先打他，這種「故意顛倒是非」的行為叫什麼？","wrong":[{"w":"老馬識途","by":"大臣","line":"老馬識途是說有經驗的人熟悉門路。趙丞相是在顛倒黑白啊！"},{"w":"心直口快","by":"大臣#2","line":"心直口快是心裡想什麼就說什麼。趙丞相心裡想的和嘴巴說的完全不一樣！"},{"w":"顛倒黑白","by":"秦二世","line":"顛倒黑白也是把錯的說成對的，意思一樣！不過朕這個故事，有一頭鹿和一匹「馬」，有專門的成語。"}],"hint":"趙高「指」著一頭「鹿」，說牠是什麼？","after":"趙高把說「是鹿」的大臣都記下來，後來一一陷害他們。從此，朝廷裡再也沒有人敢說真話。","lesson":{"title":"成語小學堂．指鹿為馬","text":"這個故事最早記在漢朝陸賈的《新語》，《史記》也有記載。一個國家如果沒人敢說真話，就會很危險；秦朝在秦始皇死後只過了三年多就滅亡了。","next":"趙高用一頭鹿考驗大臣。北方草原上，可汗也拿兩支箭考驗一位神射手……"}},{"id":"e05_04","yr":"《北史．長孫晟傳》","place":"突厥的大草原","scene":"road","music":"battle","cast":[["長孫晟",-6.8,1.0],["攝圖可汗",1.2,0.4],["突厥兵",2.8,1.0],["突厥兵",3.2,-0.4],["大鵰",1.0,-1.6,3.0,1],["大鵰",2.2,-1.8,3.2,1]],"beats":[{"t":"北周時，長孫晟護送公主嫁到北方的突厥。他身手矯健，射箭又準又快。","mv":[["長孫晟",-0.8,0.8]]},{"t":"突厥的攝圖可汗很喜歡他，常常找他一起打獵，留他住了整整一年。"},{"t":"有一天，天上兩隻大鵰為了搶一塊肉，在空中扭打起來。","fx":[["focus","大鵰"]]},{"who":"攝圖可汗","t":"長孫晟！這兩支箭給你，把牠們射下來！","fx":[["say","攝圖可汗"],["focus",null]]},{"t":"長孫晟騎馬衝過去，趁兩隻鵰抓在一起的時候，拉滿弓，只射出一支箭。","mv":[["長孫晟",0.2,0.0]],"fx":[["focus","長孫晟"]]},{"t":"咻！一支箭同時射穿了兩隻鵰，兩隻都掉了下來！","mv":[["大鵰",0.8,-1.0,0],["大鵰#2",1.6,-1.2,0]],"fx":[["cheerAll","突厥兵"],["focus",null]]},{"who":"攝圖可汗","t":"太厲害了！我手上還有一支箭沒用到呢！","fx":[["cheer","攝圖可汗"]]}],"q":"長孫晟一箭射中兩隻鵰。現在小美每天騎腳踏車上學，既能運動又省下車錢。這種「做一件事，同時達到兩個目的」的情形，叫做什麼？","wrong":[{"w":"三心二意","by":"突厥兵","line":"三心二意是心思不專一。長孫晟可是專心瞄準，才能一次射中兩隻！"},{"w":"首鼠兩端","by":"攝圖可汗","line":"首鼠兩端是猶豫不決、拿不定主意。他一出手就射中，一點也不猶豫！"},{"w":"一石二鳥","by":"長孫晟","line":"一石二鳥是一顆石頭打中兩隻鳥，意思一樣！不過我用的是箭，射的是大鵰，中國古書裡有專門的成語。"}],"hint":"「一」支「箭」，射中了「雙」……","after":"突厥的貴族們都很佩服，紛紛和長孫晟交朋友，向他學習射箭。","lesson":{"title":"成語小學堂．一箭雙鵰","text":"「鵰」讀ㄉㄧㄠ，是一種很大的猛禽。長孫晟後來在隋朝成為處理突厥事務的大功臣。這個成語現在也常說成「一舉兩得」。","next":"長孫晟的箭術讓人刮目相看。晉朝時，也有一位年輕人一走進人群，大家就注意到他……"}},{"id":"e05_05","yr":"晉．戴逵〈竹林七賢論〉","place":"洛陽城","scene":"palace","music":"map","cast":[["嵇紹",-6.8,0.0],["路人",0.6,-0.6],["路人",1.8,0.2],["路人",-0.6,-1.4],["客人",2.8,1.2],["王戎",6.8,1.2]],"beats":[{"t":"晉朝時，年輕的嵇紹來到京城洛陽。他是「竹林七賢」嵇康的兒子。"},{"t":"洛陽街上人來人往，嵇紹走在熱鬧的人群裡，抬頭挺胸，神采飛揚。","mv":[["嵇紹",0.4,0.4]],"fx":[["focus","嵇紹"]]},{"t":"有一位客人在人群中看見了他，眼睛一亮。","fx":[["upset","客人"],["focus",null]]},{"t":"第二天，這位客人跑去找也是竹林七賢的王戎。","mv":[["嵇紹",-7.5,-1.0],["王戎",1.4,1.0]]},{"who":"客人","t":"昨天我在人群中，第一次見到嵇紹！他昂首挺胸，氣度不凡……","fx":[["say","客人"]]},{"who":"客人","t":"就像一隻野鶴，站在一群雞的中間！","fx":[["cheer","客人"]]}],"q":"嵇紹在人群中特別出眾，就像野鶴站在雞群裡一樣。現在班上的小華跳舞又美又穩，在舞蹈社裡特別突出。可以用哪個成語稱讚她？","wrong":[{"w":"雞飛狗跳","by":"王戎","line":"雞飛狗跳是形容亂成一團。那位年輕人可是氣定神閒，一點也不亂！"},{"w":"雞鳴狗盜","by":"客人","line":"雞鳴狗盜是學雞叫、偷東西的小本事。我說的是嵇紹的氣質非常出眾！"},{"w":"出類拔萃","by":"王戎","line":"出類拔萃也是比別人優秀，意思很接近！不過客人說的是野鶴和雞群，有更生動的成語。"}],"hint":"高高的「鶴」，「立」在「雞群」裡。","after":"王戎笑著說：「你還沒見過他的父親嵇康呢！」意思是嵇康比兒子還要出色。","lesson":{"title":"成語小學堂．鶴立雞群","text":"「嵇」讀ㄐㄧ。「竹林七賢」是魏晉時七位常在竹林裡喝酒、談天的名士，嵇康和王戎都是其中之一。王戎的回答記在《世說新語》。現在用來稱讚人的外表或才能特別出眾。","next":"嵇紹在人群裡很顯眼。戰國時的孟嘗君卻被趕回家，需要有人替他想想退路……"}},{"id":"e05_06","yr":"《戰國策．齊策》","place":"孟嘗君的封地薛","scene":"palace","music":"palace","cast":[["孟嘗君",0.4,0.2],["馮諼",-1.0,0.8],["百姓",2.2,-0.8],["百姓",3.0,0.6],["齊國使者",7.2,1.2]],"beats":[{"t":"戰國時，齊國的孟嘗君被齊王免了宰相的官，只好回到自己的封地薛。","fx":[["sad","孟嘗君"]]},{"t":"薛地的百姓扶老攜幼，走了一百里路來迎接他。原來馮諼之前替他燒掉了百姓的欠債借據。","fx":[["cheerAll","百姓"]]},{"who":"馮諼","t":"聰明的兔子有三個洞，才能保住性命。您現在只有一個洞，還不能高枕安睡。讓我再替您挖兩個吧！","fx":[["say","馮諼"],["focus","馮諼"]]},{"t":"馮諼到梁國去，讓梁王派使者帶著黃金來請孟嘗君。使者來了三趟，孟嘗君都推辭不去。","fx":[["focus",null]]},{"who":"齊國使者","t":"齊王知道錯了！請您回來當宰相吧！","mv":[["齊國使者",1.8,1.2]],"fx":[["say","齊國使者"]]},{"t":"馮諼又請孟嘗君向齊王要來先王的祭器，在薛地蓋起宗廟。宗廟蓋好了……","fx":[["cheer","孟嘗君"]]}],"q":"馮諼對孟嘗君說：「三個洞都挖好了，您可以高枕無憂了！」現在露營時多帶雨衣和備用帳篷，事先準備好幾條退路，可以用哪個成語形容？","wrong":[{"w":"守株待兔","by":"百姓","line":"守株待兔是坐著等好運，不肯努力。馮先生可是忙著到處準備呢！"},{"w":"破釜沉舟","by":"馮諼","line":"破釜沉舟是斷了自己的退路，拚死一戰。我是幫主人多準備退路，剛好相反！"},{"w":"未雨綢繆","by":"孟嘗君","line":"未雨綢繆是事先做好準備，意思接近！不過馮諼說的是聰明兔子有好幾個洞，有專門的成語。"}],"hint":"聰明（狡）的兔子，有「三」個洞（窟）。","after":"孟嘗君當了幾十年的宰相，沒有遇到一點災禍，都是靠馮諼的計謀。","lesson":{"title":"成語小學堂．狡兔三窟","text":"「馮諼」讀ㄈㄥˊ　ㄒㄩㄢ。三個洞是：薛地百姓的愛戴、回齊國當宰相、在薛地蓋宗廟讓齊王不敢隨便動他。「高枕無憂」這個成語也出自這個故事。","next":"馮諼幫孟嘗君準備好退路。另一位高手紀渻子，則花了四十天替國王訓練一隻鬥雞……"}},{"id":"e05_07","yr":"《莊子．達生》","place":"國王的鬥雞場","scene":"palace","music":"map","cast":[["國王",1.4,-0.6],["紀渻子",-0.6,0.6],["鬥雞",0.6,1.2,0,1],["對手雞",6.8,1.0,0,1],["對手雞",7.2,0.2,0,1]],"beats":[{"t":"這段故事出自《莊子》。紀渻子替國王訓練鬥雞。過了十天，國王就來問了。"},{"who":"國王","t":"雞可以上場比賽了嗎？","fx":[["say","國王"]]},{"who":"紀渻子","t":"還不行。牠還很驕傲，自以為很厲害。","fx":[["upset","鬥雞"]]},{"t":"又過十天，牠一聽到聲音、看到影子就想衝；再過十天，還會瞪著眼睛、氣呼呼的。","fx":[["cheer","鬥雞"]]},{"t":"到了第四十天，別的雞在旁邊叫，牠一點反應也沒有，看起來就像木頭雕的一樣。","fx":[["focus","鬥雞"]]},{"who":"紀渻子","t":"差不多了！牠的本事已經練成了。","fx":[["focus",null]]},{"t":"別的雞一看到牠，都不敢應戰，轉身就逃。","mv":[["對手雞",2.4,0.8],["對手雞#2",2.8,0.0]],"fx":[["upset","對手雞"]]}],"q":"這隻鬥雞沉穩得像木頭一樣，原本是稱讚牠功夫練到家。可是後來意思改變了。現在如果教室突然停電，全班同學嚇得愣在那裡一動也不動，可以用哪個成語形容？","wrong":[{"w":"聞雞起舞","by":"紀渻子","line":"聞雞起舞是聽到雞叫就起床練武，形容很勤奮。同學們是被嚇呆了啊！"},{"w":"手舞足蹈","by":"國王","line":"手舞足蹈是高興得跳起來。全班可是一動也不動呢！"},{"w":"目瞪口呆","by":"紀渻子","line":"目瞪口呆是嚇得說不出話，意思很接近！不過這個故事裡有一隻像木頭的雞，有專門的成語。"}],"hint":"那隻鬥雞看起來，就像一隻「木」頭做的「雞」。","after":"原來真正的高手不必大吼大叫，光是站在那裡，對手就不敢靠近。","lesson":{"title":"成語小學堂．呆若木雞","text":"在《莊子》裡，「像木雞」是稱讚鬥雞沉穩、精神專一，是很高的境界。可是後來大家用它來形容人嚇呆、發愣，意思就變了。成語的意思也會隨著時間改變喔！","next":"鬥雞站得穩如木頭。晉朝的朝廷卻亂成一團，連官帽上的裝飾都不夠用了……"}},{"id":"e05_08","yr":"《晉書．趙王倫傳》","place":"晉朝的朝廷","scene":"office","music":"palace","cast":[["司馬倫",0.2,-0.8],["官員",1.8,0.4],["官員",-1.2,0.2],["僕人",6.8,1.0],["小兵",7.4,1.6],["百姓",-7.0,1.2]],"beats":[{"t":"西晉時，趙王司馬倫用武力趕走了晉惠帝，自己坐上了皇帝的位子。","fx":[["cheer","司馬倫"]]},{"who":"司馬倫","t":"跟著我的人，大家都來當官吧！","fx":[["say","司馬倫"]]},{"t":"他亂封官，連僕人、小兵都有官做，多到數也數不清。","mv":[["僕人",2.6,-0.6],["小兵",3.0,1.2]],"fx":[["cheer","僕人"],["cheer","小兵"]]},{"t":"那時候，大官的帽子上要插一條漂亮的貂尾巴。可是官太多了，貂尾巴不夠用！","fx":[["upset","官員"],["focus","官員"]]},{"who":"官員#2","t":"貂尾巴用完了，怎麼辦？只好拿狗尾巴代替吧！","fx":[["sad","官員#2"]]},{"t":"每次上朝，滿屋子都是插著貂尾、狗尾的官帽。老百姓看了都在笑。","mv":[["百姓",-1.4,1.4]],"fx":[["cheer","百姓"],["focus",null]]},{"who":"百姓","t":"貂不足，狗尾續！哈哈哈！"}],"q":"漂亮的貂尾不夠，只好接上普通的狗尾巴。現在一部很好看的電影，第二集卻拍得很差，前後好壞不相稱，可以用哪個成語形容？","wrong":[{"w":"畫龍點睛","by":"百姓","line":"畫龍點睛是加上關鍵的一筆，讓作品更好。狗尾巴可沒讓官帽變好看啊！"},{"w":"搖尾乞憐","by":"小兵","line":"搖尾乞憐是像小狗搖尾巴討好別人。這裡說的是官帽上接錯了尾巴啦！"},{"w":"虎頭蛇尾","by":"官員","line":"虎頭蛇尾是開始很有氣勢，後來越來越沒力，也有點像。不過百姓笑的是好的後面接上差的，有專門的成語。"}],"hint":"「貂」尾不夠，用「狗尾」接上去。","after":"司馬倫當皇帝不到半年就失敗了，這場亂封官的鬧劇也結束了。","lesson":{"title":"成語小學堂．狗尾續貂","text":"「貂」讀ㄉㄧㄠ，貂尾和蟬形裝飾是古代高官帽子上的標誌。這個成語現在用來比喻好的後面接上不好的；有時作家續寫別人的作品，也會謙虛地說自己是「狗尾續貂」。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第五島．飛禽走獸說故事","eps":[5]},{"key":"i06","line":"island","name":"神奇的古代傳說","short":"神話仙境","era":"古代神話與傳說","color":"#6A7BD0","map":{"ground":"#a6c98a","river":"#5aa8e0"},"intro":{"lines":["歡迎來到成語寓言島的「神話仙境」！","這裡有會填海的小鳥、從天上飄下來的仙女、管婚姻的老爺爺，還有一睡就是一輩子的怪夢。","這些故事來自《山海經》《神仙傳》《列子》，還有唐朝人寫的小說和陶淵明的〈桃花源記〉。","它們都是古人想像出來的傳說，不是真的歷史，卻藏著很真實的道理。一起走進仙境看看吧！"],"people":[["精衛","炎帝的小女兒變成的小鳥"],["盧生","在旅店裡做了一場富貴大夢的書生"],["陶淵明","東晉詩人，寫了〈桃花源記〉"],["韓娥","歌聲美得讓人三天都忘不了的歌女"]]},"stops":[{"id":"e06_01","yr":"《山海經．北山經》","place":"東海邊","scene":"river","music":"night","cast":[["女娃",-0.4,0.6],["精衛",-6.8,-0.6,1.8,1,1],["炎帝",-6.8,1.4,0,1,1]],"beats":[{"t":"這是《山海經》裡的神話。很久很久以前，炎帝有一個小女兒，名叫女娃。"},{"who":"女娃","t":"東海好漂亮！我要去海邊玩！","fx":[["cheer","女娃"]]},{"t":"女娃到東海游水，忽然一陣大浪打來，她再也沒有回來。","mv":[["女娃",7.5,-1.2]],"fx":[["focus",null]]},{"t":"後來，發鳩山上出現一隻小鳥：花紋的頭、白色的嘴、紅色的腳，叫聲就像在喊「精衛！精衛！」","mv":[["精衛",-1.0,-0.4,1.6]],"fx":[["focus","精衛"]]},{"t":"傳說牠就是女娃變的。牠每天從西山銜來小樹枝、小石頭，丟進東海裡。","mv":[["精衛",2.0,-1.6,1.8]]},{"who":"精衛","t":"大海奪走了我，我一定要把你填平！","mv":[["精衛",-0.6,-0.6,1.6]],"fx":[["say","精衛"]]}],"q":"小小的鳥兒想填平大海，一天也不放棄。現在小明每天練琴，不管多難都不間斷，這種「意志堅定、不怕困難、努力到底」的精神，可以用哪個成語形容？","wrong":[{"w":"半途而廢","by":"精衛","line":"半途而廢是做到一半就放棄。我可是每天都在搬石頭，從來沒停過！"},{"w":"海市蜃樓","by":"精衛","line":"海市蜃樓是海上看到的虛幻景象。我填海可是真的在做，不是幻影！"},{"w":"愚公移山","by":"精衛","line":"愚公移山也是說堅持到底，意思很接近！不過愚公搬的是山，我填的是海，有專門的成語。"}],"hint":"鳥兒的名字叫「精衛」，牠要把什麼填平？","after":"大海那麼大，石頭那麼小，可是精衛從來沒有停下來。","lesson":{"title":"成語小學堂．精衛填海","text":"《山海經》是中國很古老的一本書，記載了各地的山、河和奇怪的動物、神話。精衛填海用來稱讚意志堅定、不怕困難；有時也用來形容目標很大、很難完成，卻還是不放棄。","next":"精衛從人間飛向大海。有一天夜裡，卻有一位仙女從天上飄到人間來……"}},{"id":"e06_02","yr":"《神異經》《靈怪錄》","place":"郭翰家的院子","scene":"night","music":"night","cast":[["郭翰",-0.8,0.8],["織女",6.8,-1.4,2.4,1,1]],"beats":[{"t":"這是唐朝小說《靈怪錄》裡的傳說。炎熱的夏天夜裡，年輕人郭翰躺在院子裡乘涼。"},{"t":"他抬頭看月亮，忽然看見一個人從天上慢慢飄下來。","mv":[["織女",1.0,-1.0,1.6]],"fx":[["focus","織女"]]},{"who":"郭翰","t":"哇！是仙女！","mv":[["織女",1.0,-0.2,0]],"fx":[["upset","郭翰"],["focus",null]]},{"who":"織女","t":"我是天上的織女，下來人間走走。","fx":[["say","織女"]]},{"t":"郭翰仔細看她的衣服，又輕又亮，奇怪的是，整件衣服上竟然找不到一條縫線！","fx":[["focus","織女"]]},{"who":"郭翰","t":"您的衣服怎麼沒有縫線呢？","fx":[["upset","郭翰"]]},{"who":"織女","t":"天上的衣服，本來就不是用針線縫的呀！","fx":[["cheer","織女"],["focus",null]]}],"q":"仙女的衣服完美得找不到一條縫。現在班上的接力賽，每一棒都交得又快又順，一點失誤也沒有，可以用哪個成語形容？","wrong":[{"w":"破綻百出","by":"郭翰","line":"破綻百出是到處都是漏洞。仙女的衣服可是連一條縫都找不到！"},{"w":"量體裁衣","by":"織女","line":"量體裁衣是照著身材剪布做衣服，比喻看情況辦事。天上的衣服根本不用剪也不用縫喔！"},{"w":"完美無缺","by":"織女","line":"完美無缺也是一點缺點都沒有，意思很接近！不過這個故事是天上的衣服沒有縫，有更生動的成語。"}],"hint":"「天」上的「衣」服，沒有「縫」。","after":"郭翰這才知道，天上仙女的衣服，和人間的衣服完全不一樣。","lesson":{"title":"成語小學堂．天衣無縫","text":"更早的《神異經》就寫過：天賜給人的衣服都沒有縫。郭翰遇見織女是唐代的傳說。現在這個成語用來形容計畫、合作或文章完美得找不到缺點。","next":"郭翰在夜裡遇見仙女。另一位窮書生在旅店裡打了個盹，竟然過完了一輩子……"}},{"id":"e06_03","yr":"唐．沈既濟《枕中記》","place":"邯鄲的旅店","scene":"house","music":"night","cast":[["盧生",-6.8,1.0],["呂翁",0.4,-0.4],["店主人",2.2,-0.8]],"beats":[{"t":"這是唐朝小說《枕中記》的故事。道士呂翁在邯鄲的旅店休息，遇到一個窮書生盧生。","mv":[["盧生",-0.8,0.6]]},{"who":"盧生","t":"唉！大丈夫活在世上，卻這麼不得志，日子過得好苦啊！","fx":[["sad","盧生"]]},{"t":"這時候，店主人正在蒸一鍋黃色的小米飯。","fx":[["focus","店主人"]]},{"who":"呂翁","t":"你枕著我這個枕頭睡一覺，就能讓你如願以償。","fx":[["say","呂翁"],["focus",null]]},{"t":"盧生一睡著，就夢見自己娶了美麗的妻子、當上大官，享盡富貴，過了五十多年。","fx":[["cheer","盧生"]]},{"t":"盧生伸個懶腰醒來，發現自己還躺在旅店裡，呂翁坐在旁邊，店主人的小米飯竟然還沒蒸熟！","fx":[["upset","盧生"],["focus","盧生"]]},{"who":"盧生","t":"原來……只是一場夢！"}],"q":"盧生在夢裡享盡五十年富貴，醒來時一鍋小米飯都還沒煮熟。現在小強幻想中了樂透變成大富翁，醒來才發現什麼都沒有。可以用哪個成語形容？","wrong":[{"w":"夢寐以求","by":"店主人","line":"夢寐以求是連做夢都想得到，形容非常渴望。這裡是說富貴像夢一樣，一下子就沒了！"},{"w":"飛黃騰達","by":"呂翁","line":"飛黃騰達是形容官越做越大。可惜那只是夢裡的事，醒來全沒了。"},{"w":"南柯一夢","by":"呂翁","line":"南柯一夢的意思幾乎一樣！不過那是在槐樹下做的夢。盧生
