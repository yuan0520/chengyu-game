剛即位時什麼事都不管……"}},{"id":"e03_07","yr":"約西元前 610 年","place":"楚國宮廷","scene":"office","music":"palace","cast":[["楚莊王",-1,0.6],["右司馬",6,1.2],["舞者",-2.6,-0.8],["舞者",2.4,-0.8]],"beats":[{"t":"楚莊王即位三年了，從來不發布命令，也不處理政事。","fx":[["cheerAll","舞者"],["cheer","楚莊王"]]},{"t":"大臣們都很著急。有一位右司馬想了個辦法——出一個謎語給國王猜。","mv":[["右司馬",1.4,0.6]]},{"who":"右司馬","t":"南方的山丘上停著一隻鳥，三年不展翅、不飛也不叫，靜悄悄的。大王，這是什麼鳥呢？"},{"t":"楚莊王聽懂了，大臣其實是在說他。","fx":[["focus","楚莊王"]]},{"who":"楚莊王","t":"三年不展翅，是在讓羽翼長大；不飛也不叫，是在觀察百姓的情況。"}],"q":"楚莊王接著說：「牠雖然還沒飛，一飛就會衝上天；雖然還沒叫，一叫就會讓人吃驚。」這句話變成哪個成語？","wrong":[{"w":"鴉雀無聲","by":"右司馬","line":"鴉雀無聲是安靜得一點聲音都沒有。大王說的是這隻鳥一叫就嚇大家一跳！"},{"w":"驚弓之鳥","by":"楚莊王","line":"驚弓之鳥是被嚇怕了的鳥。我這隻鳥可是準備一飛沖天呢！"},{"w":"一飛沖天","by":"楚莊王","line":"「一飛沖天」也是我說的，不過要找的是後半句：一叫就讓人吃驚！"}],"hint":"鳥叫的「鳴」，就藏在成語裡。","after":"半年後，楚莊王開始親自處理政事，撤掉不好的官員，提拔有才能的人，楚國治理得很好。","lesson":{"title":"問鼎中原","text":"楚莊王後來打敗晉國，成為霸主。他曾經帶兵到周朝邊境，問周天子的「九鼎」有多大、多重。九鼎象徵天下，問鼎就是想取代周朝，這就是成語「問鼎中原」的由來。","next":"春秋末年，南方的吳國和越國結下了深仇……"}},{"id":"e08_02","yr":"約西元前 490 年","place":"越國","scene":"study","music":"night","cast":[["句踐",-0.3,-1.4],["夫人",1.4,-1.1],["范蠡",6,0.6]],"beats":[{"t":"春秋末年，吳國和越國是死對頭。吳王夫差打敗越國，把越王句踐圍困在會稽山上。"},{"t":"句踐只好求和，願意當吳王的臣子。吳王答應了，越國才保存下來。","mv":[["范蠡",1.6,0.8]]},{"who":"句踐","t":"會稽山的恥辱，我永遠不會忘記！","fx":[["upset","句踐"]]},{"t":"回國後，句踐在座位旁掛了一顆苦膽，坐著、躺著都抬頭看它，吃飯前也先嘗一口。","fx":[["sad","句踐"]]},{"who":"句踐","t":"你忘了會稽的恥辱了嗎？"},{"t":"他親自下田耕種，夫人親手織布。吃飯不加肉，衣服也不穿花俏的，和百姓一起辛勞。","mv":[["夫人",0.9,-0.4]]},{"who":"范蠡","t":"大王這樣努力，越國一定會強大起來！"}],"q":"句踐每天嘗苦膽、過苦日子，提醒自己不忘國仇，努力讓國家變強。後人用哪個成語形容他？","wrong":[{"w":"苦盡甘來","by":"夫人","line":"苦盡甘來是苦日子過完，好日子來了。大王現在還在刻意吃苦呢！"},{"w":"樂不思蜀","by":"句踐","line":"樂不思蜀是在敵國快樂得忘了故鄉。我可是天天都記著恥辱！"},{"w":"忍辱負重","by":"范蠡","line":"忍辱負重是忍受委屈、扛起重任，意思很接近！不過大王掛苦膽、天天嘗，有一個專門的成語。"}],"hint":"「膽」是苦苦的膽，「薪」是柴草。","after":"小知識：《史記》只寫句踐「嘗膽」；「睡在柴草上（臥薪）」是後人加上去的說法。","lesson":{"title":"吳越爭霸","text":"經過十多年的努力，越國富強起來。吳王夫差北上和各國爭霸時，句踐趁機出兵，最後在西元前 473 年滅了吳國，也成為霸主。春秋時代，就在這一連串爭霸中走向尾聲。","next":"進入戰國時代，各國貴族都喜歡養「門客」。齊國的孟嘗君，門客就有好幾千人……"}},{"id":"e05_03","yr":"約西元前 299 年","place":"函谷關","scene":"night","music":"night","cast":[["孟嘗君",-6,1.4],["門客",-7,0.6,0,1],["門客",-7.2,2.2,0,0],["守關士兵",0,-3.4],["秦兵",-9,-5],["秦兵",-10,-6.2]],"beats":[{"t":"戰國時代，齊國的孟嘗君很好客，家裡養了幾千個門客，有的有學問，有的只會一些小本事。"},{"t":"孟嘗君到秦國，秦昭王卻聽信別人的話，把他關起來，還想殺他。"},{"t":"孟嘗君拜託秦王的寵妃幫忙。寵妃說：「送我白狐皮大衣，我就幫你。」可是那件大衣，早就送給秦王了。"},{"t":"一位會裝成狗、溜進去偷東西的門客，半夜潛進秦宮倉庫，把大衣偷了回來。寵妃替孟嘗君說情，秦王放了他。"},{"t":"孟嘗君連夜逃跑，半夜來到函谷關。","mv":[["孟嘗君",-1.4,0.6],["門客",-0.2,1.2],["門客#2",-2.4,1.6]]},{"who":"守關士兵","t":"按照規定，雞叫了才能開關門放人！現在是半夜，等天亮吧！"},{"t":"這時候，秦王後悔了，派兵追了過來！","mv":[["秦兵",-5.4,-2.6],["秦兵#2",-6.4,-3.8]],"fx":[["upset","孟嘗君"]]},{"who":"門客#2","t":"看我的！喔喔喔——！","fx":[["cheer","門客#2"]]},{"t":"附近的雞全都跟著叫了起來，守關士兵打開關門，孟嘗君逃出了秦國！","mv":[["孟嘗君",1.2,-5],["門客",2.2,-5.6],["門客#2",0.2,-5.8]]}],"q":"孟嘗君靠著會裝狗偷東西、會學雞叫的門客逃過一劫。這種小本事，叫做什麼？","wrong":[{"w":"雞飛狗跳","by":"守關士兵","line":"雞飛狗跳是亂成一團。剛剛只是雞在叫，可沒有亂跳喔！"},{"w":"狗急跳牆","by":"門客","line":"狗急跳牆是被逼急了亂來。我們可是想好辦法才行動的！"},{"w":"雕蟲小技","by":"孟嘗君","line":"雕蟲小技也是說不起眼的小本事，意思很接近！不過學雞叫、裝狗偷東西，有一個專門的成語。"}],"hint":"門客學的是哪兩種動物？","after":"秦王的追兵趕到函谷關時，孟嘗君已經出關了，只好回去。","lesson":{"title":"戰國七雄","text":"戰國時代，秦、楚、齊、燕、韓、趙、魏七國互相競爭，各國都在搶人才，所以像孟嘗君這樣養門客的人很受歡迎。西邊的秦國越來越強，常常欺負其他國家。","next":"有一天，秦王聽說趙國得到一塊珍貴的寶玉「和氏璧」……"}},{"id":"e09_05","yr":"西元前 283 年","place":"秦國章臺","scene":"palace","music":"palace","cast":[["藺相如",-6.5,1.2],["秦昭王",1.4,0.6],["大臣",2.8,1.6],["大臣",-0.2,-1.4]],"beats":[{"t":"趙國得到一塊珍貴的寶玉，叫做「和氏璧」。秦昭王寫信給趙王，說願意用十五座城來交換。"},{"t":"趙王怕被騙，又怕不給會惹秦國生氣。大臣推薦了藺相如出使秦國。"},{"t":"藺相如帶著和氏璧，來到秦國。","mv":[["藺相如",-1.1,0.6]]},{"t":"秦王拿到璧，高興地傳給妃子和左右的人看，卻完全不提換城的事。","fx":[["cheer","秦昭王"],["cheerAll","大臣"]]},{"who":"藺相如","t":"這塊璧上有一個小斑點，請讓我指給大王看。"},{"t":"藺相如拿回和氏璧，退後幾步靠著柱子，氣得頭髮都豎了起來。","mv":[["藺相如",-2.4,-0.6]],"fx":[["upset","藺相如"]]},{"who":"藺相如","t":"大王如果要逼我，我的頭就和這塊璧，一起撞碎在柱子上！"},{"who":"秦昭王","t":"別衝動！來人，拿地圖來！從這裡到那裡，十五座城都給趙國！"},{"t":"藺相如看出秦王只是假裝，當天晚上就讓隨從換上粗布衣服，抄小路把璧送回趙國。"}],"q":"藺相如出發前對趙王說：「秦國不給城，我就把璧完完整整地帶回趙國。」他真的做到了。這叫做什麼？","wrong":[{"w":"拋磚引玉","by":"大臣","line":"拋磚引玉是先說出粗淺的意見，引出別人的好意見。跟這塊寶玉沒關係啦！"},{"w":"玉石俱焚","by":"藺相如","line":"玉石俱焚是好的壞的一起毀掉。我只是嚇嚇秦王，最後璧可是完好無缺地回去了！"},{"w":"物歸原主","by":"秦昭王","line":"物歸原主也是把東西還給主人，意思很接近！不過「把璧完整送回趙國」，有一個專門的成語。"}],"hint":"「完」是完整，「璧」是圓形的玉。","after":"秦王知道被騙了，卻也佩服藺相如的勇氣，最後還是以禮相待，讓他回到趙國。","lesson":{"title":"將相和","text":"藺相如立了大功，官位比大將廉頗還高。廉頗不服氣，藺相如卻處處讓他，說秦國不敢攻打趙國，就是因為有他們兩人在。廉頗知道後，背著荊條上門道歉，這就是「負荊請罪」。","next":"二十多年後，廉頗老了，秦國大軍又來攻打趙國……"}},{"id":"e12_04","yr":"西元前 260 年","place":"長平","scene":"tent","music":"battle","table":true,"winSad":"趙括","cast":[["趙括",-1.2,0.6],["趙奢",1.4,0.6],["廉頗",6.5,1.2]],"beats":[{"t":"趙國名將趙奢有個兒子叫趙括，從小熟讀兵書，談起打仗頭頭是道。"},{"who":"趙括","t":"爹，這一仗如果是我來打，就這樣排兵……天下沒有人比得上我！","fx":[["cheer","趙括"]]},{"t":"趙奢和兒子討論兵法，常常說不過他，卻從來不稱讚他。"},{"who":"趙奢","t":"打仗是攸關生死的事，括兒卻說得這麼輕鬆。將來趙國如果讓他當大將，打敗趙軍的一定就是他。","fx":[["sad","趙奢"]]},{"t":"多年後，趙奢過世了。西元前 260 年，秦軍在長平和趙軍對峙，老將廉頗堅守營壘，不肯出戰。","mv":[["趙奢",6.5,-1.2],["廉頗",1.4,0.6]]},{"t":"秦國派人散布謠言：「秦國最怕的，是趙奢的兒子趙括當大將！」趙王信以為真，要讓趙括代替廉頗。"},{"t":"藺相如勸趙王：趙括只會讀父親留下的兵書，不懂得隨機應變。趙括的母親也說兒子不能當大將。趙王都不聽。","mv":[["廉頗",6.5,1.4]]},{"who":"趙括","t":"從今天起，全軍照我的命令，出營進攻！","mv":[["趙括",0.2,0.4]]}],"q":"趙括只會照著兵書講道理，真正打仗時卻不懂變通。這種只會空談的人，叫做什麼？","wrong":[{"w":"身經百戰","by":"趙括","line":"身經百戰是打過很多仗、經驗豐富。我……我其實一場大仗都沒打過。"},{"w":"百戰百勝","by":"趙奢","line":"百戰百勝是每戰必勝。我擔心的剛好相反，他會讓趙軍大敗！"},{"w":"閉門造車","by":"廉頗","line":"閉門造車是不管實際情況、關起門來做事，意思有點接近！不過趙括的故事，有一個專門的成語。"}],"hint":"趙括的本事，全都停留在哪裡？","after":"趙括一上任就改掉廉頗的部署，出兵進攻，結果被秦將白起包圍，自己也中箭而死。","lesson":{"title":"秦統一天下","text":"長平之戰，趙國損失了四十多萬士兵，從此再也擋不住秦國。後來秦國陸續滅了六國，西元前 221 年，秦王嬴政統一天下，自稱「始皇帝」，戰國時代結束了。","next":"春秋戰國這一章完成了！接下來，到下一章「楚漢爭霸」看秦朝滅亡和楚漢相爭吧！"}}],"line":"history","name":"春秋戰國","title":"第八章．春秋戰國","eps":[3,4,5,8,9,12,13]},{"key":"h08","line":"history","name":"變法圖強","short":"戰國初期","era":"西元前 365–338 年","color":"#3E6FA8","map":{"ground":"#b0c27a","river":"#4f9fd8"},"intro":{"lines":["春秋結束後，晉國分裂成韓、趙、魏三國，歷史進入「戰國時代」。","各國為了不被吞掉，都想辦法改革變強：齊國有齊威王廣納建言，秦國有商鞅變法。","齊國和魏國也在戰場上鬥智，軍師孫臏和他的老同學龐涓，展開一場大對決。","這時候，後來被尊為「亞聖」的孟子，正在媽媽的照顧下長大。"],"people":[["孟子","儒家大師，小時候由媽媽細心教養"],["商鞅","替秦孝公變法，讓秦國變強"],["齊威王","齊國國君，願意聽大臣的批評"],["孫臏","齊國軍師，用計打敗龐涓"]]},"stops":[{"id":"e11_01","yr":"約西元前 365 年","place":"鄒國","scene":"house","music":"map","cast":[["孟母",1.4,-0.4],["小孟子",-0.4,0.4],["鄰居",6.5,1.2]],"beats":[{"t":"孟子名叫孟軻，是鄒國人。他小時候，和媽媽住在墓地旁邊。"},{"t":"小孟子每天看人家辦喪事，就學著蹦蹦跳跳、挖土埋東西，玩起辦喪事的遊戲。","fx":[["cheer","小孟子"]]},{"who":"孟母","t":"這裡不適合孩子住啊！","fx":[["upset","孟母"]]},{"t":"她們搬到市場旁邊。這回，小孟子學起商人大聲叫賣。","mv":[["小孟子",0.6,0.8],["鄰居",2.4,1.0]]},{"who":"小孟子","t":"快來買喔！又大又便宜！","fx":[["cheer","小孟子"]]},{"who":"孟母","t":"這裡也不行……我們再搬家！","fx":[["sad","孟母"]]},{"t":"最後搬到學堂旁邊。小孟子開始學著擺禮器、鞠躬行禮，進退都很有禮貌。","mv":[["鄰居",7.0,1.2],["小孟子",-0.6,-0.2]],"fx":[["say","小孟子"],["cheer","孟母"]]}],"q":"孟母說：「這裡才真正適合我的孩子住！」她為了給孩子好的學習環境，一次又一次搬家。這個故事變成哪個成語？","wrong":[{"w":"安土重遷","by":"孟母","line":"安土重遷是住慣了老家、不想搬家。我為了孩子，可是說搬就搬！"},{"w":"搬弄是非","by":"鄰居","line":"搬弄是非是在別人背後說閒話、挑撥。孟家搬的是家，不是是非啦！"},{"w":"近朱者赤","by":"鄰居","line":"近朱者赤是說環境會影響人，道理一樣！不過孟子媽媽為孩子搬家的故事，有一個專門的成語。"}],"hint":"「遷」是搬家；主角是孟子的媽媽。","after":"孟母就在學堂旁邊住了下來。小孟子在讀書的環境裡，慢慢長大了。","lesson":{"title":"環境很重要","text":"這個故事記在西漢劉向寫的《列女傳》，是後人記下的孟子童年故事。故事告訴我們：身邊的環境，會影響一個人學到什麼。","next":"搬到學堂旁以後，孟子開始上學。可是有一天，他放學回家……"}},{"id":"e11_02","yr":"約西元前 360 年","place":"孟子家","scene":"house","music":"night","cast":[["孟母",0.6,-0.8],["孟子",-6.5,1.0]],"beats":[{"t":"孟子長大一些，開始到學堂讀書。媽媽每天在家織布，賺錢養家。","fx":[["say","孟母"]]},{"t":"這天，孟子放學回家。","mv":[["孟子",-1.0,0.6]]},{"who":"孟母","t":"今天學得怎麼樣啊？"},{"who":"孟子","t":"還不是老樣子。","fx":[["sad","孟子"]]},{"t":"孟母聽了，二話不說拿起刀，把織布機上快織好的布割斷了！","fx":[["upset","孟母"],["focus","孟母"]]},{"who":"孟子","t":"媽！您為什麼要這樣做？","fx":[["upset","孟子"]]},{"who":"孟母","t":"你荒廢學業，就像我割斷這塊布。布斷了就織不成，讀書半途而廢，也什麼都學不成！"}],"q":"孟母割斷織布機上的布，來教兒子讀書不可以半途而廢。這個故事變成哪個成語？","wrong":[{"w":"機不可失","by":"孟子","line":"機不可失是說機會難得、不能錯過。這裡的「機」是織布機啦！"},{"w":"一刀兩斷","by":"孟母","line":"一刀兩斷是斷絕關係！我割斷的是布，可不是不要你這個兒子！"},{"w":"教子有方","by":"孟子","line":"教子有方是稱讚父母很會教孩子，我媽媽的確是！不過「割斷布來教我」，有一個專門的成語。"}],"hint":"「機」是織布機，不是機器。","after":"孟子嚇了一跳，從此早晚用功讀書，後來跟隨子思一派的老師學習，成為天下有名的大學者。","lesson":{"title":"亞聖孟子","text":"孟子主張「性善」，認為人天生就有善良的心，也提醒國君要愛護百姓，說「民為貴」。後人尊稱他「亞聖」，地位僅次於孔子。這個故事也記在《列女傳》裡。","next":"同一時間，西邊的秦國來了一位從魏國投奔的人才——商鞅……"}},{"id":"e09_02","yr":"約西元前 359 年","place":"秦國都城南門","scene":"walls","music":"map","cast":[["商鞅",1.8,-1.0],["官員",0.6,-0.2],["百姓",-1.4,0.6],["百姓",-0.4,1.2],["百姓",2.4,1.2],["年輕人",-6.5,1.4]],"beats":[{"t":"秦孝公想讓秦國變強，重用了商鞅。商鞅訂好新法令，卻擔心百姓不相信。","fx":[["focus","商鞅"]]},{"t":"他叫人在都城南門，立起一根三丈長的大木頭。"},{"who":"官員","t":"誰能把這根木頭搬到北門，就賞他十金！","fx":[["say","官員"]]},{"who":"百姓","t":"搬個木頭就給錢？一定是騙人的！","fx":[["upset","百姓"]]},{"who":"官員","t":"沒人要搬嗎？賞金提高到五十金！"},{"who":"年輕人","t":"我來試試看！","mv":[["年輕人",0.2,0.4]],"fx":[["cheer","年輕人"]]},{"t":"年輕人扛起木頭，一路搬到北門。商鞅馬上給了他五十金！","mv":[["年輕人",7.2,0.8]],"fx":[["burst","商鞅","#e8b84f"],["cheerAll","百姓"]]}],"q":"商鞅用「搬木頭真的給賞金」這件事，讓百姓相信他說話算話，再公布新法令。這個故事變成哪個成語？","wrong":[{"w":"朝三暮四","by":"百姓","line":"朝三暮四是反覆無常、說變就變。商大人說給就給，一點都沒變！"},{"w":"輕舉妄動","by":"年輕人","line":"輕舉妄動是隨便亂行動。我可是想清楚了才去搬的！"},{"w":"言而有信","by":"商鞅","line":"言而有信是說話算數，意思很接近！不過用「搬木頭」來取得大家的信任，有一個專門的成語。"}],"hint":"「徙」讀ㄒㄧˇ，是搬移的意思。","after":"百姓們都說：「商大人說到做到！」新法令公布後，大家都相信了。","lesson":{"title":"商鞅變法","text":"新法獎勵耕田和打仗立功，犯了法的人不分貴賤一律處罰。秦國原本被東方各國看不起，從此慢慢變成最強的國家。","next":"東方的齊國，也有一位想讓國家變好的大臣。他每天早上都要照鏡子……"}},{"id":"e14_01","yr":"約西元前 350 年","place":"齊國宮廷","scene":"palace","music":"palace","cast":[["鄒忌",-6.5,1.0],["齊威王",1.4,-0.4],["大臣",6.5,0.4],["大臣",7.2,1.4],["大臣",7.8,-0.6]],"beats":[{"t":"齊國的鄒忌長得又高又帥。他問妻子、小妾和客人：「我和城北的徐公，誰比較帥？」大家都說他帥。"},{"t":"後來徐公來了，鄒忌仔細一看，覺得自己差遠了。他想：原來大家都在說好聽話……"},{"t":"鄒忌去見齊威王。","mv":[["鄒忌",-1.0,0.4]]},{"who":"鄒忌","t":"妻子偏愛我，小妾怕我，客人有求於我，所以都說我帥。大王身邊的人更多，您聽到的真話一定更少啊！","fx":[["focus","鄒忌"]]},{"who":"齊威王","t":"說得好！傳令下去：能當面指出我過錯的人，得上等獎賞！","fx":[["say","齊威王"]]},{"t":"命令一公布，大臣們紛紛跑來提意見，宮門口擠得滿滿的！","mv":[["大臣",2.4,0.8],["大臣#2",0.4,1.4],["大臣#3",2.8,-0.8]],"fx":[["cheerAll","大臣"]]}],"q":"來提意見的大臣多得不得了，宮殿的大門口和庭院熱鬧得像市場一樣。用哪個成語形容來的人非常多？","wrong":[{"w":"門可羅雀","by":"鄒忌","line":"門可羅雀是門口冷清得可以張網抓麻雀，剛好相反喔！"},{"w":"唯唯諾諾","by":"大臣","line":"唯唯諾諾是只會說「是、是」。我們現在可是敢說真話了！"},{"w":"人山人海","by":"齊威王","line":"人山人海是人非常多，意思很接近！不過形容「家門口和庭院」來的人多，有一個專門的成語。"}],"hint":"「庭」是庭院；擠得像什麼地方？","after":"幾個月後，偶爾才有人來提意見；一年後，大家想說也沒什麼好說了。燕、趙、韓、魏聽說了，都來朝見齊國。","lesson":{"title":"在朝廷打勝仗","text":"《戰國策》說，這就是「不用打仗，在朝廷裡就勝過了別國」。這個故事的對話有說故事的味道，但齊威王願意聽批評、讓齊國變強，是真的。","next":"這時的秦國，商鞅的新法已經推行了好幾年……"}},{"id":"e22_04","yr":"約西元前 350 年","place":"秦國大街","scene":"road","music":"map","cast":[["商鞅",1.6,-1.0],["官員",2.8,-0.2],["路人",-6.5,1.0],["路人",0.4,0.8],["失主",6.5,1.2]],"beats":[{"t":"商鞅在秦國推行新法令。他做事公平，不管多有權勢的人犯法，一樣處罰。","fx":[["focus","商鞅"]]},{"who":"商鞅","t":"太子犯了法，太子的老師也要受罰！","fx":[["say","商鞅"]]},{"who":"官員","t":"連太子的老師都不放過……以後誰還敢不守法？","fx":[["upset","官員"]]},{"t":"過了一段時間，有人在路上掉了一個錢袋。","mv":[["路人",-0.6,0.2]]},{"who":"路人#2","t":"這不是我的東西，不能拿。就放在這裡，等主人回來找吧！","fx":[["say","路人#2"]]},{"t":"掉錢袋的人急急忙忙跑回來，錢袋還好好地躺在地上。","mv":[["失主",1.0,0.6]],"fx":[["cheer","失主"]]}],"q":"商鞅變法後，秦國的路上就算有人掉了東西，也沒有人撿走。用哪個成語形容社會安定、風氣好？","wrong":[{"w":"雞犬不寧","by":"路人","line":"雞犬不寧是吵到連雞和狗都不得安寧。現在秦國可安定了！"},{"w":"目無法紀","by":"官員","line":"目無法紀是不把法律放在眼裡。現在秦國人人都守法啊！"},{"w":"拾金不昧","by":"失主","line":"拾金不昧是撿到錢還給失主，意思很接近！不過形容「整個社會東西掉在路上都沒人拿」，有一個專門的成語。"}],"hint":"「遺」是別人掉的東西，「拾」是撿起來。","after":"秦國百姓不敢亂拿別人的東西，軍隊也越來越強，各國諸侯都很害怕秦國。","lesson":{"title":"嚴格的法令","text":"不過《戰國策》也說，商鞅的法令「刻深寡恩」——太嚴厲、不講情面，大家是因為害怕才服從。他也因此得罪了很多貴族，包括太子。","next":"東方的齊國呢？齊威王很愛喝酒玩樂，有一位矮小又幽默的大臣，想了個妙方法勸他……"}},{"id":"e41_03","yr":"約西元前 349 年","place":"齊國後宮","scene":"palace","music":"palace","cast":[["齊威王",1.4,-0.6],["淳于髡",-6.5,1.0],["宮女",2.8,0.6],["宮女",-0.4,-1.6]],"beats":[{"t":"楚國派大軍攻打齊國。淳于髡出使趙國，借來十萬大軍，楚軍嚇得連夜退兵。","mv":[["淳于髡",-1.0,0.6]]},{"t":"齊威王非常高興，在後宮擺酒慶功。","fx":[["cheer","齊威王"],["cheerAll","宮女"]]},{"who":"齊威王","t":"先生要喝多少酒才會醉呢？"},{"who":"淳于髡","t":"我喝一斗也會醉，喝一石也會醉。","fx":[["say","淳于髡"]]},{"who":"齊威王","t":"一石是一斗的十倍耶！喝一斗就醉了，怎麼還能喝一石？","fx":[["upset","齊威王"]]},{"who":"淳于髡","t":"在大王面前，執法官站在旁邊，我很緊張，一斗就醉了。"},{"who":"淳于髡","t":"可是到了晚上，大家擠在一起坐，杯子、盤子亂七八糟堆了一桌，這時我最開心，能喝到一石！","fx":[["focus","淳于髡"]]}],"q":"淳于髡形容宴會到最後，杯子和盤子散亂一桌、亂七八糟的樣子。用哪個成語來形容？","wrong":[{"w":"井然有序","by":"齊威王","line":"井然有序是整整齊齊、很有條理。他說的剛好相反！"},{"w":"山珍海味","by":"宮女","line":"山珍海味是說菜色很豐盛。他說的是吃完以後，桌上亂糟糟的樣子！"},{"w":"七零八落","by":"淳于髡","line":"七零八落是零零散散、不整齊，意思接近！不過專門形容宴會上杯盤散亂，有一個更貼切的成語。"}],"hint":"形容凌亂的「狼藉」，相傳和狼睡過的草堆有關。","after":"淳于髡接著說：「所以酒喝到極點就會亂，快樂到極點就會悲傷。」齊威王聽懂了，從此不再整夜喝酒。","lesson":{"title":"滑稽列傳","text":"淳于髡個子矮小，很會說笑話，常用有趣的比喻勸國君。司馬遷把他寫進《史記．滑稽列傳》。古時候的「滑稽」，是說話風趣、能言善道的意思。","next":"不久，齊國和魏國打起仗來。齊國的軍師，是被魏將龐涓陷害過的孫臏……"}},{"id":"e41_04","yr":"西元前 341 年","place":"魏國境內往馬陵途中","scene":"valley","music":"battle","winSad":"龐涓","cast":[["田忌",-4.0,-0.6,0.25],["孫臏",-4.8,-1.4,0.25],["齊兵",-3.2,-1.6,0.25],["齊兵",-5.4,-0.4,0.25],["龐涓",7.0,-1.0,0.25],["魏兵",7.8,-1.8,0.25],["魏兵",8.2,-0.2,0.25]],"beats":[{"t":"魏國攻打韓國，韓國向齊國求救。齊國派田忌當大將、孫臏當軍師，直接攻向魏國首都大梁。","fx":[["cheerAll","齊兵"]]},{"t":"魏國大將龐涓急忙回頭。孫臏和龐涓從前一起學兵法，龐涓嫉妒孫臏的才能，曾經陷害過他。","mv":[["龐涓",4.4,-1.0],["魏兵",5.2,-1.8],["魏兵#2",5.4,-0.2]]},{"who":"孫臏","t":"魏軍一向勇猛，看不起我們齊軍，說齊兵膽小。我們就利用這一點！","fx":[["focus","孫臏"]]},{"t":"孫臏下令：進入魏國第一天，挖十萬個煮飯的灶；第二天挖五萬個；第三天只挖三萬個。"},{"t":"龐涓追了三天，一路數著齊軍留下的灶。","fx":[["focus","龐涓"]]},{"who":"龐涓","t":"哈哈！才三天，齊兵就逃走一大半了！丟下步兵，跟我快馬追上去！","fx":[["cheer","龐涓"]]}],"q":"孫臏說：「會打仗的人，要順著敵人的情勢，把它引導到對自己有利的方向。」這句話變成哪個成語？","wrong":[{"w":"順手牽羊","by":"龐涓","line":"順手牽羊是趁機拿走別人的東西。我可是要追上去，把齊軍一網打盡！"},{"w":"背水一戰","by":"田忌","line":"背水一戰是斷了退路、拚死一戰。我們沒打算拚命，是要讓敵人自己上當！"},{"w":"順水推舟","by":"孫臏","line":"順水推舟是順著情勢做事，意思很接近！不過我是主動把敵人的驕傲「引導」到對我們有利的方向，有一個專門的成語。"}],"hint":"「因」是順著，「勢」是情勢，「導」是引導。","after":"孫臏算好龐涓天黑會到馬陵，在路旁大樹上寫字，埋伏弓箭手。龐涓點火看字時，齊軍萬箭齊發，魏軍大敗，龐涓也死在馬陵。","lesson":{"title":"馬陵之戰","text":"十多年前，孫臏就用「圍魏救趙」的計策打敗過魏軍。馬陵之戰後，魏國元氣大傷，再也不是最強的國家，西邊的秦國趁機崛起。","next":"秦國越來越強。可是就在這時候，最支持商鞅的秦孝公過世了……"}},{"id":"e16_02","yr":"西元前 338 年","place":"秦國邊境關口","scene":"walls","music":"night","winSad":"商鞅","cast":[["商鞅",-6.5,1.0],["客舍主人",1.4,-0.4],["秦兵",-9.0,-2.0,0,0,1],["秦兵",-9.6,-1.0,0,0,1]],"beats":[{"t":"秦孝公過世，太子即位。從前被商鞅處罰過的貴族，誣告商鞅要造反，官府派人來抓他。"},{"t":"商鞅連夜逃走，來到邊境的關口，想找一間客舍住一晚。","mv":[["商鞅",-0.8,0.4]]},{"who":"商鞅","t":"老闆，我要住一晚。"},{"who":"客舍主人","t":"請拿出你的證件。商君的法令規定：收留沒有證件的客人，店家也要一起受罰！","fx":[["say","客舍主人"]]},{"t":"主人不知道，站在眼前的就是商鞅本人。","fx":[["focus","商鞅"],["upset","商鞅"]]},{"who":"商鞅","t":"唉！我訂的法令，竟然害自己落到這種地步！","fx":[["sad","商鞅"]]},{"t":"遠處傳來追兵的腳步聲……","mv":[["秦兵",-6.2,-2.4],["秦兵#2",-6.8,-1.2]]}],"q":"商鞅自己訂下「沒證件不能住宿」的法令，最後讓自己無處可住。這種「自己訂的規定，反而害了自己」，叫做什麼？","wrong":[{"w":"作威作福","by":"客舍主人","line":"作威作福是仗著權勢欺負人。我只是照規定辦事啊！"},{"w":"自由自在","by":"商鞅","line":"自由自在？我現在到處躲藏，連一個睡覺的地方都沒有……"},{"w":"作繭自縛","by":"商鞅","line":"作繭自縛是像蠶吐絲把自己包住，意思很接近！不過「自己訂的法令害了自己」，有一個專門的成語。"}],"hint":"「法」是法令，「斃」是倒下、受害。","after":"商鞅逃到魏國，魏國人恨他從前騙過魏國，不肯收留，把他送回秦國。最後商鞅被秦國抓住處死了。","lesson":{"title":"人走法留","text":"商鞅雖然死了，但他訂的新法，秦國一直沿用下去。靠著這套制度，秦國越來越強，一百多年後統一了天下。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第九章．變法圖強","eps":[9,11,14,16,22,41]},{"key":"h09","line":"history","name":"合縱連橫","short":"戰國中期","era":"西元前 334–308 年","color":"#C8642E","map":{"ground":"#bcc27c","river":"#4f9fd8"},"intro":{"lines":["戰國中期，秦國靠著商鞅變法越來越強，東方的齊、楚、燕、韓、趙、魏都很害怕。","這時出現一群靠口才遊說國君的人，叫做「縱橫家」。","蘇秦主張六國聯合起來抵抗秦國，叫「合縱」；張儀主張各國服從秦國，叫「連橫」。","國君們聽了誰的話，常常就決定了國家的命運！"],"people":[["蘇秦","縱橫家，主張六國合縱抗秦"],["張儀","縱橫家，替秦國推動連橫"],["秦惠王","秦孝公的兒子，第一位稱王的秦國國君"],["齊威王","齊國國君，懂得信任人才"]]},"stops":[{"id":"e07_03","yr":"約西元前 334 年","place":"洛陽蘇秦家","scene":"study","music":"night","cast":[["蘇秦",-6.5,1.0],["蘇秦妻",1.6,-1.2],["嫂嫂",2.6,0.2],["父親",0.2,1.2]],"beats":[{"t":"洛陽人蘇秦到秦國遊說，失敗了。錢花光了，衣服也破了，他只好垂頭喪氣地回家。","mv":[["蘇秦",-1.0,0.4]],"fx":[["sad","蘇秦"]]},{"t":"妻子坐在織布機前，連站都不站起來；嫂嫂不肯幫他煮飯；爸媽也不跟他說話。","fx":[["say","蘇秦妻"]]},{"who":"嫂嫂","t":"哼！一事無成還想吃飯？自己煮吧！","mv":[["嫂嫂",7.0,0.4]]},{"who":"蘇秦","t":"妻子不把我當丈夫，嫂嫂不把我當小叔，爸媽不把我當兒子……都是我不夠努力啊！","mv":[["蘇秦妻",7.0,-0.6],["父親",7.2,1.4]],"fx":[["focus","蘇秦"]]},{"t":"當天晚上，蘇秦搬出幾十箱書，找到一部兵書，趴在桌上苦讀。","mv":[["蘇秦",-1.0,-1.6]]},{"t":"讀到想睡覺時，他就拿錐子扎一下自己的大腿。","fx":[["upset","蘇秦"]]},{"who":"蘇秦","t":"哎喲！醒了！繼續讀！","fx":[["say","蘇秦"]]}],"q":"漢朝有個叫孫敬的人，讀書怕打瞌睡，就用繩子把頭髮綁在屋梁上。後人把他和蘇秦「用錐子扎大腿」的故事合起來，形容刻苦讀書。是哪個成語？","wrong":[{"w":"不學無術","by":"嫂嫂","line":"不學無術是不讀書、沒本事。我以前是這樣看他啦……可是他現在拚命讀書呢！"},{"w":"一曝十寒","by":"蘇秦","line":"一曝十寒是讀一天、玩十天。我可是每天晚上都在拚命讀！"},{"w":"廢寢忘食","by":"蘇秦妻","line":"廢寢忘食是忙到忘了睡覺吃飯，意思很接近！不過「頭髮綁屋梁、錐子扎大腿」，有一個專門的成語。"}],"hint":"一個人把頭髮綁在「梁」上，一個人扎自己的「股」（大腿）。","after":"小提醒：孫敬是漢朝人，比蘇秦晚了好幾百年，是後人把兩個故事放在一起。學古人的決心就好，千萬不要傷害自己喔！","lesson":{"title":"縱橫家","text":"蘇秦苦讀了一年，研究各國的情勢，覺得自己可以去說服國君了。像他這樣靠口才和計謀遊說各國的人，叫做「縱橫家」。","next":"後來，蘇秦終於成功了。有一天，他帶著大批車馬，路過家鄉洛陽……"}},{"id":"e14_02","yr":"約西元前 333 年","place":"洛陽城外","scene":"road","music":"palace","cast":[["蘇秦",6.5,0.4],["隨從",7.4,1.4],["父親",-1.4,-0.4],["母親",-0.4,-1.0],["蘇秦妻",0.6,-1.4],["嫂嫂",-1.6,0.8]],"beats":[{"t":"蘇秦說服趙王聯合各國抵抗秦國，當上了大官。這次他要去楚國，正好路過家鄉洛陽。","fx":[["prop","cart",4.8,0.2,0]]},{"t":"爸媽聽說了，趕快把家裡打掃乾淨、鋪好道路，準備音樂和酒菜，跑到城外三十里迎接。","fx":[["cheer","父親"],["cheer","母親"]]},{"t":"蘇秦的車隊到了。","mv":[["蘇秦",1.6,0.2],["隨從",2.6,1.0]]},{"t":"妻子不敢正眼看他，只敢在旁邊偷偷聽；嫂嫂竟然趴在地上爬過來，跪著拜了又拜。","mv":[["嫂嫂",0.4,0.6]],"fx":[["sad","蘇秦妻"],["sad","嫂嫂"]]},{"who":"嫂嫂","t":"小叔，以前是嫂嫂不對，請原諒我！"},{"who":"蘇秦","t":"嫂嫂，您以前連飯都不幫我煮，現在怎麼這麼恭敬呢？","fx":[["focus","蘇秦"]]}],"q":"嫂嫂以前看不起蘇秦，現在卻跪著拜他。這種「先前傲慢、後來恭敬」，對人的態度前後完全不同，叫做什麼？","wrong":[{"w":"前仆後繼","by":"隨從","line":"前仆後繼是前面的人倒下、後面的人接著衝，形容勇往直前。跟嫂嫂的態度沒關係啦！"},{"w":"相敬如賓","by":"蘇秦妻","line":"相敬如賓是夫妻互相尊重、像對待客人。我們家之前……可不是這樣。"},{"w":"判若兩人","by":"蘇秦","line":"判若兩人是前後像兩個不同的人，意思很接近！不過專門說「先傲慢、後恭敬」的，有一個更貼切的成語。"}],"hint":"「倨」讀ㄐㄩˋ，是傲慢的意思。","after":"嫂嫂回答：「因為小叔現在官大、錢又多呀！」蘇秦感嘆：窮的時候連爸媽都不把你當兒子，富貴了親戚都怕你。","lesson":{"title":"合縱抗秦","text":"《史記》說，蘇秦說服六國聯合抵抗秦國，一個人掛著六國的相印。不過現代學者研究出土的資料，認為蘇秦活躍的年代可能比較晚，有些故事被誇大了。","next":"可是，蘇秦當初為什麼會在秦國碰釘子呢？讓我們把時間倒回幾年前……"}},{"id":"e40_01","yr":"約西元前 336 年（倒敘）","place":"秦國宮廷","scene":"palace","music":"palace","cast":[["秦惠王",1.4,-0.4],["蘇秦",-6.5,1.0],["大臣",2.8,0.8]],"beats":[{"t":"時間倒回幾年前。秦孝公過世，兒子秦惠王即位，剛剛處死了商鞅。"},{"t":"年輕的蘇秦來到秦國，想說服秦王採用他的計畫。","mv":[["蘇秦",-1.0,0.4]]},{"who":"蘇秦","t":"大王的國家土地肥沃、百姓富足，戰車上萬輛、勇士上百萬，可以吞併諸侯、統一天下、稱帝啊！","fx":[["say","蘇秦"]]},{"who":"大臣","t":"說得好大聲……大王會答應嗎？","fx":[["focus","秦惠王"]]},{"t":"秦惠王想了想，慢慢搖了搖頭。"},{"who":"秦惠王","t":"我聽說，鳥的羽毛還沒長滿，就不能飛得高；國家的法令制度還沒完備，就不能去討伐別人。"}],"q":"秦惠王用「羽毛還沒長滿的鳥飛不高」來比喻秦國還沒準備好。後來用哪個成語，比喻力量還不夠、不能急著行動？","wrong":[{"w":"如虎添翼","by":"蘇秦","line":"如虎添翼是老虎長了翅膀，變得更強。大王說的是自己還不夠強啊！"},{"w":"遠走高飛","by":"大臣","line":"遠走高飛是跑到很遠的地方去。大王說的是鳥還飛不起來！"},{"w":"乳臭未乾","by":"秦惠王","line":"乳臭未乾是笑人年紀小、不懂事，有點接近。不過我說的是力量還沒準備好，用鳥的羽毛來比喻，有專門的成語。"}],"hint":"鳥的什麼還沒長「豐」滿？","after":"蘇秦又上了十次奏書，秦王都沒有採用。錢花光、衣服破了，他只好回家——接著就是刺股苦讀的故事。","lesson":{"title":"秦惠王","text":"秦惠王剛殺了商鞅，不太喜歡能言善道的遊說者。不過他後來成為第一位稱「王」的秦國國君，並重用另一位縱橫家——張儀。","next":"秦國越來越強，連東方的大國齊國，也被秦軍攻打……"}},{"id":"e40_02","yr":"約西元前 320 年","place":"齊國朝廷","scene":"office","music":"palace","cast":[["齊威王",0.2,-0.8],["大臣",2.2,0.8],["大臣",-1.6,0.6],["傳令兵",7.0,1.2]],"beats":[{"t":"秦國向韓、魏借路，派兵攻打齊國。齊威王派大將章子帶兵迎戰。"},{"t":"章子讓一部分齊兵換上秦軍的旗號，偷偷混進秦軍裡，等待機會。"},{"who":"傳令兵","t":"報告大王！章子帶著齊軍投降秦國了！","mv":[["傳令兵",1.6,1.4]],"fx":[["upset","大臣"],["upset","大臣#2"]]},{"t":"齊威王聽了，卻一句話也不回。傳令兵又來報告了兩次，說的都一樣。","fx":[["focus","齊威王"]]},{"who":"大臣","t":"大王，來報告的人雖然不一樣，說的話卻一模一樣！為什麼不派兵攻打章子？","fx":[["say","大臣"]]},{"who":"齊威王","t":"他絕對不會背叛我，我為什麼要打他？"}],"q":"大臣說：「報告的人不一樣，說的話卻完全相同。」這種很多人說出同樣的話、看法一致，叫做什麼？","wrong":[{"w":"七嘴八舌","by":"傳令兵","line":"七嘴八舌是大家搶著說、亂成一團，說法還各不相同。剛好相反喔！"},{"w":"自言自語","by":"大臣#2","line":"自言自語是自己跟自己說話。這次可是好多人都這樣說！"},{"w":"眾口一詞","by":"齊威王","line":"眾口一詞也是大家說法一樣，意思很接近！不過原文「不同的人說相同的話」，後來演變成另一個成語。"}],"hint":"「異」是不同，「同」是相同；說話要用什麼？","after":"不久傳來捷報：齊軍大勝，秦軍大敗！齊威王說：「章子連過世的父親都不肯欺騙，怎麼會欺騙我呢？」","lesson":{"title":"用人不疑","text":"秦王打了敗仗，只好派人向齊國道歉。齊威王不被眾人的話動搖，信任自己了解的人，打了一場漂亮的勝仗。原文作「異人而同辭」。","next":"另一邊，張儀當上秦國的宰相，開始遊說各國服從秦國……"}},{"id":"e14_04","yr":"約西元前 317 年","place":"魏國王宮","scene":"palace","music":"palace","cast":[["魏王",1.4,-0.4],["張儀",-6.5,1.0],["大臣",2.8,0.8]],"beats":[{"t":"張儀替秦國推動「連橫」，來到魏國，想說服魏王離開六國聯盟。","mv":[["張儀",-1.0,0.4]]},{"who":"張儀","t":"大王，魏國四周都是平地，沒有高山大河可以防守。","fx":[["say","張儀"]]},{"who":"張儀","t":"您跟楚國好，齊國就打您東邊；跟齊國好，趙國就打北邊；不跟韓國好，韓國就打西邊……"},{"who":"魏王","t":"這……這樣魏國不就四面受敵了嗎？","fx":[["upset","魏王"]]},{"t":"魏王越聽越擔心，好幾個晚上都睡不著覺。","fx":[["sad","魏王"]]},{"who":"張儀","t":"所以，不如服從秦國！有秦國當靠山，楚國、韓國就不敢動您了。","fx":[["focus","張儀"]]}],"q":"張儀說：「沒有楚國、韓國的威脅，大王就能墊高枕頭安心睡覺，國家也不必擔心了。」用哪個成語形容平安無事、不用擔憂？","wrong":[{"w":"坐立不安","by":"魏王","line":"坐立不安是坐也不是、站也不是，那是我現在的樣子啊！"},{"w":"枕戈待旦","by":"大臣","line":"枕戈待旦是枕著兵器等天亮、隨時準備作戰，跟安心睡覺剛好相反！"},{"w":"無憂無慮","by":"張儀","line":"無憂無慮是沒有煩惱，意思很接近！不過我說的是「墊高枕頭睡覺」，有一個專門的成語。"}],"hint":"「枕」是枕頭；墊高了，睡得安穩。","after":"魏王聽了張儀的話，退出六國的聯盟，和秦國交好。","lesson":{"title":"連橫破合縱","text":"張儀用「連橫」一個一個拉攏各國服從秦國，打破六國聯合。可是東方各國不再團結以後，反而更容易被秦國一一吞併。","next":"這時的齊國，齊宣王很喜歡招攬讀書人，卻遇到一位不肯當官的隱士……"}},{"id":"e14_05","yr":"約西元前 315 年","place":"齊國宮廷","scene":"palace","music":"palace","cast":[["齊宣王",1.4,-0.4],["顏斶",-6.5,1.0],["大臣",2.8,0.8],["大臣",-0.4,-1.4]],"beats":[{"t":"齊宣王召見隱士顏斶。顏斶走進宮殿，在離國王很遠的地方停下來。","mv":[["顏斶",-1.2,0.6]]},{"who":"齊宣王","t":"顏斶，上前來！"},{"who":"顏斶","t":"大王，您上前來！","fx":[["upset","大臣"],["upset","大臣#2"]]},{"who":"顏斶","t":"我走上前，是巴結權勢；大王走上前，是尊重人才。與其讓我巴結，不如讓大王尊重人才。","fx":[["focus","顏斶"]]},{"t":"顏斶又說了一番「讀書人比國王更尊貴」的道理，齊宣王聽完，被說服了。"},{"who":"齊宣王","t":"請收我當學生吧！跟著我，每餐都有大魚大肉，出門坐馬車，家人都穿漂亮衣服！","fx":[["cheer","齊宣王"]]},{"who":"顏斶","t":"謝謝大王，但我只想回家。肚子餓了才吃，粗茶淡飯也像肉一樣香……","fx":[["say","顏斶"]]}],"q":"顏斶接著說：「慢慢走路，就當作坐車。」這種不要排場、生活簡單又自在的態度，變成哪個成語？","wrong":[{"w":"前呼後擁","by":"齊宣王","line":"前呼後擁是前後一大群人跟著，那是我出門的排場！顏斶可不要這些。"},{"w":"車水馬龍","by":"大臣","line":"車水馬龍是街上車馬很多、非常熱鬧。他說的是不坐車，慢慢走路啊！"},{"w":"安貧樂道","by":"顏斶","line":"安貧樂道是生活清苦卻快樂地堅守理想，意思很接近！不過「慢慢走路當作坐車」，有一個專門的成語。"}],"hint":"「安步」是慢慢走，「當」是當作。","after":"說完，顏斶拜了兩拜，就告辭回家了。","lesson":{"title":"稷下學宮","text":"齊國在都城臨淄的稷門旁設立「稷下學宮」，招來各國學者自由辯論，到了齊宣王時最熱鬧。孟子也曾到齊國，和齊宣王談論治國的道理。","next":"這時候，齊國和楚國打起仗來，西邊的秦惠王想趁機撈好處……"}},{"id":"e14_07","yr":"約西元前 312 年","place":"秦國宮廷","scene":"office","music":"palace","cast":[["秦惠王",0.2,-0.8],["陳軫",-6.5,1.0],["大臣",2.4,0.8]],"beats":[{"t":"齊國和楚國打起仗來了。秦惠王想：要不要出兵？要幫哪一邊呢？","fx":[["focus","秦惠王"]]},{"who":"秦惠王","t":"陳軫，你覺得秦國該怎麼做？","mv":[["陳軫",-1.0,0.6]]},{"who":"陳軫","t":"大王聽過管莊子打老虎的故事嗎？","fx":[["say","陳軫"]]},{"t":"從前有兩隻老虎為了搶獵物打起來，管莊子想衝上去刺老虎，卻被管與攔住了。"},{"who":"陳軫","t":"管與說：老虎打到最後，小的會死，大的會受傷。等那時再去刺受傷的老虎，就能一次得到兩隻老虎！"},{"who":"陳軫","t":"現在齊楚交戰，一定有一方會輸。等打完了，大王再出兵去救輸的一方……","fx":[["cheer","大臣"]]}],"q":"陳軫說：這樣秦國有救齊國的好處，又沒有攻打楚國的壞處；只花一份力氣，就有兩份收穫。這種做一件事得到兩種好處，叫做什麼？","wrong":[{"w":"兩敗俱傷","by":"秦惠王","line":"兩敗俱傷是兩邊都受傷——那是齊國和楚國的下場，不是秦國的！"},{"w":"一事無成","by":"陳軫","line":"一事無成是什麼都沒做成。我的計策可是好處一次拿兩份！"},{"w":"一箭雙鵰","by":"大臣","line":"一箭雙鵰是射一箭得到兩隻鵰，意思很接近！不過原文說的是「一舉而兼兩虎」，有更貼切的成語。"}],"hint":"「舉」是一次行動；一次行動，得到幾樣好處？","after":"秦惠王聽了，覺得很有道理，決定先在旁邊觀望，等待最好的時機。","lesson":{"title":"坐收漁利","text":"這種「等別人打得兩敗俱傷，自己再出來收好處」的想法，和「鷸蚌相爭，漁翁得利」很像。戰國時代，秦國常用這種策略，讓東方各國互相消耗。","next":"秦惠王過世後，兒子秦武王即位。他派大將甘茂，去攻打韓國的大城宜陽……"}},{"id":"e15_06","yr":"西元前 308 年","place":"秦國息壤","scene":"palace","music":"palace","cast":[["秦武王",1.4,-0.4],["甘茂",-6.5,1.0],["大臣",2.8,0.8]],"beats":[{"t":"秦武王想打通往東方的道路，派甘茂去攻打韓國的大城宜陽。甘茂出發前，特地來見秦王。","mv":[["甘茂",-1.0,0.4]]},{"who":"甘茂","t":"宜陽很難打，要打很久。我是從外國來的臣子，朝中一定有人會在大王面前說我壞話。","fx":[["focus","甘茂"]]},{"who":"甘茂","t":"從前，費這個地方有個人，和孔子的學生曾參同名，他殺了人。有人跑去告訴曾參的媽媽：「你兒子殺人了！」"},{"who":"甘茂","t":"曾參的媽媽說：「我兒子不會殺人。」照樣織布。不久，第二個人又來這麼說，她還是照樣織布。"},{"who":"甘茂","t":"第三個人又來說，曾參的媽媽終於害怕了，丟下梭子，翻牆逃走。","fx":[["upset","大臣"]]},{"who":"甘茂","t":"曾參那麼賢能，媽媽那麼信任他，三個人一說，連媽媽都懷疑了。我比不上曾參，大王對我的信任也比不上曾參的媽媽啊……","fx":[["sad","甘茂"]]}],"q":"甘茂用這個故事提醒秦武王：謠言說多了，連最親的人都會相信。這個故事變成哪個成語？","wrong":[{"w":"殺雞儆猴","by":"秦武王","line":"殺雞儆猴是處罰一個人來警告別人。甘茂說的是謠言的可怕啊！"},{"w":"一言九鼎","by":"大臣","line":"一言九鼎是一句話分量很重。可是甘茂擔心的是好多句謠言！"},{"w":"三人成虎","by":"甘茂","line":"三人成虎也是謠言說多了就有人相信，意思很接近！不過我講的是曾參媽媽的故事，有一個專門的成語。"}],"hint":"故事的主角是誰？大家都說他做了什麼事？","after":"秦武王說：「我絕對不聽別人的閒話，我跟你立下誓言！」兩人就在息壤訂下盟約。","lesson":{"title":"息壤之盟","text":"甘茂攻打宜陽五個月都打不下來，果然有大臣說他壞話，秦武王動搖了。甘茂只說：「息壤還在那裡呢！」武王想起誓言，加派軍隊，甘茂終於攻下宜陽。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十章．合縱連橫","eps":[7,14,15,40]},{"key":"h10","line":"history","name":"將相同心","short":"戰國時代","era":"西元前 283–270 年","color":"#7B5CB8","map":{"ground":"#b2c27a","river":"#4f9fd8"},"intro":{"lines":["戰國時代，七個大國互相攻打，西邊的秦國越來越強，常常欺負東方各國。","北方的趙國有大將軍廉頗，又出了一位勇敢機智的藺相如，讓秦國不敢小看。","南方的楚國卻連吃敗仗，忠心的詩人屈原被趕出都城。","秦國這邊，大將白起四處打勝仗，秦昭王又找來謀士范雎，定下「遠交近攻」的計畫。"],"people":[["藺相如","趙國上卿，完璧歸趙"],["廉頗","趙國大將軍，勇敢認錯"],["屈原","楚國詩人，端午節紀念他"],["范雎","秦國謀士，提出遠交近攻"]]},"stops":[{"id":"e15_02","yr":"西元前 283 年","place":"趙國王宮（邯鄲）","scene":"palace","music":"palace","cast":[["趙惠文王",1.2,0.4],["廉頗",2.8,1.4],["繆賢",-0.6,-1.2],["秦使",6.8,1.2],["藺相如",7.2,0.2,0,null,1]],"beats":[{"t":"戰國時代，秦國越來越強。趙國的趙惠文王得到一塊楚國來的寶玉，叫做「和氏璧」。","fx":[["cheer","趙惠文王"]]},{"t":"秦昭王聽說了，派使者送信來。","mv":[["秦使",0.2,1.2]]},{"who":"秦使","t":"我們大王願意拿十五座城，來換這塊和氏璧！","fx":[["say","秦使"]]},{"t":"趙王和大將軍廉頗商量。給了，怕秦國的城拿不到，白白被騙；不給，又怕秦兵打過來。","mv":[["秦使",7,1.2]],"fx":[["upset","趙惠文王"]]},{"who":"廉頗","t":"秦國說話不算話，可是硬拒絕也很危險啊……","fx":[["sad","廉頗"]]},{"t":"宦官的首領繆賢推薦說：「我的門客藺相如，又勇敢又有智慧，可以派他去。」","mv":[["藺相如",-0.4,0.8]]},{"who":"趙惠文王","t":"一塊璧，竟然能換十五座城……","fx":[["focus","趙惠文王"]]}],"q":"秦王願意拿十五座城來換一塊和氏璧，可見這塊玉珍貴得抵得上好幾座城池。這可以用哪個成語形容？","wrong":[{"w":"一文不值","by":"秦使","line":"一文不值是一點價錢都沒有。我們大王可是要拿十五座城來換呢！"},{"w":"物美價廉","by":"趙惠文王","line":"物美價廉是東西好又便宜。十五座城，哪裡便宜了？"},{"w":"無價之寶","by":"廉頗","line":"無價之寶也是說非常珍貴，意思很接近！不過這塊璧的價錢，是用「城」來算的。"}],"hint":"秦王要拿什麼來換？一座接一座……","after":"藺相如說：「秦國拿城來換，趙國不答應，是趙國理虧。如果城不給趙國，我一定把璧完完整整帶回來！」","lesson":{"title":"完璧歸趙","text":"藺相如到了秦國，發現秦王根本不想給城，就機智地把璧要回來，偷偷派人送回趙國，這就是「完璧歸趙」。後來他又陪趙王參加澠池之會，保住了趙國的面子。","next":"趙國有了藺相如，秦國一時占不到便宜。不過秦國還有一位很會打仗的大將——白起……"}},{"id":"e15_08","yr":"約西元前 281 年","place":"秦軍營帳","scene":"tent","music":"battle","cast":[["白起",1.2,0.2],["蘇厲",-6.8,1.0],["秦兵",3.0,-1.2],["秦兵",3.6,0.6]],"beats":[{"t":"秦國大將白起打敗了韓國和魏國，又攻下趙國好幾座城，幾乎每戰必勝。","fx":[["cheerAll","秦兵"]]},{"who":"白起","t":"下一站，攻打魏國的都城大梁！","fx":[["cheer","白起"]]},{"t":"小小的周王室就在旁邊，周君很擔心被捲進戰火。策士蘇厲替周君想辦法，去見白起。","mv":[["蘇厲",-0.6,0.8]]},{"who":"蘇厲","t":"將軍聽過楚國的養由基嗎？他離柳葉一百步射箭，百發百中，大家都叫好。","fx":[["say","蘇厲"]]},{"who":"蘇厲","t":"有個人卻說：「一直射不休息，等一下手痠了、弓歪了、箭彎了，只要一箭沒射中……」"},{"who":"蘇厲","t":"將軍打了這麼多勝仗，如果這一次攻不下來呢？","fx":[["focus","白起"]]}],"q":"蘇厲說：射了一百箭都中，只要最後一箭射歪，以前的功勞就全部白費了。這叫做什麼？","wrong":[{"w":"一舉兩得","by":"白起","line":"一舉兩得是做一件事得到兩個好處。他是在說我會把功勞全丟光啊！"},{"w":"百發百中","by":"蘇厲","line":"百發百中是養由基原本的本事。我想說的是：只要一箭沒中，前面全都白費。"},{"w":"功虧一簣","by":"蘇厲","line":"功虧一簣是只差最後一點沒完成，意思很接近！不過我強調的是「以前的功勞全部丟掉」。"}],"hint":"以前的功勞，全部……丟掉了。","after":"蘇厲勸白起：「您不如說自己生病，先不要出兵。」史書沒有寫白起有沒有聽進去。","lesson":{"title":"戰國策士","text":"蘇厲是蘇秦的弟弟。戰國時代有許多像他這樣的「策士」，靠一張嘴到各國遊說，用小故事讓國君和將軍改變主意。這些故事很多都記在《戰國策》裡。","next":"回到趙國，藺相如立了大功，官位升得比大將軍廉頗還高。廉頗心裡很不服氣……"}},{"id":"e10_03","yr":"西元前 279 年","place":"邯鄲街道","scene":"road","music":"palace","cast":[["藺相如",0.6,0.2],["門客",2.0,1.2],["廉頗",7.0,0.6],["門客",-0.8,1.4]],"beats":[{"t":"澠池之會後，趙王封藺相如當上卿，地位比大將軍廉頗還高。","fx":[["prop","cart",1.6,-0.9,0]]},{"who":"廉頗","t":"我攻城打仗立了多少大功！他只靠一張嘴，出身又低，我才不甘心在他底下。見到他，我一定要讓他難堪！","fx":[["upset","廉頗"]]},{"t":"藺相如聽說了，常常說自己生病不上朝。有一天出門，遠遠看見廉頗，趕快叫車子轉進小巷躲開。","mv":[["廉頗",4.2,0.4],["藺相如",-1.2,-0.8]]},{"who":"門客","t":"我們跟隨您，是敬佩您。您卻這麼怕廉將軍，我們覺得好丟臉，想告辭了！","fx":[["sadAll","門客"]]},{"who":"藺相如","t":"我連秦王都敢當面頂撞，怎麼會怕廉將軍？秦國不敢打趙國，就是因為有我們兩個人在。","fx":[["say","藺相如"]]},{"who":"藺相如","t":"兩隻老虎打起來，一定有一隻會受傷。我先顧國家的急難，再管私人的恩怨。","mv":[["廉頗",7.2,0.6]]},{"t":"這些話傳到廉頗耳裡。他脫去上衣，背上有刺的荊條，來到藺相如家門口。","mv":[["廉頗",2.4,0.6]],"fx":[["focus","廉頗"]]}],"q":"廉頗脫去上衣、背著有刺的荊條，親自上門認錯，表示甘願被打、請對方原諒。這叫做什麼？","wrong":[{"w":"興師問罪","by":"廉頗","line":"興師問罪是帶人去找別人算帳。我這次是來認錯的，不是來吵架的！"},{"w":"得意忘形","by":"門客","line":"得意忘形是高興得忘了自己是誰。廉將軍現在可是慚愧得很。"},{"w":"痛改前非","by":"藺相如","line":"痛改前非是徹底改掉以前的錯，意思有點接近！不過廉將軍是背著荊條、親自上門誠心道歉。"}],"hint":"廉頗背上背的是什麼？他來做什麼？","after":"藺相如趕快跑出來，把廉頗扶了起來。","lesson":{"title":"荊條的意思","text":"「荊」是一種帶刺的樹枝，古代可以拿來打人。背著荊條上門，意思是「我錯了，請你用它打我吧」。廉頗是大將軍，願意這樣低頭，非常不容易。","next":"藺相如扶起廉頗，兩個人終於把話說開了……"}},{"id":"e10_04","yr":"西元前 279 年","place":"藺相如家","scene":"house","music":"palace","cast":[["藺相如",0.4,0.2],["廉頗",1.8,0.4],["門客",-1.0,-1.0],["門客",3.0,-0.8]],"beats":[{"t":"廉頗背著荊條跪在門口，藺相如連忙把他扶起來。","fx":[["focus","廉頗"]]},{"who":"廉頗","t":"我是個粗人，不知道您的心胸這麼寬大！","fx":[["sad","廉頗"]]},{"who":"藺相如","t":"將軍快請起！我們都是為了趙國啊。","fx":[["say","藺相如"]]},{"t":"兩個人越聊越開心，從此成了最要好的朋友。","fx":[["cheer","廉頗"],["cheer","藺相如"]]},{"who":"廉頗","t":"以後誰要對你不利，我廉頗第一個不答應！就算為你犧牲性命也願意！"},{"who":"藺相如","t":"我也一樣！","fx":[["cheerAll","門客"]]}],"q":"史書說，廉頗和藺相如從此成了願意為對方犧牲性命、同生共死的朋友。這種交情最深的朋友，叫做什麼？","wrong":[{"w":"一面之交","by":"門客","line":"一面之交是只見過一次面。他們兩位天天在朝廷見面，交情可深了！"},{"w":"反目成仇","by":"廉頗","line":"反目成仇是好朋友變仇人。我們剛好相反，是從不服氣變成好兄弟！"},{"w":"莫逆之交","by":"藺相如","line":"莫逆之交是心意相通的好朋友，意思很接近！不過我們可是願意為對方犧牲性命呢。"}],"hint":"「刎頸」是什麼意思？願意為朋友做到什麼程度？","after":"將軍和丞相同心協力，趙國上下更團結了。","lesson":{"title":"將相和","text":"這個故事後來被編成京劇《將相和》。廉頗、藺相如，再加上名將趙奢，讓趙國成為東方最能對抗秦國的國家。","next":"同一個時候，南方的楚國卻被秦國打得節節敗退。楚國有一位詩人，被趕出了都城……"}},{"id":"e58_02","yr":"約西元前 278 年","place":"楚國江邊","scene":"river","music":"night","cast":[["屈原",0.4,0.4],["漁父",6.8,1.0]],"beats":[{"t":"屈原是楚國的三閭大夫。他勸楚王聯合齊國對抗秦國，卻被小人說壞話，楚王把他趕出了都城。","fx":[["sad","屈原"]]},{"t":"屈原披著頭髮，在江邊一邊走一邊吟詩，臉色憔悴，身體也變得很瘦。","mv":[["屈原",-0.8,-0.2]]},{"t":"一位捕魚的老人划著船靠岸。","mv":[["漁父",1.6,0.6]]},{"who":"漁父","t":"您不是三閭大夫嗎？怎麼會到這裡來？"},{"who":"屈原","t":"全世界都混濁，只有我清白；大家都喝醉了，只有我清醒，所以被趕出來了。","fx":[["say","屈原"]]},{"who":"漁父","t":"聰明人不會太死板，會跟著世道改變。大家都混濁，您何不跟著水流，一起揚起波浪呢？","fx":[["focus","漁父"]]}],"q":"漁父勸屈原「跟著水流、揚起波浪」，也就是沒有自己的主見，大家怎麼做就跟著做。這叫做什麼？","wrong":[{"w":"力爭上游","by":"屈原","line":"力爭上游是努力往前、追求進步。他勸我的可是往下漂啊。"},{"w":"中流砥柱","by":"漁父","line":"中流砥柱是在急流中站得穩穩的大石頭，比喻堅定不動搖。那是屈大夫的樣子，不是我勸的！"},{"w":"人云亦云","by":"屈原","line":"人云亦云是別人說什麼就跟著說，意思很接近！不過他勸我的是跟著「水波和水流」走。"}],"hint":"「波」和「流」都跟水有關。順著它們漂……","after":"屈原說：「我怎麼能讓乾乾淨淨的自己，沾上世俗的髒汙呢？」漁父笑一笑，划著船走了。","lesson":{"title":"屈原與端午","text":"屈原寫下〈離騷〉等許多詩篇，是中國最早有名的大詩人。後來他抱著石頭跳進汨羅江。傳說百姓划船去找他、把飯糰丟進江裡，就是端午節划龍舟、吃粽子的由來（這是後人的傳說）。","next":"西元前 278 年，秦將白起攻破了楚國都城。秦國越來越強，北方的魏國也連吃敗仗……"}},{"id":"e14_03","yr":"約西元前 272 年","place":"魏國王宮（大梁）","scene":"palace","music":"palace","cast":[["魏王",1.2,0.4],["段干崇",2.8,1.2],["孫臣",-6.8,1.0],["大臣",-0.4,-1.2]],"beats":[{"t":"魏國和秦國在華陽大戰，魏國打輸了。","fx":[["sad","魏王"]]},{"t":"第二年，魏王準備派段干崇去秦國，割讓土地來講和。","fx":[["focus","段干崇"]]},{"who":"段干崇","t":"大王，只要把土地送給秦國，秦國就不會再來打我們了！"},{"t":"大臣孫臣急忙走進來。","mv":[["孫臣",-0.6,0.8]]},{"who":"孫臣","t":"大王，壞心的臣子都想拿土地去討好秦國。可是大王的土地有用完的一天，秦國的要求卻沒有盡頭！","fx":[["say","孫臣"]]},{"who":"孫臣","t":"這就好像——想撲滅大火，卻抱著一捆捆木柴丟進去。木柴不燒完，火是不會停的！","fx":[["fire",0.6,-2.6],["upset","魏王"]]}],"q":"孫臣說：拿土地討好秦國，就像抱著木柴去救火，只會讓火越燒越大。比喻用錯方法、反而讓災禍更大的成語是哪一個？","wrong":[{"w":"雪中送炭","by":"段干崇","line":"雪中送炭是在別人困難時幫忙。送土地給秦國，可不是在幫魏國啊……"},{"w":"釜底抽薪","by":"孫臣","line":"釜底抽薪是把鍋底的柴抽掉，從根本解決問題，剛好相反！"},{"w":"火上加油","by":"孫臣","line":"火上加油是讓事情更糟，意思很接近！不過我說的是「想救火卻用錯方法」，還特別說到木柴。"}],"hint":"「薪」就是木柴。","after":"魏王覺得孫臣說得有道理，卻說事情已經開始辦，改不了了。魏國還是割了土地給秦國。","lesson":{"title":"六國割地","text":"宋朝的蘇洵寫〈六國論〉，也引用了這句話：六國一次又一次拿土地去討好秦國，秦國越來越強，六國越來越弱，最後全被滅掉。","next":"秦國為什麼能一直打勝仗？因為秦昭王找到了一位很會出主意的謀士——范雎……"}},{"id":"e15_07","yr":"約西元前 270 年","place":"秦國王宮（咸陽）","scene":"palace","music":"palace","cast":[["秦昭王",1.0,0.2],["范雎",-6.8,1.0],["侍衛",2.8,1.2],["侍衛",-0.6,-1.4]],"beats":[{"t":"范雎原本是魏國人，被人冤枉，差點被打死。他改了名字，偷偷逃到秦國。","mv":[["范雎",-0.6,0.8]]},{"t":"秦昭王請范雎進宮，叫旁邊的人都退下，還跪下來向他請教。","mv":[["侍衛",7,1.2],["侍衛#2",7.2,-1.4]],"fx":[["focus","秦昭王"]]},{"who":"秦昭王","t":"先生有什麼好主意，可以教我？"},{"who":"范雎","t":"大王越過韓國、魏國去打遠方的齊國，是錯的！派兵少，傷不了齊國；派兵多，反而傷了秦國自己。","fx":[["say","范雎"]]},{"who":"范雎","t":"就算打贏了，那塊土地隔著別人的國家，也守不住。不如和遠方的國家交朋友，先攻打旁邊的鄰國！"},{"who":"范雎","t":"這樣，得到一寸土地，就是大王的一寸；得到一尺，就是大王的一尺！","fx":[["cheer","秦昭王"]]}],"q":"范雎原本是說：一寸一尺慢慢拿，土地都是秦國的。可是後來這句話演變成形容人貪心，得到一點還想要更多。是哪個成語？","wrong":[{"w":"知足常樂","by":"范雎","line":"知足常樂是懂得滿足就快樂。後來這個成語的意思，剛好相反喔！"},{"w":"一步登天","by":"秦昭王","line":"一步登天是一下子就到最高處。范先生勸我的是一寸一尺、慢慢來。"},{"w":"貪得無厭","by":"范雎","line":"貪得無厭也是貪心不知足，意思很接近！不過我說的話裡，有「寸」也有「尺」。"}],"hint":"拿到一「寸」，又往前要一「尺」。","after":"秦昭王大喜，重用范雎，照著「遠交近攻」的計策，一步步吞下鄰近國家的土地。","lesson":{"title":"遠交近攻","text":"「遠交近攻」就是和遠方的國家交好，專心攻打旁邊的鄰國。秦國一直用這個方法，直到統一天下。范雎的原話是在說「穩紮穩打」，現在這個成語卻多用來批評貪心的人。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十一章．將相同心","eps":[10,14,15,58]},{"key":"h11","line":"history","name":"長平風雲","short":"戰國時代","era":"西元前 270–258 年","color":"#6E62B5","map":{"ground":"#adc07a","river":"#4f9fd8"},"intro":{"lines":["秦國照著范雎「遠交近攻」的計畫，一步步攻打鄰近的韓國、趙國。","西元前 260 年，秦、趙在長平大戰，趙國損失四十多萬士兵，從此再也擋不住秦國。","秦軍接著包圍趙國首都邯鄲，趙國只好向楚國、魏國求救。","這時候，大商人呂不韋在邯鄲遇見了一位落難的秦國王孫，悄悄改變了歷史。"],"people":[["范雎","秦國丞相，提出遠交近攻"],["呂不韋","大商人，後來當上秦國丞相"],["平原君","趙國公子，養了幾千位門客"],["毛遂","平原君的門客，勇敢推薦自己"]]},"stops":[{"id":"e40_04","yr":"約西元前 270 年","place":"秦國王宮（咸陽）","scene":"palace","music":"palace","cast":[["秦昭王",1.0,0.2],["范雎",-0.8,0.8],["侍衛",2.8,1.2],["侍衛",-0.4,-1.4]],"beats":[{"t":"讓我們回到范雎剛到秦國、第一次進宮見秦昭王的那一天。"},{"t":"秦昭王叫旁邊的人都退下，宮裡一個人也沒有。","mv":[["侍衛",7,1.2],["侍衛#2",7.2,-1.4]]},{"who":"秦昭王","t":"先生要教我什麼呢？","fx":[["say","秦昭王"]]},{"who":"范雎","t":"嗯嗯……"},{"t":"秦王一連問了三次，范雎都只回答「嗯嗯」。秦王急了。","fx":[["upset","秦昭王"]]},{"who":"秦昭王","t":"先生到底願不願意教我？"},{"who":"范雎","t":"我不怕死。我只怕我說了真話被害死，天下人看到了，都會閉上嘴巴、包住雙腳，再也沒人肯來秦國。","fx":[["focus","范雎"]]}],"q":"范雎擔心天下的人才因為害怕，停下腳步不敢到秦國來。這種有所顧忌、停下來不敢往前的樣子，叫做什麼？","wrong":[{"w":"勇往直前","by":"秦昭王","line":"勇往直前是勇敢地一直往前衝。范先生擔心的剛好相反啊！"},{"w":"一馬當先","by":"范雎","line":"一馬當先是騎馬衝在最前面。我說的是大家都停下來，不敢走。"},{"w":"畏首畏尾","by":"范雎","line":"畏首畏尾是前怕後怕、膽子小，意思很接近！不過我說的是把腳「包住」，停步不前。"}],"hint":"原文是「杜口裹足」：閉上嘴巴，把腳包起來。","after":"秦昭王說：「不管大事小事，上到太后，下到大臣，先生都可以直說，不要懷疑我！」范雎這才說出他的計畫。","lesson":{"title":"范雎當丞相","text":"范雎後來當上秦國丞相，被封為應侯。秦昭王重用他，秦國開始照著「遠交近攻」，一步一步向東方擴張。","next":"秦國步步進逼，東方各國都很緊張。這時候，齊國派了一位使者，去拜訪趙國的趙威后……"}},{"id":"e14_08","yr":"約西元前 265 年","place":"趙國王宮（邯鄲）","scene":"palace","music":"palace","cast":[["趙威后",1.0,0.2],["齊使",-6.8,1.0],["宮女",2.6,1.2]],"beats":[{"t":"趙惠文王過世了，兒子趙孝成王剛即位，由母親趙威后幫忙處理國事。","fx":[["focus","趙威后"]]},{"t":"齊王派使者帶著書信，來問候趙威后。","mv":[["齊使",-0.6,0.8]]},{"t":"信還沒拆開，趙威后就先問使者：","fx":[["say","趙威后"]]},{"who":"趙威后","t":"今年的收成沒有災害吧？百姓都平安嗎？齊王也好嗎？"},{"who":"齊使","t":"我奉齊王的命令來，您不先問候大王，卻先問收成和百姓，這不是把低賤的放前面、尊貴的放後面嗎？","fx":[["upset","齊使"]]},{"who":"趙威后","t":"不是這樣的。沒有收成，哪來的百姓？沒有百姓，哪來的國君？怎麼能不問根本，只問末梢呢？","fx":[["focus","趙威后"]]}],"q":"趙威后問「歲亦無恙耶？民亦無恙耶？」，「無恙」就是沒有災病、平平安安。後來形容人平安、沒有受到任何損傷的成語是哪一個？","wrong":[{"w":"危在旦夕","by":"宮女","line":"危在旦夕是危險就在眼前。威后問的是大家平不平安呀。"},{"w":"病入膏肓","by":"齊使","line":"病入膏肓是病得很重、救不了。剛好相反喔！"},{"w":"平安無事","by":"趙威后","line":"平安無事也是平平安安，意思很接近！不過我問的那兩個字是「無恙」。"}],"hint":"「恙」念ㄧㄤˋ，是災病的意思。","after":"齊國使者聽了，說不出話來。趙威后接著又問起齊國的賢人過得好不好。","lesson":{"title":"百姓是根本","text":"趙威后認為百姓比國君更根本，和孟子說的「民為貴，社稷次之，君為輕」很像。「無恙」原本是見面問候的話，就像我們說「你好嗎？」。","next":"這時候，邯鄲城裡住著一位秦國的王孫。他是被送來趙國當人質的……"}},{"id":"e16_01","yr":"約西元前 265 年","place":"邯鄲．子楚的住處","scene":"house","music":"night","cast":[["子楚",0.8,-0.2],["呂不韋",-6.8,1.0],["僕人",2.4,0.8]],"beats":[{"t":"呂不韋是一位大商人，到各地便宜買進、高價賣出，家裡累積了千金財富。"},{"t":"秦國王孫子楚被送到趙國當人質。秦、趙常常打仗，趙國對他很冷淡，連車子、錢都不夠用。","fx":[["sad","子楚"]]},{"who":"子楚","t":"唉，我在這裡又窮又沒人理，什麼時候才能回家？"},{"t":"呂不韋到邯鄲做生意，看到了子楚。","mv":[["呂不韋",-0.6,0.8]]},{"t":"呂不韋心想：子楚的父親是秦國太子，將來說不定……他的眼睛亮了起來。","fx":[["focus","呂不韋"],["cheer","呂不韋"]]}],"q":"呂不韋把子楚看成一件稀有的貨物，覺得可以先「囤積」起來，將來一定能賣到好價錢。這叫做什麼？","wrong":[{"w":"棄如敝屣","by":"子楚","line":"棄如敝屣是像丟破鞋一樣丟掉。呂先生可是把我當寶貝呢！"},{"w":"雪中送炭","by":"呂不韋","line":"雪中送炭是單純在別人困難時幫忙。我幫他，可是看中他將來的價值喔！"},{"w":"待價而沽","by":"呂不韋","line":"待價而沽是等好價錢再賣，意思很接近！不過我說的是「稀奇的貨物，可以囤起來」。"}],"hint":"「居」在這裡不是居住，是囤積、存起來。","after":"呂不韋去見子楚，說：「我能讓你的家門變得光大！」子楚笑說：「你先光大自己的家門吧！」呂不韋說：「我的家門，要等你的家門光大了才會光大。」","lesson":{"title":"子楚當上秦王","text":"呂不韋花了很多錢，幫子楚結交秦國太子最寵愛的華陽夫人，讓她收子楚當兒子。後來子楚當上秦王，呂不韋成了丞相。子楚的兒子，就是後來的秦始皇。","next":"西元前 262 年，秦國攻打韓國，韓國的上黨郡被切斷了。上黨的太守馮亭，想出了一個主意……"}},{"id":"e42_02","yr":"西元前 262 年","place":"趙國朝廷（邯鄲）","scene":"office","music":"palace","cast":[["趙孝成王",0.2,-0.6],["上黨使者",-6.8,1.0],["平陽君",2.4,0.8],["平原君",-1.4,0.4]],"beats":[{"t":"秦國攻打韓國，韓國的上黨郡被切斷，眼看守不住了。上黨的太守馮亭派使者來到趙國。","mv":[["上黨使者",0.4,1.2]]},{"who":"上黨使者","t":"上黨的百姓不想歸秦國，願意把十七座城獻給趙國！","fx":[["say","上黨使者"]]},{"who":"平陽君","t":"大王，聰明人最怕無緣無故得到的好處。收下上黨，秦國一定會把怒氣出在趙國身上！","fx":[["upset","平陽君"]]},{"who":"平原君","t":"派百萬大軍打一年，都拿不到一座城。現在不花一兵一卒就有十七座城，這是大好處，快收下！","fx":[["cheer","平原君"]]},{"t":"趙王聽了平原君的話，收下上黨。秦國果然大怒，把大軍轉向趙國。","mv":[["上黨使者",7,1.2]],"fx":[["cheer","趙孝成王"]]}],"q":"後來趙國在長平大敗。司馬遷評論說：平原君貪圖上黨的好處，頭腦變得糊塗，害趙國損失四十多萬士兵。當時的俗話是哪一句？","wrong":[{"w":"見利思義","by":"平陽君","line":"見利思義是看到好處，先想想合不合道理。他要是這樣做就好了！"},{"w":"深謀遠慮","by":"平陽君","line":"深謀遠慮是想得又深又遠。收下上黨，只看到眼前的好處啊。"},{"w":"見錢眼開","by":"平原君","line":"見錢眼開是看到錢就眼睛發亮，比較是在說貪財。我是被好處沖昏了頭，判斷錯誤！"}],"hint":"「令」是「讓」，「昏」是糊塗。是什麼讓人糊塗？","after":"秦國派兵攻打上黨，接著在長平和趙軍展開大戰。","lesson":{"title":"長平之戰","text":"西元前 260 年，趙王改用只會紙上談兵的趙括當大將，結果被秦將白起包圍，四十多萬趙兵沒能回來。司馬遷稱讚平原君是「亂世裡的翩翩公子」，卻也說他「看不清大局」。","next":"長平之戰後，秦國派人來，要趙國割讓六座城才肯講和……"}},{"id":"e40_05","yr":"西元前 259 年","place":"趙國朝廷（邯鄲）","scene":"office","music":"palace","cast":[["趙孝成王",0.2,-0.6],["秦使",-6.8,1.0],["樓緩",2.2,0.8],["虞卿",-1.6,0.4]],"beats":[{"t":"長平之戰，趙國大敗。秦軍退回去後，派使者來了。","mv":[["秦使",0.4,1.2]]},{"who":"秦使","t":"趙國割讓六座城給秦國，我們就講和！","fx":[["say","秦使"]]},{"t":"趙王拿不定主意。剛從秦國回來的大臣樓緩說：","mv":[["秦使",7,1.2]],"fx":[["sad","趙孝成王"]]},{"who":"樓緩","t":"給吧！不然明年秦國又打過來，到時候要割的就更多了。"},{"who":"虞卿","t":"不行！秦國已經打累了，才退回去的。","fx":[["upset","虞卿"]]},{"who":"樓緩","t":"虞卿怎麼知道秦國還剩多少力氣？如果連這麼小一塊地都捨不得給，等秦軍再來，就要割更多的土地了！","fx":[["focus","樓緩"]]}],"q":"樓緩說，六座城只是像彈弓射出的小圓球那麼小的地方。形容地方非常狹小的成語是哪一個？","wrong":[{"w":"地大物博","by":"趙孝成王","line":"地大物博是土地廣大、物產豐富。樓緩可是說那塊地很小呢。"},{"w":"一望無際","by":"虞卿","line":"一望無際是看不到盡頭，大得不得了。剛好相反！"},{"w":"立錐之地","by":"樓緩","line":"立錐之地是只能插一根錐子的小地方，意思很接近！不過我比喻的是彈弓的小圓球。"}],"hint":"「彈」念ㄉㄢˋ，彈弓射出去的小圓球叫做什麼？","after":"趙王聽了樓緩的話，又猶豫起來。他把樓緩的話告訴了虞卿。","lesson":{"title":"割還是不割？","text":"樓緩剛從秦國來，虞卿懷疑他是在替秦國說話。六座城其實一點也不小，「彈丸之地」是樓緩故意把它說得很小。","next":"虞卿再一次進宮，他要提醒趙王一件事……"}},{"id":"e40_06","yr":"西元前 259 年","place":"趙國朝廷（邯鄲）","scene":"office","music":"palace","cast":[["趙孝成王",0.2,-0.6],["虞卿",-1.6,0.4],["樓緩",2.2,0.8]],"beats":[{"t":"其實虞卿一開始就問過趙王一個問題，現在他又提醒趙王。","fx":[["focus","虞卿"]]},{"who":"虞卿","t":"大王，秦軍退回去，是因為打累了？還是還有力氣，只是愛惜大王才不打？"},{"who":"趙孝成王","t":"秦國打我們的時候，把全部力氣都用上了，一點也沒保留。一定是累了才回去的！"},{"who":"虞卿","t":"秦國用盡全力都打不下的地方，大王卻要自己送給它。這不是在幫秦國打自己嗎？","fx":[["say","虞卿"],["upset","趙孝成王"]]},{"who":"虞卿","t":"不如把城送給齊國，聯合齊國一起對付秦國！","fx":[["sad","樓緩"]]}],"q":"趙王說秦國攻打趙國時，把所有力氣都用上，一點也沒有保留。這叫做什麼？","wrong":[{"w":"半途而廢","by":"樓緩","line":"半途而廢是做到一半就放棄。秦國可是打到筋疲力盡才回去的。"},{"w":"手下留情","by":"趙孝成王","line":"手下留情是出手時放對方一馬。秦國一點都沒有放過我們啊！"},{"w":"全力以赴","by":"虞卿","line":"全力以赴是用全部力氣去做，意思很接近！不過大王的原話是「一點力氣也沒有留下」。"}],"hint":"「遺」是留下，「餘力」是剩下的力氣。","after":"趙王決定不割城給秦國，派虞卿往東去見齊王。虞卿還沒回來，秦國就派使者來商量了。樓緩聽到消息，趕緊逃走。","lesson":{"title":"用在好的地方","text":"這個成語原本是說秦國拚命攻打趙國，現在多用在好的方面，例如「志工不遺餘力地幫助災民」。","next":"可是秦國沒有放棄。不久，秦軍包圍了趙國的首都邯鄲……"}},{"id":"e12_01","yr":"西元前 258 年","place":"平原君府（邯鄲）","scene":"office","music":"battle","cast":[["平原君",0.2,-0.4],["門客",2.2,0.8],["門客",2.8,-0.6],["毛遂",6.8,1.2]],"beats":[{"t":"秦軍把邯鄲團團圍住。趙王派平原君到楚國求救，請楚國一起聯合對抗秦國。"},{"who":"平原君","t":"我要從門客中挑二十位文武雙全的人，跟我一起去楚國！","fx":[["say","平原君"]]},{"t":"挑來挑去，只挑到十九個人，剩下的都不夠好。","fx":[["sad","平原君"]]},{"t":"這時候，一位叫毛遂的門客走上前來。","mv":[["毛遂",1.4,1.0]],"fx":[["focus","毛遂"]]},{"who":"毛遂","t":"聽說您還少一個人，請帶我毛遂一起去吧！"},{"who":"平原君","t":"先生在我門下幾年了？","fx":[["upset","平原君"]]},{"who":"毛遂","t":"三年了。","fx":[["cheerAll","門客"]]}],"q":"毛遂主動走上前，推薦自己加入隊伍。後來形容自告奮勇、主動推薦自己的成語是哪一個？","wrong":[{"w":"自暴自棄","by":"門客","line":"自暴自棄是放棄自己。他可是很有信心地站出來呢！"},{"w":"推三阻四","by":"平原君","line":"推三阻四是找各種理由推託。他一點都不推託，還搶著要去。"},{"w":"自告奮勇","by":"毛遂","line":"自告奮勇也是主動要做事，意思很接近！不過這個成語用的，正是我的名字。"}],"hint":"這個成語的前兩個字，就是他的名字。","after":"平原君說：「有才能的人就像袋子裡的錐子，尖端馬上會露出來。先生來三年，我都沒聽人稱讚過你啊！」","lesson":{"title":"錐子與袋子","text":"平原君家有好幾千位門客。毛遂回答：「我今天就是請求進袋子裡。如果早一點讓我進去，整支錐子都會穿出來！」平原君終於答應帶他去。旁邊十九個人互相使眼色，偷偷笑他。","next":"毛遂到了楚國，真的能讓整支錐子穿出袋子嗎？"}},{"id":"e15_04","yr":"西元前 258 年","place":"楚國王宮（陳）","scene":"palace","music":"palace","cast":[["楚王",1.4,-0.4],["平原君",-0.8,0.4],["毛遂",0.2,1.6],["門客",2.0,1.8],["楚臣",3.0,0.4]],"beats":[{"t":"平原君到了楚國，和楚王談聯合抗秦，從太陽出來談到中午，還是沒有結果。","fx":[["sad","平原君"]]},{"who":"門客","t":"毛先生，您上去吧！"},{"t":"毛遂手按著劍，一步一步走上臺階。","mv":[["毛遂",0.6,0.0]],"fx":[["focus","毛遂"]]},{"who":"楚王","t":"這是什麼人？我跟你主人說話，你來做什麼？下去！","fx":[["upset","楚王"]]},{"who":"毛遂","t":"楚國土地五千里，卻被秦將白起打敗，連祖先的陵墓都被燒了，這是楚國百世的仇恨，連趙國都替您覺得羞恥！","fx":[["say","毛遂"]]},{"who":"毛遂","t":"聯合抗秦，是為了楚國，不是為了趙國啊！"},{"who":"楚王","t":"是是是，真的像先生說的，我願意帶著整個國家跟你們聯合！","fx":[["cheer","平原君"]]}],"q":"毛遂說過：讓他進袋子，整支錐子都會穿出來，不只是露出尖端。現在他的才能果然完全顯露出來。這叫做什麼？","wrong":[{"w":"默默無聞","by":"門客","line":"默默無聞是沒沒無名、沒人知道。這次之後，大家都知道毛先生了！"},{"w":"畫蛇添足","by":"楚臣","line":"畫蛇添足是做多餘的事。毛先生說的每句話都說到重點了。"},{"w":"嶄露頭角","by":"平原君","line":"嶄露頭角是剛開始露出一點才能，意思很接近！不過毛先生不是只露出尖端，是整支錐子都穿出來了。"}],"hint":"「穎」是錐子的尖端。整支錐子穿出了袋子……","after":"楚王和趙國訂下盟約，答應出兵救趙。那十九個偷笑過毛遂的門客，這下都佩服得不得了。","lesson":{"title":"楚國出兵","text":"楚王派春申君帶兵去救趙國。毛遂靠著勇氣和口才，在一場大危機裡幫了趙國大忙。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十二章．長平風雲","eps":[12,14,15,16,40,42]},{"key":"h12","line":"history","name":"救趙與刺秦","short":"戰國末年","era":"西元前 258–227 年","color":"#5C5AA8","map":{"ground":"#a9bd7a","river":"#4f9fd8"},"intro":{"lines":["秦軍包圍趙國首都邯鄲，毛遂說服楚國出兵，魏國的信陵君也帶兵趕來，邯鄲終於得救。","可是秦國越來越強。秦國丞相呂不韋招來三千門客，編成了一本大書《呂氏春秋》。","年輕的秦王政長大後，開始一個接一個攻打六國。","北方的燕國很害怕，太子丹找來勇士荊軻，想去刺殺秦王。"],"people":[["平原君","趙國公子，邯鄲之圍時四處求救"],["魯仲連","齊國高士，替人解決難題卻不收錢"],["信陵君","魏國公子，奪下兵權救趙國"],["荊軻","衛國勇士，替燕國去刺秦王"]]},"stops":[{"id":"e29_01","yr":"西元前 258 年","place":"平原君府（邯鄲）","scene":"office","music":"palace","cast":[["平原君",0.2,-0.4],["毛遂",-6.8,1.0],["門客",2.2,0.8],["門客",2.8,-0.6]],"beats":[{"t":"平原君和楚國訂好盟約，帶著門客回到趙國。","mv":[["毛遂",-0.8,0.8]]},{"t":"平原君召集大家，說出心裡的話。","fx":[["focus","平原君"]]},{"who":"平原君","t":"我看過的人才，多的上千，少的也有上百，自以為不會漏掉天下的人才。這次卻看走眼了毛先生！","fx":[["sad","平原君"]]},{"who":"平原君","t":"古時候的「九鼎」，是國家最貴重的寶物。毛先生一到楚國，就讓趙國的地位比九鼎還重！","fx":[["say","平原君"]]},{"who":"平原君","t":"毛先生那三寸長的舌頭，比百萬大軍還厲害！","fx":[["cheerAll","門客"]]},{"who":"毛遂","t":"不敢當，不敢當！","fx":[["cheer","毛遂"]]}],"q":"平原君說，毛遂在楚國說的話，讓趙國比國家的寶物「九鼎」還要重。後來形容一個人說話很有分量的成語是哪一個？","wrong":[{"w":"人微言輕","by":"毛遂","line":"人微言輕是地位低、說話沒人聽。以前我是這樣啦，現在可不一樣了！"},{"w":"信口開河","by":"門客","line":"信口開河是隨便亂說。毛先生每句話都說到楚王心坎裡了。"},{"w":"一諾千金","by":"平原君","line":"一諾千金是答應的事一定做到，意思很接近！不過我說的是毛先生的話，像「九鼎」那麼重。"}],"hint":"一句話，有多重？比國家的寶物還重。","after":"平原君說：「我再也不敢說自己會看人了。」從此把毛遂當作上等的貴客。","lesson":{"title":"九鼎","text":"傳說大禹把天下分成九州，鑄了九個大鼎，象徵整個國家。誰擁有九鼎，就代表擁有天下，所以九鼎是最重的寶物。","next":"可是楚國的援軍還在路上，邯鄲依然被秦軍團團圍住。魏國派來一位使者，帶來一個奇怪的提議……"}},{"id":"e40_07","yr":"西元前 258 年","place":"邯鄲城中","scene":"office","music":"night","cast":[["平原君",0.2,-0.4],["新垣衍",-6.8,1.0],["魯仲連",6.8,1.2,0,null,1],["趙兵",2.8,-1.0]],"beats":[{"t":"魏王派將軍晉鄙帶兵救趙，可是晉鄙怕秦國，把軍隊停在半路，不肯前進。"},{"t":"魏王又派將軍新垣衍偷偷溜進邯鄲，透過平原君傳話給趙王。","mv":[["新垣衍",-0.8,0.8]]},{"who":"新垣衍","t":"秦國圍攻邯鄲，是想當皇帝。只要趙國派人尊秦王為「帝」，秦王一高興，就會退兵了！","fx":[["say","新垣衍"]]},{"who":"平原君","t":"尊秦國為帝，邯鄲也許就能得救……可是這樣，趙國就要向秦國低頭了……","fx":[["sad","平原君"]]},{"t":"平原君想來想去，一直沒辦法決定。","fx":[["focus","平原君"]]},{"t":"這時候，齊國的高士魯仲連正好在邯鄲。他聽說了這件事，急忙趕來。","mv":[["魯仲連",1.8,0.8]],"fx":[["upset","魯仲連"]]}],"q":"平原君一下想答應、一下又覺得不行，遲遲拿不定主意。史書說他「猶豫未有所決」，這叫做什麼？","wrong":[{"w":"當機立斷","by":"魯仲連","line":"當機立斷是把握時機馬上決定。平原君要是這樣就好了！"},{"w":"斬釘截鐵","by":"新垣衍","line":"斬釘截鐵是說話做事很果斷。平原君可是想了又想，說不出答案。"},{"w":"三心二意","by":"平原君","line":"三心二意是心思不專一，意思有點接近！不過我是在兩個選擇之間，遲遲做不了決定。"}],"hint":"史書原文裡已經有前兩個字了，後面是「沒辦法決定」。","after":"魯仲連請平原君介紹他去見新垣衍，要當面跟他辯論。","lesson":{"title":"義不帝秦","text":"魯仲連說：秦國不講禮義，如果讓它稱帝，我寧可跳進東海，也不當秦國的百姓！新垣衍被說服，再也不敢提尊秦為帝。據說秦軍將領聽到了，還把軍隊往後退了五十里。","next":"不久，魏國的信陵君想辦法奪下晉鄙的兵權，帶著大軍來救趙國……"}},{"id":"e40_08","yr":"西元前 257 年","place":"平原君府．宴會","scene":"palace","music":"palace","cast":[["平原君",0.4,-0.2],["魯仲連",-1.0,0.6],["侍從",2.6,1.0]],"beats":[{"t":"信陵君帶兵救趙，秦軍終於退走，邯鄲得救了！","fx":[["cheer","平原君"],["burst","平原君","#e8b84f"]]},{"who":"平原君","t":"魯先生幫了大忙，我要請趙王封給您一塊土地！"},{"t":"魯仲連一連推辭了三次，就是不肯接受。","fx":[["say","魯仲連"]]},{"t":"平原君擺下酒宴。喝到正高興時，他站起來，捧著千金向魯仲連敬酒祝福。","mv":[["平原君",-0.2,0.2]],"fx":[["focus","平原君"]]},{"who":"魯仲連","t":"哈哈！天下人尊敬的士人，是因為他們替人排除禍患、解救危難、化解紛爭，卻什麼也不拿。","fx":[["cheer","魯仲連"]]},{"who":"魯仲連","t":"如果收了錢，那就跟做買賣的商人一樣了！"}],"q":"魯仲連說，真正的士人替人排除危難、調解紛爭，卻不求任何回報。這種行為可以用哪個成語形容？","wrong":[{"w":"惹是生非","by":"侍從","line":"惹是生非是到處製造麻煩。魯先生是來解決麻煩的！"},{"w":"唯利是圖","by":"魯仲連","line":"唯利是圖是只想著賺錢。我就是不想變成這樣，才不收千金。"},{"w":"見義勇為","by":"平原君","line":"見義勇為是看到該做的事勇敢去做，意思有點接近！不過魯先生說的重點是排除危難、解決紛爭。"}],"hint":"「難」念ㄋㄢˋ，是危難；「紛」是紛爭。","after":"魯仲連說完就向平原君告辭，一輩子再也沒有見他。","lesson":{"title":"魯仲連","text":"魯仲連是齊國人，喜歡替人解決難題，卻不肯做官、不收報酬。唐朝大詩人李白非常佩服他，在詩裡稱讚他「魯連特高妙」。","next":"救了趙國的信陵君，也受到趙王熱烈的感謝……"}},{"id":"e42_03","yr":"西元前 257 年","place":"趙國王宮（邯鄲）","scene":"palace","music":"palace","cast":[["信陵君",0.4,0.0],["門客",-1.0,0.8],["趙孝成王",6.8,1.0],["平原君",7.4,-0.2]],"beats":[{"t":"信陵君是魏王的弟弟。為了救趙國，他拿到魏王的兵符，假傳命令，奪下晉鄙的兵權。"},{"t":"趙王很感激，和平原君商量，要把五座城封給信陵君。","mv":[["趙孝成王",2.2,0.6],["平原君",3.0,-0.6]]},{"who":"信陵君","t":"趙國能保住，全都靠我啊！","fx":[["cheer","信陵君"]]},{"t":"信陵君聽到消息，得意洋洋，臉上都是「我功勞最大」的表情。一位門客上前勸他。","mv":[["趙孝成王",6.8,1.0],["平原君",7.4,-0.2]]},{"who":"門客","t":"有些事不可以忘，有些事不可以不忘。別人對公子有恩，不能忘；公子對別人有恩，希望您忘掉。","fx":[["say","門客"]]},{"who":"門客","t":"而且您假傳魏王的命令，對趙國有功，對魏國卻不算忠臣啊。","fx":[["focus","信陵君"]]}],"q":"信陵君聽了門客的話，馬上責備自己，羞愧得好像沒有地方可以容身。這叫做什麼？","wrong":[{"w":"洋洋得意","by":"門客","line":"洋洋得意是他剛才的樣子。聽完我的話，公子可就不是這樣了。"},{"w":"理直氣壯","by":"信陵君","line":"理直氣壯是覺得自己有理，說話很大聲。我現在知道錯了，哪敢大聲。"},{"w":"面紅耳赤","by":"門客","line":"面紅耳赤是臉和耳朵都紅了，害羞或生氣都可以用，意思有點接近！不過公子是羞愧到極點、想找地方躲起來。"}],"hint":"羞愧得想躲起來，卻找不到地方……","after":"趙王親自出來迎接，信陵君謙虛地從旁邊的臺階走上去，一直說自己對不起魏國，對趙國也沒有功勞。","lesson":{"title":"信陵君","text":"信陵君名叫無忌，養了三千門客，對人非常謙虛，是戰國「四公子」之一。他怕魏王生氣，在趙國住了十年。後來他回到魏國，帶領五國聯軍打敗了秦軍。","next":"這時候在秦國，當年被呂不韋看中的子楚已經當上秦王，呂不韋也當上了丞相……"}},{"id":"e12_08","yr":"約西元前 239 年","place":"咸陽市場門口","scene":"palace","music":"map","cast":[["呂不韋",0.4,-0.4],["門客",2.4,-1.0],["書生",-6.8,1.0],["書生",6.8,1.4]],"beats":[{"t":"子楚過世後，年少的嬴政當上秦王。呂不韋當丞相，大權在握，秦王還尊稱他「仲父」。"},{"who":"呂不韋","t":"魏國的信陵君、楚國的春申君都養了很多門客。秦國這麼強，怎麼可以輸給他們？","fx":[["say","呂不韋"]]},{"t":"呂不韋也招來三千門客，請他們把知道的事寫下來，編成二十多萬字的大書，叫做《呂氏春秋》。","fx":[["cheer","門客"]]},{"t":"書寫好了，呂不韋把它公布在咸陽市場的大門口，上面還掛著千金。","mv":[["書生",-0.8,0.8],["書生#2",1.6,1.2]],"fx":[["focus","呂不韋"]]},{"who":"呂不韋","t":"各國的讀書人聽好了！誰能在書上增加或刪改一個字，就賞他千金！","fx":[["upset","書生"]]},{"who":"書生","t":"一個字……就能換千金？"}],"q":"誰能改動書上一個字，就能得到千金，好像書裡每個字都值千金。後來形容文字精彩、價值很高的成語是哪一個？","wrong":[{"w":"一文不值","by":"書生","line":"一文不值是一點價值都沒有。呂丞相可是說一個字值千金呢！"},{"w":"廢話連篇","by":"門客","line":"廢話連篇是寫了一大堆沒用的話。我們寫的書，丞相說連一個字都不能改！"},{"w":"字字珠璣","by":"呂不韋","line":"字字珠璣是每個字都像珍珠一樣好，意思很接近！不過我掛出來的賞金，是一個字值多少錢？"}],"hint":"改一個字，就能拿到多少錢？","after":"史書沒有記載有人領走這筆千金。後人猜想，大家不是改不了，而是不敢挑丞相的毛病。","lesson":{"title":"呂氏春秋","text":"《呂氏春秋》收集了各家學說，天文、地理、做人的道理都有，是一本「雜家」的書。後來呂不韋被秦王政免去丞相的職位，在憂愁和害怕中過世。","next":"秦王政長大後，秦軍一個接一個攻打六國。燕國的太子丹非常害怕，四處尋找勇士。有一位叫荊軻的人來到了燕國……"}},{"id":"e41_05","yr":"戰國末年","place":"燕國的市集","scene":"night","music":"night","cast":[["荊軻",0.4,-0.2],["高漸離",-1.0,-0.4],["屠夫",1.8,0.6],["路人",6.8,1.4],["路人",-6.8,1.2]],"beats":[{"t":"荊軻是衛國人，喜歡讀書和劍術，到處遊歷。後來他來到燕國。"},{"t":"他和一位屠夫，還有很會擊筑的高漸離，成了好朋友。筑是一種用竹尺敲的弦樂器。","fx":[["cheer","高漸離"]]},{"t":"荊軻很愛喝酒，每天都和他們在燕國的市集喝酒。","mv":[["路人",3.0,1.4],["路人#2",-0.4,1.4]]},{"t":"喝到興頭上，高漸離擊筑，荊軻在市集中間跟著唱歌，三個人快樂極了。","fx":[["cheer","荊軻"],["say","荊軻"]]},{"t":"唱著唱著，他們又一起哭了起來，一點也不在乎旁邊有人在看。","fx":[["sad","荊軻"],["sad","高漸離"]]},{"who":"路人","t":"他們怎麼一下笑、一下哭？好像我們都不存在一樣……","fx":[["upset","路人"]]}],"q":"荊軻和高漸離在熱鬧的市集裡又唱又哭，好像身邊沒有別人一樣。這叫做什麼？","wrong":[{"w":"鴉雀無聲","by":"路人","line":"鴉雀無聲是安靜得一點聲音都沒有。他們可是大聲唱歌又大聲哭呢！"},{"w":"彬彬有禮","by":"屠夫","line":"彬彬有禮是很有禮貌、很斯文。在大街上又哭又唱，可說不上斯文。"},{"w":"目中無人","by":"高漸離","line":"目中無人是驕傲、看不起別人，意思有點接近！不過我們只是太投入，忘了旁邊有人。"}],"hint":"身「旁」好像沒有人一樣。","after":"不過，荊軻為人其實很沉穩，喜歡讀書。燕國的隱士田光先生也很看重他，知道他不是普通人。","lesson":{"title":"太子丹","text":"燕國太子丹曾經在秦國當人質，受到冷落，偷偷逃回燕國。他看秦國越來越強，就想找勇士去對付秦王。田光先生把荊軻推薦給了太子丹。","next":"秦軍逼近燕國，太子丹請荊軻去見秦王。出發那天，大家來到易水邊送行……"}},{"id":"e15_01","yr":"西元前 227 年","place":"易水邊","scene":"river","music":"night","cast":[["荊軻",0.4,0.2],["太子丹",2.0,0.8],["高漸離",-1.0,-0.4],["秦舞陽",1.0,-1.2],["賓客",3.2,-0.6],["賓客",3.6,1.4]],"beats":[{"t":"太子丹和知道這件事的賓客，都穿著白衣、戴著白帽，來到易水邊為荊軻送行。","fx":[["sadAll","賓客"]]},{"who":"太子丹","t":"荊先生，燕國就拜託您了！","fx":[["say","太子丹"]]},{"t":"高漸離擊筑，荊軻跟著唱，歌聲淒涼，大家都流下了眼淚。","fx":[["sad","太子丹"],["focus","荊軻"]]},{"who":"荊軻","t":"風蕭蕭兮易水寒，壯士一去兮不復還！","fx":[["say","荊軻"]]},{"t":"歌聲忽然變得激昂起來。大家聽了都瞪大眼睛，頭髮豎得直直的，好像要把帽子頂起來！","fx":[["upset","太子丹"],["upset","高漸離"],["cheerAll","賓客"]]}],"q":"大家聽了激昂的歌聲，瞪大眼睛、頭髮豎起來頂到帽子。後來形容憤怒或激動到極點的成語是哪一個？","wrong":[{"w":"眉開眼笑","by":"賓客","line":"眉開眼笑是很高興的樣子。這時候大家可是又悲傷又激動啊！"},{"w":"心平氣和","by":"高漸離","line":"心平氣和是心情平靜。聽到這首歌，誰還平靜得下來？"},{"w":"火冒三丈","by":"太子丹","line":"火冒三丈也是非常生氣，意思很接近！不過史書寫的是頭髮豎起來，頂著帽子。"}],"hint":"頭髮豎起來，衝向頭上戴的什麼？","after":"荊軻坐上車子離開，從頭到尾都沒有回頭。","lesson":{"title":"風蕭蕭兮易水寒","text":"荊軻唱的這兩句歌，意思是：風吹得好冷，易水也好冷，勇士這一去就不會回來了。這首〈易水歌〉一直流傳到今天。藺相如在秦王面前，也曾經氣得「怒髮上衝冠」。","next":"荊軻來到秦國都城咸陽，帶著燕國的地圖，去見秦王……"}},{"id":"e15_03","yr":"西元前 227 年","place":"秦國王宮（咸陽）","scene":"palace","music":"battle","winMv":[["秦王",3.6,-1.4]],"cast":[["秦王",1.4,-0.6],["荊軻",-0.8,0.4],["秦舞陽",0.2,1.6],["大臣",3.0,0.8],["大臣",-0.2,-1.6]],"beats":[{"t":"荊軻說燕國願意獻上土地，秦王非常高興，在咸陽宮隆重地接見他。","fx":[["cheer","秦王"]]},{"t":"荊軻的助手秦舞陽捧著地圖，走到臺階前，突然臉色大變，全身發抖。大臣們都覺得奇怪。","fx":[["upset","大臣"],["sad","秦舞陽"]]},{"who":"荊軻","t":"他是北方鄉下來的人，從來沒見過天子，所以害怕。請大王原諒他。","fx":[["say","荊軻"]]},{"who":"秦王","t":"起來，把他手上的地圖拿過來給我看！"},{"t":"荊軻捧著地圖，走到秦王面前。","mv":[["荊軻",0.4,0.0]]},{"t":"他慢慢地把地圖打開，一點一點地展開……秦王看得好專心。","fx":[["focus","秦王"]]}],"q":"地圖打開到最後，藏在裡面的匕首露了出來！後來比喻事情到最後，真正的目的終於露出來，是哪個成語？","wrong":[{"w":"完璧歸趙","by":"大臣","line":"完璧歸趙是把東西完好地送回去。這裡可沒有人要還東西啊！"},{"w":"風平浪靜","by":"秦舞陽","line":"風平浪靜是平靜沒事。接下來可是一場大騷動！"},{"w":"原形畢露","by":"秦王","line":"原形畢露是本來面目全部露出來，意思很接近！不過這件事是「地圖」打到最後，才露出「匕首」。"}],"hint":"「窮」是到了盡頭，「見」念ㄒㄧㄢˋ，就是出現。","after":"荊軻抓住秦王的袖子刺過去，秦王嚇得扯斷袖子跳起來，繞著柱子逃。最後秦王拔劍反擊，荊軻失敗了，也犧牲了性命。","lesson":{"title":"秦統一天下","text":"刺殺失敗後，秦王大怒，派大軍攻打燕國。西元前 222 年燕國滅亡；第二年，秦王滅掉最後的齊國，統一天下，自稱「始皇帝」。熱鬧的戰國時代，就這樣結束了。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十三章．救趙與刺秦","eps":[12,15,29,40,41,42]},{"key":"h13","line":"history","name":"大秦崩落","short":"秦朝末年","era":"西元前 220–207 年","color":"#4E5D6C","map":{"ground":"#b9b98a","river":"#4f8fc8"},"intro":{"lines":["西元前 221 年，秦始皇統一天下，建立了中國第一個大一統的帝國。","秦朝修長城、蓋宮殿，法律又非常嚴苛，百姓過得很辛苦。","秦始皇死後，秦二世更加殘暴。西元前 209 年，陳勝、吳廣帶頭起義，各地英雄紛紛起兵。","秦朝只維持了十五年就滅亡了。我們去看看，那些英雄年輕時是什麼模樣！"],"people":[["劉邦","沛縣的小亭長，心胸開闊，後來的漢高祖"],["張良","韓國貴族的後代，後來成為劉邦的軍師"],["陳勝","替人種田的年輕人，第一個起義反秦"],["項羽","楚國名將的後代，力大無窮"]]},"stops":[{"id":"e58_04","yr":"秦朝統一後","place":"沛縣．小酒店","scene":"house","music":"map","cast":[["劉邦",-6.5,0.8],["官吏",-1.2,-0.4],["王婆婆",1.4,-0.6],["武婆婆",2.6,0.2],["客人",7,0.6],["客人",7.6,-0.4]],"beats":[{"t":"秦始皇統一天下後，沛縣有個年輕人叫劉邦。他不愛在家種田做生意，卻很喜歡幫助別人。"},{"t":"後來劉邦當上泗水亭長，是管一小塊地方的小官。他跟縣裡的官吏總是有說有笑，一點也不擺架子。","mv":[["劉邦",-0.4,0.6]]},{"who":"官吏","t":"劉亭長，聽說你又把錢借給朋友啦？","fx":[["say","官吏"]]},{"who":"劉邦","t":"朋友有困難嘛！拿去用，別客氣！哈哈！","fx":[["cheer","劉邦"]]},{"t":"劉邦常到王婆婆、武婆婆的店裡喝酒，常常是先賒帳。說也奇怪，他一來，客人就跟著變多。","mv":[["客人",3.4,1.2],["客人#2",0.6,-1.6]]},{"who":"王婆婆","t":"劉邦一來，酒就多賣好幾倍！到了年底，這些帳條……","fx":[["focus","王婆婆"]]}],"q":"年底，兩家店乾脆把劉邦的帳條折斷，不要他還錢。劉邦心胸開闊、對人寬厚，大家都喜歡他。該用哪個成語形容他？","wrong":[{"w":"斤斤計較","by":"官吏","line":"斤斤計較是連一點小事都要算清楚。劉亭長被我們開玩笑也不生氣，剛好相反！"},{"w":"小肚雞腸","by":"武婆婆","line":"小肚雞腸是心胸狹窄、愛記仇。劉邦要是這樣，客人才不會跟著他來呢！"},{"w":"寬宏大量","by":"王婆婆","line":"寬宏大量也是度量大、能原諒人，意思很接近！不過史書寫劉邦「意豁如也，常有大度」，有一個專門的成語。"}],"hint":"史書說他心胸「開闊」，「度量」很大。","after":"這段記在《史記．高祖本紀》。司馬遷也老實寫了：劉邦年輕時不太愛做家裡的農事。","lesson":{"title":"沛縣的小亭長","text":"秦朝在各地設「亭」，亭長負責治安、接待來往的官員，是很小的官。劉邦身邊慢慢聚集了蕭何、曹參、樊噲這些朋友，後來都成了他打天下的好幫手。","next":"同一個時代，有一位韓國貴族的後代，正躲在下邳，等待機會……"}},{"id":"e16_04","yr":"約西元前 218 年之後","place":"下邳．橋上","scene":"river","music":"map","cast":[["張良",-0.8,0.4],["老人",6.8,0.8]],"beats":[{"t":"張良是韓國貴族的後代。秦國滅了韓國，他找大力士在博浪沙行刺秦始皇，沒有成功，只好改名換姓躲到下邳。"},{"t":"有一天，張良在橋上散步。一位穿粗布衣的老人走過來，故意把鞋子丟到橋下。","mv":[["老人",1.2,0.4]]},{"who":"老人","t":"小子，下去把鞋撿上來！","fx":[["upset","張良"]]},{"t":"張良嚇了一跳，氣得想揍他。可是看他年紀大，還是忍住了，下橋把鞋撿了回來。","mv":[["張良",-0.4,-1.4]]},{"who":"老人","t":"幫我穿上。","mv":[["張良",0,0.4]]},{"t":"張良乾脆跪下來，替老人穿好鞋。老人笑了笑，就走了。","mv":[["老人",7.2,0.8]]},{"t":"走了大約一里路，老人又走了回來。","mv":[["老人",1.4,0.4]],"fx":[["focus","老人"]]}],"q":"老人回來說：「這個年輕人，值得好好教一教！五天後天剛亮，到這裡來見我。」這句稱讚變成哪個成語？","wrong":[{"w":"對牛彈琴","by":"老人","line":"對牛彈琴是跟聽不懂的人講道理，白費力氣。這小子聽得懂，還很有耐心呢！"},{"w":"少不更事","by":"張良","line":"少不更事是年輕不懂事。我雖然很想發火，可是我忍住了呀！"},{"w":"後生可畏","by":"老人","line":"後生可畏是年輕人很厲害、將來可能超越前輩，意思有點接近！不過我說的是「這孩子值得教」，有一個專門的成語。"}],"hint":"「孺子」是年輕人、小孩子的意思。","after":"前兩次張良都比老人晚到，被罵了回去。第三次他半夜就去等，老人才送給他一本書——《太公兵法》。","lesson":{"title":"黃石公的兵書","text":"老人說：「讀了這本書，就能當帝王的老師。」還說十三年後在穀城山下看到的黃石就是他，後人叫他「黃石公」。張良後來成了劉邦最重要的軍師。","next":"在陽城，也有一個替人種田的窮小子，心裡藏著大大的志向……"}},{"id":"e08_06","yr":"秦朝時","place":"陽城．田邊","scene":"road","music":"map","cast":[["陳涉",-0.6,0.6],["農夫",1.6,0.2],["農夫",2.6,1.2]],"beats":[{"t":"陳涉年輕的時候很窮，只能替別人種田，賺一點工錢。"},{"t":"這天大家在田裡辛苦工作。陳涉停下鋤頭，走到田埂上，望著遠方嘆了好久的氣。","mv":[["陳涉",-1.2,-1.2]],"fx":[["sad","陳涉"]]},{"who":"陳涉","t":"將來我們誰要是富貴了，可別忘了大家喔！"},{"who":"農夫","t":"哈哈哈！你是替人種田的，哪來的富貴？","fx":[["cheerAll","農夫"]]},{"t":"陳涉抬頭，看見田邊吱吱喳喳的小麻雀，還有天上高高飛過的天鵝。","fx":[["focus","陳涉"]]},{"who":"陳涉","t":"唉！小小的燕子和麻雀，哪裡懂得天鵝的想法呢！","fx":[["upset","陳涉"]]}],"q":"陳涉把自己比作飛得又高又遠的天鵝，把笑他的人比作小燕子、小麻雀。他心裡藏著的遠大志向，叫做什麼？","wrong":[{"w":"杞人憂天","by":"陳涉","line":"杞人憂天是擔心根本不會發生的事。我不是怕天塌下來，是想做一番大事！"},{"w":"井底之蛙","by":"農夫","line":"井底之蛙是見識很少的人……咦，他是在說我們嗎？可是題目問的是陳涉的志向喔！"},{"w":"好高騖遠","by":"農夫#2","line":"好高騖遠是不切實際、只想做太高太遠的事，是批評人的話，意思有點像！不過陳涉後來真的做到了，有一個稱讚志向的成語。"}],"hint":"答案裡藏著一種會高飛的大鳥。","after":"陳涉就是陳勝，「涉」是他的字。後來，他真的成了第一個站出來反抗秦朝的人。","lesson":{"title":"從種田人到領袖","text":"陳勝出身貧窮。司馬遷把他寫進《史記》的「世家」——那裡本來是記諸侯貴族的地方，可見司馬遷認為他帶頭反秦，功勞很大。","next":"西元前 209 年，陳勝和九百個百姓被派去守邊，走到大澤鄉時，下起了大雨……"}},{"id":"e16_03","yr":"西元前 209 年","place":"大澤鄉","scene":"night","music":"night","cast":[["陳勝",-0.6,0.6],["吳廣",1.2,0.8],["戍卒",-2,-0.4],["戍卒",2.6,-0.2],["戍卒",0.4,-2.2],["戍卒",-1.4,-2.4]],"beats":[{"t":"西元前 209 年，秦二世派九百個百姓去北方守邊，陳勝、吳廣是帶隊的小隊長。"},{"t":"走到大澤鄉，連下好幾天大雨，道路都不通了。怎麼趕，都趕不上期限。","fx":[["sadAll","戍卒"]]},{"who":"吳廣","t":"照秦朝的法律，誤了期限就要處死。逃走被抓到，也是死……","fx":[["sad","吳廣"]]},{"who":"陳勝","t":"反正都是死，不如為天下做一件大事！王侯將相，難道是天生的嗎？","fx":[["upset","陳勝"],["focus","陳勝"]]},{"t":"大家沒有兵器，也沒有旗子。陳勝、吳廣就帶頭砍下樹木當武器，把竹竿高高舉起當旗子。","mv":[["陳勝",-0.2,-0.6],["吳廣",1.4,-0.4]]},{"t":"九百個人一起大喊，跟著他們出發了！","fx":[["cheerAll","戍卒"],["burst","陳勝","#e8b84f"]]}],"q":"一群沒有武器的百姓，舉起竹竿當旗子，起來反抗殘暴的秦朝，各地紛紛響應。這叫做什麼？","wrong":[{"w":"坐以待斃","by":"吳廣","line":"坐以待斃是坐著等死。我們就是不想等死，才站起來的！"},{"w":"半途而廢","by":"陳勝","line":"半途而廢是做到一半就放棄。我們雖然走不到邊境，卻是要開始做一件大事！"},{"w":"官逼民反","by":"陳勝","line":"官逼民反是官府逼得百姓只好造反，意思很接近！不過「砍木頭當兵器、舉竹竿當旗子」，有一個專門的成語。"}],"hint":"旗子是用什麼做的？「揭」是高高舉起。","after":"漢朝的賈誼在〈過秦論〉裡寫：「斬木為兵，揭竿為旗」，天下的人像雲一樣聚集過來響應。","lesson":{"title":"第一場大起義","text":"這是中國歷史上第一次大規模的農民起義，叫做「大澤鄉起義」。陳勝後來自立為王，國號「張楚」，雖然只當了六個月就失敗了，卻讓各地英雄都站了出來。","next":"消息傳到長江南邊的會稽郡，郡守殷通也坐不住了……"}},{"id":"e16_05","yr":"西元前 209 年","place":"會稽郡府","scene":"office","music":"palace","winSad":"殷通","cast":[["殷通",1.2,-0.4],["項梁",-6.5,0.8],["項羽",-7.2,1.4]],"beats":[{"t":"陳勝起兵兩個月後，會稽郡守殷通，把楚國名將的後代項梁找來商量。","mv":[["項梁",-0.8,0.4]]},{"who":"殷通","t":"長江西邊的人都反了，看來是老天要滅亡秦朝的時候了。"},{"who":"殷通","t":"我聽說，搶先動手就能控制別人，慢了一步就會被別人控制。我想起兵，請你和桓楚當將軍。","fx":[["say","殷通"]]},{"who":"項梁","t":"桓楚逃到沼澤裡了，只有我姪子項籍知道他在哪裡。","mv":[["項梁",-5.4,0.6]]},{"t":"項梁走到門外，小聲交代姪子項羽：拿著劍，在這裡等著。","fx":[["focus","項羽"]]},{"who":"項梁","t":"請讓項籍進來，接受您的命令，去把桓楚找來吧。","mv":[["項梁",-1,0.4],["項羽",-0.2,1.2]]}],"q":"殷通說「先動手就能控制對方」，結果項梁、項羽比他更快一步，奪下了會稽的兵權。殷通這句話變成哪個成語？","wrong":[{"w":"後來居上","by":"項羽","line":"後來居上是後來的超過先來的。我們可是搶在前面動手的！"},{"w":"姍姍來遲","by":"項梁","line":"姍姍來遲是慢吞吞地很晚才到。要是我們慢了，就換別人控制我們了！"},{"w":"先聲奪人","by":"項梁","line":"先聲奪人是先用氣勢壓倒對方，意思很接近！不過殷通說的「先動手，就能控制人」，有一個專門的成語。"}],"hint":"「制」是控制，成語開頭是「先」。","after":"項梁使了個眼色，項羽拔劍除掉了殷通。項梁拿到郡守的官印，召集了八千名精兵。","lesson":{"title":"江東子弟兵","text":"項梁是楚國名將項燕的兒子，項羽是他的姪子，那年二十四歲，力氣大到能舉起大鼎。這八千江東子弟跟著項羽渡過長江，成了反秦的主力。","next":"同一個時候，北方的沛縣也亂成一團。當過亭長的劉邦，正帶著一群人躲在山裡……"}},{"id":"e16_06","yr":"西元前 209 年","place":"沛縣城外","scene":"walls","music":"battle","cast":[["劉邦",-6.8,0.8],["父老",-1.4,-2.7,1.3],["父老",0.6,-2.7,1.3],["蕭何",6.6,0.6],["曹參",7.2,1.4]],"beats":[{"t":"沛縣縣令本來想響應陳勝，後來又反悔了。他關起城門，不讓劉邦一行人進城。"},{"t":"劉邦把一封信寫在布上，綁在箭上，射進城裡。","mv":[["劉邦",-0.8,0.6]],"fx":[["focus","劉邦"]]},{"who":"劉邦","t":"天下人被秦朝害苦很久了！大家一起起來，才能保住家園！"},{"t":"城裡的父老讀了信，帶著年輕人打開城門，迎接劉邦。","mv":[["父老",-0.4,-0.6,0],["父老#2",1,-0.2,0],["蕭何",2,0.8],["曹參",2.8,1.4]]},{"who":"父老","t":"劉邦，你平常最有本事，就請你當我們的首領吧！","fx":[["cheerAll","父老"]]},{"t":"劉邦卻連忙搖手。","fx":[["upset","劉邦"]]}],"q":"劉邦說：「現在天下大亂，如果選錯了首領，一下子就會失敗得一塌糊塗，沒辦法收拾。」這句話變成哪個成語？","wrong":[{"w":"一帆風順","by":"蕭何","line":"一帆風順是事情非常順利。他擔心的是選錯人，反而會大失敗！"},{"w":"一舉兩得","by":"曹參","line":"一舉兩得是做一件事得到兩種好處。他說的是會輸得很慘啊！"},{"w":"潰不成軍","by":"父老","line":"潰不成軍是軍隊被打得四散逃跑，意思有點接近！不過形容「失敗到無法收拾」，劉邦說的是另一個成語。"}],"hint":"失敗的樣子，就像泥土「塗」在地上。","after":"蕭何、曹參都是文官，怕事情失敗被追究，一起推讓。大家還是推舉劉邦，他就成了「沛公」。","lesson":{"title":"沛公起兵","text":"劉邦當了沛公，召集了兩三千名沛縣子弟。後來他投靠項梁，和項羽並肩攻打秦軍，打天下的路才剛剛開始。","next":"這時候，北方的趙地也在打仗。陳勝派去的將軍武臣，來到了范陽……"}},{"id":"e30_07","yr":"西元前 209 年","place":"范陽城外．武臣軍營","scene":"tent","music":"palace","table":true,"cast":[["武臣",1.2,0.4],["蒯通",-6.5,0.8]],"beats":[{"t":"陳勝派將軍武臣往北攻打趙地，一路打下好多座城。下一個目標，是范陽。"},{"t":"范陽縣令很害怕，想投降。可是他也擔心：投降了，會不會還是被殺？"},{"t":"范陽的謀士蒯通，來到了武臣的軍營。","mv":[["蒯通",-0.8,0.6]]},{"who":"蒯通","t":"將軍如果殺了先投降的范陽縣令，別的城就會說：『先投降也是死！』","fx":[["say","蒯通"]]},{"who":"蒯通","t":"那他們一定死守到底。每座城都會像金屬做的城牆、滾燙的護城河一樣，怎麼攻也攻不破。"},{"who":"武臣","t":"那該怎麼辦才好？","fx":[["focus","武臣"]]}],"q":"蒯通說，被逼急的城池會守得像「金屬做的城牆、滾燙的護城河」那麼堅固，攻也攻不下來。這種堅固的城池，叫做什麼？","wrong":[{"w":"甕中捉鱉","by":"武臣","line":"甕中捉鱉是對方已經跑不掉，很好抓。蒯通說的剛好相反，是攻不下來！"},{"w":"不攻自破","by":"蒯通","line":"不攻自破是不用打就自己垮了。死守的城可不會這樣！"},{"w":"固若金湯","by":"蒯通","line":"固若金湯也是形容城池非常堅固，意思幾乎一樣！它就是從我的話變來的。不過我原本的說法裡，有「城」也有「池」。"}],"hint":"「湯」在古代是熱水，「池」是護城河。","after":"蒯通建議用華麗的車子和侯印去迎接范陽縣令。武臣照做，結果燕、趙一帶有三十多座城不戰而降。","lesson":{"title":"不打仗也能得城","text":"蒯通靠一番話，讓三十多座城不用打仗就投降，少了很多傷亡。這位很會說話的謀士，後來還去勸過大將韓信，下一章我們會再見到他。","next":"陳勝起兵的消息也傳到了咸陽。秦二世把一群讀書人找來，問他們該怎麼辦……"}},{"id":"e58_03","yr":"西元前 209 年","place":"咸陽宮","scene":"palace","music":"palace","cast":[["秦二世",1.2,-0.2],["博士",-0.6,0.8],["博士",0.6,1.4],["叔孫通",-1.8,1.2]],"beats":[{"t":"陳勝在東方起兵的消息傳到咸陽。秦二世把三十多位博士和讀書人找來問話。"},{"who":"秦二世","t":"楚地守邊的兵，打下了蘄縣，還攻進陳縣。你們看怎麼樣？"},{"who":"博士","t":"這是造反！請陛下趕快派兵去打！","fx":[["say","博士"]]},{"t":"秦二世不想聽到天下有人造反，氣得臉色大變。","fx":[["upset","秦二世"]]},{"t":"叔孫通看出秦二世不愛聽，往前站了一步。","mv":[["叔孫通",-0.6,0]],"fx":[["focus","叔孫通"]]},{"who":"叔孫通","t":"天下已經統一，哪有人敢造反？那些只不過是偷雞摸狗的小盜賊罷了！"}],"q":"叔孫通接著說：「這些小賊，哪裡值得放在牙齒中間說呢？地方官抓一抓就好了。」這種「小事不值得一提」的說法，變成哪個成語？","wrong":[{"w":"咬牙切齒","by":"秦二世","line":"咬牙切齒是恨得牙癢癢、非常生氣。朕現在心情可好了！"},{"w":"伶牙俐齒","by":"博士","line":"伶牙俐齒是很會說話……嗯，叔孫通確實很會說話，可是題目問的是「不值得一提」喔！"},{"w":"微不足道","by":"叔孫通","line":"微不足道也是小到不值得說，意思很接近！不過我說的是「放在牙齒間」，有一個跟牙齒有關的成語。"}],"hint":"成語裡藏著「牙齒」的齒。","after":"秦二世很高興，賞給叔孫通二十匹布和一套衣服。叔孫通一回到住處，就趕快逃離了咸陽。","lesson":{"title":"說真話的被處罰","text":"說「這是造反」的博士們，反而被秦二世交給官吏治罪。叔孫通知道秦朝快完了，說好聽話只是為了脫身；後來他投靠劉邦，替漢朝制定了朝廷的禮儀。","next":"另一邊，秦國大軍把趙國圍在鉅鹿。楚軍的項羽，正帶兵趕去救援……"}},{"id":"e08_03","yr":"西元前 207 年","place":"漳河岸邊","scene":"river","music":"battle","cast":[["項羽",-6.6,0.8],["楚兵",-7.2,1.6],["楚兵",-7.6,0.2],["楚兵",-8,1.2],["楚將",-7,-0.6]],"beats":[{"t":"秦國大軍把趙國圍困在鉅鹿。楚軍的上將軍宋義卻停在半路四十六天，遲遲不肯前進。"},{"t":"項羽忍不住了，除掉宋義，自己帶領楚軍去救趙國。全軍渡過了漳河。","mv":[["項羽",-0.6,0.4],["楚兵",-1.6,1.4],["楚兵#2",0.6,1.6],["楚兵#3",1.6,0.8],["楚將",0.4,-0.8]]},{"who":"項羽","t":"把船通通弄沉！煮飯的鍋子全部打破！營房也燒掉！","fx":[["focus","項羽"],["fire",2.6,-2.4]]},{"who":"楚將","t":"將軍，這樣我們拿什麼煮飯？打輸了要怎麼回去？","fx":[["upset","楚將"]]},{"who":"項羽","t":"每個人只帶三天的乾糧。不打敗秦軍，誰也別想回去！","fx":[["cheer","項羽"]]},{"t":"楚兵們看著沉下去的船，知道只剩下一條路：往前衝！","fx":[["cheerAll","楚兵"],["burst","項羽","#e8b84f"]]}],"q":"項羽把船弄沉、把鍋打破，讓士兵知道沒有退路，只能拚命往前。這種下定決心、不留後路的做法，叫做什麼？","wrong":[{"w":"打退堂鼓","by":"楚兵","line":"打退堂鼓是半路想放棄。船都沉了，想退也沒地方退啦！"},{"w":"過河拆橋","by":"楚兵#2","line":"過河拆橋是得到好處就忘了幫過你的人。我們斷掉的不是別人的路，是自己的退路！"},{"w":"孤注一擲","by":"項羽","line":"孤注一擲是把所有本錢押在一次，意思有點接近，但常帶有冒險賭一把的味道。我是故意斷掉退路，讓大家拚命，有一個專門的成語。"}],"hint":"「釜」是古代煮飯的鍋子。","after":"楚兵個個以一當十，和秦軍打了九場仗，終於大敗秦軍。","lesson":{"title":"秦朝滅亡","text":"鉅鹿之戰後，秦軍主力投降了項羽。西元前 207 年，劉邦搶先打到咸陽附近，秦王子嬰出城投降，秦朝只維持了十五年就滅亡了。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十四章．大秦崩落","eps":[8,16,30,58]},{"key":"ch1","short":"楚漢戰場","era":"西元前 209–193 年","color":"#B5332E","map":{"ground":"#9cc06e","river":"#4f9fd8"},"intro":{"lines":["秦始皇統一天下，可是秦朝法律嚴苛、勞役又重，百姓過得很痛苦。","秦始皇死後第二年，陳勝、吳廣帶頭起義，各地紛紛起兵反秦。","楚國貴族出身的項羽力大無窮；沛縣小官出身的劉邦，很會用人。兩個人都帶兵反秦。","秦朝滅亡後，項羽和劉邦爭奪天下，打了四年，歷史上叫做「楚漢相爭」。","現在，我們要穿越回去，親眼看看這段歷史！"],"people":[["項羽","西楚霸王，力氣大、打仗勇猛"],["劉邦","後來的漢高祖，很會用人"],["韓信","劉邦的大將軍，最會帶兵"],["張良","劉邦的軍師，最會出計謀"]]},"stops":[{"id":"e17_06","yr":"西元前 207 年","place":"鉅鹿","scene":"walls","music":"battle","cast":[["項羽",-6.5,1.6],["楚兵",-7.5,2.4],["楚兵",-7.2,0.6],["各國將領",-1.8,-2.7,1.3],["各國將領",0,-2.7,1.3,1],["各國將領",1.8,-2.7,1.3],["秦兵",1.6,0.2],["秦兵",2.6,1],["秦兵",3.2,-0.4]],"beats":[{"t":"秦朝末年，各地起兵反秦。秦國大軍把趙國包圍在鉅鹿城，情況非常危急。","fx":[["focus","秦兵"]]},{"t":"各國派來的援軍有十幾座營壘，可是沒有一支軍隊敢出去和秦軍打。","fx":[["focus","各國將領"]]},{"who":"各國將領","t":"秦軍那麼多，出去就是送死啊！我們還是守在營裡吧。"},{"t":"楚軍的項羽帶兵渡過漳河，下令把船弄沉、把煮飯的鍋子打破，只帶三天的乾糧。","mv":[["項羽",-1.2,0.6],["楚兵",-2.3,1.3],["楚兵#2",-0.4,1.6]]},{"who":"項羽","t":"沒有退路了！要活命，就跟我衝！","fx":[["cheer","項羽"],["burst","項羽"]]},{"t":"楚兵個個以一當十，喊殺聲震天。各國將領站在營壘上，看得目瞪口呆。","mv":[["秦兵",3.4,0.8],["秦兵#2",4.4,1.6],["秦兵#3",4.6,-0.6]],"fx":[["upset","秦兵"]]}],"q":"各國軍隊站在營壘上看楚軍打仗，卻不出手幫忙。該用哪個成語形容他們？","wrong":[{"w":"坐井觀天","by":"各國將領","line":"我們站在營壘上，看得可清楚了，才不是坐在井底！"},{"w":"守株待兔","by":"各國將領","line":"我們又不是在等兔子撞樹……只是不敢出去而已。"},{"w":"一鼓作氣","by":"各國將領","line":"一鼓作氣衝上去的是項羽，我們可是一步都沒動！"}],"hint":"「壁」是軍營的圍牆。","after":"原來他們是站在牆上看戲。","lesson":{"title":"鉅鹿之戰","text":"西元前 207 年的鉅鹿之戰，項羽以少勝多，打敗秦軍主力。戰後各國將領來見項羽，都跪著用膝蓋走進來，不敢抬頭看他。從此項羽成了反秦聯軍的領袖。","next":"就在項羽和秦軍主力苦戰的時候，劉邦從另一條路，先打進了關中……"}},{"id":"e17_03","yr":"西元前 206 年","place":"漢中","scene":"mountain","music":"battle","cast":[["劉邦",-1.4,0.9],["韓信",5.5,1.2],["漢兵",2.5,-0.1],["漢兵",3.2,-0.8]],"beats":[{"t":"劉邦比項羽先打進關中，秦朝滅亡了。可是項羽兵多，自封「西楚霸王」，把劉邦封為漢王，趕到偏遠的漢中。"},{"who":"劉邦","t":"漢中都是高山，路這麼難走，項羽是要把我關在這裡啊……","fx":[["sad","劉邦"]]},{"t":"劉邦聽了張良的建議，一路燒掉身後懸在山壁上的棧道，讓項羽以為他不打算回來了。","fx":[["focus",null]]},{"t":"後來，劉邦拜韓信為大將軍。過了幾個月，韓信準備帶兵打回關中。","mv":[["韓信",1.2,0.9]]},{"who":"韓信","t":"守在關中的是秦朝降將章邯。他一定以為，我們要從棧道那邊出來……"},{"t":"其實，漢軍主力已經悄悄走上另一條小路，往陳倉前進。","mv":[["漢兵",6.5,-1],["漢兵#2",7.2,-1.8]]}],"q":"韓信的計策是：表面上走大家都知道的路，主力卻偷偷走小路繞到陳倉。這一招叫什麼？","wrong":[{"w":"守株待兔","by":"韓信","line":"坐著等章邯自己撞上來？那要等到天荒地老！"},{"w":"破釜沉舟","by":"韓信","line":"砸鍋沉船拚到底，那是項羽打鉅鹿的招數。我們要的是偷偷繞過去！"},{"w":"聲東擊西","by":"韓信","line":"聲東擊西是假裝打東邊、其實打西邊。我是暗中走小路偷偷過去，有另一個成語！"}],"hint":"「度」是越過，「陳倉」是一個地名。","after":"章邯完全沒想到，漢軍會從小路冒出來！","lesson":{"title":"還定三秦","text":"韓信從小路突襲陳倉，打敗章邯，很快就占領了關中。從此劉邦有了和項羽爭天下的根據地，楚漢相爭正式開始。小知識：史書只寫漢軍「從故道」偷襲；「明修棧道」是元朝戲曲加上去的說法。","next":"韓信接著打下魏、趙、燕、齊，越來越強大，連項羽都著急了……"}},{"id":"e17_07","yr":"西元前 203 年","place":"齊地","scene":"tent","music":"palace","cast":[["韓信",-1.1,0.6],["武涉",5.5,1.2]],"beats":[{"t":"韓信替劉邦打下好幾個國家，兵強馬壯，成了能左右天下的人。"},{"t":"項羽著急了，派說客武涉來見韓信。","mv":[["武涉",1.3,0.6]]},{"who":"武涉","t":"您幫漢王，漢王就贏；幫項王，項王就贏。不如自己獨立，和他們三分天下！"},{"who":"韓信","t":"我以前在項王那裡，只是拿著戟站崗的小官。我說的話，項王不聽；我出的計策，項王不用。","fx":[["focus","韓信"]]},{"who":"韓信","t":"漢王卻讓我當大將軍，給我幾萬兵馬……"}],"q":"劉邦不但讓韓信當大將軍，還把自己的衣服給他穿、食物讓給他吃。這份照顧，該用哪個成語？","wrong":[{"w":"自食其力","by":"韓信","line":"自食其力是靠自己養活自己，可是這衣服和飯是漢王給的呀。"},{"w":"豐衣足食","by":"韓信","line":"豐衣足食是說生活富足。漢王是把自己的衣服和飯讓給我！"},{"w":"雪中送炭","by":"韓信","line":"雪中送炭是在別人困難時幫忙。漢王把身上的衣服、碗裡的飯都讓給我，有更貼切的成語喔！"}],"hint":"「解」是脫下，「推」是讓給別人。","after":"被這樣照顧過，韓信不肯背叛劉邦。","lesson":{"title":"韓信的選擇","text":"韓信拒絕了武涉。後來謀士蒯通也勸他自立為王，韓信還是不忍心背叛劉邦，繼續替漢軍作戰。這時候楚漢雙方打得難分難解，劉邦身邊還有一位重要的軍師……","next":"那位軍師很少上戰場，卻常常決定了戰爭的勝負。"}},{"id":"e17_04","yr":"楚漢相爭","place":"漢軍軍帳","scene":"tent","music":"palace","table":true,"cast":[["張良",-1.3,0.7],["劉邦",5.5,1.2]],"beats":[{"t":"張良是韓國貴族的後代，身體不好，很少親自帶兵打仗。"},{"t":"他常常待在劉邦身邊，在軍帳裡用小竹籤排兵布陣。","fx":[["say","張良"]]},{"t":"這一天，劉邦又走進軍帳。","mv":[["劉邦",1.5,0.9]]},{"who":"劉邦","t":"子房，你看下一步怎麼走？"},{"who":"張良","t":"大王請看，這裡要守住，這裡可以派兵……"}],"q":"張良不用上戰場，在軍帳裡出計謀，千里外的漢軍就打贏了。劉邦會用哪個成語稱讚他？","wrong":[{"w":"按兵不動","by":"張良","line":"按兵不動是先不出兵。我可是一直在算怎麼打呢！"},{"w":"紙上談兵","by":"張良","line":"紙上談兵是趙括那種只會講、一打就輸。我的計畫可是讓漢軍打贏了！"},{"w":"料事如神","by":"張良","line":"料事如神是說預料得很準。我是在軍帳裡籌畫作戰，還有更貼切的說法！"}],"hint":"「帷幄」就是軍帳。","after":"人在帳篷裡，卻能決定千里外的勝負！","lesson":{"title":"漢初三傑","text":"「運籌帷幄之中，決勝千里之外」是劉邦當上皇帝以後說的話。他說自己能得天下，是因為會用三個人：出計謀的張良、管後勤的蕭何、會打仗的韓信。後人叫他們「漢初三傑」。","next":"楚漢兩軍打了好幾年，最後在廣武山隔著山谷對峙……"}},{"id":"e17_08","yr":"西元前 203 年","place":"廣武山","scene":"valley","music":"battle","cast":[["項羽",-5.6,-2.6,0.25],["楚兵",-6.6,-3.4,0.25],["楚兵",-4.8,-3.6,0.25],["劉邦",5.6,-2.6,0.25],["漢兵",6.6,-3.4,0.25],["漢兵",4.8,-3.6,0.25]],"beats":[{"t":"楚漢兩軍在廣武山對峙，中間隔著一條深深的山澗，誰也過不去。"},{"t":"仗打了好幾年，年輕人苦於打仗，老人家累於搬運糧草，百姓都受不了了。"},{"t":"這一天，項羽走到山澗邊。","mv":[["項羽",-2.3,-0.6],["楚兵",-3.3,-1.6],["楚兵#2",-1.6,-1.8]]},{"who":"項羽","t":"天下亂了這麼多年，都是因為我們兩個人！","fx":[["upset","項羽"]]},{"t":"劉邦也走到對面的山澗邊。","mv":[["劉邦",2.3,-0.6],["漢兵",3.3,-1.6],["漢兵#2",1.6,-1.8]]}],"q":"項羽隔著山谷對劉邦大喊，要兩個人單挑、分出勝負。他會怎麼喊？","wrong":[{"w":"相敬如賓","by":"項羽","line":"我是要跟他打一架，不是要對他客客氣氣！"},{"w":"同舟共濟","by":"劉邦","line":"跟你同坐一條船、互相幫忙？項羽才沒這麼好心！"},{"w":"不分軒輊","by":"項羽","line":"不分軒輊是說差不多、分不出高下。我就是要分出高下啊！"}],"hint":"「雌雄」在這裡比喻勝負。","after":"劉邦笑著回答：「我寧願鬥智，不跟你鬥力。」","lesson":{"title":"廣武對峙","text":"劉邦不肯單挑，還在陣前數落項羽的十大罪狀，結果被楚軍埋伏的弓弩射中胸口。後來兩軍講和，約好以鴻溝為界，平分天下。","next":"項羽退兵了，可是劉邦聽了張良、陳平的建議，追了上去……"}},{"id":"e17_01","yr":"西元前 202 年","place":"垓下","scene":"night","music":"night","winSad":"項羽","cast":[["項羽",-0.8,0.4],["虞姬",0.8,0.5],["韓信",6.5,-2.6],["漢兵",-6.6,-4.8],["漢兵",-4,-6.8],["漢兵",0,-7.2],["漢兵",4,-6.8],["漢兵",6.2,-5.4]],"beats":[{"t":"劉邦撕毀約定，追擊退兵的楚軍。韓信也帶著大軍趕到。","mv":[["韓信",4.2,-2.6]]},{"t":"楚軍被層層包圍在垓下，兵越來越少，糧食也吃完了。","mv":[["漢兵",-3.6,-2.8],["漢兵#2",-2,-3.8],["漢兵#3",0,-4.2],["漢兵#4",2,-3.8],["漢兵#5",3.2,-3.4]]},{"t":"夜裡，四面八方的漢軍營中，都傳來楚國家鄉的歌聲。","fx":[["focus","項羽"]]},{"who":"項羽","t":"漢軍已經把楚地都占領了嗎？為什麼楚國人這麼多？","fx":[["sad","項羽"]]},{"who":"虞姬","t":"大王……"}],"q":"項羽以為楚國已經被占領，覺得身邊沒有人能幫他了。這種處境叫什麼？","wrong":[{"w":"載歌載舞","by":"項羽","line":"唱歌跳舞？我都快哭出來了！"},{"w":"草木皆兵","by":"項羽","line":"草木皆兵是嚇到把草木都看成敵兵，那是後來苻堅的故事！"},{"w":"十面埋伏","by":"韓信","line":"十面埋伏是後人給這場戰役取的曲名。項王現在的心情，是聽到家鄉的歌，覺得孤立無援。"}],"hint":"四周傳來的，是哪一國的歌？","after":"連家鄉的歌都從敵營傳來，項羽一定很絕望。","lesson":{"title":"漢朝建立","text":"項羽在帳中唱了〈垓下歌〉：「力拔山兮氣蓋世」，然後連夜突圍。到了烏江邊，他覺得沒臉回去見江東父老，就自殺了。西元前 202 年，劉邦當上皇帝，建立漢朝，他就是漢高祖。","next":"天下太平了。有一天，漢高祖找韓信聊天……"}},{"id":"e17_02","yr":"漢朝建立後","place":"長安","scene":"palace","music":"palace","cast":[["漢高祖",-1.1,0.6],["韓信",5.5,1.2]],"beats":[{"t":"漢朝建立後，漢高祖擔心韓信太強大，把他從楚王降為淮陰侯，留在京城。"},{"t":"有一天，漢高祖找韓信聊天，談到各個將領能帶多少兵。","mv":[["韓信",1.3,0.6]]},{"who":"漢高祖","t":"像我這樣，能帶多少兵？"},{"who":"韓信","t":"陛下最多帶十萬。"},{"who":"漢高祖","t":"那你呢？","fx":[["upset","漢高祖"]]}],"q":"漢高祖不服氣地問：「那你呢？」韓信很有自信，他會用哪個成語回答？","wrong":[{"w":"多此一舉","by":"韓信","line":"多帶兵怎麼會是多此一舉？兵越多，我越能發揮！"},{"w":"寡不敵眾","by":"韓信","line":"寡不敵眾是人少打不過人多。我說的是我能帶很多兵！"},{"w":"綽綽有餘","by":"韓信","line":"綽綽有餘是說很夠用。陛下問我能帶多少兵，我的答案是越多越好！"}],"hint":"「益」是更加的意思。","after":"漢高祖笑說：「那你怎麼會被我抓住？」韓信說：「陛下不會帶兵，卻很會帶將領。」","lesson":{"title":"會帶兵，也要會帶將","text":"韓信最會指揮軍隊；漢高祖自己打仗不算厲害，卻懂得讓張良、蕭何、韓信各自發揮長處。後來韓信被呂后設計殺害。這位不世出的名將，結局讓人感嘆。","next":"漢高祖死後，兒子漢惠帝即位。替漢朝訂下法令的丞相蕭何，也過世了……"}},{"id":"e17_05","yr":"西元前 193 年","place":"長安．相府","scene":"office","music":"palace","cast":[["曹參",-1,0.6],["漢惠帝",5.5,1.2]],"beats":[{"t":"蕭何過世後，由曹參接任相國。"},{"t":"曹參上任以後，一條法令都沒改，每天喝酒。有人想來提意見，他就請人喝酒，讓人開不了口。","fx":[["cheer","曹參"]]},{"t":"漢惠帝覺得很奇怪，把曹參找來問話。","mv":[["漢惠帝",1.4,0.6]]},{"who":"曹參","t":"陛下覺得，您和高帝比，誰比較英明？"},{"who":"漢惠帝","t":"我怎麼敢和先帝比！"},{"who":"曹參","t":"那麼，我和蕭何比，誰比較能幹？"},{"who":"漢惠帝","t":"你好像比不上他。"}],"q":"曹參說：「我比不上蕭何，照著他的規矩做就好。」百姓也過得很安定。這叫什麼？","wrong":[{"w":"改頭換面","by":"曹參","line":"我一條法令都沒改呀！"},{"w":"青出於藍","by":"曹參","line":"青出於藍是學生比老師強。我可沒說我比蕭何強！"},{"w":"墨守成規","by":"曹參","line":"墨守成規是死守舊規矩、不懂變通，是在罵人。蕭何的法令很好，我照著做是對的！"}],"hint":"這個成語裡，就藏著兩位相國的姓。","after":"好的規矩繼續用，也是一種智慧。","lesson":{"title":"休養生息","text":"曹參當了三年相國，百姓唱歌稱讚：蕭何訂的法令清楚整齊，曹參守著不改，大家都過得安寧。漢朝初年讓百姓休養生息，國力慢慢恢復，後來才有「文景之治」。","next":"楚漢爭霸這一章完成了！回到地圖，挑戰終點，或前往下一章「漢朝人物」。"}}],"line":"history","name":"楚漢爭霸","title":"第十五章．楚漢爭霸","eps":[17]},{"key":"h14","line":"history","name":"楚漢逐鹿","short":"楚漢相爭","era":"西元前 206–202 年","color":"#B8552B","map":{"ground":"#a6bf72","river":"#4f9fd8"},"intro":{"lines":["秦朝滅亡後，起兵反秦的英雄們，開始爭奪天下。","力大無窮的項羽自稱「西楚霸王」；很會用人的劉邦，被封為「漢王」。","從西元前 206 年到 202 年，兩人打了四年多，歷史上叫做「楚漢相爭」。","這一章要跟著劉邦、項羽、韓信，看他們怎麼收服人心、怎麼用人打仗！"],"people":[["劉邦","漢王，很會用人，後來的漢高祖"],["項羽","西楚霸王，打仗勇猛無比"],["韓信","劉邦的大將軍，用兵如神"],["蒯通","很會說話的謀士，勸韓信三分天下"]]},"stops":[{"id":"e09_07","yr":"西元前 206 年","place":"霸上．漢軍營外","scene":"palace","music":"palace","cast":[["劉邦",-0.6,0.2],["父老",6.6,0.8],["父老",7.2,1.6],["百姓",7.8,0.2]],"beats":[{"t":"劉邦比項羽先打進關中，秦王子嬰投降了。劉邦走進秦宮，看到滿屋子的寶物，本來很想住下來。"},{"t":"樊噲和張良勸他別這樣。劉邦把宮裡的倉庫封好，回到霸上紮營。"},{"t":"劉邦把各縣的老人家和地方上有名望的人，都請了過來。","mv":[["父老",1.4,0.4],["父老#2",2.4,1.2],["百姓",2.8,-0.4]]},{"who":"劉邦","t":"各位被秦朝嚴苛的法律害苦很久了。隨便說錯一句話，就可能被判重罪。","fx":[["say","劉邦"]]},{"who":"劉邦","t":"我和大家約定：法律只留三條！殺人的要償命，傷人和偷東西的依罪處罰。其他秦朝的法律，全部廢除！","fx":[["focus","劉邦"]]},{"t":"老人家們你看我、我看你，都不敢相信自己的耳朵。","fx":[["upset","父老"]]}],"q":"劉邦和百姓約定，只留下三條簡單的法律。這件事變成哪個成語？現在也用來指事先講好要遵守的規則。","wrong":[{"w":"三心二意","by":"父老","line":"三心二意是猶豫不決、拿不定主意。沛公說話乾脆得很！"},{"w":"無法無天","by":"百姓","line":"無法無天是什麼法都不管、胡作非為。沛公是留下簡單的法律，可不是不要法律！"},{"w":"三令五申","by":"父老#2","line":"三令五申是一再命令、反覆叮嚀，雖然也有「三」，意思也和規定有關！不過沛公是只留三條法律，有一個專門的成語。"}],"hint":"「章」在這裡是「條」的意思。","after":"秦地百姓高興極了，爭著送來牛羊酒肉。劉邦卻不肯收：「倉庫裡糧食很多，不想讓大家破費。」","lesson":{"title":"收服人心","text":"劉邦用簡單的法律取代秦朝嚴苛的法令，秦地的百姓都希望他留下來當關中王。這份民心，是劉邦後來能贏得天下的重要原因。","next":"一個多月後，項羽也帶著四十萬大軍進了關中……"}},{"id":"e16_08","yr":"西元前 206 年","place":"咸陽","scene":"palace","music":"night","cast":[["項羽",-0.6,0.4],["說客",6.6,0.8],["楚兵",1.8,-0.6],["楚兵",2.8,0.4]],"beats":[{"t":"項羽帶兵進入咸陽，殺了已經投降的秦王子嬰，又放火燒了秦朝的宮殿。大火燒了三個月都沒有熄滅。","fx":[["fire",-1.6,-3],["fire",1.8,-3.2]]},{"t":"項羽把搶來的寶物裝上車，準備往東回家鄉。","fx":[["prop","cart",3.2,-1.4,0],["cheerAll","楚兵"]]},{"t":"有一個說客跑來勸項羽。","mv":[["說客",1.2,0.6]]},{"who":"說客","t":"關中四面有高山大河保護，土地又肥沃。大王在這裡建都，就能稱霸天下！"},{"who":"項羽","t":"宮殿都燒壞了。再說，富貴了卻不回故鄉，就像穿著漂亮衣服在夜裡走路，誰看得到呢？","fx":[["cheer","項羽"]]},{"t":"說客走出來，搖搖頭，小聲嘀咕……","mv":[["說客",3.6,1.4]],"fx":[["focus","說客"]]}],"q":"說客私下笑說：「人家說楚國人就像獼猴戴上帽子，看起來像個人，其實沒有見識，果然沒錯！」這句話變成哪個成語？","wrong":[{"w":"衣錦還鄉","by":"項羽","line":"衣錦還鄉是穿著華麗的衣服回故鄉……這正是我想做的！可是說客說的是猴子戴帽子，可不是在稱讚我。"},{"w":"殺雞儆猴","by":"楚兵","line":"殺雞儆猴是處罰一個人來警告別人。這裡的猴子可沒被嚇到，牠是戴上了帽子！"},{"w":"虛有其表","by":"說客","line":"虛有其表是外表好看、裡面空空的，意思很接近！不過我說的是猴子戴帽子，有一個專門的成語。"}],"hint":"「沐猴」就是獼猴，「冠」在這裡是戴帽子。","after":"項羽聽到這句話，非常生氣，就把這個說客處死了。","lesson":{"title":"錯過關中","text":"項羽放棄了關中，回到東方的彭城建都，自稱「西楚霸王」。他把劉邦封到偏遠的漢中，沒想到關中這塊好地方，後來反而成了劉邦的根據地。","next":"話說回來，項羽剛進關中的時候，聽說劉邦想稱王，氣得差點出兵攻打他。劉邦是怎麼躲過這一劫的呢？"}},{"id":"e42_04","yr":"西元前 206 年","place":"霸上．劉邦軍帳","scene":"tent","music":"night","cast":[["劉邦",1.2,0.2],["張良",-6.5,0.8],["項伯",-7.2,1.4]],"beats":[{"t":"項羽聽說劉邦想當關中王，下令明天一早就攻打劉邦。項羽有四十萬大軍，劉邦只有十萬。"},{"t":"項羽的叔叔項伯是張良的老朋友，他連夜騎馬趕來，要張良快逃。張良不肯丟下劉邦，帶他去見劉邦。","mv":[["張良",-1.4,0.4],["項伯",-0.2,1]]},{"t":"劉邦舉起酒杯敬項伯，還約定兩家要結成兒女親家。","fx":[["say","劉邦"]]},{"who":"劉邦","t":"我進了關中，連一根細毛都不敢碰。我登記了官吏百姓的名冊，封好倉庫，就是在等項將軍來啊！","fx":[["focus","劉邦"]]},{"who":"劉邦","t":"派兵守住關口，是為了防備盜賊。我日夜盼著將軍來，怎麼敢反叛呢？"},{"who":"項伯","t":"原來是這樣……","fx":[["focus","項伯"]]}],"q":"劉邦說，他進關後連秋天鳥獸身上新長的細毛都不敢碰，一點也沒有侵占百姓和秦宮的東西。後來形容軍紀嚴明、不拿百姓一點東西，叫做什麼？","wrong":[{"w":"趁火打劫","by":"項伯","line":"趁火打劫是趁人危急去搶東西。沛公剛好相反，什麼都沒拿！"},{"w":"毛手毛腳","by":"張良","line":"毛手毛腳是做事粗心、亂碰東西。沛公可是連一根細毛都不碰呢！"},{"w":"路不拾遺","by":"劉邦","line":"路不拾遺是東西掉在路上也沒人撿走，形容社會風氣好，意思有點接近！不過形容軍隊不拿百姓東西，有一個專門的成語。"}],"hint":"「秋毫」是秋天鳥獸新長出來的細毛。","after":"項伯答應回去替劉邦說好話，還叫劉邦第二天一早親自去向項羽道歉。","lesson":{"title":"鴻門宴","text":"第二天，劉邦到鴻門見項羽。宴會上，謀士范增叫項莊舞劍，想趁機刺殺劉邦，項伯也拔劍起舞，用身體護住劉邦。後來樊噲闖進來替劉邦說話，劉邦找機會溜回了軍營。","next":"後來劉邦被封到漢中，又打回關中。這時候，原本跟著劉邦的魏王豹，卻背叛了他……"}},{"id":"e30_03","yr":"西元前 205 年","place":"滎陽．漢王軍帳","scene":"tent","music":"palace","table":true,"cast":[["劉邦",1.2,0.2],["酈食其",-6.6,0.8],["韓信",6.8,1.2]],"beats":[{"t":"西元前 205 年，劉邦在彭城被項羽打得大敗。魏王豹趁機背叛劉邦，回到了魏國。"},{"t":"劉邦派能說善道的酈食其去勸魏王豹回來，還答應封他一萬戶的土地。"},{"t":"過了些日子，酈食其回來了，一進門就搖搖頭。","mv":[["酈食其",-1,0.6]],"fx":[["sad","酈食其"]]},{"who":"酈食其","t":"魏王豹不肯聽。"},{"who":"劉邦","t":"那魏國的大將是誰？","fx":[["focus","劉邦"]]},{"who":"酈食其","t":"叫做柏直。"},{"t":"劉邦一聽，哈哈大笑起來。","fx":[["cheer","劉邦"]]}],"q":"劉邦笑說：「柏直嘴上的奶味都還沒乾，年輕又沒經驗，怎麼擋得住韓信！」這種譏笑人年輕不懂事的說法，叫做什麼？","wrong":[{"w":"老成持重","by":"酈食其","line":"老成持重是經驗多、做事穩重。大王是在笑柏直太嫩了，剛好相反！"},{"w":"德高望重","by":"劉邦","line":"德高望重是品德好、名望高的人。柏直？他還差得遠呢！"},{"w":"少不更事","by":"韓信","line":"少不更事是年輕、經歷的事不多，意思很接近！不過大王說的是「嘴上的奶味」，有一個專門的成語。"}],"hint":"「臭」在這裡讀ㄒㄧㄡˋ，是氣味的意思。","after":"劉邦又問魏國的騎兵將、步兵將是誰，聽了都說比不上灌嬰和曹參。他放心地說：「我沒什麼好擔心的了！」","lesson":{"title":"韓信破魏","text":"韓信帶著曹參、灌嬰出兵，很快就抓到魏王豹，平定了魏地。據《史記》記載，韓信用木桶當浮具，從夏陽偷偷渡過黃河，打了魏軍一個措手不及。","next":"打下魏國後，韓信繼續往東攻打趙國。趙國號稱有二十萬大軍，守在井陘口……"}},{"id":"e21_07","yr":"西元前 204 年","place":"井陘口．河邊","scene":"river","music":"battle","winSad":"陳餘","cast":[["韓信",-1.6,0.4],["漢兵",-0.6,1.2],["漢兵",-2.2,-0.6],["漢兵",0.4,-0.4],["陳餘",6.6,-1.6],["趙兵",7.2,-0.6],["趙兵",7.6,-2.4],["趙兵",6.8,0.6]],"beats":[{"t":"韓信只有幾萬兵，趙國卻在井陘口集結了號稱二十萬的大軍。"},{"t":"半夜，韓信先派兩千名騎兵，每人拿一面紅旗，偷偷躲到趙軍大營旁邊的山上。"},{"t":"天亮後，韓信又讓一萬人走到河邊，背對著河水排好陣勢。","mv":[["漢兵",-0.4,-1.4],["漢兵#2",-1.6,-1.6],["漢兵#3",0.8,-1.8]]},{"who":"陳餘","t":"哈哈！背對河水擺陣，連退路都沒有，韓信根本不懂兵法！","mv":[["陳餘",3.6,-1.2]],"fx":[["cheerAll","趙兵"]]},{"t":"趙軍全部衝出大營攻打漢軍。漢兵後面就是河，沒地方逃，只好拚命作戰。","mv":[["趙兵",1.8,-0.6],["趙兵#2",2.4,-1.8],["趙兵#3",2.2,0.6]]},{"t":"這時，躲在山上的兩千騎兵衝進空空的趙營，插滿了漢軍的紅旗！","fx":[["burst","韓信","#d84a3a"],["focus","韓信"]]}],"q":"漢軍背後就是河水，沒有退路，只能拚盡全力和敵人決一死戰。這種做法叫做什麼？","wrong":[{"w":"臨陣脫逃","by":"漢兵","line":"臨陣脫逃是打仗時偷偷逃跑。後面就是河，想逃也逃不了！"},{"w":"隔岸觀火","by":"陳餘","line":"隔岸觀火是在對岸看熱鬧，不出手幫忙。我們可是衝出大營去打了！"},{"w":"破釜沉舟","by":"韓信","line":"破釜沉舟也是不留退路，意思很接近，那是項羽在鉅鹿的故事！我是背對河水排陣，有一個專門的成語。"}],"hint":"漢軍的背後是什麼？","after":"趙兵回頭一看，大營裡全是漢軍的紅旗，以為大營被占了，一下子就亂成一團。漢軍前後夾攻，大破趙軍。","lesson":{"title":"置之死地而後生","text":"戰後將領們問韓信：兵法說背水擺陣是大忌，為什麼還能贏？韓信說：兵法也說「陷之死地而後生」，把士兵放在沒有退路的地方，他們才會拚命。","next":"這時候，項羽把劉邦圍在滎陽一帶，打得很緊。劉邦派人去勸項羽手下的猛將英布……"}},{"id":"e42_05","yr":"西元前 204 年","place":"漢王軍中","scene":"tent","music":"palace","cast":[["劉邦",1.4,-0.6],["英布",-6.6,0.8],["侍從",6.8,1.2],["侍從",7.4,0.2]],"beats":[{"t":"英布是項羽手下的猛將。他年輕時臉上被刺過字，所以大家也叫他「黥布」。"},{"t":"劉邦派隨何去勸他，英布終於決定離開項羽，來投靠劉邦。","mv":[["英布",-0.8,0.6]]},{"t":"沒想到，劉邦竟然坐在床邊洗腳，就這樣召見他！","fx":[["focus","劉邦"]]},{"who":"英布","t":"我好歹也是一國之王，竟然這樣對我！早知道就不來了！","fx":[["upset","英布"]]},{"t":"英布氣呼呼地回到自己的住處。","mv":[["英布",-1.6,-0.6]]},{"t":"一進門，他愣住了：帳子、飯菜、侍從，全都和漢王用的一模一樣！","mv":[["侍從",0.6,0.4],["侍從#2",1.6,1]],"fx":[["focus","英布"]]}],"q":"英布本來以為會被看不起，沒想到受到這麼好的招待，結果比原本期望的還要好，高興得不得了。這叫做什麼？","wrong":[{"w":"大失所望","by":"英布","line":"大失所望是希望落空、非常失望。剛剛看到洗腳那一下是這樣，可是現在不一樣啦！"},{"w":"喜新厭舊","by":"侍從","line":"喜新厭舊是喜歡新的、討厭舊的。英布大王是開心被好好招待，不是換新歡喔！"},{"w":"喜出望外","by":"劉邦","line":"喜出望外也是遇到意外的好事很開心，意思幾乎一樣！不過《史記》寫英布的心情時，用的是另一個成語。"}],"hint":"高興的程度，「超過」了原本的「期望」。","after":"有人說，劉邦是故意先挫挫英布的傲氣，再用厚禮收服他。英布高高興興地留下來，替劉邦對抗項羽。","lesson":{"title":"淮南王英布","text":"英布後來被封為淮南王，和韓信、彭越一起，成了劉邦打敗項羽的三大猛將。漢朝建立後，英布起兵反叛，最後被打敗。","next":"這時候，韓信已經打下了齊國，手上的兵越來越多。有一位齊國的謀士，想勸韓信做一件大事……"}},{"id":"e29_03","yr":"西元前 203 年","place":"齊地．韓信軍帳","scene":"tent","music":"night","cast":[["韓信",1.2,0.2],["蒯通",-6.6,0.8]],"beats":[{"t":"韓信打下齊國，當上了齊王。這時候，楚漢誰輸誰贏，就看韓信幫哪一邊。"},{"t":"齊國人蒯通——就是以前勸過武臣的那位謀士——假裝會看相，來見韓信。","mv":[["蒯通",-0.8,0.6]]},{"who":"蒯通","t":"看您的臉，最多只能封侯；看您的背，卻是貴不可言啊！","fx":[["say","蒯通"]]},{"who":"韓信","t":"這是什麼意思？","fx":[["focus","韓信"]]},{"who":"蒯通","t":"我願意打開心胸，把肝和膽都掏出來，獻上我的笨計策，只怕您不肯用。"},{"who":"蒯通","t":"不如楚漢兩邊都不幫，讓天下分成三份，像鼎的三隻腳一樣站穩，誰也不敢先動！","fx":[["focus","蒯通"]]}],"q":"蒯通說要「把肝和膽都掏出來」，表示他說的全是真心話。後來用肝和膽比喻朋友之間真心誠意、坦白相待，叫做什麼？","wrong":[{"w":"膽小如鼠","by":"韓信","line":"膽小如鼠是膽子小得像老鼠。蒯通敢來勸我自立，膽子可大得很！"},{"w":"提心吊膽","by":"蒯通","line":"提心吊膽是非常擔心害怕……嗯，我說這番話確實有點緊張。不過題目問的是真心相待喔！"},{"w":"推心置腹","by":"蒯通","line":"推心置腹也是真心誠意待人，意思很接近！不過我說的是肝和膽，有一個專門的成語。"}],"hint":"成語裡有兩個身體裡的器官。","after":"韓信說：「漢王對我那麼好，我怎麼能為了自己的好處背叛他呢？」","lesson":{"title":"三分天下的計策","text":"蒯通提出的「三分天下」，比三國時代諸葛亮的〈隆中對〉早了四百多年。韓信猶豫了很久，還是不忍心背叛劉邦。蒯通怕惹禍，就假裝發瘋，當起了巫師。","next":"同一年，楚漢兩軍在廣武對峙了好幾個月，最後講和，約好以鴻溝為界……"}},{"id":"e29_07","yr":"西元前 203 年","place":"鴻溝．漢軍營帳","scene":"tent","music":"battle","table":true,"cast":[["劉邦",1.2,0.2],["張良",-6.6,0.6],["陳平",-7.2,1.4],["漢兵",2.8,1.2]],"beats":[{"t":"楚漢打了好幾年。項羽的兵累了，糧食也快吃完了。"},{"t":"雙方講和：鴻溝以西歸漢，以東歸楚。項羽還放回了被他抓走的劉邦家人。"},{"t":"項羽帶著楚軍，往東撤退了。"},{"who":"劉邦","t":"好啦，仗打完了！大家收拾收拾，我們也回西邊吧！","fx":[["cheer","劉邦"],["cheer","漢兵"]]},{"t":"張良、陳平急忙走進軍帳。","mv":[["張良",-1,0.4],["陳平",-0.2,1.2]]},{"who":"張良","t":"大王，漢已經得到大半個天下，諸侯也都歸附我們了。"},{"who":"陳平","t":"楚軍又累又餓，這正是老天要滅亡楚國的時候啊！","fx":[["focus","陳平"]]}],"q":"張良、陳平說：「如果現在放過項羽，就像養了一隻老虎，將來反而給自己留下禍害。」這句話變成哪個成語？","wrong":[{"w":"狐假虎威","by":"劉邦","line":"狐假虎威是狐狸借老虎的威風嚇人。這裡沒有狐狸，只有一隻快餓扁的老虎！"},{"w":"虎頭蛇尾","by":"漢兵","line":"虎頭蛇尾是開頭很有氣勢，後來越來越沒力。張良先生是勸大王追到底，剛好相反！"},{"w":"放虎歸山","by":"陳平","line":"放虎歸山是把老虎放回山裡，留下後患，意思非常接近！不過我們說的原話是「養虎」，有一個專門的成語。"}],"hint":"「遺」是留下，「患」是禍害。","after":"劉邦聽了勸告，撕毀約定，回頭追擊項羽。","lesson":{"title":"鴻溝與楚河漢界","text":"鴻溝是戰國時魏國開鑿的運河，在今天的河南。中國象棋的棋盤中間寫著「楚河漢界」，據說就是從這段歷史來的喔！","next":"說回齊地的韓信。其實在蒯通之前，項羽就已經派說客武涉去拉攏他了……"}},{"id":"e58_05","yr":"西元前 203 年","place":"齊國王宮","scene":"palace","music":"palace","cast":[["韓信",1.2,0.2],["武涉",-6.6,0.8],["侍衛",2.8,1.4]],"beats":[{"t":"項羽派大將龍且帶兵救齊，卻被韓信打敗，龍且也戰死了。項羽開始害怕。"},{"t":"他派口才很好的武涉來到齊國，求見齊王韓信。","mv":[["武涉",-0.8,0.6]]},{"who":"武涉","t":"漢王這個人不可信。項王好幾次饒了他，他一脫身就背叛約定。","fx":[["say","武涉"]]},{"who":"武涉","t":"您能平安到今天，是因為項王還在。項王一被滅，下一個就輪到您了！"},{"t":"韓信沉默了一會兒。他想起當年在楚軍裡，只是拿著戟守門的小侍衛，提了好多建議，項王一次也沒採用。","fx":[["focus","韓信"],["sad","韓信"]]},{"who":"韓信","t":"漢王給我大將軍的官印，交給我幾萬兵馬，脫下衣服給我穿，把食物讓給我吃……"}],"q":"韓信說：「漢王對我說的話都聽，出的計謀都採用，所以我才有今天。」這種非常信任一個人的樣子，叫做什麼？","wrong":[{"w":"充耳不聞","by":"武涉","line":"充耳不聞是塞住耳朵什麼都不聽。項王以前對韓信才是這樣，漢王剛好相反！"},{"w":"唯唯諾諾","by":"侍衛","line":"唯唯諾諾是只會說「是、是」，一點主見都沒有。我們大王可是很有主見的！"},{"w":"百依百順","by":"韓信","line":"百依百順是什麼都順著別人，意思有點接近，但常用來說沒主見地順從。漢王是信任我才採用我的計謀，有一個更貼切的成語。"}],"hint":"「言」是說的話，「計」是計謀。","after":"韓信說：「漢王這麼信任我，背叛他是不吉祥的，就算死也不改變。請替我謝謝項王吧！」","lesson":{"title":"楚漢的關鍵人物","text":"《史記》原文是「言聽計用」，後來演變成這個成語。武涉和蒯通都看出韓信能左右天下，可是韓信兩次都選擇留在劉邦這一邊。","next":"西元前 202 年，項羽在垓下被漢軍重重包圍，帶著八百多名騎兵連夜突圍……"}},{"id":"e42_06","yr":"西元前 202 年","place":"東城．小山上","scene":"valley","music":"battle","cast":[["項羽",-4.4,-1,0.25],["楚騎兵",-5.2,-1.8,0.25],["楚騎兵",-3.6,-1.8,0.25],["漢兵",1.4,-0.4],["漢兵",2.4,0.6],["漢兵",0.6,-1.6],["漢兵",3,-1.2],["赤泉侯",6.8,0.8]],"beats":[{"t":"項羽從垓下突圍，一路被追。到了東城，身邊只剩二十八個騎兵，追來的漢軍卻有好幾千人。"},{"who":"項羽","t":"我起兵八年，打了七十多場仗，從來沒輸過！今天被困在這裡，是老天要亡我，不是我不會打仗！","fx":[["focus","項羽"],["upset","項羽"]]},{"t":"項羽把騎兵分成四隊，面向四方。接著大喊一聲，騎馬衝下山！","mv":[["項羽",-0.4,0.2,0],["楚騎兵",-1.2,-0.6,0],["楚騎兵#2",0.4,-1,0]]},{"t":"漢兵就像被大風吹倒的草一樣，紛紛向兩邊倒退躲開。","mv":[["漢兵",3.6,-0.8],["漢兵#2",4.6,1.2],["漢兵#3",2.6,-2.8],["漢兵#4",5.2,-1.8]],"fx":[["sadAll","漢兵"]]},{"t":"漢將赤泉侯追了上來。","mv":[["赤泉侯",1.6,0.6]]},{"t":"項羽瞪大眼睛，大喝一聲。赤泉侯連人帶馬嚇得倒退了好幾里！","mv":[["赤泉侯",6.6,1]],"fx":[["upset","赤泉侯"],["cheer","項羽"]]}],"q":"項羽衝到哪裡，漢軍就像被風吹倒的草一樣倒退躲開，沒有人擋得住他。這種力量強大、勢不可擋的樣子，叫做什麼？","wrong":[{"w":"寸步難行","by":"楚騎兵","line":"寸步難行是一步都走不動。我們大王衝到哪裡，路就開到哪裡！"},{"w":"不堪一擊","by":"赤泉侯","line":"不堪一擊是一打就垮。說的是誰？……好吧，剛剛確實是我們。可是題目問的是項羽的氣勢喔！"},{"w":"勢如破竹","by":"項羽","line":"勢如破竹也是形容力量強大、一路勝利，意思很接近！不過史書寫的是漢軍像草一樣被吹倒，有一個專門的成語。"}],"hint":"「披靡」是草木隨風倒下的樣子。","after":"項羽回頭問騎兵：「怎麼樣？」騎兵們都拜服地說：「真的像大王說的一樣！」","lesson":{"title":"霸王的結局","text":"項羽來到烏江邊，亭長要划船送他回江東。項羽說，當年帶八千江東子弟渡江，現在沒有一個人回來，沒臉再見家鄉父老。他留在烏江邊，結束了自己的生命，楚漢相爭也落幕了。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第十六章．楚漢逐鹿","eps":[9,16,21,29,30,42,58]},{"key":"h15","line":"history","name":"漢初新局","short":"西漢初年","era":"西元前 198–168 年","color":"#C7862F","map":{"ground":"#adc47c","river":"#4f9fd8"},"intro":{"lines":["西元前 202 年，劉邦打敗項羽，建立漢朝，他就是漢高祖。","經過多年戰爭，國家很窮，連皇帝都找不到四匹同樣顏色的馬來拉車。","漢高祖過世後，呂后掌權；後來漢文帝即位，生活節儉，又減輕百姓的負擔。","這一章，我們要看看漢朝初年的大臣們，怎麼讓國家慢慢強大起來！"],"people":[["漢高祖","劉邦當皇帝後的稱呼，漢朝的開國皇帝"],["漢文帝","節儉愛民的好皇帝"],["賈誼","年輕有才華的讀書人，常常上書給皇帝"],["鼂錯","漢文帝的大臣，關心邊防和農民"]]},"stops":[{"id":"e58_06","yr":"約西元前 198 年","place":"長安．朝廷","scene":"office","music":"palace","cast":[["漢高祖",1.2,-0.6],["周昌",-6.6,0.8],["大臣",2.8,1],["呂后",6.4,-2.6,0,null,1]],"beats":[{"t":"漢高祖很寵愛戚夫人，想廢掉呂后生的太子劉盈，改立戚夫人的兒子如意當太子。"},{"t":"大臣們紛紛反對。反對得最激烈的，是御史大夫周昌。","mv":[["周昌",-0.8,0.4]]},{"t":"周昌說話本來就結巴，這時候又氣得不得了。","fx":[["upset","周昌"]]},{"who":"漢高祖","t":"你倒是說說看，為什麼不行？"},{"who":"周昌","t":"臣……臣嘴巴不會說話，可是臣期……期……期知道，這樣不可以！","fx":[["focus","周昌"]]},{"who":"周昌","t":"陛下就、就算要廢太子，臣期……期……也不接受命令！"},{"t":"這時，呂后正躲在旁邊的房間裡，偷偷聽著。","mv":[["呂后",5,-2.4]],"fx":[["focus","呂后"]]}],"q":"周昌一緊張就結結巴巴，「期、期、期」地說不出話來。後來形容人說話結結巴巴、不流利，叫做什麼？","wrong":[{"w":"口若懸河","by":"大臣","line":"口若懸河是說話像瀑布一樣滔滔不絕。周大夫剛好相反！"},{"w":"能言善道","by":"周昌","line":"能、能言善道是很、很會說話。臣……臣不是這樣啦！"},{"w":"吞吞吐吐","by":"漢高祖","line":"吞吞吐吐是有話不敢直說，聽起來有點像！可是周昌不是不敢說，他是很敢說，只是說得結結巴巴。"}],"hint":"成語的前兩個字，就是周昌結巴時的口頭禪。","after":"漢高祖聽了哈哈大笑，暫時不提廢太子的事。退朝後，呂后跪下來向周昌道謝：「要不是您，太子就被廢了。」","lesson":{"title":"期期與艾艾","text":"「期期」來自漢朝的周昌；「艾艾」來自三國時代的鄧艾，他也口吃，一說到自己的名字就「艾、艾」個不停。兩個口吃的故事，後人合成了一個成語。","next":"這時候，替漢朝打下半個天下的韓信，已經被呂后設計殺害了。聽說韓信死前，喊著一個人的名字……"}},{"id":"e29_04","yr":"西元前 196 年","place":"長安．皇宮","scene":"palace","music":"palace","cast":[["漢高祖",1.2,-0.2],["蒯通",-6.6,0.8],["衛兵",-7.2,1.6],["衛兵",-7.6,0.2]],"beats":[{"t":"韓信死前說：「真後悔沒聽蒯通的計策！」漢高祖平亂回來聽說了，派人把蒯通抓來。","mv":[["蒯通",-0.6,0.4],["衛兵",-1.6,1.2],["衛兵#2",-1.8,-0.4]]},{"who":"漢高祖","t":"是你教韓信造反的嗎？","fx":[["upset","漢高祖"]]},{"who":"蒯通","t":"沒錯，是我教的。可惜那小子不聽我的，才落得這個下場。"},{"who":"漢高祖","t":"好大的膽子！拖下去處死！","fx":[["focus","漢高祖"]]},{"who":"蒯通","t":"冤枉啊！陛下聽我說：秦朝好比丟了一頭鹿，天下的英雄都跑去追牠……","fx":[["say","蒯通"]]}],"q":"蒯通說：「天下英雄一起追鹿，結果本事高、跑得快的人先抓到。」後來比喻行動快的人先達到目的，叫做什麼？","wrong":[{"w":"坐失良機","by":"衛兵","line":"坐失良機是坐著讓好機會溜走。陛下可是跑最快、先抓到鹿的人！"},{"w":"指鹿為馬","by":"蒯通","line":"指鹿為馬是秦朝趙高硬把鹿說成馬，欺騙皇帝。我說的鹿是比喻天下，可沒有亂指喔！"},{"w":"近水樓臺","by":"漢高祖","line":"近水樓臺是靠得近的人先得到好處，有點接近！不過蒯通說的是「跑得快」的人先抓到鹿，不是「靠得近」。"}],"hint":"「捷」是快，「足」是腳。","after":"蒯通又說：「那時候我只認識韓信，不認識陛下呀！想搶天下的人那麼多，難道全都要處死嗎？」漢高祖說：「放了他吧。」","lesson":{"title":"逐鹿中原","text":"蒯通把天下比作一頭鹿，後來就有了「逐鹿中原」這個成語，比喻大家爭奪天下。靠著這番話，原本要被處死的蒯通撿回了一條命。","next":"漢高祖過世後，呂后掌權。等到呂后也過世了，大臣們迎接一位新皇帝……"}},{"id":"e41_06","yr":"西元前 179 年","place":"長安．朝廷","scene":"office","music":"palace","cast":[["漢文帝",1.2,-0.6],["周勃",-1,0.4],["陳平",-6.6,1]],"beats":[{"t":"呂后過世後，周勃、陳平等大臣平定了呂氏家族，迎接代王劉恆當皇帝，就是漢文帝。"},{"t":"周勃功勞最大，當上右丞相；陳平當左丞相。","mv":[["陳平",-2.2,-0.6]]},{"who":"漢文帝","t":"周丞相，全國一年要審判多少案子？","fx":[["focus","漢文帝"]]},{"who":"周勃","t":"臣……不知道。","fx":[["sad","周勃"]]},{"who":"漢文帝","t":"那全國一年收進、花掉多少錢和糧食？"},{"t":"周勃又答不出
