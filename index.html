做官，杜密和李膺也在這場災禍中被害。","next":"黨錮之禍以前，李膺名聲最響亮。這一天，一個十歲的孩子來敲李家的大門……"}},{"id":"e20_08","yr":"約西元 163 年","place":"洛陽李膺家","scene":"office","music":"palace","cast":[["李膺",0.4,-0.6],["小孔融",6.6,1.2],["門吏",4.0,1.6],["陳韙",-6.6,0.0],["賓客",2.6,-1.0]],"beats":[{"t":"李膺名氣很大，只有很有才華的人或親戚，守門的人才會讓他進門。十歲的孔融跟著爸爸來到洛陽。"},{"who":"小孔融","t":"我是李大人的親戚！","mv":[["小孔融",2.6,1.4]]},{"t":"守門的人通報後，孔融走進大廳坐下。","mv":[["小孔融",1.4,0.6]]},{"who":"李膺","t":"你跟我是什麼親戚呀？","fx":[["upset","李膺"]]},{"who":"小孔融","t":"我的祖先孔子，曾經向您的祖先老子請教學問。所以我們兩家，代代都是好朋友啊！","fx":[["cheer","小孔融"]]},{"t":"滿屋子的客人都很驚奇。這時大夫陳韙晚到，聽說了這件事，很不以為然。","mv":[["陳韙",-1.2,0.0]],"fx":[["focus","陳韙"]]},{"who":"陳韙","t":"哼，小時候聰明伶俐，長大以後不一定有出息！"}],"q":"陳韙取笑孔融，說他小時候很聰明，長大不一定好。這句話的前半句，後來變成哪個成語？","wrong":[{"w":"大器晚成","by":"賓客","line":"大器晚成是有才能的人比較晚才成功。陳大夫說的是小時候聰明喔！"},{"w":"少不更事","by":"李膺","line":"少不更事是年紀小、不懂事。孔融可是懂事得很，說得大家都愣住了！"},{"w":"聰明伶俐","by":"陳韙","line":"聰明伶俐是說人很聰明，有點接近！不過我那句話專門說「小時候」聰明，有一個專門的成語。"}],"hint":"「了了」讀ㄌㄧㄠˇ ㄌㄧㄠˇ，是聰明懂事。","after":"孔融馬上回答：「想必您小時候，一定很聰明吧！」意思是：您現在大概不怎麼樣。陳韙尷尬得說不出話。","lesson":{"title":"《世說新語》","text":"這個故事記在南朝的《世說新語》，書裡收集了很多漢末到晉朝名人的小故事。不過李膺當上司隸校尉，可能是幾年後的事，所以年代不一定完全準確。","next":"東漢末年，還有一對一起讀書的好朋友，後來卻因為一片金子和一輛馬車分開了……"}},{"id":"e10_05","yr":"東漢末年","place":"菜園與書房","scene":"south","music":"map","cast":[["管寧",-0.8,0.4],["華歆",1.0,0.6],["大官",7.6,-2.8]],"beats":[{"t":"管寧和華歆是同學，常常一起讀書、一起做事。有一天，兩人在菜園裡鋤草。"},{"t":"鋤頭翻開泥土，地上露出一片金子！","fx":[["focus","華歆"]]},{"t":"管寧當它是瓦片、石頭，照樣鋤地。華歆卻把金子撿起來看了看，才丟掉。","fx":[["say","華歆"]]},{"t":"又有一天，兩人坐在同一張蓆子上讀書。門外傳來熱鬧的聲音，一位大官坐著華麗的車子經過。","fx":[["prop","cart",4.6,-3.0,0]],"mv":[["大官",3.6,-2.8]]},{"who":"華歆","t":"好氣派呀！我去看看！","mv":[["華歆",2.8,-1.6]],"fx":[["cheer","華歆"]]},{"t":"管寧照樣讀書，等華歆回來，他拿出刀子，把兩人坐的蓆子割成兩半。","mv":[["華歆",1.0,0.6],["大官",-7.6,-2.8]],"fx":[["upset","管寧"]]},{"who":"管寧","t":"你不是我的朋友。"}],"q":"管寧覺得華歆貪財、羨慕名利，和自己志向不同，就割開蓆子分開坐。後來比喻朋友絕交，用哪個成語？","wrong":[{"w":"志同道合","by":"華歆","line":"志同道合是志向相同的好夥伴。他都把蓆子割開了，剛好相反啊！"},{"w":"形影不離","by":"大官","line":"形影不離是像身體和影子一樣分不開。他們現在可是分開坐了！"},{"w":"分道揚鑣","by":"管寧","line":"分道揚鑣是各走各的路，有點接近！不過我割開蓆子、分開坐，有一個專門的成語。"}],"hint":"管寧把什麼東西切開了？","after":"這個故事記在南朝的《世說新語》。古時候大家坐在地上的蓆子，「席」就是蓆子。","lesson":{"title":"管寧與華歆","text":"後來天下大亂，管寧到遼東隱居了三十多年，專心教書。華歆則在魏國當上大官。有趣的是，華歆後來還向皇帝推薦管寧，不過管寧始終不肯出來做官。","next":"在潁川，有一家人以品德好出名，連小孫子們都在比誰的爸爸更棒……"}},{"id":"e46_05","yr":"東漢末年","place":"潁川陳家","scene":"house","music":"map","cast":[["陳寔",6.6,1.0],["小長文",-0.6,0.4],["小孝先",1.2,0.4]],"beats":[{"t":"陳寔是潁川有名的好人，大家都敬重他。他的兩個兒子陳紀（字元方）、陳諶（字季方），品德學問也都很好。"},{"t":"這天，元方的兒子長文和季方的兒子孝先，比起誰的爸爸比較厲害。"},{"who":"小長文","t":"我爸爸元方的品德最好！","fx":[["say","小長文"]]},{"who":"小孝先","t":"才不是！我爸爸季方的功勞最大！","fx":[["upset","小孝先"]]},{"t":"兩人吵來吵去，分不出高下，只好一起去問爺爺。","mv":[["陳寔",1.6,-0.8],["小長文",-0.2,0.6],["小孝先",0.6,1.0]]},{"who":"陳寔","t":"元方很難當哥哥，季方很難當弟弟。","fx":[["focus","陳寔"]]}],"q":"陳寔的意思是：元方好到季方很難當他的弟弟，季方也好到元方很難當他的哥哥，兩兄弟都很優秀、難分高下。這句話變成哪個成語？","wrong":[{"w":"難分難捨","by":"小孝先","line":"難分難捨是感情好得捨不得分開。爺爺說的是兩個爸爸都很優秀！"},{"w":"兄弟鬩牆","by":"陳寔","line":"兄弟鬩牆是兄弟在家裡吵架。我兩個兒子感情好得很，吵架的是你們兩個小傢伙！"},{"w":"不相上下","by":"小長文","line":"不相上下是程度差不多、分不出高低，意思很接近！不過爺爺說的是一對兄弟，有一個專門的成語。"}],"hint":"四個字裡有兩個「難」，還有哥哥和弟弟。","after":"兩個孫子聽了，都滿意地笑了：原來兩個爸爸一樣好！","lesson":{"title":"成語的意思會變","text":"原本是稱讚兄弟都很優秀（「難」念ㄋㄢˊ）。現在大家常用來說一起遭遇困難的人（「難」念ㄋㄢˋ），兩種用法要分清楚。陳寔就是「梁上君子」故事裡的那位爺爺，長文就是後來魏國的大臣陳群。","next":"就在這幾年，天下爆發了頭綁黃巾的大動亂……"}},{"id":"e21_01","yr":"西元 184 年","place":"宛城","scene":"walls","music":"battle","cast":[["朱儁",-6.6,1.0],["漢兵",-7.2,0.2],["漢兵",-7.6,1.6],["漢兵",-6.8,-0.6],["韓忠",0.6,-2.7,1.3],["黃巾兵",-1.4,-2.7,1.3],["黃巾兵",2.4,-2.7,1.3]],"beats":[{"t":"西元 184 年，張角帶領頭綁黃巾的百姓起兵。黃巾軍的韓忠占據了南陽的宛城。"},{"t":"東漢將軍朱儁帶兵包圍宛城，可是城牆又高又堅固。","mv":[["朱儁",-0.6,0.8],["漢兵",-1.6,0.2],["漢兵#2",0.6,1.2],["漢兵#3",-0.2,-0.6]]},{"who":"朱儁","t":"在西南邊打鼓吶喊，裝作要從那裡猛攻！","fx":[["focus","朱儁"]]},{"t":"咚咚咚！西南方鼓聲大作。城裡的黃巾軍全都跑去守西南邊。","fx":[["cheerAll","漢兵"]],"mv":[["韓忠",-4.6,-2.7,1.3],["黃巾兵",-5.4,-2.7,1.3],["黃巾兵#2",-3.8,-2.7,1.3]]},{"who":"韓忠","t":"敵人從西南邊來了！全部過來守住！","fx":[["upset","韓忠"]]},{"t":"朱儁自己卻帶著五千精兵，悄悄繞到沒人防守的東北邊。","mv":[["朱儁",3.4,-1.4],["漢兵",2.6,-1.8],["漢兵#2",4.2,-0.8]]}],"q":"朱儁假裝攻打西南邊，其實從東北邊攻進城。這種故意製造假象、出其不意攻擊的計策，叫做什麼？","wrong":[{"w":"東張西望","by":"韓忠","line":"東張西望是到處亂看。我們是被騙到西南邊去了！"},{"w":"打草驚蛇","by":"漢兵","line":"打草驚蛇是不小心讓敵人提高警覺。我們將軍是故意讓敵人跑錯地方！"},{"w":"出其不意","by":"朱儁","line":"出其不意是趁敵人沒想到時行動，很接近！不過我是假裝打一邊、真的打另一邊，有一個專門的成語。"}],"hint":"四個字裡有兩個方向。","after":"朱儁的精兵爬上東北邊的城牆，攻進了宛城。韓忠退守小城，最後投降。","lesson":{"title":"黃巾之亂","text":"黃巾軍喊著「蒼天已死，黃天當立」，幾十萬人同時起兵。朝廷花了不到一年就打敗主力，可是各地豪強趁機擴充兵力，東漢再也控制不住天下。「聲東擊西」這個說法源自《淮南子》的兵法道理。","next":"幾年後，董卓帶兵進入洛陽，各地英雄起兵討伐他。江東猛將孫堅，也遇上了大危機……"}},{"id":"e21_08","yr":"西元 190 年","place":"梁縣東邊","scene":"road","music":"battle","cast":[["孫堅",0.2,0.6],["祖茂",1.6,1.0],["卓兵",7.0,-1.2],["卓兵",7.6,0.2],["卓兵",6.8,1.2]],"beats":[{"t":"孫堅起兵討伐董卓，在梁縣東邊遇上董卓的大將徐榮，被打得大敗。"},{"t":"孫堅平常總戴著一頂紅色的頭巾，在戰場上非常顯眼，敵兵緊追不放。","mv":[["卓兵",4.4,-0.8],["卓兵#2",5.0,0.4],["卓兵#3",4.6,1.4]]},{"who":"卓兵","t":"追那個戴紅頭巾的！","fx":[["upset","孫堅"]]},{"who":"孫堅","t":"祖茂，你戴上我的紅頭巾，把敵人引開！","fx":[["focus","孫堅"]]},{"t":"祖茂戴上紅頭巾往另一邊跑，敵兵全追了過去。孫堅趁機從小路逃走。","mv":[["祖茂",6.8,-3.0],["卓兵",7.6,-3.4],["卓兵#2",8.0,-2.4],["卓兵#3",7.4,-1.6],["孫堅",-7.4,-1.0]]},{"t":"祖茂被追得走投無路，把頭巾掛在一根燒焦的柱子上，自己躲進草叢。敵兵把柱子團團圍住，靠近一看才發現上當了。"}],"q":"孫堅讓祖茂戴上紅頭巾引開敵人，自己悄悄逃走；就像蟬脫下外殼飛走一樣。這種用計脫身、讓對方沒有察覺的方法，叫做什麼？","wrong":[{"w":"臨陣脫逃","by":"祖茂","line":"臨陣脫逃是上了戰場卻害怕逃跑。孫將軍不是膽小，是用計脫身！"},{"w":"作繭自縛","by":"卓兵","line":"作繭自縛是自己害自己。被騙的是我們，不是他們啦……"},{"w":"李代桃僵","by":"孫堅","line":"李代桃僵是讓別人代替自己受難，有點接近！不過重點是我脫掉頭巾、讓敵人追錯人，有一個專門的成語。"}],"hint":"蟬長大時，會從舊殼裡鑽出來飛走。","after":"孫堅脫險後重新整頓軍隊，後來又打敗董卓的軍隊，攻進了洛陽。","lesson":{"title":"正史與話本","text":"孫堅和祖茂的故事記在正史《三國志》裡。「金蟬脫殼」這四個字，則出自元朝說書人的話本《三國志平話》，後來也成了「三十六計」之一。","next":"董卓怕各地英雄打進來，逼漢獻帝把首都從洛陽搬到長安。在長安，大學者蔡邕家裡來了一位小客人……"}},{"id":"e23_03","yr":"約西元 191 年","place":"長安蔡邕家","scene":"house","music":"palace","cast":[["蔡邕",0.4,-0.6],["賓客",-1.4,0.2],["賓客",2.0,0.4],["書童",6.6,1.4],["王粲",7.4,0.6]],"beats":[{"t":"董卓逼漢獻帝把首都搬到長安。大學者蔡邕非常有名，家門口的車馬擠滿巷子，屋裡坐滿客人。"},{"who":"賓客","t":"蔡先生，這篇文章請您指點指點！","fx":[["say","賓客"]]},{"who":"書童","t":"先生，門外有位叫王粲的客人求見！","mv":[["書童",2.8,1.2]]},{"t":"蔡邕一聽，急忙跑出去迎接，連鞋子都穿反了也沒發現。","mv":[["蔡邕",4.4,1.0]],"fx":[["focus","蔡邕"]]},{"t":"沒想到，走進來的是一個年紀很小、個子又矮的少年！客人們都嚇了一跳。","mv":[["王粲",1.4,0.6],["蔡邕",0.4,-0.2]],"fx":[["upset","賓客"]]},{"who":"蔡邕","t":"他是王公的孫子，有了不起的才華，我比不上他。我家的書和文章，將來都要送給他！"}],"q":"蔡邕急著出門迎接王粲，連鞋子都穿反了。後來形容熱情迎接客人，用哪個成語？","wrong":[{"w":"閉門謝客","by":"書童","line":"閉門謝客是關上門不見客人。先生可是自己衝出去迎接呢！"},{"w":"門可羅雀","by":"賓客#2","line":"門可羅雀是門口冷清得可以張網抓麻雀。蔡家門口車馬多得擠滿巷子！"},{"w":"掃榻相迎","by":"蔡邕","line":"掃榻相迎是把床榻打掃乾淨迎接客人，也是熱情歡迎，很接近！不過我是急得穿反鞋子，有一個專門的成語。"}],"hint":"「屣」是鞋子，「倒」是穿反了。","after":"王粲當時大約十五歲。蔡邕非常欣賞他，後來真的把幾車書送給了他。","lesson":{"title":"建安七子","text":"王粲長大後以〈登樓賦〉等文章出名，和孔融一樣名列「建安七子」。可惜蔡邕在董卓被殺後受到牽連，不久就死在獄中。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十六章．名士與黃巾","eps":[10,11,20,21,23,31,46]},{"key":"h24","line":"history","name":"群雄爭霸","short":"群雄並起","era":"西元 191–208 年","color":"#5A7FB0","map":{"ground":"#b0bf7c","river":"#4f9fd8"},"intro":{"lines":["董卓作亂以後，各地的州牧、太守都擁有自己的軍隊，互相爭奪地盤，叫做「群雄並起」。","北方最強的是袁紹，曹操則把漢獻帝接到許縣，用皇帝的名義號令天下。","西元 200 年，曹操和袁紹在官渡決戰，曹操以少勝多，後來統一了北方。","南方的江東，孫策、孫權兄弟打下了一片天地。","這一章，我們來看看英雄們的計謀、友情和雄心！"],"people":[["曹操","東漢末年的政治家、軍事家，也是詩人"],["袁紹","出身名門，曾是北方最強的勢力"],["孫策","孫堅的兒子，人稱「小霸王」"],["孔融","建安七子之一，愛交朋友、說話直"]]},"stops":[{"id":"e44_02","yr":"西元 191 年","place":"冀州鄴城","scene":"office","music":"palace","cast":[["韓馥",0.4,-0.6],["荀諶",6.6,1.0],["耿武",-6.6,0.6],["官員",2.6,0.4]],"beats":[{"t":"韓馥是冀州的長官。冀州又大又富，糧食多、兵馬也多。袁紹很想要這塊地方。"},{"t":"袁紹派荀諶等人來勸韓馥。","mv":[["荀諶",1.6,0.6]]},{"who":"荀諶","t":"袁紹很強，您比不上他。不如把冀州讓給袁紹，您就安全了！","fx":[["say","荀諶"]]},{"t":"韓馥個性膽小，竟然點頭答應了。部下耿武聽到，急忙跑來勸阻。","mv":[["耿武",-1.2,0.4]],"fx":[["upset","耿武"]]},{"who":"耿武","t":"冀州有上百萬軍隊，糧食夠吃十年！袁紹是外地來的，兵少糧缺，什麼都要靠我們。","fx":[["focus","耿武"]]},{"who":"耿武","t":"他就像我們手掌上的嬰兒，只要不餵奶，馬上就會餓壞。為什麼要把冀州送給他？"}],"q":"耿武說：袁紹兵少糧缺，要仰著頭、靠冀州給的氣息才能活下去。後來比喻依賴別人、看人臉色過日子，叫做什麼？","wrong":[{"w":"自力更生","by":"官員","line":"自力更生是靠自己的力量站起來。袁紹現在什麼都要靠我們，剛好相反！"},{"w":"呼風喚雨","by":"荀諶","line":"呼風喚雨是神通廣大，能掌控局面。耿武是說袁紹現在根本沒那麼厲害。"},{"w":"寄人籬下","by":"耿武","line":"寄人籬下是住在別人家、依靠別人過日子，很接近！不過我說他要仰著頭、靠我們呼吸，有一個專門的成語。"}],"hint":"「鼻息」是鼻子呼出的氣。","after":"韓馥還是不聽，把冀州讓給了袁紹。後來韓馥心裡害怕，離開冀州，下場很淒涼。","lesson":{"title":"袁紹稱霸北方","text":"袁紹得到冀州後，又打敗北方的公孫瓚，占領冀、青、幽、并四州，成為當時最強大的勢力。耿武說的原話是「仰我鼻息」。","next":"這時候，曹操把漢獻帝接到許縣。許都的孔融家裡，常常有一位很年輕的客人……"}},{"id":"e10_08","yr":"約西元 195 年","place":"孔融家","scene":"study","music":"palace","cast":[["孔融",0.4,-1.4],["禰衡",6.6,1.0],["書童",2.4,-0.6]],"beats":[{"t":"禰衡是個年輕的才子，記憶力好、文章寫得漂亮，可是脾氣很傲，看得起的人沒幾個。"},{"t":"孔融讀了禰衡的文章，非常欣賞，請他來家裡作客。","mv":[["禰衡",1.4,-0.4]]},{"who":"孔融","t":"你的文章寫得太好了，真是奇才！","fx":[["cheer","孔融"]]},{"t":"書上說，那時候禰衡還不到二十歲，孔融已經五十歲了。","fx":[["focus","孔融"]]},{"who":"禰衡","t":"孔大人，您的學問我最佩服！","fx":[["say","禰衡"]]},{"who":"孔融","t":"我們是朋友，叫什麼大人！你我相稱就好！"}],"q":"孔融和禰衡年紀差了好幾十歲，卻不在乎年齡，成為情意相投的好朋友。這種友情叫做什麼？","wrong":[{"w":"一面之交","by":"禰衡","line":"一面之交是只見過一次面。我們可是常常見面、無話不談！"},{"w":"萍水相逢","by":"書童","line":"萍水相逢是偶然碰到的陌生人。我家老爺是讀了文章，特地請他來的！"},{"w":"莫逆之交","by":"孔融","line":"莫逆之交是心意相通的好朋友，很接近！不過我們的特別之處是忘記了年紀差距，有一個專門的成語。"}],"hint":"他們忘記了什麼？","after":"孔融還寫了一篇〈薦禰衡表〉，把禰衡推薦給朝廷。","lesson":{"title":"孔融與禰衡","text":"禰衡才華很高，卻常常當眾罵人，連曹操都被他羞辱過，後來被送到荊州，最後因為得罪人而被殺，才二十多歲。這個成語出自晉朝的《文士傳》。","next":"南方的江東，孫堅的兒子孫策長大了，他想打下廬江城……"}},{"id":"e21_02","yr":"西元 199 年","place":"廬江城","scene":"walls","music":"battle","cast":[["劉勳",0.4,-0.4],["劉曄",-1.4,0.4],["使者",6.6,1.0],["勳兵",1.6,-1.4],["勳兵",-0.6,-1.6],["孫策",-7.4,0.8,0,1,1]],"beats":[{"t":"劉勳占據廬江，城池又高又堅固。江東的孫策很想拿下廬江，但硬攻太難了。"},{"t":"孫策派使者帶著珍寶去見劉勳，說話非常客氣。","mv":[["使者",1.8,0.6]]},{"who":"使者","t":"上繚那個地方很富有，常常欺負我們。請將軍出兵攻打，孫將軍願意在外面幫忙！","fx":[["say","使者"]]},{"who":"劉勳","t":"好！我帶大軍去打上繚！","fx":[["cheer","劉勳"]]},{"who":"劉曄","t":"不行啊！上繚很難攻，我們軍隊一出城，城裡就空了，孫策一定會趁機來偷襲！","fx":[["upset","劉曄"]]},{"t":"劉勳不聽，帶著大軍出城。這時，孫策的軍隊果然悄悄出發了！","mv":[["劉勳",7.6,-1.0],["勳兵",8.0,-1.6],["勳兵#2",7.2,-2.2],["使者",7.8,0.4],["孫策",-1.2,-0.6]],"fx":[["focus","孫策"]]}],"q":"孫策引誘劉勳帶兵離開堅固的城池，再趁機奪下廬江。就像把老虎引出牠的山頭一樣，這個計策叫做什麼？","wrong":[{"w":"放虎歸山","by":"劉曄","line":"放虎歸山是把敵人放走，留下後患。孫策是把我們引出城，剛好不一樣！"},{"w":"狐假虎威","by":"使者","line":"狐假虎威是靠別人的威風嚇人。我家將軍是用計，可不是借誰的威風！"},{"w":"聲東擊西","by":"孫策","line":"聲東擊西是假裝攻一邊、實際攻另一邊，有點接近！不過我是先把劉勳引出城，有一個專門的成語。"}],"hint":"老虎在山上最難對付，把牠引走呢？","after":"孫策趁廬江空虛，一舉攻下城池。劉勳回不了家，只好去投靠曹操。","lesson":{"title":"小霸王孫策","text":"孫策只用了幾年時間，就打下江東一大片土地，人稱「小霸王」。這段故事記在《三國志》；「調虎離山」這四個字，則是後來在《西遊記》裡出現，也成為「三十六計」之一。","next":"北方的曹操，也正在準備和袁紹的大決戰。可是不管多忙，他手上總拿著一樣東西……"}},{"id":"e07_07","yr":"東漢末年","place":"曹操軍帳","scene":"tent","music":"night","cast":[["曹操",0.4,-0.6],["曹丕",6.6,1.0],["侍衛",2.8,1.2]],"beats":[{"t":"曹操常常帶著大軍東征西討。他的兒子曹丕從小就跟著爸爸行軍，五歲學射箭，八歲就能騎馬射箭。"},{"t":"夜深了，軍帳裡點著燈。曹操沒有休息，手上捧著一卷書。","fx":[["focus","曹操"]]},{"who":"侍衛","t":"主公，明天還要行軍，您不休息嗎？"},{"who":"曹操","t":"一有空，就要多讀幾頁！","fx":[["say","曹操"]]},{"t":"曹丕走進帳來，曹操把書放在桌上，認真地對他說：","mv":[["曹丕",1.6,0.4]]},{"who":"曹操","t":"人小時候愛讀書，心思最專一；長大以後就容易忘記。要趁年輕好好讀書啊！"}],"q":"曹操就算在軍營裡打仗，手上也總是拿著書，從來不放下。這種勤奮好學的樣子，叫做什麼？","wrong":[{"w":"不學無術","by":"侍衛","line":"不學無術是沒學問也沒本事。主公讀那麼多書，剛好相反！"},{"w":"半途而廢","by":"曹丕","line":"半途而廢是做到一半就放棄。爸爸讀書可是一輩子都沒停過！"},{"w":"孜孜不倦","by":"曹操","line":"孜孜不倦是勤勉努力、不覺得累，很接近！不過我是連打仗時書都不離手，有一個專門的成語。"}],"hint":"「釋」是放下，「卷」是書。","after":"曹丕聽了爸爸的話，讀遍了《詩經》、五經、《史記》、《漢書》和諸子百家的書。","lesson":{"title":"愛讀書的曹家","text":"這段話是曹丕在《典論．自敘》裡寫的。後來東吳的孫權勸大將呂蒙讀書時，也拿曹操當例子，說他「老而好學」。曹丕後來當上魏國的第一位皇帝。","next":"西元 200 年，曹操和袁紹在官渡對峙了好幾個月，曹軍的糧食快吃完了……"}},{"id":"e21_05","yr":"西元 200 年","place":"官渡．烏巢","scene":"night","music":"battle","cast":[["曹操",0.4,-0.2],["許攸",-6.6,0.8],["曹兵",1.8,0.6],["曹兵",-0.8,0.8],["袁兵",1.4,-2.6],["袁兵",-1.2,-2.8]],"beats":[{"t":"官渡之戰打了好幾個月。袁紹兵多糧多，曹操兵少，糧食也快吃完了。","fx":[["sadAll","曹兵"]]},{"t":"一天夜裡，袁紹的謀士許攸因為不受重用，跑來投靠曹操。曹操高興得光著腳就跑出去迎接。","mv":[["許攸",-1.4,0.4]]},{"who":"許攸","t":"袁紹一萬多車糧草，都放在烏巢，守備很鬆。只要燒了它，不出三天，袁軍自己就會垮！","fx":[["focus","許攸"]]},{"t":"曹操親自帶五千兵馬，打著袁軍的旗號，每人抱一束柴，連夜趕到烏巢。","mv":[["曹操",0.2,-1.0],["曹兵",1.6,-1.4],["曹兵#2",-1.0,-1.2]]},{"who":"曹操","t":"放火！燒掉他們的糧草！","fx":[["fire",0.6,-3.0],["fire",-1.6,-3.2],["upset","袁兵"]]},{"t":"烏巢的糧草全被燒光。消息傳開，袁軍軍心大亂。","mv":[["袁兵",6.0,-3.6],["袁兵#2",7.2,-2.6]],"fx":[["cheerAll","曹兵"]]}],"q":"鍋裡的水滾了，舀起來再倒回去沒有用，要把鍋子底下的柴火抽掉才行。曹操燒掉袁軍糧草，就是從根本解決問題。這叫做什麼？","wrong":[{"w":"揚湯止沸","by":"許攸","line":"揚湯止沸是把滾水舀起來再倒回去，只能暫時止滾，治標不治本。曹公燒糧草可是從根本下手！"},{"w":"火上加油","by":"曹兵","line":"火上加油是讓事情變得更糟。我們是讓袁軍沒了糧食，不是幫他們加油啦！"},{"w":"斬草除根","by":"曹操","line":"斬草除根是連根拔除、不留後患，意思很接近！不過「抽掉鍋底的柴火」，有一個專門的成語。"}],"hint":"「釜」是鍋子，「薪」是柴火。","after":"袁軍大敗，袁紹只帶著八百多名騎兵逃回河北。","lesson":{"title":"官渡之戰","text":"官渡之戰是歷史上有名的以少勝多。兩年後袁紹病死，他的兒子們互相爭鬥，曹操逐步統一了北方。這個成語的道理，來自《呂氏春秋》說的「要讓水不滾，就把火拿走」。","next":"就在同一年，江東也發生了大事——小霸王孫策突然過世了……"}},{"id":"e32_01","yr":"西元 200 年","place":"吳郡","scene":"palace","music":"night","cast":[["孫權",0.2,-0.4],["張昭",6.6,1.0],["侍從",2.4,-1.0]],"beats":[{"t":"孫策出外打獵時被刺客所傷，傷得很重。臨終前，他把江東交給十九歲的弟弟孫權。"},{"t":"孫策說：「帶兵打仗，你比不上我；任用人才、守住江東，我比不上你。」","fx":[["focus","孫權"]]},{"who":"孫權","t":"哥哥……嗚嗚……","fx":[["sad","孫權"]]},{"t":"孫權一直哭個不停，什麼事都沒心情處理。大臣張昭急忙走進來。","mv":[["張昭",1.4,0.6]]},{"who":"張昭","t":"現在是哭的時候嗎？外面壞人到處都是，像豺狼擋在路上一樣！","fx":[["upset","張昭"]]},{"who":"張昭","t":"您只顧著傷心、講究禮節，就好像把大門打開，還客客氣氣地請強盜進來啊！"}],"q":"張昭說：在危險的時候只顧傷心，就像打開大門、拱手行禮請強盜進來。後來比喻引進壞人，自己招來禍患，叫做什麼？","wrong":[{"w":"開門見山","by":"侍從","line":"開門見山是說話直接講重點。張大人說的是請強盜進門，不是說話的方法啦！"},{"w":"閉門思過","by":"孫權","line":"閉門思過是關起門來反省錯誤。張昭是要我趕快出門巡視軍隊！"},{"w":"引狼入室","by":"張昭","line":"引狼入室是把壞人引進家裡，意思很接近！不過我說的是開門、拱手請強盜，有一個專門的成語。"}],"hint":"「揖」念ㄧ，是拱手行禮。","after":"張昭替孫權換掉喪服，扶他上馬，出去巡視軍隊。大家看到新主人，心才安定下來。","lesson":{"title":"孫權接掌江東","text":"孫權重用張昭、周瑜等人，穩住了江東。後來他和劉備聯手在赤壁打敗曹操，最後建立了吳國。","next":"許都的孔融，有一位好朋友韋端。這一天，韋端的兩個兒子先後來拜訪孔融……"}},{"id":"e59_08","yr":"東漢末年","place":"孔融家","scene":"study","music":"palace","cast":[["孔融",-0.6,-1.6],["韋康",6.6,1.0],["韋誕",7.4,0.2]],"beats":[{"t":"孔融的朋友韋端住在京兆。他先派大兒子韋康（字元將）來拜訪孔融。","mv":[["韋康",1.4,-0.2]]},{"who":"孔融","t":"元將學問深、氣度大，將來一定是了不起的人才！","fx":[["cheer","孔融"]]},{"t":"第二天，換小兒子韋誕（字仲將）來拜訪。","mv":[["韋康",7.4,1.6],["韋誕",1.4,-0.2]]},{"who":"孔融","t":"仲將誠懇踏實，文章又好，一定能守住家業！","fx":[["focus","韋誕"]]},{"t":"孔融非常高興，馬上提筆寫信給老朋友韋端。","mv":[["孔融",-1.2,-2.0]]},{"who":"孔融","t":"真沒想到，兩顆這麼美的珍珠，是從一隻老蚌殼裡生出來的！"}],"q":"孔融稱讚韋端：老蚌竟然生出兩顆珍珠，也就是老朋友有兩個這麼好的兒子。這句稱讚變成哪個成語？","wrong":[{"w":"魚目混珠","by":"韋誕","line":"魚目混珠是拿魚眼睛冒充珍珠，以假亂真。孔伯伯是真心稱讚我們！"},{"w":"掌上明珠","by":"韋康","line":"掌上明珠是爸媽最疼愛的女兒。我們兩個可是兒子喔！"},{"w":"芝蘭玉樹","by":"孔融","line":"芝蘭玉樹是比喻優秀的子弟，意思很接近！不過我寫的是蚌殼生珍珠，有一個專門的成語。"}],"hint":"珍珠是從什麼貝類裡長出來的？","after":"原信寫的是「不意雙珠，近出老蚌」。韋端讀了，一定很開心。","lesson":{"title":"成語的意思會變","text":"這個成語原本是稱讚別人有好兒子，後來多用來形容年紀大了才生孩子。韋康後來當上涼州刺史；韋誕是有名的書法家。","next":"西元 207 年，曹操往北遠征烏桓，打了大勝仗，在回程路上登上了海邊的碣石山……"}},{"id":"e32_07","yr":"西元 207 年","place":"碣石山海邊","scene":"river","music":"final","cast":[["曹操",0.4,-0.4],["曹兵",2.0,0.6],["曹兵",-1.2,0.8],["老戰馬",2.4,-1.4,0,1]],"beats":[{"t":"曹操帶兵北征烏桓，在白狼山打了大勝仗，平定了北方。這一年，他已經五十多歲了。","fx":[["cheerAll","曹兵"]]},{"t":"回程時，曹操登上碣石山，望著波濤洶湧的大海，寫下了有名的〈觀滄海〉。","fx":[["focus","曹操"]]},{"who":"曹操","t":"神龜活得再久，也有結束的一天；騰蛇能駕著雲霧飛，最後也會化成塵土。","fx":[["sad","曹操"]]},{"t":"可是曹操沒有灰心。他想到一匹年老的千里馬，雖然趴在馬槽邊，心裡仍想奔跑千里。","fx":[["focus","老戰馬"]]},{"who":"曹操","t":"有志氣的人到了晚年，雄心壯志也不會停止！","fx":[["cheer","曹操"]]}],"q":"曹操的詩說：年老的千里馬趴在馬槽邊，心裡仍想奔跑千里。後來比喻人雖然年老，仍有雄心壯志，叫做什麼？","wrong":[{"w":"老馬識途","by":"曹兵","line":"老馬識途是有經驗的人能帶路。主公說的是老了還想奔跑千里的雄心！"},{"w":"馬齒徒增","by":"曹兵#2","line":"馬齒徒增是年紀白白變大、沒什麼成就。主公剛打了大勝仗，剛好相反！"},{"w":"老當益壯","by":"曹操","line":"老當益壯是年紀越大越有幹勁，意思很接近！不過我詩裡寫的是馬槽邊的千里馬，有一個專門的成語。"}],"hint":"「驥」是千里馬，「櫪」是馬槽。","after":"這幾句出自曹操的〈步出夏門行〉（又叫〈龜雖壽〉）：「老驥伏櫪，志在千里；烈士暮年，壯心不已。」","lesson":{"title":"詩人曹操","text":"曹操不只會打仗，也是很有名的詩人，他和兒子曹丕、曹植合稱「三曹」。統一北方後，曹操把目光轉向南方。","next":"可是在許都，曹操和孔融的關係卻越來越緊張……"}},{"id":"e44_03","yr":"約西元 207 年","place":"許都","scene":"office","music":"palace","cast":[["曹操",0.4,-0.6],["孔融",-6.6,0.8],["郗慮",6.6,0.8]],"beats":[{"t":"漢獻帝剛遷到許都時，孔融和郗慮常常互相稱讚。","mv":[["孔融",-1.4,0.4],["郗慮",1.8,0.6]]},{"who":"孔融","t":"郗慮的學問是跟大學者鄭玄學的，真是了不起！","fx":[["say","孔融"]]},{"who":"郗慮","t":"孔融學問淵博，見識不凡！","fx":[["say","郗慮"]]},{"t":"後來兩人卻鬧翻了，郗慮還上奏皇帝，讓孔融丟了官。","fx":[["upset","孔融"],["upset","郗慮"]]},{"t":"曹操寫了一封信給孔融，表面上勸他們和好，其實也在警告常常批評他的孔融。","fx":[["focus","曹操"]]},{"who":"曹操","t":"以前你稱讚他名聲和真本事一樣好，現在怎麼跟以前不一樣了？我希望大家互相稱讚，不要互相傷害。"}],"q":"曹操信裡提到：孔融以前稱讚郗慮的名聲和實際的學問互相符合。後來形容名聲和實際相符，用哪個成語？","wrong":[{"w":"徒有虛名","by":"郗慮","line":"徒有虛名是空有名聲、沒有真本事。當時他可是誇我學問很好呢！"},{"w":"莫名其妙","by":"孔融","line":"莫名其妙是說不出道理、讓人想不通。曹公的意思可清楚得很。"},{"w":"名不虛傳","by":"曹操","line":"名不虛傳是名聲不是假的，很接近！不過我信裡說的是「名」和「實」相符，有一個專門的成語。"}],"hint":"原信寫的是「名實相副」，「副」是相稱。","after":"孔融回信說自己並沒有記恨郗慮，可是他和曹操的關係還是越來越壞。","lesson":{"title":"孔融之死","text":"孔融常常批評曹操，西元 208 年，曹操找理由把他處死了。就是那一年，曹操帶大軍南下，在赤壁和孫權、劉備決戰。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十七章．群雄爭霸","eps":[7,10,21,32,44,59]},{"key":"h25","line":"history","name":"群雄爭天下","short":"東漢末年","era":"西元 208–221 年","color":"#B5523B","map":{"ground":"#b3c47e","river":"#4f9fd8"},"intro":{"lines":["東漢末年，皇帝沒有實權，各地的軍閥互相搶地盤。","北方的曹操最強大。西元 208 年，他帶著大軍南下，想一口氣統一天下。","劉備請到了諸葛亮，聯合江東的孫權，在赤壁打敗曹操，天下漸漸分成三塊。","西元 220 年曹操過世，兒子曹丕當上皇帝，漢朝結束了。","這一章有三方的英雄和才子，也有幾段《三國演義》小說裡的精彩情節，要分清楚喔！"],"people":[["劉備","漢朝皇族的後代，很會收服人心"],["諸葛亮","劉備的軍師，人稱「臥龍」"],["曹操","統一北方的丞相，也是詩人"],["曹植","曹操的兒子，文采最好"]]},"stops":[{"id":"e45_02","yr":"西元 208 年","place":"當陽．撤退路上","scene":"road","music":"battle","cast":[["劉備",-7,0.2],["徐庶",-7.6,1.2],["諸葛亮",-8,-0.6],["傳令兵",7.2,1.0]],"beats":[{"t":"西元 208 年，曹操大軍南下。劉備兵少，只好帶著軍隊和百姓往南撤退，徐庶和諸葛亮都跟在身邊。","mv":[["劉備",0.4,0.2],["徐庶",-0.9,0.7],["諸葛亮",1.6,-0.6]]},{"t":"曹軍騎兵追得很快，在當陽追上了劉備的隊伍，大家被打散了。","fx":[["sad","劉備"]]},{"t":"一名士兵氣喘吁吁地跑來。","mv":[["傳令兵",2.2,0.8]]},{"who":"傳令兵","t":"徐先生，不好了！您的母親被曹軍抓走了！","fx":[["upset","徐庶"]]},{"t":"徐庶非常孝順，聽到這個消息，整個人都呆住了。","fx":[["focus","徐庶"],["sad","徐庶"]]},{"who":"徐庶","t":"將軍，我本來想用胸口這一小塊地方——我的心，和您一起成就大業。可是現在，老母親被抓走了……","fx":[["say","徐庶"]]}],"q":"徐庶指著胸口說：「我的心已經亂了，留下來也幫不上忙，請讓我從這裡告別吧。」形容心情煩亂、沒辦法好好思考，可以用哪個成語？","wrong":[{"w":"心花怒放","by":"諸葛亮","line":"心花怒放是高興得不得了。徐兄的母親被抓，他是急得心都亂了！"},{"w":"胸有成竹","by":"劉備","line":"胸有成竹是心裡早就有把握。徐先生現在心裡一點主意都沒有了啊！"},{"w":"心亂如麻","by":"徐庶","line":"心亂如麻也是心裡亂糟糟，意思很接近！不過我指著胸口說的那句話，有一個專門的成語。"}],"hint":"古人說心只有「一寸見方」那麼大，所以把心叫做「方寸」。","after":"劉備雖然捨不得，還是讓徐庶離開。徐庶就到曹操那裡去找母親了。","lesson":{"title":"長坂坡與赤壁","text":"當陽長坂這一仗，劉備損失慘重，幸好有趙雲保護劉備的妻兒，張飛在橋邊擋住追兵。後來諸葛亮到江東說服孫權聯合抗曹，這年冬天在赤壁打敗了曹操。","next":"說到諸葛亮，《三國演義》裡寫他剛到劉備身邊時，就打了一場漂亮的仗……"}},{"id":"e45_03","yr":"東漢末年","place":"博望坡","scene":"valley","music":"battle","cast":[["諸葛亮",-4.4,-1,0.25],["劉備",-5.2,-1.6,0.25],["關羽",-1.2,0.4],["張飛",-0.2,1.2],["夏侯惇",7,0],["曹兵",7.6,-0.8],["曹兵",7.8,1.0],["曹兵",8.4,0.2]],"beats":[{"t":"這一站是小說《三國演義》裡的故事。諸葛亮剛到劉備身邊，年紀輕輕，關羽和張飛都不太服氣。"},{"who":"張飛","t":"大哥把他說得那麼厲害，我看他會不會打仗，還不知道呢！","fx":[["upset","張飛"]]},{"t":"這時候，曹操派大將夏侯惇帶著大軍殺過來了！","mv":[["夏侯惇",3.2,0.2],["曹兵",4.4,-0.6],["曹兵#2",4.2,1.0],["曹兵#3",5.2,0.3]]},{"who":"諸葛亮","t":"雲長、翼德，你們埋伏在博望坡兩邊的山林裡，看到火光，就一起殺出來！","fx":[["focus","諸葛亮"]]},{"t":"曹軍追進狹窄的山谷，四面突然燒起大火，曹軍亂成一團！","fx":[["fire",2.2,-1.4],["fire",4.4,0.8],["sadAll","曹兵"]],"mv":[["關羽",1.0,0.6],["張飛",1.8,1.5]]},{"t":"夏侯惇只好帶著剩下的士兵逃回去。","mv":[["夏侯惇",8,-1],["曹兵",8.6,-1.6],["曹兵#2",8.4,0.6],["曹兵#3",9,-0.2]]},{"who":"關羽","t":"軍師真是英雄啊！","fx":[["cheer","關羽"],["cheer","張飛"],["focus",null]]}],"q":"諸葛亮剛走出隆中的茅草屋，第一次指揮打仗就立了大功。後來比喻剛進入社會、剛開始做事，叫做什麼？","wrong":[{"w":"三顧茅廬","by":"張飛","line":"三顧茅廬是大哥三次去草屋請軍師。這次說的是軍師剛從草屋走出來做事！"},{"w":"火冒三丈","by":"夏侯惇","line":"火冒三丈是氣得不得了。我是被真的大火燒得逃跑啦！"},{"w":"初露鋒芒","by":"關羽","line":"初露鋒芒是剛開始顯露本事，意思很接近！不過「剛從茅草屋出來」，有一個專門的成語。"}],"hint":"「茅廬」就是諸葛亮住的茅草屋。","after":"注意：火燒博望坡是《三國演義》的情節。歷史上的博望之戰大約在西元 202 年，是劉備自己設下埋伏打敗夏侯惇，那時諸葛亮還沒出山呢。","lesson":{"title":"小說和歷史","text":"《三國演義》是明朝羅貫中寫的小說，有人說它「七分真實、三分虛構」。小說把很多功勞都寫到諸葛亮身上，讓他像神仙一樣厲害。讀故事時，可以想一想哪些才是真的歷史。","next":"赤壁之戰後，孫權和劉備為了鞏固聯盟，結成了親家……"}},{"id":"e32_08","yr":"西元 209 年","place":"東吳宮廷","scene":"palace","music":"palace","cast":[["孫權",1.6,-0.6],["劉備",-7,0.6],["趙雲",-7.6,1.4],["孫夫人",2.8,-1.0,0,1,1]],"beats":[{"t":"這一站是《三國演義》的情節。赤壁之戰後，孫權想要回荊州，想出一個計：假裝要把妹妹嫁給劉備。"},{"who":"孫權","t":"等劉備來了東吳，就把他扣住，逼他交出荊州！","fx":[["focus","孫權"]]},{"t":"劉備很擔心，不敢去。孔明卻交給趙雲三個錦緞小袋子，交代遇到難關，就照順序打開。"},{"t":"劉備和趙雲出發，來到了東吳。","mv":[["劉備",-0.9,0.6],["趙雲",0.1,1.4]]},{"who":"趙雲","t":"打開第一個袋子……原來軍師要我們讓全城的人都知道這門親事！","fx":[["cheer","趙雲"]]},{"t":"消息傳遍全城，孫權的母親也很喜歡劉備。孫權沒辦法，只好讓妹妹真的嫁給劉備。","mv":[["孫夫人",0.9,0.2]],"fx":[["upset","孫權"]]}],"q":"趙雲照著孔明事先裝在小袋子裡的計策行事，一次次化解危機。這種預先準備好、能解決危急的好辦法，叫做什麼？","wrong":[{"w":"錦上添花","by":"孫夫人","line":"錦上添花是好上加好。我們說的是袋子裡藏著的好計策！"},{"w":"天羅地網","by":"孫權","line":"天羅地網是布下抓人的大網。我本來想這樣抓劉備，可惜沒成功啊！"},{"w":"神機妙算","by":"劉備","line":"神機妙算是說軍師算得準，意思很接近！不過計策是裝在小袋子裡交給子龍的，有一個專門的成語。"}],"hint":"孔明把計策裝在哪裡？「囊」就是袋子。","after":"最後趙雲打開第三個袋子，劉備帶著孫夫人平安逃回荊州。注意：三個錦囊是《三國演義》編出來的情節。","lesson":{"title":"孫劉聯姻","text":"歷史上，劉備真的娶了孫權的妹妹，這是為了鞏固孫劉聯盟；劉備也真的到京口見過孫權。不過「三個錦囊」和「賠了夫人又折兵」，都是《三國演義》寫出來的故事。","next":"這時候在北方，曹操在鄴城蓋了一座高大的銅雀臺……"}},{"id":"e32_04","yr":"約西元 212 年","place":"鄴城．銅雀臺","scene":"palace","music":"palace","cast":[["曹操",1.4,-0.4],["曹丕",2.8,0.6],["曹植",-6.6,1.0]],"beats":[{"t":"曹操的兒子曹植，十歲出頭就讀了幾十萬字的詩、文章和辭賦，很會寫文章。","mv":[["曹植",-0.8,0.6]]},{"t":"有一次，曹操看了他的文章，覺得寫得太好了，不像小孩子寫的。"},{"who":"曹操","t":"這篇文章，是你請別人代寫的吧？","fx":[["upset","曹操"]]},{"who":"曹植","t":"孩兒開口就能說成一篇道理，拿起筆就能寫成文章。父親可以當面考我，怎麼會請人代寫呢？","fx":[["say","曹植"]]},{"t":"後來鄴城的銅雀臺蓋好了。曹操帶著兒子們登上高臺，要每個人寫一篇賦。","fx":[["focus",null]]},{"t":"曹植拿起筆，一下子就寫好了，寫得又快又好。","fx":[["focus","曹植"],["cheer","曹植"]]},{"who":"曹操","t":"了不起！真是了不起！","fx":[["cheer","曹操"]]}],"q":"曹植說自己「拿起筆就能寫成文章」，在銅雀臺也真的提筆就寫好一篇賦。形容一提筆就能寫成文章、才思敏捷，叫做什麼？","wrong":[{"w":"紙上談兵","by":"曹丕","line":"紙上談兵是只會空談、不會實戰。弟弟可是當場就寫出好文章呢！"},{"w":"畫蛇添足","by":"曹操","line":"畫蛇添足是多此一舉。植兒的文章，一個字都不多餘！"},{"w":"一揮而就","by":"曹植","line":"一揮而就是筆一揮就完成，意思很接近！不過我跟父親說的那句話，有一個專門的成語。"}],"hint":"「下筆」就是拿起筆開始寫，「章」是文章。","after":"曹操覺得非常驚奇，從此很疼愛曹植，還好幾次想立他當繼承人。","lesson":{"title":"建安文學","text":"曹操、曹丕、曹植父子三人都是大文學家，人稱「三曹」。他們身邊還聚集了很多文人，寫出許多慷慨有力的詩文，歷史上叫做「建安文學」。","next":"這時候在西邊，猛將馬超和曹操打了一場大仗……"}},{"id":"e45_06","yr":"西元 213 年","place":"冀城","scene":"walls","music":"battle","cast":[["馬超",0.6,0.2],["西涼兵",1.6,1.0],["西涼兵",1.8,-0.6],["楊阜",7,0.6],["姜敘",7.6,1.5],["梁寬",-1.2,-2.7,1.3,1,1],["趙衢",0.8,-2.7,1.3,1,1]],"beats":[{"t":"西元 211 年，馬超在潼關被曹操打敗。兩年後，他又帶兵攻下了冀城。"},{"who":"馬超","t":"冀城是我的了！","fx":[["cheer","馬超"],["cheerAll","西涼兵"]]},{"t":"城裡的楊阜、姜敘等人不服，暗中商量要趕走馬超。楊阜和姜敘先在鹵城起兵。","mv":[["楊阜",4.6,0.4],["姜敘",5.4,1.2]]},{"t":"馬超帶兵出城去打，卻怎麼也打不下來。","mv":[["馬超",2.6,0.3],["西涼兵",3.4,1.1],["西涼兵#2",3.4,-0.5]],"fx":[["upset","馬超"]]},{"t":"這時，留在冀城的梁寬、趙衢關上了城門，不讓馬超回來！","mv":[["梁寬",-1.2,-2.7,1.3],["趙衢",0.8,-2.7,1.3]],"fx":[["focus","梁寬"]]},{"who":"馬超","t":"什麼？連城門都關了！往前打不下，往後回不去……","fx":[["focus","馬超"],["sad","馬超"],["sadAll","西涼兵"]]}],"q":"馬超前面打不贏，後面又回不了城，進也不是、退也不是。形容這種非常困窘的處境，可以用哪個成語？","wrong":[{"w":"所向無敵","by":"楊阜","line":"所向無敵是到哪裡都打勝仗。他現在可是到哪裡都碰壁！"},{"w":"衣錦還鄉","by":"姜敘","line":"衣錦還鄉是風風光光回到家鄉。他連冀城都回不去了！"},{"w":"進退兩難","by":"馬超","line":"進退兩難也是前進後退都不行，意思很接近！不過史書形容我的樣子，用的是兩種傳說中的動物……"}],"hint":"傳說有兩種動物總是走在一起，分開了就走不動。","after":"馬超只好往南逃，去漢中投靠張魯。","lesson":{"title":"馬超歸劉備","text":"後來馬超離開張魯，投靠了劉備。西元 214 年劉備包圍成都，城裡的人聽說馬超來了，都非常害怕，劉璋很快就投降了。劉備從此占有益州。","next":"曹操的勢力越來越大。朝廷裡有一位老臣楊彪，早就看出漢朝快要結束了……"}},{"id":"e24_08","yr":"西元 219 年","place":"許都．丞相府","scene":"office","music":"night","cast":[["曹操",1.2,-0.6],["楊修",0.2,0.6],["楊彪",-6.6,0.8]],"beats":[{"t":"老臣楊彪看出漢朝快要結束了，就說自己腳生病，不再出來做官，一待就是十年。"},{"t":"他的兒子楊修非常聰明，在曹操手下做事，常常猜中曹操的心思。","fx":[["cheer","楊修"]]},{"who":"楊修","t":"丞相心裡在想什麼，我一猜就中！"},{"t":"可是楊修和曹植很要好，捲進了曹家兄弟爭當繼承人的事。曹操怕他惹出亂子，就把他處死了。","mv":[["楊修",7.5,1.0]]},{"t":"後來，楊彪來見曹操。","mv":[["楊彪",-0.9,0.6]]},{"who":"曹操","t":"楊公，您怎麼瘦成這個樣子？","fx":[["focus","楊彪"]]},{"who":"楊彪","t":"我慚愧沒能像漢朝的金日磾那樣，早早看出兒子會闖禍；卻還像老牛舔小牛一樣，捨不得孩子啊。","fx":[["sad","楊彪"]]}],"q":"楊彪後悔自己沒能事先看出兒子會出事。這種「事先就看清楚事情會怎麼發展」的眼光，叫做什麼？","wrong":[{"w":"亡羊補牢","by":"曹操","line":"亡羊補牢是出事以後趕快補救。楊公說的是事情發生以前就看得出來的眼光！"},{"w":"老馬識途","by":"楊修","line":"老馬識途是有經驗的人能帶路。我爹說的是事先看清後果的眼光。"},{"w":"未卜先知","by":"楊彪","line":"未卜先知是不用占卜就知道未來，意思很接近！不過我說的是看清事情發展的「眼光」，有一個更貼切的成語。"}],"hint":"楊彪說自己沒有「先」看出來的「明」亮眼光。","after":"曹操聽了，臉色都變了，也被這位父親的心情打動。","lesson":{"title":"老牛舐犢","text":"楊彪的話裡還藏著另一個成語「老牛舐犢」：老牛舔小牛，比喻父母疼愛子女。金日磾是漢武帝時的大臣，他看出兒子行為不檢點、會替家族惹禍，就嚴厲處置了兒子。","next":"這一年年初，劉備和曹操正在漢中激烈爭奪，劉備手下的老將黃忠……"}},{"id":"e45_04","yr":"西元 219 年","place":"定軍山","scene":"mountain","music":"battle","cast":[["黃忠",-1.0,0.4],["法正",0.4,1.2],["蜀兵",-1.6,-0.8],["蜀兵",-0.2,-1.2],["夏侯尚",7,0.2],["魏兵",7.8,0.9],["魏兵",8,-0.6]],"beats":[{"t":"這一站的故事出自小說《三國演義》。劉備和曹操爭奪漢中，曹操的大將夏侯淵守在定軍山。"},{"t":"蜀將陳式被夏侯淵捉走了，老將黃忠很著急，找謀士法正商量。","fx":[["upset","黃忠"]]},{"who":"法正","t":"夏侯淵個性急躁，有勇無謀。我們每前進一段，就紮一個營，慢慢逼近，引他出來打！","fx":[["focus","法正"]]},{"t":"黃忠照著做：每紮好一個營，住幾天，再往前推進，一路守得牢牢的。","mv":[["黃忠",0.6,0.2],["法正",1.4,1.3],["蜀兵",0,-0.8],["蜀兵#2",1.4,-1.2]]},{"t":"夏侯淵忍不住，派夏侯尚帶兵來挑戰。","mv":[["夏侯尚",3.0,0.2],["魏兵",4.0,0.9],["魏兵#2",4.2,-0.6]]},{"who":"黃忠","t":"來得好！看我老黃忠的厲害！","fx":[["cheer","黃忠"],["cheerAll","蜀兵"]]},{"t":"兩人才交手一回合，黃忠就活捉了夏侯尚！","fx":[["upset","夏侯尚"],["sadAll","魏兵"]]}],"q":"法正教黃忠每前進一段就紮一個營，穩穩地逼近敵人。比喻行動謹慎、防備周全，叫做什麼？","wrong":[{"w":"輕舉妄動","by":"法正","line":"輕舉妄動是沒想清楚就亂行動。我們可是一段一段、小心推進的！"},{"w":"落荒而逃","by":"夏侯尚","line":"落荒而逃是打輸了逃跑。黃將軍是在慢慢前進，要逃的是我們啦！"},{"w":"穩紮穩打","by":"黃忠","line":"穩紮穩打也是穩當地進攻，意思很接近！不過「每走一步就紮一個營」，有一個專門的成語。"}],"hint":"每前進一「步」，就紮一個「營」。","after":"注意：這一套紮營戰法和活捉夏侯尚，是《三國演義》的情節。史書記載，黃忠聽了法正的計策，從高處衝下，一戰就打敗夏侯淵，夏侯淵也戰死了。","lesson":{"title":"劉備稱漢中王","text":"定軍山之戰後，曹操親自帶兵來搶漢中，卻打不贏，只好撤退。西元 219 年，劉備自稱漢中王，這是他一生中最強盛的時候。","next":"第二年曹操過世，兒子曹丕讓漢獻帝把皇位讓給他。當了皇帝的曹丕，對弟弟曹植卻一直不放心……"}},{"id":"e12_07","yr":"曹魏初年","place":"魏國宮殿","scene":"palace","music":"night","cast":[["魏文帝",1.4,-0.4],["曹植",-6.6,1.0],["侍衛",2.8,0.8],["大臣",3.2,-0.8]],"beats":[{"t":"西元 220 年，曹丕當上皇帝，就是魏文帝。他從小和弟弟曹植爭當繼承人，心裡一直對這個弟弟不放心。"},{"t":"有一天，魏文帝把曹植叫來。","mv":[["曹植",-0.8,0.6]]},{"who":"魏文帝","t":"聽說你很會作詩。現在你走七步，七步之內要作出一首詩；作不出來，就要重重處罰！","fx":[["upset","魏文帝"]]},{"t":"曹植一邊走，一邊想。一步、兩步、三步……","mv":[["曹植",0.4,0.2]],"fx":[["focus","曹植"]]},{"who":"曹植","t":"煮豆持作羹，漉菽以為汁。萁在釜下然，豆在釜中泣。本自同根生，相煎何太急！","fx":[["sad","曹植"]]},{"t":"豆萁在鍋子下燒，豆子在鍋子裡哭。它們本來長在同一棵植物上，為什麼要這樣互相煎熬呢？","fx":[["focus",null]]},{"t":"魏文帝聽懂了詩裡的意思，臉上露出慚愧的神色。","fx":[["sad","魏文帝"]]}],"q":"曹植在七步之內，就作出一首好詩。形容一個人才思敏捷、作詩很快，叫做什麼？","wrong":[{"w":"步步高升","by":"侍衛","line":"步步高升是官越做越大。曹植走的那幾步，是在想詩句！"},{"w":"對牛彈琴","by":"魏文帝","line":"對牛彈琴是對聽不懂的人講道理。這首詩，我可是聽得清清楚楚……"},{"w":"煮豆燃萁","by":"曹植","line":"煮豆燃萁也出自我這首詩，不過它比喻兄弟互相傷害。要形容作詩很快，是另一個成語！"}],"hint":"曹植一共走了幾步？","after":"這個故事記在南朝的《世說新語》，正史《三國志》沒有寫，很可能是後人的傳說。不過曹丕在位時，曹植確實被管得很嚴，過得很不開心。","lesson":{"title":"三國鼎立","text":"曹丕建立魏國後，西元 221 年劉備在成都稱帝，後人叫「蜀漢」；後來孫權也稱帝，建立吳國。曹植雖然很有才華，人稱「才高八斗」，一輩子卻沒有機會施展抱負。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二十八章．群雄爭天下","eps":[12,24,32,45]},{"key":"ch2","short":"三國時代","era":"西元 184–280 年","color":"#2F7A4A","map":{"ground":"#a9c27a","river":"#5a9fd0"},"intro":{"lines":["東漢末年，朝廷腐敗，又發生了黃巾之亂，天下大亂。","各地的軍閥互相攻打：曹操統一了北方，孫權守住江東，劉備則四處奔走，一直沒有自己的地盤。","西元 208 年的赤壁之戰，孫權和劉備聯手，用火攻打敗曹操，天下漸漸分成三份。","後來曹丕建立魏國，劉備建立蜀漢，孫權建立吳國，這就是「三國」。","最後，三國被晉朝統一。我們要穿越的，就是這段英雄輩出的時代！"],"people":[["曹操","統一北方，兒子曹丕建立魏國"],["劉備","漢朝皇族後代，建立蜀漢"],["諸葛亮","蜀漢丞相，字孔明"],["孫權","守住江東，建立吳國"]]},"stops":[{"id":"e19_03","yr":"東漢末年","place":"行軍路上","scene":"road","music":"battle","cast":[["曹操",6,0.6],["魏兵",7.2,1.4],["魏兵",8,0.2],["魏兵",7.6,-0.9],["魏兵",8.8,1.2]],"beats":[{"t":"東漢末年天下大亂，曹操帶著軍隊四處征戰，想要統一北方。","mv":[["曹操",0.2,0.4],["魏兵",1.4,1.2],["魏兵#2",2.4,0.2],["魏兵#3",1.9,-0.9],["魏兵#4",3.2,1.2]]},{"t":"有一次行軍，大軍找不到取水的路。太陽好大，大家走得又熱又渴。","fx":[["sadAll","魏兵"]]},{"who":"魏兵","t":"好渴啊……水壺裡一滴水都沒有了……"},{"who":"曹操","t":"再這樣下去，大家都走不動了……","fx":[["focus","曹操"]]},{"t":"曹操抬頭看看前方，想到了一個好辦法。","fx":[["say","曹操"]]}],"q":"曹操大喊：「前面有一大片梅林，梅子又多又酸甜，可以解渴！」士兵一聽，嘴裡都流出口水。這個故事變成哪個成語？","wrong":[{"w":"水落石出","by":"魏兵","line":"水落石出是真相大白。我們現在連一滴水都沒看到啊！"},{"w":"飲水思源","by":"曹操","line":"飲水思源是喝水時要記得水從哪裡來。現在的問題是根本沒有水喝！"},{"w":"畫餅充飢","by":"魏兵","line":"畫餅充飢是用畫的餅填肚子，意思很像！不過主公說的是酸酸的梅子，史書記的是另一個成語。"}],"hint":"想一想，曹操說前面有什麼水果？","after":"士兵們打起精神趕路，終於找到了水源。","lesson":{"title":"曹操統一北方","text":"曹操很會用計謀，也很會用人。西元 200 年，他在官渡之戰以少勝多，打敗北方最強的袁紹，後來統一了北方。這個故事記在《世說新語》的〈假譎〉篇，「假譎」就是用計謀騙人。","next":"這時候，有一個人還在四處投靠別人，他就是劉備……"}},{"id":"e19_01","yr":"西元 207 年","place":"隆中","scene":"cottage","music":"palace","cast":[["劉備",-7,1.2],["關羽",-8,0.2],["張飛",-8,2],["諸葛亮",1.4,-1.9,0,null,1]],"beats":[{"t":"劉備是漢朝皇族的後代，一心想要復興漢室。可是他打了二十多年仗，還是沒有自己的地盤，只能投靠荊州的劉表，駐守在新野。"},{"t":"謀士徐庶告訴劉備：「隆中有一位諸葛孔明，是一條臥龍。這個人只能親自去拜訪，不能叫他來。」"},{"t":"於是劉備帶著關羽、張飛，來到隆中的草廬。","mv":[["劉備",-1.4,0.6],["關羽",-2.6,-0.4],["張飛",-2.4,1.2]]},{"t":"史書上說，劉備「凡三往，乃見」——一共去了三次，才見到諸葛亮。","fx":[["focus","劉備"]]},{"who":"劉備","t":"只要能請到真正的人才，跑幾趟都值得。"},{"t":"第三次，諸葛亮終於出來了。","mv":[["諸葛亮",1.1,0.5]]},{"who":"諸葛亮","t":"將軍請坐。先取荊州、益州，再聯合東邊的孫權，一起對抗北方的曹操……"},{"t":"這段分析天下大勢的話，就是有名的〈隆中對〉。"}],"q":"後來諸葛亮在〈出師表〉裡寫：先帝不嫌我身分低，三次到草廬來看我。這樣誠心邀請人才，叫做什麼？","wrong":[{"w":"三心二意","by":"張飛","line":"大哥要是三心二意，早就不來了！他可是一連來了三次。"},{"w":"門可羅雀","by":"諸葛亮","line":"門可羅雀是門口冷清得可以抓麻雀。將軍來了三次，我家門口可熱鬧了！"},{"w":"禮賢下士","by":"諸葛亮","line":"禮賢下士是尊重人才，意思很接近！不過「三次到草廬」，有一個專門的成語。"}],"hint":"「顧」是拜訪，「茅廬」是茅草蓋的房子。","after":"諸葛亮被劉備的誠意感動，答應出山幫忙。那年他才二十多歲。","lesson":{"title":"隆中對","text":"諸葛亮字孔明，年輕時在隆中種田讀書，人稱「臥龍」。他在〈隆中對〉裡替劉備規畫了「三分天下」的藍圖，後來的發展，大致照著他說的走。","next":"可是，劉備這麼看重一個年輕人，跟了他很多年的關羽和張飛，心裡不太高興……"}},{"id":"e19_02","yr":"西元 207 年","place":"新野","scene":"tent","music":"palace","table":true,"cast":[["劉備",-1.2,0.6],["諸葛亮",1.2,0.6],["關羽",-6.5,1],["張飛",-6.5,2.2]],"beats":[{"t":"諸葛亮來了以後，劉備天天和他討論天下大事，兩人的感情越來越好。","fx":[["say","劉備"]]},{"who":"劉備","t":"孔明，下一步該怎麼走？"},{"who":"諸葛亮","t":"主公，荊州是兵家必爭的地方，一定要先準備好……"},{"t":"關羽和張飛跟著劉備出生入死好多年，看在眼裡，心裡很不是滋味。","mv":[["關羽",-3.2,-0.2],["張飛",-3.4,1.2]]},{"who":"張飛","t":"大哥整天只跟那個書生說話！","fx":[["upset","張飛"]]},{"who":"關羽","t":"我們跟著大哥打了這麼多年仗……","fx":[["upset","關羽"]]}],"q":"劉備對關羽、張飛說：「我有孔明，就像魚有了水一樣，請你們不要再說了。」這句話變成哪個成語？","wrong":[{"w":"緣木求魚","by":"張飛","line":"緣木求魚是爬到樹上抓魚，根本抓不到。大哥是說他離不開孔明！"},{"w":"渾水摸魚","by":"關羽","line":"渾水摸魚是趁亂撈好處。大哥可不是這種人！"},{"w":"相見恨晚","by":"諸葛亮","line":"相見恨晚是遺憾太晚認識。主公說的是離不開我，就像魚離不開水，還有更貼切的成語！"}],"hint":"魚離開了什麼，就活不下去？","after":"關羽和張飛聽了，就不再抱怨了。","lesson":{"title":"赤壁之戰","text":"西元 208 年，曹操帶著大軍南下。諸葛亮到江東說服孫權聯手，吳國大將周瑜在赤壁用火攻大敗曹軍。從此曹操、孫權、劉備三分天下的局面漸漸形成。","next":"赤壁之戰後，周瑜過世，由魯肅接替他。吳國還有一位大將，正在用功讀書……"}},{"id":"e19_05","yr":"西元 210 年","place":"吳國．長江邊","scene":"river","music":"palace","cast":[["呂蒙",-1.1,0.6],["孫權",1.3,0.6],["魯肅",7,1]],"beats":[{"t":"吳國大將呂蒙很會打仗，可是小時候家裡窮，沒有讀什麼書。"},{"who":"孫權","t":"你現在擔任重要的職位，應該多讀書，增長見識。"},{"who":"呂蒙","t":"軍中的事情太多了，恐怕沒有時間讀書……","fx":[["sad","呂蒙"]]},{"who":"孫權","t":"我也很忙，還是常常讀書。我不是要你當學者，只是要你多看看歷史，知道以前發生過的事。"},{"t":"呂蒙從此下定決心，用功讀書，從不偷懶。","mv":[["孫權",6.5,-1]]},{"t":"後來魯肅接替周瑜的位置，經過呂蒙的軍營。","mv":[["魯肅",1.3,0.6]]},{"t":"兩人談起怎麼對付守在荊州的關羽。呂蒙對答如流，還替魯肅想出五條計策。","fx":[["say","呂蒙"]]},{"who":"魯肅","t":"我以為老弟只會打仗，沒想到學問這麼好，已經不是以前吳下的阿蒙了！","fx":[["upset","魯肅"]]}],"q":"呂蒙笑著回答：「讀書人分開三天，就要擦亮眼睛重新看他。」這句話變成哪個成語？","wrong":[{"w":"目不轉睛","by":"呂蒙","line":"目不轉睛是眼睛一直盯著看。我說的是要用新的眼光看我！"},{"w":"一目十行","by":"魯肅","line":"一目十行是看書很快。他是學問變好了，不是在比誰看得快！"},{"w":"士別三日","by":"呂蒙","line":"「士別三日」是我這句話的前半句喔！後半句「擦亮眼睛重新看」，才是要找的成語。"}],"hint":"「刮目」是擦亮眼睛。","after":"從此大家再也不敢小看呂蒙了。","lesson":{"title":"吳下阿蒙","text":"呂蒙後來接替魯肅，守衛吳國西邊。西元 219 年，他趁關羽北上攻打曹軍，偷偷渡江拿下荊州。一個原本不愛讀書的武將，靠著讀書成為有謀略的大將。","next":"同一年，在北方的漢中，劉備和曹操也正在搶地盤……"}},{"id":"e32_06","yr":"西元 219 年","place":"漢中．趙雲營寨","scene":"walls","music":"battle","cast":[["趙雲",7,-5],["張翼",-1.4,0.8],["蜀兵",-2.6,-0.2],["蜀兵",0.2,1.4],["曹兵",-9,-6],["曹兵",-8,-7],["曹兵",9,-6],["曹兵",8,-7]],"beats":[{"t":"西元 219 年，劉備和曹操爭奪漢中。曹操把幾千萬袋軍糧，運到北山下。"},{"t":"老將黃忠帶兵去搶糧食，可是過了約定的時間，還沒回來。"},{"who":"張翼","t":"黃將軍怎麼還沒回來？趙將軍出去接應了……"},{"t":"趙雲帶著幾十個騎兵出去，卻正好撞上曹操的大軍。他一邊打、一邊退回營寨。","mv":[["趙雲",0.8,0.2],["曹兵",-2.4,-4.4],["曹兵#2",-0.8,-5],["曹兵#3",1,-4.6],["曹兵#4",2.6,-4.4]]},{"who":"張翼","t":"敵人追來了！快關上營門守住！","fx":[["upset","張翼"]]},{"who":"趙雲","t":"不！把營門大大打開，放倒軍旗，停止打鼓。大家安靜，別出聲。","fx":[["flagsDown"]]},{"t":"曹軍追到營門口，看到裡面靜悄悄的，懷疑有埋伏，不敢進去，掉頭撤退了。","mv":[["曹兵",-4.4,-7.4],["曹兵#2",-2.6,-8],["曹兵#3",2.8,-8],["曹兵#4",4.6,-7.4]]}],"q":"趙雲放倒軍旗、停止打鼓，讓曹軍摸不清虛實。這叫什麼？","wrong":[{"w":"大張旗鼓","by":"張翼","line":"大張旗鼓是把旗子、鼓聲弄得很熱鬧，剛好相反！"},{"w":"鑼鼓喧天","by":"趙雲","line":"鑼鼓喧天是聲音大到震天。我是叫大家把鼓停下來！"},{"w":"按兵不動","by":"趙雲","line":"按兵不動是暫時不出兵。我不只是不出兵，還把旗子放倒、鼓也停了，有更貼切的成語！"}],"hint":"「偃」是放倒，「息」是停止。","after":"曹軍一撤退，趙雲立刻擂起戰鼓，用強弩從背後射擊，曹軍嚇得互相踩踏。","lesson":{"title":"子龍一身都是膽","text":"第二天，劉備親自來看昨天的戰場，稱讚說：「子龍一身都是膽！」這一年，劉備打敗曹操，奪下漢中，自稱「漢中王」。","next":"第二年曹操過世，兒子曹丕建立魏國。再過一年，劉備也在成都當上皇帝，國號還是「漢」，後人叫它「蜀漢」……"}},{"id":"e19_04","yr":"西元 221 年","place":"成都．丞相府","scene":"office","music":"palace","cast":[["諸葛亮",-1,0.6],["董和",1.6,0.4],["官員",2.6,1.4],["官員",3.4,0.4]],"beats":[{"t":"劉備在成都當上皇帝，任命諸葛亮當丞相，處理國家大事。","fx":[["focus","諸葛亮"]]},{"t":"諸葛亮常常想起以前的同事董和。董和和他一起辦公七年，遇到想不通的事，會來來回回討論，甚至找他商量十次。","mv":[["董和",-0.2,0.2]]},{"who":"董和","t":"這件事，我還是覺得不太妥當，我們再想想……","mv":[["董和",1.8,0.6]]},{"who":"董和","t":"……我又想到一個地方，可能有問題。","mv":[["董和",-0.1,0.3]]},{"t":"諸葛亮把官員們找來。","mv":[["官員",1.6,1.4],["官員#2",2.6,0.2]]},{"who":"諸葛亮","t":"大家一起辦公，就是要把眾人的想法集中起來。如果怕得罪人，不敢提出不同意見，國家就會受到損失。"}],"q":"諸葛亮說：「集眾思，廣忠益。」希望大家多提意見。這句話後來變成哪個成語？","wrong":[{"w":"自以為是","by":"諸葛亮","line":"自以為是是只相信自己。我正是要大家多提不同的意見！"},{"w":"眾口鑠金","by":"官員","line":"眾口鑠金是說人多嘴雜，連金子都能說熔，是講謠言可怕。丞相說的是好事！"},{"w":"群策群力","by":"諸葛亮","line":"群策群力是大家一起出主意、出力氣，意思很接近！不過「集眾思，廣忠益」對應的是另一個成語。"}],"hint":"「集思」是集中大家的想法，「廣益」是吸收更多好意見。","after":"諸葛亮說，能聽到不同意見，就像丟掉破草鞋，撿到珍珠寶玉一樣。","lesson":{"title":"諸葛亮治蜀","text":"諸葛亮當丞相，賞罰公平，做事認真，還要求官員互相指出錯誤。寫《三國志》的陳壽稱讚他治理國家「開誠心，布公道」。","next":"劉備當上皇帝後，最想做的一件事，是替被吳國殺害的關羽報仇……"}},{"id":"e19_08","yr":"西元 222 年","place":"夷陵","scene":"valley","music":"battle","winSad":"劉備","cast":[["陸遜",-1.4,0.4],["吳將",-2.8,-0.2,0,1],["吳將",0,-0.6,0,0],["劉備",6.6,-3.2,0.25],["蜀兵",7.6,-4,0.25],["蜀兵",5.8,-4.2,0.25]],"beats":[{"t":"西元 221 年，劉備帶著大軍攻打吳國，要替關羽報仇，一路打到夷陵。","mv":[["劉備",4.4,-1.2],["蜀兵",5.4,-2],["蜀兵#2",3.6,-2.2]]},{"t":"吳王孫權派陸遜當大都督。陸遜很年輕，又是讀書人出身，很多老將都不服他。"},{"who":"吳將","t":"一個書生，懂什麼打仗！我們要馬上出戰！","fx":[["upset","吳將"]]},{"t":"陸遜按著劍，站了起來。","fx":[["focus","陸遜"]]},{"who":"陸遜","t":"我雖然是書生，但是接受了主上的命令。主上讓各位聽我指揮，是因為我忍得了委屈、扛得起重擔。軍令如山，誰也不能違反！"},{"t":"陸遜堅守了好幾個月，不管將領們怎麼抱怨，就是不出戰。蜀軍越來越疲累，營寨連綿好幾百里。"},{"t":"時機到了！陸遜下令用火攻，蜀軍的營寨一個接一個燒了起來。","fx":[["fire",4.4,-2.6],["fire",6,-3.4],["fire",3,-3.6],["burst","劉備","#ff7a1a"]],"mv":[["蜀兵",8,-5],["蜀兵#2",7,-6]]}],"q":"陸遜為了完成任務，忍受將領們的不服和抱怨，最後打了勝仗。這叫什麼？","wrong":[{"w":"臨陣脫逃","by":"吳將","line":"臨陣脫逃是打仗時逃跑。都督一步也沒退啊！"},{"w":"任人宰割","by":"陸遜","line":"任人宰割是只能讓人欺負。我是在等最好的時機反擊！"},{"w":"忍氣吞聲","by":"吳將","line":"忍氣吞聲是受了氣不敢出聲，只能忍耐。都督不只是忍，還扛起打敗劉備的重責大任！"}],"hint":"「辱」是委屈，「負重」是扛起重擔。","after":"陸遜大獲全勝。將領們這才知道，計策大多是陸遜想出來的，全都服了他。","lesson":{"title":"夷陵之戰","text":"夷陵之戰後，劉備退到白帝城，不久病重，把兒子劉禪託付給諸葛亮。諸葛亮後來重新和吳國結盟，又多次北伐魏國，最後病死在五丈原的軍營中。","next":"諸葛亮過世將近三十年後，魏國大軍打進了蜀漢……"}},{"id":"e19_07","yr":"西元 264 年","place":"洛陽","scene":"palace","music":"palace","cast":[["劉禪",-1.1,0.6],["司馬昭",1.4,0.6],["舞者",-0.6,-1.6],["舞者",0.6,-1.6],["郤正",-6.5,1.4]],"beats":[{"t":"西元 263 年，魏國大軍打進成都。蜀漢的皇帝劉禪投降，蜀漢滅亡了。"},{"t":"劉禪被帶到魏國的首都洛陽，封為「安樂公」。"},{"t":"有一天，掌權的司馬昭請劉禪喝酒，還故意安排蜀地的歌舞表演。","fx":[["cheerAll","舞者"]]},{"t":"旁邊的蜀國舊臣看了都很難過，劉禪卻笑嘻嘻的，好像什麼事都沒發生。","fx":[["cheer","劉禪"]]},{"who":"司馬昭","t":"你想念蜀國嗎？"}],"q":"劉禪回答：「這裡很快樂，我不想念蜀國。」這句話變成哪個成語？","wrong":[{"w":"落葉歸根","by":"司馬昭","line":"落葉歸根是說人老了總想回到家鄉。他可是一點也不想回去啊！"},{"w":"憂國憂民","by":"司馬昭","line":"憂國憂民是替國家和百姓擔心。他笑得這麼開心，哪裡在擔心？"},{"w":"樂此不疲","by":"劉禪","line":"樂此不疲是做喜歡的事不覺得累。我說的是在這裡快樂得不想念蜀國，有一個專門的成語！"}],"hint":"蜀國的「蜀」，就藏在成語裡。","after":"大臣郤正教劉禪下次要哭著說想念祖先的墳墓。劉禪照著說，司馬昭一聽就問：「怎麼跟郤正說的一樣？」大家都笑了。","lesson":{"title":"三國歸晉","text":"司馬昭的兒子司馬炎後來取代魏國，建立晉朝。西元 280 年，晉朝滅了吳國，三國時代結束，天下重新統一。","next":"三國風雲這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","name":"三國風雲","title":"第二十九章．三國風雲","eps":[19,32]},{"key":"h26","line":"history","name":"三國鼎立","short":"三國時代","era":"西元 221–250 年","color":"#3E6FA8","map":{"ground":"#a9c27a","river":"#5a9fd0"},"intro":{"lines":["西元 220 年，曹丕當上皇帝，建立魏國，漢朝結束了。","第二年，劉備在成都稱帝，後人叫「蜀漢」；孫權在江東當上吳王，後來也稱帝。","魏、蜀、吳三國互相競爭，也互派使者。蜀漢丞相諸葛亮好幾次北伐魏國。","諸葛亮過世後，魏國的大權漸漸落到司馬懿一家手上，讀書人也流行談玄說理。"],"people":[["諸葛亮","蜀漢丞相，公正又忠心"],["曹丕","魏文帝，曹操的兒子"],["孫權","吳國的君主"],["阮籍","竹林七賢之一，個性自由自在"]]},"stops":[{"id":"e32_05","yr":"西元 221 年","place":"魏國朝廷","scene":"office","music":"palace","cast":[["魏文帝",1.2,-0.8],["趙咨",-6.6,0.8],["魏臣",2.8,0.6],["魏臣",3.4,-0.6]],"beats":[{"t":"西元 221 年，孫權接受魏國封他為吳王，派大夫趙咨出使魏國。趙咨學問好，反應又快。","mv":[["趙咨",-0.8,0.6]]},{"t":"魏文帝曹丕想給吳國使者一點難堪，故意開口嘲笑。"},{"who":"魏文帝","t":"吳王懂不懂學問啊？","fx":[["say","魏文帝"]]},{"who":"趙咨","t":"吳王有上萬艘戰船、百萬大軍，任用賢能，心懷天下。有空就博覽群書，可不像書呆子只會摘抄句子！","fx":[["say","趙咨"]]},{"t":"魏文帝沒難倒他，又出了一題。","fx":[["upset","魏文帝"]]},{"who":"魏文帝","t":"像你這樣的人才，吳國有幾個？","fx":[["focus","趙咨"]]}],"q":"趙咨回答：「特別聰明的有八九十人；像我這樣的，用車子裝、用斗來量，數都數不完！」形容數量非常多，叫做什麼？","wrong":[{"w":"寥寥無幾","by":"魏臣","line":"寥寥無幾是少得可憐。趙大夫說吳國的人才多得數不完！"},{"w":"杯水車薪","by":"魏臣#2","line":"杯水車薪是一杯水救一車柴火，力量太小。跟人才多不多沒關係啦！"},{"w":"多如牛毛","by":"趙咨","line":"多如牛毛也是多得數不清，意思很接近！不過我說的是用車裝、用斗量，有一個專門的成語。"}],"hint":"「斗」是古代量米的器具。","after":"魏國人聽了都很佩服趙咨。孫權知道後非常高興，升了他的官。","lesson":{"title":"吳王孫權","text":"當時劉備正要帶大軍攻打東吳，孫權為了避免兩面作戰，暫時向魏國稱臣，接受「吳王」的封號。等局勢穩定後，孫權在西元 229 年也當了皇帝。","next":"魏文帝的後宮裡，有一位聰明又有謀略的郭夫人，文帝想立她當皇后……"}},{"id":"e45_05","yr":"西元 222 年","place":"魏國宮殿","scene":"palace","music":"palace","cast":[["魏文帝",1.4,-0.4],["郭夫人",2.6,0.4],["棧潛",-6.6,0.8],["宮女",3.4,-0.8]],"beats":[{"t":"魏文帝曹丕很寵愛郭夫人。她聰明有謀略，常常替文帝出主意。","fx":[["cheer","郭夫人"]]},{"who":"魏文帝","t":"我要立你當皇后！","fx":[["say","魏文帝"]]},{"t":"大臣棧潛聽說了，趕緊寫了一封奏章來勸告。","mv":[["棧潛",-0.8,0.6]]},{"who":"棧潛","t":"陛下，帝王治理天下，除了外面的大臣，也要靠宮裡賢明的皇后幫忙。"},{"who":"棧潛","t":"從前黃帝、舜的妻子都很賢明，美好的名聲一直傳到後代。立皇后，一定要非常慎重啊！","fx":[["focus","棧潛"]]},{"t":"棧潛擔心郭夫人出身不高，又只是因為受寵才當皇后。可是文帝不聽，還是立她為皇后。","fx":[["sad","棧潛"],["cheer","郭夫人"]]}],"q":"棧潛說，賢明的皇后，美好的名聲會一直流傳到後代。形容美名永遠流傳，叫做什麼？","wrong":[{"w":"遺臭萬年","by":"宮女","line":"遺臭萬年是壞名聲傳了好久好久，剛好相反！"},{"w":"默默無聞","by":"魏文帝","line":"默默無聞是沒有人知道。棧潛說的是美名一代一代傳下去！"},{"w":"名垂青史","by":"棧潛","line":"名垂青史是名字寫進歷史，意思很接近！不過說「美好的名聲像花香一樣傳下去」，有一個專門的成語。"}],"hint":"「芳」是花的香氣，比喻美好的名聲。","after":"郭皇后當上皇后以後，做人很謹慎，常提醒家人不可以驕傲奢侈。","lesson":{"title":"流芳上世","text":"棧潛的奏章原文寫的是「流芳上世」，後來演變成今天的「流芳百世」。郭皇后雖然出身不高，當上皇后後卻很守規矩，也不准親戚仗著她的勢力胡作非為。","next":"這時候，蜀漢的丞相諸葛亮，正準備帶兵到南方去平定叛亂……"}},{"id":"e21_04","yr":"西元 225 年","place":"南中","scene":"south","music":"battle","cast":[["諸葛亮",1.2,-0.6],["馬謖",2.6,0.6],["孟獲",-6.8,0.6],["蜀兵",-7.4,-0.2],["蜀兵",-7.6,1.4]],"beats":[{"t":"西元 225 年，蜀漢南方的南中地區發生叛亂。丞相諸葛亮親自帶兵南征。"},{"who":"馬謖","t":"丞相，南方離得遠，今天打敗他們，明天又會反叛。用兵要讓人心服，才是上策！","fx":[["say","馬謖"]]},{"t":"南方首領孟獲很受當地人尊敬。蜀軍把他抓了來。","mv":[["孟獲",-0.6,0.4],["蜀兵",-1.6,-0.2],["蜀兵#2",-1.4,1.2]]},{"who":"孟獲","t":"我不服！我是不知道你們的虛實，才會輸！","fx":[["upset","孟獲"]]},{"who":"諸葛亮","t":"那就放你回去，再來打一次！","fx":[["focus","諸葛亮"]]},{"t":"孟獲回去又打，又被抓；抓了又放，放了又抓……一共抓了七次。","mv":[["孟獲",-7.6,0.6]],"fx":[["focus",null]]},{"who":"孟獲","t":"第七次……丞相您真有天威！我們南方人不會再反叛了！","mv":[["孟獲",-0.6,0.4]],"fx":[["sad","孟獲"],["cheerAll","蜀兵"]]}],"q":"諸葛亮為了讓孟獲真正心服，故意抓了又放。想要牢牢抓住對方，故意先放開他，這是兵書裡的哪一條計策？","wrong":[{"w":"打草驚蛇","by":"蜀兵","line":"打草驚蛇是不小心驚動了敵人。丞相是故意放人，想得可深了！"},{"w":"放虎歸山","by":"馬謖","line":"放虎歸山是放走危險的敵人，留下後患。丞相放孟獲，可是為了收服他的心！"},{"w":"以退為進","by":"諸葛亮","line":"以退為進是先退讓再爭取，意思有點接近！不過「想要抓住，故意先放」，是三十六計裡專門的一條計策。"}],"hint":"三十六計之一：「擒」是抓，「縱」是放。","after":"據說從此諸葛亮在世時，南中再也沒有反叛。「七擒七縱」記在《漢晉春秋》，是不是真的抓放七次，史學家還有不同看法。","lesson":{"title":"三十六計","text":"這個成語是兵書《三十六計》裡的一計：把敵人逼太急，他會拚命反抗；放他一條路，慢慢消耗他的力氣和鬥志，最後就能輕鬆收服。南方平定後，諸葛亮就能專心北伐了。","next":"西元 228 年冬天，諸葛亮再次出兵，猛攻魏國的陳倉……"}},{"id":"e45_08","yr":"西元 228 年","place":"洛陽．河南城","scene":"palace","music":"palace","cast":[["魏明帝",1.4,-0.4],["張郃",-6.6,0.8],["魏兵",2.8,0.8],["魏兵",3.4,-0.6],["魏兵",4.0,0.4]],"beats":[{"t":"西元 228 年冬天，諸葛亮再次北伐，帶兵猛攻魏國的陳倉城。"},{"t":"魏明帝曹叡很緊張，派快馬把大將張郃叫回京城。","mv":[["張郃",-0.8,0.6]]},{"t":"明帝親自到河南城擺酒送行，還派了三萬士兵跟著張郃出發。","fx":[["cheerAll","魏兵"]]},{"who":"魏明帝","t":"等將軍趕到，陳倉會不會已經被諸葛亮打下來了？","fx":[["upset","魏明帝"]]},{"t":"張郃知道蜀軍走了很遠的路，沒帶夠糧食，不能久攻。他彎起手指算了算。","fx":[["focus","張郃"]]},{"who":"張郃","t":"陛下放心！我還沒到，諸葛亮就已經退兵了。蜀軍的糧食，撐不到十天！","fx":[["say","張郃"]]}],"q":"張郃彎著手指一算，就知道蜀軍的糧食不到十天。後來把「彎著手指就能數完」，用來形容數量很少，這個成語是什麼？","wrong":[{"w":"數不勝數","by":"魏明帝","line":"數不勝數是多得數不完，剛好相反！"},{"w":"指鹿為馬","by":"魏兵","line":"指鹿為馬是故意顛倒是非。將軍的手指，是拿來算糧食的！"},{"w":"寥寥無幾","by":"張郃","line":"寥寥無幾也是很少，意思很接近！不過我是扳著手指算出來的，有一個專門的成語。"}],"hint":"「屈指」就是彎起手指頭。","after":"張郃日夜趕路，還沒趕到，諸葛亮果然已經退兵了。明帝升張郃為征西車騎將軍。","lesson":{"title":"諸葛亮北伐","text":"諸葛亮好幾次北伐，最大的難題就是糧食：蜀道又高又險，運糧非常困難。為了解決這個問題，他後來還做出運糧的工具「木牛流馬」。","next":"諸葛亮治理蜀漢，也有一套讓大家心服口服的辦法……"}},{"id":"e45_01","yr":"約西元 230 年","place":"成都．丞相府","scene":"office","music":"palace","cast":[["諸葛亮",0,-0.6],["官員",-6.6,0.6],["官員",7,0.8]],"beats":[{"t":"諸葛亮當蜀漢丞相時，安撫百姓、訂好規矩，讓每個官員都清楚自己的職責。"},{"t":"有一位官員以前和諸葛亮不合，可是他做事盡心盡力。","mv":[["官員",-1.0,0.6]]},{"who":"諸葛亮","t":"你對國家有功，該賞！","fx":[["cheer","官員"]]},{"who":"官員","t":"我以前和丞相過不去，丞相還獎賞我？","fx":[["say","官員"]]},{"t":"另一位官員和諸葛亮很親近，卻違法又偷懶。","mv":[["官員#2",1.6,0.6]]},{"who":"諸葛亮","t":"犯了法，就算跟我再親近，也一樣要罰！","fx":[["sad","官員#2"]]},{"t":"諸葛亮的法令很嚴，可是蜀漢上下又怕他、又愛他，被罰的人也沒有怨言。","fx":[["focus","諸葛亮"]]}],"q":"史學家陳壽稱讚諸葛亮「敞開真誠的心，拿出公正的道理」對待每個人。形容誠心待人、坦白沒有私心，叫做什麼？","wrong":[{"w":"假公濟私","by":"官員#2","line":"假公濟私是借公家的名義替自己撈好處。丞相連親近的人都照罰呢！"},{"w":"笑裡藏刀","by":"官員","line":"笑裡藏刀是表面和氣、心裡害人。丞相對誰都是真心的！"},{"w":"大公無私","by":"諸葛亮","line":"大公無私是完全公正、沒有私心，意思很接近！不過陳壽說我「開誠心，布公道」，有一個專門的成語。"}],"hint":"「開」是敞開，「布」是公開拿出來。","after":"陳壽說，諸葛亮用心公平、獎懲清楚，所以刑罰雖然嚴，大家卻沒有怨言。","lesson":{"title":"鞠躬盡瘁","text":"西元 234 年，諸葛亮最後一次北伐，在五丈原病逝，才五十四歲。相傳他說要「鞠躬盡瘁，死而後已」，成為後人心中忠臣的代表。","next":"在魏國，魏明帝要選拔官員，他對「名氣」這件事很有意見……"}},{"id":"e32_02","yr":"約西元 235 年","place":"魏國朝廷","scene":"office","music":"palace","cast":[["魏明帝",1.0,-0.8],["盧毓",-6.6,0.8],["魏臣",2.6,0.6]],"beats":[{"t":"魏明帝想選一位中書郎，把這件事交給管人事的吏部尚書盧毓。","mv":[["盧毓",-0.8,0.6]]},{"who":"魏明帝","t":"選不選得到好人才，就看你了。千萬不要只挑有名氣的！","fx":[["say","魏明帝"]]},{"who":"魏明帝","t":"名氣就像在地上畫一個餅，看起來很像，卻不能吃啊！","fx":[["focus","魏明帝"]]},{"who":"盧毓","t":"陛下，光靠名氣找不到奇才，卻能找到不錯的人才。他們想學好，才有好名聲，不必討厭。"},{"who":"盧毓","t":"重要的是考核真本事。現在沒有考核官員的辦法，只靠別人說好說壞，真的假的都混在一起了。","fx":[["say","盧毓"]]},{"who":"魏明帝","t":"有道理！就訂出考核官員的辦法吧！","fx":[["cheer","魏明帝"]]}],"q":"魏明帝說，名氣就像畫在地上的餅，不能吃。後來比喻有名無實，或用空想來安慰自己，叫做什麼？","wrong":[{"w":"狼吞虎嚥","by":"魏臣","line":"狼吞虎嚥是吃得又急又快。畫的餅，連一口都吃不到！"},{"w":"名列前茅","by":"盧毓","line":"名列前茅是排名很前面。陛下說的是名氣不實在！"},{"w":"望梅止渴","by":"魏明帝","line":"望梅止渴也是用想像安慰自己，意思很接近！不過那是我祖父曹操的故事，我說的是畫在地上的餅。"}],"hint":"畫出來的「餅」，能讓肚子不「飢」餓嗎？","after":"明帝採納了盧毓的意見，下令制定考核官員的辦法。","lesson":{"title":"九品中正制","text":"魏國選官員用「九品中正制」：由地方上有名望的人，把人才分成九個等級。可是時間久了，評等越來越看家世，變成「上品無寒門，下品無勢族」。","next":"魏國大臣王昶，替家裡的孩子取名字時，花了好多心思……"}},{"id":"e45_07","yr":"曹魏時期","place":"王昶家","scene":"study","music":"night","cast":[["王昶",-0.6,-1.6],["王默",6.8,0.2],["王沈",7.4,1.2],["王渾",7.8,-0.6],["王深",8.2,0.6]],"beats":[{"t":"魏國大臣王昶很有學問。他替姪子和兒子取名字，每個名字都有特別的用意。","fx":[["focus","王昶"]]},{"t":"孩子們都來了。","mv":[["王默",0.8,0.2],["王沈",1.8,0.9],["王渾",2.0,-0.6],["王深",0.4,1.2]],"fx":[["focus",null]]},{"who":"王昶","t":"姪子叫王默、王沈，兒子叫王渾、王深。默是安靜，沈是穩重，渾和深是不張揚、有內涵。","fx":[["say","王昶"]]},{"who":"王默","t":"這些名字，都有謙虛的意思呢！","fx":[["cheer","王默"]]},{"t":"王昶還寫了一封信，告訴孩子們做人做事的道理。"},{"who":"王昶","t":"我用這些字替你們取名，是希望你們每次看到自己的名字，就想想它的意思，不敢違背。","fx":[["focus","王昶"]]}],"q":"王昶希望孩子們看到自己的名字，就想到名字裡的意思。看到名稱就聯想到它的含義，叫做什麼？","wrong":[{"w":"名落孫山","by":"王渾","line":"名落孫山是考試沒考上。我們說的是名字的意思啦！"},{"w":"隱姓埋名","by":"王深","line":"隱姓埋名是把名字藏起來。爹可是希望我們天天想著自己的名字！"},{"w":"望文生義","by":"王昶","line":"望文生義是只看字面、隨便猜意思，常常會猜錯。我要你們認真想想名字真正的含義！"}],"hint":"「顧」是看，「義」是意思。","after":"王昶在信裡還說：早上開的花，晚上就凋謝了；松柏長得慢，到了寒冬卻不會枯萎。做人不要急著出風頭。","lesson":{"title":"王昶家誡","text":"王昶的這封信叫〈家誡〉，教子孫要謙虛、穩重、不要驕傲。他的兒子王渾，後來成為西晉的大將，還參加了消滅吳國的戰爭。","next":"可是當時魏國朝廷裡，有些人正驕傲得不得了。何晏、鄧颺跟著大將軍曹爽，權勢很大……"}},{"id":"e32_03","yr":"西元 248 年底","place":"何晏家","scene":"house","music":"night","cast":[["何晏",1.0,-0.4],["鄧颺",2.4,0.6],["管輅",-6.6,0.8]],"beats":[{"t":"魏國的何晏、鄧颺跟著大將軍曹爽，權勢很大，做事卻很驕傲。"},{"t":"有個叫管輅的人很會占卜。何晏請他來家裡算一卦。","mv":[["管輅",-0.8,0.6]]},{"who":"何晏","t":"請先生算算，我能不能當上三公？還有，我一直夢見幾十隻蒼蠅停在鼻子上，趕都趕不走，這是什麼意思？","fx":[["say","何晏"]]},{"who":"管輅","t":"蒼蠅喜歡臭東西。地位太高容易跌倒，太張狂容易滅亡。您要謙虛小心、多做好事，蒼蠅自然就飛走了。","fx":[["focus","管輅"]]},{"t":"一旁的鄧颺聽了，不以為然地撇撇嘴。","fx":[["upset","鄧颺"]]},{"who":"鄧颺","t":"哼，這不過是老書生天天掛在嘴邊的老話罷了！","fx":[["focus","鄧颺"],["say","鄧颺"]]}],"q":"鄧颺說管輅的勸告，只是老書生常說、沒有新意的老話。這種大家聽慣了的老話，叫做什麼？","wrong":[{"w":"異想天開","by":"何晏","line":"異想天開是想法離譜。管先生說的是大家常聽的道理，一點也不奇怪。"},{"w":"金玉良言","by":"管輅","line":"金玉良言是非常寶貴的勸告——我說的其實正是這種話！可惜鄧颺把它當成聽膩的老話。"},{"w":"陳腔濫調","by":"鄧颺","line":"陳腔濫調也是陳舊空洞的話，意思很接近！不過我說的是「老書生」常說的話，有一個專門的成語。"}],"hint":"鄧颺說，這是哪一種人「常」說的話？","after":"管輅回答：「老書生看見的，是活不長的人；常說這些話的人，看見的是說不出話的人。」這是在嚴厲地警告他們。","lesson":{"title":"高平陵之變","text":"管輅回家後對舅舅說，這兩個人一定會失敗。沒過多久，西元 249 年初，司馬懿發動政變打倒曹爽，何晏、鄧颺也被處死。從此魏國大權落到司馬家手上。","next":"政治這麼危險，很多讀書人乾脆躲進山林，喝酒讀書。阮籍就是其中一位……"}},{"id":"e60_01","yr":"曹魏後期","place":"竹林","scene":"south","music":"map","cast":[["阮籍",-0.6,0.4],["路人",2.6,0.4],["路人",3.2,1.4],["阮文業",7,0.8]],"beats":[{"t":"阮籍是魏國有名的才子，長得高大英俊，個性自由自在，喜怒卻不太表現在臉上。"},{"t":"他有時關起門來讀書，好幾個月都不出門；有時去爬山看水，一整天都忘了回家。","mv":[["阮籍",0.6,-0.4]]},{"t":"他最愛讀《莊子》和《老子》，也愛喝酒、彈琴，還會放聲長嘯。","fx":[["focus","阮籍"]]},{"who":"阮籍","t":"啊——好痛快！","fx":[["cheer","阮籍"]]},{"who":"路人","t":"你看他，高興成那個樣子，連自己是什麼模樣都不管了，是不是傻了？","fx":[["upset","路人"],["focus",null]]},{"t":"只有阮籍的族兄阮文業最佩服他。","mv":[["阮文業",1.8,1.0]]},{"who":"阮文業","t":"他才不傻！他比我強多了！","fx":[["say","阮文業"]]}],"q":"《晉書》說阮籍在他高興滿意的時候，就忘了自己的形體樣貌。後來形容高興過頭、舉止失態，叫做什麼？","wrong":[{"w":"垂頭喪氣","by":"路人","line":"垂頭喪氣是失望沮喪。他明明開心得不得了！"},{"w":"閉門思過","by":"阮籍","line":"閉門思過是關起門反省錯誤。我關起門，是在讀書啦！"},{"w":"樂不可支","by":"阮文業","line":"樂不可支是快樂得受不了，意思很接近！不過原文說他高興到「忘了形體」，有一個專門的成語。"}],"hint":"「形」是外表、樣子。","after":"這個成語原本是說阮籍高興到忘了自己；現在多用來批評人得意過頭、不守分寸。","lesson":{"title":"竹林七賢","text":"阮籍和嵇康、山濤等七個人，常在竹林裡喝酒、彈琴、談天，被稱為「竹林七賢」。司馬家掌權後，他們用這種自由自在的生活，表達對政治的不滿。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第三十章．三國鼎立","eps":[21,32,45,60]},{"key":"h27","line":"history","name":"西晉風雲","short":"西晉","era":"西元 275–313 年","color":"#9A6B3E","map":{"ground":"#b0c47c","river":"#4f9fd8"},"intro":{"lines":["西元 265 年，司馬懿的孫子司馬炎讓魏國皇帝讓位給他，建立晉朝，歷史上叫「西晉」。","西元 280 年，晉朝滅了吳國，結束將近一百年的分裂，三國時代正式結束。","可是西晉的貴族愛炫富、愛清談，皇族又互相爭權，引發了「八王之亂」。","後來北方的外族趁機起兵，洛陽淪陷，晉朝的大臣紛紛逃到江南。"],"people":[["司馬炎","晉武帝，建立西晉"],["杜預","滅吳的大將，也是學問家"],["陶侃","出身貧寒，努力成為名將"],["祖逖","立志收復北方的將軍"]]},"stops":[{"id":"e60_02","yr":"西晉初年","place":"洛陽．洛水浮橋","scene":"river","music":"palace","cast":[["夏統",-0.6,0.2],["賈充",7,0.6],["儀仗兵",-7.2,-0.6],["儀仗兵",-7.6,0.8],["舞女",7.4,-0.8],["舞女",8,1.4]],"beats":[{"t":"夏統是會稽人，很孝順。母親生了重病，他特地到洛陽買藥，正坐在船上曬藥材。","fx":[["focus","夏統"]]},{"t":"那天是三月上巳節，洛陽的王公貴族都到洛水浮橋邊遊玩，車子多得像天上的雲。夏統卻看也不看。","fx":[["focus",null]]},{"who":"賈充","t":"這麼熱鬧，你怎麼看都不看一眼？你是誰？","mv":[["賈充",1.8,0.4]]},{"who":"夏統","t":"我是會稽的夏仲御。"},{"t":"太尉賈充想勸他出來做官，叫來威風的軍隊儀仗，又叫穿華麗衣服、戴金飾的舞女，繞著船轉了三圈。","mv":[["儀仗兵",-1.6,-1.2],["儀仗兵#2",-2.0,0.4],["舞女",0.8,-1.2],["舞女#2",0.6,1.2]],"fx":[["cheerAll","舞女"]]},{"t":"夏統還是端端正正地坐著，好像什麼都沒聽見。","fx":[["focus","夏統"]]},{"who":"賈充","t":"這個吳地來的人，不管怎樣都打動不了他！","fx":[["upset","賈充"]]}],"q":"賈充嘆氣說：「這個吳地來的人，身體像木頭、心像石頭啊！」原本形容意志堅定、不受誘惑，叫做什麼？","wrong":[{"w":"見異思遷","by":"舞女","line":"見異思遷是看到新奇的就改變心意。他連看都不看我們一眼！"},{"w":"眉開眼笑","by":"賈充","line":"眉開眼笑是高興得笑開懷。他坐得直挺挺，一點表情都沒有！"},{"w":"心如鐵石","by":"夏統","line":"心如鐵石也是心腸硬、不動搖，意思很接近！不過太尉形容我用的是「木頭」和「石頭」，有一個專門的成語。"}],"hint":"賈充說他的身體像什麼？心又像什麼？","after":"注意：這個成語原本是稱讚夏統意志堅定、不受誘惑；現在大多用來形容人冷漠無情。","lesson":{"title":"西晉的隱士","text":"賈充是西晉的開國功臣，權勢很大，很多人搶著巴結他。夏統卻一點也不想做官。《晉書》把他寫在〈隱逸列傳〉，也就是隱士們的傳記裡。","next":"西晉建立後，晉武帝一直想消滅最後的對手——江南的吳國……"}},{"id":"e33_01","yr":"西元 280 年","place":"江陵．晉軍大營","scene":"tent","music":"battle","table":true,"cast":[["杜預",0.6,-0.6],["晉將",-1.2,0.6],["晉將",2.2,0.8]],"beats":[{"t":"西元 280 年，晉朝派好幾路大軍攻打吳國。大將杜預打下了長江邊的重要城市江陵。"},{"t":"其他晉軍也打了好幾場勝仗。將領們聚在一起，討論下一步怎麼打。","fx":[["cheerAll","晉將"]]},{"who":"晉將","t":"吳國已經存在將近一百年，不可能一下子打完。夏天快到了，雨多又容易生病，不如等冬天再打！"},{"t":"杜預搖搖頭，拿起一根竹子給大家看。","fx":[["focus","杜預"]]},{"who":"杜預","t":"從前樂毅只打贏一仗，就幾乎吞併了強大的齊國。現在我們士氣正旺，就像劈竹子——","fx":[["say","杜預"]]},{"who":"杜預","t":"只要劈開前面幾節，後面的竹節碰到刀口就自己裂開，根本不用再費力了！"}],"q":"杜預說，竹子劈開幾節以後，後面碰到刀口就裂開了。後來比喻事情很容易就解決，叫做什麼？","wrong":[{"w":"半途而廢","by":"晉將","line":"半途而廢是做到一半就放棄。將軍是要我們一口氣打下去！"},{"w":"刀光劍影","by":"晉將#2","line":"刀光劍影是打得很激烈的樣子。將軍說的是竹子碰到刀就裂開，輕輕鬆鬆！"},{"w":"勢如破竹","by":"杜預","line":"勢如破竹也出自我這段話，形容氣勢強大、一路勝利。不過要說「事情很容易解決」，是另一個成語！"}],"hint":"竹子碰到「刀刃」就裂開，「解」是分開。","after":"杜預指揮各路將領，直接攻向吳國首都建業。一路上的城池紛紛投降，原本反對的人都寫信向他道歉。","lesson":{"title":"晉滅吳","text":"西元 280 年，晉將王濬率領水軍直下建業，吳國最後一位皇帝孫皓投降。從東漢末年開始將近一百年的分裂，終於結束了。","next":"天下統一了，洛陽的貴族過起太平日子，也越來越講究外表和風度……"}},{"id":"e60_03","yr":"約西元 290 年","place":"洛陽．王濟家","scene":"house","music":"palace","cast":[["王濟",0.6,-0.4],["小衛玠",7,0.8],["客人",2.6,0.6],["客人",-1.0,-0.6]],"beats":[{"t":"西晉時，人們很講究外表和風度。驃騎將軍王濟長得英俊又爽朗，大家都稱讚他。","fx":[["cheerAll","客人"]]},{"who":"客人","t":"王將軍真是一表人才！"},{"t":"王濟有個外甥叫衛玠，年紀很小，卻長得非常俊美。這天，小衛玠來到舅舅家。","mv":[["小衛玠",1.6,0.6]]},{"who":"客人#2","t":"哇！這孩子像白玉雕出來的一樣，閃閃發亮！","fx":[["cheer","客人#2"]]},{"t":"王濟看看外甥，又看看自己，忍不住嘆了一口氣。","fx":[["focus","王濟"],["sad","王濟"]]},{"who":"王濟","t":"珍珠美玉就在旁邊，讓我覺得自己好難看啊！"}],"q":"王濟和外甥衛玠一比，覺得自己的樣子比不上，心裡很慚愧。和別人比較後，覺得自己不如人而慚愧，叫做什麼？","wrong":[{"w":"目中無人","by":"客人","line":"目中無人是驕傲得看不起別人。王將軍剛好相反，他覺得自己比不上外甥！"},{"w":"自吹自擂","by":"小衛玠","line":"自吹自擂是自己誇自己。舅舅是在稱讚我呀！"},{"w":"相形見絀","by":"王濟","line":"相形見絀是互相比較後顯得比不上，意思很接近！不過我是「自己覺得」慚愧，有一個更貼切的成語。"}],"hint":"「慚」是慚愧，「穢」是醜陋、不好看。","after":"衛玠小時候坐著羊車到街上，看到的人都以為是玉做的小人，整個洛陽城的人都跑來看他。","lesson":{"title":"魏晉風度","text":"魏晉時代的人很重視容貌和談吐。《世說新語》專門有一篇〈容止〉，記錄美男子和有風度的人。衛玠長大後，也成了有名的清談家。","next":"可是西晉的皇室並不太平。晉惠帝的太子司馬遹，越來越不守規矩……"}},{"id":"e46_08","yr":"約西元 295 年","place":"洛陽．東宮","scene":"office","music":"palace","cast":[["太子",0.8,-0.6],["杜錫",-6.6,0.8],["侍從",2.6,0.6]],"beats":[{"t":"晉惠帝的太子司馬遹，小時候很聰明，長大後卻越來越貪玩，不愛讀書。","fx":[["cheer","太子"]]},{"t":"大將杜預的兒子杜錫在東宮當官，個性正直，常常勸太子改過。","mv":[["杜錫",-0.8,0.6]]},{"who":"杜錫","t":"殿下，請多讀書、少玩樂，多親近正直的人啊！","fx":[["say","杜錫"]]},{"who":"太子","t":"又來了，真囉嗦……","fx":[["upset","太子"]]},{"t":"太子偷偷叫人在杜錫常坐的毛氈裡，藏了幾根針。","mv":[["侍從",-1.4,-0.4]],"fx":[["focus","侍從"]]},{"t":"杜錫一坐下去，就被針刺得流血了！","mv":[["侍從",2.6,0.6]],"fx":[["focus","杜錫"],["upset","杜錫"]]},{"who":"杜錫","t":"哎喲！這毛氈裡怎麼會有針？","fx":[["sad","杜錫"]]}],"q":"坐在藏著針的毛氈上，痛得根本坐不住。後來形容心裡不安、坐立難安，叫做什麼？","wrong":[{"w":"穩如泰山","by":"侍從","line":"穩如泰山是非常穩固。杜大人被針扎得根本坐不穩！"},{"w":"如釋重負","by":"太子","line":"如釋重負是放下重擔、鬆了一口氣。他可是痛得跳起來呢！"},{"w":"坐立不安","by":"杜錫","line":"坐立不安也是坐著站著都不安心，意思很接近！不過我被藏在毛氈裡的針刺到，有一個專門的成語。"}],"hint":"杜錫坐的是什麼？裡面又藏了什麼？","after":"過幾天太子故意問他那天怎麼了，杜錫只說：「我喝醉了，不記得。」","lesson":{"title":"八王之亂","text":"後來太子被皇后賈南風陷害，被廢掉後也遇害了。皇族的王爺們趁機起兵爭權，你打我、我打你，亂了十幾年，歷史上叫「八王之亂」，西晉從此越來越衰弱。","next":"那時候洛陽的貴族不管國家大事，最流行的是「清談」：比賽誰講道理講得最好……"}},{"id":"e12_02","yr":"約西元 300 年","place":"洛陽．清談聚會","scene":"study","music":"night","cast":[["郭象",7,0.4],["王衍",2.4,-0.4],["名士",-0.8,0.6],["名士",1.2,1.3]],"beats":[{"t":"西晉的貴族和讀書人，最喜歡聚在一起「清談」，討論《老子》《莊子》裡的大道理。","fx":[["cheerAll","名士"]]},{"t":"太尉王衍是清談界的領袖，手上總拿著一把玉柄的拂塵。","fx":[["focus","王衍"]]},{"t":"這天，學問很好的郭象來了，開始發表意見。","mv":[["郭象",0.4,-0.4]],"fx":[["focus",null]]},{"who":"郭象","t":"莊子說，萬物都是自己生成、自己變化的。所以……還有……再說……","fx":[["say","郭象"]]},{"t":"郭象一開口就停不下來，一句接一句，從來不會卡住。","fx":[["focus","郭象"]]},{"who":"名士","t":"說得真好！一點也不卡！","fx":[["cheerAll","名士"]]},{"who":"王衍","t":"聽郭象說話，就像瀑布從高處倒水下來，嘩啦啦流個不停，永遠不會乾！","fx":[["cheer","王衍"]]}],"q":"王衍稱讚郭象說話像瀑布倒水一樣，滔滔不絕。形容口才很好、說話流暢，叫做什麼？","wrong":[{"w":"啞口無言","by":"名士","line":"啞口無言是說不出話。郭先生是說到停不下來！"},{"w":"河東獅吼","by":"郭象","line":"河東獅吼是太太發脾氣大吼。我說話可是溫文儒雅的！"},{"w":"滔滔不絕","by":"王衍","line":"滔滔不絕也是話很多、說不完，意思很接近！不過我說的是「瀑布倒水」，有一個專門的成語。"}],"hint":"「懸河」就是從高處直直流下的瀑布。","after":"郭象真的很有學問，他替《莊子》寫的注解，一直流傳到今天。","lesson":{"title":"清談誤國","text":"清談讓思想很活潑，可是很多大官只顧著聊天，不認真處理國事。後來王衍被敵人抓住，才後悔說：我們如果不只崇尚空談，努力為國家做事，也不會落到今天這個地步。","next":"同一個時代，有一個窮人家出身的年輕人，靠著努力一步步往上爬，他叫陶侃……"}},{"id":"e33_04","yr":"西晉時","place":"陶侃家","scene":"house","music":"palace","cast":[["陶侃",0.2,-0.2],["師圭",7,0.8]],"beats":[{"t":"陶侃家裡很窮，從小靠母親辛苦把他養大。他認真做事，一步步當上了官。"},{"t":"有一天，一位會看相的人叫師圭，來看陶侃的手。","mv":[["師圭",1.6,0.4]]},{"who":"師圭","t":"您左手中指上有一條直直的紋路，將來會當上公侯！如果紋路長到指尖，那就更了不起了！","fx":[["focus","師圭"],["say","師圭"]]},{"t":"陶侃半信半疑，拿起一根針，在手指上輕輕一刺。","fx":[["focus","陶侃"]]},{"t":"冒出的一點血彈到牆上，竟然像一個「公」字！用紙按住手指，那個字反而更清楚了。","fx":[["upset","陶侃"]]},{"who":"陶侃","t":"咦？真的像個「公」字！","fx":[["cheer","陶侃"]]}],"q":"陶侃用針一刺，就看見了血。這件事後來變成成語，比喻說話簡短透澈、一下子就說中要點，是哪個成語？","wrong":[{"w":"見錢眼開","by":"師圭","line":"見錢眼開是看到錢就高興。我們說的是用針刺手指啊！"},{"w":"大海撈針","by":"陶侃","line":"大海撈針是很難找到東西。針就在我手上，一刺就看見結果了！"},{"w":"開門見山","by":"師圭","line":"開門見山是說話直接、不拐彎，意思有點接近！不過陶侃是用針刺手指，有一個專門的成語。"}],"hint":"陶侃用什麼刺手指？刺了以後看見什麼？","after":"後來陶侃真的成為管理八個州的大將，還被封為長沙郡公。","lesson":{"title":"陶侃搬磚","text":"陶侃不只靠運氣。他在廣州當刺史時沒什麼事做，就每天早上把一百塊磚搬到屋外，晚上再搬回屋內。他說：我要替國家收復中原，太安逸了怕會沒力氣。","next":"西晉末年，北方的外族攻進洛陽，晉朝的大臣紛紛逃到江南。有一位將軍，卻決心要打回北方……"}},{"id":"e33_02","yr":"西元 313 年","place":"長江","scene":"river","music":"final","cast":[["琅邪王",1.6,-0.6],["祖逖",-6.6,0.8],["鄉兵",-7.2,-0.4],["鄉兵",-7.6,1.4],["鄉兵",-8.2,0.4]],"beats":[{"t":"西晉末年天下大亂，北方被外族占領，洛陽也淪陷了。琅邪王司馬睿在江南建立據點。"},{"t":"將軍祖逖年輕時，就和好朋友半夜聽到雞叫，起床練劍。他一直想收復北方。","mv":[["祖逖",-0.6,0.4]]},{"who":"祖逖","t":"大王如果派將軍北伐，北方的英雄一定會響應。國家的恥辱，就能洗刷了！","fx":[["say","祖逖"]]},{"t":"司馬睿正忙著安定江南，只給祖逖一千人的糧食和三千匹布，沒有盔甲兵器，要他自己招兵。","mv":[["琅邪王",7.6,-0.6]],"fx":[["upset","祖逖"]]},{"t":"祖逖帶著跟隨他的一百多戶人家，坐船渡過長江。","mv":[["鄉兵",-1.6,-0.6],["鄉兵#2",-1.4,1.3],["鄉兵#3",0.6,1.0]]},{"t":"船到了江中央，祖逖拿起船槳，用力敲著船身。","fx":[["focus","祖逖"]]},{"who":"祖逖","t":"我祖逖如果不能平定中原，絕不再渡江回來！滔滔大江為我作證！","fx":[["upset","祖逖"],["cheerAll","鄉兵"]]}],"q":"祖逖在長江中央敲著船槳發誓，一定要收復國土。比喻收復失土、振興國家的壯志，叫做什麼？","wrong":[{"w":"隨波逐流","by":"鄉兵","line":"隨波逐流是跟著水流漂，沒有主見。將軍可是立下大志要打回北方！"},{"w":"過河拆橋","by":"鄉兵#2","line":"過河拆橋是用完別人就丟掉。將軍是要渡江北伐，可不是拆橋！"},{"w":"破釜沉舟","by":"祖逖","line":"破釜沉舟是不留退路、拚死一戰，意思有點接近！不過我是在江中央敲船槳發誓，有一個專門的成語。"}],"hint":"「楫」是船槳。祖逖是在江的哪裡發誓？","after":"大家聽了都很感動。祖逖渡江後一邊打造兵器、一邊招兵，後來收復了黃河以南的大片土地。","lesson":{"title":"聞雞起舞","text":"祖逖年輕時和好友劉琨半夜聽到雞叫就起床練劍，這就是「聞雞起舞」。他北伐時很照顧百姓，大家都很愛戴他。可惜朝廷不信任他，祖逖憂憤生病，西元 321 年過世，北伐也沒能完成。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第三十一章．西晉風雲","eps":[12,33,46,60]},{"key":"h28","line":"history","name":"南渡風雲","short":"兩晉之際","era":"西元 313–350 年","color":"#4F7FA8","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["西晉統一天下沒多久，皇族為了爭權，發生「八王之亂」，國家越打越弱。","北方的匈奴、羯等民族趁機起兵，西元 311 年攻破首都洛陽，北方陷入大亂。","許多人逃到長江以南。西元 317 年，司馬睿在建康（今天的南京）建立「東晉」。","東晉靠著王導、王敦這些王家的人撐起來，當時的人說「王與馬，共天下」。","北方還有晉朝將領在苦撐，也有胡人建立了新國家。一起去看看這個動盪的時代！"],"people":[["劉琨","守在北方的晉朝將領，祖逖的好朋友"],["王羲之","東晉書法家，後人稱「書聖」"],["王敦","王導的堂兄，手握大軍的大將軍"],["石勒","羯族人，奴隸出身，建立後趙"]]},"stops":[{"id":"e33_03","yr":"約西元 313 年","place":"晉陽城","scene":"night","music":"night","cast":[["劉琨",-1.2,0.4],["晉兵",1.8,-0.6],["晉兵",2.8,0.4],["信使",6.8,1.2]],"beats":[{"t":"西晉末年天下大亂。劉琨和祖逖年輕時是好朋友，常常一起討論怎麼救國家。"},{"t":"後來劉琨守在北方的晉陽城，四周都是敵人，城裡的人又餓又累。","fx":[["sadAll","晉兵"]]},{"who":"劉琨","t":"大家打起精神！敵人隨時會來，一刻也不能鬆懈！","fx":[["say","劉琨"]]},{"t":"這時，信使帶來消息：祖逖帶著一百多家人渡過長江，要北伐收復中原！","mv":[["信使",1.0,1.0]]},{"who":"信使","t":"祖將軍在江上發誓：不收復中原，絕不再過江回來！"},{"who":"劉琨","t":"好個祖逖！我得更加努力，可別讓他搶先立功了！","fx":[["focus","劉琨"],["cheer","劉琨"]]},{"t":"那天晚上，劉琨把兵器當枕頭躺下，眼睛望著東方，只等天一亮就出發作戰。","fx":[["focus",null]]}],"q":"劉琨把兵器當枕頭、等天亮就要作戰，一心殺敵報國。後人用哪個成語，形容這種隨時準備作戰的決心？","wrong":[{"w":"高枕無憂","by":"劉琨","line":"高枕無憂是墊高枕頭、安心睡大覺。我枕的可是兵器，哪敢安心睡！"},{"w":"臨陣脫逃","by":"晉兵","line":"臨陣脫逃是要打仗時偷偷溜走。我們將軍天天等著上戰場呢！"},{"w":"厲兵秣馬","by":"信使","line":"厲兵秣馬是磨好兵器、餵飽戰馬準備打仗，意思很接近！不過將軍連睡覺都枕著兵器等天亮，有一個專門的成語。"}],"hint":"「戈」是古代的兵器，「旦」是天亮。","after":"劉琨在信裡還說：「常恐祖生先吾著鞭。」意思是常常怕祖逖比我先揮鞭上馬。後來「先鞭」就用來比喻搶先一步。","lesson":{"title":"劉琨與祖逖","text":"劉琨和祖逖年輕時一起當官，半夜聽到雞叫就起床練劍，這就是「聞雞起舞」。祖逖北伐收復了不少土地；劉琨卻在北方苦戰多年，最後還是沒能守住晉陽。","next":"這時候在江南，東晉剛剛建立。王家是最有勢力的大家族，有一天，太尉郗鑒派人來王家挑女婿……"}},{"id":"e20_07","yr":"東晉初年","place":"建康王家","scene":"house","music":"map","cast":[["門生",6.8,1.2],["王家公子",-1.6,-0.4],["王家公子",0,-0.6],["王家公子",1.6,-0.4],["王羲之",3.6,0.2],["郗鑒",-6.8,0.6,0,null,1]],"beats":[{"t":"太尉郗鑒有個女兒，想替她找個好丈夫。聽說王家的年輕人都很優秀，就派門生去王家挑。","mv":[["門生",1.0,1.2]]},{"t":"王家的公子們聽說了，一個個打扮得整整齊齊，坐得端端正正，等著客人來看。","fx":[["cheerAll","王家公子"]]},{"who":"門生","t":"每一位都好有禮貌……咦？東邊床上那位是誰？","fx":[["focus","王羲之"]]},{"t":"只有一個年輕人敞開衣服、露著肚子，躺在東邊的床上吃胡餅，好像什麼事都沒發生。"},{"who":"王羲之","t":"嗯，這胡餅真好吃！","fx":[["cheer","王羲之"]]},{"t":"門生回去，把看到的情形一五一十告訴郗鑒。","mv":[["門生",-5.2,0.8],["郗鑒",-4.0,-0.2]],"fx":[["focus",null]]},{"who":"郗鑒","t":"大家都那麼拘謹，只有他輕鬆自在、神色不變……","fx":[["focus","郗鑒"],["say","郗鑒"]]}],"q":"郗鑒說：「這個人才是我的好女婿！」一問，正是王羲之。後來人們用他露著肚子躺在東床的故事，稱呼別人的女婿。這個成語是？","wrong":[{"w":"東窗事發","by":"王羲之","line":"東窗事發是做的壞事被人發現。我只是在東邊床上吃餅，又沒做壞事！"},{"w":"正襟危坐","by":"王家公子","line":"正襟危坐是整理好衣服、端端正正坐好——那是我們啦！被選上的可是露肚子的那一位。"},{"w":"乘龍快婿","by":"郗鑒","line":"乘龍快婿也是稱讚好女婿，意思很接近！不過露著肚子躺在東邊床上的故事，有一個專門的成語。"}],"hint":"他露出了哪裡？躺在哪一邊的床上？","after":"郗鑒就把女兒郗璿嫁給了王羲之。後來人們就用「東床」來稱呼女婿。","lesson":{"title":"書聖王羲之","text":"王羲之字逸少，是王導、王敦的堂姪。他的字寫得飄逸又有力，被後人尊稱為「書聖」，最有名的作品是〈蘭亭集序〉。","next":"這時東晉朝廷裡卻不平靜：王羲之的堂伯、大將軍王敦，帶兵往京城打過來了……"}},{"id":"e60_04","yr":"西元 322 年","place":"建康朝廷","scene":"office","music":"palace","cast":[["晉元帝",0,-2.3],["周顗",-1.4,0.6],["溫嶠",6.8,1.2],["大臣",2.6,0.8]],"beats":[{"t":"東晉建立沒幾年，大將軍王敦仗著兵多，說要「清除皇帝身邊的壞人」，帶兵往京城打過來。"},{"who":"晉元帝","t":"王敦竟敢帶兵來逼朕！誰能替朕擋住他？","fx":[["upset","晉元帝"]]},{"t":"年輕的大臣溫嶠走過來，小聲問老臣周顗。","mv":[["溫嶠",0.9,0.8]]},{"who":"溫嶠","t":"大將軍這樣做，應該有他的理由吧？應該不會亂來才對？"},{"who":"周顗","t":"皇上又不是堯、舜那樣的聖人，哪能沒有過錯？可是做臣子的，怎麼可以帶兵威脅君主！","fx":[["focus","周顗"],["upset","周顗"]]},{"t":"溫嶠一時說不出話來。周顗搖搖頭，覺得這個年輕人把事情想得太簡單了。","fx":[["sad","溫嶠"]]}],"q":"周顗對溫嶠說：「你年紀輕，還沒經歷過什麼事。」形容年紀輕、經歷少、缺乏經驗，叫做什麼？","wrong":[{"w":"老成持重","by":"溫嶠","line":"老成持重是做事老練又穩重。周大人正是嫌我還不夠老練啊！"},{"w":"德高望重","by":"大臣","line":"德高望重是品德好、名望高，是在稱讚人。周大人可沒有在誇溫嶠！"},{"w":"乳臭未乾","by":"周顗","line":"乳臭未乾也是說人年紀小，可是帶著瞧不起人的意思。我是說他經歷的事太少，有一個更貼切的成語。"}],"hint":"「更」在這裡念ㄍㄥ，是經歷的意思。","after":"不久朝廷的軍隊被打敗。周顗去見王敦，王敦說：「伯仁，你對不起我！」周顗說：「是您起兵犯上，我帶兵卻打不贏您，這才是對不起您。」王敦答不出話。","lesson":{"title":"王敦之亂","text":"王敦是王導的堂兄，手握長江中游的大軍。西元 322 年他起兵攻進建康，朝廷擋不住，只好讓他掌握大權。周顗說話正直，讓王敦又怕又恨。","next":"王敦記恨周顗，沒多久就下令殺了他。周顗的好朋友王彬聽到消息……"}},{"id":"e60_05","yr":"西元 322 年","place":"石頭城","scene":"tent","music":"night","cast":[["王敦",1.4,-0.6],["王導",2.8,0.6],["王彬",-6.8,1.2],["叛軍",3.8,-1.8],["叛軍",-1.6,-1.8]],"beats":[{"t":"王敦占領了建康旁邊的石頭城。皇帝派王彬去慰勞他。王彬是王敦的堂弟，也是周顗的好朋友。"},{"t":"這時傳來消息：周顗被王敦殺了。王彬先跑去哭祭好友，哭得非常傷心。"},{"t":"哭完之後，王彬才來到王敦的營帳。","mv":[["王彬",-0.6,0.6]],"fx":[["sad","王彬"]]},{"who":"王敦","t":"你的臉色怎麼這麼難看？"},{"who":"王彬","t":"我剛剛去哭伯仁，心裡還是好難過。"},{"who":"王敦","t":"伯仁是他自己惹來的禍，有什麼好哭的！","fx":[["upset","王敦"]]},{"t":"王彬再也忍不住，一邊流淚，一邊大聲指責堂兄。","fx":[["focus","王彬"],["upset","王彬"]]}],"q":"王彬說：「兄長起兵犯上，殺害忠良，會給家族帶來大禍！」他說得慷慨激動，說話的聲音和眼淚一起落下。這叫做什麼？","wrong":[{"w":"破涕為笑","by":"王導","line":"破涕為笑是哭著哭著笑出來。王彬哭得這麼傷心，哪裡笑得出來！"},{"w":"喜極而泣","by":"叛軍","line":"喜極而泣是高興到哭出來。王彬可是又難過又生氣！"},{"w":"痛哭流涕","by":"王彬","line":"痛哭流涕是哭得很傷心，意思很接近！不過我是一邊說話、一邊流淚，有一個更貼切的成語。"}],"hint":"說話的「聲音」和「眼淚」，一起出現了。","after":"王敦氣得大叫：「你這樣頂撞我，以為我不敢殺你嗎？」王導在旁邊嚇壞了，勸王彬趕快道歉，王彬卻不肯低頭。","lesson":{"title":"我不殺伯仁","text":"後來王導翻看朝廷的奏章，才發現周顗曾經好幾次替自己說好話，難過地說：「我雖然沒有殺伯仁，伯仁卻因我而死。」兩年後王敦再次起兵，病死在軍中，叛亂才平定。","next":"東晉在南方穩住了，北方卻換了主人。奴隸出身的羯族人石勒，建立了後趙……"}},{"id":"e33_05","yr":"約西元 332 年","place":"後趙都城襄國","scene":"palace","music":"palace","cast":[["石勒",1.4,0.4],["徐光",-0.8,0.8],["大臣",2.8,1.6],["外國使者",-6.8,1.2]],"beats":[{"t":"石勒是羯族人，年輕時曾被賣做奴隸，後來靠打仗起家，建立了後趙，當上皇帝。"},{"t":"他不識字，卻很喜歡聽人讀史書。這天，他設宴招待高句麗等國的使者。","mv":[["外國使者",0.2,1.8]],"fx":[["cheer","石勒"]]},{"who":"石勒","t":"徐光，你說說，朕能比得上古代哪一位開國的君主？"},{"who":"徐光","t":"陛下比漢高祖還神勇，比魏武帝曹操還厲害！","fx":[["cheer","徐光"]]},{"who":"石勒","t":"哈哈，人哪有不了解自己的？你說得太誇張了！","fx":[["say","石勒"]]},{"who":"石勒","t":"朕如果遇到漢高祖，會甘心當他的臣子，和韓信、彭越搶著立功。"},{"t":"石勒接著說：「如果遇到東漢光武帝，就和他一起在中原比個高下……」","fx":[["focus","石勒"]]}],"q":"古人把爭奪天下，比喻成追逐一頭鹿。石勒說：和光武帝一起追，還不知道最後誰能抓到那頭鹿呢！這句話變成哪個成語？","wrong":[{"w":"指鹿為馬","by":"徐光","line":"指鹿為馬是秦朝趙高故意顛倒是非。陛下說的是比一比誰能得到天下！"},{"w":"一敗塗地","by":"外國使者","line":"一敗塗地是輸得一塌糊塗。皇上說的是勝負還不知道呢！"},{"w":"旗鼓相當","by":"石勒","line":"旗鼓相當是雙方實力差不多，意思有點接近！不過朕說的是「最後誰會贏還不知道」，有一個更貼切的成語。"}],"hint":"「鹿」代表天下；要問的是：最後會落在誰的手裡？","after":"石勒又說：「大丈夫做事，要像太陽、月亮一樣光明磊落，絕不學曹操、司馬懿欺負孤兒寡母來奪取天下。」大臣們都跪下高呼萬歲。","lesson":{"title":"五胡十六國","text":"西晉滅亡後，北方的匈奴、羯、鮮卑、氐、羌等民族先後建立了許多國家，史書叫做「五胡十六國」。石勒的後趙曾經統一大半個北方，但他死後，國家很快就亂了。","next":"這時候，東晉的名士最流行「清談」——聚在一起討論深奧的道理。名士殷浩，就是其中的高手……"}},{"id":"e46_02","yr":"約西元 345 年","place":"殷浩家","scene":"house","music":"map","cast":[["殷浩",1.6,-0.2],["韓康伯",-0.6,0.6],["客人",6.8,1.2]],"beats":[{"t":"殷浩是東晉最會講道理的名士之一，大家都愛聽他清談。他的外甥韓康伯，從小跟在舅舅身邊。"},{"t":"這天家裡來了客人。韓康伯搶著發表意見，說得頭頭是道。","mv":[["客人",2.8,1.2]]},{"who":"韓康伯","t":"依我看呀，這個道理應該這樣說……","fx":[["say","韓康伯"]]},{"who":"客人","t":"說得真好！康伯小小年紀，見解跟舅舅一樣高明！","fx":[["cheer","客人"]]},{"t":"殷浩聽了忍不住笑。因為康伯說的那些話，幾乎都是平常從他這裡聽來的。","fx":[["focus","殷浩"]]},{"who":"殷浩","t":"哈哈，康伯呀，還沒得到我牙齒後面的智慧呢！","fx":[["say","殷浩"]]}],"q":"殷浩笑外甥只會重複舅舅說過的話，自己沒有新想法。這種撿別人說過的話來說，叫做什麼？","wrong":[{"w":"伶牙俐齒","by":"客人","line":"伶牙俐齒是口才很好、很會說話。康伯是很會說，可是說的都是舅舅的話呀！"},{"w":"咬牙切齒","by":"韓康伯","line":"咬牙切齒是氣得把牙齒咬緊。舅舅說的是牙齒後面的智慧，又沒有在生氣！"},{"w":"鸚鵡學舌","by":"殷浩","line":"鸚鵡學舌是像鸚鵡一樣學人說話，意思很接近！不過「撿我牙齒後面的智慧」，有一個專門的成語。"}],"hint":"「慧」是智慧——是從誰的嘴巴裡撿來的？","after":"韓康伯後來認真讀書，自己也成為有學問的人，還替《周易》的〈繫辭〉做了注解。","lesson":{"title":"清談","text":"魏晉的名士喜歡聚在一起，討論《老子》《莊子》《周易》裡深奧的道理，叫做「清談」。說得好的人名氣很大，殷浩就是當時有名的清談高手，後來還被朝廷請去做大官。","next":"名士們說話機智，連小孩子也不例外。王羲之的小兒子王獻之，才幾歲大……"}},{"id":"e20_06","yr":"約西元 350 年","place":"王家庭院","scene":"house","music":"map","cast":[["小獻之",-6.8,1.2],["門生",-0.6,-0.4],["門生",1.0,-0.6],["門生",2.4,-0.2]],"beats":[{"t":"王獻之是王羲之的小兒子。他才幾歲大時，看見家裡的門生們在玩一種叫「樗蒲」的擲骰遊戲。","fx":[["cheerAll","門生"]]},{"t":"小獻之走過去，站在旁邊看了好一會兒。","mv":[["小獻之",-0.4,0.9]]},{"who":"門生","t":"擲出好點數！這一局贏定了！","fx":[["cheer","門生"]]},{"who":"小獻之","t":"南邊那一方氣勢不夠強，快要輸了。","fx":[["say","小獻之"]]},{"who":"門生#2","t":"小孩子懂什麼！他呀，只是從竹管裡看豹子，偶爾看到一塊斑紋罷了！","fx":[["cheerAll","門生"]]},{"t":"門生們哈哈大笑，小獻之氣得瞪大了眼睛。","fx":[["focus","小獻之"],["upset","小獻之"]]}],"q":"門生笑王獻之：就像從竹管的小孔看豹子，只看到豹身上的一塊斑紋。比喻只看到一小部分、看不到全貌，叫做什麼？","wrong":[{"w":"狐假虎威","by":"門生#2","line":"狐假虎威是狐狸借老虎的威風嚇人。我們說的是豹子，而且是從竹管裡看！"},{"w":"畫蛇添足","by":"門生#3","line":"畫蛇添足是多做了沒必要的事。我們是笑他看得太少啦！"},{"w":"坐井觀天","by":"小獻之","line":"坐井觀天也是說人見識小，意思很接近！不過他們笑我從竹管看豹子，有一個專門的成語。"}],"hint":"看的是哪一種動物？用什麼東西看？","after":"王獻之生氣地說：「我真比不上荀粲和劉惔！」這兩人都是不隨便跟俗人來往的名士，意思是後悔跟他們說話。說完，他甩甩袖子就走了。","winMv":[["小獻之",7.5,1.2]],"lesson":{"title":"二王","text":"王獻之長大後也成為大書法家，和父親王羲之並稱「二王」。今天也常說「管中窺豹，可見一斑」，意思變成從一小部分，也能推想出全貌。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第三十二章．南渡風雲","eps":[20,33,46,60]},{"key":"h29","line":"history","name":"名士風流","short":"東晉名士","era":"西元 350–365 年","color":"#3E8C8C","map":{"ground":"#9cc48a","river":"#4f9fd8"},"intro":{"lines":["東晉在江南安定下來，北方則由不同的胡族國家輪流統治，南北對峙。","江南的名士喜歡清談、寫字、遊山玩水，留下許多風雅有趣的小故事，大多記在《世說新語》裡。","大將軍桓溫手握兵權，多次北伐，名氣越來越大。","隱居在東山的謝安，也終於答應出來做官。一起去認識這些名士吧！"],"people":[["殷浩","清談高手，帶兵北伐卻失敗"],["桓溫","東晉大將軍，多次北伐"],["謝安","隱居東山的名士，後來當上宰相"],["支道林","愛講《莊子》的和尚"]]},"stops":[{"id":"e46_03","yr":"約西元 350 年","place":"白馬寺","scene":"study","music":"palace","cast":[["支道林",1.0,-0.6],["馮懷",6.8,1.2],["名士",2.8,0.8]],"beats":[{"t":"東晉名士最愛討論《莊子》。其中〈逍遙遊〉最難懂，大家想來想去，都跳不出郭象、向秀兩位前輩的說法。"},{"t":"這天，和尚支道林在白馬寺，和太常馮懷聊起了〈逍遙遊〉。","mv":[["馮懷",-0.6,0.6]]},{"who":"馮懷","t":"郭象說，大鵬鳥和小麻雀只要照自己的本性過日子，就都是逍遙。大家都這麼認為。"},{"who":"支道林","t":"我倒不這麼想。如果照本性就叫逍遙，那壞人照著壞本性做壞事，也算逍遙嗎？","fx":[["focus","支道林"],["say","支道林"]]},{"t":"支道林接著提出一套全新的解釋，是前面那麼多名士都沒有想到的。","fx":[["upset","馮懷"],["upset","名士"]]},{"who":"名士","t":"這個道理，從來沒有人說過！"}],"q":"支道林在郭象、向秀兩家的說法之外，提出了新的道理、與眾不同的見解。這件事變成哪個成語？","wrong":[{"w":"墨守成規","by":"馮懷","line":"墨守成規是死守老規矩不肯改。支道林剛好相反，他提出了新道理！"},{"w":"照本宣科","by":"名士","line":"照本宣科是照著書本念。他講的可是書上沒有的新見解！"},{"w":"別出心裁","by":"支道林","line":"別出心裁是想出跟別人不一樣的點子，意思很接近！不過原文說我提出「新理」和「異義」，有一個專門的成語。"}],"hint":"原文說他提出「新」的道理、「異」的見解。","after":"後來大家講〈逍遙遊〉，就都採用支道林的說法。","lesson":{"title":"支道林與王羲之","text":"王羲之到會稽當官時，本來看不起支道林，不想跟他說話。支道林留住他，講了幾千字的〈逍遙遊〉，又新又精彩，王羲之聽得解開衣襟、捨不得離開。","next":"這時，朝廷派清談高手殷浩帶兵北伐。很會講道理的人，會不會打仗呢？……"}},{"id":"e60_06","yr":"西元 354 年","place":"信安","scene":"study","music":"night","cast":[["殷浩",0.4,-0.8],["揚州官吏",6.8,1.0],["百姓",7.4,1.8]],"beats":[{"t":"殷浩是名氣很大的清談高手。朝廷派他帶兵北伐，想收復中原。"},{"t":"可是殷浩不會打仗，西元 353 年大敗而回，丟掉了好多糧食和武器。","fx":[["sad","殷浩"]]},{"t":"大將軍桓溫趁機上奏。殷浩被免去官職、貶為平民，搬到偏遠的信安去住。"},{"t":"殷浩嘴上沒有一句抱怨，只是整天伸出手指，在空中比畫著寫字。","fx":[["focus","殷浩"]]},{"t":"以前跟過他的揚州官吏和百姓很好奇，偷偷跑來看。","mv":[["揚州官吏",2.2,0.8],["百姓",3.3,1.6]],"fx":[["focus",null]]},{"who":"揚州官吏","t":"他到底在寫什麼？咦，翻來覆去，好像只有四個字……","fx":[["upset","揚州官吏"]]}],"q":"殷浩覺得發生在自己身上的事，太奇怪、太想不通了，整天在空中寫著帶有驚嘆聲的四個字。那四個字是？","wrong":[{"w":"司空見慣","by":"百姓","line":"司空見慣是常常看到、一點也不奇怪。殷大人覺得這件事怪得不得了！"},{"w":"天經地義","by":"揚州官吏","line":"天經地義是理所當然的道理。殷大人可是想破頭都想不通呢！"},{"w":"匪夷所思","by":"殷浩","line":"匪夷所思是奇怪得讓人想不到，意思很接近！不過我在空中寫的，是帶著驚嘆聲的那四個字。"}],"hint":"「咄」念ㄉㄨㄛˋ，是表示驚訝的聲音。","after":"後來「書空」也成了成語，形容人失意、想不開的樣子。","lesson":{"title":"桓溫掌握兵權","text":"殷浩被廢之後，朝廷的兵權幾乎都落到桓溫手上。桓溫接著出兵北伐，打敗前秦的軍隊，一度打到長安附近，名氣越來越大。","next":"東晉的名士裡，不只有大官和清談家，也有窮人家的孩子，靠著努力讀書出人頭地……"}},{"id":"e07_02","yr":"東晉中期","place":"南平車家","scene":"study","music":"night","cast":[["小車胤",-0.8,-1.2],["母親",6.8,1.0]],"beats":[{"t":"南平有個孩子叫車胤，讀書很認真，懂的東西很多。可是家裡很窮，常常買不起點燈的油。"},{"who":"母親","t":"胤兒，燈油又用完了，今天晚上早點睡吧。","mv":[["母親",1.4,0.4]]},{"who":"小車胤","t":"可是書才讀到一半……","fx":[["sad","小車胤"]]},{"t":"夏天的晚上，草叢裡飛著一閃一閃的螢火蟲。車胤想到了一個好辦法！","fx":[["focus","小車胤"]]},{"t":"他用白絹縫了一個袋子，裝進幾十隻螢火蟲，照著書一直讀到深夜。","fx":[["cheer","小車胤"]]},{"t":"另外還有一個叫孫康的人，也買不起燈油，冬天就藉著雪地反射的光讀書。","fx":[["focus",null]]}],"q":"一個用袋子裝螢火蟲照書，一個靠雪地的反光讀書。形容家裡貧窮、仍然刻苦讀書的成語是？","wrong":[{"w":"半途而廢","by":"母親","line":"半途而廢是做到一半就放棄。胤兒可是想盡辦法把書讀完呢！"},{"w":"不學無術","by":"小車胤","line":"不學無術是不讀書、沒本事。我最愛讀書了！"},{"w":"鑿壁偷光","by":"小車胤","line":"鑿壁偷光是漢朝匡衡在牆上挖洞，借鄰居的燈光讀書，意思很接近！不過我用的是螢火蟲，孫康用的是雪光喔。"}],"hint":"「囊」是袋子；一個借螢光，一個借雪光。","after":"車胤長大後非常有學問，後來在朝廷當到很高的官。","lesson":{"title":"無車公不樂","text":"車胤很會說話，大將軍桓溫很賞識他。每次有熱鬧的聚會，車胤如果不在，大家都說：「沒有車公在，就不好玩了！」孫康讀書的故事出自另一本書，後人把兩人的故事合在一起。","next":"那時候，有位名士隱居在東山，朝廷怎麼請都請不動，他就是謝安……"}},{"id":"e20_04","yr":"西元 360 年","place":"建康新亭","scene":"river","music":"palace","cast":[["謝安",-0.6,0.4],["高靈",6.8,1.2],["朝臣",1.6,-0.4],["朝臣",2.8,0.6]],"beats":[{"t":"謝安很有才華，卻隱居在東山，每天遊山玩水、教家裡的孩子讀書。朝廷一次又一次請他做官，他都不肯。"},{"who":"朝臣","t":"謝安石不肯出來，天下的百姓該怎麼辦啊？","fx":[["sadAll","朝臣"]]},{"t":"謝安四十歲左右，終於答應到大將軍桓溫手下當司馬。出發那天，朝中官員都到新亭送行。","fx":[["cheerAll","朝臣"]]},{"t":"御史中丞高靈也來了。他先喝了點酒，假裝醉醺醺地走過來。","mv":[["高靈",1.0,1.1]]},{"who":"高靈","t":"你一直不聽朝廷的命令，躺在東山不出來。大家都說：謝安不出來，百姓怎麼辦？現在嘛——百姓要拿你怎麼辦呢？","fx":[["say","高靈"]]},{"t":"謝安聽了，只是笑一笑，什麼也沒回答。","fx":[["focus","謝安"]]}],"q":"謝安在東山隱居多年，後來又出來做官。這件事變成一個成語，後來也比喻失敗之後重新振作，是哪一個？","wrong":[{"w":"隱姓埋名","by":"高靈","line":"隱姓埋名是躲起來不讓人知道。謝安現在可是光明正大出來做官啦！"},{"w":"一蹶不振","by":"朝臣","line":"一蹶不振是跌倒了就爬不起來。謝公這是重新出發呀！"},{"w":"捲土重來","by":"謝安","line":"捲土重來也是失敗後再來一次，意思很接近！不過它原本說的是打仗，我的故事是從隱居的那座山出來。"}],"hint":"謝安隱居的地方，叫什麼山？","after":"謝安出來做官後，越來越受到重用，後來當上了宰相。","lesson":{"title":"謝家子弟","text":"謝安的家族出了很多人才，他常和姪子、姪女一起讀書談詩。姪女謝道韞把飄雪比喻成「柳絮因風起」，被稱讚是才女；姪子謝玄後來成為名將。","next":"東晉的皇族裡，也有人愛和名士一起討論學問，他就是會稽王司馬昱……"}},{"id":"e33_06","yr":"約西元 360 年","place":"會稽王府","scene":"study","music":"palace","cast":[["會稽王",0.6,-0.8],["和尚",6.8,1.0],["名士",-1.0,0.6]],"beats":[{"t":"會稽王司馬昱是晉元帝的小兒子，在朝廷裡主持大事。他很喜歡和名士、和尚一起討論學問。"},{"t":"這天，一位和尚來講佛經。","mv":[["和尚",1.8,0.8]]},{"who":"和尚","t":"佛經上說，只要不斷修練自己的心，就能成為聖人！","fx":[["say","和尚"]]},{"who":"名士","t":"真的嗎？那不就人人都能當聖人了？","fx":[["upset","名士"]]},{"who":"會稽王","t":"能不能一路爬上最高的山峰、到達最頂點，我可不敢說……","fx":[["focus","會稽王"]]},{"who":"會稽王","t":"不過，一點一滴修練的功夫，確實是有用的，不能說它是假的。","fx":[["say","會稽王"]]}],"q":"會稽王把修練成聖人，比喻成登上山峰的最高點。後來形容學問、技藝達到最高的境界，叫做什麼？","wrong":[{"w":"每況愈下","by":"名士","line":"每況愈下是情況越來越差。我們說的是越爬越高！"},{"w":"半途而廢","by":"和尚","line":"半途而廢是走到一半就放棄。修練要一直堅持下去才行！"},{"w":"爐火純青","by":"會稽王","line":"爐火純青是功夫練得純熟完美，意思很接近！不過我說的是爬上山峰的最高點，有一個專門的成語。"}],"hint":"「造」是到達，「極」是最高點。","after":"會稽王的意思是：能不能成聖人很難說，但努力修練一定有收穫。","lesson":{"title":"簡文帝","text":"司馬昱後來被桓溫擁立為皇帝，就是晉簡文帝，可是只當了不到兩年就病逝了。他喜歡清談，被人稱讚很有名士風度。","next":"王羲之的兒子王獻之長大了，有一次走在會稽山陰的路上……"}},{"id":"e46_04","yr":"東晉中期","place":"會稽山陰道","scene":"south","music":"map","cast":[["王獻之",-6.8,0.8],["書童",-7.4,1.6]],"beats":[{"t":"王獻之是王羲之的兒子，在會稽長大。會稽的山陰一帶，是有名的好風景。"},{"t":"這天，王獻之帶著書童，走在山陰的山路上。","mv":[["王獻之",-0.4,0.4],["書童",0.9,1.0]]},{"t":"一路上有高山、有溪流，山的影子映在水裡，水光又把山照得更亮。","fx":[["focus","王獻之"]]},{"who":"書童","t":"公子快看！那邊還有瀑布！","fx":[["cheer","書童"]]},{"who":"王獻之","t":"左邊是青山，右邊是綠水，前面又是一片紅葉……","fx":[["cheer","王獻之"]]},{"who":"王獻之","t":"美景一個接著一個，眼睛都忙不過來了！","fx":[["focus",null]]}],"q":"王獻之說：走在山陰道上，山水互相映照，美景多到讓人來不及招呼、沒有空閒欣賞。這句話變成哪個成語？","wrong":[{"w":"窮山惡水","by":"書童","line":"窮山惡水是又荒涼又危險的地方。這裡的風景可美了！"},{"w":"平淡無奇","by":"書童","line":"平淡無奇是普普通通、一點也不特別。公子都看到忙不過來了耶！"},{"w":"美不勝收","by":"王獻之","line":"美不勝收是美好的東西太多、看都看不完，意思很接近！不過我的原話，說的是美景一直來，我招呼不過來、沒有空閒。"}],"hint":"「暇」是空閒；美景一直來，招呼都沒空。","after":"王獻之還說：「如果是秋冬的時候，景色更是讓人難忘。」","lesson":{"title":"山陰與蘭亭","text":"王羲之一家住在會稽，山水非常美。西元 353 年，王羲之和朋友在這裡的蘭亭聚會，寫下了〈蘭亭集序〉。這個成語現在也用來形容事情或客人太多，忙得應付不過來。","next":"王家另一位年輕人——王導的兒子王劭，這天穿著官服，走進了大將軍桓溫的府中……"}},{"id":"e60_07","yr":"約西元 363 年","place":"桓溫府","scene":"palace","music":"palace","cast":[["桓溫",1.4,0],["王劭",-6.8,1.0],["大臣",2.8,1.2],["侍衛",-1.6,-1.6],["侍衛",3.4,-1.6]],"beats":[{"t":"王導是東晉初年的宰相，風度非常好，大家都很敬佩他。王導過世多年以後，他的兒子王劭也長大了。"},{"t":"王劭的長相和氣質都很像父親。他當上侍中，奉命來替大將軍桓溫加封官職。"},{"t":"王劭穿著官服，從大門走了進來。","mv":[["王劭",-0.4,0.6]]},{"who":"桓溫","t":"嗯……大奴這孩子，果然有他父親的鳳凰羽毛啊！","fx":[["focus","桓溫"],["say","桓溫"]]},{"t":"桓溫的意思是：王劭像一隻小鳳凰，長著父親那樣漂亮的羽毛，繼承了父親的風采。","fx":[["cheer","王劭"]]},{"t":"三國時代的蔣濟也說過：「學的人像牛毛那麼多，學成的人卻像麒麟的角那麼少。」","fx":[["focus",null]]}],"q":"鳳凰的羽毛、麒麟的角，都是非常稀少珍貴的東西。後人把這兩個說法合起來，比喻稀少又珍貴的人才或東西，是哪個成語？","wrong":[{"w":"多如牛毛","by":"大臣","line":"多如牛毛是多到數不清，剛好相反！蔣濟說，學的人才像牛毛那麼多。"},{"w":"雞毛蒜皮","by":"侍衛","line":"雞毛蒜皮是一點也不重要的小事。鳳凰和麒麟可是珍貴得很！"},{"w":"寥寥無幾","by":"桓溫","line":"寥寥無幾是非常少，意思很接近！不過它沒有「珍貴」的意思。我說的是鳳凰的羽毛，有一個專門的成語。"}],"hint":"兩種傳說中的神獸：一種會飛，一種頭上長角。","after":"「大奴」是王劭的小名。後來「鳳毛」也用來稱讚兒子有父親的才華。","lesson":{"title":"桓溫的野心","text":"這時的桓溫已經是東晉最有權力的人，朝廷不斷替他加官。他打算再一次北伐，立下更大的功勞，讓自己的地位更高。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第三十三章．名士風流","eps":[7,20,33,46,60]},{"key":"h30","line":"history","name":"淝水之戰","short":"淝水之戰","era":"西元 369–約 390 年","color":"#B5653A","map":{"ground":"#b5c27a","river":"#4f9fd8"},"intro":{"lines":["桓溫北伐失敗後過世，東晉改由謝安主持朝政，國家慢慢穩定下來。","北方的前秦皇帝苻堅統一了北方，帶著號稱百萬的大軍南下，想一舉消滅東晉。","西元 383 年，謝玄率領的「北府兵」在淝水打敗前秦，以少勝多，保住了江南。","這個時代的江南，也出了大畫家顧愷之、愛讀書的陶淵明等有趣的人物。"],"people":[["謝安","東晉宰相，淝水之戰時坐鎮京城"],["謝玄","謝安的姪子，率領北府兵"],["苻堅","前秦皇帝，統一北方"],["顧愷之","東晉大畫家"]]},"stops":[{"id":"e33_08","yr":"約西元 369 年","place":"北伐軍中","scene":"walls","music":"battle","cast":[["桓溫",0.6,0.4],["袁宏",6.8,1.4],["王珣",2.2,1.4],["晉兵",-1.6,-1.8],["晉兵",2.6,-1.8]],"beats":[{"t":"大將軍桓溫帶兵北伐。文筆很好的袁宏跟著出征，卻因為犯了錯，被桓溫免了官。"},{"t":"這時軍中急著要一篇「露布」，就是公開發布、讓大家都看得到的軍中文告。"},{"who":"桓溫","t":"叫袁宏過來！讓他靠在馬前，馬上寫好！","fx":[["say","桓溫"]]},{"t":"袁宏跑了過來，靠在戰馬旁邊，提起筆就寫。","mv":[["袁宏",4.0,-0.1]]},{"t":"他的手一直沒有停，一下子就寫滿了七張紙，而且寫得非常好。","fx":[["focus","袁宏"]]},{"who":"王珣","t":"太厲害了！這麼快，還寫得這麼精彩！","fx":[["cheer","王珣"],["focus",null]]}],"q":"袁宏靠在馬前寫文章，一下子就寫好了，大家站在旁邊等一下就能看到。形容文思敏捷、寫作迅速，叫做什麼？","wrong":[{"w":"馬馬虎虎","by":"桓溫","line":"馬馬虎虎是隨隨便便、不認真。袁宏寫得又快又好，一點也不隨便！"},{"w":"江郎才盡","by":"晉兵","line":"江郎才盡是才華用光了、寫不出好文章。袁先生的文思可是源源不絕！"},{"w":"一揮而就","by":"王珣","line":"一揮而就是一下筆就完成，意思很接近！不過靠在馬前寫文章的故事，有一個專門的成語。"}],"hint":"他寫文章時靠在什麼旁邊？大家只要稍微「等待」就好。","after":"「露布」不封口，寫好就公開傳給大家看，所以要寫得又快又好。袁宏的才華，讓在旁邊的王珣讚嘆不已。","lesson":{"title":"枋頭之敗","text":"西元 369 年，桓溫北伐前燕，一路打到枋頭，卻因為糧食運不上來，被敵軍打敗，損失慘重。四年後桓溫病逝，東晉改由謝安主持朝政。","next":"東晉的國勢慢慢穩定。江南的鄉下，有一個愛讀書的人叫陶淵明……"}},{"id":"e07_08","yr":"東晉末年","place":"柴桑陶家","scene":"house","music":"map","cast":[["陶淵明",0.4,-0.2],["小兒子",6.8,1.2]],"beats":[{"t":"陶淵明住在柴桑的鄉下。他從年輕時就愛讀書，也喜歡安安靜靜地過日子。"},{"t":"他一打開書，讀到有心得的地方，就開心得什麼都忘了。","fx":[["cheer","陶淵明"]]},{"who":"小兒子","t":"爹，吃飯囉！飯菜都要涼了！","mv":[["小兒子",1.8,0.8]]},{"who":"陶淵明","t":"等一下、等一下，這裡寫得太有意思了！","fx":[["focus","陶淵明"]]},{"t":"看到窗外的樹木枝葉交錯、聽見鳥兒換了新的叫聲，他也會高興起來。","fx":[["focus",null]]},{"who":"陶淵明","t":"只要翻開書本，就一定有收穫啊！","fx":[["say","陶淵明"]]}],"q":"陶淵明一打開書，讀到心得就開心得忘了吃飯。後來形容「讀書一定會得到好處」的成語是哪一個？","wrong":[{"w":"目不識丁","by":"小兒子","line":"目不識丁是一個字都不認得。爹可是最愛讀書的人！"},{"w":"游手好閒","by":"小兒子","line":"游手好閒是整天玩、不做正事。爹一直在認真讀書耶！"},{"w":"手不釋卷","by":"陶淵明","line":"手不釋卷是書一直拿在手上不放，說的是很愛讀書，意思有點接近！不過要說的是讀書帶來的好處，有一個更貼切的成語。"}],"hint":"「卷」就是書；把書打開，就會得到好處。","after":"陶淵明在寫給兒子們的信裡說，自己從年輕時就喜歡讀書，「開卷有得，便欣然忘食」。","lesson":{"title":"成語的出處","text":"這個成語的四個字，其實是五百多年後北宋的宋太宗說的。他每天讀三卷書，說打開書就有好處。陶淵明後來不願意「為五斗米折腰」，辭官回家種田，成為有名的田園詩人。","next":"東晉有一位大畫家，連吃甘蔗都有自己的一套方法……"}},{"id":"e33_07","yr":"東晉","place":"建康","scene":"house","music":"map","cast":[["顧愷之",0.6,0],["朋友",6.8,1.2]],"beats":[{"t":"顧愷之是東晉最有名的畫家，小名叫「虎頭」。他畫人物特別傳神，個性也有點古怪、有趣。"},{"t":"朋友來找他，看見顧愷之正在啃一根甘蔗。","mv":[["朋友",1.9,0.8]]},{"t":"奇怪的是，他是從甘蔗的尾巴開始吃，而不是從最甜的根部吃起。","fx":[["focus","顧愷之"]]},{"who":"朋友","t":"長康，大家都先吃最甜的那一頭，你怎麼從尾巴吃起呢？","fx":[["upset","朋友"]]},{"who":"顧愷之","t":"你不懂啦！從尾巴開始吃，會越吃越甜……","fx":[["cheer","顧愷之"]]},{"who":"顧愷之","t":"這樣慢慢地，就走進最美好的地方啦！","fx":[["say","顧愷之"]]}],"q":"顧愷之從甘蔗尾巴吃起，越吃越甜。後來比喻情況越來越好、或越來越有趣，叫做什麼？","wrong":[{"w":"虎頭蛇尾","by":"朋友","line":"虎頭蛇尾是開頭很好、後來越來越差。雖然你小名叫虎頭，可是吃甘蔗剛好相反啊！"},{"w":"味同嚼蠟","by":"顧愷之","line":"味同嚼蠟是像在嚼蠟一樣沒味道。我的甘蔗可是越吃越甜！"},{"w":"苦盡甘來","by":"朋友","line":"苦盡甘來是苦日子過完、好日子來了，意思有點接近！不過甘蔗尾巴不是苦的，是一點一點變甜，有一個更貼切的成語。"}],"hint":"慢慢地，「進」入美好的境界。","after":"《世說新語》寫的是「漸至佳境」，後來《晉書》寫成了現在的說法。","lesson":{"title":"畫絕顧愷之","text":"顧愷之被稱為「才絕、畫絕、癡絕」。他畫人像有時好幾年都不點眼睛，說傳神的關鍵就在眼睛裡。他的〈女史箴圖〉〈洛神賦圖〉，今天還留有後人臨摹的版本。","next":"東晉的名門子弟裡，也有很有才氣又很傲的年輕人，像是王忱……"}},{"id":"e46_07","yr":"約西元 380 年","place":"范甯家","scene":"house","music":"palace","cast":[["范甯",2.6,-0.6],["張玄",-0.8,-0.2],["王忱",6.8,1.2]],"beats":[{"t":"王忱是太原王家的年輕人，才華很高，脾氣也很傲。這天，他去拜訪舅舅范甯。","mv":[["王忱",1.4,0.8]]},{"t":"剛好名士張玄也在。","fx":[["focus","張玄"]]},{"who":"范甯","t":"張玄是吳地有名的人才，你們兩個好好聊聊吧！","fx":[["say","范甯"],["focus",null]]},{"t":"張玄端端正正坐好、整理衣服，等著王忱先開口。王忱卻一句話也不說，張玄很失望地走了。","mv":[["張玄",-7.5,0.4]],"fx":[["sad","張玄"]]},{"who":"范甯","t":"張玄這麼優秀，你為什麼不跟他說話？","fx":[["upset","范甯"]]},{"who":"王忱","t":"他如果想認識我，可以自己來找我呀！","fx":[["say","王忱"]]},{"who":"范甯","t":"你這孩子……真有風度、有名望啊！","fx":[["focus","王忱"]]}],"q":"范甯笑著稱讚王忱，是「後來才出現的優秀人才」。比喻新成長起來的優秀年輕人，是哪個成語？","wrong":[{"w":"江河日下","by":"范甯","line":"江河日下是情況一天比一天差。這孩子年紀輕輕，正是越來越好的時候！"},{"w":"老態龍鍾","by":"王忱","line":"老態龍鍾是老得走路都不穩。我還年輕得很呢！"},{"w":"青出於藍","by":"王忱","line":"青出於藍是學生比老師更厲害，意思有點接近！不過舅舅是稱讚我是新一代的人才，有一個專門的成語。"}],"hint":"「秀」是優秀的人才；他是比較晚才出現的新一代。","after":"王忱回答：「沒有這樣的舅舅，哪有這樣的外甥！」范甯派人告訴張玄，張玄就穿戴整齊來拜訪王忱，兩人這才成為朋友。","lesson":{"title":"王大","text":"王忱小名「佛大」，所以大家叫他「王大」。他很有才氣，後來當上荊州刺史。原文寫的是「後來之秀」，後人改成了現在的說法。","next":"就在這些年，北方的前秦皇帝苻堅統一了北方，帶著大軍向南打來……"}},{"id":"e20_03","yr":"西元 383 年","place":"淝水","scene":"valley","music":"battle","winSad":"苻堅","cast":[["謝玄",-4.4,-1.0,0.25],["晉兵",-3.4,-1.8,0.25],["晉兵",-5.2,-1.8,0.25],["苻堅",4.4,-1.0,0.25],["秦兵",2.6,0.2],["秦兵",3.6,1.0],["秦兵",5.0,0.6]],"beats":[{"t":"前秦皇帝苻堅帶著號稱百萬的大軍南下，在淝水邊排開陣勢。東晉的謝玄，手下只有八萬人。"},{"who":"謝玄","t":"請你們的軍隊稍微往後退一點，讓我們渡過河，痛痛快快打一場！","fx":[["say","謝玄"]]},{"who":"苻堅","t":"好！等他們渡河渡到一半，朕再派騎兵衝過去！","fx":[["say","苻堅"]]},{"t":"沒想到秦軍一往後退，就停不下來了。後面有人大喊：「秦軍敗了！」整個大軍亂成一團。","mv":[["秦兵",4.8,-2.4],["秦兵#2",6.0,-1.6],["秦兵#3",6.6,-0.4]],"fx":[["upset","苻堅"]]},{"t":"謝玄帶著八千精兵渡過淝水，衝殺過去，秦軍大敗。","mv":[["晉兵",-1.0,-0.4],["晉兵#2",0.2,0.6]],"fx":[["cheerAll","晉兵"]]},{"t":"逃跑的秦兵丟掉盔甲，連夜奔逃。風一吹、鶴一叫，他們就嚇得直發抖。","fx":[["sadAll","秦兵"]]},{"who":"秦兵","t":"晉軍追來了！快跑啊！","mv":[["苻堅",7.6,-1.0,0],["秦兵",8.0,-2.4],["秦兵#2",8.4,-1.4],["秦兵#3",8.8,-0.4]]}],"q":"逃跑的秦兵聽到風吹的聲音、白鶴的叫聲，都以為晉軍追來了。形容驚慌害怕、疑神疑鬼，叫做什麼？","wrong":[{"w":"鳥語花香","by":"晉兵","line":"鳥語花香是春天美好的景色。他們聽到鳥叫，可是嚇得半死！"},{"w":"從容不迫","by":"謝玄","line":"從容不迫是不慌不忙。秦兵慌得連盔甲都丟了！"},{"w":"草木皆兵","by":"苻堅","line":"草木皆兵也是這場仗留下的，意思很接近！那是朕站在城上，把八公山的草木看成晉兵；秦兵逃跑時聽到風聲和鶴叫，是另一個成語。"}],"hint":"他們「聽」到了什麼聲音？一個是風，一個是鳥。","after":"捷報送到時，謝安正在和客人下棋，看完信又繼續下。客人問他，他只淡淡地說：「孩子們已經打敗敵人了。」","lesson":{"title":"以少勝多","text":"淝水之戰是歷史上有名的以少勝多。苻堅逃回北方後，前秦很快就分裂了；東晉保住了江南，南北對峙又持續了兩百多年。","next":"打了大勝仗的謝玄，想要乘勝北伐，收復中原……"}},{"id":"e60_08","yr":"約西元 385 年","place":"北伐軍營","scene":"tent","music":"night","table":true,"cast":[["謝玄",0.6,0.4],["部將",2.2,0.8],["朝廷使者",6.8,1.2]],"beats":[{"t":"淝水之戰後，謝玄乘勝北伐，一路收復了兗州、青州、豫州等許多地方。"},{"who":"謝玄","t":"下一步，往西平定洛陽，往北收復幽州、燕地！","fx":[["focus","謝玄"],["cheer","謝玄"]]},{"who":"部將","t":"將軍，大家都願意跟著您一路打下去！","fx":[["cheer","部將"]]},{"t":"可是這時候，一直支持他的叔叔謝安已經過世，朝廷裡也有人不贊成繼續打下去。","fx":[["focus",null]]},{"who":"朝廷使者","t":"朝廷有令：仗已經打得太久了，請將軍留兵駐守，帶大軍退回來！","mv":[["朝廷使者",-0.6,1.2]]},{"t":"謝玄只好撤兵。不久他又生了重病，幾年後就過世了，才四十六歲。","fx":[["sad","謝玄"]]}],"q":"史官惋惜地說：謝玄的大計畫眼看就要成功，卻沒能完成。形容事情快要成功時卻失敗了，叫做什麼？","wrong":[{"w":"大功告成","by":"部將","line":"大功告成是事情順利完成了。將軍的北伐可是沒能完成啊！"},{"w":"坐享其成","by":"朝廷使者","line":"坐享其成是自己不出力、享受別人的成果。謝將軍可是親自帶兵打仗！"},{"w":"前功盡棄","by":"謝玄","line":"前功盡棄是以前的努力全部白費，意思很接近！不過史官說的重點是「眼看就要成功了」，有一個更貼切的成語。"}],"hint":"「垂」是將要；眼看快要成功的時候……","after":"《晉書》的史官寫道：謝玄文武雙全，淝水一戰讓強敵崩潰；只可惜壽命太短，大功快要完成時卻失敗了。","lesson":{"title":"北府兵","text":"謝玄訓練的軍隊叫「北府兵」，很多士兵是從北方逃難南下的人，勇敢善戰，是東晉最強的部隊。後來北府兵出身的將領，還會改變東晉的命運。","next":"東晉後期的名士王恭，有一天從會稽回到建康，老朋友王大來看他……"}},{"id":"e36_08","yr":"東晉後期","place":"建康王恭家","scene":"house","music":"palace","cast":[["王恭",0.4,-0.2],["王忱",6.8,1.2],["僕人",-1.6,-0.6]],"beats":[{"t":"王恭出身名門，剛從會稽回到建康。老朋友王忱，也就是大家叫他「王大」的那位，來看他。","mv":[["王忱",1.8,0.6]]},{"t":"王忱看見王恭坐著一條六尺長的竹蓆，又涼又舒服。","fx":[["focus","王忱"]]},{"who":"王忱","t":"你從會稽回來，那裡出產好竹蓆，一定帶了很多吧？送我一條吧！","fx":[["say","王忱"]]},{"t":"王恭沒有說話。等王忱一走，他就叫僕人把自己坐的那條竹蓆捲起來送過去。","mv":[["王忱",7.5,1.0]],"fx":[["focus",null]]},{"who":"僕人","t":"大人，您只有這一條，送出去您要坐什麼呢？","fx":[["upset","僕人"]]},{"t":"王恭沒有別的蓆子了，就改坐在粗草墊上。後來王忱聽說了，嚇了一跳，跑回來看他。","mv":[["王忱",1.8,0.6]],"fx":[["upset","王忱"]]},{"who":"王忱","t":"我以為你有很多，才跟你要的呀！","fx":[["focus","王恭"]]}],"q":"王恭笑著說：「您不了解我，我這個人做人，沒有多餘的東西。」形容身邊沒有多餘的東西、生活簡樸，叫做什麼？","wrong":[{"w":"家財萬貫","by":"僕人","line":"家財萬貫是非常有錢。大人連第二條竹蓆都沒有呢！"},{"w":"一擲千金","by":"王忱","line":"一擲千金是花錢很大方、很浪費。王恭可是節儉得很！"},{"w":"兩袖清風","by":"王恭","line":"兩袖清風是說當官清廉、不拿錢財，意思有點接近！不過我說的是身邊沒有多餘的東西，有一個專門的成語。"}],"hint":"「長」在這裡念ㄓㄤˋ，是多餘的意思。","after":"從此大家都知道，王恭是一個不貪圖享受、過得很簡樸的人。","lesson":{"title":"東晉的尾聲","text":"王恭後來在朝廷的權力鬥爭中失敗。東晉末年內亂不斷，北府兵將領劉裕慢慢掌握大權，西元 420 年建立宋朝，歷史進入「南北朝」。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第三十四章．淝水之戰","eps":[7,20,33,36,46,60]},{"key":"h31","name":"南北朝風雲","short":"南北朝","era":"西元 398–505 年","color":"#5E8C9E","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["西晉滅亡後，北方大亂，晉朝皇族逃到南方，在建康（今天的南京）建立了東晉。","東晉之後，南方換了宋、齊、梁、陳四個朝代，合稱「南朝」。","北方由鮮卑人建立的北魏統一，後來又分裂，合稱「北朝」。","南北兩邊對峙了一百多年，直到西元 589 年隋朝統一天下。這段時間叫「南北朝」。","這個時代有清談的名士、講經的高僧，也有勇猛的將軍和想改革的皇帝。一起去看看吧！"],"people":[["慧遠","住在廬山的高僧，老了還天天講經"],["檀道濟","南朝宋的名將，北魏非常怕他"],["北魏孝文帝","把首都遷到洛陽，推動改革"],["梁武帝","建立梁朝，在位四十多年"]]},"stops":[{"id":"e46_01","yr":"約西元 398 年","place":"江陵．殷仲堪府中","scene":"house","music":"map","cast":[["桓玄",-1.6,0.4],["殷仲堪",0.4,-0.4],["顧愷之",1.9,0.6],["參軍",6.8,1.4]],"beats":[{"t":"東晉末年，荊州刺史殷仲堪和桓玄、大畫家顧愷之聚在一起聊天。三個人都很會說話。"},{"who":"桓玄","t":"我們來玩遊戲！每人說一句『最危險的話』。我先來：矛頭上洗米，劍尖上煮飯！","fx":[["say","桓玄"]]},{"who":"殷仲堪","t":"一百歲的老爺爺，爬在枯樹枝上！","fx":[["say","殷仲堪"]]},{"who":"顧愷之","t":"井邊的轆轤上，睡著一個小嬰兒！","fx":[["cheer","顧愷之"]]},{"t":"這時，殷仲堪手下的一位參軍走過來，也想插一句。","mv":[["參軍",3.2,1.4]]},{"who":"參軍","t":"盲人騎著瞎了眼的馬，半夜走到深水池邊！","fx":[["focus","參軍"]]},{"t":"大家都愣住了。原來殷仲堪有一隻眼睛看不見，這句話好像在說他。","fx":[["upset","殷仲堪"]]}],"q":"殷仲堪一隻眼睛看不見，聽到「盲人騎瞎馬」，覺得這句話太尖銳、逼得人好難受，忍不住叫出來。他喊的是哪個成語？","wrong":[{"w":"溫文儒雅","by":"顧愷之","line":"溫文儒雅是說人斯文有禮貌。這句話一點都不溫和，把殷大人刺得好難受呢！"},{"w":"和顏悅色","by":"桓玄","line":"和顏悅色是臉色和氣、笑咪咪的。你看殷仲堪的表情，哪裡笑得出來？"},{"w":"盛氣凌人","by":"殷仲堪","line":"盛氣凌人是態度驕傲、看不起人，意思很接近！不過參軍不是驕傲，是他的話逼得我難受，我當場喊的是另一個詞。"}],"hint":"「咄」念ㄉㄨㄛˋ，是驚訝時發出的聲音，連喊了兩次。","after":"參軍這句話又危險又貼切，可是剛好戳中了主人的痛處，場面一下子尷尬起來。","lesson":{"title":"清談與危語","text":"魏晉的名士很喜歡比口才、說妙語，這個故事記在《世說新語》裡。顧愷之是有名的大畫家，人稱「畫絕、才絕、癡絕」。後來桓玄和殷仲堪翻臉，桓玄還一度自己當了皇帝，很快又被打敗。","next":"同一個時代，南方的廬山上住著一位老和尚，他每天都在講經……"}},{"id":"e46_06","yr":"約西元 410 年","place":"廬山．東林寺講堂","scene":"office","music":"palace","cast":[["慧遠",0.2,-1.0],["徒弟",-1.6,0.9],["徒弟",1.2,1.2],["徒弟",2.6,0.7]],"beats":[{"t":"高僧慧遠住在廬山三十多年，從來不下山。他已經七十多歲了，還是天天講經。","fx":[["say","慧遠"]]},{"t":"可是有幾個徒弟上課不專心，有的發呆，有的打起了瞌睡。","fx":[["sad","徒弟"],["sad","徒弟#3"]]},{"who":"慧遠","t":"我老了，就像傍晚的夕陽，光照不遠了。","fx":[["focus","慧遠"]]},{"who":"慧遠","t":"但願你們像早晨的太陽，隨著時間越來越明亮啊！"},{"t":"說完，慧遠拿起經書登上講座，大聲朗讀，聲音清亮流暢，神情非常懇切。","mv":[["慧遠",0.2,-0.4]],"fx":[["say","慧遠"]]},{"t":"台下的徒弟們都坐直了身體，再也沒有人打瞌睡。","fx":[["focus",null]]}],"q":"徒弟們看到年老的師父還這麼用心講經，心裡很佩服，態度一下子變得恭敬嚴肅。這種樣子叫做什麼？","wrong":[{"w":"嗤之以鼻","by":"徒弟#2","line":"嗤之以鼻是用鼻子哼一聲，瞧不起人。我們怎麼敢瞧不起師父！"},{"w":"漫不經心","by":"慧遠","line":"漫不經心是隨隨便便、不專心，那是他們剛剛的樣子。現在可不一樣了。"},{"w":"五體投地","by":"徒弟","line":"五體投地是佩服到趴在地上，意思很接近！不過我們是因為敬佩而變得恭敬嚴肅，有個更貼切的說法。"}],"hint":"「肅然」是恭敬嚴肅的樣子，後面接「起」了什麼？","after":"《世說新語》原文寫的是「肅然增敬」，後來才變成現在的說法。","lesson":{"title":"廬山慧遠","text":"慧遠是東晉時的高僧，在廬山建立東林寺，和許多人結社念佛，後來被尊為淨土宗的初祖。佛教在南北朝時非常興盛，到處都蓋了寺廟。","next":"東晉之後是南朝的宋朝。有個小男孩被叔叔問到長大想做什麼，他的回答好驚人……"}},{"id":"e08_05","yr":"南朝宋初年","place":"南陽．宗家","scene":"house","music":"map","cast":[["宗炳",1.4,-0.2],["小宗慤",-1.0,0.6],["強盜",7.0,0.8],["強盜",7.6,1.8]],"beats":[{"t":"南朝宋的時候，有個叔叔叫宗炳，喜歡畫畫、遊山玩水。他很疼愛姪子宗慤。"},{"who":"宗炳","t":"慤兒，你長大以後想做什麼呀？","fx":[["say","宗炳"]]},{"who":"小宗慤","t":"我想乘著長長的大風，衝破一萬里的大浪！","fx":[["cheer","小宗慤"],["focus","小宗慤"]]},{"t":"宗慤十四歲那年，哥哥剛娶新娘，晚上竟然有十幾個強盜闖進家裡！","mv":[["強盜",2.6,0.6],["強盜#2",3.4,1.6]]},{"who":"小宗慤","t":"不准進來！","mv":[["小宗慤",1.2,0.9]],"fx":[["upset","小宗慤"]]},{"t":"宗慤挺身擋在門口，強盜們嚇得四處逃散，一個也進不了屋子。","mv":[["強盜",7.4,0.6],["強盜#2",8.0,1.8]],"fx":[["focus",null]]}],"q":"宗慤小時候說要「乘著長風，衝破萬里浪」，長大後果然勇敢不怕困難。後來比喻志向遠大、勇往直前，叫做什麼？","wrong":[{"w":"隨波逐流","by":"宗炳","line":"隨波逐流是跟著水波漂，自己沒有主見。慤兒是要衝破大浪，剛好相反！"},{"w":"半途而廢","by":"小宗慤","line":"半途而廢是做到一半就放棄。我可是連強盜都不怕呢！"},{"w":"鵬程萬里","by":"宗炳","line":"鵬程萬里是大鵬鳥飛萬里，祝福人前途遠大，意思很接近！不過慤兒說的是乘著風、衝破浪。"}],"hint":"宗慤說的話裡，有「風」也有「浪」。","winMv":[["小宗慤",-0.4,0.4]],"after":"叔叔宗炳聽了說：「你將來如果不能大富大貴，就會把我們家敗光啦！」意思是這孩子的志氣大，不是普通人。","lesson":{"title":"宗慤破象陣","text":"宗慤長大後當了將軍，去攻打南方的林邑國。敵人騎著大象衝過來，宗慤想到獅子是百獸之王，就叫士兵做假獅子迎上去，大象果然嚇得逃走，宋軍打了勝仗。","next":"南朝宋還有一位名將，北魏軍隊聽到他的名字就害怕。可是朝廷卻不信任他……"}},{"id":"e48_03","yr":"西元 436 年","place":"建康","scene":"palace","music":"night","winSad":"檀道濟","cast":[["檀道濟",0.2,0.2],["官員",6.8,1.0],["士兵",7.2,-0.6],["士兵",7.6,0.4]],"beats":[{"t":"檀道濟是南朝宋的大將，跟北魏打了很多仗，北魏軍隊聽到他的名字就害怕。"},{"t":"可是皇帝生了重病，朝廷裡的人擔心檀道濟功勞太大，將來管不住他。"},{"t":"檀道濟被召進京城。等到要回去時，官兵突然出現了。","mv":[["官員",1.9,0.8],["士兵",2.2,-0.6],["士兵#2",2.8,0.2]]},{"who":"官員","t":"檀道濟，奉命把你抓起來！","fx":[["say","官員"]]},{"t":"檀道濟氣壞了，一口氣喝下一大斗酒，把頭巾脫下來摔在地上。","fx":[["upset","檀道濟"],["focus","檀道濟"]]},{"who":"檀道濟","t":"你們這是在毀掉自己的萬里長城啊！","fx":[["upset","檀道濟"]]}],"q":"檀道濟被抓時非常憤怒，兩隻眼睛像火把一樣發亮、逼人。史書形容他的眼神是哪個成語？","wrong":[{"w":"眉開眼笑","by":"官員","line":"眉開眼笑是高興得笑開懷。他被抓了，怎麼可能笑得出來？"},{"w":"目瞪口呆","by":"士兵","line":"目瞪口呆是嚇傻了說不出話。檀將軍可沒有嚇傻，他是氣得不得了！"},{"w":"怒髮衝冠","by":"檀道濟","line":"怒髮衝冠是氣到頭髮豎起來頂住帽子，意思很接近！不過史書寫的是我的眼睛，像火炬一樣。"}],"hint":"「炬」念ㄐㄩˋ，就是火把。","after":"檀道濟還是被殺了。北魏人聽說後都很高興：「檀道濟死了，南方的人沒什麼好怕的了！」","lesson":{"title":"自毀長城","text":"檀道濟把自己比成保護國家的「萬里長城」。他死後，北魏年年南下攻打，有一次大軍一路打到長江邊。
