<style>
/* Layout: the 3D diorama fills the screen; a story sheet slides up from the bottom on phones and docks to the right on wide screens. Single night-camp palette by choice. */
:root{
  --ink:#18202f; --panel:rgba(26,34,52,.94); --panel-solid:#222c40; --line:#3a4764;
  --paper:#f4ead3; --paper-ink:#2a2418; --cinnabar:#d9483a; --gold:#e8b84f; --jade:#4fae8a;
  --fg:#eef0f5; --muted:#a6afc2;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.65;overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:20}
.hud > *{pointer-events:auto}
.chip{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{border-color:var(--gold);color:var(--gold)}
.hud .place{font-family:var(--f-display);font-size:18px}
.hud .l{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.hud .r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.timer{width:150px;max-width:40vw;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width .1s linear}
.timer.low i{background:var(--cinnabar)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:56%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel);border-top:1.5px solid var(--line);border-radius:18px 18px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.35);animation:sheetIn .45s cubic-bezier(.2,.8,.2,1) both}

@media (min-width:900px){
  .sheet{left:auto;top:calc(64px + env(safe-area-inset-top,0px));bottom:16px;right:max(16px,env(safe-area-inset-right,0px));width:420px;max-height:none;border-radius:18px;border:1.5px solid var(--line)}
}
.sheet .inner{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:17px;background:var(--cinnabar);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--gold)}
.small{font-size:13px;color:var(--muted)}
.label{font-size:13px;color:var(--muted);letter-spacing:.06em}

.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick button{background:var(--panel-solid);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}

.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.stop{background:var(--panel-solid);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stop .no{font-size:12px;color:var(--muted)}

.stop .st{color:var(--gold);letter-spacing:2px;font-size:13px}
.stop.locked{opacity:.4;cursor:default}

.stop.final{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}

.say{display:flex;gap:12px;align-items:flex-start}

.bubble.bad{border-color:var(--cinnabar)} .bubble.ok{border-color:var(--jade)}
.narr{font-family:var(--f-display);font-size:18px;border-left:3px solid var(--gold);padding-left:12px}
.hint{color:var(--gold);font-size:15px;margin-top:4px}

.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:1fr}
.opt{background:var(--paper);color:var(--paper-ink);border:2px solid transparent;border-radius:12px;padding:12px 6px;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.12em;animation:rise .4s both}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.wrong{background:var(--panel-solid);color:var(--muted);text-decoration:line-through;border-color:var(--line)}
.opt.gone{opacity:.25;text-decoration:line-through}

.items{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;animation:cardIn .7s cubic-bezier(.2,.9,.3,1.25) both}

.ruby{display:flex;gap:6px;flex-wrap:wrap}
.ruby span{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1}
.ruby small{font-family:var(--f-body);font-size:12px;font-weight:500;color:#7a6a4c}
.card .src{font-size:13px;color:#7a6a4c}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.card dt{font-weight:700;color:var(--cinnabar);white-space:nowrap}
.card dd{margin:0;min-width:0}
.stars{font-size:28px;color:var(--gold);letter-spacing:4px;text-align:center}
.stars span{display:inline-block;animation:starPop .5s cubic-bezier(.3,1.8,.5,1) both}
.listen{display:flex;align-items:center;gap:10px;background:var(--panel-solid);border-radius:12px;padding:8px 12px}
.listen button{border:0;border-radius:50%;width:42px;height:42px;background:var(--gold);color:var(--ink);font-weight:700;flex:none}
.comic{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.comic .cp{aspect-ratio:360/341;border-radius:8px;background-repeat:no-repeat}
.comic img{width:100%;border-radius:8px;display:block}
.book{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:10px;font-family:var(--f-display);font-size:20px;font-weight:700;text-align:center;border:0}
.mini.empty{background:var(--panel-solid);color:var(--muted);font-size:14px;font-weight:400}
.sent{font-size:19px;font-family:var(--f-display);background:var(--panel-solid);border-radius:12px;padding:12px 14px}
.sent b{color:var(--gold);border-bottom:2px dashed var(--gold);padding:0 6px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:8px 16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:toast 2.4s ease both;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

.caret::after{content:"▌";margin-left:2px;color:var(--gold);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(232,184,79,.9);transform:scale(1.04)}100%{box-shadow:0 0 0 24px rgba(232,184,79,0);transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(36px) rotate(-4deg) scale(.88)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(2.8)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes starPop{from{opacity:0;transform:scale(0) rotate(-120deg)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fx{animation:rise .45s both}

.warp{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#33456e 0%,var(--ink) 72%);animation:warpOut .45s 1.45s ease forwards}
.warp .bk{width:96px;height:124px;border-radius:6px 10px 10px 6px;background:var(--paper);border-left:8px solid var(--cinnabar);box-shadow:0 0 70px 24px rgba(232,184,79,.65);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:38px;color:var(--cinnabar);animation:bookGlow 1.5s ease-in forwards;z-index:2}
@keyframes bookGlow{0%{transform:scale(.5) rotate(-10deg)}55%{transform:scale(1.05) rotate(4deg)}100%{transform:scale(7);opacity:0}}
.warp .ring{position:absolute;width:120px;height:120px;border:3px solid var(--gold);border-radius:50%;animation:ring 1.3s ease-out infinite;opacity:0}
.warp .ring:nth-of-type(2){animation-delay:.3s}.warp .ring:nth-of-type(3){animation-delay:.6s}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(6);opacity:0}}
.warp .wt{position:absolute;bottom:24%;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:22px;color:var(--gold)}
@keyframes warpOut{to{opacity:0;visibility:hidden}}
.ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink);flex:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel-solid);padding:4px;border-radius:14px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:700;color:var(--muted)}
.tabs button.sel{background:var(--cinnabar);color:#fff}
.pick.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pick.five button{padding:8px 2px}.pick.five b{font-size:16px}.pick.five button span:not(.dot){display:none}
.pick.five .dot{width:22px;height:22px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{background:var(--panel-solid);border:1.5px solid var(--line);border-radius:10px;padding:7px 12px}.seg button.sel{border-color:var(--gold);color:var(--gold)}
.players{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:8px;background:var(--panel-solid);border-radius:12px;padding:8px 10px;border-left:6px solid var(--c)}
.pl input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1.5px solid var(--line);color:var(--fg);font:inherit;padding:4px 2px}
.pl input:focus{outline:none;border-bottom-color:var(--gold)}
.pl .hb{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:5px 9px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:6px}
.sc{background:var(--panel-solid);border-radius:10px;padding:5px 6px;border-top:4px solid var(--c);text-align:center;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc b{display:block;font-size:20px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sc.turn{box-shadow:0 0 0 2px var(--c) inset}

.buzz{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.buzz button{border:0;border-radius:14px;padding:18px 6px;font-weight:700;font-size:18px;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.35)}

.seals{display:flex;gap:6px;flex-wrap:wrap}
.seals button{border:1.5px solid var(--c);background:transparent;color:var(--fg);border-radius:10px;padding:5px 9px;font-size:13px}
.hearts{color:#ff6b7a;letter-spacing:2px}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ware{background:var(--panel-solid);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ware .t{display:flex;align-items:center;gap:6px;font-weight:700}
.ware p{font-size:13px;color:var(--muted);line-height:1.5}
.ware button{border:0;border-radius:10px;padding:7px;background:var(--gold);color:var(--ink);font-weight:700}
.ware button:disabled{opacity:.35}
.coin{color:var(--gold)}
.combo{font-family:var(--f-display);color:var(--gold);font-size:22px;min-height:1.3em}
.big{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.rank{display:grid;gap:6px}
.rank div{display:flex;justify-content:space-between;align-items:center;background:var(--panel-solid);border-radius:10px;padding:8px 12px;border-left:6px solid var(--c);font-variant-numeric:tabular-nums}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:65;font-family:var(--f-display);font-weight:700;font-size:44px;color:var(--gold);text-shadow:0 3px 0 #7a4e10,0 0 20px rgba(0,0,0,.5);pointer-events:none;animation:popUp 1.1s ease forwards;white-space:nowrap}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.opts.long{grid-template-columns:1fr}
.opt.long{font-family:var(--f-body);font-size:15px;font-weight:500;letter-spacing:0;text-align:left;padding:10px 12px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* chapters, story beats, history lessons */

  if(!/人|翁|夫|者|王|師|子|生|官/.test(n)){ const hit=k=>n===k||n.endsWith(k); const qk=Object.keys(Q).find(hit); if(qk){ sp={horse:true,col:Q[qk][0],s:Q[qk][1]}; CHARS[n]=sp; return sp; } const bk=Object.keys(B).sort((a,b)=>b.length-a.length).find(hit); if(bk){ sp=Object.assign({bird:true},B[bk]); CHARS[n]=sp; return sp; } }
  if(/兵|軍|卒|士兵|衛士|侍衛/.test(n)) sp={robe,hat:'helmet',plume:robe,s:.82,nolabel:true};

<script>
const CHAPTERS=[{"key":"h01","line":"history","name":"周室衰微","short":"春秋初年","era":"西元前 720–655 年","color":"#8A6BC0","map":{"ground":"#b5c27a","river":"#4f9fd8"},"intro":{"lines":["西元前 770 年，周平王把首都搬到東邊的洛邑，歷史上叫做「東周」，東周的前半段就是「春秋時代」。","這時候周天子的力量越來越弱，各地的諸侯越來越強，開始不聽天子的話。","鄭國敢跟周天子翻臉，衛國有人搶國君的位子，南方的楚國也越來越強大。","齊國靠著管仲變得富強，北方的晉國則一口一口吞下身邊的小國。","這一章，我們從周天子和鄭國吵架開始，看春秋初年的成語故事！"],"people":[["鄭莊公","春秋初年最強的國君，敢跟周天子作對"],["石碏","衛國老臣，連犯錯的兒子都不包庇"],["管仲","齊國宰相，最懂他的朋友是鮑叔牙"],["宮之奇","虞國大臣，勸國君不要借路給晉國"]]},"stops":[{"id":"e38_02","yr":"西元前 720 年","place":"洛邑．周王宮","scene":"palace","music":"palace","cast":[["周平王",1.4,0.6],["鄭莊公",-6.5,1.2],["王子狐",2.8,1.6],["公子忽",-7.2,0.2],["祭足",7,1.2],["鄭兵",7.6,0.2],["鄭兵",7.8,2]],"beats":[{"t":"鄭莊公和他的父親，都在周朝當最大的官，幫周天子管理國家。","mv":[["鄭莊公",-1.1,0.6]]},{"t":"可是周平王想把一部分權力，分給另一位大臣虢公。鄭莊公知道了，很不高興。","fx":[["upset","鄭莊公"]]},{"who":"周平王","t":"沒有這回事！我怎麼會不信任你呢？","fx":[["say","周平王"]]},{"t":"為了表示互相信任，周朝的王子狐到鄭國當人質，鄭國的公子忽也到周朝當人質。","mv":[["王子狐",-6.8,-0.4],["公子忽",0.4,1.6]]},{"t":"沒多久，周平王過世了。那年四月，鄭國大夫祭足帶兵，把周朝田裡的麥子割走了。","mv":[["周平王",7.5,-1],["祭足",1.6,0.2],["鄭兵",2.6,-0.6],["鄭兵#2",3.2,1]],"fx":[["cheerAll","鄭兵"]]},{"t":"秋天，鄭國又割走了成周的稻穀。周和鄭從此翻臉，誰也不信誰。","fx":[["sad","公子忽"]]}],"q":"《左傳》裡的君子評論：「信不由中，質無益也。」意思是：嘴上說的話不是從心裡發出來的，交換人質也沒有用。哪個成語形容說話不是出自真心？","wrong":[{"w":"一言九鼎","by":"鄭莊公","line":"一言九鼎是說話很有分量、算數。我們兩邊說的話，後來都不算數啦！"},{"w":"言聽計從","by":"祭足","line":"言聽計從是什麼話都聽。我家主公要是那麼聽話，就不會來割麥子了！"},{"w":"口是心非","by":"公子忽","line":"口是心非也是嘴上一套、心裡一套，意思很接近！不過君子說的「中」就是內心，有一個更貼切的成語。"}],"hint":"原文的「中」，就是「衷」，指內心。","after":"君子說：只要真心誠意，就算是路邊的野菜、溪裡的水，也可以拿來祭祀神明，何必交換人質呢？","lesson":{"title":"周鄭交惡","text":"天子和諸侯交換人質，就像把天子當成普通諸侯，周天子的面子掃地。十幾年後，周桓王帶兵攻打鄭國，打了敗仗，還被鄭國的將軍射中肩膀。從此，諸侯越來越不把天子放在眼裡。","next":"周天子管不動諸侯，各國也開始亂了起來。衛國就有人害死國君，自己坐上了王位……"}},{"id":"e22_06","yr":"西元前 719 年","place":"衛國．石碏家","scene":"house","music":"night","cast":[["石碏",-1.2,0.4],["石厚",6.5,1.2],["州吁",7.2,0.2]],"beats":[{"t":"衛國的公子州吁很愛打仗、脾氣又壞。老臣石碏早就勸過，也叫兒子石厚別跟他來往，石厚卻不聽。"},{"t":"西元前 719 年春天，州吁害死了哥哥衛桓公，自己當上國君。石厚是他的好幫手。","mv":[["州吁",1.6,-0.6],["石厚",1.4,0.8]],"fx":[["cheer","州吁"]]},{"who":"州吁","t":"百姓都不服我，怎樣才能坐穩位子？","fx":[["upset","州吁"]]},{"who":"石厚","t":"爹，您最有辦法，快教教我們！"},{"who":"石碏","t":"去朝見周天子，得到天子承認就行了。陳桓公很受天子寵愛，你們先去拜託陳國吧。","fx":[["say","石碏"]]},{"t":"石厚陪著州吁去了陳國。石碏卻暗中派人告訴陳國：「我老了，沒有力氣了。這兩個人害死了我們的國君，請幫忙抓住他們！」","mv":[["州吁",7.5,-0.4],["石厚",7.5,1.4]]},{"t":"陳國真的把兩人抓起來，請衛國派人來處置。可是，其中一個是石碏的親生兒子啊！","fx":[["focus","石碏"],["sad","石碏"]]}],"q":"衛國派人處置了州吁，石碏也派人處置了自己的兒子石厚。君子稱讚石碏：為了國家的正義，連犯罪的親人也不包庇。這叫做什麼？","wrong":[{"w":"父慈子孝","by":"石碏","line":"父慈子孝是父親慈愛、兒子孝順。我這個兒子不聽勸，還幫壞人做壞事啊！"},{"w":"認賊作父","by":"石碏","line":"認賊作父是把壞人當成父親。說到這個，石厚跟著州吁，還真有點像……不過答案不是這個！"},{"w":"鐵面無私","by":"石碏","line":"鐵面無私是公正、不講情面，意思很接近！不過我是對自己的親人也不包庇，有一個更專門的成語。"}],"hint":"「義」是正義，「親」是親人。","after":"君子說：「石碏是真正的忠臣。他痛恨州吁，連參與的兒子也不放過。」","lesson":{"title":"州吁之亂","text":"州吁是《春秋》這本史書裡，第一個被記載害死國君、搶走位子的人。可是他只當了半年多國君就失敗了。衛國的人從邢國迎回公子晉，就是衛宣公。","next":"其實在州吁出事之前，魯國的國君就問過大臣：州吁能成功嗎？"}},{"id":"e39_08","yr":"西元前 719 年","place":"魯國朝廷","scene":"office","music":"palace","cast":[["魯隱公",1.4,0.6],["眾仲",-6.5,1.2],["官員",2.6,-0.6,0,1]],"beats":[{"t":"州吁搶了國君的位子，百姓不服他。他想打一場勝仗讓大家佩服，就聯合宋、陳、蔡三國，一起攻打鄭國。"},{"t":"四國大軍把鄭國的東門圍了五天才回去。消息傳到魯國。","fx":[["upset","魯隱公"]]},{"t":"魯隱公把大臣眾仲找來。","mv":[["眾仲",-1.1,0.6]]},{"who":"魯隱公","t":"你看，衛國的州吁會成功嗎？"},{"who":"眾仲","t":"我只聽說用品德讓人民和睦，沒聽說用動亂的。用動亂，就像整理絲線卻越弄越亂。","fx":[["say","眾仲"]]},{"who":"眾仲","t":"州吁仗著兵力，大家不會支持他；他心狠殘忍，親人也不會親近他。","fx":[["focus","眾仲"]]}],"q":"眾仲說：州吁靠武力，民眾會背叛他；他太殘忍，親人也會離開他，這樣很難成功。形容不得人心、非常孤立，是哪個成語？","wrong":[{"w":"眾志成城","by":"魯隱公","line":"眾志成城是大家同心，像城牆一樣堅固。州吁身邊的人，可是一個一個離開他！"},{"w":"眾望所歸","by":"官員","line":"眾望所歸是大家都支持、期待他。州吁剛好相反，大家都不服他。"},{"w":"孤立無援","by":"眾仲","line":"孤立無援是孤單沒人幫，意思很接近！不過我強調的是「民眾背叛、親人離開」，有一個更貼切的成語。"}],"hint":"「眾」是民眾，「親」是親人。","after":"眾仲又說：「用兵就像玩火，不收斂的話，會燒到自己。」那年秋天，州吁果然在陳國被抓了。","lesson":{"title":"玩火自焚","text":"眾仲說的「兵猶火也，弗戢，將自焚也」，後來變成成語「玩火自焚」，比喻做壞事的人，最後害到自己。一段話就留下兩個成語，眾仲真厲害！","next":"在這段時間，鄭國越來越強。鄭莊公曾經想和鄰居陳國和好，陳國的國君卻不領情……"}},{"id":"e39_02","yr":"西元前 717 年","place":"陳國王宮","scene":"palace","music":"palace","cast":[["陳桓公",1.4,0.6],["五父",-0.6,1.2],["鄭國使者",-6.5,1.2],["鄭兵",7,0.2],["鄭兵",7.4,1.4],["鄭兵",7.8,2.2]],"beats":[{"t":"鄭國派使者來到陳國，希望兩國和好。","mv":[["鄭國使者",-1.6,0.2]]},{"who":"鄭國使者","t":"鄭、陳是鄰居，我們做好朋友吧！"},{"who":"陳桓公","t":"宋國、衛國才是麻煩，鄭國能把我怎麼樣？不答應！","fx":[["upset","陳桓公"]]},{"who":"五父","t":"大王，親近仁德的人、和鄰居好好相處，是國家的寶貝啊！請答應鄭國吧！","fx":[["say","五父"]]},{"t":"陳桓公還是不答應，鄭國使者只好回去。","mv":[["鄭國使者",-7.5,0.6]]},{"t":"第二年五月，鄭莊公帶兵攻打陳國，陳國大敗，損失慘重。","mv":[["鄭兵",3,-0.4],["鄭兵#2",3.6,0.8],["鄭兵#3",2.4,1.8]],"fx":[["cheerAll","鄭兵"],["sad","陳桓公"]]}],"q":"君子評論：「好的不能錯過，壞的不能讓它長大。」又引用周任的話：治國除掉壞事，要像農夫除草，連根拔掉，讓它不能再長。比喻徹底除去禍根，是哪個成語？","wrong":[{"w":"拔苗助長","by":"五父","line":"拔苗助長是把禾苗拔高，結果害死它。我們要拔的是壞草，而且要連根拔掉！"},{"w":"草木皆兵","by":"陳桓公","line":"草木皆兵是嚇到看草和樹都像敵兵。我……我現在是有點怕鄭國啦，但答案不是這個！"},{"w":"防微杜漸","by":"五父","line":"防微杜漸是在壞事剛冒出來時就阻止，意思有點接近！不過周任說的是除草時連根都不留，有一個更貼切的成語。"}],"hint":"除草的時候，連什麼也要一起除掉？","after":"君子說：陳桓公放任壞事長大，不肯改過，等到災禍臨頭，想救也來不及了。","lesson":{"title":"鄭莊公小霸","text":"春秋初年，鄭莊公打敗周天子的軍隊，又常常打贏宋、衛、陳等國，歷史上有人稱他「小霸」。不過，鄭國的國土不大，莊公死後就慢慢衰弱了。","next":"這時候，南方的楚國正在快速擴張，一個接一個打敗身邊的小國……"}},{"id":"e39_04","yr":"西元前 700 年","place":"絞國城外","scene":"walls","music":"battle","cast":[["屈瑕",1.4,0.8],["楚武王",2.8,1.4],["楚兵",4.6,-0.4],["楚兵",5.4,0.6],["楚兵",-6.5,-0.8],["絞兵",-1.6,-2.7,1.3],["絞兵",0,-2.7,1.3],["絞兵",1.6,-2.7,1.3],["樵夫",-0.8,0.6],["樵夫",0.4,1.2]],"beats":[{"t":"西元前 700 年，楚武王攻打小小的絞國，軍隊駐紮在絞國的南門外。絞國人緊閉城門守城。"},{"who":"屈瑕","t":"絞國小，又很輕率，輕率的人就不會深思。請讓砍柴的人出去，不要派兵保護，引誘他們！","fx":[["say","屈瑕"]]},{"who":"楚武王","t":"好，就照你說的做！"},{"t":"絞國人看見楚國的樵夫沒人保護，衝出城抓走了三十個人。","mv":[["絞兵",-0.6,0.2,0],["樵夫",-7.5,-1.6],["樵夫#2",-7.5,-0.4]],"fx":[["cheerAll","絞兵"]]},{"t":"第二天，絞國人搶著出城，追著砍柴的人跑進山裡。楚軍早就埋伏在山下，又派兵守住北門。","mv":[["絞兵#2",-3.6,-0.8,0],["絞兵#3",-4.4,0.2,0],["絞兵",-5,-1.4,0],["楚兵#3",-1.4,-1.6]]},{"t":"伏兵一起殺出，絞國大敗，楚軍一路打到城牆下。","mv":[["楚兵",-2,0.2],["楚兵#2",-0.8,-0.6]],"fx":[["sadAll","絞兵"],["cheer","屈瑕"]]}],"q":"絞國打輸了，楚軍就在城牆下面。絞國沒有辦法，只好被迫答應楚國的條件，在城下和楚國訂了盟約。後來比喻被迫簽訂的屈辱條約，叫做什麼？","wrong":[{"w":"海誓山盟","by":"楚武王","line":"海誓山盟是情人發誓永遠相愛。絞國跟我們可沒有那麼甜蜜！"},{"w":"歃血為盟","by":"屈瑕","line":"歃血為盟是古代訂盟約的儀式，可是沒有說是被迫的。我們這次是打到人家城下，讓他們不得不答應！"},{"w":"喪權辱國","by":"楚武王","line":"喪權辱國是失去主權、讓國家受辱，意思有點接近！不過「在城下被迫訂盟約」，有一個更專門的成語。"}],"hint":"盟約是在什麼地方訂的？","after":"楚軍訂好盟約就回國了。屈瑕立了大功，變得很驕傲。","lesson":{"title":"楚國崛起","text":"楚國原本被中原國家看不起，楚武王卻自稱「王」，和周天子平起平坐。第二年，屈瑕帶兵攻打羅國，驕傲輕敵，結果大敗，屈瑕也羞愧而死。一場勝仗後的驕傲，害了自己。","next":"就在楚國擴張的時候，東方的齊國也發生了一場爭奪王位的大戰……"}},{"id":"e10_01","yr":"西元前 685 年","place":"齊國臨淄","scene":"palace","music":"palace","cast":[["齊桓公",1.4,0.6],["鮑叔牙",-1.1,0.8],["管仲",-6.5,1.2,0,1,1]],"beats":[{"t":"齊國內亂，公子小白和公子糾搶著回國當國君。鮑叔牙輔佐小白，管仲輔佐公子糾。"},{"t":"管仲為了阻止小白，曾經射了他一箭，剛好射中衣帶上的鉤子。最後小白搶先回國，當上國君，就是齊桓公。","fx":[["focus","齊桓公"]]},{"who":"齊桓公","t":"管仲差點射死我！鮑叔牙，你來當宰相吧！","fx":[["upset","齊桓公"]]},{"who":"鮑叔牙","t":"大王只想治理齊國，有我就夠了；如果想稱霸天下，非用管仲不可！","fx":[["say","鮑叔牙"]]},{"t":"年輕時兩人一起做生意，管仲多拿錢，鮑叔牙知道他家裡窮；管仲打仗三次逃跑，鮑叔牙知道他家有老母要照顧。"},{"t":"齊桓公聽從鮑叔牙，請管仲來當宰相。","mv":[["管仲",-0.2,1.6]],"fx":[["cheer","鮑叔牙"]]},{"who":"管仲","t":"生我的是父母，了解我的是鮑叔啊！","fx":[["focus","管仲"]]}],"q":"鮑叔牙了解管仲、信任管仲，還把宰相的位子讓給他。後來比喻朋友之間彼此了解、互相信任的深厚友情，叫做什麼？","wrong":[{"w":"酒肉朋友","by":"齊桓公","line":"酒肉朋友是只會一起吃喝玩樂的朋友。他們倆可是在最困難的時候互相扶持！"},{"w":"狐朋狗友","by":"鮑叔牙","line":"狐朋狗友是不正經的壞朋友。管仲是天下奇才，我可是很驕傲有這個朋友！"},{"w":"莫逆之交","by":"管仲","line":"莫逆之交是心意相通的好朋友，意思很接近！不過我和鮑叔的故事，有一個專門用我們名字的成語。"}],"hint":"成語裡藏著兩個人的姓。","after":"管仲當上宰相，齊國越來越富強。後來的人說：天下人不太稱讚管仲的才能，反而更稱讚鮑叔牙懂得看人。","lesson":{"title":"齊桓公稱霸","text":"管仲改革齊國，發展經濟、整頓軍隊，讓齊國很快強大起來。齊桓公打著「尊王攘夷」的旗號，幫助小國抵抗外族，成為春秋第一位霸主。","next":"齊國稱霸的時候，南方的楚國卻陷入了危機……"}},{"id":"e39_06","yr":"西元前 664 年","place":"楚國郢都","scene":"palace","music":"night","cast":[["子元",1.2,0.4],["鬬射師",-6.5,1.2],["楚兵",3,-0.4],["楚兵",3.6,1],["子文",7,1.2]],"beats":[{"t":"楚成王年紀還小，他的叔叔公子元掌握大權。公子元攻打鄭國回來，竟然住進了王宮。","fx":[["cheer","子元"]]},{"t":"大臣鬬射師趕來勸他。","mv":[["鬬射師",-1.1,0.6]]},{"who":"鬬射師","t":"王宮是國君住的地方，您住在這裡，不合規矩啊！"},{"who":"子元","t":"囉嗦！來人，把他綁起來！","fx":[["upset","子元"]],"mv":[["楚兵",-0.2,0.2],["楚兵#2",-0.4,1.4]]},{"t":"那年秋天，申公鬬班除掉了公子元。楚國經過這場動亂，國家陷入困難。","mv":[["子元",7.5,-1],["楚兵",7.5,-0.4],["楚兵#2",7.8,0.6]]},{"t":"這時候，鬬穀於菟當上了令尹，也就是楚國的宰相。大家都叫他「子文」。","mv":[["子文",1.4,0.6]]},{"who":"子文","t":"國家有難，我家裡的錢財，全部拿出來吧！","fx":[["focus","子文"],["say","子文"]]}],"q":"子文把自己家的財產全部捐出來，幫助楚國度過危機。這種捐出家產、解救國家危難的行為，叫做什麼？","wrong":[{"w":"家徒四壁","by":"鬬射師","line":"家徒四壁是窮到家裡只剩牆壁。子文大人是自己把家產捐出去的，不是本來就窮！"},{"w":"成家立業","by":"子文","line":"成家立業是結婚、建立事業。我現在是把家產拿出來救國家呢！"},{"w":"傾家蕩產","by":"鬬射師","line":"傾家蕩產也是失去全部家產，可是常用在亂花錢、敗光家產。子文大人是為了國家，有一個更好的成語！"}],"hint":"「紓」是解除，「難」是災難。","after":"子文當令尹很清廉。孔子稱讚他：三次當上令尹，沒有高興的樣子；三次被免職，也沒有生氣的樣子。","lesson":{"title":"老虎餵大的宰相","text":"「穀」是楚國話的「餵奶」，「於菟」是「老虎」。傳說子文剛出生時被丟在野外，有老虎餵他奶，所以叫「鬬穀於菟」。這是《左傳》記下的傳說。在他的治理下，楚國重新穩定下來。","next":"這時候，北方的晉國想要吞掉身邊的兩個小國：虞國和虢國……"}},{"id":"e12_06","yr":"西元前 655 年","place":"虞國王宮","scene":"palace","music":"palace","winSad":"虞公","cast":[["虞公",1.4,0.6],["宮之奇",-0.8,1.2],["晉國使者",-6.5,1.2]],"beats":[{"t":"幾年前，晉獻公送給虞公寶玉和好馬，向虞國借路去打虢國。這一次，晉國又來借路了。","mv":[["晉國使者",-1.8,0.2]]},{"who":"晉國使者","t":"我們要再去攻打虢國，請再借一條路給我們吧！"},{"who":"宮之奇","t":"大王，不行！虢國就像虞國外面的一層保護，虢國滅了，虞國也會跟著滅亡！","fx":[["upset","宮之奇"]]},{"who":"宮之奇","t":"俗話說：「輔車相依。」臉頰和牙床互相依靠，虞和虢就是這種關係啊！","fx":[["focus","宮之奇"]]},{"who":"虞公","t":"晉國和我們是同一個祖先，怎麼會害我們呢？","fx":[["say","虞公"]]},{"t":"宮之奇怎麼勸，虞公都不聽，還是答應借路給晉國。","mv":[["晉國使者",-7.5,0.6]],"fx":[["sad","宮之奇"]]}],"q":"宮之奇用一句俗話提醒虞公：嘴脣如果沒了，牙齒就會覺得冷。比喻彼此關係密切、一方滅亡另一方也危險，是哪個成語？","wrong":[{"w":"唇槍舌劍","by":"晉國使者","line":"唇槍舌劍是吵架吵得很激烈。宮之奇大人再怎麼吵，虞公也沒聽進去呀！"},{"w":"咬牙切齒","by":"虞公","line":"咬牙切齒是非常生氣。宮之奇說的是牙齒會冷，不是牙齒咬得緊！"},{"w":"唇齒相依","by":"宮之奇","line":"唇齒相依是關係密切、互相依靠，意思很接近！不過我強調的是：嘴脣一沒有，牙齒馬上就遭殃，有一個更貼切的成語。"}],"hint":"嘴脣沒了，牙齒會怎麼樣？","after":"宮之奇帶著家人離開虞國。那年冬天，晉國滅了虢國，回程時住在虞國，順手把虞國也滅了，虞公被抓走。","lesson":{"title":"假途滅虢","text":"晉國借路去打虢國，回頭又滅了虞國，這就是成語「假途滅虢」的由來，《三十六計》裡也有「假道伐虢」這一計。晉獻公一路吞併小國，讓晉國成為北方的強國。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第一章．周室衰微","eps":[10,12,22,38,39]},{"key":"h02","line":"history","name":"晉文稱霸","short":"晉文公時代","era":"西元前 645–627 年","color":"#4E79B8","map":{"ground":"#a8c47a","river":"#4f9fd8"},"intro":{"lines":["晉獻公死後，晉國的公子們搶著當國君，晉國亂成一團。","公子夷吾靠秦國幫忙當上國君，就是晉惠公；他的哥哥重耳卻在外面流亡了十九年。","重耳回國當上晉文公，在城濮打敗強大的楚國，成為新的霸主。","晉文公死後，西邊的秦國想趁機往東擴張，偷偷出兵攻打鄭國。","這一章，我們跟著晉國的起起落落，看晉文公怎麼稱霸！"],"people":[["晉惠公","名叫夷吾，常常說話不算話"],["晉文公","名叫重耳，流亡十九年才回國"],["子玉","楚國令尹，勇猛卻很驕傲"],["弦高","鄭國商人，機智救了國家"]]},"stops":[{"id":"e13_07","yr":"西元前 645 年","place":"韓原","scene":"road","music":"battle","winSad":"晉惠公","cast":[["晉惠公",1.2,0.4],["慶鄭",-6.5,1.2],["晉兵",2.8,-0.6],["晉兵",3.4,0.8]],"beats":[{"t":"晉惠公靠秦國幫忙才當上國君，卻答應給秦國的土地不給。晉國鬧饑荒，秦國送來糧食；秦國鬧饑荒，晉國卻一粒米也不給。"},{"t":"西元前 645 年，秦穆公帶兵攻打晉國，兩軍在韓原相遇。","fx":[["cheerAll","晉兵"]]},{"who":"晉惠公","t":"就用鄭國送來的小馬拉我的戰車！看牠們多神氣！","fx":[["cheer","晉惠公"]]},{"t":"大臣慶鄭急忙趕來勸阻。","mv":[["慶鄭",-1.1,0.6]]},{"who":"慶鄭","t":"古時候打仗，一定用本國的馬。牠們熟悉水土、聽得懂主人的命令，到哪裡都不會亂。","fx":[["say","慶鄭"]]},{"who":"慶鄭","t":"外國的馬一害怕就會發狂，血脈暴漲，看起來很強壯，其實裡面早就沒力氣了！到時候進退都不行，您一定會後悔！","fx":[["upset","慶鄭"]]},{"who":"晉惠公","t":"少囉嗦！就用這幾匹！","fx":[["focus","晉惠公"]]}],"q":"慶鄭說：這種馬外表看起來強壯，其實裡面虛弱、沒有力氣。後來形容外表強大、內部空虛，是哪個成語？","wrong":[{"w":"身強體壯","by":"晉惠公","line":"身強體壯是真的很強壯。慶鄭說的是：這些馬只是看起來強壯而已！"},{"w":"老當益壯","by":"慶鄭","line":"老當益壯是年紀大了更有精神。這幾匹馬可不老，問題是一緊張就沒力了！"},{"w":"色厲內荏","by":"慶鄭","line":"色厲內荏是外表兇、心裡膽小，意思很接近！不過我說的是外表強壯、裡面空虛，有一個更貼切的成語。"}],"hint":"「乾」讀ㄍㄢ，是枯竭、空虛的意思。","after":"開戰後，戰車的馬果然陷在泥巴裡動不了。晉惠公叫慶鄭來救，慶鄭說：「不聽勸告，這是自找的！」晉惠公就被秦軍抓走了。","lesson":{"title":"韓原之戰","text":"秦穆公把晉惠公抓回秦國。秦穆公的夫人是晉國的公主，她替晉惠公求情，秦穆公才放晉惠公回國。晉國割了河西的土地給秦國，還把太子送到秦國當人質。","next":"晉惠公的哥哥重耳，這時候正在北方的狄國過日子……"}},{"id":"e38_05","yr":"西元前 644 年","place":"狄國","scene":"house","music":"night","cast":[["重耳",-0.6,0.4],["季隗",1.4,0.2],["狐偃",-6.5,1.2],["趙衰",-7.2,0.2]],"beats":[{"t":"十二年前，晉國發生內亂，晉獻公派兵攻打重耳住的蒲城。重耳只好逃到北方的狄國。","mv":[["狐偃",-1.4,1.4],["趙衰",0.2,1.6]]},{"t":"跟著他的，有舅舅狐偃、大臣趙衰等人，個個都是人才。"},{"t":"狄人打仗抓到兩位姑娘，叔隗和季隗，送給重耳。重耳娶了季隗，把叔隗嫁給趙衰。","fx":[["cheer","季隗"]]},{"t":"重耳在狄國一住就是十二年。這一年，他決定動身前往東方的齊國。","fx":[["focus","重耳"]]},{"who":"重耳","t":"妳等我二十五年。如果二十五年我還沒回來，妳再改嫁吧。","fx":[["say","重耳"]]},{"who":"季隗","t":"我已經二十五歲了。如果再等二十五年才改嫁，那時候……","fx":[["sad","季隗"]]}],"q":"季隗說：「再等二十五年，我就快要進棺材了。我願意一直等你。」「木」是指棺木。後來形容年紀很大、壽命快要結束，是哪個成語？","wrong":[{"w":"白頭偕老","by":"重耳","line":"白頭偕老是夫妻一起活到老，這是我的心願！不過季隗說的是：再等下去她就老得快進棺木了。"},{"w":"青春永駐","by":"狐偃","line":"青春永駐是永遠年輕。季隗夫人擔心的剛好相反，是等到年老啊！"},{"w":"風燭殘年","by":"季隗","line":"風燭殘年是像風中的蠟燭，比喻晚年，意思很接近！不過我說的是「快要進棺木」，有一個更貼切的成語。"}],"hint":"「木」是棺木，「就」是靠近。","after":"季隗說：「我會一直等你。」重耳就帶著隨從離開了。據《史記》記載，晉惠公還派人到狄國想殺重耳。","lesson":{"title":"重耳流亡","text":"重耳一共流亡了十九年，走過狄、衛、齊、曹、宋、鄭、楚、秦等國家。後來他回到晉國當上國君，狄人也把季隗送回他的身邊。趙衰和叔隗生的兒子，就是後來晉國的大臣趙盾。","next":"重耳回國成為晉文公。西元前 632 年，晉國和楚國的大戰一觸即發……"}},{"id":"e21_06","yr":"西元前 632 年","place":"晉軍大帳","scene":"tent","music":"battle","table":true,"cast":[["晉文公",0.2,0.4],["舅犯",-1.6,1.0],["雍季",6.5,1.2]],"beats":[{"t":"晉國和楚國就要開戰了。楚軍人多，晉軍人少。晉文公很煩惱，找來舅舅狐偃商量，大家叫他「舅犯」。","fx":[["sad","晉文公"]]},{"who":"晉文公","t":"楚軍多，我們少，該怎麼辦才好？"},{"who":"舅犯","t":"講究禮節的君子，忠誠信用不嫌多；可是在戰場上，騙敵人的計謀也不嫌多。您就用計騙他們吧！","fx":[["say","舅犯"]]},{"t":"晉文公又把雍季找來，問他的意見。","mv":[["雍季",1.6,0.8]]},{"who":"雍季","t":"放火燒樹林來打獵，一下子能抓很多野獸，以後就沒有野獸了。用欺騙對待百姓，只能得到一時的好處，以後就沒用了。","fx":[["focus","雍季"]]},{"who":"晉文公","t":"嗯……這一仗，就用舅犯的計謀！","fx":[["cheer","晉文公"]]}],"q":"舅犯說：在戰場上，騙敵人的計謀用再多也不嫌多。後來說用兵作戰時，可以用計謀迷惑敵人，是哪個成語？","wrong":[{"w":"童叟無欺","by":"雍季","line":"童叟無欺是做生意不騙老人小孩。我是說對百姓要誠信，可是舅犯說的是戰場上要用計！"},{"w":"光明磊落","by":"舅犯","line":"光明磊落是坦白正直、不耍心機。在戰場上太老實，可是會吃大虧的！"},{"w":"出奇制勝","by":"晉文公","line":"出奇制勝是用奇特的方法打勝仗，意思很接近！不過舅犯強調的是「騙敵人不嫌多」，有一個更貼切的成語。"}],"hint":"「厭」是嫌棄，「詐」是欺騙。","after":"《左傳》記載，城濮之戰時，晉軍把馬披上虎皮衝向敵人；又讓戰車拖著樹枝揚起灰塵，假裝逃跑，引楚軍來追。","lesson":{"title":"先賞雍季","text":"打了勝仗，晉文公論功行賞，卻先賞雍季，再賞舅犯。他說：「舅犯的話，是一時的辦法；雍季的話，是百世的利益。」孔子聽了，稱讚晉文公能當霸主是應該的。這個故事記在《韓非子》。","next":"城濮之戰晉軍大勝，可是晉文公卻一點也高興不起來……"}},{"id":"e28_03","yr":"西元前 632 年","place":"城濮．楚軍舊營","scene":"night","music":"night","cast":[["晉文公",-0.4,0.4],["大臣",1.6,0.8],["晉兵",-1.8,-1.4],["晉兵",1.8,-1.6],["晉兵",2.8,-0.6]],"beats":[{"t":"城濮之戰，晉軍打敗了楚軍。楚軍逃走時，留下了大批糧食。"},{"t":"晉軍住進楚軍的營地，吃楚軍的糧食，一連吃了三天。","fx":[["cheerAll","晉兵"]]},{"t":"大家都很開心，只有晉文公愁眉苦臉。","fx":[["sad","晉文公"],["focus","晉文公"]]},{"who":"大臣","t":"主公，打了勝仗還發愁，難道要等遇到傷心事才高興嗎？","fx":[["say","大臣"]]},{"who":"晉文公","t":"楚國的令尹子玉還活著，我的憂愁還沒結束啊！"},{"who":"晉文公","t":"被困住的野獸，都還會拚命反抗，何況是一國的宰相呢？","fx":[["upset","晉文公"]]}],"q":"晉文公擔心：子玉雖然打了敗仗，被逼到絕境時一定還會拚命反擊。比喻在絕境中仍然奮力抵抗，是哪個成語？","wrong":[{"w":"如虎添翼","by":"大臣","line":"如虎添翼是老虎長了翅膀，更加厲害。子玉剛打輸，現在比較像被困住的野獸！"},{"w":"坐以待斃","by":"晉文公","line":"坐以待斃是坐著等死。我擔心的剛好相反：子玉被逼急了，一定會拚命！"},{"w":"背水一戰","by":"大臣","line":"背水一戰是故意不留退路來拚命，意思有點接近！不過主公說的是「被困的野獸還會搏鬥」，有一個更貼切的成語。"}],"hint":"被困住的野獸，會怎麼做？","after":"後來楚成王責怪子玉，子玉在回國的路上死了。晉文公這才露出笑容：「再也沒有人能威脅我了！」","lesson":{"title":"這句話救了一個人","text":"三十多年後，晉國大將荀林父打了敗仗，晉景公想處死他。大臣士貞子就說了晉文公這段故事，勸景公：殺掉自己的大將，只會讓敵人高興。景公就饒了荀林父。","next":"子玉為什麼會打這場敗仗？讓我們回到大戰之前，看看楚成王曾經怎麼勸他……"}},{"id":"e28_07","yr":"西元前 632 年","place":"楚國申邑","scene":"office","music":"palace","cast":[["楚成王",0.2,0.4],["申叔",1.8,1.0],["伯棼",-6.5,1.2]],"beats":[{"t":"城濮之戰前，楚軍正在圍攻宋國。晉文公為了救宋國，出兵攻打楚國的盟友曹國和衛國。"},{"t":"楚成王退回申邑，派人送命令給前線的子玉：撤離宋國，不要和晉軍交戰！","fx":[["say","楚成王"]]},{"who":"楚成王","t":"晉侯在外流亡十九年，終於得到晉國。什麼艱難危險他都嘗過，百姓的真心假意他都知道。","fx":[["focus","楚成王"]]},{"who":"申叔","t":"大王說得對，這樣的人很難對付。"},{"t":"這時，子玉派部下伯棼趕來了。","mv":[["伯棼",-1.1,0.6]]},{"who":"伯棼","t":"子玉將軍說：不敢說一定能打贏，只是想讓那些說他壞話的人閉嘴！請讓他出戰！","fx":[["upset","楚成王"]]}],"q":"楚成王引用兵書《軍志》：「情況適當就回來」、「知道有困難就該退兵」、「有德的人不能和他為敵」。比喻遇到困難就懂得適時退讓，是哪個成語？","wrong":[{"w":"勇往直前","by":"伯棼","line":"勇往直前是勇敢地一直往前衝，這是子玉將軍想做的！可是大王的意思剛好相反。"},{"w":"一往無前","by":"申叔","line":"一往無前是什麼都擋不住地前進。大王是叫子玉撤退，不是前進啊！"},{"w":"急流勇退","by":"楚成王","line":"急流勇退是在最得意的時候及時引退。我說的是看清局勢困難就退兵，有一個更貼切的成語。"}],"hint":"遇到「難」的時候，就怎麼做？","after":"楚成王很生氣，只給子玉很少的兵馬。子玉還是執意和晉軍決戰。","lesson":{"title":"城濮之戰","text":"子玉不聽勸，在城濮大敗。戰後，晉文公在踐土和諸侯會盟，周天子正式封他為諸侯的領袖。晉文公成為齊桓公之後的又一位霸主。","next":"晉文公很重視人才。有一天，他的大臣臼季在鄉下的田邊，看到了很特別的一幕……"}},{"id":"e11_06","yr":"約西元前 630 年","place":"晉國冀地．田邊","scene":"road","music":"map","cast":[["冀缺",0.6,-0.4],["冀缺妻",6.5,1.0],["臼季",-6.5,1.2]],"beats":[{"t":"晉國大臣臼季出使，路過冀地。他看見一個農夫，正在田裡認真除草。","mv":[["臼季",-1.4,0.8]]},{"t":"這個農夫叫冀缺。他的父親曾經想謀害晉文公，失敗被處死，冀缺只好回鄉下種田。","fx":[["focus","冀缺"]]},{"t":"中午，冀缺的妻子送飯到田裡來。","mv":[["冀缺妻",1.6,0.2]]},{"who":"冀缺妻","t":"夫君辛苦了，請用飯。","fx":[["say","冀缺妻"]]},{"who":"冀缺","t":"謝謝妳，有勞妳了。","fx":[["say","冀缺"]]},{"t":"兩人恭恭敬敬，互相尊重，就像在招待客人一樣。","fx":[["cheer","冀缺妻"]]},{"who":"臼季","t":"能夠尊敬別人的人，一定有好品德！"}],"q":"冀缺和妻子在田邊吃飯，彼此尊重，就像對待客人一樣。後來形容夫妻互相尊重、相處融洽，是哪個成語？","wrong":[{"w":"同床異夢","by":"冀缺妻","line":"同床異夢是在一起卻各想各的。我們夫妻感情可好了！"},{"w":"門當戶對","by":"冀缺","line":"門當戶對是兩家身分地位差不多。我家現在只是普通農家，跟這個沒關係啦！"},{"w":"舉案齊眉","by":"臼季","line":"舉案齊眉也是夫妻互相尊敬，意思很接近！不過那是幾百年後東漢梁鴻夫妻的故事，冀缺夫妻有自己的成語。"}],"hint":"「賓」是客人。","after":"臼季把冀缺帶回去推薦給晉文公。文公說他父親有罪，臼季說：「舜處罰了鯀，卻重用鯀的兒子禹。」文公就讓冀缺當了下軍大夫。","lesson":{"title":"冀缺立功","text":"臼季對文公說：「尊敬是品德的集合，能尊敬人的人一定有德。」冀缺後來在戰場上抓住了白狄的國君，立下大功，最後還當上晉國最高的執政大臣。","next":"西元前 628 年，晉文公過世了。西邊的秦國看準機會，想偷偷攻打鄭國……"}},{"id":"e39_05","yr":"西元前 627 年","place":"鄭國．秦人客館","scene":"house","music":"night","winSad":"杞子","cast":[["杞子",0.4,0.2],["秦兵",-1.4,-0.6],["秦兵",1.8,-0.8],["鄭國官員",-6.5,1.2]],"beats":[{"t":"秦國有一批軍隊駐守在鄭國，帶頭的叫杞子。他偷偷送信給秦穆公：「鄭國人讓我管北門的鑰匙，快派兵來偷襲！」","fx":[["cheer","杞子"]]},{"t":"秦軍出發了。西元前 627 年春天，秦軍走到滑國，遇到一位要去周朝做生意的鄭國商人，叫弦高。"},{"t":"弦高靈機一動，牽出十二頭牛送給秦軍，說：「我們國君聽說你們要經過鄭國，派我來慰勞大家。」一邊偷偷派人飛快回鄭國報信。"},{"t":"鄭穆公接到消息，馬上派官員到秦人住的客館察看。","mv":[["鄭國官員",-1.4,1.0]]},{"t":"只見秦國人把行李綁好了，兵器磨得亮晶晶，馬也餵得飽飽的。","fx":[["cheerAll","秦兵"],["focus","秦兵"]]},{"who":"杞子","t":"大軍就快到了，北門一開，鄭國就是我們的！"},{"who":"鄭國官員","t":"果然是要打仗了……","fx":[["upset","鄭國官員"]]}],"q":"鄭國官員看到秦國人磨亮兵器、餵飽戰馬，準備開戰。後來比喻做好作戰或事前的準備工作，是哪個成語？","wrong":[{"w":"兵荒馬亂","by":"杞子","line":"兵荒馬亂是戰爭時到處亂糟糟。我們可是準備得整整齊齊，一點也不亂！"},{"w":"馬放南山","by":"秦兵","line":"馬放南山是把戰馬放到山上，表示不再打仗。我們正在餵馬準備打仗呢！"},{"w":"枕戈待旦","by":"鄭國官員","line":"枕戈待旦是枕著兵器等天亮，形容隨時準備作戰，意思很接近！不過「磨兵器、餵馬」，有一個更貼切的成語。"}],"hint":"「厲」是磨，「秣」是餵牲口。","after":"鄭穆公派皇武子客氣地對杞子說：「各位住很久了，糧食也吃光了吧？要走就請便。」杞子知道計謀被識破，趕緊逃走了。","lesson":{"title":"弦高犒師","text":"秦軍將領孟明聽說鄭國有了準備，只好滅了滑國回去。回程經過殽山時，晉軍埋伏在山谷裡，秦軍全軍覆沒，三位將軍都被抓了。一個商人的機智，救了整個鄭國。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第二章．晉文稱霸","eps":[11,13,21,28,38,39]},{"key":"h03","line":"history","name":"晉楚爭霸","short":"春秋中期","era":"西元前 622–594 年","color":"#C8642E","map":{"ground":"#b0c47a","river":"#4f9fd8"},"intro":{"lines":["晉文公過世後，晉國由大臣趙盾等人執政，仍然是北方的霸主。","南方的楚國也越來越強，楚莊王即位後，一心要和晉國爭奪霸主的位子。","鄭國、宋國這些夾在中間的國家，一下子跟晉國，一下子跟楚國，日子很不好過。","西元前 597 年，晉楚兩軍在邲大戰，楚國大勝，楚莊王成為新的霸主。","這一章，我們看晉楚兩大國怎麼爭霸，小國又怎麼求生存！"],"people":[["趙盾","晉國執政大臣，趙衰的兒子"],["華元","宋國大將，被自己的車夫害慘了"],["孫叔敖","楚國令尹，治國又會打仗"],["楚莊王","楚國國君，在邲打敗晉國"]]},"stops":[{"id":"e28_01","yr":"西元前 622 年","place":"晉國甯邑．甯嬴家","scene":"house","music":"palace","cast":[["甯嬴",-6.5,1.2],["甯嬴妻",1.2,0.2]],"beats":[{"t":"晉國大夫陽處父出使衛國，回程住在甯邑。管理旅舍的甯嬴看他很有派頭，決定跟著他去做一番事業。"},{"t":"可是才走到溫地，甯嬴就自己回家了。","mv":[["甯嬴",-1.1,0.6]]},{"who":"甯嬴妻","t":"你不是要跟著大人去做大事嗎？怎麼這麼快就回來了？","fx":[["upset","甯嬴妻"]]},{"who":"甯嬴","t":"他太剛硬了。《商書》說：性情深沉的人，要用剛強來調和；性情高明的人，要用柔和來調和。他卻只會剛強。","fx":[["say","甯嬴"]]},{"who":"甯嬴","t":"上天那麼剛強，都還不違背四季的變化，何況是人呢？"},{"who":"甯嬴","t":"而且他說得好聽、做得少，就像一棵樹只開漂亮的花，卻結不出果子……","fx":[["focus","甯嬴"]]}],"q":"甯嬴說：陽處父外表好看、說話動聽，裡面卻沒有真本事，就像只開花不結果的植物，會招來別人的怨恨。是哪個成語？","wrong":[{"w":"開花結果","by":"甯嬴妻","line":"開花結果是努力有了成果。可是你說他只開花、不結果呀！"},{"w":"錦上添花","by":"甯嬴","line":"錦上添花是好上加好。我說的是他只有好看的外表，裡面沒有東西。"},{"w":"虛有其表","by":"甯嬴妻","line":"虛有其表是只有外表好看，意思很接近！不過你說的是「只開花、不結果」，有一個更貼切的成語。"}],"hint":"「華」就是「花」，「實」是果實。","after":"甯嬴說：「這樣的人會招來怨恨，沒辦法保住自己。我怕得不到好處，反而被連累，所以就回來了。」","lesson":{"title":"陽處父的下場","text":"第二年，陽處父把晉國中軍主帥換成趙盾，得罪了原本的主帥賈季。不久，陽處父就被賈季派人殺害了，甯嬴果然看得很準。","next":"趙盾從此掌管晉國大權。幾年後，鄭國的國君來參加會盟，晉國的國君卻不肯見他……"}},{"id":"e38_03","yr":"西元前 610 年","place":"扈地．晉國大帳","scene":"office","music":"palace","cast":[["趙盾",1.4,0.6],["晉靈公",-0.2,-0.4],["鄭國使者",-6.5,1.2]],"beats":[{"t":"西元前 610 年，晉國在扈召集諸侯會盟。晉靈公懷疑鄭國偷偷投靠楚國，不肯接見鄭國的國君。","fx":[["upset","晉靈公"]]},{"who":"晉靈公","t":"鄭國腳踏兩條船，不見！"},{"t":"鄭國大臣子家寫了一封信，派使者送給晉國執政的趙盾。","mv":[["鄭國使者",-1.1,0.6]]},{"who":"鄭國使者","t":"這是子家大人的信，請趙大人過目。","fx":[["say","鄭國使者"]]},{"t":"信上一件一件列出：鄭國國君好幾次親自朝見晉國，從來不敢怠慢。","fx":[["focus","趙盾"]]},{"who":"趙盾","t":"信上還寫：「古人說：『怕頭又怕尾，身體還剩下哪裡不怕？』」"}],"q":"子家在信裡說：鄭國已經盡心侍奉晉國，如果晉國還要逼我們，我們再也不能「怕頭又怕尾」了。後來形容顧慮太多、膽小怕事，是哪個成語？","wrong":[{"w":"有頭有尾","by":"晉靈公","line":"有頭有尾是做事有始有終。子家信上說的是頭也怕、尾也怕！"},{"w":"虎頭蛇尾","by":"趙盾","line":"虎頭蛇尾是開始很用心，後來就隨便了。子家說的是什麼都怕，不是做事半途而廢。"},{"w":"瞻前顧後","by":"鄭國使者","line":"瞻前顧後是想太多、猶豫不決，意思很接近！不過信上說的是「怕頭又怕尾」，有一個更貼切的成語。"}],"hint":"信上說：頭也怕，尾也怕。","after":"信上又說：「被逼急的鹿，顧不得挑地方躲。小國被逼急了，也只能冒險。」趙盾讀完，就派人和鄭國講和。","lesson":{"title":"鋌而走險","text":"子家信裡「挺而走險，急何能擇」這句話，後來變成成語「鋌而走險」，比喻走投無路時冒險行動。晉國收到信後，和鄭國互相交換人質，兩國和好了。","next":"可是鄭國夾在晉楚之間，三年後，又奉楚國的命令去攻打宋國……"}},{"id":"e39_03","yr":"西元前 607 年","place":"大棘","scene":"valley","music":"battle","winSad":"華元","cast":[["華元",-1.2,0.6],["羊斟",-6.5,1.2],["宋兵",-2.6,-0.4],["宋兵",-0.2,-0.8],["鄭兵",4.4,-1,0.25],["鄭兵",5.2,-1.8,0.25],["鄭兵",3.6,-1.8,0.25]],"beats":[{"t":"西元前 607 年，鄭國奉楚國的命令攻打宋國。宋國大將華元帶兵迎戰，兩軍在大棘對峙。"},{"t":"開戰前，華元殺羊煮肉，請士兵們吃。","fx":[["cheerAll","宋兵"]]},{"who":"華元","t":"大家吃飽，好好打仗！","fx":[["cheer","華元"]]},{"t":"可是替華元駕戰車的車夫羊斟，一塊羊肉也沒分到。","mv":[["羊斟",-2,1.2]],"fx":[["upset","羊斟"]]},{"t":"開戰了。羊斟握著韁繩，冷冷地說：","fx":[["focus","羊斟"]]},{"who":"羊斟","t":"之前的羊肉，是你作主；今天的事，換我作主！"},{"t":"羊斟駕著戰車，直直衝進了鄭軍的陣營！","mv":[["羊斟",2.6,0.2],["華元",3.2,-0.6]],"fx":[["upset","華元"],["cheerAll","鄭兵"]]}],"q":"羊斟只顧自己的不滿，自己作主把車趕進敵陣，完全不顧全軍的勝負。後來形容各人照自己的意思做事、不顧全體，是哪個成語？","wrong":[{"w":"同心協力","by":"宋兵","line":"同心協力是大家一條心。羊斟要是跟我們同心，華元將軍就不會被抓了！"},{"w":"同舟共濟","by":"華元","line":"同舟共濟是同坐一條船、一起渡過難關。羊斟是把我載到敵人那裡去啊！"},{"w":"自作主張","by":"華元","line":"自作主張是不商量就自己決定，意思有點接近！不過羊斟是各做各的、不顧大局，有一個更貼切的成語。"}],"hint":"羊斟說的「為政」，就是作主的意思。","after":"華元被鄭軍抓走，宋軍大敗。君子批評羊斟：為了自己一點小小的怨恨，害國家打敗仗、讓百姓受苦。","lesson":{"title":"華元逃回來了","text":"宋國準備了一百輛兵車、四百匹好馬，要向鄭國贖回華元。才送去一半，華元就自己逃回宋國了。他後來成為宋國的重要大臣。","next":"這時候，楚莊王已經讓楚國強大起來。西元前 597 年，楚國包圍鄭國，晉國派大軍去救……"}},{"id":"e13_08","yr":"西元前 597 年","place":"黃河邊．晉軍大帳","scene":"tent","music":"battle","table":true,"cast":[["荀林父",0.2,0.4],["隨武子",-1.6,1.0],["先縠",1.8,1.0]],"beats":[{"t":"西元前 597 年，楚莊王圍攻鄭國。晉國派大軍去救，走到黃河邊，卻聽說鄭國已經和楚國講和了。"},{"who":"荀林父","t":"鄭國已經投靠楚國，我們再過去也沒用，不如回去吧。","fx":[["sad","荀林父"]]},{"who":"隨武子","t":"我贊成。楚軍現在很強，不能小看。令尹孫叔敖替楚國選了最好的法令。","fx":[["say","隨武子"]]},{"who":"隨武子","t":"楚軍行軍時，右軍跟著主將的車，左軍準備草料，中軍出主意，後軍是精兵，大家各有分工。"},{"who":"隨武子","t":"最前面的隊伍舉著茅草當旗子，一發現前面有敵人或危險，就舉起茅草通知後面的部隊。","fx":[["focus","隨武子"]]},{"who":"先縠","t":"哼！敵人就在眼前，怎麼可以退！","fx":[["upset","先縠"]]}],"q":"楚軍走在最前面、舉著茅草探路的隊伍，叫做「前茅」。後來就用這支最前面的隊伍，比喻名次排在前面、成績很好，是哪個成語？","wrong":[{"w":"名落孫山","by":"先縠","line":"名落孫山是考試沒考上，排在最後面。這跟楚軍最前面的隊伍剛好相反！"},{"w":"茅塞頓開","by":"荀林父","line":"茅塞頓開是心裡突然想通了。雖然也有「茅」字，可是跟茅草旗子沒關係！"},{"w":"獨占鰲頭","by":"隨武子","line":"獨占鰲頭是考第一名，意思很接近！不過「前茅」說的是排在前面的一群，不一定是第一名，有一個更貼切的成語。"}],"hint":"排在最前面的那支隊伍，叫什麼名字？","after":"先縠不聽，說：「晉國失去霸主的地位，還不如死！」就自己帶著部下渡過黃河。荀林父只好帶著全軍跟上。","lesson":{"title":"楚軍的紀律","text":"隨武子稱讚楚國：品德、刑罰、政事、時機、法令、禮節都做得很好，這樣的國家怎麼能和它作對呢？「茅」是茅草，「前茅」就是走在最前面的偵察部隊。","next":"晉軍渡過黃河，兩軍越靠越近。一場大戰，就要開始了……"}},{"id":"e28_04","yr":"西元前 597 年","place":"邲","scene":"valley","music":"battle","cast":[["孫叔敖",-4.4,-1,0.25],["潘黨",-6.8,1.2],["楚兵",-3.6,-1.8,0.25],["楚兵",-5.2,-1.8,0.25],["楚兵",-2.2,-0.4],["晉兵",4.4,-1,0.25],["晉兵",5.2,-1.8,0.25],["晉兵",3.6,-1.8,0.25]],"beats":[{"t":"晉楚兩軍在邲對峙。晉國的兩位將軍跑去楚營挑釁，楚莊王親自帶人去追。"},{"t":"晉軍怕他們惹怒楚軍，派出戰車去接應。遠遠地，揚起了一大片塵土。","mv":[["晉兵#3",2.6,-0.6,0]]},{"who":"潘黨","t":"不好了！晉軍打過來了！","mv":[["潘黨",-2,0.6]],"fx":[["upset","潘黨"]]},{"t":"楚國人也怕楚莊王衝得太前面，被晉軍包圍，趕緊列好陣勢。","fx":[["cheerAll","楚兵"]]},{"who":"孫叔敖","t":"前進！寧可我們逼近敵人，也不要讓敵人逼近我們！","fx":[["say","孫叔敖"],["focus","孫叔敖"]]},{"who":"孫叔敖","t":"兵書《軍志》說：「搶先一步的人，可以奪走敵人的鬥志。」衝啊！","mv":[["楚兵#3",1,-0.2],["潘黨",0.2,0.6]],"fx":[["burst","孫叔敖"]]}],"q":"孫叔敖搶先出擊，用聲勢壓倒晉軍的鬥志。後來比喻先大張聲勢，來壓倒對方的氣勢，是哪個成語？","wrong":[{"w":"聲東擊西","by":"潘黨","line":"聲東擊西是假裝打東邊，其實打西邊。令尹大人可是正面直直衝過去！"},{"w":"偃旗息鼓","by":"楚兵","line":"偃旗息鼓是放下旗子、停止打鼓，不出聲。我們現在可是喊得震天響！"},{"w":"先發制人","by":"孫叔敖","line":"先發制人是先動手來控制對方，意思很接近！不過兵書說的是先用聲勢奪走敵人的鬥志，有一個更貼切的成語。"}],"hint":"「先聲」是搶先造出的聲勢。","after":"楚軍戰車奔馳、步兵飛跑，直衝晉軍。晉軍措手不及，大敗而逃，搶著渡過黃河回國。","winMv":[["晉兵",6.8,-3],["晉兵#2",7.4,-3.6],["晉兵#3",6.4,-2.2,0]],"lesson":{"title":"邲之戰","text":"邲之戰楚國大勝，晉國的霸主地位被楚國搶走了。晉軍主帥荀林父回國後請求處死，大臣士貞子用晉文公「困獸猶鬥」的故事勸晉景公，荀林父才被饒恕。","next":"可是你知道嗎？大戰之前，楚莊王差一點就撤兵回國了……"}},{"id":"e38_01","yr":"西元前 597 年","place":"楚軍大營","scene":"tent","music":"battle","cast":[["楚莊王",0.2,0.4],["孫叔敖",1.8,1.0],["伍參",-6.5,1.2]],"beats":[{"t":"時間回到幾天前。楚莊王聽說晉軍已經渡過黃河，想要撤兵回國。"},{"who":"楚莊王","t":"晉軍來了，我們回去吧。"},{"who":"孫叔敖","t":"去年打陳國，今年打鄭國，已經打了很多仗。這一仗如果打輸了，誰負得起責任？","fx":[["say","孫叔敖"]]},{"t":"孫叔敖下令把車頭轉向南方，準備回國。楚王身邊的伍參急忙趕來。","mv":[["伍參",-1.1,0.8]]},{"who":"伍參","t":"晉軍主帥荀林父剛上任，命令沒人聽。他的副手先縠個性又硬又固執，不肯聽從命令。","fx":[["upset","伍參"]]},{"who":"伍參","t":"晉軍將領都想自己作主，士兵不知道要聽誰的，這一仗晉軍一定輸！況且大王是國君，怎麼能躲避晉國的臣子呢？","fx":[["focus","楚莊王"]]},{"who":"楚莊王","t":"說得好！車頭轉向北方，迎戰晉軍！","fx":[["cheer","楚莊王"]]}],"q":"伍參說晉將先縠個性倔強、固執，不肯聽別人的意見，只照自己的想法做。後來形容固執己見、不接受別人意見的人，是哪個成語？","wrong":[{"w":"虛懷若谷","by":"伍參","line":"虛懷若谷是心胸像山谷一樣寬，很謙虛。先縠要是這樣，晉軍就不會亂成一團了！"},{"w":"從善如流","by":"孫叔敖","line":"從善如流是很樂意接受好的意見。先縠可是連主帥的話都不聽！"},{"w":"一意孤行","by":"楚莊王","line":"一意孤行是不聽勸、堅持照自己的意思做，意思很接近！不過伍參形容的是先縠的個性又硬又固執，有一個更貼切的成語。"}],"hint":"「愎」讀ㄅㄧˋ，是固執、任性。","after":"楚軍掉頭北上，在邲打敗了晉軍。先縠不聽主帥命令、擅自渡河，正是晉軍失敗的原因之一。","lesson":{"title":"止戈為武","text":"打了勝仗，有大臣建議楚莊王蓋一座大土堆炫耀武功。楚莊王拒絕說：「『武』這個字，是『止』加上『戈』，真正的武力，是要停止戰爭。」楚莊王因此成為春秋霸主之一。","next":"三年後，西邊的秦國趁機攻打晉國。晉國大將魏顆，碰上了秦國的大力士……"}},{"id":"e13_03","yr":"西元前 594 年","place":"輔氏","scene":"valley","music":"battle","winSad":"杜回","cast":[["魏顆",-1.6,0.6],["晉兵",-2.6,-0.6],["晉兵",-0.6,-1.2],["杜回",6.5,0.2],["秦兵",6.8,-1.2],["秦兵",7.4,1.2],["老人",0.8,-0.4,0,1,1]],"beats":[{"t":"魏顆的父親魏武子，有一位很寵愛的侍妾。魏武子生病時交代：「我死了以後，讓她改嫁。」"},{"t":"後來他病得糊塗，又改口要她陪葬。父親過世後，魏顆說：「我聽爸爸清醒時的話。」就讓她改嫁了。","fx":[["say","魏顆"]]},{"t":"西元前 594 年，秦國攻打晉國。魏顆在輔氏迎戰秦國的大力士杜回。","mv":[["杜回",1.8,0.2],["秦兵",3,-0.8],["秦兵#2",3.4,1]]},{"who":"杜回","t":"誰擋得住我杜回！","fx":[["cheer","杜回"]]},{"t":"這時，魏顆看見一位老人，把地上的草打成結，擋住杜回的腳步。","mv":[["老人",0.6,-0.6]],"fx":[["focus","老人"]]},{"t":"杜回被草絆倒，摔了一大跤，魏顆趁機抓住了他！","mv":[["杜回",0.4,0.6]],"fx":[["upset","杜回"],["cheerAll","晉兵"]]},{"t":"那天晚上，老人在夢裡說：「我是你讓她改嫁的那位女子的父親。你聽從父親清醒時的話，所以我來報答你。」","mv":[["老人",7.5,-1.6]]}],"q":"後來還流傳一個傳說：楊寶小時候救了一隻受傷的黃雀，黃雀飛走後，有黃衣童子送來四枚白玉環報恩。把這兩個報恩故事合起來，比喻感恩圖報、到死都不忘，是哪個成語？","wrong":[{"w":"恩將仇報","by":"杜回","line":"恩將仇報是用壞事回報恩人。那位老人家是來報恩的——雖然倒楣的是我！"},{"w":"忘恩負義","by":"魏顆","line":"忘恩負義是忘記別人的恩情。老人家和黃雀，都把恩情記得清清楚楚呢！"},{"w":"飲水思源","by":"魏顆","line":"飲水思源是喝水時想起水的源頭，不忘本，意思有點接近！不過老人和黃雀都是用行動報恩，有一個更貼切的成語。"}],"hint":"把草打結，用嘴叼著玉環。","after":"「結草」記在《左傳》；黃雀「銜環」出自南朝的《續齊諧記》，是後人寫的傳說故事。","lesson":{"title":"報恩的故事","text":"傳說黃衣童子對楊寶說：「願你的子孫像這玉環一樣潔白，當上大官。」楊寶的兒子楊震和後代，真的連續四代當上朝廷的最高官員。魏武子的家族後來越來越興盛，子孫建立了戰國的魏國。","next":"就在同一年春天，南方的宋國被楚軍團團圍住，派人到晉國求救……"}},{"id":"e28_06","yr":"西元前 594 年","place":"晉國絳都","scene":"office","music":"palace","cast":[["晉景公",1.4,0.6],["伯宗",-0.4,1.2],["樂嬰齊",-6.5,1.2]],"beats":[{"t":"楚國的使者經過宋國時，沒有先向宋國借路，結果被宋國殺了。楚莊王大怒，派大軍把宋國都城團團圍住。"},{"t":"宋國被圍了好幾個月，派大夫樂嬰齊到晉國求救。","mv":[["樂嬰齊",-1.6,0.4]]},{"who":"樂嬰齊","t":"楚軍把宋國圍得緊緊的，請晉國快來救救我們！","fx":[["sad","樂嬰齊"]]},{"who":"晉景公","t":"好！我們馬上出兵！","fx":[["cheer","晉景公"]]},{"who":"伯宗","t":"不可以！上天現在正幫著楚國，晉國再強，也不能違背天意啊！","fx":[["upset","伯宗"]]},{"who":"伯宗","t":"古人說：「鞭子雖然很長，也打不到馬的肚子。」","fx":[["focus","伯宗"]]}],"q":"伯宗的意思是：宋國離晉國太遠，楚國又正強，晉國的力量搆不到。後來比喻力量達不到，是哪個成語？","wrong":[{"w":"快馬加鞭","by":"晉景公","line":"快馬加鞭是加快速度趕路。伯宗是勸我不要去，不是叫我趕快去！"},{"w":"馬到成功","by":"樂嬰齊","line":"馬到成功是一出發就成功。我也希望晉軍一到就成功，可是伯宗大夫說力量搆不到……"},{"w":"力不從心","by":"伯宗","line":"力不從心是心裡想做，能力卻不夠，意思很接近！不過我說的是距離太遠、鞭子打不到馬肚子，有一個更貼切的成語。"}],"hint":"鞭子再長，也打不到馬的哪裡？","after":"伯宗說：「河流湖泊能容納髒水，美玉也藏著小斑點，國君暫時忍耐是自然的道理，請您等待。」晉景公就停止出兵。","lesson":{"title":"爾虞我詐","text":"宋國苦撐了好幾個月。華元趁夜溜進楚營，找到楚將子反，說出宋國的困境。楚國退兵，兩國講和，盟約上寫著「我無爾詐，爾無我虞」——我不騙你，你也不騙我，這就是成語「爾虞我詐」的由來。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第三章．晉楚爭霸","eps":[13,28,38,39]},{"name":"晉國再稱霸","short":"晉悼公時代","era":"西元前 585–559 年","color":"#5B8DB8","map":{"ground":"#b0c47e","river":"#4f9fd8"},"intro":{"lines":["春秋中期，北方的晉國和南方的楚國是兩大強國，常常為了搶當霸主而打仗。","晉國有好幾位大將，打仗時懂得聽部下的好意見，國力一直很強。","後來晉國發生內亂，大臣迎接十四歲的周子回國當國君，他就是晉悼公。","晉悼公重用賢能的大臣，晉國又成為各國的盟主，還帶領諸侯一起攻打秦國。","這一章，我們要看看晉國怎麼重新稱霸，也去見識楚國的神射手！"],"people":[["欒書","晉國大將，肯聽部下的建議"],["養由基","楚國的神射手"],["晉悼公","十四歲當上國君，讓晉國再次稱霸"],["魏絳","晉國大臣，主張和戎狄和好"]]},"stops":[{"id":"e22_05","yr":"西元前 585 年","place":"蔡國邊境的晉軍大營","scene":"tent","music":"battle","table":true,"cast":[["欒書",-0.4,-0.2],["趙同",1.6,0.6],["韓獻子",6.6,1.2],["知莊子",7.2,0.2],["范文子",7.6,1.8]],"beats":[{"t":"楚國攻打鄭國，晉國大將欒書帶兵去救。楚軍一看晉軍來了，就撤退回國。"},{"t":"晉軍乘勝攻進蔡國。楚國又派出兩個縣的軍隊來救蔡國，兩軍眼看就要開打。"},{"who":"趙同","t":"元帥，楚軍來了！我們衝過去，打他個落花流水！","fx":[["cheer","趙同"]]},{"t":"這時，韓獻子、知莊子、范文子三位將領一起走進大帳。","mv":[["韓獻子",2.4,-1.2],["知莊子",1.2,-1.9],["范文子",3.0,0.0]]},{"who":"韓獻子","t":"我們是來救鄭國的，楚軍已經走了。打贏兩個縣的兵不算光榮，打輸了反而丟臉，不如回去吧！"},{"t":"有人提醒欒書：「您身邊十一位將領，不想打的只有三個，想打的人比較多呀！」","fx":[["upset","趙同"]]},{"who":"欒書","t":"他們三位都是重臣，說的又有道理。好意見就該聽，退兵！","fx":[["focus","欒書"]]}],"q":"兩年後，欒書又聽了這三位將領的建議，俘虜了沈國國君。君子稱讚他：接受好意見，就像水往低處流一樣自然順暢。這是哪個成語？","wrong":[{"w":"一意孤行","by":"趙同","line":"一意孤行是不聽勸、硬要照自己的意思做。元帥剛好相反，馬上就聽了！"},{"w":"南轅北轍","by":"知莊子","line":"南轅北轍是想往南走，車子卻往北開，越走越遠。元帥可是很清楚方向呢！"},{"w":"虛懷若谷","by":"范文子","line":"虛懷若谷是心胸像山谷一樣謙虛寬大，意思很接近！不過要找的成語，是說聽到好意見就像流水一樣馬上照做。"}],"hint":"「善」是好的意見，「流」是流水。","after":"欒書退兵回國。原文說的是西元前 583 年他聽從知、范、韓三人，又打了勝仗，君子才這樣稱讚他。","lesson":{"title":"會聽意見的晉軍","text":"晉國的軍隊由好幾位「卿」一起帶領，彼此商量作戰。欒書肯聽部下的好意見，晉軍在他帶領下打了好幾次勝仗。","next":"這時候，晉國的國君晉景公卻生了一場重病……"}},{"id":"e13_02","yr":"西元前 581 年","place":"晉國都城","scene":"study","music":"night","cast":[["晉景公",-0.6,-1.6],["小童",1.4,-2.6,0,0,1],["小童",2.2,-2.2,0,0,1],["醫緩",6.8,1.0],["侍臣",1.8,0.6]],"beats":[{"t":"晉景公病得很重。他派人到秦國，請秦國國君派名醫來治病。秦國派出一位叫「緩」的醫生。"},{"who":"晉景公","t":"秦國的名醫怎麼還沒到？我好難受……","fx":[["sad","晉景公"]]},{"t":"這天晚上，晉景公做了一個怪夢：他的病變成兩個小孩，在旁邊說悄悄話。","mv":[["小童",1.0,-1.8],["小童#2",1.9,-1.5]]},{"who":"小童","t":"那是個好醫生，會傷到我們的！要往哪裡逃？"},{"who":"小童#2","t":"我們躲到肓的上面、膏的下面，他能拿我們怎麼樣？","fx":[["cheer","小童#2"]]},{"t":"名醫緩終於趕到了。他仔細看了晉景公的病情，搖搖頭。","mv":[["小童",7.5,-2.6],["小童#2",7.8,-2.0],["醫緩",0.8,-0.8]]},{"who":"醫緩","t":"這病治不了了。病在肓的上面、膏的下面，針灸到不了，藥力也達不到啊！","fx":[["focus","醫緩"]]}],"q":"醫緩說的，和晉景公夢裡小孩說的一模一樣：病躲在膏和肓中間，藥力到不了。後來形容病重到沒辦法醫治，或事情嚴重到無法挽救，是哪個成語？","wrong":[{"w":"藥到病除","by":"侍臣","line":"藥到病除是一吃藥病就好了。名醫都說藥力到不了，哪能好呢？"},{"w":"妙手回春","by":"晉景公","line":"妙手回春是稱讚醫生把重病治好。可惜醫緩說，這次他也沒辦法……"},{"w":"無可救藥","by":"醫緩","line":"無可救藥也是說沒得救，意思很接近！不過要找的成語，說出了病躲在身體的哪裡。"}],"hint":"心臟下面的油脂叫「膏」，橫膈膜上面叫「肓」。","after":"晉景公說：「真是好醫生！」送了他很重的禮物，讓他回秦國。","lesson":{"title":"晉景公之死","text":"沒過多久，晉景公就過世了，由兒子晉厲公即位。「肓」讀作ㄏㄨㄤ，不是「盲」，寫的時候下面是「月」字。","next":"晉厲公即位後，晉國和楚國又在鄢陵打了一場大仗。楚國軍中，有一位很厲害的神射手……"}},{"id":"e14_06","yr":"約西元前 575 年","place":"楚國的柳樹林邊","scene":"road","music":"map","cast":[["養由基",-0.6,0.6],["楚兵",1.6,1.4],["楚兵",2.6,0.6],["路人",7.0,1.6]],"beats":[{"t":"楚國有一位神射手，名叫養由基。他射箭的本領，全楚國都知道。"},{"who":"楚兵","t":"養將軍，聽說你能射中很遠的柳葉，表演給我們看嘛！"},{"t":"養由基走到離柳樹一百步遠的地方，拉開弓，瞄準一片細細的柳葉。","mv":[["養由基",-1.6,1.0]],"fx":[["focus","養由基"]]},{"t":"咻！箭穿過了柳葉。再射，又中！他射了很多次，每一箭都射中葉子。","fx":[["cheerAll","楚兵"]]},{"t":"大家都拍手叫好。這時，一個路人經過，看了看說話了。","mv":[["路人",1.0,0.0]]},{"who":"路人","t":"射得不錯，我可以教你射箭了。"},{"who":"養由基","t":"大家都說好，你卻說要教我？那你來替我射射看呀！","fx":[["upset","養由基"]]}],"q":"養由基站在一百步外，就能射穿細細的柳葉。後來形容射箭的技術非常高明，是哪個成語？","wrong":[{"w":"一箭雙鵰","by":"楚兵","line":"一箭雙鵰是一支箭射中兩隻鳥，那是好幾百年後北朝長孫晟的故事。養將軍射的是柳葉！"},{"w":"杯弓蛇影","by":"路人","line":"杯弓蛇影是把杯子裡弓的倒影看成蛇，自己嚇自己。跟射箭的本領沒關係啦！"},{"w":"箭無虛發","by":"養由基","line":"箭無虛發是每一箭都不落空，意思很接近！不過要找的成語，說出了「一百步」和「柳樹」。"}],"hint":"古人常把柳樹叫做「楊」。","after":"路人說：「我不是要教你怎麼拉弓。你射了這麼久，等一下累了，只要一箭沒射中，前面的好名聲就全沒了！」","lesson":{"title":"真實的神射手","text":"養由基是《左傳》裡記載的楚國大將。在鄢陵之戰時，他一箭能射穿七層鎧甲。射柳葉這段故事，則是戰國時代的蘇厲說給周君聽的，記在《戰國策》裡。","next":"養由基的箭法到底有多神？連楚王養的一隻白猿，都怕他怕得要命……"}},{"id":"e40_03","yr":"約西元前 575 年","place":"楚國王宮花園","scene":"palace","music":"palace","cast":[["楚王",0.4,0.4],["侍衛",2.2,1.2],["侍衛",-0.8,-1.6],["養由基",6.8,1.2]],"beats":[{"t":"楚王養了一隻白猿，牠非常靈活，在樹上跳來跳去。"},{"t":"楚王想試試自己的箭法，拉弓朝白猿射去。沒想到白猿伸手一抓，就把箭接住了！","fx":[["upset","楚王"]]},{"t":"白猿還拿著箭，在樹枝上得意地玩耍。","fx":[["cheerAll","侍衛"]]},{"who":"楚王","t":"可惡的猴子！去把養由基找來！"},{"t":"養由基來了。他才剛調好弓、把箭擺正，還沒射出去……","mv":[["養由基",-0.8,0.8]],"fx":[["focus","養由基"]]},{"t":"白猿竟然緊緊抱住樹幹，嚇得大哭大叫起來！","fx":[["cheer","楚王"]]}],"q":"白猿知道，養由基射一百次就會中一百次，所以還沒射就嚇哭了。後來形容技術高明、每次都命中，也比喻做事、料事很準，是哪個成語？","wrong":[{"w":"手忙腳亂","by":"侍衛","line":"手忙腳亂是慌張得不知道怎麼辦。手忙腳亂的是白猿，養將軍可是穩穩的！"},{"w":"虎頭蛇尾","by":"楚王","line":"虎頭蛇尾是開始很厲害，最後卻沒力氣。養由基從頭到尾都很準！"},{"w":"百步穿楊","by":"養由基","line":"百步穿楊也在說我的箭法，意思很接近！不過它強調一百步外射穿柳葉；這題要的是「每一箭都中」。"}],"hint":"射一百次……會中幾次？","after":"白猿的故事記在漢朝的《淮南子》裡，是後人流傳的說法，用來表示養由基的箭法神到連動物都知道。","lesson":{"title":"鄢陵之戰","text":"西元前 575 年，晉厲公在鄢陵打敗楚共王，楚共王的眼睛還中了晉將一箭。楚共王給養由基兩支箭，要他替自己報仇，養由基只用一支就射中了對方。","next":"晉國打贏了，晉厲公卻變得驕傲，殺害大臣，最後自己也被大臣殺了。晉國需要一位新國君……"}},{"id":"e38_08","yr":"西元前 573 年","place":"清原","scene":"road","music":"palace","cast":[["周子",-6.8,1.0],["荀罃",-7.4,0.2],["士魴",-7.6,1.8],["大夫",1.4,0.4],["大夫",2.6,1.2]],"beats":[{"t":"晉厲公死後，晉國大臣派荀罃、士魴到周朝的都城，迎接住在那裡的晉國公子周子。"},{"t":"周子這一年才十四歲。晉國的大夫們在清原等候，迎接他回國。","mv":[["周子",-0.4,0.4],["荀罃",-1.4,-0.6],["士魴",-1.6,1.2]]},{"who":"周子","t":"我本來沒想過能當國君。大家找國君，是要他發布命令；立了國君卻不聽，那要國君做什麼呢？","fx":[["focus","周子"]]},{"who":"大夫","t":"這是我們大家的心願，怎麼敢不聽您的命令！","fx":[["cheerAll","大夫"]]},{"t":"周子就是後來的晉悼公。小小年紀，說話就這麼有魄力。","fx":[["cheer","周子"]]},{"who":"士魴","t":"你們知道嗎？周子其實有個哥哥。為什麼不立哥哥，要立弟弟呢？"},{"who":"荀罃","t":"史官記下了原因：他的哥哥不太聰明，連最平常的糧食都認不出來……"}],"q":"史書說，周子的哥哥分不清豆子和麥子，所以不能當國君。後來形容一個人缺乏基本常識、很糊塗，是哪個成語？","wrong":[{"w":"五穀豐登","by":"大夫","line":"五穀豐登是農作物大豐收。我們說的是有人連豆子和麥子都分不清呀！"},{"w":"聰明伶俐","by":"周子","line":"聰明伶俐是頭腦靈活，剛好相反。哥哥就是因為不夠聰明，才沒有被立為國君。"},{"w":"不學無術","by":"荀罃","line":"不學無術是沒有學問、沒有本事，意思有點接近！不過要找的成語，說的是連豆和麥都認不出來。"}],"hint":"「菽」是豆類的總稱。","after":"周子回到晉國，正式即位，成為晉悼公。","lesson":{"title":"少年國君晉悼公","text":"晉悼公即位後，任用魏絳、祁奚、韓厥等賢能的大臣，整頓國政。晉國很快又強大起來，重新成為諸侯的盟主。","next":"晉悼公接受魏絳的建議，和北方的戎狄和好。過了幾年，晉國越來越強盛……"}},{"id":"e13_05","yr":"西元前 562 年","place":"晉國王宮","scene":"palace","music":"palace","cast":[["晉悼公",1.4,0.4],["魏絳",-6.6,1.2],["樂師",2.6,-1.4],["樂師",3.4,-0.6],["大臣",0.0,-1.6]],"beats":[{"t":"魏絳曾經勸晉悼公和北方的戎狄和好，不要一直打仗。晉國少了外患，可以專心團結中原各國。"},{"t":"這一年，鄭國送來許多樂師和樂器求和。晉悼公把魏絳找來。","mv":[["魏絳",-0.8,0.6]],"fx":[["cheerAll","樂師"]]},{"who":"晉悼公","t":"八年裡我九次會合諸侯，就像音樂一樣和諧，都是你教我和戎狄和好的功勞！這些樂師和樂器，分一半給你！","fx":[["cheer","晉悼公"]]},{"who":"魏絳","t":"這是大王的威望和大家的努力，我有什麼功勞呢？","fx":[["say","魏絳"]]},{"who":"魏絳","t":"不過，我希望大王在享受快樂的時候，也想想以後會怎麼樣。","fx":[["focus","魏絳"]]},{"who":"魏絳","t":"《書經》上說：處在平安的時候，要想到危險。想到了就會有準備，有準備就不怕禍患。"}],"q":"魏絳提醒晉悼公：國家現在雖然很平安，也要想到可能發生的危險。後來用哪個成語形容這種態度？","wrong":[{"w":"高枕無憂","by":"大臣","line":"高枕無憂是墊高枕頭安心睡大覺，什麼都不擔心。魏絳剛好要我們別這樣！"},{"w":"樂極生悲","by":"樂師","line":"樂極生悲是快樂到極點反而發生悲傷的事。魏絳不是說會發生壞事，是提醒要先想好、先準備。"},{"w":"有備無患","by":"魏絳","line":"有備無患也是我說的，是這段話的後半句！要找的是前半句：平安的時候想到危險。"}],"hint":"「居」是處在，「思」是想到。","after":"晉悼公說：「你的話我不敢不聽。不過這些賞賜是國家的規矩，你一定要收下。」魏絳這才接受了。","lesson":{"title":"魏絳和戎","text":"魏絳主張用財物和戎狄交換土地、和平相處，讓晉國北邊安定下來。晉悼公在位期間，晉國再次成為最強大的霸主。","next":"這一年，秦國在櫟打敗了晉軍。三年後，晉國帶著各國軍隊去攻打秦國報仇……"}},{"id":"e23_04","yr":"西元前 559 年","place":"涇水邊","scene":"river","music":"map","cast":[["叔向",-0.6,0.4],["叔孫穆子",1.6,0.6],["船官",6.8,1.4],["魯兵",2.8,-1.4],["魯兵",3.6,-0.6],["莒兵",4.4,-1.8]],"beats":[{"t":"晉國帶領各國的軍隊攻打秦國。大軍走到涇水邊，大家看著寬寬的河水，誰也不肯先過河。"},{"t":"晉國的大夫叔向，跑去找魯國的叔孫穆子商量。"},{"who":"叔向","t":"各國說秦國無禮，才來討伐它。走到涇水就停下來，對秦國有什麼用呢？","fx":[["upset","叔向"]]},{"who":"叔孫穆子","t":"我只學過〈匏有苦葉〉這首詩，別的就不知道了。","fx":[["say","叔孫穆子"]]},{"t":"〈匏有苦葉〉唱的是：苦葫蘆熟了，人們把它綁在腰上，就能浮著渡過深深的河水。","fx":[["focus","叔向"]]},{"who":"叔向","t":"苦葫蘆不能吃，唯一的用處就是幫人一起渡河。叔孫唱這首詩，是說魯國一定會過河！船官，快準備船隻、整理道路！","mv":[["船官",0.6,1.4]]},{"t":"第二天，魯國和莒國的軍隊帶頭先渡河，其他國家也跟著一起過去了。","mv":[["魯兵",-2.0,-2.6],["魯兵#2",-1.0,-3.2],["莒兵",0.2,-2.8]],"fx":[["cheerAll","魯兵"]]}],"q":"各國軍隊互相配合，同心協力渡過了涇水。後來比喻大家同心協力、一起克服困難，是哪個成語？","wrong":[{"w":"同床異夢","by":"叔孫穆子","line":"同床異夢是待在一起，心裡卻各想各的。我們這次可是心往一處想呢！"},{"w":"各自為政","by":"叔向","line":"各自為政是各做各的，不互相配合。剛剛大家在河邊停下來，才有點像這樣！"},{"w":"同舟共濟","by":"船官","line":"同舟共濟是坐同一條船一起渡河，意思很接近！不過要找的成語，前兩個字說的是「心意和諧」。"}],"hint":"「衷」是內心，「濟」是渡河。","after":"古人真的會把乾的葫蘆綁在腰上當救生圈，叫做「腰舟」。叔孫穆子用唱詩代替回答，是春秋時代外交官常用的方式。","lesson":{"title":"成語的兩個來源","text":"這個成語的前兩個字「和衷」出自《書經》，是心意和諧的意思；後兩個字「共濟」出自《國語》裡這段渡涇水的故事。後人把它們合在一起。","next":"大軍過了涇水，可是秦國人在河的上游動了手腳……"}},{"id":"e38_06","yr":"西元前 559 年","place":"涇水西岸的聯軍營地","scene":"night","music":"night","winSad":"荀偃","cast":[["荀偃",0.6,0.6],["欒黶",6.8,1.2],["晉兵",-1.4,-0.4],["晉兵",2.2,-0.2],["晉兵",1.6,-2.4]],"beats":[{"t":"聯軍過了涇水，秦國人卻在河的上游放了毒。很多士兵喝了河水，生病倒下了。","fx":[["sadAll","晉兵"]]},{"t":"晉國的主帥荀偃很著急，他決定繼續往前進攻。"},{"who":"荀偃","t":"明天雞一叫就套車出發！把井填平、把灶拆掉！","fx":[["focus","荀偃"]]},{"who":"荀偃","t":"全軍不用管別的，只要看著我的馬頭往哪邊，就往哪邊走！","fx":[["say","荀偃"]]},{"t":"這時，帶領下軍的將軍欒黶大步走了過來。","mv":[["欒黶",2.4,1.2]]},{"who":"欒黶","t":"晉國從來沒有這種命令！","fx":[["upset","欒黶"]]}],"q":"荀偃命令全軍：只看主將的馬頭往哪裡，就跟著往哪裡。後來比喻服從某人的指揮，或跟著他行動，是哪個成語？","wrong":[{"w":"馬到成功","by":"晉兵","line":"馬到成功是戰馬一到就打勝仗。我們還沒出發，大家就吵起來了……"},{"w":"老馬識途","by":"欒黶","line":"老馬識途是老馬認得路，比喻有經驗的人能帶路。荀偃是要大家看他的馬頭，不是靠馬認路！"},{"w":"唯命是從","by":"荀偃","line":"唯命是從是完全聽從命令，意思很接近！不過要找的成語，就是我說的「看我的馬頭」那句話。"}],"hint":"「瞻」是往前看；主將騎著什麼？","winMv":[["欒黶",7.5,1.0]],"after":"欒黶說：「我的馬頭要往東！」說完就帶著下軍回國了，其他軍隊也跟著走。","lesson":{"title":"遷延之役","text":"主帥的命令沒人聽，荀偃只好下令全軍撤退。晉國人把這次拖拖拉拉、沒有結果的出兵，叫做「遷延之役」。過了不久，晉悼公也去世了，各國之間又開始了新的局面。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","key":"h04","title":"第四章．晉國再稱霸","eps":[13,14,22,23,38,40]},{"name":"賢人輩出","short":"春秋賢人","era":"西元前 548–540 年","color":"#4E9A8B","map":{"ground":"#a9c77f","river":"#4f9fd8"},"intro":{"lines":["春秋後期，晉國和楚國打了一百多年，雙方都累了，各國之間開始多用外交來解決問題。","這個時代出了好多有智慧的人：吳國的季札、鄭國的子產、齊國的晏子，都很受大家尊敬。","可是各國宮廷裡，也有人爭權奪利、玩弄手段，連國君都被趕來趕去。","這一章，我們跟著使者們走訪各國，看看賢人怎麼說話、怎麼做事！"],"people":[["季札","吳國公子，重信用、懂音樂"],["子產","鄭國的名臣，很會辦外交"],["晏子","齊國的宰相，個子矮小卻很機智"],["伯州犁","楚國大臣，替人評理卻偏心"]]},"stops":[{"id":"e28_08","yr":"西元前 548 年","place":"衛國","scene":"office","music":"palace","cast":[["甯喜",1.2,0.4],["使者",-6.8,1.0],["大叔文子",6.8,1.4],["大夫",2.8,-1.4]],"beats":[{"t":"十一年前，衛國大臣孫林父和甯殖把衛獻公趕出國。衛獻公只好住在國外的夷儀。"},{"t":"甯殖臨死前很後悔，交代兒子甯喜，一定要把國君接回來。"},{"t":"這一天，衛獻公派使者從夷儀來找甯喜。","mv":[["使者",-0.6,0.6]]},{"who":"使者","t":"國君說：只要能讓他回國，國家的政事都交給甯家管理！"},{"who":"甯喜","t":"好！我答應，一定幫國君回來！","fx":[["cheer","甯喜"]]},{"t":"大夫大叔文子聽到消息，連連搖頭。","mv":[["大叔文子",2.6,1.2]],"fx":[["upset","大叔文子"]]},{"who":"大叔文子","t":"唉！甯家先趕走國君，又要迎回國君，對待國君還不如下棋慎重！下棋的人拿起棋子卻決定不了下一步，都贏不了對手，何況是對待國君？","fx":[["focus","大叔文子"]]}],"q":"大叔文子說，下棋的人拿起棋子，卻遲遲決定不了要下在哪裡，一定會輸。後來比喻做事猶豫、拿不定主意，是哪個成語？","wrong":[{"w":"當機立斷","by":"大夫","line":"當機立斷是抓住時機、馬上決定，剛好相反！"},{"w":"胸有成竹","by":"使者","line":"胸有成竹是心裡早就有把握。大叔文子說的是拿不定主意的人呀！"},{"w":"優柔寡斷","by":"大叔文子","line":"優柔寡斷是個性軟弱、不果斷，意思很接近！不過我是用下棋來比喻，要找的是和下棋有關的成語。"}],"hint":"「舉」是拿起，「棋」是棋子。","after":"大叔文子說：「甯家九代都是大官，恐怕一下子就要滅亡了！」","lesson":{"title":"甯喜的下場","text":"第二年，甯喜真的把衛獻公迎回國。可是衛獻公回國後，覺得甯喜權力太大，沒多久就把他處死了，甯家果然沒落。大叔文子的話應驗了。","next":"第二年，南方的楚國攻打鄭國，抓到了一個俘虜，楚國兩個人卻為了搶功勞吵了起來……"}},{"id":"e38_04","yr":"西元前 547 年","place":"鄭國城麇附近的楚軍營","scene":"tent","music":"battle","winSad":"穿封戌","cast":[["穿封戌",-1.2,0.8],["公子圍",1.4,0.8],["伯州犁",0.0,-1.2],["皇頡",6.8,1.2],["楚兵",7.4,0.4]],"beats":[{"t":"楚國攻打鄭國的城麇。守城的鄭國大夫皇頡出城迎戰，打輸了，被楚將穿封戌抓住。"},{"t":"楚王的弟弟公子圍卻跑來說，皇頡是他抓的。兩個人吵得不可開交。","fx":[["upset","穿封戌"],["upset","公子圍"]]},{"who":"伯州犁","t":"別吵了！問問俘虜不就知道了？把他帶上來！","mv":[["皇頡",0.0,1.4],["楚兵",1.4,2.0]]},{"who":"伯州犁","t":"我們爭的是你這位有身分的人，你一定知道誰抓了你。"},{"t":"伯州犁把手往上舉，指著公子圍。","fx":[["focus","伯州犁"]]},{"who":"伯州犁","t":"這位是王子圍，是我們大王尊貴的弟弟。"},{"t":"接著，他把手往下放，指著穿封戌。","fx":[["say","伯州犁"]]},{"who":"伯州犁","t":"這位是穿封戌，只是方城外面的一個縣官。好，到底是誰抓到你的？"}],"q":"伯州犁把手一抬、一放，就暗示俘虜要說是公子圍抓的。後來比喻暗中玩弄手段、串通作弊，是哪個成語？","wrong":[{"w":"手忙腳亂","by":"皇頡","line":"手忙腳亂是慌慌張張。伯州犁的手可是慢慢地一上一下，很有心機呢！"},{"w":"舉手之勞","by":"公子圍","line":"舉手之勞是一點點小事，抬抬手就做到了。這裡的抬手，可是在暗示俘虜！"},{"w":"徇私舞弊","by":"穿封戌","line":"徇私舞弊是為了私人關係做不公平的事，意思很接近！不過要找的成語，說的就是伯州犁那隻一上一下的手。"}],"hint":"伯州犁的手，一下往哪裡、一下往哪裡？","after":"皇頡馬上說：「我是碰到王子，打不過他才被抓的。」穿封戌氣得拿起戈去追公子圍，可是沒有追上。","lesson":{"title":"公子圍是誰？","text":"公子圍是楚康王的弟弟，很有權勢，所以伯州犁才會偏袒他。幾年後，公子圍奪了姪子的王位，成為楚靈王。","next":"這一年，蔡國的聲子從晉國回到楚國，楚國的令尹子木問起晉國的情形……"}},{"id":"e38_07","yr":"西元前 547 年","place":"楚國都城郢","scene":"office","music":"palace","cast":[["子木",1.2,0.4],["聲子",-6.8,1.0],["官員",2.6,-1.2]],"beats":[{"t":"楚國大夫伍舉被人誣賴，只好逃到國外，準備去晉國。他的好朋友、蔡國的聲子，一直想幫他回楚國。"},{"t":"聲子出使晉國回來，路過楚國，令尹子木請他來聊聊。","mv":[["聲子",-0.6,0.6]]},{"who":"子木","t":"晉國的大夫和楚國的大夫比起來，誰比較賢能？","fx":[["say","子木"]]},{"who":"聲子","t":"晉國的卿比不上楚國，可是晉國的大夫都很賢能，個個都有當卿的本事。"},{"who":"聲子","t":"就像杞木、梓木這些好木材，還有皮革，都是從楚國運到晉國去的。","fx":[["focus","聲子"]]},{"who":"聲子","t":"楚國雖然有人才，真正用他們的，卻是晉國啊！","fx":[["upset","子木"]]}],"q":"聲子說楚國的人才，都被晉國拿去用了。後來比喻本國的人才外流，被別的國家或團體任用，是哪個成語？","wrong":[{"w":"狐假虎威","by":"官員","line":"狐假虎威是狐狸借老虎的威風嚇人，是楚國江乙講的寓言。跟人才跑掉沒關係啦！"},{"w":"朝秦暮楚","by":"子木","line":"朝秦暮楚是早上靠秦國、晚上靠楚國，說人反覆無常。聲子說的是人才一去不回呀！"},{"w":"人才濟濟","by":"聲子","line":"人才濟濟是人才很多，意思有關！可是我要說的重點是：楚國的人才，被晉國拿去用了。"}],"hint":"「材」是木材，也比喻人才。","after":"聲子舉了好幾個楚國人逃到晉國、反過來幫晉國打敗楚國的例子。子木聽了很害怕，趕快報告楚王，加倍給伍舉官位和俸祿，請他回楚國。","lesson":{"title":"伍舉和伍子胥","text":"伍舉回到楚國，後來成為楚靈王的重要大臣。可是他的孫子伍子胥，後來又因為家人被楚平王殺害，逃到吳國，帶著吳軍攻打楚國——楚國的人才，再一次被別國所用。","next":"說到吳國，吳王最小的兒子季札，這時正奉命出使北方各國……"}},{"id":"e09_04","yr":"西元前 544 年","place":"徐國","scene":"south","music":"night","cast":[["季札",-6.8,1.0],["隨從",-7.4,1.8],["徐君",1.4,0.4]],"beats":[{"t":"吳國公子季札奉命出使北方各國。他往北走，經過了徐國。","mv":[["季札",-0.6,0.6],["隨從",-1.6,1.4]]},{"t":"徐國國君很喜歡季札身上佩的寶劍，眼睛一直看著，卻不好意思開口。","fx":[["focus","徐君"]]},{"t":"季札看出了徐君的心意。可是使者出使別國，一定要佩劍，他心裡想：等我回來，就把劍送給他。"},{"t":"季札走訪了好幾個國家。等他回到徐國時，徐君已經過世了。","mv":[["徐君",7.6,-1.0]],"fx":[["sad","季札"]]},{"t":"季札來到徐君的墓前，解下寶劍，掛在墓旁的樹上。","mv":[["季札",0.6,-1.4]]},{"who":"隨從","t":"徐君已經過世了，您還要把劍送給誰呢？"},{"who":"季札","t":"不是這樣的。我心裡早就答應他了，怎麼能因為他過世，就違背自己的心呢？","fx":[["focus","季札"]]}],"q":"季札只是在心裡答應過，就算徐君已經過世，還是把寶劍留在他的墓旁。後人用這個故事比喻重視信用、不忘承諾，是哪個成語？","wrong":[{"w":"見利忘義","by":"隨從","line":"見利忘義是看到好處就忘了道義。公子連這麼貴重的寶劍都送了，剛好相反！"},{"w":"過河拆橋","by":"徐君","line":"過河拆橋是事情辦完就翻臉不認人。季札可是到最後都記得我呀！"},{"w":"一諾千金","by":"季札","line":"一諾千金是答應的話價值千金，意思很接近！不過那是漢朝季布的故事；要找的成語，主角就是我。"}],"hint":"季札最後把什麼東西，放在哪裡？","after":"這個故事記在司馬遷的《史記》裡。古人覺得，連心裡的承諾都要做到，是最高的信用。","lesson":{"title":"讓位的季札","text":"季札是吳王壽夢最小的兒子。父親和哥哥們都想讓他當吳王，他卻一再推辭，寧願回去種田。這一趟出使，他走訪了魯、齊、鄭、衛、晉等國家，到處受到尊敬。","next":"季札在這一趟旅程中，遇到了一位一見面就很投緣的朋友——鄭國的子產……"}},{"id":"e23_01","yr":"西元前 544 年","place":"鄭國都城新鄭","scene":"palace","music":"palace","cast":[["子產",1.4,0.4],["季札",-6.8,1.0],["侍從",2.8,1.4]],"beats":[{"t":"季札來到鄭國，拜訪鄭國有名的大夫子產。"},{"t":"季札走進大廳，子產迎了上來。","mv":[["季札",-0.6,0.6],["子產",0.8,0.4]]},{"who":"子產","t":"久仰公子大名，歡迎來到鄭國！","fx":[["cheer","子產"]]},{"who":"季札","t":"我在吳國，也常聽說子產先生的賢名。"},{"t":"兩人一聊，從國家大事聊到做人的道理，越聊越開心，好像認識很久了。","fx":[["focus",null]]},{"t":"季札送給子產一條白色的絲帶，子產回送一件麻布做的衣服。","fx":[["say","季札"],["cheer","子產"]]}],"q":"《左傳》說，季札見到子產，就像是早就認識的老朋友。後來形容初次見面就很投緣，是哪個成語？","wrong":[{"w":"素不相識","by":"侍從","line":"素不相識是從來不認識。他們雖然第一次見面，卻聊得像老朋友！"},{"w":"形同陌路","by":"子產","line":"形同陌路是像路上的陌生人一樣冷淡。我們可是一見面就很熱絡呢！"},{"w":"相見恨晚","by":"季札","line":"相見恨晚是遺憾太晚才認識，意思很接近！不過要找的成語，說的是「第一次見面就像老朋友」。"}],"hint":"「故」是老朋友。","after":"季札還提醒子產：「鄭國掌權的人太奢侈，恐怕要出亂子，到時候政事一定會交給你。你主政時，要用禮來謹慎治國。」","lesson":{"title":"互贈禮物的意義","text":"白絲帶是吳國的特產，在中原很珍貴；麻布衣是鄭國的特產。兩人互送家鄉的好東西，表示真心的友誼。《左傳》原文寫的是「如舊相識」，後人說成現在的成語。","next":"季札這趟旅程，還有一件讓他難忘的事：在魯國欣賞周朝的音樂……"}},{"id":"e28_05","yr":"西元前 544 年","place":"魯國都城曲阜","scene":"palace","music":"palace","cast":[["季札",-0.6,0.6],["樂工",1.6,-1.4],["樂工",2.6,-0.8],["舞者",0.4,-1.8],["魯大夫",2.6,1.2]],"beats":[{"t":"魯國保存了最完整的周朝音樂和舞蹈。季札一到魯國，就請求欣賞周樂。"},{"who":"季札","t":"可以讓我聽聽周朝的音樂嗎？"},{"t":"樂工唱起〈周南〉、〈召南〉，季札聽得入迷。","fx":[["cheerAll","樂工"]]},{"who":"季札","t":"美啊！從這音樂裡，聽得出百姓雖然辛勞，卻沒有怨言。","fx":[["focus","季札"]]},{"t":"接著是一首又一首的樂舞，季札每看一首，都能說出它的特色。","fx":[["cheer","舞者"]]},{"t":"最後，舞者跳起舜帝時代的〈韶箾〉。季札站起來，非常感動。","mv":[["舞者",0.0,-1.0]]},{"who":"季札","t":"德行到了極點了！就像天什麼都覆蓋、地什麼都承載。看到這裡就夠了！就算還有別的音樂，我也不敢再請求了！"}],"q":"季札看完〈韶箾〉，覺得好到極點，看到這裡就可以停止了。後來讚美看到的事物好到極點，是哪個成語？","wrong":[{"w":"不堪入目","by":"魯大夫","line":"不堪入目是難看得讓人看不下去。季札是好看到不用再看別的，剛好相反！"},{"w":"走馬看花","by":"樂工","line":"走馬看花是匆匆看過去。季札每一首都仔細欣賞，還說出心得呢！"},{"w":"美不勝收","by":"季札","line":"美不勝收是美好的東西太多，看都看不完，意思很接近！不過我是說好到極點、看到這裡就夠了。"}],"hint":"「止」是停止；看到這裡，就可以……","after":"季札來自南方的吳國，中原人原本以為那裡很落後，沒想到他這麼懂音樂，大家都很佩服。","lesson":{"title":"季札的路線","text":"其實按照《左傳》，季札這一趟是先到魯國，再到齊國、鄭國、衛國和晉國。季札在魯國聽音樂，就能說出各國的風氣，展現了深厚的學問。","next":"第二年，子產真的成了鄭國的執政。又過了一年，他陪著鄭國國君去拜訪晉國，卻遇到了一間很糟糕的賓館……"}},{"id":"e13_04","yr":"西元前 542 年","place":"晉國都城的賓館","scene":"palace","music":"map","cast":[["子產",-0.6,0.6],["隨從",1.4,-1.6],["隨從",2.4,-1.0],["士文伯",6.8,1.2]],"beats":[{"t":"子產陪著鄭國國君，帶了許多禮物到晉國拜訪。晉平公卻說魯國國君剛過世，不肯接見他們。"},{"t":"鄭國人住的賓館又小又破，大門窄得連車子都進不去。","fx":[["upset","子產"]]},{"who":"子產","t":"禮物放在外面，怕被偷，又怕淋雨受潮。把賓館的圍牆拆了，把車子拉進來！","fx":[["focus","子產"]]},{"t":"隨從們動手拆牆，把裝滿禮物的馬車拉進院子。","fx":[["prop","cart",2.0,-2.6,0],["cheerAll","隨從"]]},{"t":"晉國大夫士文伯聽說了，氣沖沖地跑來。","mv":[["士文伯",1.4,0.6]]},{"who":"士文伯","t":"我們修圍牆是為了保護賓客的安全，你把牆拆了，以後的客人怎麼辦？","fx":[["upset","士文伯"]]},{"who":"子產","t":"聽說晉文公當盟主時，自己的宮殿又矮又小，招待諸侯的賓館卻蓋得又高又大。客人一來，有人點火把、有人巡邏，車馬也有地方放。"}],"q":"子產說：當年在晉文公的賓館，客人就像回到自己家一樣，不怕盜賊，也不怕潮濕乾燥。後來形容主人招待得親切周到，是哪個成語？","wrong":[{"w":"喧賓奪主","by":"士文伯","line":"喧賓奪主是客人的聲勢蓋過主人。子產拆牆雖然大膽，可是他講的是當年怎麼招待客人呀！"},{"w":"反客為主","by":"隨從","line":"反客為主是客人反過來當主人。我們只是想讓馬車進門而已啦！"},{"w":"無微不至","by":"子產","line":"無微不至是照顧得非常細心，意思很接近！不過要找的成語，說的是「客人來了像回到家」。"}],"hint":"「賓」是客人，「歸」是回家。","after":"士文伯回去報告。晉國掌政的趙文子說：「子產說得對，是我們做得不好。」就派士文伯去向子產道歉。","lesson":{"title":"子產的外交","text":"晉平公後來隆重地接見了鄭國國君，還重新蓋了招待諸侯的賓館。晉國的叔向稱讚：子產很會說話，連諸侯都因此得到好處。","next":"這時候，晉平公又打起了攻打齊國的主意，先派了一個人去齊國打探……"}},{"id":"e36_06","yr":"約西元前 540 年","place":"齊國都城臨淄","scene":"palace","music":"palace","cast":[["齊景公",1.4,0.2],["晏子",2.6,1.2],["范昭",-6.8,1.0],["太師",3.2,-1.4]],"beats":[{"t":"晉平公想攻打齊國，派大夫范昭到齊國，看看齊國好不好打。齊景公擺了酒席招待他。","mv":[["范昭",-0.6,0.6]]},{"t":"喝到一半，范昭故意試探齊國的君臣。","fx":[["focus","范昭"]]},{"who":"范昭","t":"請把國君用過的酒杯，給我喝一杯吧！"},{"who":"齊景公","t":"好啊，拿給客人。","fx":[["say","齊景公"]]},{"who":"晏子","t":"把那個酒杯撤下，替客人換一個新的！","fx":[["upset","晏子"]]},{"t":"范昭又假裝喝醉，跳起舞來，要太師演奏只有周天子才能用的音樂。","fx":[["cheer","范昭"]]},{"who":"太師","t":"我沒有學過這種音樂，不能演奏。","fx":[["focus","太師"]]}],"q":"范昭回國說：「齊國不能打！」晉國就放棄了。據說孔子稱讚晏子：不必離開酒席，就打退了千里外的敵人。後來指用外交談判化解戰爭，是哪個成語？","wrong":[{"w":"兵臨城下","by":"范昭","line":"兵臨城下是敵軍已經打到城門口。晉國根本還沒出兵就打消主意了！"},{"w":"紙上談兵","by":"太師","line":"紙上談兵是只會空談打仗，那是戰國時代趙括的故事。晏子可是真的解決了問題！"},{"w":"運籌帷幄","by":"晏子","line":"運籌帷幄是在軍帳裡策劃作戰，意思有點接近！不過我是在酒席上靠外交退敵，要找的成語跟酒杯有關。"}],"hint":"「尊」是酒杯，「俎」是盛肉的器具，都是宴席上的東西。","after":"范昭對晉平公說：「我想試探齊君，被晏子識破；我想破壞齊國的禮樂，被太師看穿了。」","lesson":{"title":"《晏子春秋》","text":"這個故事出自《晏子春秋》，是後人收集晏子事蹟編成的書，有些故事不一定是真實的歷史紀錄。晏子這時候已經是齊國很有名望的大臣。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","key":"h05","title":"第五章．賢人輩出","eps":[9,13,23,28,36,38]},{"name":"名臣妙語","short":"春秋晚期","era":"西元前 538–518 年","color":"#B8733E","map":{"ground":"#b8c27c","river":"#4f9fd8"},"intro":{"lines":["春秋晚期，晉國的國君越來越沒有權力，楚國則出了一位野心很大的楚靈王。","周天子的地位更低了，諸侯連進貢都不太願意。","東方的齊國有一位聰明的宰相晏子，他身材矮小，卻常常用幾句話就化解難題。","這時候，魯國有一位年輕的老師正在四處學習，他就是孔子。","這一章，聽聽這些大臣和賢人說了哪些留傳兩千多年的話！"],"people":[["楚靈王","楚國國君，愛蓋大城、愛擺排場"],["晏子","齊國宰相，機智又關心百姓"],["齊景公","齊國國君，晏子輔佐他幾十年"],["孔子","魯國人，後來成為大教育家"]]},"stops":[{"id":"e39_07","yr":"西元前 538 年","place":"晉國王宮","scene":"palace","music":"palace","cast":[["晉平公",1.4,0.4],["司馬侯",2.8,1.4],["椒舉",-6.8,1.0],["大臣",0.0,-1.6]],"beats":[{"t":"楚靈王剛當上國君，就想召集各國諸侯到楚國開會，當大家的盟主。他派大夫椒舉到晉國商量。","mv":[["椒舉",-0.6,0.6]]},{"who":"椒舉","t":"我們大王希望晉國同意，讓各國諸侯都到楚國來會盟。"},{"t":"椒舉先退下等候。晉平公很不想答應。","mv":[["椒舉",-7.2,1.0]],"fx":[["upset","晉平公"]]},{"who":"晉平公","t":"晉國有三樣東西可以放心：地勢險要、好馬很多，齊國和楚國又災難不斷。我們怕誰？"},{"who":"司馬侯","t":"靠著險要和馬匹，又盼著鄰國出事，這三樣反而是危險啊！","fx":[["focus","司馬侯"]]},{"who":"司馬侯","t":"有的國家災難多，反而讓國家更穩固、土地更大；有的國家沒有災難，反而亡了國。齊國經過內亂才有了齊桓公，晉國經過內亂才有了晉文公。"}],"q":"司馬侯說：國家遇到很多災難，有時反而讓大家團結、讓國家興盛起來。後來用哪個成語表達這個意思？","wrong":[{"w":"國泰民安","by":"大臣","line":"國泰民安是國家太平、百姓安樂。司馬侯說的是災難很多的時候呀！"},{"w":"雪上加霜","by":"晉平公","line":"雪上加霜是倒楣的事一件接一件。司馬侯是說災難反而能讓國家變強，剛好相反！"},{"w":"塞翁失馬","by":"司馬侯","line":"塞翁失馬是壞事也可能變成好事，意思有點接近！不過要找的成語，說的是一個國家在困難中興盛起來。"}],"hint":"「興」是興盛，「邦」是國家。","after":"司馬侯又說：楚王如果暴虐，上天自然會懲罰他，不如先答應他。晉平公聽了，就答應了楚國。","lesson":{"title":"楚靈王的申之會","text":"這一年夏天，楚靈王在申地會合諸侯，當上了盟主。可是他很驕傲，對各國很不客氣，還到處攻打別國。","next":"後來，楚靈王滅了陳國和蔡國，在那裡蓋起又大又堅固的城……"}},{"id":"e39_01","yr":"西元前 531 年","place":"楚國都城郢","scene":"palace","music":"palace","cast":[["楚靈王",1.4,0.4],["申無宇",-6.8,1.0],["侍衛",2.8,1.4],["侍衛",0.0,-1.6]],"beats":[{"t":"楚靈王在陳、蔡、不羹蓋了好幾座大城，又派弟弟弃疾去當「蔡公」，管理蔡地。"},{"who":"楚靈王","t":"這些大城又高又堅固，誰敢來打楚國！","fx":[["cheer","楚靈王"]]},{"t":"楚靈王把大臣申無宇找來。","mv":[["申無宇",-0.6,0.6]]},{"who":"楚靈王","t":"你看，弃疾在蔡地怎麼樣？"},{"who":"申無宇","t":"臣聽說，太有權勢的人不該放在邊境。現在弃疾在外面，大王要小心啊！","fx":[["focus","申無宇"]]},{"who":"楚靈王","t":"那國家有這麼多大城，又怎麼樣呢？","fx":[["upset","楚靈王"]]},{"who":"申無宇","t":"樹梢太大，樹幹一定會折斷；動物的尾巴太大，就搖不動了。大王應該知道這個道理。"}],"q":"申無宇用「尾巴太大就搖不動」來提醒楚王：地方上的勢力太大，國君就難以指揮。後來比喻部下勢力太強、難以控制，是哪個成語？","wrong":[{"w":"虎頭蛇尾","by":"侍衛","line":"虎頭蛇尾是開頭很大、結尾很小。申無宇擔心的剛好是尾巴太大呀！"},{"w":"畫蛇添足","by":"楚靈王","line":"畫蛇添足是多做了沒必要的事。申無宇說的是尾巴太大，不是多畫了腳！"},{"w":"功高震主","by":"申無宇","line":"功高震主是部下功勞太大，讓國君害怕，意思有點接近！不過我用的比喻是動物的尾巴。"}],"hint":"「掉」在這裡是搖動、擺動，不是掉下來。","after":"楚靈王沒有把這番話放在心上。","lesson":{"title":"楚靈王的結局","text":"兩年後，楚靈王帶兵在外，弃疾等人趁機起兵。楚靈王身邊的人紛紛離開，最後他死在外地。弃疾當上國君，就是楚平王。申無宇的擔心應驗了。","next":"在楚靈王還在位的時候，齊國派晏子出使楚國。楚國人想趁機羞辱這位矮個子使者……"}},{"id":"e36_05","yr":"約西元前 530 年","place":"楚國王宮","scene":"palace","music":"palace","cast":[["楚王",1.4,0.2],["晏子",-6.8,1.0],["接待官",-2.2,-1.0],["侍衛",2.8,1.4]],"beats":[{"t":"齊國的晏子出使楚國。楚國人知道晏子個子矮，故意在大門旁邊開了一個小門，請他從小門進去。","mv":[["晏子",-1.2,0.4]]},{"who":"接待官","t":"晏大夫，請從這邊的小門進去。","fx":[["cheer","接待官"]]},{"who":"晏子","t":"出使狗國的人，才從狗門進去。我今天出使的是楚國，不應該走這個門吧？","fx":[["focus","晏子"]]},{"t":"接待官說不出話來，只好改請晏子從大門進去。","mv":[["晏子",0.0,0.8],["接待官",-2.8,-1.6]],"fx":[["sad","接待官"]]},{"who":"楚王","t":"齊國沒有人了嗎？怎麼派你這樣的人來當使者？","fx":[["upset","楚王"]]},{"who":"晏子","t":"齊國的首都臨淄有三百個里巷。大家張開袖子，就能遮住太陽；甩一把汗，就像下雨一樣。路上的人肩膀挨著肩膀、腳跟接著腳跟，怎麼會沒有人呢？"}],"q":"晏子說臨淄的人多到「肩膀挨著肩膀、腳跟接著腳跟」。後來形容人很多、非常擁擠，是哪個成語？","wrong":[{"w":"寥寥無幾","by":"楚王","line":"寥寥無幾是少得沒幾個。晏子說的是齊國人多得不得了！"},{"w":"門可羅雀","by":"接待官","line":"門可羅雀是門口冷清得可以張網抓麻雀。臨淄可是熱鬧滾滾呀！"},{"w":"揮汗成雨","by":"晏子","line":"揮汗成雨也是我這段話裡的，同樣形容人多，意思很接近！不過要找的是肩膀和腳跟那一句。"}],"hint":"「踵」是腳跟。","after":"晏子接著說：「齊國派使者有規矩：賢能的人出使賢能的國君，沒出息的人出使沒出息的國君。我最沒出息，所以被派到楚國來了。」楚王聽了，一句話也說不出來。","lesson":{"title":"晏子使楚","text":"這個故事出自《晏子春秋》，是後人編寫的，書裡沒有寫是哪一位楚王，一般認為是楚靈王。原文寫的是「比肩繼踵」，後人才說成現在的成語。","next":"這時候，周朝的天子也在為諸侯不進貢而煩惱。晉國的使者籍談來到了洛邑……"}},{"id":"e13_06","yr":"西元前 527 年","place":"周朝都城洛邑","scene":"palace","music":"palace","cast":[["周景王",1.4,0.2],["籍談",-0.4,0.8],["荀躒",-1.6,-0.4],["侍臣",2.8,1.4]],"beats":[{"t":"周天子的王后過世了，晉國派荀躒和籍談到洛邑參加喪禮。喪禮結束後，周景王請他們喝酒。"},{"t":"周景王指著桌上一個魯國送來的酒壺，問了起來。","fx":[["focus","周景王"]]},{"who":"周景王","t":"各國諸侯都有禮器獻給王室，為什麼只有晉國沒有呢？"},{"t":"荀躒向籍談作揖，請他來回答。","fx":[["say","荀躒"]]},{"who":"籍談","t":"諸侯受封時，都得到王室賞賜的寶器。晉國住在深山裡，和戎狄做鄰居，離王室很遠，從來沒得到過賞賜，哪有東西可以進獻呢？"},{"who":"周景王","t":"你忘了嗎？晉國的祖先唐叔，是周成王的親弟弟，怎麼會沒有賞賜？戰鼓、大車、鎧甲，都是王室送的！","fx":[["upset","周景王"]]},{"who":"周景王","t":"而且你的高祖孫伯黶，就是管理晉國典籍的官，所以你們家才姓「籍」。你是管典籍的後代，怎麼會忘了呢？","fx":[["sad","籍談"]]}],"q":"籍談答不出來。周景王說他談起國家的典章制度，卻忘了自己祖先的事。後來比喻忘本，是哪個成語？","wrong":[{"w":"飲水思源","by":"侍臣","line":"飲水思源是喝水時想到水從哪裡來，不忘本。周景王說的剛好相反！"},{"w":"光宗耀祖","by":"荀躒","line":"光宗耀祖是替祖先爭光。籍談這次可是讓祖先丟臉了……"},{"w":"忘恩負義","by":"籍談","line":"忘恩負義是忘了別人對自己的好，意思有點接近！不過天子說我的是忘了自己祖先的來歷。"}],"hint":"「數」讀ㄕㄨˇ，是一一說出；「典」是典籍、制度。","after":"客人走後，周景王說：「籍談恐怕不會有好的後代吧！」","lesson":{"title":"叔向的看法","text":"籍談回國把這件事告訴叔向。叔向卻說，周景王在服喪期間喝酒作樂，還向諸侯要禮器，自己也不守禮。這時候，周天子的威望已經大不如前了。","next":"東方的齊國，有一年冬天連下了三天大雪……"}},{"id":"e23_07","yr":"齊景公時","place":"齊國王宮","scene":"palace","music":"palace","cast":[["齊景公",1.4,0.2],["晏子",-6.8,1.0],["侍從",2.8,1.4]],"beats":[{"t":"這一年冬天，齊國連續下了三天大雪，一直沒有放晴。"},{"t":"齊景公穿著暖呼呼的白狐皮大衣，坐在大殿旁邊賞雪。","fx":[["cheer","齊景公"]]},{"t":"晏子進來拜見，站在一旁很久都沒說話。","mv":[["晏子",-0.4,0.6]]},{"who":"齊景公","t":"奇怪了！下了三天雪，天氣卻一點都不冷。"},{"who":"晏子","t":"天氣真的不冷嗎？","fx":[["focus","晏子"]]},{"t":"齊景公笑了笑，沒有回答。","fx":[["say","齊景公"]]},{"who":"晏子","t":"我聽說古代的好國君，自己吃飽了，會想到別人還在挨餓；自己穿暖了，會想到別人還在受凍；自己安逸了，會想到別人還在辛勞。現在您卻不知道啊！"}],"q":"晏子提醒齊景公：要從自己的感受，去想到別人的感受。後來形容用自己的心情去體會別人、進而幫助別人，是哪個成語？","wrong":[{"w":"自私自利","by":"侍從","line":"自私自利是只想到自己。晏子就是在提醒國君不要這樣呀！"},{"w":"隔岸觀火","by":"齊景公","line":"隔岸觀火是看著別人有難卻不幫忙。聽了晏子的話，我可不會這樣了！"},{"w":"設身處地","by":"晏子","line":"設身處地是把自己放在別人的處境想一想，意思很接近！不過要找的成語，還包括把自己的心意推廣到別人身上。"}],"hint":"「推」是推想，「及」是到達、照顧到。","after":"齊景公說：「說得好！我明白了。」立刻下令拿出皮衣、發放糧食，送給挨餓受凍的百姓。","lesson":{"title":"故事和成語的出處","text":"這個雪天的故事出自《晏子春秋》；成語本身則出自晉朝傅玄的《傅子》，說仁愛就是「推己以及人」。兩者相隔好幾百年，後人把它們連在一起。","next":"齊景公身邊還有三位力大無窮的勇士，其中一位叫古冶子，曾經在黃河急流裡救過國君……"}},{"id":"e36_04","yr":"齊景公時","place":"黃河砥柱山附近","scene":"river","music":"battle","cast":[["齊景公",-0.4,0.4],["古冶子",1.4,0.8],["船夫",2.8,1.6],["船夫",3.4,0.4]],"beats":[{"t":"齊景公身邊有三位勇士，都以打老虎出名。有一次，古冶子說起自己最大的功勞。"},{"t":"那一天，古冶子跟著齊景公渡黃河。突然，水裡冒出一隻大黿，咬住拉車的馬，把牠拖進砥柱山旁的急流！","fx":[["upset","齊景公"]]},{"who":"齊景公","t":"我的馬！"},{"who":"古冶子","t":"看我的！","mv":[["古冶子",7.6,-2.0]],"fx":[["focus","古冶子"]]},{"t":"古冶子年輕時不太會游泳，就潛到水底，逆著水流走了一百步，又順著水流追了九里，終於制伏大黿。"},{"t":"他左手抓著馬尾巴，右手提著大黿的頭，像白鶴一樣跳出水面！","mv":[["古冶子",1.0,0.0]],"fx":[["cheer","古冶子"],["burst","古冶子","#e8b84f"]]},{"who":"船夫","t":"是河神！河神出來了！","fx":[["cheerAll","船夫"]]}],"q":"黃河中央的砥柱山，不管激流怎麼沖，都穩穩地立著。後來比喻在困難中能撐住大局、擔當重任的人，是哪個成語？","wrong":[{"w":"隨波逐流","by":"船夫","line":"隨波逐流是跟著水流漂來漂去，沒有自己的主見。砥柱山可是一動也不動！"},{"w":"順水推舟","by":"齊景公","line":"順水推舟是順著情勢做事。砥柱山是在激流裡撐住，跟它剛好不同。"},{"w":"棟梁之材","by":"古冶子","line":"棟梁之材是能擔當大任的人才，意思很接近！不過要找的成語，強調在急流中屹立不倒。"}],"hint":"「砥柱」是黃河裡的一座山，「中流」是河流的中央。","after":"大家走近一看，原來是古冶子提著大黿的頭。這段話記在《晏子春秋》裡，是古冶子在「二桃殺三士」的故事中說的。","lesson":{"title":"二桃殺三士","text":"晏子覺得三位勇士太驕傲，勸齊景公送他們兩顆桃子，讓他們按功勞分。三人爭功又覺得羞愧，最後都失去了性命。砥柱山在今天河南三門峽附近，現在還立在黃河裡。","next":"這時候，魯國有一位年輕人，為了學習古代的禮儀，特地到周朝的都城去……"}},{"id":"e12_03","yr":"約西元前 518 年","place":"周朝太廟","scene":"palace","music":"final","cast":[["孔子",-6.8,1.0],["弟子",-7.4,1.8],["弟子",-7.6,0.2],["金人",1.4,-1.4]],"beats":[{"t":"孔子到周朝的都城洛邑學習禮儀。這一天，他帶著學生參觀周朝的太廟。","mv":[["孔子",-0.4,0.6],["弟子",-1.4,1.4],["弟子#2",0.6,1.4]]},{"t":"太廟右邊台階的前面，立著一座金屬鑄成的人像。","fx":[["focus","金人"]]},{"who":"弟子","t":"老師您看！這個金人的嘴巴，怎麼被封起來了？"},{"t":"仔細一看，金人的嘴巴被封了一道、兩道、三道！","fx":[["upset","弟子#2"]]},{"t":"金人的背上刻著字：「這是古代說話謹慎的人。小心啊！不要多說話，話多容易失敗；不要多管事，事多容易惹禍。」"},{"who":"孔子","t":"大家要記住！這些話雖然淺白，卻說中了做事的道理。","fx":[["focus","孔子"]]}],"q":"金人的嘴巴被封了三道，提醒大家說話要小心。後來形容說話非常謹慎，或是不肯開口說話，是哪個成語？","wrong":[{"w":"口若懸河","by":"弟子","line":"口若懸河是說話像瀑布一樣滔滔不停。金人的嘴巴可是封得緊緊的！"},{"w":"滔滔不絕","by":"弟子#2","line":"滔滔不絕是說個不停，剛好相反。這座金人一個字都不說呢！"},{"w":"守口如瓶","by":"孔子","line":"守口如瓶是嘴巴像瓶口一樣封緊，常指保守祕密，意思很接近！不過要找的成語，說的是嘴巴封了好幾道、說話謹慎。"}],"hint":"「緘」讀ㄐㄧㄢ，是封住的意思；封了幾道？","after":"這個故事記在漢朝劉向編的《說苑》裡，是後人流傳的說法。","lesson":{"title":"孔子適周","text":"相傳孔子到周朝時，還向老子請教過禮儀，不過年代說法不一。孔子後來回到魯國教書，收了很多學生，成為中國最有名的教育家。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"line":"history","key":"h06","title":"第六章．名臣妙語","eps":[12,13,23,36,39]},{"key":"h07","line":"history","name":"春秋尾聲","short":"春秋末年","era":"西元前 512–470 年","color":"#B5332E","map":{"ground":"#b8c47e","river":"#4f9fd8"},"intro":{"lines":["春秋時代快要結束了，南方的吳國突然強大起來，和楚國、越國爭霸。","吳王闔廬重用兵法家孫武和楚國來的伍子胥，一路打進楚國的首都。","北方的魯國，出了一位大老師——孔子。他帶著學生周遊列國，晚年回家教書、整理古書。","這一章，我們要看兵法家、神醫和孔子師徒，留下了哪些成語！"],"people":[["孫武","兵法家，寫了《孫子兵法》"],["伍子胥","楚國人，為了報家仇投奔吳國"],["孔子","大教育家，周遊列國十四年"],["曾子","孔子的學生，非常重視誠信"]]},"stops":[{"id":"e22_01","yr":"約西元前 512 年","place":"吳國王宮","scene":"palace","music":"palace","cast":[["吳王",2.4,-0.6],["孫武",-6.5,1.2],["寵姬",-1.6,-0.4],["寵姬",1.0,0.2],["宮女",-2.2,0.6],["宮女",-0.8,1.0],["宮女",0.4,1.2]],"beats":[{"t":"齊國人孫武寫了十三篇兵法，帶去見吳王闔廬。吳王讀完，想試試他的本事。","mv":[["孫武",-0.4,-1.4]]},{"who":"吳王","t":"你的兵法，能不能用宮女來試試看？","fx":[["focus","吳王"]]},{"t":"孫武把一百八十位宮女分成兩隊，讓吳王最寵愛的兩位妃子當隊長。","fx":[["cheerAll","宮女"]]},{"who":"孫武","t":"聽鼓聲：向前看胸口，向左看左手，向右看右手，向後看背後。聽清楚了嗎？"},{"t":"孫武把號令說了一遍又一遍，又擺出代表軍法的大斧。可是鼓聲一響，宮女們卻哈哈大笑。","fx":[["cheer","寵姬"],["cheer","寵姬#2"]]},{"who":"孫武","t":"規定說得不清楚，是將領的錯。我再說一次！"},{"t":"孫武又把號令詳細講了好幾遍，再打鼓——宮女們還是笑成一團！","fx":[["cheerAll","宮女"],["upset","孫武"]]}],"q":"孫武一次又一次下命令、反覆說明告誡，強調一定要遵守。這種「再三命令、反覆叮嚀」，叫做什麼？","wrong":[{"w":"朝令夕改","by":"吳王","line":"朝令夕改是早上下的命令晚上就改。孫武的號令可是一個字都沒改過！"},{"w":"嘻皮笑臉","by":"宮女","line":"嘻皮笑臉是我們剛剛的樣子……可不是孫將軍做的事啦！"},{"w":"耳提面命","by":"孫武","line":"耳提面命是拉著耳朵當面教導，意思有點接近！不過我是對全隊一再下令、強調軍紀，有更貼切的成語。"}],"hint":"成語裡有兩個數字；「申」是說明、告誡的意思。","after":"孫武說：「已經說清楚了還不照做，就是隊長的錯！」他依軍法處置了兩位隊長，換人再打鼓，宮女們前後左右、跪下起立都整整齊齊，沒人敢出聲。","lesson":{"title":"孫子兵法","text":"吳王雖然心疼，卻知道孫武真的會帶兵，就讓他當將軍。後來吳國向西打敗強大的楚國，孫武出了很大的力。他寫的《孫子兵法》，到現在全世界都還有人研究。","next":"就在第二年，北邊的魯國收留了一位從鄰國逃來的大夫……"}},{"id":"e28_02","yr":"西元前 511 年","place":"魯國","scene":"office","music":"palace","cast":[["黑肱",-6.5,1.0],["史官",0.2,-1.0],["大夫",2.4,0.8]],"beats":[{"t":"邾國是魯國旁邊的小國。邾國的大夫黑肱，帶著自己管理的「濫」這塊土地，跑來投奔魯國。","mv":[["黑肱",-1.2,0.6]]},{"who":"黑肱","t":"我只是個小人物，沒人會注意我。在魯國安安靜靜過日子就好。"},{"t":"魯國的史官負責把國家大事寫進歷史書《春秋》。照規矩，地位低的人來投奔，通常不寫名字。","fx":[["focus","史官"]]},{"who":"史官","t":"可是他是帶著土地背叛自己的國家，這是大事！一定要寫下他的名字和地名。","fx":[["say","史官"]]},{"t":"於是《春秋》上清清楚楚寫著：「邾黑肱以濫來奔。」","fx":[["upset","黑肱"]]},{"who":"大夫","t":"你看，連小人物的名字都被記下來了，以後的人都會知道！"}],"q":"寫《左傳》的人評論說：「有人想出名卻得不到，有人想遮掩，名字反而更明顯。」黑肱想悄悄躲起來，結果更多人知道他。這叫做什麼？","wrong":[{"w":"默默無聞","by":"黑肱","line":"默默無聞是沒沒無名、沒人知道。那是我原本的願望，結果剛好相反啦！"},{"w":"名揚四海","by":"史官","line":"名揚四海是好名聲傳遍天下。他傳開的，可不是什麼好名聲喔！"},{"w":"弄巧成拙","by":"大夫","line":"弄巧成拙是想耍聰明反而壞了事，意思有點接近！不過「想遮掩，反而更明顯」，有一個專門的成語。"}],"hint":"「蓋」是遮蓋；後兩個字的意思是「更加明顯」。","after":"原文是「欲蓋而名章」，「章」就是「彰」，明顯的意思。","lesson":{"title":"春秋筆法","text":"《春秋》是魯國的歷史書，相傳孔子整理過。它用字非常講究，有時一個字就表示稱讚或批評，叫做「春秋筆法」。所以做壞事的人，就算想躲，也會被記下來。","next":"幾年後，吳國大軍攻進了楚國首都。帶兵的人裡，有一位和楚王有深仇大恨……"}},{"id":"e41_01","yr":"西元前 506 年","place":"楚國郢都","scene":"walls","music":"battle","cast":[["伍子胥",-6.5,1.0],["吳兵",-7.2,0.2],["吳兵",-7.6,1.8],["吳兵",-8.2,0.9],["使者",7.0,1.2]],"beats":[{"t":"伍子胥是楚國人。他的父親和哥哥被楚平王害死，他只好逃到吳國。"},{"t":"逃走前，他對好朋友申包胥說：「我一定要滅掉楚國！」申包胥回答：「那我一定要保住楚國！」"},{"t":"十幾年後，伍子胥帶著吳軍打進楚國首都郢。楚昭王逃走了，楚平王也早就過世。","mv":[["伍子胥",-0.8,0.2],["吳兵",0.6,-0.6],["吳兵#2",1.6,0.8],["吳兵#3",-1.8,-1.2]],"fx":[["cheerAll","吳兵"]]},{"who":"伍子胥","t":"我要報仇！","fx":[["upset","伍子胥"]]},{"t":"伍子胥竟然挖開楚平王的墳墓出氣。躲在山裡的申包胥聽說了，派人來傳話。","mv":[["使者",1.8,0.4]]},{"who":"使者","t":"申包胥說：你這樣報仇，太過分了吧！"},{"who":"伍子胥","t":"替我告訴申包胥：我就像太陽快下山、路卻還很遠的旅人……","fx":[["focus","伍子胥"]]}],"q":"伍子胥接著說：「所以我只好倒著走、反著做，顧不了常理了。」這句話變成哪個成語？現在用來形容做事違反情理。","wrong":[{"w":"循規蹈矩","by":"使者","line":"循規蹈矩是乖乖遵守規矩。他剛好相反，完全不管常理啊！"},{"w":"衣錦還鄉","by":"伍子胥","line":"衣錦還鄉是當了大官、風風光光回老家。我是回到老家楚國沒錯，但我是帶兵來報仇的！"},{"w":"胡作非為","by":"使者","line":"胡作非為是不管是非亂做壞事，意思接近現在的用法！不過伍子胥說「倒著走、反著做」，有一個專門的成語。"}],"hint":"「倒」是倒過來，「逆」是反方向。","after":"申包胥跑到秦國求救，在秦國朝廷外哭了七天七夜。秦哀公被感動了，派兵救楚。","lesson":{"title":"秦庭之哭","text":"秦軍趕來救楚，吳國國內又發生內亂，吳軍只好撤回去，楚國保住了。伍子胥報了家仇，申包胥保住了國家，兩個好朋友都做到了當年說的話。","next":"這個時代，還流傳著一位到處行醫的神醫故事，他的名字叫扁鵲……"}},{"id":"e29_06","yr":"春秋時代（年代說法不一）","place":"虢國宮門","scene":"palace","music":"palace","cast":[["扁鵲",-6.5,1.2],["子陽",-7.4,1.8],["中庶子",1.4,0.6],["虢君",2.6,-0.8],["太子",0.4,-1.6,0,1,1]],"beats":[{"t":"名醫扁鵲帶著學生子陽到處看病。這天經過虢國，聽說虢國太子突然死了，宮裡正準備辦喪事。","mv":[["扁鵲",-1.0,0.6],["子陽",-1.8,1.4]]},{"who":"扁鵲","t":"太子是什麼時候倒下的？已經入殮了嗎？"},{"who":"中庶子","t":"雞叫的時候倒下的，到現在還不到半天，還沒有入殮。","fx":[["sad","中庶子"]]},{"who":"扁鵲","t":"太子是昏死過去，還有救！請讓我試試。","fx":[["focus","扁鵲"]]},{"t":"扁鵲叫子陽磨好針，在太子身上扎針，再用藥熱敷。過了一會兒，太子醒了！","mv":[["太子",0.4,-0.6]],"fx":[["say","子陽"]]},{"t":"又調養了一陣子，太子竟然能坐起來，恢復健康了。","fx":[["cheer","虢君"],["cheer","太子"]]},{"who":"虢君","t":"神醫啊！連死去的人都能救活！"}],"q":"大家都說扁鵲能讓已經「死去」的人重新活過來。後來比喻醫術高明，或把沒希望的情況救回來，叫做什麼？","wrong":[{"w":"病入膏肓","by":"中庶子","line":"病入膏肓是病重到沒救了。可是我們太子被救回來了呀！"},{"w":"手忙腳亂","by":"子陽","line":"手忙腳亂是慌慌張張。我們師父看病可是不慌不忙的！"},{"w":"妙手回春","by":"虢君","line":"妙手回春是稱讚醫生醫術高明，意思很接近！不過大家說的是讓「死去」的人重新活過來，有一個專門的成語。"}],"hint":"四個字裡，有「死」也有「生」。","after":"扁鵲卻很謙虛：「我不能讓死人復活。太子本來就還能活，我只是讓他起來而已。」","lesson":{"title":"神醫扁鵲","text":"扁鵲本名秦越人。《史記》記載他的故事，時間橫跨好幾百年，所以很多學者認為，「扁鵲」可能是古人對神醫的稱呼，故事裡也有不少傳說成分。","next":"這時候，魯國的孔子帶著學生周遊列國，來到了衛國……"}},{"id":"e41_02","yr":"約西元前 495 年","place":"衛國市集","scene":"palace","music":"map","cast":[["衛靈公",-6.5,-0.4],["南子夫人",-7.2,0.2],["雍渠",-7.8,-0.6],["孔子",-8.4,1.4],["百姓",2.6,1.4],["百姓",3.4,0.4],["百姓",1.6,1.8]],"beats":[{"t":"孔子帶著學生周遊列國，來到衛國。衛靈公的夫人南子派人來說：「我想見見孔夫子。」"},{"t":"孔子本來推辭，最後不得已才去見她。孔子在衛國住了一個多月。"},{"t":"有一天，衛靈公和南子坐在前面的車上，宦官雍渠陪坐，叫孔子坐後面的車，一起出門。","fx":[["prop","cart",-4.4,-0.6,0],["prop","cart",-5.6,1.2,0]]},{"who":"衛靈公","t":"走！到熱鬧的市場繞一圈！","mv":[["衛靈公",-0.6,-0.6],["南子夫人",0.2,-0.2],["雍渠",-1.4,-0.8],["孔子",-1.4,1.2]],"fx":[["cheer","衛靈公"]]},{"t":"車隊大張旗鼓地經過市場，大家都跑來看熱鬧。","fx":[["cheerAll","百姓"]]},{"who":"百姓","t":"快看！是國君和夫人！後面那位是孔夫子耶！"},{"who":"孔子","t":"唉……","fx":[["sad","孔子"]]}],"q":"衛靈公故意帶著孔子，在人最多的市場大搖大擺地經過，讓大家都注意到他們。這種故意在熱鬧地方張揚、炫耀的樣子，叫做什麼？","wrong":[{"w":"深居簡出","by":"雍渠","line":"深居簡出是待在家裡很少出門。我們國君今天可是專挑人多的地方走！"},{"w":"走馬看花","by":"百姓","line":"走馬看花是匆匆看一眼就走。這車隊是故意慢慢經過，讓我們看個夠！"},{"w":"大搖大擺","by":"孔子","line":"大搖大擺是走路神氣的樣子，意思有點接近！不過故意在「市場」張揚、引人注意，有一個專門的成語。"}],"hint":"「招搖」是故意張揚，「市」是市場。","after":"孔子說：「我從沒見過喜歡品德，像喜歡美色一樣的人。」他覺得很羞恥，就離開衛國，到曹國去了。","lesson":{"title":"周遊列國","text":"孔子五十多歲離開魯國，帶著學生到衛、陳、蔡、宋、楚等國，前後大約十四年，希望有國君採用他的主張。可惜沒有國君真正重用他。","next":"晚年的孔子回到魯國，專心教學生、整理古書，特別愛讀一本書……"}},{"id":"e07_06","yr":"孔子晚年（約西元前 484 年後）","place":"魯國孔子家","scene":"study","music":"night","cast":[["孔子",-1.2,-1.6],["學生",6.5,0.8]],"beats":[{"t":"古時候還沒有紙，書是「竹簡」：把字寫在一片片竹片上，再用熟牛皮做的繩子串起來。"},{"t":"孔子回到魯國時，已經快七十歲了。他非常喜歡讀《易經》，讀了一遍又一遍。","fx":[["focus","孔子"]]},{"who":"孔子","t":"越讀越有味道！","fx":[["cheer","孔子"]]},{"t":"啪！串竹簡的皮繩斷了，竹片散了一桌。","fx":[["upset","孔子"]]},{"who":"學生","t":"老師，皮繩又斷了！我來幫您綁好。","mv":[["學生",0.4,-1.2]]},{"t":"綁好了又讀，讀到又斷，皮繩斷了好多次。","fx":[["say","孔子"]]},{"who":"孔子","t":"再給我幾年的時間，我就能把《易經》讀通了！"}],"q":"孔子讀《易經》讀到串竹簡的牛皮繩斷了好幾次。後來用哪個成語，形容讀書非常勤奮、一讀再讀？","wrong":[{"w":"不求甚解","by":"學生","line":"不求甚解是讀書只求懂個大概。老師可是讀到皮繩都斷了！"},{"w":"半途而廢","by":"孔子","line":"半途而廢是做到一半就放棄。我繩子斷了就綁好，繼續讀呀！"},{"w":"手不釋卷","by":"學生","line":"手不釋卷是書不離手，形容很用功，意思很接近！不過「讀到皮繩斷了好幾次」，有一個專門的成語。"}],"hint":"第一個字是熟牛皮繩，「絕」是斷掉；「三」表示很多次。","after":"「韋」是熟牛皮做的繩子，「三」不一定剛好三次，是說斷了很多次。","lesson":{"title":"至聖先師","text":"孔子一生教了很多學生，主張「有教無類」，不分貧富都肯教。他和學生的對話被記成《論語》。後人尊稱他「至聖先師」，臺灣的教師節就訂在孔子誕辰 9 月 28 日。","next":"孔子的學生裡，有一位非常重視誠信的曾子。有一天，他的太太要去市場……"}},{"id":"e09_03","yr":"春秋末年","place":"曾子家","scene":"house","music":"map","cast":[["曾子",1.6,-0.4],["夫人",-0.6,0.4],["兒子",0.2,1.0],["豬",2.6,-1.6,0,1]],"beats":[{"t":"曾子的太太準備去市場，兒子哭著拉住她，吵著要一起去。","fx":[["sad","兒子"]]},{"who":"夫人","t":"乖，你先回家。等我回來，殺豬給你吃！","mv":[["夫人",7.0,1.0]]},{"t":"太太從市場回來，看見曾子正拿著繩子，要去抓豬。","mv":[["夫人",0.6,0.6],["曾子",2.0,-1.0]],"fx":[["focus","豬"]]},{"who":"夫人","t":"你在做什麼？我只是跟孩子開玩笑的，別當真！","fx":[["upset","夫人"]]},{"who":"曾子","t":"不能跟孩子開這種玩笑。小孩子什麼都還不懂，都是跟著父母學的。"},{"who":"曾子","t":"你今天騙他，就是教他騙人。媽媽騙孩子，孩子以後就不相信媽媽了。","fx":[["say","曾子"]]},{"t":"曾子真的把豬殺了，煮給孩子吃。","fx":[["cheer","兒子"]]}],"q":"曾子為了不讓孩子學會說謊，真的殺了豬，兌現太太的承諾。古時候豬叫做「彘」。這個故事變成哪個成語？","wrong":[{"w":"言而無信","by":"曾子","line":"言而無信是說話不算話——這正是我不想教給孩子的！"},{"w":"殺雞取卵","by":"兒子","line":"殺雞取卵是只顧眼前好處、斷了以後的收穫。爸爸殺豬是為了守信用啦！"},{"w":"一諾千金","by":"夫人","line":"一諾千金是說承諾很有分量，意思很接近！不過「父母真的殺豬、用行動教孩子守信」，有一個專門的成語。"}],"hint":"主角是誰？他對豬做了什麼？（豬＝彘）","after":"孩子吃到了豬肉，也從爸爸身上學到：說出口的話，一定要做到。","lesson":{"title":"曾子與誠信","text":"曾子名參，是孔子晚年的學生，以孝順和每天反省出名，「吾日三省吾身」就是他說的。這個故事記在戰國末年的《韓非子》裡，離曾子已經兩百多年，是流傳下來的故事。","next":"可是同一時期的魯國朝廷裡，有些大臣說話卻常常不算話……"}},{"id":"e09_08","yr":"西元前 470 年","place":"魯國五梧","scene":"palace","music":"palace","cast":[["魯哀公",-0.2,-0.6],["郭重",1.4,0.2],["孟武伯",-6.5,1.2],["季孫",6.5,1.4]],"beats":[{"t":"春秋末年，魯國的大權掌握在季孫、孟孫等幾家大夫手裡，國君魯哀公和他們處得很不好。"},{"t":"魯哀公從越國回來，替他駕車的是胖胖的郭重。","fx":[["focus","郭重"]]},{"who":"郭重","t":"大王，那些大臣在背後說了您很多壞話。"},{"t":"魯哀公在五梧擺宴會，大臣們都來了。孟武伯負責敬酒，他一向討厭郭重。","mv":[["孟武伯",-1.4,0.6],["季孫",2.6,1.0]]},{"who":"孟武伯","t":"郭重啊，你怎麼這麼胖啊？","fx":[["cheer","孟武伯"]]},{"who":"魯哀公","t":"他呀，說過的話吞回去太多次了，怎麼能不胖呢？","fx":[["say","魯哀公"],["upset","孟武伯"]]}],"q":"魯哀公說郭重「把說過的話吃下去太多，所以變胖」，其實是在諷刺孟武伯常常說話不算話。後來用哪個成語，形容不守信用？","wrong":[{"w":"心寬體胖","by":"郭重","line":"我是心寬體胖沒錯！不過心寬體胖是心情開朗、身體舒坦，大王說的胖可不是這個意思。"},{"w":"守口如瓶","by":"孟武伯","line":"守口如瓶是保守秘密、不亂說話。大王在說我……說話不算話啦。"},{"w":"出爾反爾","by":"季孫","line":"出爾反爾是說了又反悔，意思很接近！不過大王用「把話吃下去變胖」來諷刺，有一個專門的成語。"}],"hint":"把說出口的話「吃」回去，就是不守信用。","after":"宴會上大家都很尷尬，酒喝得一點也不愉快。從此魯哀公和大夫們的關係更差了。","lesson":{"title":"三桓專權","text":"當時魯國的大權在季孫、孟孫、叔孫三家大夫手裡，叫做「三桓」，國君反而沒什麼權力。兩年後，魯哀公想借外國的力量對付三桓，失敗後被迫離開魯國。","next":"這一章完成了！回到地圖，挑戰終點吧。"}}],"title":"第七章．春秋尾聲","eps":[7,9,22,28,29,41]},{"key":"ch3","short":"春秋戰國","era":"西元前 770–221 年","color":"#8A6BC0","map":{"ground":"#b5c27a","river":"#4f9fd8"},"intro":{"lines":["周朝把土地分給親戚和功臣，建立了許多諸侯國。","西元前 770 年，周平王把首都遷到東邊的洛邑，周天子的力量越來越弱，歷史上叫做「東周」。","東周的前半段叫「春秋」：強大的諸侯輪流當「霸主」，像齊桓公、晉文公、楚莊王。","後半段叫「戰國」：最後剩下秦、楚、齊、燕、韓、趙、魏七個大國，互相攻打。","西元前 221 年，秦國統一天下。這五百多年的歷史，留下了好多好多成語！"],"people":[["齊桓公","春秋第一位霸主，重用管仲"],["晉文公","名叫重耳，流亡十九年才回國"],["越王句踐","打了敗仗，發憤圖強"],["藺相如","趙國大臣，勇敢又機智"]]},"stops":[{"id":"e13_01","yr":"西元前 684 年","place":"長勺","scene":"valley","music":"battle","cast":[["魯莊公",-2.3,-0.6,0.25],["曹劌",-6.5,1],["魯兵",-3.3,-1.6,0.25],["魯兵",-1.6,-1.8,0.25],["齊兵",6.6,-3.4,0.25],["齊兵",7.6,-2.6,0.25],["齊兵",5.8,-4.2,0.25]],"beats":[{"t":"春秋初年，齊國和魯國是鄰居，卻常常打仗。這一年，強大的齊國派兵攻打魯國。","mv":[["齊兵",2.3,-0.6],["齊兵#2",3.3,-1.6],["齊兵#3",1.6,-1.8]]},{"t":"魯國有一個平民叫曹劌，他請求見魯莊公，陪著國君一起上戰場。","mv":[["曹劌",-3.2,0.2]]},{"t":"兩軍在長勺擺好陣勢。齊軍先打起戰鼓，準備衝鋒。","fx":[["cheerAll","齊兵"]]},{"who":"魯莊公","t":"快！我們也打鼓，衝上去！"},{"who":"曹劌","t":"還不可以。","fx":[["focus","曹劌"]]},{"t":"齊軍打了第二次鼓、第三次鼓，魯軍都按兵不動。齊兵喊得越來越沒力氣。","fx":[["sadAll","齊兵"]]},{"who":"曹劌","t":"現在可以打鼓了！","fx":[["cheerAll","魯兵"],["burst","曹劌"]]},{"t":"魯軍一鼓作勢衝上去，齊軍大敗逃走。","mv":[["齊兵",5.6,-2.6],["齊兵#2",6.8,-3.6],["齊兵#3",5,-4.2]]}],"q":"打勝仗後，魯莊公問原因。曹劌說：「打仗靠的是勇氣。第一次打鼓勇氣最足，第二次就減弱，第三次就用光了。」這段話變成哪個成語？","wrong":[{"w":"按部就班","by":"魯莊公","line":"按部就班是照著順序一步步做。曹劌說的是勇氣，第一次打鼓時最足！"},{"w":"鑼鼓喧天","by":"曹劌","line":"鑼鼓喧天是熱鬧得不得了。我說的是第一次打鼓時，士兵的勇氣最旺盛。"},{"w":"再接再厲","by":"曹劌","line":"再接再厲是一次又一次繼續努力。可是我說打第二次鼓，勇氣就衰退了，剛好相反喔！"}],"hint":"「作」是振作，「氣」是士氣。","after":"曹劌又說：「我看到齊軍的車輪痕跡亂了、旗子倒了，才確定他們是真的逃跑，不是假裝的。」","lesson":{"title":"長勺之戰","text":"長勺之戰是歷史上有名的以弱勝強。曹劌出身平民，卻說「當官的人眼光短淺，不能深謀遠慮」，自己挺身而出。這段故事記在《左傳》，後人叫它〈曹劌論戰〉。","next":"被打敗的齊國沒有一蹶不振。齊桓公重用管仲，很快就成為春秋第一位霸主……"}},{"id":"e04_04","yr":"西元前 663 年","place":"孤竹國歸途","scene":"road","music":"map","cast":[["齊桓公",0.2,0.4],["管仲",-1.1,0.9],["隰朋",1.4,1.4],["齊兵",2.4,0.2],["齊兵",3.1,1.3],["老馬",1.8,-1.2,0,1]],"beats":[{"t":"齊桓公在管仲的輔佐下，國家越來越強大。北方的山戎侵犯燕國，齊桓公帶兵救燕，一路打到孤竹國。"},{"t":"大軍春天出發，冬天才回來。回程時四周一片荒涼，大家迷路了。","fx":[["sadAll","齊兵"]]},{"who":"齊桓公","t":"這裡是哪裡？往哪邊走才對？","fx":[["upset","齊桓公"]]},{"t":"管仲想了想，叫人把幾匹老馬的韁繩放開。","fx":[["focus","老馬"]]},{"who":"管仲","t":"老馬的智慧，可以派上用場！"},{"t":"大家跟在老馬後面走。","mv":[["老馬",-3.6,-2],["齊桓公",-2,-1],["管仲",-3,0],["隰朋",-1,0.2],["齊兵",-0.2,-0.8],["齊兵#2",0.6,0.4]]},{"t":"走著走著，熟悉的道路出現了。老馬果然帶著大家，找到回家的路！","fx":[["cheerAll","齊兵"]]}],"q":"管仲知道老馬認得路，靠牠們帶大家走出困境。後來比喻有經驗的人能帶領大家，叫做什麼？","wrong":[{"w":"馬到成功","by":"隰朋","line":"馬到成功是一開始就成功。我們可是迷路了好久，才靠老馬找到路！"},{"w":"走馬看花","by":"齊桓公","line":"走馬看花是匆匆看過去。我們急著找路，哪有心情看花？"},{"w":"見多識廣","by":"管仲","line":"見多識廣是見過很多世面，意思有點接近！不過這個故事的主角是老馬，有一個專門的成語。"}],"hint":"「途」是道路，「識」是認得。","after":"後來在山裡找不到水，隰朋說螞蟻冬天住在山的南面、夏天住在山的北面。挖開螞蟻窩下面，果然找到了水。","lesson":{"title":"尊王攘夷","text":"齊桓公打著「尊王攘夷」的旗號——尊重周天子、抵抗外族——幫助燕國、衛國等小國，成為春秋第一位霸主。孔子稱讚管仲：如果沒有管仲，我們恐怕都要披頭散髮、穿外族的衣服了。","next":"這時候，晉國的公子重耳因為宮廷內亂，被迫逃出國，開始了漫長的流亡……"}},{"id":"e09_06","yr":"約西元前 637 年","place":"楚國王宮","scene":"palace","music":"palace","cast":[["重耳",-6.5,1.2],["楚成王",1.4,0.6],["子玉",2.8,1.5]],"beats":[{"t":"晉國公子重耳逃出晉國，在外面流亡了十九年。"},{"t":"他走過狄、衛、齊、曹、宋、鄭等國家，有人熱情招待，也有人看不起他。"},{"t":"來到楚國時，楚成王用招待國君的禮節，隆重地招待他。","mv":[["重耳",-1.1,0.6]]},{"who":"楚成王","t":"公子如果回到晉國，要怎麼報答我？"},{"who":"重耳","t":"美女、寶玉、絲綢，大王都有了；珍貴的鳥羽、象牙、皮革，也都是楚國出產的。我拿什麼報答您呢？"},{"who":"楚成王","t":"話雖這麼說，總要有點表示吧？","fx":[["focus","重耳"]]}],"q":"重耳說：「將來如果晉楚兩國打仗，我會先讓軍隊後退九十里。」這個承諾變成哪個成語？","wrong":[{"w":"節節敗退","by":"楚成王","line":"節節敗退是打輸了一路後退。他說的是主動讓路，報答我的恩情！"},{"w":"三顧茅廬","by":"楚成王","line":"三顧茅廬是劉備請諸葛亮，那是好幾百年以後的事了！"},{"w":"知難而退","by":"重耳","line":"知難而退是知道困難就退出。我是為了報恩，主動退讓九十里，有更貼切的成語！"}],"hint":"古代軍隊走三十里叫「一舍」。","after":"楚國大將子玉聽了很生氣，想殺掉重耳，楚成王卻沒有答應。","lesson":{"title":"城濮之戰","text":"重耳回到晉國當上國君，就是晉文公。西元前 632 年，晉楚兩軍在城濮相遇，晉文公真的下令退兵九十里。楚將子玉卻緊追不放，結果大敗。晉文公成為新的霸主。","next":"又過了二十年，楚國出了一位很特別的國王，
